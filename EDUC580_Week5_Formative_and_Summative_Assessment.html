<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDUC 580 Week 5 · Formative and Summative Assessment</title><style>:root{--navy:#1d3557;--navy2:#274c77;--teal:#2a9d8f;--gold:#e9a820;--coral:#e76f51;--ink:#1f2933;--mute:#52606d;--bg:#f3f6fa;--card:#fff;--line:#d5dee8;--ok:#1a7f45;--okbg:#e5f6ec;--bad:#b3422b;--badbg:#fdece6;--blue:#2f6fb5;--bluebg:#e6f0fb;}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.45}
.app{height:100%;display:flex;flex-direction:column}
.hero{flex:none;display:flex;align-items:center;gap:16px;padding:8px 20px;background:linear-gradient(115deg,var(--navy),var(--navy2) 60%,#2a6f8f);color:#fff}
.hero .bn{flex:none;width:150px;height:66px}.hero .bn svg{width:100%;height:100%;display:block}
.kick{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#f6d98a;font-weight:600}
.hero h1{margin:1px 0 2px;font-size:22px;line-height:1.15}
.hero p{margin:0;font-size:13.5px;color:#dbe7f3}
.steps{flex:none;display:flex;gap:6px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
.pill{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font:inherit;font-size:13px;color:var(--mute);cursor:pointer;text-align:left}
.pill .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--navy);font-weight:700;font-size:12px;display:grid;place-items:center}
.pill .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.on{border-color:var(--navy);color:var(--navy);font-weight:600;background:#eef3fa}
.pill.on .n{background:var(--navy);color:#fff}
.pill.done .n{background:var(--ok);color:#fff}
main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:16px 22px 20px;scrollbar-width:thin}
main:focus{outline:none}
.panel{display:none;max-width:980px;margin:0 auto;animation:fade .25s ease}
.panel.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 18px;background:#fff;border-top:1px solid var(--line)}
.bar span{font-size:13px;color:var(--mute)}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:8px 16px;background:var(--navy);color:#fff;cursor:pointer}
.btn.alt{background:#e8eef5;color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.12)}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
h3{margin:0 0 6px;font-size:16px;color:var(--navy)}
.lead{margin:0 0 12px;color:var(--mute)}
.callout{display:flex;gap:10px;align-items:flex-start;background:#fff8e6;border:1px solid #f1d58a;border-left:5px solid var(--gold);border-radius:8px;padding:9px 12px;margin:0 0 12px;font-size:14px}
.callout b{color:#7a5600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kid{position:relative;display:flex;gap:10px;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.kid:hover{border-color:#9db7d5}
.kid.sel{border-color:var(--teal);background:#effaf8;box-shadow:0 0 0 3px rgba(42,157,143,.2)}
.kid .av{flex:none;width:64px;height:64px}.kid .av svg{width:64px;height:64px}
.kid h4{margin:0 0 2px;font-size:15px;color:var(--navy)}
.kid p{margin:0;font-size:12.5px;color:var(--mute);line-height:1.35}
.kid .chk{position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;background:#fff}
.kid.sel .chk{background:var(--teal);border-color:var(--teal)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-bottom:3px;background:#e8eef5;color:var(--navy)}
.tag.el{background:#fde8d0;color:#8a4b08}.tag.sn{background:#e3e6fb;color:#363f9a}.tag.ot{background:#e0f3ee;color:#1c6b5f}.tag.no{background:#eceff1;color:#455a64}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.qp{margin:0 0 8px;font-weight:600}
.opts{display:grid;gap:7px}
.opt{font:inherit;text-align:left;background:#f7f9fc;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--navy2);background:#eef3fa}
.opt.good{border-color:var(--ok);background:var(--okbg);color:#0f4d2a;font-weight:600}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:#7c2a19}
.opt:disabled{cursor:default}.opt:disabled:not(.good):not(.bad){opacity:.55}
.fb,.cnote{display:none;margin-top:8px;border-radius:8px;padding:8px 11px;font-size:14px}
.fb.show,.cnote.show{display:block}
.fb.good,.cnote.good{background:var(--okbg);color:#0f4d2a}.fb.bad,.cnote.bad{background:var(--badbg);color:#7c2a19}.fb.info,.cnote.info{background:var(--bluebg);color:#173f6e}
.prog{font-size:13px;font-weight:700;color:var(--teal);margin:0 0 8px}
.crow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.crow.ok{border-color:#9fd7b5;background:#f6fcf8}
.crow .cnote{grid-column:1/-1;margin-top:0}
.cbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cbtn{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--navy2);color:var(--navy);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer}
.cbtn:hover:not(:disabled){background:#eaf1fa}
.cbtn.sel{background:var(--ok);border-color:var(--ok);color:#fff}
.cbtn.wrong{border-color:#e0b4a8;color:#b88a7f;background:#faf1ee;text-decoration:line-through}
.cbtn.dim{opacity:.35}
.cbtn:disabled{cursor:default}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-weight:600;font-size:13.5px;color:var(--navy)}
select,textarea,input[type=text]{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}
textarea{min-height:140px;resize:vertical}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:14px}
.checks label:has(input:checked){border-color:var(--teal);background:#effaf8}
.checks input{margin-top:3px;accent-color:var(--teal)}
.bubble{position:relative;background:#fff;border:2px solid var(--navy2);border-radius:14px;padding:8px 12px;font-style:italic}
.bubble:before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:var(--navy2);border-left:0}
.scn{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:start;margin-bottom:8px}
.scn .av svg{width:76px;height:76px}
.hs{cursor:pointer}.hs .ring{animation:pulse 1.8s infinite;transform-box:fill-box;transform-origin:center}
.hs.seen .ring{animation:none;opacity:0}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.hs:hover circle.dot,.hs:focus circle.dot{stroke:#f2b705;stroke-width:4}
.ok-badge{display:inline-flex;align-items:center;gap:6px;background:var(--okbg);color:#0f4d2a;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}
.mini{font-size:12.5px;color:var(--mute)}
.sumrow{border-left:4px solid var(--teal);padding:4px 10px;margin:0 0 8px;background:#fff;border-radius:0 8px 8px 0}
@media (max-width:720px){.hero .bn{display:none}.hero h1{font-size:18px}.hero p{display:none}.pill .t{display:none}.pill{justify-content:center;padding:5px}.g2,.g3{grid-template-columns:1fr}.crow{grid-template-columns:1fr}.cbtns{justify-content:flex-start}main{padding:12px}.scn{grid-template-columns:56px 1fr}.scn .av svg{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

<header class="hero"><div class="bn" aria-hidden="true"><svg viewBox="0 0 160 70"><rect x="26" y="40" width="16" height="24" rx="2" fill="#7fd1c7"/><rect x="48" y="28" width="16" height="36" rx="2" fill="#e9a820"/><rect x="70" y="16" width="16" height="48" rx="2" fill="#ff9f8a"/><circle cx="112" cy="30" r="17" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="4"/><path d="M124 43L140 60" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M104 30l5 5 10-11" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><div class="kick">EDUC 580 · Teaching Practicum I · Week 5</div><h1>Formative &amp; Summative Assessment</h1><p>Monitor, adjust, use data, and choose clips for your lesson recording (CalTPA Part 4).</p></div></header>

<script>const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function shuf(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}
let _uid=0;
function avatar(o,size=72){const id='c'+(++_uid),H=o.hair;
 const front={short:`<path d="M24 35Q22 15 40 15Q58 15 56 35Q50 25 40 26Q30 25 24 35Z" fill="${H}"/>`,
 long:`<path d="M24 35Q24 19 40 19Q56 19 56 35Q48 26 40 27Q32 26 24 35Z" fill="${H}"/>`,
 curly:`<circle cx="26" cy="27" r="9" fill="${H}"/><circle cx="40" cy="21" r="10" fill="${H}"/><circle cx="54" cy="27" r="9" fill="${H}"/><circle cx="24" cy="38" r="6" fill="${H}"/><circle cx="56" cy="38" r="6" fill="${H}"/>`,
 bun:`<circle cx="40" cy="12" r="7" fill="${H}"/><path d="M24 36Q22 17 40 17Q58 17 56 36Q50 26 40 27Q30 26 24 36Z" fill="${H}"/>`,
 buzz:`<path d="M25 33Q25 18 40 18Q55 18 55 33Q48 26 40 26Q32 26 25 33Z" fill="${H}"/>`}[o.style||'short'];
 const back=o.style==='long'?`<path d="M22 40Q20 13 40 13Q60 13 58 40L58 64L22 64Z" fill="${H}"/>`:'';
 const gl=o.glasses?`<g fill="none" stroke="#333" stroke-width="1.6"><circle cx="34" cy="38" r="5.5"/><circle cx="46" cy="38" r="5.5"/><path d="M39.5 38h1"/></g>`:'';
 return `<svg viewBox="0 0 80 80" width="${size}" height="${size}" role="img" aria-label="${o.name||'Student'} illustration"><defs><clipPath id="${id}"><circle cx="40" cy="40" r="40"/></clipPath></defs><g clip-path="url(#${id})"><rect width="80" height="80" fill="${o.bg}"/>${back}<path d="M10 82Q12 57 40 57Q68 57 70 82Z" fill="${o.shirt}"/><rect x="35" y="48" width="10" height="12" rx="3" fill="${o.skin}"/><circle cx="40" cy="38" r="16" fill="${o.skin}"/>${front}<circle cx="34" cy="38" r="1.9" fill="#222"/><circle cx="46" cy="38" r="1.9" fill="#222"/><path d="M34 44.5Q40 49 46 44.5" stroke="#7a3b2e" stroke-width="2" fill="none" stroke-linecap="round"/>${gl}</g></svg>`}

function mcq(parent,{prompt,options,onCorrect,shuffle=true,cls=''}){
 const box=el('div','q '+cls);if(prompt)box.appendChild(el('p','qp',prompt));
 const list=el('div','opts'),fb=el('div','fb');fb.setAttribute('role','status');let done=false;
 (shuffle?shuf(options):options).forEach(o=>{const b=el('button','opt',o.t);b.type='button';
  b.onclick=()=>{if(done||b.classList.contains('bad'))return;
   if(o.ok){done=true;b.classList.add('good');$$('.opt',list).forEach(x=>x.disabled=true);fb.className='fb show good';fb.innerHTML='✅ '+o.fb;onCorrect&&onCorrect()}
   else{b.classList.add('bad');b.disabled=true;fb.className='fb show bad';fb.innerHTML='🔁 '+o.fb+' <b>Try another option.</b>'}};
  list.appendChild(b)});
 box.appendChild(list);box.appendChild(fb);parent.appendChild(box);return box}

function classify(parent,{items,cats,onDone,shuffle=true}){
 let n=0;const prog=el('div','prog',`0 / ${items.length} sorted`);parent.appendChild(prog);
 (shuffle?shuf(items):items).forEach(it=>{
  const row=el('div','crow');row.appendChild(el('div','',it.t));const btns=el('div','cbtns'),note=el('div','cnote');note.setAttribute('role','status');
  cats.forEach(c=>{const b=el('button','cbtn',c.label);b.type='button';
   b.onclick=()=>{if(row.dataset.ok)return;
    if(c.id===it.cat){row.dataset.ok=1;row.classList.add('ok');$$('.cbtn',btns).forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('dim')});b.classList.add('sel');
     note.className='cnote show good';note.innerHTML='✅ '+it.why;n++;prog.textContent=`${n} / ${items.length} sorted`;if(n===items.length&&onDone)onDone()}
    else{b.classList.add('wrong');b.disabled=true;note.className='cnote show bad';note.innerHTML='🔁 Not quite — try another category.'}};
   btns.appendChild(b)});
  row.appendChild(btns);row.appendChild(note);parent.appendChild(row)})}

function copyBox(ta,btn){btn.onclick=()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 const old=btn.textContent;btn.textContent=ok?'Copied ✓':'Press Ctrl/Cmd + C to copy';setTimeout(()=>btn.textContent=old,2200)}}

function runApp({steps}){
 const stepsEl=$('#steps'),main=$('#main'),back=$('#back'),next=$('#next'),stat=$('#stat');
 const done=steps.map(()=>false);let cur=0;
 const pills=steps.map((s,i)=>{const p=el('button','pill',`<span class="n">${i+1}</span><span class="t">${s.name}</span>`);p.type='button';p.title=s.name;p.onclick=()=>go(i);stepsEl.appendChild(p);return p});
 const panels=steps.map((s,i)=>{const d=el('section','panel');d.setAttribute('aria-label',s.name);main.appendChild(d);
  s.build(d,()=>{done[i]=true;paint()});return d});
 function paint(){pills.forEach((p,i)=>{p.classList.toggle('on',i===cur);p.classList.toggle('done',done[i]);p.querySelector('.n').textContent=done[i]&&i!==cur?'✓':i+1;if(i===cur)p.setAttribute('aria-current','step');else p.removeAttribute('aria-current')});
  panels.forEach((d,i)=>d.classList.toggle('show',i===cur));back.disabled=cur===0;next.disabled=cur===steps.length-1;
  stat.textContent=`Step ${cur+1} of ${steps.length} · ${done.filter(Boolean).length} completed`}
 function go(i){cur=i;paint();steps[i].show&&steps[i].show(panels[i]);main.scrollTop=0}
 back.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);go(0)}

const SEG=[
{id:'a',time:'2:10–6:40',m:4.5,c:'active',t:'Partners build and compare 1/3 and 1/6 with fraction strips',d:'Students manipulate models and argue which is greater.',tag:'Active math learning'},
{id:'b',time:'8:00–13:30',m:5.5,c:'ald',t:'Pairs use “___ is greater than ___ because ___” with the word wall',d:'Students practice math vocabulary in speech.',tag:'Academic language'},
{id:'c',time:'15:00–20:00',m:5,c:'mon',t:'Teacher circulates, asks “How do you know?”, and adjusts with a mini-lesson',d:'Teacher listens and responds to thinking.',tag:'Monitoring & adjusting'},
{id:'d',time:'22:00–30:00',m:8,c:'none',t:'Teacher explains steps for 8 minutes while students listen',d:'Little student interaction or evidence of learning.',tag:''},
{id:'e',time:'31:00–36:00',m:5,c:'none',t:'Cleaning up and transitioning to the next subject',d:'Routine management, not evidence of math teaching.',tag:''},
{id:'f',time:'38:00–42:00',m:4,c:'mon',t:'Exit ticket and students’ next steps',d:'Students show understanding; teacher previews what’s next.',tag:'Monitoring & next steps'}];
const picked5=new Set();

runApp({steps:[
{name:'Formative or Summative?',build(p,ok){
 p.innerHTML=`<h2>Two kinds of evidence, two purposes</h2><p class="lead"><b>Formative</b> checks guide teaching <i>during</i> learning; <b>summative</b> assessments evaluate learning <i>at the end</i>. Both inform instruction.</p>
 <svg viewBox="0 0 700 120" style="width:100%;max-height:112px;display:block;margin:0 0 10px" role="img" aria-label="Timeline of a unit with many formative checks and one summative assessment at the end">
 <rect width="700" height="120" rx="12" fill="#fff" stroke="#d5dee8"/><path d="M40 70H610" stroke="#1d3557" stroke-width="4" stroke-linecap="round"/><path d="M610 58l20 12-20 12z" fill="#1d3557"/>
 <g>${[90,160,230,300,370,440,510].map((x,i)=>`<circle cx="${x}" cy="70" r="9" fill="#2a9d8f"/><path d="M${x-4} 70l3 3 5-6" stroke="#fff" stroke-width="2" fill="none"/>`).join('')}</g>
 <g transform="translate(572 20)"><rect width="56" height="40" rx="6" fill="#e9a820"/><path d="M12 20l8 8 16-16" stroke="#fff" stroke-width="4" fill="none"/></g>
 <g font-family="Segoe UI,Arial" font-size="12" font-weight="700" text-anchor="middle"><text x="300" y="38" fill="#1c6b5f">Formative: ongoing checks that guide teaching</text><text x="300" y="100" fill="#52606d" font-weight="400">During the lesson or unit</text><text x="600" y="100" fill="#7a5600">Summative</text></g></svg>`;
 classify(p,{cats:[{id:'f',label:'Formative'},{id:'s',label:'Summative'}],onDone:ok,items:[
 {t:'Fist-to-five check halfway through the lesson',cat:'f',why:'Quick ongoing check that tells you whether to continue or reteach.'},
 {t:'Exit ticket on today’s skill used to plan tomorrow',cat:'f',why:'Gathered during the instructional cycle to guide next steps.'},
 {t:'End-of-unit fractions test recorded as a grade',cat:'s',why:'Evaluates learning at the end of instruction.'},
 {t:'Listening to partner talk while circulating',cat:'f',why:'Real-time evidence of student thinking.'},
 {t:'State standardized math assessment',cat:'s',why:'Measures learning after a long period of instruction.'},
 {t:'Mini-whiteboard responses during the lesson',cat:'f',why:'Every student responds, and you adjust right away.'},
 {t:'End-of-unit performance task graded with a rubric',cat:'s',why:'Culminating evidence of what students learned.'},
 {t:'Asking “How do you know?” and probing a student’s answer',cat:'f',why:'Purposeful questioning surfaces thinking while there’s still time to respond.'}]})}},

{name:'Monitor & Adjust',build(p,ok){
 p.innerHTML=`<h2>Responsive teaching in the moment</h2><p class="lead">Ask purposeful questions, listen to student thinking, and respond intentionally. Choose the best next move.</p>`;
 let n=0;const hit=()=>{if(++n===3){p.appendChild(el('div','fb show good','🌟 <b>Monitor → interpret → respond.</b> Evidence from the lesson tells you when to reteach, extend, or adapt.'));ok()}};
 [[{name:'Student',bg:'#ffe0b8',skin:'#c68642',hair:'#2b1b17',shirt:'#e76f51',style:'long'},'“1/6 is greater than 1/3 because 6 is bigger than 3.”',[
  {t:'“Show me with your fraction strips. What do you notice about the size of the pieces?”',ok:1,fb:'A purposeful question that lets the student discover the misconception from the model.'},
  {t:'“No, that’s wrong. 1/3 is greater.”',fb:'Telling the answer ends the thinking.'},
  {t:'“Good thinking! Who else?”',fb:'This lets a misconception stand.'},
  {t:'“We’re short on time, so let’s move on.”',fb:'The misconception will carry into the next lesson.'}]],
 [{name:'Student',bg:'#d7e8ff',skin:'#e8c39a',hair:'#161616',shirt:'#2f6fb5',style:'short',glasses:1},'You notice that most pairs are saying “this one is bigger” without using math terms.',[
  {t:'Pause the class, model the frame “___ is greater than ___ because the pieces are ___,” and have pairs try again.',ok:1,fb:'You adjust to support academic language in the moment.'},
  {t:'Keep going; they’ll pick up the words eventually.',fb:'Language demands need intentional support.'},
  {t:'Give the vocabulary list for homework.',fb:'It’s too late for this lesson, and it’s disconnected from the task.'}]],
 [{name:'Student',bg:'#d9f2e6',skin:'#a9744f',hair:'#222',shirt:'#2a9d8f',style:'curly'},'“I finished! Can I do something else?” (Several students are done, all correct.)',[
  {t:'Extend: “Can a fraction with a bigger denominator ever be greater? Prove it with a model.”',ok:1,fb:'A higher-order task that deepens the same concept.'},
  {t:'Give more of the same problems.',fb:'More of the same doesn’t deepen thinking.'},
  {t:'Ask them to wait quietly.',fb:'Learning time is lost.'}]]
 ].forEach(([a,s,o])=>{const w=el('div','scn');w.appendChild(el('div','av',avatar(a)));const r=el('div','');r.appendChild(el('div','bubble',s));r.firstChild.style.marginBottom='8px';mcq(r,{options:o,onCorrect:hit});w.appendChild(r);p.appendChild(w)})}},

{name:'Use the Data',build(p,ok){
 p.innerHTML=`<h2>Let results drive your next step</h2><p class="lead">Exit ticket: <b>“Which is greater, 1/3 or 1/6? Explain.”</b> Results from your 24 students:</p>`;
 const bars=[['Chose 1/6 (misconception)',9,'#e76f51'],['Correct using models',12,'#2a9d8f'],['Correct, explained and extended',3,'#2f6fb5']];
 p.appendChild(el('div','card',`<svg viewBox="0 0 700 150" style="width:100%;max-width:700px;height:auto;display:block" role="img" aria-label="Bar chart: 9 students chose 1/6, 12 correct using models, 3 correct and extended">${bars.map((b,i)=>`<text x="10" y="${30+i*42}" font-size="13" font-family="Segoe UI,Arial" fill="#1d3557" font-weight="600">${b[0]}</text><rect x="250" y="${14+i*42}" width="${b[1]*34}" height="26" rx="5" fill="${b[2]}"/><text x="${258+b[1]*34}" y="${33+i*42}" font-size="14" font-weight="700" fill="#1f2933" font-family="Segoe UI,Arial">${b[1]}</text>`).join('')}</svg>`));
 p.lastChild.style.marginBottom='12px';
 let n=0;const hit=()=>{if(++n===3){p.appendChild(el('div','fb show good','🌟 <b>Data → decision.</b> You matched next steps to each group’s evidence. In CalTPA Cycle 1, cite this kind of evidence to support your next steps.'));ok()}};
 mcq(p,{prompt:'9 students chose 1/6. What’s the best next step for this group?',onCorrect:hit,options:[
 {t:'Small-group reteach with fraction strips, focusing on piece size, while others practice.',ok:1,fb:'Targets the misconception with models, without slowing the whole class.'},
 {t:'Move on to the next unit.',fb:'9 of 24 students would carry the misconception forward.'},
 {t:'Assign them the same worksheet again.',fb:'Repeating the same task won’t fix the misunderstanding.'}]});
 mcq(p,{prompt:'12 students were correct using models. What’s the best next step?',onCorrect:hit,options:[
 {t:'Move from models to explaining with symbols and vocabulary, with guided practice.',ok:1,fb:'Builds from their success toward the next level of understanding.'},
 {t:'Repeat the same lesson to be safe.',fb:'They’ve shown readiness to move forward.'},
 {t:'Give them a test on fractions.',fb:'It’s too early for a summative test.'}]});
 mcq(p,{prompt:'3 students were correct and extended their thinking. What’s the best next step?',onCorrect:hit,options:[
 {t:'Offer an open-ended challenge, such as comparing three fractions and justifying the order.',ok:1,fb:'Extends rigor and uses their demonstrated understanding.'},
 {t:'Have them tutor the misconception group full-time.',fb:'Peer support can help, but they also deserve to keep learning.'},
 {t:'Do nothing; they’re fine.',fb:'Advancing learners need next steps too.'}]})}},

{name:'Clips & Commentary',build(p,ok){
 p.innerHTML=`<h2>Choose your video clips</h2><p class="lead">You recorded a 45-minute lesson. Choose <b>1–3 clips totaling up to 15 minutes</b> that show <b>active math learning</b>, <b>academic language</b>, and <b>monitoring &amp; adjusting</b>.</p>`;
 const tl=el('div','card');tl.style.marginBottom='10px';const meter=el('div','prog','Selected: 0 clips · 0 min of 15');
 const draw=()=>{const sel=SEG.filter(s=>picked5.has(s.id));const tot=sel.reduce((a,b)=>a+b.m,0);meter.textContent=`Selected: ${sel.length} clip${sel.length===1?'':'s'} · ${tot} min of 15`;meter.style.color=tot>15?'#b3422b':'#2a9d8f';
  const toX=t=>{const[a]=t.split('–')[0].split(':');return 20+(parseInt(a)+parseInt(t.split('–')[0].split(':')[1])/60)*14.5};
  tl.innerHTML=`<svg viewBox="0 0 700 64" style="width:100%;height:auto;display:block" role="img" aria-label="Lesson timeline with selected clips highlighted"><rect x="20" y="22" width="660" height="22" rx="6" fill="#e8eef5"/>${SEG.map(s=>`<rect x="${toX(s.time)}" y="22" width="${s.m*14.5}" height="22" rx="4" fill="${picked5.has(s.id)?'#2a9d8f':'#b8c4d2'}"/>`).join('')}<g font-size="10" fill="#52606d" font-family="Segoe UI,Arial" text-anchor="middle">${[0,10,20,30,40].map(m=>`<text x="${20+m*14.5}" y="58">${m}:00</text>`).join('')}</g></svg>`;tl.appendChild(meter)};
 p.appendChild(tl);const list=el('div','checks');
 SEG.forEach(s=>{const l=el('label','',`<input type="checkbox" data-id="${s.id}"><span><b>${s.time}</b> · ${s.m} min — ${s.t}<br><span class="mini">${s.d}</span></span>`);
  l.querySelector('input').onchange=e=>{e.target.checked?picked5.add(s.id):picked5.delete(s.id);draw();fb.className='fb'};list.appendChild(l)});
 const fb=el('div','fb'),bt=el('button','btn','Check my clips');bt.type='button';bt.style.margin='10px 0 4px';
 bt.onclick=()=>{const sel=SEG.filter(s=>picked5.has(s.id)),tot=sel.reduce((a,b)=>a+b.m,0),cats=new Set(sel.map(s=>s.c));let m=[];
  if(!sel.length)m.push('Choose at least one clip.');if(sel.length>3)m.push('Choose no more than three clips.');if(tot>15)m.push('Your clips total '+tot+' minutes; the limit is 15.');
  if(sel.some(s=>s.c==='none'))m.push('Some clips don’t show teaching evidence (like long teacher talk or clean-up).');
  if(!m.length){const miss=[];if(!cats.has('active'))miss.push('active math learning');if(!cats.has('ald'))miss.push('academic language');if(!cats.has('mon'))miss.push('monitoring & adjusting');if(miss.length)m.push('Your clips are valid, but they don’t show: '+miss.join(', ')+'.')}
  if(m.length){fb.className='fb show bad';fb.textContent='🔁 '+m.join(' ')}else{fb.className='fb show good';fb.innerHTML='✅ <b>Strong selection:</b> '+sel.length+' clips, '+tot+' minutes, showing all three focus areas. Now strengthen your commentary.';clipOK=true;fin()}};
 p.appendChild(list);p.appendChild(bt);p.appendChild(fb);draw();
 let clipOK=false,comOK=false;const fin=()=>{if(clipOK&&comOK)ok()};
 p.appendChild(el('h3','','Write evidence-based commentary')).style.marginTop='16px';
 mcq(p,{prompt:'Which commentary for your “monitoring” clip is strongest?',onCorrect:()=>{comOK=true;fin()},options:[
  {t:'At 15:20 I ask Maya, “How do you know 1/3 is greater?” She points to her strip model, so at 17:45 I pull a small group to revisit equal-size pieces.',ok:1,fb:'It uses timestamps, names specific dialogue and students, and explains the decision.'},
  {t:'This is a good clip where students do well.',fb:'It’s vague, with no specifics or rationale.'},
  {t:'Students were engaged the whole time and enjoyed the lesson.',fb:'It makes a general claim without pointing to evidence.'},
  {t:'The lesson went as planned and everything worked.',fb:'It doesn’t describe a decision or give a rationale.'}]})}}
]});
</script></body></html>
