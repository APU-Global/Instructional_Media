<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pitch Room</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; background-color: #050505; }
    .blueprint-grid {
      background-image: radial-gradient(rgba(255,255,255,0.15) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18';
    import { createRoot } from 'https://esm.sh/react-dom@18/client';
    import { 
      Check, ArrowRight, HelpCircle, Users, Target, Eye, Lightbulb, BarChart3, Map, AlertCircle,
      MessageSquare, ArrowRightCircle, Activity, CheckCircle2, Volume2, VolumeX, TrendingDown,
      Bus, Home, UserMinus, BookOpen, Unlink, Link2, Clock, Baby, Globe2, ClipboardList,
      Sprout, MapPin, Building, ShoppingCart, ChevronRight, Utensils, Heart, CalendarX, BarChart
    } from 'https://esm.sh/lucide-react@0.292.0';

    const PANELIST_AVATAR = 'https://api.dicebear.com/7.x/micah/svg?seed=Panelist&backgroundColor=transparent';

    const LENSES = [
      { id: 'ALIGNMENT', title: 'ALIGNMENT', desc: 'Does the strategy actually address the problem?', icon: Target },
      { id: 'PERSPECTIVE', title: 'PERSPECTIVE', desc: 'Whose experience or voice might be missing?', icon: Users },
      { id: 'ASSUMPTIONS', title: 'ASSUMPTIONS', desc: 'What is the strategy taking for granted?', icon: Lightbulb },
      { id: 'IMPACT', title: 'IMPACT', desc: 'How will we know the strategy worked?', icon: BarChart3 }
    ];

    const PITCHES = {
      1: {
        id: 1, presenter: { name: 'Max Winslow', role: 'School Improvement', initials: 'MW', color: 'from-amber-600 to-amber-800', avatar: 'https://api.dicebear.com/7.x/micah/svg?seed=Max&backgroundColor=transparent' }, missingAngle: 'ALIGNMENT', feedbackText: 'The strategy addresses one part of the problem, but not the broader diagnosis.', feedbackPrinciple: 'A strong strategy should clearly connect the problem identified with the response proposed.', script: [
          { speaker: 'MAX', text: 'We\'ve seen an 18% increase in student absenteeism this year.', pathway: ['PROBLEM'] },
          { speaker: 'PANELIST', text: 'What did your team find was driving it?', pathway: ['PROBLEM'] },
          { speaker: 'MAX', text: 'Transportation is a major issue. Family responsibilities are another. Some also feel disconnected, and academic struggles make it harder.', pathway: ['PROBLEM', 'DIAGNOSIS'] },
          { speaker: 'PANELIST', text: 'And what\'s your proposed response?', pathway: ['PROBLEM', 'DIAGNOSIS'] },
          { speaker: 'MAX', text: 'We\'re proposing after-school tutoring three afternoons a week for academic support.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
          { speaker: 'PANELIST', text: 'And you expect that to improve attendance?', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
          { speaker: 'MAX', text: 'Yes. Students who feel academically supported should become more engaged.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT_Q'] }
        ]
      },
      2: {
        id: 2, presenter: { name: 'Justine', role: 'Community Director', initials: 'JU', color: 'from-emerald-600 to-emerald-800', avatar: 'https://api.dicebear.com/7.x/micah/svg?seed=Justine&backgroundColor=transparent' }, missingAngle: 'PERSPECTIVE', feedbackText: 'The strategy was designed around what the organization believes families need—not what families have said they need.', feedbackPrinciple: 'Strong strategies consider the experience of the people they are designed to affect.', script: [
          { speaker: 'JUSTINE', text: 'Families aren\'t showing up to our youth health workshops.', pathway: ['PROBLEM'] },
          { speaker: 'PANELIST', text: 'What do you think is getting in the way?', pathway: ['PROBLEM'] },
          { speaker: 'JUSTINE', text: 'We think the biggest issue is commitment. If optional, families don\'t prioritize them.', pathway: ['PROBLEM', 'DIAGNOSIS'] },
          { speaker: 'PANELIST', text: 'So what\'s your proposed solution?', pathway: ['PROBLEM', 'DIAGNOSIS'] },
          { speaker: 'JUSTINE', text: 'Starting next semester, we\'re proposing one required Saturday workshop each month.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
          { speaker: 'PANELIST', text: 'Did you talk with families about the change?', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
          { speaker: 'JUSTINE', text: 'Not formally. But if attendance is required, we expect participation to increase.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT_Q'] }
        ]
      },
      3: {
        id: 3, presenter: { name: 'Alex Morgan', role: 'Neighborhood Coordinator', initials: 'AM', color: 'from-indigo-600 to-indigo-800', avatar: 'https://api.dicebear.com/7.x/micah/svg?seed=Alex&backgroundColor=transparent' }, missingAngle: 'IMPACT', feedbackText: 'The strategy makes a plausible claim about impact, but it doesn\'t explain how that impact will be demonstrated.', feedbackPrinciple: 'A strategy becomes stronger when its intended outcomes can be observed or measured.', script: [
          { speaker: 'ALEX', text: 'Fresh food shouldn\'t depend on where you live.', pathway: ['PROBLEM', 'DIAGNOSIS'] },
          { speaker: 'PANELIST', text: 'What\'s your proposed strategy?', pathway: ['PROBLEM', 'DIAGNOSIS'] },
          { speaker: 'ALEX', text: 'We\'re proposing a community garden on an unused neighborhood lot.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
          { speaker: 'PANELIST', text: 'And what impact do you expect?', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
          { speaker: 'ALEX', text: 'Greater access to fresh food should contribute to healthier eating and better community health.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT_Q'] },
          { speaker: 'PANELIST', text: 'How will you know whether it\'s actually working?', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT_Q'] },
          { speaker: 'ALEX', text: 'We expect the benefits to become evident as participation grows.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT_Q'] }
        ]
      }
    };

    let audioCtx = null;
    const initAudio = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); };
    const playSound = (type, isMuted) => {
      if (isMuted) return; initAudio(); if (!audioCtx) return;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      switch(type) {
        case 'click': osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.05); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05); break;
        case 'error': osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.2); gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2); break;
        case 'success': osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15); setTimeout(() => { if (!audioCtx) return; const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain(); osc2.type = 'sine'; osc2.frequency.setValueAtTime(554.37, audioCtx.currentTime); gain2.gain.setValueAtTime(0.1, audioCtx.currentTime); gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc2.connect(gain2); gain2.connect(audioCtx.destination); osc2.start(audioCtx.currentTime); osc2.stop(audioCtx.currentTime + 0.3); }, 100); break;
        case 'transition': osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(500, now + 0.1); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15); break;
      }
    };

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false }) => {
      const baseStyle = "px-6 py-3 rounded-xl font-black transition-all duration-150 flex items-center justify-center gap-2 active:translate-y-1 active:border-b-0 focus:outline-none";
      const variants = {
        primary: "bg-gradient-to-b from-[#7bed43] to-[#45b811] text-[#0a2e00] border-b-4 border-[#2b7a08] shadow-lg hover:brightness-110 tracking-wide uppercase",
        secondary: "bg-gradient-to-b from-[#fbf4d7] to-[#e6dbb3] text-[#1c3842] border-b-4 border-[#c2b688] shadow-lg hover:brightness-110 uppercase",
        outline: "bg-transparent text-[#fbf4d7] border-2 border-[#fbf4d7] hover:bg-[#fbf4d7] hover:text-[#1c0d07] uppercase",
        lens: "bg-[#1a2533] text-white border-2 border-[#2d3e50] hover:border-[#7bed43] hover:shadow-[0_0_15px_rgba(123,237,67,0.4)] text-left items-start flex-col gap-1 p-4 rounded-2xl active:translate-y-0",
        inverse: "bg-gradient-to-b from-[#fbf4d7] to-[#e6dbb3] text-[#1c3842] border-b-4 border-[#c2b688] hover:brightness-110 uppercase",
      };
      return <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed border-b-0 translate-y-1' : ''} ${className}`}>{children}</button>;
    };

    const Header = ({ pitchNum, pathway = [], isMuted, toggleMute }) => {
      const steps = ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT'];
      return (
        <header className="relative w-full bg-white border-b border-slate-200 z-50 h-14 shrink-0">
          <div className="h-full w-full max-w-7xl mx-auto px-6 flex items-center justify-between">
            <div className="flex flex-col">
              <h1 className="text-base font-bold tracking-tight text-slate-900 leading-none">THE PITCH ROOM</h1>
              <span className="text-[10px] font-semibold tracking-wider text-slate-500 mt-0.5">STRATEGIC REVIEW PANEL</span>
            </div>
            {pitchNum > 0 && pitchNum <= 3 && (
              <div className="hidden md:flex items-center gap-2 bg-[#1f2937] px-4 py-1.5 rounded-xl border-b-2 border-[#111827]">
                {steps.map((step, idx) => {
                  const isComplete = pathway.includes(step); const isQuestion = pathway.includes(step + '_Q') && step === 'IMPACT';
                  return (
                    <React.Fragment key={step}>
                      <div className={`flex items-center gap-1.5 text-xs font-black tracking-widest px-2 py-0.5 rounded-md ${isComplete ? 'bg-[#7bed43] text-[#0a2e00]' : isQuestion ? 'bg-amber-400 text-amber-900' : 'text-slate-500 bg-slate-800'}`}>
                        <span>{step}</span>{isComplete ? <Check size={14} strokeWidth={4} /> : isQuestion ? <HelpCircle size={14} strokeWidth={4} /> : null}
                      </div>
                      {idx < steps.length - 1 && <ArrowRight size={14} className="text-slate-600 mx-1" strokeWidth={3} />}
                    </React.Fragment>
                  );
                })}
              </div>
            )}
            <div className="flex items-center gap-4">
              {pitchNum > 0 && pitchNum <= 3 && <div className="text-sm font-semibold text-slate-500">PITCH 0{pitchNum} / 03</div>}
              <button onClick={toggleMute} className="p-1.5 rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-700 transition-colors">{isMuted ? <VolumeX size={18} /> : <Volume2 size={18} />}</button>
            </div>
          </div>
        </header>
      );
    };

    const Avatar = ({ initials, color, type = 'presenter', imgUrl }) => {
      const [imgError, setImgError] = useState(false);
      const isPanelist = type === 'panelist'; const actualImgUrl = isPanelist ? PANELIST_AVATAR : imgUrl;
      return (
        <div className={`relative w-20 h-24 rounded-xl flex items-end justify-center font-bold text-lg shadow-md border-2 overflow-hidden shrink-0 ${isPanelist ? 'bg-gradient-to-b from-slate-700 to-slate-900 border-slate-600' : `bg-gradient-to-b ${color} border-white`}`}>
          {!imgError && actualImgUrl ? ( <img src={actualImgUrl} alt="Avatar" className={`w-[120%] h-[120%] object-contain object-bottom ${isPanelist ? 'brightness-0 opacity-80' : ''}`} onError={() => setImgError(true)} /> ) : ( <div className="mb-2">{isPanelist ? <Users size={28} className="text-slate-400" /> : initials}</div> )}
        </div>
      );
    };

    const FadeIn = ({ children, delay = 0, className = '' }) => {
      const [isVisible, setIsVisible] = useState(false);
      useEffect(() => { const timer = setTimeout(() => setIsVisible(true), delay); return () => clearTimeout(timer); }, [delay]);
      return <div className={`transition-all duration-500 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2'} ${className}`}>{children}</div>;
    };

    const Pitch1Visual = ({ step, isFeedback }) => (
      <div className="w-full h-full flex flex-col items-center justify-center relative">
        {!isFeedback ? (
          <div className="w-full max-w-xl space-y-8 z-10 flex flex-col items-center">
            <svg className="absolute inset-0 w-full h-full z-0 pointer-events-none opacity-20" style={{ filter: 'drop-shadow(0px 1px 2px rgba(255,255,255,0.2))' }}>
              {step >= 2 && <path d="M 50% 20% Q 25% 45% 25% 55% M 50% 20% Q 75% 45% 75% 55% M 50% 20% L 50% 55%" stroke="#64748b" strokeWidth="3" strokeDasharray="5 5" fill="none" />}
              {step >= 4 && <path d="M 25% 65% Q 50% 75% 50% 80% M 75% 65% Q 50% 75% 50% 80% M 50% 65% L 50% 80%" stroke="#3b82f6" strokeWidth="4" fill="none" />}
            </svg>
            <FadeIn delay={100} className="w-full flex justify-center">
              <div className={`p-5 bg-[#2d3e50] rounded-2xl shadow-lg border-b-4 border-[#1f2937] transition-all w-3/4 ${step >= 2 ? 'opacity-70 scale-95' : ''}`}>
                <div className="flex items-center justify-center gap-5">
                  <div className="bg-rose-500 p-4 rounded-xl text-white shadow-inner"><TrendingDown size={36} strokeWidth={3} /></div>
                  <div><div className="text-sm font-black tracking-widest text-rose-400 mb-1">THE PROBLEM</div><div className="text-4xl font-black text-white">18% Increase</div><div className="text-lg text-slate-300 font-medium">in student absenteeism this year.</div></div>
                </div>
              </div>
            </FadeIn>
            {step >= 2 && (
              <FadeIn className="w-full">
                <div className={`space-y-4 transition-all ${step >= 4 ? 'opacity-60 scale-95' : ''}`}>
                  <div className="flex items-center justify-center gap-2 text-sm font-black text-[#7bed43] tracking-widest uppercase"><Activity size={20} strokeWidth={3}/> Identified Causes</div>
                  <div className="grid grid-cols-4 gap-4 px-4">
                    <div className="bg-[#1f2937] p-4 rounded-xl shadow-inner border-2 border-[#3d536b] flex flex-col items-center gap-2"><Bus size={28} className="text-amber-400" /><span className="text-sm md:text-base font-bold text-white text-center">Transportation</span></div>
                    <div className="bg-[#1f2937] p-4 rounded-xl shadow-inner border-2 border-[#3d536b] flex flex-col items-center gap-2"><Home size={28} className="text-amber-400" /><span className="text-sm md:text-base font-bold text-white text-center">Family Duties</span></div>
                    <div className="bg-[#1f2937] p-4 rounded-xl shadow-inner border-2 border-[#3d536b] flex flex-col items-center gap-2"><UserMinus size={28} className="text-amber-400" /><span className="text-sm md:text-base font-bold text-white text-center">Disconnection</span></div>
                    <div className="bg-[#2d3e50] p-4 rounded-xl shadow-[0_0_20px_rgba(96,165,250,0.4)] border-2 border-blue-400 flex flex-col items-center gap-2 relative overflow-hidden"><BookOpen size={28} className="text-blue-400 relative z-10" /><span className="text-sm md:text-base font-black text-white relative z-10 text-center">Academic Struggles</span></div>
                  </div>
                </div>
              </FadeIn>
            )}
            {step >= 4 && (
              <FadeIn className="w-full flex justify-center pt-4">
                <div className="p-6 bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl shadow-xl border-b-4 border-blue-900 relative group w-3/4 text-center">
                  <div className="relative z-10 flex flex-col items-center">
                    <div className="text-sm font-black tracking-widest text-blue-200 mb-2 flex items-center gap-2"><Target size={20} /> PROPOSED STRATEGY</div>
                    <div className="text-3xl md:text-4xl font-black text-white mb-4">After-School Tutoring</div>
                    <div className="flex justify-center gap-3 flex-wrap">
                      <span className="bg-blue-900 text-white text-base font-bold px-4 py-2 rounded-xl flex items-center gap-2 border border-blue-400"><CheckCircle2 size={18} className="text-[#7bed43]"/> Academic Support</span>
                    </div>
                  </div>
                </div>
              </FadeIn>
            )}
          </div>
        ) : (
          <div className="w-full max-w-4xl flex flex-col items-center z-10 gap-8 bg-[#1f2937] p-8 rounded-3xl border-2 border-[#3d536b] relative">
            
            <svg className="absolute inset-0 w-full h-full z-0 pointer-events-none" preserveAspectRatio="none">
              <path d="M 25% 20% C 25% 50%, 75% 50%, 75% 80%" stroke="#ef4444" strokeWidth="6" strokeDasharray="10 10" fill="none" opacity="0.3" />
            </svg>

            <div className="w-full flex items-center justify-between z-10 gap-8">
              <div className="flex-1 space-y-4 bg-[#111827] p-6 rounded-2xl border border-slate-700 shadow-inner">
                 <div className="text-sm font-black text-slate-400 mb-4 tracking-widest uppercase flex items-center gap-2"><Map size={18}/> DIAGNOSIS FOUND</div>
                 <div className="grid grid-cols-1 gap-3">
                   <div className="bg-[#1f2937] p-4 rounded-xl border border-slate-600 flex items-center gap-4 text-slate-400"><Bus size={24} className="text-rose-400"/> <span className="font-bold text-lg md:text-xl">Transportation</span></div>
                   <div className="bg-[#1f2937] p-4 rounded-xl border border-slate-600 flex items-center gap-4 text-slate-400"><Home size={24} className="text-rose-400"/> <span className="font-bold text-lg md:text-xl">Family Duties</span></div>
                   <div className="bg-[#1f2937] p-4 rounded-xl border border-slate-600 flex items-center gap-4 text-slate-400"><UserMinus size={24} className="text-rose-400"/> <span className="font-bold text-lg md:text-xl">Disconnection</span></div>
                   <div className="bg-[#2d3e50] p-4 rounded-xl border-2 border-blue-400 flex items-center gap-4 text-white shadow-lg"><BookOpen size={24} className="text-blue-400" /> <span className="font-bold text-lg md:text-xl">Academic Struggles</span></div>
                 </div>
              </div>
              
              <div className="w-16 flex flex-col items-center justify-center gap-10 text-slate-300 z-20">
                 <Unlink size={32} className="text-rose-500 animate-pulse" />
                 <Unlink size={32} className="text-rose-500 animate-pulse" />
                 <Unlink size={32} className="text-rose-500 animate-pulse" />
                 <Link2 size={32} className="text-blue-400" />
              </div>

              <div className="flex-1 space-y-4 z-10">
                <div className="text-sm font-black text-[#7bed43] mb-4 tracking-widest uppercase flex items-center gap-2"><Target size={18}/> STRATEGY ADDRESSES</div>
                 <div className="bg-gradient-to-br from-blue-600 to-blue-800 p-8 rounded-3xl border-b-4 border-blue-900 h-full min-h-[300px] flex flex-col justify-center items-center shadow-xl relative overflow-hidden">
                   <div className="absolute top-0 right-0 p-4 opacity-20"><BookOpen size={100} /></div>
                   <div className="w-20 h-20 bg-white/10 backdrop-blur-sm rounded-full flex items-center justify-center mb-6 text-white shadow-inner"><Target size={40} /></div>
                   <div className="text-3xl md:text-4xl font-black text-white text-center leading-tight">After-School<br/>Tutoring</div>
                 </div>
              </div>
            </div>
          </div>
        )}
      </div>
    );

    const Pitch2Visual = ({ step, isFeedback }) => (
      <div className="w-full h-full flex flex-col items-center justify-center relative">
        {!isFeedback ? (
          <div className="w-full max-w-xl space-y-12 z-10 flex flex-col items-center relative">
            <FadeIn>
              <div className={`flex flex-col items-center transition-all ${step >= 4 ? 'opacity-40 scale-90' : ''}`}>
                <div className="bg-rose-500 text-white px-8 py-4 rounded-2xl border-b-4 border-rose-700 text-xl md:text-2xl font-black shadow-lg flex items-center gap-3"><Activity size={28} strokeWidth={3} /> LOW WORKSHOP PARTICIPATION</div>
                {step >= 2 && <div className="mt-4 bg-amber-400 px-6 py-2 border-b-4 border-amber-600 rounded-xl text-sm md:text-base font-black text-amber-950 tracking-widest uppercase transform -rotate-2 shadow-sm">ASSUMPTION: LACK OF COMMITMENT</div>}
              </div>
            </FadeIn>
            {step >= 4 && (
              <FadeIn className="w-full pt-8">
                <div className="relative h-[300px] w-full flex items-center justify-center">
                  <CalendarX size={200} className="absolute text-purple-500/10 z-0" />
                  
                  <div className="absolute z-20 p-8 bg-gradient-to-b from-purple-500 to-purple-700 rounded-3xl shadow-2xl border-b-4 border-purple-900 text-center w-80 transform transition-all duration-500">
                    <div className="text-sm font-black text-purple-200 mb-3 tracking-widest">STRATEGY</div>
                    <div className="text-3xl font-black text-white leading-tight">MANDATORY SATURDAY WORKSHOP</div>
                  </div>
                  
                  {step >= 6 && <svg className="absolute inset-0 w-full h-full z-10 pointer-events-none" style={{ filter: 'drop-shadow(0px 2px 2px rgba(0,0,0,0.5))' }}><path d="M 50% 50% L 50% 85%" stroke="#fbbf24" strokeWidth="6" strokeDasharray="10 10" fill="none" /></svg>}
                  {step >= 6 && (
                    <FadeIn delay={400} className="absolute bottom-0 z-20">
                      <div className="bg-[#fbf4d7] text-[#1c3842] border-b-4 border-[#c2b688] px-8 py-4 rounded-2xl font-black text-2xl md:text-3xl flex items-center gap-4 shadow-xl hover:scale-105 transition-transform">
                        <Users size={32} /> PARENTS <HelpCircle size={32} className="text-rose-500 animate-pulse" strokeWidth={3}/>
                      </div>
                    </FadeIn>
                  )}
                </div>
              </FadeIn>
            )}
          </div>
        ) : (
          <div className="w-full max-w-4xl flex flex-col items-center justify-center z-10 gap-10">
             <div className="p-6 bg-gradient-to-b from-purple-500 to-purple-700 rounded-2xl shadow-xl border-b-4 border-purple-900 text-center w-96 relative z-20">
                <div className="text-sm font-black text-purple-200 mb-2 tracking-widest">THE STRATEGY</div>
                <div className="text-3xl font-black text-white">MANDATORY SATURDAY WORKSHOP</div>
             </div>
             
             <div className="relative w-full flex justify-center items-start pt-8">
               <div className="absolute top-0 w-3 h-16 bg-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.5)]"></div>
               <div className="absolute top-4 bg-[#1f2937] text-rose-500 font-black px-6 py-2 text-xl md:text-2xl border-4 border-rose-500 rounded-2xl shadow-xl z-30 transform rotate-2">DISCONNECT</div>
               
               <div className="bg-[#1f2937] p-8 rounded-3xl border-4 border-[#2d3e50] w-full shadow-2xl mt-12 relative z-20">

            <div className="flex-1 flex items-center justify-center p-6 relative overflow-hidden">
              <FadeIn className="max-w-5xl w-full flex flex-col justify-evenly h-full py-4">
                <div className="text-center">
                  <h2 className="text-4xl md:text-6xl font-black text-white mb-2 tracking-tight">THREE PITCHES.</h2>
                  <h2 className="text-3xl md:text-5xl font-black text-[#7bed43] mb-6 tracking-tight">THREE MISSING ANGLES.</h2>
                  <p className="text-lg md:text-xl text-amber-400 font-bold max-w-2xl mx-auto">Strong strategies don't just sound convincing. Their pieces connect.</p>
                </div>
                <div className="flex flex-col gap-5 my-6">
                  {[ { num: '01', title: 'ATTENDANCE', flow: 'Problem', to: 'Strategy', angle: 'ALIGNMENT' }, { num: '02', title: 'PARENT ENGAGEMENT', flow: 'Strategy', to: 'People', angle: 'PERSPECTIVE' }, { num: '03', title: 'COMMUNITY GARDEN', flow: 'Action', to: 'Evidence', angle: 'IMPACT' } ].map(item => (
                    <div key={item.num} className="bg-[#1a2533] p-6 rounded-2xl shadow-lg border-2 border-[#2d3e50] flex flex-col md:flex-row items-center gap-6 transform hover:scale-[1.01] transition-transform">
                      <div className="text-5xl font-black text-slate-700 w-20 text-center">{item.num}</div>
                      <div className="flex-1 text-center md:text-left">
                        <div className="text-2xl font-black text-white mb-2 uppercase">{item.title}</div>
                        <div className="text-sm md:text-base text-slate-400 font-bold flex items-center justify-center md:justify-start gap-2 uppercase">{item.flow} <ArrowRight size={18} className="text-amber-500" strokeWidth={3}/> {item.to}</div>
                      </div>
                      <div className="bg-[#fbf4d7] text-[#1c3842] px-6 py-3 rounded-xl font-black tracking-widest text-lg border-b-4 border-[#c2b688] shadow-sm transform rotate-1">{item.angle}</div>
                    </div>
                  ))}
                </div>
                <div className="flex justify-center">
                  <Button onClick={() => { playAudio('transition'); setCurrentScreen('flip'); }} className="py-4 px-12 text-xl">CONTINUE <ArrowRight size={24} strokeWidth={3} /></Button>
                </div>
              </FadeIn>
            </div>
          </div>
        );
      }

      function ScreenFlip() {
        return (
          <div className="h-full w-full bg-gradient-to-b from-[#1a2533] to-[#111827] flex flex-col relative text-white">
            <Header pitchNum={0} isMuted={isMuted} toggleMute={toggleMute} />
            <div className="flex-1 flex items-center justify-center p-4 relative overflow-hidden">
              <FadeIn className="max-w-4xl w-full flex flex-col items-center justify-center gap-4 md:gap-6 h-full py-2">
                <h2 className="text-3xl md:text-4xl font-black tracking-tight m-0 text-white">FLIP THE LENS</h2>
                <div className="flex flex-col md:flex-row items-center justify-center gap-2 md:gap-3 text-[10px] md:text-xs font-black tracking-widest text-white uppercase w-full">
                  <span className="bg-[#2d3e50] px-3 py-2 rounded-lg border border-slate-600 flex items-center gap-2"><Target size={16} className="text-slate-400"/> THEIR STRATEGY</span>
                  <ArrowRight size={16} className="hidden md:block text-amber-500" strokeWidth={3}/><ArrowRight size={16} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-[#2d3e50] px-3 py-2 rounded-lg border border-slate-600 flex items-center gap-2"><Users size={16} className="text-slate-400"/> OUTSIDE PERSPECTIVE</span>
                  <ArrowRight size={16} className="hidden md:block text-amber-500" strokeWidth={3}/><ArrowRight size={16} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-amber-500 px-3 py-2 rounded-lg text-amber-950 border-b-2 border-amber-700 flex items-center gap-2 transform scale-105"><Eye size={16} /> MISSING ANGLE</span>
                  <ArrowRight size={16} className="hidden md:block text-amber-500" strokeWidth={3}/><ArrowRight size={16} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-[#7bed43] px-3 py-2 rounded-lg text-[#0a2e00] border-b-2 border-[#2b7a08] flex items-center gap-2"><CheckCircle2 size={16} /> STRONGER STRATEGY</span>
                </div>
                <p className="text-base md:text-lg font-bold text-slate-300 max-w-2xl mx-auto m-0 leading-relaxed bg-[#111827]/50 p-4 rounded-xl border border-slate-700 text-center">
                  When you're close to an idea, some weaknesses are harder to see.
                </p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-3xl mx-auto text-left w-full">
                  {LENSES.map(lens => (
                    <div key={lens.id} className="bg-[#1f2937] p-3 rounded-xl border-2 border-[#2d3e50] shadow-sm flex items-center gap-3">
                      <div className="bg-[#111827] p-2 rounded-lg text-amber-400 border border-slate-700"><lens.icon size={20} strokeWidth={2.5} /></div>
                      <div><div className="text-amber-400 font-black tracking-wider mb-0.5 text-xs uppercase">{lens.title}</div><div className="text-white text-xs font-bold">{lens.desc}</div></div>
                    </div>
                  ))}
                </div>
                <div className="bg-[#fbf4d7] w-full max-w-lg mx-auto p-4 md:p-5 rounded-2xl border-b-4 border-[#c2b688] relative transform -rotate-1 text-center md:text-left">
                   <div className="relative z-10 text-[#1c3842]">
                     <div className="text-slate-500 font-black tracking-widest mb-1 uppercase text-[10px]">DON'T JUST ASK:</div>
                     <div className="text-lg text-slate-400 line-through decoration-rose-500 decoration-4 mb-2 font-black">"What do you think?"</div>
                     <div className="text-amber-600 font-black tracking-widest mb-1 uppercase text-[10px]">ASK:</div>
                     <div className="text-xl font-black text-[#1c3842] leading-tight">"What is the missing angle in my strategy?"</div>
                   </div>
                </div>
                <div className="flex justify-center w-full mt-2">
                  <Button onClick={() => { playAudio('transition'); setCurrentScreen('final'); }} className="py-3 px-12 text-lg w-full max-w-[250px]">NEXT</Button>
                </div>
              </FadeIn>
            </div>
          </div>
        );
      }

      function ScreenFinal() {
        return (
          <div className="h-full w-full bg-gradient-to-b from-[#4a2411] via-[#241108] to-[#0a0502] flex flex-col relative text-center">
            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full h-[600px] bg-[radial-gradient(ellipse_at_center,_rgba(251,191,36,0.15),_transparent_70%)] pointer-events-none"></div>
            <Header pitchNum={0} isMuted={isMuted} toggleMute={toggleMute} />
            <div className="flex-1 flex items-center justify-center p-6 w-full relative overflow-hidden">
              <FadeIn className="max-w-3xl w-full bg-[#1a2533] p-10 md:p-12 rounded-3xl shadow-2xl border-2 border-[#2d3e50] relative z-10 flex flex-col items-center">
                <div className="w-20 h-20 bg-[#fbf4d7] rounded-xl flex items-center justify-center mx-auto mb-8 text-[#1c3842] border-b-4 border-[#c2b688] transform -rotate-2 hover:rotate-2 transition-transform shadow-lg"><Eye size={40} strokeWidth={2.5}/></div>
                <h2 className="text-3xl md:text-5xl font-black text-white tracking-tight mb-10 leading-tight">YOU CAN'T ALWAYS SEE<br/>YOUR OWN BLIND SPOTS.</h2>
                <div className="flex flex-col md:flex-row items-center justify-center gap-3 text-xs font-black tracking-widest text-white mb-10 uppercase">
                  <span className="bg-[#2d3e50] px-3 py-2 rounded-lg border border-slate-600">YOUR STRATEGY</span>
                  <ArrowRight size={18} className="hidden md:block text-amber-500" strokeWidth={3}/><ArrowRight size={18} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-[#2d3e50] px-3 py-2 rounded-lg border border-slate-600">PEER PERSPECTIVE</span>
                  <ArrowRight size={18} className="hidden md:block text-amber-500" strokeWidth={3}/><ArrowRight size={18} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-amber-400 px-3 py-2 rounded-lg text-amber-950 border-b-2 border-amber-600 transform scale-105 shadow-md">MISSING ANGLE</span>
                  <ArrowRight size={18} className="hidden md:block text-amber-500" strokeWidth={3}/><ArrowRight size={18} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-[#7bed43] px-3 py-2 rounded-lg text-[#0a2e00] border-b-2 border-[#2b7a08] shadow-md">STRONGER STRATEGY</span>
                </div>
                <p className="text-lg font-bold text-slate-300 mb-10 max-w-xl mx-auto bg-[#111827]/50 p-5 rounded-2xl border border-slate-700">Now it's your turn to put another set of eyes on your strategy.</p>
                <Button onClick={() => { playAudio('transition'); setCurrentScreen('intro'); setCurrentPitch(1); }} variant="inverse" className="py-4 px-12 text-xl w-full max-w-[300px] mx-auto">START OVER</Button>
              </FadeIn>
            </div>
          </div>
        );
      }
    }

    const root = createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
