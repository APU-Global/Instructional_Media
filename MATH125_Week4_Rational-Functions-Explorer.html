<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATH 125 Week 4 | Rational Functions Explorer</title>
<style>
:root{--red:#d34147;--dark:#a8353a;--ink:#1f2933;--mut:#52606d;--soft:#f6f7f9;--line:#dde1e6;--blue:#2a6fbb;--green:#2e7d4f;--gold:#c77d0a;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4}
.wrap{padding:10px 12px 12px;max-width:980px;margin:0 auto}
header{display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:4px solid var(--red);padding-bottom:8px;margin-bottom:10px}
header .txt{flex:1;min-width:0}
.tag{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:12px;letter-spacing:.04em;padding:2px 10px;border-radius:999px;text-transform:uppercase}
h1{margin:4px 0 2px;font-size:22px;line-height:1.15}
header p{margin:0;color:var(--mut);font-size:13.5px}
header svg{flex:0 0 auto;width:170px;height:auto;border-radius:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font:inherit;font-weight:600;border:2px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #1b5fae;outline-offset:2px}
.panel{display:none}.panel.on{display:block}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.card h2{margin:0 0 6px;font-size:15px;color:var(--dark)}
.plot{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.ctl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin:6px 0}
.ctl label{font-weight:600;font-size:14px;white-space:nowrap}
.ctl output{font-weight:700;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--red)}
select{font:inherit;padding:4px 8px;border:2px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}
.eq{font-size:18px;font-weight:700;background:var(--soft);border-left:5px solid var(--red);padding:6px 10px;border-radius:6px;margin:4px 0 8px;overflow-wrap:anywhere}
.facts{margin:0;padding:0;list-style:none;font-size:14px}
.facts li{padding:3px 0;border-bottom:1px dashed var(--line)}
.facts li:last-child{border:0}
.facts b{color:var(--dark)}
table.t{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0}
table.t th,table.t td{border:1px solid var(--line);padding:3px 6px;text-align:center}
table.t th{background:var(--soft)}
.btn{font:inherit;font-weight:600;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.opt{font:inherit;font-weight:600;text-align:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 8px;cursor:pointer;min-height:44px}
.opt:hover{border-color:var(--red)}
.opt.ok{background:#e3f4ea;border-color:var(--green)}
.opt.bad{background:#fde8e9;border-color:var(--red)}
.opt svg{display:block;margin:0 auto 4px;width:96px;height:auto}
.fb{min-height:40px;font-weight:600;font-size:14px;margin:4px 0}
.fb.ok{color:var(--green)}.fb.bad{color:var(--dark)}
.score{float:right;font-size:13px;color:var(--mut);font-weight:600}
.note{font-size:13px;color:var(--mut);margin:4px 0 0}
.q{font-size:17px;font-weight:700;margin:2px 0 6px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
@media (max-width:760px){.grid{grid-template-columns:1fr}header svg{width:110px}h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="txt"><span class="tag">MATH 125 &middot; Week 4</span><h1>Rational Functions Explorer</h1><p>What happens when the denominator hits zero? Build rational functions, find asymptotes and holes, and zoom in on the action.</p></div>
 <svg viewBox="0 0 170 100" role="img" aria-label="Illustration: a hyperbola with dashed asymptotes and a divide by zero warning badge">
<rect width="170" height="100" fill="#f3f7fb"/>
<g stroke="#2a6fbb" stroke-width="2" stroke-dasharray="5 4"><line x1="85" y1="0" x2="85" y2="100"/></g>
<line x1="0" y1="50" x2="170" y2="50" stroke="#2e7d4f" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M8 56 C40 54 74 50 80 4" stroke="#d34147" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<path d="M90 96 C96 52 130 46 162 44" stroke="#d34147" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<circle cx="132" cy="22" r="14" fill="#fff" stroke="#a8353a" stroke-width="3"/>
<text x="132" y="27" font-size="14" font-weight="800" text-anchor="middle" fill="#a8353a">&#247;0</text>
<path d="M146 8 L158 20" stroke="#a8353a" stroke-width="3"/>
<text x="6" y="94" font-size="8" font-weight="700" fill="#1f2933">asymptotes</text>
</svg>
</header>

<div class="tabs" role="tablist" aria-label="Activities">
 <button data-p="pEx" aria-selected="true">1 &middot; Rational Builder</button>
 <button data-p="pAp" aria-selected="false">2 &middot; Approach the Asymptote</button>
 <button data-p="pQz" aria-selected="false">3 &middot; Hole, Asymptote or Neither?</button>
</div>

<section id="pEx" class="panel on">
 <div class="grid">
  <div class="card"><h2>Graph of the rational function</h2><svg id="xSvg" class="plot" aria-label="Rational function graph"></svg></div>
  <div class="card">
   <div class="ctl"><label for="xa">Scale a</label><input id="xa" type="range" min="-3" max="3" step="0.5" value="1"><output id="xav"></output></div>
   <div class="ctl"><label for="xz">Zero z (numerator)</label><input id="xz" type="range" min="-6" max="6" step="1" value="2"><output id="xzv"></output></div>
   <div class="ctl"><label for="xp">Asymptote p (denominator)</label><input id="xp" type="range" min="-6" max="6" step="1" value="-1"><output id="xpv"></output></div>
   <div class="row"><label class="chk"><input type="checkbox" id="xh"> Add a common factor (x &minus; h)</label></div>
   <div class="ctl"><label for="xhv">h</label><input id="xhv" type="range" min="-6" max="6" step="1" value="3"><output id="xhvv"></output></div>
   <div class="row"><label class="chk"><input type="checkbox" id="xn"> Extra factor (x &minus; 4) on top</label><label class="chk"><input type="checkbox" id="xd"> Extra factor (x + 4) on bottom</label></div>
   <div class="eq" id="xEq"></div>
   <ul class="facts" id="xFacts"></ul>
  </div>
 </div>
</section>

<section id="pAp" class="panel">
 <div class="grid">
  <div class="card"><h2>Zoom toward the vertical asymptote</h2><svg id="aSvg" class="plot" aria-label="Approach graph"></svg></div>
  <div class="card">
   <div class="row"><label for="aFn" style="font-weight:600">Function</label>
    <select id="aFn"><option value="0">f(x) = 1 &divide; (x &minus; 3)</option><option value="1">f(x) = (2x + 1) &divide; (x &minus; 1)</option><option value="2">f(x) = 1 &divide; (x + 2)&sup2;</option></select></div>
   <div class="row"><button class="btn alt" id="sL" aria-pressed="true">from the left</button><button class="btn alt" id="sR" aria-pressed="false">from the right</button></div>
   <div class="ctl"><label for="at">Closeness</label><input id="at" type="range" min="0" max="4" step="0.25" value="0.5"><output id="atv" style="min-width:70px"></output></div>
   <div class="eq" id="aEq"></div>
   <table class="t" id="aTab" aria-label="Values near asymptote"></table>
   <p class="note" id="aNote"></p>
  </div>
 </div>
</section>

<section id="pQz" class="panel">
 <div class="card">
  <span class="score" id="zScore"></span>
  <div class="q" id="zQ"></div>
  <div class="opts" id="zOpts"></div>
  <div class="fb" id="zFb" role="status" aria-live="polite"></div>
  <button class="btn" id="zNext">Next question &rarr;</button>
 </div>
</section>

</div>
<script>
const $=id=>document.getElementById(id);
const MINUS='\u2212';
function fmt(n,d){d=d===undefined?2:d;let r=Math.round(n*Math.pow(10,d))/Math.pow(10,d);if(Object.is(r,-0))r=0;return String(r).replace('-',MINUS);}
function sgn(n){return n<0?MINUS:'+';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
class Plot{
 constructor(svg,o){this.svg=svg;Object.assign(this,{w:600,h:400,xmin:-6,xmax:6,ymin:-6,ymax:6,pl:36,pr:12,pt:12,pb:24},o);
  svg.setAttribute('viewBox','0 0 '+this.w+' '+this.h);svg.setAttribute('role','img');
  this.id='c'+Math.random().toString(36).slice(2,8);}
 X(x){return this.pl+(x-this.xmin)/(this.xmax-this.xmin)*(this.w-this.pl-this.pr);}
 Y(y){return this.h-this.pb-(y-this.ymin)/(this.ymax-this.ymin)*(this.h-this.pt-this.pb);}
 open(){return '<defs><clipPath id="'+this.id+'"><rect x="'+this.pl+'" y="'+this.pt+'" width="'+(this.w-this.pl-this.pr)+'" height="'+(this.h-this.pt-this.pb)+'"/></clipPath></defs><rect x="'+this.pl+'" y="'+this.pt+'" width="'+(this.w-this.pl-this.pr)+'" height="'+(this.h-this.pt-this.pb)+'" fill="#fbfcfd" stroke="#dde1e6"/>';}
 grid(sx,sy){let s='<g font-size="11" fill="#52606d">';
  for(let x=Math.ceil(this.xmin/sx)*sx;x<=this.xmax+1e-9;x+=sx){const X=this.X(x);const ax=Math.abs(x)<1e-9;
   s+='<line x1="'+X+'" x2="'+X+'" y1="'+this.pt+'" y2="'+(this.h-this.pb)+'" stroke="'+(ax?'#1f2933':'#e4e7eb')+'" stroke-width="'+(ax?1.8:1)+'"/>';
   if(!ax)s+='<text x="'+X+'" y="'+(this.h-this.pb+14)+'" text-anchor="middle">'+fmt(x,1)+'</text>';}
  for(let y=Math.ceil(this.ymin/sy)*sy;y<=this.ymax+1e-9;y+=sy){const Y=this.Y(y);const ax=Math.abs(y)<1e-9;
   s+='<line y1="'+Y+'" y2="'+Y+'" x1="'+this.pl+'" x2="'+(this.w-this.pr)+'" stroke="'+(ax?'#1f2933':'#e4e7eb')+'" stroke-width="'+(ax?1.8:1)+'"/>';
   if(!ax)s+='<text x="'+(this.pl-5)+'" y="'+(Y+4)+'" text-anchor="end">'+fmt(y,1)+'</text>';}
  return s+'</g>';}
 curve(fn,o){o=Object.assign({color:'#d34147',width:3.5,dash:'',n:900,xa:this.xmin,xb:this.xmax},o||{});
  const R=this.ymax-this.ymin;let d='',pen=false,py=null;
  for(let i=0;i<=o.n;i++){const x=o.xa+(o.xb-o.xa)*i/o.n;let y;try{y=fn(x);}catch(e){y=NaN}
   if(!isFinite(y)||Math.abs(y)>1e6){pen=false;py=null;continue;}
   if(py!==null&&y*py<0&&Math.abs(y-py)>R*1.2){pen=false;}
   d+=(pen?'L':'M')+this.X(x).toFixed(1)+' '+this.Y(y).toFixed(1)+' ';pen=true;py=y;}
  return '<path clip-path="url(#'+this.id+')" d="'+d+'" fill="none" stroke="'+o.color+'" stroke-width="'+o.width+'" stroke-linecap="round" stroke-linejoin="round"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+'/>';}
 vline(x,c,dash){return '<line clip-path="url(#'+this.id+')" x1="'+this.X(x)+'" x2="'+this.X(x)+'" y1="'+this.pt+'" y2="'+(this.h-this.pb)+'" stroke="'+(c||'#2a6fbb')+'" stroke-width="2.2" stroke-dasharray="'+(dash||'7 5')+'"/>';}
 hline(y,c,dash){return '<line clip-path="url(#'+this.id+')" y1="'+this.Y(y)+'" y2="'+this.Y(y)+'" x1="'+this.pl+'" x2="'+(this.w-this.pr)+'" stroke="'+(c||'#2e7d4f')+'" stroke-width="2.2" stroke-dasharray="'+(dash||'7 5')+'"/>';}
 dot(x,y,c,r,hollow){if(x<this.xmin||x>this.xmax||y<this.ymin||y>this.ymax)return '';return '<circle cx="'+this.X(x)+'" cy="'+this.Y(y)+'" r="'+(r||6)+'" fill="'+(hollow?'#fff':c)+'" stroke="'+c+'" stroke-width="'+(hollow?3:2)+'"/>';}
 text(x,y,t,o){o=Object.assign({dx:8,dy:-8,c:'#1f2933',size:12,anchor:'start',bold:true},o||{});
  if(x<this.xmin||x>this.xmax||y<this.ymin||y>this.ymax)return '';
  return '<text x="'+(this.X(x)+o.dx)+'" y="'+(this.Y(y)+o.dy)+'" font-size="'+o.size+'" fill="'+o.c+'" text-anchor="'+o.anchor+'" font-weight="'+(o.bold?700:400)+'" paint-order="stroke" stroke="#fff" stroke-width="3">'+t+'</text>';}
}
function setSvg(svg,html){svg.innerHTML=html;}
function initTabs(){const tabs=[...document.querySelectorAll('.tabs button')];
 function show(id){tabs.forEach(t=>t.setAttribute('aria-selected',t.dataset.p===id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===id));report();}
 tabs.forEach(t=>{t.setAttribute('role','tab');t.onclick=()=>show(t.dataset.p);});}
function report(){const h=Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)+2;
 try{parent.postMessage({subject:'lti.frameResize',height:h},'*');parent.postMessage({type:'resize-iframe',height:h},'*');}catch(e){}}
window.addEventListener('load',report);window.addEventListener('resize',report);
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function slider(id,out,fn){const e=$(id);e.addEventListener('input',()=>{fn();});}


initTabs();
function rf(a,nr,dr){ // nr, dr arrays of roots; returns analysis
 const n=nr.slice(),d=dr.slice(),holes=[];
 for(let i=n.length-1;i>=0;i--){const j=d.indexOf(n[i]);if(j>=0){holes.push(n[i]);n.splice(i,1);d.splice(j,1);}}
 const f=x=>{let v=a;n.forEach(r=>v*=(x-r));d.forEach(r=>v/=(x-r));return v;};
 return {a,n,d,holes:[...new Set(holes)],f,vas:[...new Set(d)],xi:[...new Set(n)]};
}
function fac(r,k){const base=r===0?'x':'(x '+(r>0?MINUS:'+')+' '+Math.abs(r)+')';return base;}
function prodStr(rs,lead){let s=lead||'';if(!rs.length)return s||'1';return s+rs.map(r=>fac(r)).join('');}
// ---------- Builder ----------
const xp=new Plot($('xSvg'),{xmin:-8,xmax:8,ymin:-8,ymax:8,w:560,h:400});
function drawX(){
 let a=+$('xa').value;if(a===0){a=0.5;$('xa').value=a;}
 const z=+$('xz').value,p=+$('xp').value,h=+$('xhv').value,hasH=$('xh').checked,en=$('xn').checked,ed=$('xd').checked;
 $('xav').textContent=fmt(a,1);$('xzv').textContent=fmt(z,0);$('xpv').textContent=fmt(p,0);$('xhvv').textContent=fmt(h,0);
 $('xhv').disabled=!hasH;
 const nr=[z],dr=[p];if(hasH){nr.push(h);dr.push(h);}if(en)nr.push(4);if(ed)dr.push(-4);
 const R=rf(a,nr,dr);
 let s=xp.open()+xp.grid(2,2);
 R.vas.forEach(v=>{s+=xp.vline(v);s+=xp.text(v,7.2,'x = '+fmt(v,0),{dx:5,dy:0,c:'#2a6fbb',size:11});});
 const dn=R.n.length,dm=R.d.length;let ha=null;
 if(dn<dm)ha=0;else if(dn===dm)ha=a;
 if(ha!==null){s+=xp.hline(ha);s+=xp.text(-7.8,ha,'y = '+fmt(ha,2),{dx:0,dy:-6,c:'#2e7d4f',size:11});}
 s+=xp.curve(R.f,{n:1600});
 R.xi.forEach(r=>{s+=xp.dot(r,0,'#1f2933',5);});
 const y0=R.vas.includes(0)||R.holes.includes(0)?null:R.f(0);
 if(y0!==null)s+=xp.dot(0,y0,'#1f2933',5);
 R.holes.forEach(hh=>{s+=xp.dot(hh,R.f(hh),'#d34147',7,true)+xp.text(hh,R.f(hh),'hole ('+fmt(hh,0)+', '+fmt(R.f(hh),2)+')',{dx:9,dy:-9,c:'#a8353a',size:11});});
 setSvg($('xSvg'),s);
 const lead=a===1?'':a===-1?MINUS:fmt(a,1);
 $('xEq').innerHTML='f(x) = <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="display:block;border-bottom:2px solid #1f2933;padding:0 4px">'+prodStr(nr,lead)+'</span><span style="display:block;padding:0 4px">'+prodStr(dr)+'</span></span>';
 let F='<li><b>Domain:</b> all real numbers except '+([...new Set(dr)].map(v=>fmt(v,0)).sort((x,y)=>x-y).join(', ')||'none')+'</li>';
 F+='<li><b>Vertical asymptote'+(R.vas.length===1?'':'s')+':</b> '+(R.vas.length?R.vas.map(v=>'x = '+fmt(v,0)).join(', '):'none')+'</li>';
 F+='<li><b>Hole'+(R.holes.length===1?'':'s')+':</b> '+(R.holes.length?R.holes.map(hh=>'('+fmt(hh,0)+', '+fmt(R.f(hh),2)+')').join(', '):'none')+'</li>';
 F+='<li><b>Horizontal asymptote:</b> '+(ha===null?'none (numerator degree '+dn+' &gt; denominator degree '+dm+')':'y = '+fmt(ha,2)+(dn<dm?' (degree '+dn+' &lt; '+dm+')':' (equal degrees: ratio of leading coefficients)'))+'</li>';
 F+='<li><b>x-intercept'+(R.xi.length===1?'':'s')+':</b> '+(R.xi.length?R.xi.map(r=>fmt(r,0)).join(', '):'none')+' &nbsp; <b>y-int:</b> '+(y0===null?'none':fmt(y0,2))+'</li>';
 $('xFacts').innerHTML=F;
}
['xa','xz','xp','xh','xhv','xn','xd'].forEach(i=>$(i).addEventListener('input',drawX));drawX();

// ---------- Approach ----------
const ap=new Plot($('aSvg'),{xmin:-6,xmax:8,ymin:-10,ymax:10,w:560,h:400});
const FN=[{f:x=>1/(x-3),va:3,t:'1 \u00F7 (x \u2212 3)'},{f:x=>(2*x+1)/(x-1),va:1,t:'(2x + 1) \u00F7 (x \u2212 1)'},{f:x=>1/((x+2)*(x+2)),va:-2,t:'1 \u00F7 (x + 2)\u00B2'}];
let side=-1;
$('sL').onclick=()=>{side=-1;drawA();};$('sR').onclick=()=>{side=1;drawA();};
['aFn','at'].forEach(i=>$(i).addEventListener('input',drawA));
function big(v){return Math.abs(v)>=1e6?(v>0?'\u221E':MINUS+'\u221E')+' (huge)':fmt(v,2);}
function drawA(){
 const F=FN[+$('aFn').value],t=+$('at').value,d=Math.pow(10,-t);
 $('atv').textContent='d = '+(d>=0.01?fmt(d,2):d.toExponential(0));
 [['sL',side===-1],['sR',side===1]].forEach(([id,on])=>{const b=$(id);b.setAttribute('aria-pressed',on);b.style.background=on?'#d34147':'#fff';b.style.color=on?'#fff':'#1f2933';});
 const x=F.va+side*d,y=F.f(x);
 let s=ap.open()+ap.grid(2,2)+ap.vline(F.va)+ap.curve(F.f,{n:1600});
 s+=ap.text(F.va,9.2,'x = '+fmt(F.va,0),{dx:5,dy:0,c:'#2a6fbb',size:11});
 const cy=Math.max(-9.6,Math.min(9.6,y));
 s+='<circle cx="'+ap.X(x)+'" cy="'+ap.Y(cy)+'" r="8" fill="#ffd66b" stroke="#1f2933" stroke-width="2.5"/>';
 if(Math.abs(y)>9.6)s+='<text x="'+(ap.X(x)+(side===-1?-14:14))+'" y="'+(ap.Y(cy)+(y>0?24:-14))+'" font-size="12" font-weight="800" fill="#a8353a" text-anchor="'+(side===-1?'end':'start')+'" paint-order="stroke" stroke="#fff" stroke-width="3">off the chart: '+(y>0?'\u2191':'\u2193')+'</text>';
 setSvg($('aSvg'),s);
 $('aEq').textContent='f(x) = '+F.t;
 let tb='<tr><th>distance d</th><th>x</th><th>f(x)</th></tr>';
 [1,0.1,0.01,0.001,0.0001].forEach(dd=>{const xx=F.va+side*dd,yy=F.f(xx);const cur=Math.abs(dd-d)<dd*0.01;
  tb+='<tr'+(cur?' style="background:#fff3c4;font-weight:700"':'')+'><td>'+dd+'</td><td>'+fmt(xx,4)+'</td><td>'+big(yy)+'</td></tr>';});
 $('aTab').innerHTML=tb;
 const dirw=y>0?'\u221E':MINUS+'\u221E';
 $('aNote').innerHTML='As x approaches '+fmt(F.va,0)+' '+(side===-1?'from the left':'from the right')+', f(x) \u2192 <b>'+dirw+'</b>. Dividing by a number close to zero gives a huge answer.';
}
drawA();

// ---------- Quiz ----------
let zq=null,zt=0,zg=0;
function gcd(a,b){return b?gcd(b,a%b):Math.abs(a);}
function frac(p,q){const g=gcd(p,q);p/=g;q/=g;if(q<0){p=-p;q=-q;}return q===1?String(p).replace('-',MINUS):String(p).replace('-',MINUS)+'/'+q;}
function polyTxt(n,c){return (c===1?'':c===-1?MINUS:String(c).replace('-',MINUS))+'x'+(n>1?'<sup>'+n+'</sup>':'')+' '+pick(['+','\u2212'])+' '+rnd(1,9);}
function nextZ(){
 let q,opts,correct;
 if(Math.random()<0.5){
  let a=rnd(-4,4),b=rnd(-4,4),c=rnd(-4,4);while(b===a)b=rnd(-4,4);while(c===a||c===b)c=rnd(-4,4);
  const askHole=Math.random()<0.5,x0=askHole?a:c;
  const L=r=>r===0?'x':'(x '+(r>0?MINUS:'+')+' '+Math.abs(r)+')';
  q='f(x) = '+L(a)+L(b)+' \u00F7 ['+L(a)+L(c)+']<br><span style="font-size:15px;font-weight:600">What does the graph do at x = '+String(x0).replace('-',MINUS)+'?</span>';
  opts=['A hole','A vertical asymptote','An x-intercept','A horizontal asymptote'];
  correct=askHole?0:1;
  zq={correct:opts[correct],why:askHole?'The factor '+L(a)+' cancels, so there is a hole.':'The factor does not cancel, so it gives a vertical asymptote.'};
 }else{
  let n=rnd(1,3),m=rnd(1,3),p=pick([2,3,4,6,-3,-2]),qq_=pick([1,2,3]);if(p===qq_)p=4;
  q='f(x) = ('+polyTxt(n,p)+') \u00F7 ('+polyTxt(m,qq_)+')<br><span style="font-size:15px;font-weight:600">What is the horizontal asymptote?</span>';
  const ans=n<m?'y = 0':n===m?'y = '+frac(p,qq_):'No horizontal asymptote';
  opts=['y = 0','y = '+frac(p,qq_),'y = '+frac(qq_,p),'No horizontal asymptote'];
  opts=[...new Set(opts)];while(opts.length<4)opts.push('y = '+(opts.length+p));
  correct=opts.indexOf(ans);
  zq={correct:ans,why:n<m?'Numerator degree '+n+' is less than denominator degree '+m+', so y = 0.':n===m?'Equal degrees: divide the leading coefficients.':'Numerator degree '+n+' is greater than '+m+', so there is no horizontal asymptote.'};
 }
 $('zQ').innerHTML=q;zq.done=false;
 $('zOpts').innerHTML=shuffle(opts).map(o=>'<button class="opt">'+o+'</button>').join('');
 $('zFb').textContent='';$('zFb').className='fb';
 [...$('zOpts').children].forEach(b=>b.onclick=()=>{if(zq.done)return;zq.done=true;zt++;
  if(b.textContent===zq.correct){zg++;b.classList.add('ok');$('zFb').className='fb ok';$('zFb').textContent='Correct! '+zq.why;}
  else{b.classList.add('bad');[...$('zOpts').children].forEach(c=>{if(c.textContent===zq.correct)c.classList.add('ok');});$('zFb').className='fb bad';$('zFb').textContent='Not yet. '+zq.why;}
  $('zScore').textContent='Score: '+zg+' / '+zt;});
 report();
}
$('zNext').onclick=nextZ;nextZ();

</script>
</body>
</html>
