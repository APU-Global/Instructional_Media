<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Pillars of Psychology</title>
    <style>
        .diagram-wrapper {
            max-width: 900px;
            margin: 2rem auto;
            width: 100%;
        }
    </style>
</head>
<body>

    <main class="diagram-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" 
             viewBox="0 0 1000 1050" 
             width="100%" 
             height="100%" 
             role="img" 
             aria-labelledby="svg-title svg-desc"
             style="background-color: #ffffff;">
            
            <title id="svg-title">5 Pillars of Psychology</title>
            <desc id="svg-desc">
                A 5-circle Venn diagram depicting the core domains of psychology: Biological, Cognitive, Developmental, Social &amp; Personality, and Mental &amp; Physical Health.
            </desc>

            <defs>
                <style>
                    .title { font-family: sans-serif; font-weight: bold; font-size: 56px; fill: #111111; }
                    .domain-title { font-family: sans-serif; font-weight: bold; font-size: 26px; fill: #000000; }
                    .domain-text { font-family: sans-serif; font-size: 22px; fill: #111111; }
                    .center-text { font-family: sans-serif; font-weight: bold; font-size: 24px; fill: #111111; }
                </style>
            </defs>

            <text x="500" y="90" text-anchor="middle" class="title">5 Pillars of Psychology</text>

            <g aria-hidden="true" style="mix-blend-mode: multiply;">
                <circle cx="500" cy="400" r="290" fill="#e4d3a2" opacity="0.5" />
                <circle cx="652" cy="510" r="290" fill="#eebc96" opacity="0.5" />
                <circle cx="594" cy="689" r="290" fill="#d5b8d5" opacity="0.5" />
                <circle cx="406" cy="689" r="290" fill="#9ececc" opacity="0.5" />
                <circle cx="348" cy="510" r="290" fill="#aed5b9" opacity="0.5" />
            </g>

            <g role="group" aria-label="Domains of Psychology and Guiding Questions">
                <g role="region" aria-label="Biological Domain">
                    <text x="500" y="210" text-anchor="middle">
                        <tspan class="domain-title">Biological</tspan>
                        <tspan x="500" dy="32" class="domain-text">How does activity in</tspan>
                        <tspan x="500" dy="28" class="domain-text">your brain and body</tspan>
                        <tspan x="500" dy="28" class="domain-text">give rise to your</tspan>
                        <tspan x="500" dy="28" class="domain-text">thoughts, feelings, and</tspan>
                        <tspan x="500" dy="28" class="domain-text">actions?</tspan>
                    </text>
                </g>

                <g role="region" aria-label="Cognitive Domain">
                    <text x="810" y="450" text-anchor="middle">
                        <tspan class="domain-title">Cognitive</tspan>
                        <tspan x="810" dy="32" class="domain-text">How do your mental</tspan>
                        <tspan x="810" dy="28" class="domain-text">activities affect your</tspan>
                        <tspan x="810" dy="28" class="domain-text">thoughts, feelings,</tspan>
                        <tspan x="810" dy="28" class="domain-text">and actions?</tspan>
                    </text>
                </g>

                <g role="region" aria-label="Developmental Domain">
                    <text x="710" y="770" text-anchor="middle">
                        <tspan class="domain-title">Developmental</tspan>
                        <tspan x="710" dy="32" class="domain-text">How do you change</tspan>
                        <tspan x="710" dy="28" class="domain-text">over your life—from</tspan>
                        <tspan x="710" dy="28" class="domain-text">birth through old age—in</tspan>
                        <tspan x="710" dy="28" class="domain-text">terms of your thoughts,</tspan>
                        <tspan x="710" dy="28" class="domain-text">feelings, and actions?</tspan>
                    </text>
                </g>

                <g role="region" aria-label="Social and Personality Domain">
                    <text x="290" y="770" text-anchor="middle">
                        <tspan class="domain-title">Social &amp; personality</tspan>
                        <tspan x="290" dy="32" class="domain-text">How do social factors</tspan>
                        <tspan x="290" dy="28" class="domain-text">and your personal</tspan>
                        <tspan x="290" dy="28" class="domain-text">characteristics impact</tspan>
                        <tspan x="290" dy="28" class="domain-text">your thoughts,</tspan>
                        <tspan x="290" dy="28" class="domain-text">feelings, and</tspan>
                        <tspan x="290" dy="28" class="domain-text">actions?</tspan>
                    </text>
                </g>

                <g role="region" aria-label="Mental and Physical Health Domain">
                    <text x="200" y="440" text-anchor="middle">
                        <tspan class="domain-title">Mental &amp; physical</tspan>
                        <tspan x="200" dy="30" class="domain-title">health</tspan>
                        <tspan x="200" dy="34" class="domain-text">What affects your</tspan>
                        <tspan x="200" dy="28" class="domain-text">mental and physical</tspan>
                        <tspan x="200" dy="28" class="domain-text">health, and how can</tspan>
                        <tspan x="200" dy="28" class="domain-text">you develop healthy</tspan>
                        <tspan x="200" dy="28" class="domain-text">behaviors?</tspan>
                    </text>
                </g>

                <g role="region" aria-label="Central Intersection">
                    <text x="500" y="565" text-anchor="middle">
                        <tspan class="center-text">Interdisciplinary</tspan>
                        <tspan x="500" dy="30" class="center-text">approaches</tspan>
                    </text>
                </g>
            </g>
        </svg>
    </main>

</body>
</html>
