<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORGS 340 Week 3 | The Interview Room</title>
<style>
:root{--ink:#222;--muted:#5a5a5a;--red:#d34147;--red-d:#a8353a;--red-l:#fbe9ea;--bg:#faf7f3;--card:#fff;--line:#e2dbd3;--teal:#1f7a8c;--teal-l:#e3f2f5;--gold:#e9a23b;--gold-l:#fdf3df;--ok:#2e7d4f;--ok-l:#e5f4ea;--bad:#b3261e;--bad-l:#fdecea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);color-scheme:light;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{height:100%;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:14px;padding:8px 18px;background:#222;color:#fff;border-bottom:4px solid var(--red)}
.top svg{width:84px;height:52px;flex:none}
.kicker{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#f3b0b3;font-weight:700}
h1{font-size:20px;margin:0;line-height:1.2}
h2{font-size:19px;margin:0 0 4px;line-height:1.25}
h3{font-size:16px;margin:0 0 4px}
.steps{margin-left:auto;display:flex;gap:6px}
.dot{width:24px;height:6px;border-radius:3px;background:#5b5b5b}
.dot.on{background:var(--red)}.dot.done{background:#fff}
.stage{flex:1;min-height:0;overflow:auto;padding:14px 18px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lead{color:var(--muted);margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{font:inherit;font-weight:600;cursor:pointer;border:2px solid var(--red);background:var(--red);color:#fff;border-radius:999px;padding:8px 20px}
.btn:hover{background:var(--red-d);border-color:var(--red-d)}
.btn.ghost{background:#fff;color:var(--red-d)}
.btn.ghost:hover{background:var(--red-l)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 8px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--teal);background:var(--teal-l)}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}
.opt.no{border-color:var(--bad);background:var(--bad-l)}
.opt.sel{border-color:var(--teal);background:var(--teal-l)}
.opt[disabled]{cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fb{border-radius:10px;padding:8px 12px;margin:2px 0 10px;font-size:15px;border-left:5px solid}
.fb.ok{background:var(--ok-l);border-color:var(--ok)}
.fb.no{background:var(--bad-l);border-color:var(--bad)}
.fb.info{background:var(--gold-l);border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;height:100%}
.intro svg{width:100%;height:auto;max-height:100%}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--red-l);color:var(--red-d);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.meter{height:12px;border-radius:6px;background:#e9e4de;overflow:hidden}
.meter>i{display:block;height:100%;width:0;border-radius:6px;transition:width .4s}
.score{font-size:42px;font-weight:800;color:var(--red-d);line-height:1}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.meter>i{transition:none}}
@media (max-width:720px){
 .grid2,.intro{grid-template-columns:1fr}
 .intro svg{max-height:150px}
 h1{font-size:17px}.top svg{display:none}.stage{padding:10px 12px}
}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div id="hero-mini"></div>
    <div><div class="kicker">ORGS 340 · Week 3</div><h1>The Interview Room</h1></div>
    <div class="steps" id="steps" aria-hidden="true"></div>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const stage=$('#stage');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
$('#hero-mini').innerHTML=`<svg viewBox="0 0 84 52" role="img" aria-label="Two people at a table"><rect x="4" y="38" width="76" height="6" rx="3" fill="#d34147"/><circle cx="24" cy="16" r="9" fill="#f3d2b3"/><path d="M10 38a14 14 0 0 1 28 0z" fill="#fff"/><circle cx="60" cy="16" r="9" fill="#f3d2b3"/><path d="M46 38a14 14 0 0 1 28 0z" fill="#1f7a8c"/></svg>`;
const R={bias:0,biasT:0,listen:0,listenT:0,star:0,starT:0};
const ROUNDS=['Bias check','Active listening','Tell your story'];
function steps(c){$('#steps').innerHTML=[0,1,2,3,4].map(k=>`<i class="dot ${k<c?'done':k===c?'on':''}"></i>`).join('')}

function intro(){
 Object.assign(R,{bias:0,biasT:0,listen:0,listenT:0,star:0,starT:0});steps(0);
 stage.innerHTML=`<div class="intro fade">
 <svg viewBox="0 0 440 300" role="img" aria-label="An interview room with an interviewer and a candidate across a table with speech bubbles">
  <rect width="440" height="300" rx="18" fill="#fff" stroke="#e2dbd3"/>
  <rect x="0" y="206" width="440" height="94" rx="0" fill="#f1ebe4"/><rect x="0" y="206" width="440" height="2" fill="#e2dbd3"/>
  <rect x="30" y="40" width="80" height="60" rx="6" fill="#e3f2f5" stroke="#1f7a8c" stroke-width="3"/><path d="M40 90l18-24 14 16 10-10 18 18z" fill="#1f7a8c" opacity=".5"/><circle cx="90" cy="56" r="7" fill="#e9a23b"/>
  <rect x="90" y="176" width="260" height="14" rx="7" fill="#d34147"/><rect x="108" y="190" width="10" height="46" fill="#a8353a"/><rect x="322" y="190" width="10" height="46" fill="#a8353a"/>
  <circle cx="100" cy="116" r="20" fill="#f3d2b3"/><path d="M72 176a28 40 0 0 1 56 0z" fill="#222"/><path d="M80 104a20 18 0 0 1 40 0c-8-8-30-8-40 0z" fill="#222"/>
  <circle cx="340" cy="116" r="20" fill="#e8c29a"/><path d="M312 176a28 40 0 0 1 56 0z" fill="#1f7a8c"/><path d="M320 108a20 20 0 0 1 40 0c-10-6-30-6-40 0z" fill="#5b3a29"/>
  <rect x="150" y="84" width="140" height="58" rx="14" fill="#fff" stroke="#e9a23b" stroke-width="3"/><path d="M290 120l16 10-6-22z" fill="#fff" stroke="#e9a23b" stroke-width="3" stroke-linejoin="round"/>
  <text x="220" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#222">“Tell me about</text><text x="220" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#222">a time when…”</text>
  <rect x="160" y="30" width="120" height="30" rx="15" fill="#fbe9ea" stroke="#d34147" stroke-width="2"/><text x="220" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#a8353a">Listen first</text>
  <g font-size="13" font-weight="800" fill="#222" text-anchor="middle"><rect x="30" y="246" width="120" height="34" rx="17" fill="#fdf3df" stroke="#e9a23b" stroke-width="2"/><text x="90" y="268">1 · Check bias</text><rect x="160" y="246" width="120" height="34" rx="17" fill="#e3f2f5" stroke="#1f7a8c" stroke-width="2"/><text x="220" y="268">2 · Listen</text><rect x="290" y="246" width="120" height="34" rx="17" fill="#fbe9ea" stroke="#d34147" stroke-width="2"/><text x="350" y="268">3 · Tell it</text></g>
 </svg>
 <div>
  <span class="chip">Interactive · 3 rounds</span>
  <h2>An interview is a two-way conversation.</h2>
  <p class="lead">Both sides are listening, evaluating, and communicating. Step into the room: ask fair questions, listen with full attention, then answer with evidence using the STAR pattern.</p>
  <p class="small muted" style="margin:0 0 14px">Think about it: How do your assumptions about a person or a company shape the way you listen to them?</p>
  <button class="btn" id="go">Enter the room</button>
 </div></div>`;
 $('#go').onclick=bias;
}

/* ROUND 1 */
const Q=[
["Tell me about a time you resolved a conflict on a team.",1,"Behavioral and job-related. Every candidate can be asked the same thing.",""],
["Are you planning to start a family soon?",0,"Personal and not related to job performance. It invites bias.","Rewrite: “This role requires occasional travel. Are you able to meet that requirement?”"],
["That’s an interesting name. Where are you really from?",0,"Asks about origin, not ability. It singles out a candidate.","Rewrite: “What experience do you have working with international clients?”"],
["Describe a project where you met a tight deadline.",1,"Specific, job-related, and gives the candidate a way to show evidence."],
["You’re a bit older than our typical hire. Will you fit in with the team?",0,"Rests on an assumption about age, not on skills.","Rewrite: “How do you build working relationships with new teammates?”"],
["How would you handle a customer who disagrees with a decision you made?",1,"A consistent, job-related scenario question."]
];
function bias(){
 steps(1);let done=0;
 stage.innerHTML=`<div class="fade"><span class="chip">Round 1 · Bias check</span>
 <div class="row" style="margin-bottom:8px"><div><h2 style="margin:0">Which questions belong in a fair interview?</h2><div class="small muted">Use consistent, job-related questions for every candidate. Mark each one, then read the coaching.</div></div><span class="spacer"></span><div id="nx"></div></div>
 <div id="ql" class="grid2" style="gap:8px">${Q.map((q,i)=>`<div class="card" style="padding:8px 12px" data-i="${i}"><div>“${q[0]}”</div><div class="row" style="margin-top:6px"><button class="btn ghost small" data-a="1" style="padding:3px 14px">Ask it</button><button class="btn ghost small" data-a="0" style="padding:3px 14px">Rewrite it</button></div><div class="fbx small" style="margin-top:6px"></div></div>`).join('')}</div></div>`;
 document.querySelectorAll('#ql .card').forEach(c=>{
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>{
   const q=Q[+c.dataset.i];const ok=(+b.dataset.a)===q[1];R.biasT++;if(ok)R.bias++;done++;
   c.querySelectorAll('button').forEach(x=>x.disabled=true);
   c.style.borderColor=ok?'var(--ok)':'var(--bad)';c.style.background=ok?'var(--ok-l)':'var(--bad-l)';
   c.querySelector('.fbx').innerHTML=`<b>${ok?'Correct.':'Look again.'}</b> ${q[2]} ${q[3]?'<i>'+q[3]+'</i>':''}`;
   if(done===Q.length)$('#nx').innerHTML=`<button class="btn" id="n">Continue to Round 2</button>`,$('#n').onclick=listen;
  });
 });
}

/* ROUND 2 */
const L=[
{who:"Candidate",say:"“At my last job we missed a launch date. I was frustrated at first, but I met with the team and we rebuilt the schedule together.”",ask:"As the interviewer, what do you do next?",o:[
 ["Paraphrase and ask a follow-up: “So you brought the team together to reset the plan. What changed in how you scheduled after that?”",1,"Paraphrasing shows you heard the point, and an open follow-up invites more evidence."],
 ["Share your own missed-deadline story for the next two minutes.",0,"Active listening keeps the focus on the speaker."],
 ["Look at your notes and say, “Okay, next question.”",0,"Moving on without a response signals you were not really listening."]]},
{who:"Candidate",say:"The candidate speaks softly, avoids eye contact, and crosses their arms while answering.",ask:"Non-verbal cues can support or contradict words. What is the best response?",o:[
 ["Decide they lack confidence and mark them down.",0,"That is an assumption. Culture, nerves, or personality can all shape body language."],
 ["Smile, relax your own posture, and say, “Take your time. I’m glad to hear more.”",1,"You lower the pressure and keep the judgment on the content of the answer."],
 ["Tell them to sit up straight and speak louder.",0,"Corrective comments damage trust and do not help you learn about their skills."]]},
{who:"Candidate",say:"“I led the volunteer program at my church, and our team doubled the number of families we served.”",ask:"You are a Christian leader trying to listen “through God’s eyes and ears.” What response fits?",o:[
 ["“That’s nice, but this is a business role.”",0,"Dismissive. It fails to value the person and the evidence of leadership they offered."],
 ["“Thank you for sharing that. What did you do to help the team grow?”",1,"Listens with humility and seeks to understand before evaluating."],
 ["“Do you plan to keep doing volunteer work instead of focusing on this job?”",0,"This makes an assumption about the candidate’s priorities."]]}
];
function listen(){
 steps(2);let i=0;
 const show=()=>{
  const s=L[i];const opts=shuffle(s.o);
  stage.innerHTML=`<div class="fade"><span class="chip">Round 2 · Active listening · ${i+1} of ${L.length}</span>
  <div class="grid2" style="margin-top:4px"><div>
   <div class="card" style="background:#fff;border-left:6px solid var(--teal)"><svg viewBox="0 0 60 60" style="width:42px;height:42px;float:left;margin-right:10px"><circle cx="30" cy="22" r="12" fill="#e8c29a"/><path d="M8 56a22 22 0 0 1 44 0z" fill="#1f7a8c"/></svg><div class="small muted"><b>${s.who}</b></div><div>${s.say}</div></div>
   <p style="margin:12px 0 0"><b>${s.ask}</b></p>
   <div style="margin-top:10px"><svg viewBox="0 0 200 60" style="width:100%;max-width:280px" role="img" aria-label="Active listening: attend, paraphrase, ask"><g font-size="11" font-weight="700" text-anchor="middle"><rect x="2" y="8" width="60" height="40" rx="10" fill="#e3f2f5" stroke="#1f7a8c" stroke-width="2"/><text x="32" y="32">Attend</text><rect x="70" y="8" width="60" height="40" rx="10" fill="#fdf3df" stroke="#e9a23b" stroke-width="2"/><text x="100" y="32">Reflect</text><rect x="138" y="8" width="60" height="40" rx="10" fill="#fbe9ea" stroke="#d34147" stroke-width="2"/><text x="168" y="32">Ask</text></g></svg></div>
   </div>
   <div><div id="oo">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o[0]}</button>`).join('')}</div><div id="fb"></div><div id="nx"></div></div></div></div>`;
  document.querySelectorAll('#oo .opt').forEach(b=>b.onclick=()=>{
   const o=opts[+b.dataset.k];R.listenT++;if(o[1])R.listen++;
   document.querySelectorAll('#oo .opt').forEach((x,k)=>{x.disabled=true;if(opts[k][1])x.classList.add('ok')});if(!o[1])b.classList.add('no');
   $('#fb').innerHTML=`<div class="fb ${o[1]?'ok':'no'}"><b>${o[1]?'Well done.':'Not the best choice.'}</b> ${o[2]}</div>`;
   $('#nx').innerHTML=`<button class="btn" id="n">${i<L.length-1?'Next moment':'Continue to Round 3'}</button>`;
   $('#n').onclick=()=>{i++;i<L.length?show():star()};
  });
 };show();
}

/* ROUND 3 */
const ST=[
{k:"S",name:"Situation",hint:"Set the scene.",o:[
 ["Last spring, our team had three weeks to open a new customer help desk before a major product launch.",1,"Specific and brief: who, what, and when."],
 ["I have always been good under pressure at every job I’ve had.",0,"A claim, not an example."],
 ["There was this one time at work that was kind of stressful.",0,"Too vague to be useful."]]},
{k:"T",name:"Task",hint:"Define your responsibility.",o:[
 ["My manager asked me to train six new agents and build the call scripts.",1,"Shows exactly what you were responsible for."],
 ["Honestly, nobody else on the team was doing anything.",0,"Blames others instead of describing your role."],
 ["I was involved in the project.",0,"Does not say what you were accountable for."]]},
{k:"A",name:"Action",hint:"Describe what you did.",o:[
 ["I split the training into daily sessions, wrote scripts with the team, and checked progress every Friday.",1,"Concrete steps that show skills the role requires."],
 ["We all just worked really hard together.",0,"“We” and “hard” hide your own contribution."],
 ["I did everything myself because I can’t trust anyone else.",0,"Not honest teamwork and raises red flags for the interviewer."]]},
{k:"R",name:"Result",hint:"Share the outcome.",o:[
 ["The help desk opened on time and first-week customer satisfaction was 92%. I learned to build in time for feedback.",1,"Clear result plus honest reflection."],
 ["It went pretty well, I guess.",0,"No measurable result."],
 ["We were flawless and I deserve most of the credit.",0,"Overclaiming erodes trust and lacks humility."]]}
];
function star(){
 steps(3);let i=0;const got=[];
 const draw=()=>{
  const s=ST[i];const opts=shuffle(s.o);
  stage.innerHTML=`<div class="fade"><span class="chip">Round 3 · Build a STAR answer</span>
  <p style="margin:0 0 6px"><b>Interview question:</b> “Tell me about a time you handled a tight deadline.”</p>
  <div class="grid2"><div>
   <div class="row" style="gap:6px;margin-bottom:8px">${ST.map((x,k)=>`<span style="flex:1;text-align:center;font-weight:800;border-radius:10px;padding:6px 0;border:2px solid ${k<i?'var(--ok)':k===i?'var(--red)':'var(--line)'};background:${k<i?'var(--ok-l)':k===i?'var(--red-l)':'#fff'}">${x.k}<span class="small" style="display:block;font-weight:600">${x.name}</span></span>`).join('')}</div>
   <h3>${s.k} · ${s.name}: ${s.hint}</h3><div id="oo">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o[0]}</button>`).join('')}</div><div id="fb"></div>
  </div><div class="card" style="min-height:170px;background:var(--gold-l);border-color:var(--gold)"><div class="row" style="margin-bottom:4px"><svg viewBox="0 0 40 40" style="width:28px;height:28px"><polygon points="20,3 25,15 38,16 28,25 31,38 20,31 9,38 12,25 2,16 15,15" fill="#e9a23b" stroke="#222" stroke-width="2" stroke-linejoin="round"/></svg><b>Your answer so far</b></div><div id="ans" class="small">${got.map(g=>`<p style="margin:0 0 6px"><b>${g.k}.</b> ${g.t}</p>`).join('')||'<span class="muted">Choose a sentence for each part of the story.</span>'}</div></div></div></div>`;
  document.querySelectorAll('#oo .opt').forEach(b=>b.onclick=()=>{
   const o=opts[+b.dataset.k];
   if(!o[1]){b.disabled=true;b.classList.add('no');window._missThis=true;$('#fb').innerHTML=`<div class="fb no"><b>Not yet.</b> ${o[2]} Try again.</div>`;return}
   R.starT++;if(!window._missThis)R.star++;window._missThis=false;
   document.querySelectorAll('#oo .opt').forEach(x=>x.disabled=true);b.classList.add('ok');
   got.push({k:s.k,t:o[0]});$('#fb').innerHTML=`<div class="fb ok"><b>Good.</b> ${o[2]}</div><button class="btn" id="n">${i<ST.length-1?'Next part':'Finish'}</button>`;
   $('#ans').innerHTML=got.map(g=>`<p style="margin:0 0 6px"><b>${g.k}.</b> ${g.t}</p>`).join('');
   $('#n').onclick=()=>{i++;i<ST.length?draw():end()};
  });
 };draw();
}

function end(){
 steps(4);
 const tot=R.bias+R.listen;const max=R.biasT+R.listenT;
 stage.innerHTML=`<div class="grid2 fade"><div class="card" style="text-align:center">
  <div class="score">${tot}<span style="font-size:22px;color:#5a5a5a">/${max}</span></div><div class="muted" style="margin:4px 0 10px">correct in bias check and listening</div>
  <div style="text-align:left" class="small"><div class="row" style="margin-bottom:6px"><span style="width:130px">Bias check</span><div class="meter spacer"><i style="width:${R.bias/R.biasT*100}%;background:var(--gold)"></i></div><b>${R.bias}/${R.biasT}</b></div>
  <div class="row" style="margin-bottom:10px"><span style="width:130px">Active listening</span><div class="meter spacer"><i style="width:${R.listen/R.listenT*100}%;background:var(--teal)"></i></div><b>${R.listen}/${R.listenT}</b></div></div>
  <p class="small" style="margin:0 0 10px">You also built a complete STAR answer. Use it as a model for your own behavioral questions.</p>
  <button class="btn ghost" id="again">Play again</button></div>
  <div><h2>Takeaways</h2><ul style="padding-left:20px;margin:6px 0 10px">
   <li><b>Audience first.</b> A non-biased, audience-centered message is more likely to be understood.</li>
   <li><b>Prepare to listen.</b> Practice active listening, not only answers.</li>
   <li><b>Check your biases.</b> Awareness improves both questions and judgments.</li>
   <li><b>Give constructive feedback.</b> Specific, respectful feedback helps others grow.</li></ul>
   <div class="fb info"><b>Listening through God’s eyes and ears</b> means giving the speaker full attention, seeking to understand before you evaluate, and letting respect and grace shape your feedback.</div></div></div>`;
 $('#again').onclick=intro;
}
intro();
</script>

</body>
</html>
