<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSYC 405 Physiological Psychology | Week 6 | The Stress Response</title>
<style>
:root{--ink:#1f2a37;--muted:#5b6672;--accent:#b8323a;--bg:#f7f5f2;--card:#fff;--line:#e1ddd6;--gold:#f2b705;--epi:#d9541e;--cort:#2b6cb0}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{height:100%;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
header{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.chip{background:var(--accent);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
h1{font-size:clamp(15px,2.4vw,19px);margin:0;line-height:1.2}
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:0;min-width:0}
.stage{padding:4px;display:flex}
.stage svg{flex:1;min-height:0;width:100%}
.panel{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:600;color:var(--ink)}
.sbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{border:2px solid var(--line);background:#fff;border-radius:10px;padding:5px 6px;text-align:left;font-size:11.5px;line-height:1.2;color:var(--muted);font-weight:600}
.step b{display:block;color:var(--ink);font-size:12.5px}
.step[aria-current="step"]{border-color:var(--accent);background:#fdf0ee;color:var(--ink)}
.step.done b::before{content:"✓ ";color:#2e8b57}
.go{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
.seg{display:inline-flex;background:#ebe7e0;padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.chartbox{flex:1;min-height:0;display:flex;background:#fbfaf8;border:1px solid var(--line);border-radius:10px;padding:2px}
.chartbox svg{flex:1;min-height:0;width:100%}
.chips .sbtn{padding:4px 8px;font-size:12px}
.note{font-size:12.5px;line-height:1.38;background:#fff7e6;border-left:4px solid var(--gold);border-radius:6px;padding:7px 10px}
.note b{display:block;margin-bottom:1px}
.cap{font-size:10.5px;color:var(--muted)}
/* svg states */
.nd{transition:filter .4s,opacity .4s}
.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:7 7;opacity:0;transition:opacity .4s}
.flow.on{opacity:1;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.glow{opacity:0;transition:opacity .4s}
.glow.on{opacity:1}
.pulse.on{animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
@media (max-width:640px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,.9fr) minmax(0,1.5fr)}
  .panel{padding:8px 10px;gap:6px}.note{font-size:11.5px;padding:5px 8px}
  .step{padding:4px;font-size:10px}.step b{font-size:11px}
  .sbtn{padding:5px 7px;font-size:11.5px}.cap{display:none}
}
@media (prefers-reduced-motion:reduce){.flow.on,.pulse.on{animation:none}.nd,.flow,.glow{transition:none}}
</style>
</head>
<body>
<div class="app">
<header><span class="chip">Week 6</span><h1>The Stress Response: Two Systems, One Body</h1></header>
<div class="main">
  <div class="card stage">
  <svg id="art" viewBox="0 0 420 470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="at ad">
    <title id="at">Stress pathways from brain to adrenal glands</title>
    <desc id="ad">Cutaway brain showing amygdala, hippocampus, prefrontal cortex, hypothalamus and pituitary, with pathways down to the adrenal glands above the kidneys.</desc>
    <defs>
      <radialGradient id="g1"><stop offset="0" stop-color="#ff5a4a" stop-opacity=".8"/><stop offset="1" stop-color="#ff5a4a" stop-opacity="0"/></radialGradient>
      <radialGradient id="g2"><stop offset="0" stop-color="#3b82d6" stop-opacity=".7"/><stop offset="1" stop-color="#3b82d6" stop-opacity="0"/></radialGradient>
      <linearGradient id="br" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cfd3"/><stop offset="1" stop-color="#efb6bc"/></linearGradient>
    </defs>
    <!-- brain -->
    <path d="M58 142C48 70 122 26 212 24C302 22 362 70 354 142C348 192 302 216 242 216C202 216 152 218 112 202C80 192 62 172 58 142Z" fill="url(#br)" stroke="#b8323a" stroke-width="3"/>
    <path d="M120 60c18 10 20 30 6 40M200 44c-6 16 8 28 0 44M280 56c-12 10-8 28 6 34M310 120c-18-4-30 8-26 24" stroke="#c97a84" stroke-width="2" fill="none"/>
    <!-- brainstem + spinal cord -->
    <path d="M205 210h24v70c0 14 0 26 4 40v40" fill="none" stroke="#e8d59a" stroke-width="14" stroke-linecap="round"/>
    <path d="M205 210h24v70c0 14 0 26 4 40v40" fill="none" stroke="#a88a2c" stroke-width="1.5" stroke-dasharray="3 5"/>
    <!-- kidneys & adrenals -->
    <g id="kidL"><path d="M96 410c-18-16-8-46 18-44 20 2 26 22 18 34-8 16-24 22-36 10z" fill="#c98f86" stroke="#8a4b43" stroke-width="2.5"/></g>
    <g id="kidR"><path d="M324 410c18-16 8-46-18-44-20 2-26 22-18 34 8 16 24 22 36 10z" fill="#c98f86" stroke="#8a4b43" stroke-width="2.5"/></g>
    <g id="adL"><path d="M112 372c4-14 24-14 30 0 4 8-4 14-14 14s-18-6-16-14z" fill="#f0a640" stroke="#a15f08" stroke-width="2"/><circle cx="127" cy="376" r="5.5" fill="#a02a2a" id="medL"/></g>
    <g id="adR"><path d="M278 372c4-14 24-14 30 0 4 8-4 14-14 14s-18-6-16-14z" fill="#f0a640" stroke="#a15f08" stroke-width="2"/><circle cx="293" cy="376" r="5.5" fill="#a02a2a" id="medR"/></g>
    <!-- glows -->
    <circle class="glow" id="gAm" cx="200" cy="158" r="34" fill="url(#g1)"/>
    <circle class="glow" id="gHy" cx="172" cy="186" r="30" fill="url(#g1)"/>
    <circle class="glow" id="gPi" cx="172" cy="220" r="26" fill="url(#g2)"/>
    <circle class="glow" id="gAd" cx="127" cy="376" r="34" fill="url(#g2)"/>
    <circle class="glow" id="gAd2" cx="293" cy="376" r="34" fill="url(#g2)"/>
    <circle class="glow" id="gMe" cx="127" cy="376" r="26" fill="url(#g1)"/>
    <circle class="glow" id="gMe2" cx="293" cy="376" r="26" fill="url(#g1)"/>
    <!-- regions -->
    <ellipse cx="98" cy="118" rx="38" ry="32" fill="#8db8e8" stroke="#2b5d9b" stroke-width="2.5"/>
    <path d="M232 146c10-14 36-12 42 6 4 12-6 22-18 20-12 2-10-8-24-26z" fill="#7fc79a" stroke="#2e7d4f" stroke-width="2.5" id="hip"/>
    <circle cx="200" cy="158" r="14" fill="#e45a52" stroke="#8c1f27" stroke-width="2.5"/>
    <ellipse cx="172" cy="186" rx="13" ry="9" fill="#f2a53a" stroke="#a15f08" stroke-width="2.5"/>
    <path d="M172 195v14" stroke="#a15f08" stroke-width="3"/>
    <circle cx="172" cy="220" r="9" fill="#9c6ad0" stroke="#58308a" stroke-width="2.5"/>
    <!-- flows -->
    <path class="flow" id="f1" d="M196 150C190 160 186 170 180 180" stroke="#e45a52"/>
    <path class="flow" id="f2" d="M180 192C198 230 224 244 230 290C232 330 280 340 296 366" stroke="#d9541e"/>
    <path class="flow" id="f3" d="M172 195v14" stroke="#e08a1e"/>
    <path class="flow" id="f4a" d="M172 230C130 290 96 330 124 362" stroke="#2b6cb0"/>
    <path class="flow" id="f4b" d="M178 230C250 290 330 320 300 362" stroke="#2b6cb0"/>
    <path class="flow" id="f5" d="M306 366C390 300 372 200 270 168" stroke="#2b6cb0"/>
    <path class="flow" id="f5b" d="M250 156C230 170 200 182 186 188" stroke="#2e7d4f"/>
    <path class="flow" id="f5c" d="M130 124C160 140 180 150 188 154" stroke="#2b5d9b"/>
    <!-- labels -->
    <g font-size="11.5" font-weight="700" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" fill="#33404d">
      <text x="62" y="82">Prefrontal cortex</text>
      <text x="250" y="132" fill="#1e6a40">Hippocampus</text>
      <text x="222" y="178" fill="#8c1f27">Amygdala</text>
      <text x="92" y="196" fill="#8a5206">Hypothalamus</text>
      <text x="190" y="238" fill="#58308a">Pituitary</text>
      <text x="68" y="440" fill="#8a5206">Adrenal gland</text>
      <text x="252" y="440" fill="#8a5206">Adrenal gland</text>
      <text x="236" y="300" fill="#a15f08" id="lbS" opacity="0">Sympathetic nerves</text>
    </g>
    <g font-size="10.5" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">
      <text x="330" y="336" fill="#d9541e" id="lE" opacity="0">Epinephrine</text>
      <text x="30" y="330" fill="#2b6cb0" id="lA" opacity="0">ACTH (blood)</text>
      <text x="318" y="232" fill="#2b6cb0" id="lC" opacity="0">Cortisol</text>
      <text x="124" y="156" fill="#a15f08" id="lR" opacity="0">CRH</text>
    </g>
    <text id="lFb" x="290" y="250" font-size="10.5" font-weight="700" fill="#2b6cb0" stroke="#fff" stroke-width="3" paint-order="stroke" opacity="0">feedback</text>
  </svg>
  </div>

  <div class="card panel">
    <div>
      <div class="lbl">Follow the response</div>
      <div class="steps" id="steps" role="group" aria-label="Stress response steps">
        <button class="step" data-i="0"><b>1 Detect</b>Amygdala</button>
        <button class="step" data-i="1"><b>2 Fast</b>Sympathetic</button>
        <button class="step" data-i="2"><b>3 Slow</b>HPA axis</button>
        <button class="step" data-i="3"><b>4 Feedback</b>Shut-off</button>
      </div>
    </div>
    <div class="row" style="align-items:center">
      <button class="go" id="go">▶ Trigger stressor</button>
      <div class="seg" role="group" aria-label="Stress type">
        <button id="mA" aria-pressed="true">Acute</button><button id="mC" aria-pressed="false">Chronic</button>
      </div>
    </div>
    <div class="chartbox"><svg id="ch" viewBox="0 0 440 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Chart of epinephrine and cortisol after a stressor"></svg></div>
    <div>
      <div class="lbl">Add coping resources (model)</div>
      <div class="row chips" id="chips" role="group" aria-label="Coping resources">
        <button class="sbtn" aria-pressed="false">🏃 Exercise</button>
        <button class="sbtn" aria-pressed="false">😴 Sleep</button>
        <button class="sbtn" aria-pressed="false">🤝 Social support</button>
        <button class="sbtn" aria-pressed="false">🙏 Prayer / Scripture reflection</button>
        <button class="sbtn" aria-pressed="false">🧠 Therapy</button>
      </div>
    </div>
    <div class="note" id="note" aria-live="polite"></div>
  </div>
</div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)}, NS='http://www.w3.org/2000/svg';
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(s,a,p){var e=el('text',a,p);e.textContent=s;return e}
var chronic=false, step=-1, nCope=0, timer=null;
var TIMES=[0,2,30,100];   // minutes after stressor shown at each step
var DUR=120;

/* ---------- model curves (illustrative) ---------- */
function E(t){ var k=1-.08*nCope; return k*(t/2)*Math.exp(1-t/2); }
function C(t){
  var k=1-.1*nCope, T=28*(1-.06*nCope), base=chronic?.3:.12;
  var g=(t/T)*Math.exp(1-t/T); if(t<=4) g*= (t/4);
  if(!chronic) return base+.8*k*g;
  var plateau=.42*k*(1-Math.exp(-t/25));
  return base+.8*k*g*.7+plateau;
}
/* ---------- chart ---------- */
var CX0=38,CX1=430,CY0=12,CY1=162;
function X(t){return CX0+(CX1-CX0)*t/DUR} function Y(v){return CY1-(CY1-CY0)*Math.min(1.05,v)}
function drawChart(){
  var s=$('ch'); s.innerHTML='';
  var d=el('defs',{},s), cp=el('clipPath',{id:'cr'},d); el('rect',{id:'crr',x:CX0,y:0,width:0,height:200},cp);
  var base=chronic?.3:.12;
  el('line',{x1:CX0,x2:CX1,y1:CY1,y2:CY1,stroke:'#8a8f96'},s); el('line',{x1:CX0,x2:CX0,y1:CY0,y2:CY1,stroke:'#8a8f96'},s);
  [0,30,60,90,120].forEach(function(m){ el('line',{x1:X(m),x2:X(m),y1:CY1,y2:CY1+4,stroke:'#8a8f96'},s); txt(m,{x:X(m),y:CY1+16,'text-anchor':'middle','font-size':10.5,fill:'#5b6672'},s); });
  txt('minutes after stressor',{x:(CX0+CX1)/2,y:CY1+30,'text-anchor':'middle','font-size':10.5,fill:'#5b6672'},s);
  txt('hormone level',{x:12,y:(CY0+CY1)/2,'text-anchor':'middle','font-size':10.5,fill:'#5b6672',transform:'rotate(-90 12 '+((CY0+CY1)/2)+')'},s);
  el('line',{x1:CX0,x2:CX1,y1:Y(.12),y2:Y(.12),stroke:'#b9b2a5','stroke-dasharray':'4 4'},s); txt('normal baseline',{x:CX1,y:Y(.12)-4,'text-anchor':'end','font-size':9.5,fill:'#8a8f96'},s);
  var g=el('g',{'clip-path':'url(#cr)'},s);
  function path(fn,col){ var p=''; for(var t=0;t<=DUR;t+=1){ p+=(t?'L':'M')+X(t).toFixed(1)+' '+Y(fn(t)).toFixed(1);} el('path',{d:p,fill:'none',stroke:col,'stroke-width':3.2,'stroke-linejoin':'round'},g); }
  path(E,'#d9541e'); path(C,'#2b6cb0');
  txt('Epinephrine (seconds–minutes)',{x:X(14),y:Y(.42),'font-size':10.5,'font-weight':700,fill:'#d9541e'},g);
  txt(chronic?'Cortisol stays elevated':'Cortisol (peaks ~30 min, then returns)',{x:X(chronic?50:44),y:Y(chronic?.98:.55)-(chronic?12:0),'font-size':10.5,'font-weight':700,fill:'#2b6cb0'},g);
  var cur=el('g',{id:'curs'},s);
  setCursor(step<0?-1:TIMES[step],true);
}
var curT=-1;
function setCursor(t,instant){
  var r=$('crr'); var tt=t<0?0:t; var to=(CX1-CX0+2)*(tt/DUR); if(t<0) to=0;
  var cur=$('curs'); if(cur){ cur.innerHTML=''; if(t>=0){ el('line',{x1:X(t),x2:X(t),y1:CY0,y2:CY1,stroke:'#1f2a37','stroke-width':1.4,'stroke-dasharray':'3 3'},cur); el('circle',{cx:X(t),cy:Y(E(t)),r:4.5,fill:'#d9541e',stroke:'#fff','stroke-width':1.5},cur); el('circle',{cx:X(t),cy:Y(C(t)),r:4.5,fill:'#2b6cb0',stroke:'#fff','stroke-width':1.5},cur); } }
  if(!r) return;
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){ r.setAttribute('width',to); return; }
  var from=+r.getAttribute('width'), st=performance.now(), dur=700;
  (function f(n){ var p=Math.min(1,(n-st)/dur); r.setAttribute('width',from+(to-from)*p); if(p<1)requestAnimationFrame(f); })(st);
}
/* ---------- art state ---------- */
function on(id,v){ var e=$(id); if(!e)return; e.classList.toggle('on',!!v); if(e.tagName==='text') e.setAttribute('opacity',v?1:0); }
function showStep(i){
  step=i;
  document.querySelectorAll('.step').forEach(function(b,k){ b.classList.toggle('done',k<i); if(k===i) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  ['gAm','f1'].forEach(function(id){on(id,i>=0)});
  $('gAm').classList.toggle('pulse',i===0);
  ['gHy','f2','lbS','lE','gMe','gMe2'].forEach(function(id){on(id,i>=1)});
  ['f3','lR','gPi','f4a','f4b','lA','gAd','gAd2'].forEach(function(id){on(id,i>=2)});
  ['f5','lC'].forEach(function(id){on(id,i>=2)});
  var fb=i>=3;
  ['f5b','f5c','lFb'].forEach(function(id){on(id,fb&&!chronic)});
  $('f5').style.stroke=(i>=3&&chronic)?'#2b6cb0':'#2b6cb0';
  $('lFb').textContent='feedback'; 
  if(i>=3&&chronic){ $('lFb').setAttribute('opacity',1); $('lFb').textContent='feedback weakened'; $('lFb').setAttribute('fill','#8a8f96'); }
  else $('lFb').setAttribute('fill','#2b6cb0');
  if(i>=3){ $('gHy').classList.toggle('on',chronic); $('gPi').classList.toggle('on',chronic); $('gAd').classList.toggle('on',chronic); $('gAd2').classList.toggle('on',chronic); $('f3').classList.toggle('on',chronic); $('f4a').classList.toggle('on',chronic); $('f4b').classList.toggle('on',chronic); }
  setCursor(i<0?-1:TIMES[i]); note();
}
function note(){
  var N=[
   ['1 · Threat detected','The amygdala flags a threat and signals the hypothalamus. The prefrontal cortex helps judge and regulate the response.'],
   ['2 · Fast: sympathetic–adrenal','Within seconds, sympathetic nerves tell the adrenal medulla to release epinephrine and norepinephrine: faster heart rate, alertness, energy.'],
   ['3 · Slow: HPA axis','Minutes later: hypothalamus (CRH) → pituitary (ACTH) → adrenal cortex releases cortisol, which mobilizes energy and affects immunity.'],
   chronic?['4 · Feedback weakened (chronic stress)','Prolonged activation blunts the brakes from the hippocampus and prefrontal cortex, so cortisol stays high. Linked with cardiovascular, immune, sleep, anxiety and depression risk.']
         :['4 · Negative feedback restores balance','Cortisol signals the hippocampus, prefrontal cortex and hypothalamus to shut the system off. Levels return to baseline.']
  ];
  var n=step<0?['Ready','Press “Trigger stressor,” or click a step. Switch to Chronic stress to see what changes when the system cannot stand down.']:N[step];
  $('note').innerHTML='<b>'+n[0]+'</b>'+n[1]+(nCope&&step>=2?' <i>Coping resources lower the peak and speed recovery in this model.</i>':'');
}
/* ---------- controls ---------- */
function stop(){ if(timer){clearInterval(timer);timer=null;} $('go').textContent='▶ Trigger stressor'; }
$('go').onclick=function(){ if(timer){stop();return;} var i=-1; this.textContent='■ Pause'; showStep(-1);
  timer=setInterval(function(){ i++; if(i>3){stop();return;} showStep(i); },2100); };
document.querySelectorAll('.step').forEach(function(b){ b.onclick=function(){ stop(); showStep(+b.dataset.i); }});
function setMode(c){ chronic=c; $('mA').setAttribute('aria-pressed',!c); $('mC').setAttribute('aria-pressed',c); drawChart(); showStep(step); }
$('mA').onclick=function(){setMode(false)}; $('mC').onclick=function(){setMode(true)};
document.querySelectorAll('#chips .sbtn').forEach(function(b){ b.onclick=function(){ var p=b.getAttribute('aria-pressed')==='true'; b.setAttribute('aria-pressed',!p); nCope+=p?-1:1; drawChart(); note(); }});
drawChart(); showStep(-1);
})();
</script>
</body>
</html>
