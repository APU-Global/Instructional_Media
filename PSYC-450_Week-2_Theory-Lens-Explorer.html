<html lang="en"><head><meta charset="utf-8">

<title>PSYC 450 | Week 2: Theory Lens Explorer</title>
<style>
:root{--red:#a8353a;--red2:#d34147;--ink:#1f1f23;--cream:#f4f0ea;--line:#e2dbcf;--muted:#5a5a62;--teal:#2f6f73;--gold:#b7791f;--plum:#6b4fa0;--rose:#c0457a;--green:#2f8a6a;--blue:#3b5b8c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--cream);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #2f6fdc;outline-offset:2px}
.app{height:100vh;display:flex;flex-direction:column;min-height:0}
.hd{flex:0 0 auto;background:linear-gradient(100deg,#8f2a30,#d34147);color:#fff;padding:8px 18px;display:flex;align-items:center;gap:12px}
.hd svg{flex:0 0 auto}
.hd .eb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.88}
.hd h1{margin:0;font:700 19px/1.15 Georgia,"Times New Roman",serif}
.tabs{flex:0 0 auto;display:flex;gap:6px;padding:9px 14px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 15px;font-weight:600;font-size:13px}
.tab:hover{border-color:#bbb}
.tab[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.stage{flex:1 1 auto;min-height:0;padding:10px 14px 12px;display:flex}
.view{display:none;flex:1;min-height:0;gap:12px;width:100%}
.view.on{display:flex}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:0;min-width:0}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
h2{margin:0 0 4px;font:700 17px/1.2 Georgia,serif}
h3{margin:0 0 2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.sec{margin-top:9px}
.sec p{font-size:13.5px}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:10px;padding:7px 13px;font-weight:600;font-size:13px}
.btn:hover{background:#f2eee7}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:#8f2a30}
.btn[disabled]{opacity:.45;cursor:default}
.note{font-size:12.5px;color:var(--muted)}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.fb{border-radius:10px;padding:8px 11px;font-size:13.5px;margin-top:8px}
.fb.ok{background:#e6f4ec;border:1px solid #9fd3b6}
.fb.no{background:#fdeceb;border:1px solid #f0aaa6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:700px){
 html,body{overflow:auto;height:auto}
 .app{height:auto;min-height:100vh}
 .stage{display:block}
 .view.on{flex-direction:column}
 .card{overflow:visible}
}

.lenses{flex:0 0 auto;display:flex;gap:6px;padding:8px 14px 0;flex-wrap:wrap;align-items:center}
.lens{display:flex;align-items:center;gap:7px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:5px 12px 5px 8px;font-weight:700;font-size:13px}
.lens i{width:16px;height:16px;border-radius:50%;background:var(--c);display:block}
.lens[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.lens:disabled{opacity:.5;cursor:default}
.mode{margin-left:auto;display:flex;gap:6px}
.svgc{flex:1.7;display:flex;flex-direction:column;padding:8px}
.svgc svg{flex:1;min-height:0;width:100%}
.cap{font-size:12.5px;color:var(--muted);text-align:center;padding:2px 6px 0}
.panel{flex:1;overflow:hidden}
.ov{opacity:0;transition:opacity .35s;pointer-events:none}
.ov.on{opacity:1}
.tag{display:inline-block;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:99px;margin-bottom:5px}
.q{font:italic 16px/1.4 Georgia,serif;margin:6px 0 8px;padding:8px 12px;border-left:4px solid var(--red);background:#faf6f0;border-radius:0 8px 8px 0}
.score{font-weight:700;font-size:13px}
@media (max-width:700px){.svgc{padding:4px}.svgc svg{height:auto}.mode{margin-left:0}}
</style></head><body>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function initTabs(onChange){
  const tabs=$$('.tabs .tab'), views=$$('.view');
  tabs.forEach(t=>t.addEventListener('click',()=>{
    tabs.forEach(x=>x.setAttribute('aria-selected',x===t));
    views.forEach(v=>v.classList.toggle('on',v.id===t.dataset.view));
    onChange&&onChange(t.dataset.view); postH();
  }));
}
function postH(){try{parent.postMessage({type:'psyc450-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}
addEventListener('load',postH);addEventListener('resize',postH);

const L={
 bowen:{n:'Bowen',full:'Bowen Family Systems',c:'#b3382c',idea:'Anxiety moves through relationships. The family is one emotional unit, so tension in one place shows up somewhere else.',sees:'Mom and Dad’s unresolved tension is being absorbed by Mia, forming a triangle. Each parent also carries patterns from their own family of origin.',asks:'“What happens between the two of you when Mia stays home? How did your families handle stress?”',move:'Coach each adult toward differentiation: staying calm and connected without fusing or cutting off.'},
 structural:{n:'Structural',full:'Structural (Minuchin)',c:'#2f6f73',idea:'Organization matters: subsystems, boundaries, and hierarchy shape how a family functions.',sees:'A diffuse boundary between Mom and Mia, a rigid one between Dad and Mia, and a weak parental team. Mia ends up holding too much power.',asks:'“Who decides what happens on a school morning?”',move:'Join the family, watch an enactment, then restructure so the parents act as a team with clear boundaries.'},
 strategic:{n:'Strategic',full:'Strategic (Haley)',c:'#b7791f',idea:'Problems are kept alive by repeating sequences of behavior, so change the sequence.',sees:'A loop: avoidance, then pleading, then criticism, then more protection, then more avoidance.',asks:'“What happens right after Mia stays home? And then what happens?”',move:'Assign a directive or reframe that interrupts the loop. Origins matter less than breaking the pattern.'},
 narrative:{n:'Narrative',full:'Narrative (White & Epston)',c:'#6b4fa0',idea:'People live by the stories they tell, and the person is never the problem.',sees:'A dominant story, “Mia is the problem child,” hides exceptions: mornings when Mia did go and the family worked together.',asks:'“When has School Avoidance not been in charge of Mia? What did the family do differently?”',move:'Externalize the problem, find unique outcomes, and re-author a preferred story.'},
 attachment:{n:'Attachment',full:'Attachment (Bowlby)',c:'#c0457a',idea:'Secure bonds give people a base for exploring the world and a haven when they are afraid.',sees:'Mia reaches for comfort but gets uneven responses. Staying home near Mom may feel like the safest option.',asks:'“When Mia is frightened, who does she go to? What happens next?”',move:'Strengthen caregiver responsiveness so the family becomes a secure base.'}
};
const Q=[
 ['The therapist asks, “Tell me about a morning when Mia went to school easily. What was different?”','narrative','Asking about “unique outcomes” that contradict the problem story is a narrative move.'],
 ['The therapist asks the parents to discuss the morning routine with each other while Mia watches, to see how they interact.','structural','Staging an enactment to observe boundaries and hierarchy is classic structural therapy.'],
 ['The therapist sketches a three-generation genogram and asks how each parent’s family handled anxiety.','bowen','Tracing multigenerational patterns of anxiety is Bowen’s signature approach.'],
 ['The therapist assigns: “Tomorrow, Dad wakes Mia and Mom stays out of the room.”','strategic','A task designed to interrupt the problem-maintaining sequence is a strategic directive.'],
 ['The therapist asks Mia, “When you’re scared, do you feel you can run to your parents?”','attachment','Exploring felt safety and the caregiver as a secure base points to attachment theory.']
];
const keys=Object.keys(L); let mode='explore',cur='bowen',qi=0,score=0,answered=false;
const bar=$('#lenses');
bar.innerHTML=keys.map(k=>`<button class="lens" data-k="${k}" style="--c:${L[k].c}" aria-pressed="false"><i></i>${L[k].n}</button>`).join('');
function show(k){$$('.ov').forEach(o=>o.classList.toggle('on',o.dataset.for===k));$$('.lens').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k))}
function explore(k){cur=k;show(k);const d=L[k];$('#panel').innerHTML=`<span class="tag" style="background:${d.c}">${d.full}</span>
 <h2>${d.idea}</h2>
 <div class="sec"><h3>What this lens sees</h3><p>${d.sees}</p></div>
 <div class="sec"><h3>A question the therapist asks</h3><p><em>${d.asks}</em></p></div>
 <div class="sec"><h3>Key move</h3><p>${d.move}</p></div>`}
function question(){
  answered=false;show(null);$$('.lens').forEach(b=>b.disabled=false);
  if(qi>=Q.length){$$('.lens').forEach(b=>b.disabled=true);
    $('#panel').innerHTML=`<h2>Round complete</h2><p class="sec">You matched <b>${score} of ${Q.length}</b> therapist moves to the right lens.</p><p class="sec note">${score==Q.length?'Excellent. You can tell the lenses apart by what the therapist does.':'Switch to “Explore the lenses” to review the ideas, then try again.'}</p><div class="sec"><button class="btn pri" id="again">Try again</button></div>`;
    $('#again').onclick=()=>{qi=0;score=0;question()};return}
  $('#panel').innerHTML=`<div class="score">Question ${qi+1} of ${Q.length} · Score ${score}</div><h3 class="sec">Which lens is this therapist using?</h3><div class="q">${Q[qi][0]}</div><p class="note">Choose a lens above.</p><div id="res"></div>`}
bar.addEventListener('click',e=>{const b=e.target.closest('.lens');if(!b)return;const k=b.dataset.k;
  if(mode==='explore')return explore(k);
  if(answered||qi>=Q.length)return;answered=true;const ok=k===Q[qi][1];if(ok)score++;show(Q[qi][1]);
  $$('.lens').forEach(x=>x.disabled=true);
  $('#res').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct.':'Not quite.'}</b> This is <b>${L[Q[qi][1]].full}</b>. ${Q[qi][2]}</div><div class="sec"><button class="btn pri" id="nx">${qi<Q.length-1?'Next question':'See results'}</button></div>`;
  $('#nx').onclick=()=>{qi++;question()};postH()});
function setMode(m){mode=m;$('#mExplore').setAttribute('aria-selected',m==='explore');$('#mTest').setAttribute('aria-selected',m==='test');
  if(m==='explore'){$$('.lens').forEach(b=>b.disabled=false);explore(cur)}else{qi=0;score=0;question()}postH()}
$('#mExplore').onclick=()=>setMode('explore');$('#mTest').onclick=()=>setMode('test');
explore('bowen');
</script></body></html>
