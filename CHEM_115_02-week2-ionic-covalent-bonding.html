<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 2: Ionic and Covalent Bonding</title><style>

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
