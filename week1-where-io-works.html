<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where Does I-O Psychology Work?</title><style>:root{--navy:#12355b;--blue:#2563a8;--teal:#12897f;--gold:#e0a526;--red:#c8453b;--green:#2e8b57;--ink:#1c2733;--mute:#5b6b7b;--bg:#f4f7fb;--card:#fff;--line:#d5dee8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4}
.app{height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(100deg,var(--navy),var(--blue));color:#fff;padding:8px 16px;display:flex;align-items:center;gap:14px;flex:0 0 auto}
header .wk{background:var(--gold);color:#1c1c1c;font-weight:700;border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
header h1{font-size:17px;margin:0;font-weight:650;flex:1}
.tabs{display:flex;gap:4px}
.tab{border:0;background:rgba(255,255,255,.16);color:#fff;padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.tab[aria-selected=true]{background:#fff;color:var(--navy);font-weight:650}
.tab:focus-visible,button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;grid-template-columns:1.25fr 1fr;gap:14px;padding:12px 16px}
.view.on{display:grid}
.panel{min-height:0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:hidden;display:flex;flex-direction:column}
.panel.art{background:#f0f5fa;padding:6px;align-items:center;justify-content:center}
.panel.art svg{width:100%;height:100%;max-height:100%}
h2{font-size:16px;margin:0 0 6px;color:var(--navy)}
p{margin:0 0 8px}
.small{font-size:13px;color:var(--mute)}
.btn{border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{background:#eaf2fb}
.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.note{border-left:5px solid var(--teal);background:#eaf7f5;border-radius:6px;padding:8px 10px;font-size:14px}
.note.warn{border-color:var(--gold);background:#fff6df}.note.bad{border-color:var(--red);background:#fdecea}.note.good{border-color:var(--green);background:#e9f6ee}
.opts{display:grid;gap:6px;margin:6px 0}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f0f6fd}
.opt.ok{border-color:var(--green);background:#e9f6ee}.opt.no{border-color:var(--red);background:#fdecea}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.bar{height:10px;background:#e5ebf2;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--teal);transition:width .4s}
label.sl{display:block;font-size:13px;font-weight:600;margin-top:5px}
label.sl span{float:right;color:var(--blue)}
input[type=range]{width:100%;accent-color:var(--blue);margin:2px 0}
.g{cursor:pointer}.g:hover .hl,.g:focus .hl{filter:brightness(1.12)}
.sel .ring{stroke:var(--gold);stroke-width:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){
 html,body{overflow:auto}.app{height:auto;min-height:100vh}main{min-height:900px}
 .view{grid-template-columns:1fr;grid-auto-rows:minmax(280px,auto)}header{flex-wrap:wrap}.panel{overflow:visible}
}
</style></head><body>

   <rect x="160" y="270" width="114" height="22" fill="#6b4f96"/><line x1="217" y1="138" x2="217" y2="118" stroke="#555" stroke-width="2"/><polygon points="217,118 236,124 217,130" fill="#c8453b"/>

 <div class="panel">
  <h2 id="w1t">Select a building to begin</h2>
  <p id="w1d" class="small">I-O psychology applies to any organization. Pick a setting, then pick a facet of practice (the work is both <em>deep and wide</em>).</p>
  <div class="chips" id="w1f" role="group" aria-label="Facet of practice">
   <button class="chip" data-f="0" aria-pressed="true">Health &amp; safety</button>
   <button class="chip" data-f="1" aria-pressed="false">Design &amp; process</button>
   <button class="chip" data-f="2" aria-pressed="false">Leadership, hiring &amp; communication</button></div>
  <div class="note" id="w1ex" aria-live="polite">Illustrative examples will appear here.</div>
  <div style="margin-top:auto" class="small">Explored: <span id="w1c">0</span> of 4 settings</div><div class="bar"><i id="w1b" style="width:0"></i></div>
 </div>

<section class="view" role="tabpanel">
 <div class="panel" style="grid-column:1/-1"><div class="row"><h2 id="q1h" style="margin:0">Quick check</h2><span class="spacer"></span><span class="small" id="q1s"></span></div>
  <p id="q1q" style="font-weight:600;margin-top:10px;font-size:16px"></p><div class="opts" id="q1o"></div><div id="q1f" aria-live="polite"></div>
  <div style="margin-top:auto" class="row"><span class="spacer"></span><button class="btn pri" id="q1n" hidden>Next</button></div></div>

<script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function initTabs(){const t=$$('.tab'),v=$$('.view');t.forEach((b,i)=>b.addEventListener('click',()=>{t.forEach((x,j)=>x.setAttribute('aria-selected',i===j));v.forEach((x,j)=>x.classList.toggle('on',i===j))}));t[0].click()}
function kb(el,fn){el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}
// Optional: lets a Canvas LTI/host page resize the frame; harmless otherwise.
function postH(){try{parent.postMessage({subject:'lti.frameResize',height:document.documentElement.scrollHeight},'*')}catch(e){}}


const S=[{k:'b-biz',t:'Business & industry',d:'The most familiar home for I-O practitioners, but not the only one.',e:['Redesign shift schedules and workstations to reduce fatigue-related injuries on a production floor.','Map how an order moves through departments and remove steps that slow it down.','Build structured hiring and manager-communication practices so the right people are chosen and heard.']},
{k:'b-gov',t:'Non-profit organizations & government agencies',d:'Public-service and mission-driven organizations rely on people too.',e:['Assess workload and stress in a busy public-service office before burnout drives turnover.','Streamline how a request is handled from intake to decision.','Train supervisors to communicate policy changes clearly to staff.']},
{k:'b-vol',t:'Volunteer organizations, clubs & fraternal groups',d:'Volunteers are people at work, so I-O principles still apply.',e:['Plan volunteer shifts for events so people stay safe and do not burn out.','Clarify roles and handoffs so committees are not duplicating work.','Recruit and onboard volunteers and develop the next generation of club officers.']},
{k:'b-faith',t:'Churches & faith-based organizations',d:'Faith-based groups are organizations with structures, leaders, and communication needs.',e:['Support the well-being of staff and lay leaders who carry heavy emotional loads.','Coordinate ministry teams and processes so they work together instead of competing for volunteers.','Develop leaders and improve communication between staff and the congregation.']}];
let cur=-1,f=0;const seen=new Set();
function show(){if(cur<0)return;const s=S[cur];$('#w1t').textContent=s.t;$('#w1d').textContent=s.d;$('#w1ex').innerHTML='<strong>Illustrative example:</strong> '+s.e[f];}
S.forEach((s,i)=>{const el=document.getElementById(s.k);kb(el,()=>{S.forEach(x=>document.getElementById(x.k).classList.remove('sel'));el.classList.add('sel');cur=i;seen.add(i);show();$('#w1c').textContent=seen.size;$('#w1b').style.width=seen.size*25+'%'})});
$$('#w1f .chip').forEach(c=>c.addEventListener('click',()=>{f=+c.dataset.f;$$('#w1f .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));show()}));
const Q=[{q:'What do all specializations in psychology share as a common foundation?',o:['A scientific approach to behavior and mental processes','A focus on business only','A reliance on intuition','A single research method'],a:0,w:'Every specialization, including I-O, shares a scientific approach to behavior and mental processes.'},
{q:'Which settings can I-O psychology principles apply to?',o:['Only for-profit businesses','Only large corporations','Any organization: business, non-profit, government, volunteer, clubs, churches','Only organizations with an HR department'],a:2,w:'I-O is an applied psychology. Its principles apply to any organization.'},
{q:'The I-O approach is described as "deep and wide." What does that mean?',o:['It only studies top executives','Every facet of an organization is open to I-O principles','It uses only large data sets','It covers hiring and nothing else'],a:1,w:'From workplace safety to design, leadership, hiring, and communications, every facet is in scope.'},
{q:'Which document frames the ethical standards that guide I-O practitioners?',o:['A company mission statement','The APA Ethical Principles of Psychologists and Code of Conduct','A union contract','A marketing brief'],a:1,w:'Practice is guided by professional ethics, such as the APA code listed in this week\'s resources.'}];
let qi=0,sc=0;
function loadQ(){const q=Q[qi];$('#q1q').textContent=q.q;$('#q1s').textContent='Question '+(qi+1)+' of '+Q.length+' | Score '+sc;$('#q1f').innerHTML='';$('#q1n').hidden=true;
 $('#q1o').innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{[...$('#q1o').children].forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('ok')});if(i===q.a){sc++;$('#q1f').innerHTML='<div class="note good"><strong>Correct.</strong> '+q.w+'</div>'}else{b.classList.add('no');$('#q1f').innerHTML='<div class="note bad"><strong>Not quite.</strong> '+q.w+'</div>'}
 $('#q1s').textContent='Question '+(qi+1)+' of '+Q.length+' | Score '+sc;$('#q1n').hidden=false;$('#q1n').textContent=qi<Q.length-1?'Next':'See result'};$('#q1o').appendChild(b)})}
$('#q1n').onclick=()=>{if(qi<Q.length-1){qi++;loadQ()}else{$('#q1q').textContent='You scored '+sc+' of '+Q.length+'.';$('#q1o').innerHTML='';$('#q1f').innerHTML='<div class="note">I-O psychology is an applied psychology built on science, open to any organization, deep and wide in scope, and guided by ethics.</div>';$('#q1n').textContent='Try again';$('#q1n').onclick=()=>{qi=0;sc=0;location.reload()}}};
loadQ();
initTabs();</script></body></html>
