<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business and Regulatory Considerations</title><style>:root{--navy:#12355b;--blue:#2563a8;--teal:#12897f;--gold:#e0a526;--red:#c8453b;--green:#2e8b57;--ink:#1c2733;--mute:#5b6b7b;--bg:#f4f7fb;--card:#fff;--line:#d5dee8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4}
.app{height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(100deg,var(--navy),var(--blue));color:#fff;padding:8px 16px;display:flex;align-items:center;gap:14px;flex:0 0 auto}
header .wk{background:var(--gold);color:#1c1c1c;font-weight:700;border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
header h1{font-size:17px;margin:0;font-weight:650;flex:1}
.tabs{display:flex;gap:4px}
.tab{border:0;background:rgba(255,255,255,.16);color:#fff;padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.tab[aria-selected=true]{background:#fff;color:var(--navy);font-weight:650}
.tab:focus-visible,button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;grid-template-columns:1.25fr 1fr;gap:14px;padding:12px 16px}
.view.on{display:grid}
.panel{min-height:0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:hidden;display:flex;flex-direction:column}
.panel.art{background:#f0f5fa;padding:6px;align-items:center;justify-content:center}
.panel.art svg{width:100%;height:100%;max-height:100%}
h2{font-size:16px;margin:0 0 6px;color:var(--navy)}
p{margin:0 0 8px}
.small{font-size:13px;color:var(--mute)}
.btn{border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{background:#eaf2fb}
.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.note{border-left:5px solid var(--teal);background:#eaf7f5;border-radius:6px;padding:8px 10px;font-size:14px}
.note.warn{border-color:var(--gold);background:#fff6df}.note.bad{border-color:var(--red);background:#fdecea}.note.good{border-color:var(--green);background:#e9f6ee}
.opts{display:grid;gap:6px;margin:6px 0}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f0f6fd}
.opt.ok{border-color:var(--green);background:#e9f6ee}.opt.no{border-color:var(--red);background:#fdecea}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.bar{height:10px;background:#e5ebf2;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--teal);transition:width .4s}
label.sl{display:block;font-size:13px;font-weight:600;margin-top:5px}
label.sl span{float:right;color:var(--blue)}
input[type=range]{width:100%;accent-color:var(--blue);margin:2px 0}
.g{cursor:pointer}.g:hover .hl,.g:focus .hl{filter:brightness(1.12)}
.sel .ring{stroke:var(--gold);stroke-width:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){
 html,body{overflow:auto}.app{height:auto;min-height:100vh}main{min-height:900px}
 .view{grid-template-columns:1fr;grid-auto-rows:minmax(280px,auto)}header{flex-wrap:wrap}.panel{overflow:visible}
}
</style></head><body>
<div class="app"><header><span class="wk">Week 6</span><h1>Business and Regulatory Considerations</h1><div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="false">ROI pitch</button><button class="tab" role="tab" aria-selected="false">Know the rules</button></div></header>
<main>
<section class="view" role="tabpanel">
 <div class="panel art"><svg viewBox="0 0 520 340" role="img" aria-label="Bar chart comparing the cost of a training program to its expected annual benefit, with a return on investment badge.">
  <rect width="520" height="340" rx="10" fill="#f0f5fa"/>
  <line x1="60" y1="280" x2="480" y2="280" stroke="#9aa8b8" stroke-width="2"/>
  <rect id="bcst" x="110" y="280" width="110" height="0" rx="6" fill="#c8453b"/><rect id="bben" x="300" y="280" width="110" height="0" rx="6" fill="#2e8b57"/>
  <text x="165" y="302" text-anchor="middle" font-weight="700" font-size="13" fill="#12355b">Cost</text><text x="355" y="302" text-anchor="middle" font-weight="700" font-size="13" fill="#12355b">Annual benefit</text>
  <text id="tcst" x="165" y="270" text-anchor="middle" font-weight="700" font-size="14" fill="#c8453b"></text><text id="tben" x="355" y="270" text-anchor="middle" font-weight="700" font-size="14" fill="#2e8b57"></text>
  <g><circle id="rc" cx="440" cy="62" r="46" fill="#12355b"/><text x="440" y="50" text-anchor="middle" font-size="11" fill="#ffd45c" font-weight="700">ROI</text><text id="rv" x="440" y="74" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">0%</text></g>
  <g transform="translate(40,34)"><circle cx="20" cy="20" r="20" fill="#e0a526"/><text x="20" y="27" text-anchor="middle" font-size="20" font-weight="800" fill="#12355b">$</text><text x="52" y="18" font-size="14" font-weight="700" fill="#12355b">Training proposal</text><text x="52" y="35" font-size="11" fill="#5b6b7b">Present it as benefit and return</text></g>
 </svg></div>
 <div class="panel"><h2>Build the ROI case</h2><p class="small" style="margin-bottom:2px">Many I-O recommendations carry an expense, such as sending employees to training. Try hypothetical numbers.</p>
  <label class="sl" for="n">Employees trained<span id="vn"></span></label><input id="n" type="range" min="5" max="200" step="5" value="40">
  <label class="sl" for="c">Cost per employee<span id="vc"></span></label><input id="c" type="range" min="100" max="5000" step="100" value="800">
  <label class="sl" for="b">Expected yearly benefit per employee<span id="vb"></span></label><input id="b" type="range" min="0" max="8000" step="100" value="1500">
  <div class="note" id="pt" style="margin-top:10px" aria-live="polite"></div><p class="small" style="margin-top:6px">All figures are hypothetical.</p></div>
</section>
<section class="view" role="tabpanel">
 <div class="panel art"><svg viewBox="0 0 520 340" role="img" aria-label="A scale of justice balancing a business ledger against equal employment law">
  <rect width="520" height="340" rx="10" fill="#f0f5fa"/>
  <rect x="254" y="70" width="12" height="220" fill="#12355b"/><rect x="190" y="290" width="140" height="16" rx="6" fill="#12355b"/><circle cx="260" cy="64" r="14" fill="#e0a526"/>
  <g id="beam"><rect x="90" y="86" width="340" height="8" rx="4" fill="#12355b"/>
   <line x1="110" y1="94" x2="70" y2="170" stroke="#12355b" stroke-width="3"/><line x1="110" y1="94" x2="150" y2="170" stroke="#12355b" stroke-width="3"/><path d="M60 170h100a50 30 0 0 1-100 0z" fill="#2f5d8f"/><text x="110" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Title VII</text>
   <line x1="410" y1="94" x2="370" y2="170" stroke="#12355b" stroke-width="3"/><line x1="410" y1="94" x2="450" y2="170" stroke="#12355b" stroke-width="3"/><path d="M360 170h100a50 30 0 0 1-100 0z" fill="#8a6bb5"/><text x="410" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ADA</text></g>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#5b6b7b">Know the rules to build credibility</text>
 </svg></div>
 <div class="panel"><div class="row"><h2 style="margin:0">Which rule applies?</h2><span class="spacer"></span><span class="small" id="k6s"></span></div>
  <p id="k6q" style="font-weight:600;margin:8px 0 4px"></p><div class="opts" id="k6o"></div><div id="k6f" aria-live="polite"></div>
  <div style="margin-top:auto" class="row"><span class="spacer"></span><button class="btn pri" id="k6n" hidden>Next</button></div></div>
</section></main></div>
<script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function initTabs(){const t=$$('.tab'),v=$$('.view');t.forEach((b,i)=>b.addEventListener('click',()=>{t.forEach((x,j)=>x.setAttribute('aria-selected',i===j));v.forEach((x,j)=>x.classList.toggle('on',i===j))}));t[0].click()}
function kb(el,fn){el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}
// Optional: lets a Canvas LTI/host page resize the frame; harmless otherwise.
function postH(){try{parent.postMessage({subject:'lti.frameResize',height:document.documentElement.scrollHeight},'*')}catch(e){}}


const $$$=n=>n.toLocaleString('en-US');
function calc(){const n=+$('#n').value,c=+$('#c').value,b=+$('#b').value;$('#vn').textContent=n;$('#vc').textContent='$'+$$$(c);$('#vb').textContent='$'+$$$(b);
 const cost=n*c,ben=n*b,roi=cost?Math.round((ben-cost)/cost*100):0,mx=Math.max(cost,ben,1),H=170;
 const hc=cost/mx*H,hb=ben/mx*H;const bc=$('#bcst'),bb=$('#bben');bc.setAttribute('y',280-hc);bc.setAttribute('height',hc);bb.setAttribute('y',280-hb);bb.setAttribute('height',hb);
 $('#tcst').setAttribute('y',270-hc);$('#tben').setAttribute('y',270-hb);$('#tcst').textContent='$'+$$$(cost);$('#tben').textContent='$'+$$$(ben);$('#rv').textContent=roi+'%';$('#rc').setAttribute('fill',roi>=0?'#12355b':'#c8453b');
 const pb=b>0?(c/(b/12)):Infinity;const m=$('#pt');m.className='note'+(roi>=0?' good':' bad');
 m.innerHTML=roi>=0?'<strong>Leader-ready pitch:</strong> "For $'+$$$(cost)+', we expect about $'+$$$(ben)+' in yearly benefit, a '+roi+'% return, paid back in about '+pb.toFixed(1)+' months."':'<strong>Not yet persuasive.</strong> At these numbers the expected benefit ($'+$$$(ben)+') is below the cost ($'+$$$(cost)+'). Reduce cost, target higher-value skills, or show stronger evidence of benefit.'}
$$('#n,#c,#b').forEach(x=>x.addEventListener('input',calc));calc();
const O=['Title VII (Civil Rights Act)','ADA (disability law)','Business & finance'];
const K=[{q:'A qualified employee is passed over for promotion because of their religion.',a:0,w:'Title VII addresses employment discrimination, including on the basis of religion.'},
{q:'An employee with a disability asks for a reasonable change so they can do their job.',a:1,w:'The Americans with Disabilities Act covers disability in employment, including reasonable accommodation.'},
{q:'Applicants from a particular national origin are screened out without a job-related reason.',a:0,w:'Title VII prohibits discrimination based on national origin, among other protected characteristics.'},
{q:'A senior leader asks, "What will this training cost, and what do we get back?"',a:2,w:'Recommendations should be presented in terms of benefit and return on investment.'},
{q:'A qualified applicant who uses a wheelchair cannot reach the interview room.',a:1,w:'Accessibility and disability inclusion fall under the ADA.'},
{q:'A woman is paid less than a man in the same role for reasons unrelated to the job.',a:0,w:'Title VII addresses sex discrimination in employment.'}];
let ki=0,ks=0;
function loadK(){const k=K[ki];$('#k6q').textContent=k.q;$('#k6s').textContent=(ki+1)+' of '+K.length+' | Score '+ks;$('#k6f').innerHTML='';$('#k6n').hidden=true;$('#k6o').innerHTML='';
 O.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{[...$('#k6o').children].forEach((x,j)=>{x.disabled=true;if(j===k.a)x.classList.add('ok')});
  if(i===k.a){ks++;$('#k6f').innerHTML='<div class="note good"><strong>Correct.</strong> '+k.w+'</div>'}else{b.classList.add('no');$('#k6f').innerHTML='<div class="note bad"><strong>Not this one.</strong> '+k.w+'</div>'}
  $('#k6s').textContent=(ki+1)+' of '+K.length+' | Score '+ks;$('#beam').setAttribute('transform','rotate('+(k.a===0?-3:k.a===1?3:0)+' 260 90)');$('#k6n').hidden=false;$('#k6n').textContent=ki<K.length-1?'Next':'See result'};$('#k6o').appendChild(b)})}
$('#k6n').onclick=()=>{if(ki<K.length-1){ki++;loadK()}else{$('#k6q').textContent='You scored '+ks+' of '+K.length+'.';$('#k6o').innerHTML='';$('#k6f').innerHTML='<div class="note">Knowing labor law, EEO regulations, governance, and finances helps practitioners earn credibility and build relationships, even with wary employees.</div>';$('#k6n').textContent='Restart';$('#k6n').onclick=()=>location.reload()}};
loadK();
initTabs();</script></body></html>
