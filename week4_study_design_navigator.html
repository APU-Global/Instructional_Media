<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 4 Activity: Study Design Navigator</title><style>:root{--red:#d34147;--red-d:#a92d33;--ink:#222;--mut:#5b6470;--bg:#f9f9f9;--card:#fff;--line:#e0e0e0;--teal:#1f6f8b;--gold:#e8a33d;--green:#2e8b57;--soft:#fdecec}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:10px 12px 12px}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#2b2b2b,#3a3a3a);color:#fff;border-radius:12px;padding:10px 16px;border-left:6px solid var(--red)}
.hero svg{flex:0 0 auto;width:92px;height:62px}
.hero h1{margin:0;font-size:20px;line-height:1.15}
.hero p{margin:3px 0 0;font-size:13px;color:#e6e6e6}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:1px 9px;margin-bottom:3px}
.tabs{display:flex;gap:6px;margin:10px 0 8px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer}
.tab:hover{border-color:var(--red)}
.tab[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panel.on{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.hero svg{display:none}}
h2{font-size:16px;margin:0 0 4px}
.lead{margin:0 0 8px;color:var(--mut);font-size:14px}
.btn{background:var(--red);color:#fff;border:0;border-radius:8px;font:inherit;font-weight:700;padding:7px 14px;cursor:pointer}
.btn:hover{background:var(--red-d)}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.alt:hover{border-color:var(--red)}
.fb{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:14px;display:none}
.fb.show{display:block}.fb.ok{background:#e8f5ee;border-left:4px solid var(--green)}.fb.no{background:var(--soft);border-left:4px solid var(--red)}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:6px}
.stat b{font-size:20px;color:var(--red)}
.stat small{display:block;color:var(--mut)}
label{font-weight:600;font-size:14px}
input[type=range]{width:100%;accent-color:var(--red)}
input[type=number]{width:96px;padding:5px 7px;border:2px solid var(--line);border-radius:6px;font:inherit}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.prog{font-size:13px;color:var(--mut);margin-bottom:6px}
.sr{position:absolute;left:-9999px}

.seg{display:inline-flex;border:2px solid var(--red);border-radius:9px;overflow:hidden;margin-bottom:6px}
.seg button{border:0;background:#fff;font:inherit;font-weight:700;padding:6px 16px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--red);color:#fff}
.flow{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.flow{animation:none;stroke-dashoffset:0}}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.opt{flex:1 1 150px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px;font:inherit;font-weight:700;cursor:pointer;text-align:center}
.opt:hover:not(:disabled){border-color:var(--red)}
.opt.right{background:#e8f5ee;border-color:var(--green)}.opt.wrong{background:var(--soft);border-color:var(--red)}
.pts{display:flex;gap:10px;font-weight:700;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;font-size:13.5px}
.cmp div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
@media(max-width:720px){.cmp{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="hero">
<svg viewBox="0 0 92 62" role="img" aria-label="Two arrows pointing in opposite directions"><rect width="92" height="62" rx="8" fill="#444"/><path d="M10 22H72" stroke="#e8a33d" stroke-width="5"/><path d="M70 12L84 22L70 32Z" fill="#e8a33d"/><path d="M82 44H20" stroke="#d34147" stroke-width="5"/><path d="M22 34L8 44L22 54Z" fill="#d34147"/></svg>
<div><span class="tag">Week 4</span><h1>Study Design Navigator</h1><p>Cohort vs. case-control: see the direction of each design, choose the right one for a question, and name the bias.</p></div></div>
<div class="tabs" role="tablist">
<button class="tab" role="tab" aria-selected="true" data-p="p1">1. Explore Designs</button>
<button class="tab" role="tab" aria-selected="false" data-p="p2">2. Choose the Design</button>
<button class="tab" role="tab" aria-selected="false" data-p="p3">3. Name the Bias</button></div>

<section class="panel on" id="p1"><div class="seg" role="group" aria-label="Choose design"><button id="bc" aria-pressed="true">Cohort</button><button id="bk" aria-pressed="false">Case-Control</button></div>
<svg id="tl" viewBox="0 0 900 250" width="100%" role="img" aria-label="Timeline diagram of the selected study design"></svg>
<div class="cmp" id="cmp"></div></section>

<section class="panel" id="p2"><div class="pts"><span id="sc2"></span><span id="pr2" class="prog" style="margin:0"></span></div>
<p id="q2" style="font-weight:600;margin:0"></p><div class="opts" id="o2"></div><div class="fb" id="f2"></div>
<div style="margin-top:8px"><button class="btn" id="n2" style="display:none">Next</button></div></section>

<section class="panel" id="p3"><div class="pts"><span id="sc3"></span><span id="pr3" class="prog" style="margin:0"></span></div>
<p id="q3" style="font-weight:600;margin:0"></p><div class="opts" id="o3"></div><div class="fb" id="f3"></div>
<div style="margin-top:8px"><button class="btn" id="n3" style="display:none">Next</button></div></section>
</div>
<script>
const $=id=>document.getElementById(id);
function post(){try{parent.postMessage({subject:'lti.frameResize',height:document.querySelector('.wrap').offsetHeight+4},'*')}catch(e){}}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===t.dataset.p));post()});
const box=(x,y,w,h,c,t,t2)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-width="3"/><text x="${x+w/2}" y="${y+h/2-(t2?3:-5)}" text-anchor="middle" font-size="14" font-weight="700" fill="#222">${t}</text>${t2?`<text x="${x+w/2}" y="${y+h/2+15}" text-anchor="middle" font-size="12" fill="#444">${t2}</text>`:''}`;
const people=(x,y,c,n)=>Array.from({length:n},(_,i)=>`<circle cx="${x+i*16}" cy="${y}" r="5" fill="${c}"/><rect x="${x+i*16-4}" y="${y+7}" width="8" height="10" rx="3" fill="${c}"/>`).join('');
const D={
c:{svg:`<text x="450" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#d34147">Direction of inquiry: EXPOSURE → OUTCOME (forward in time)</text>
${box(20,100,150,60,'#1f6f8b','Start with people','free of disease')}
${box(250,45,170,56,'#d34147','Exposed','e.g., smokers')}${box(250,155,170,56,'#e8a33d','Unexposed','e.g., non-smokers')}
<path d="M170 120L248 80M170 140L248 180" stroke="#555" stroke-width="3" fill="none"/>
<path class="flow" d="M425 130H690" stroke="#222" stroke-width="5" fill="none"/><path d="M688 118L712 130L688 142Z" fill="#222"/>
<text x="560" y="120" text-anchor="middle" font-size="13" fill="#222">follow over time</text>
${box(720,45,160,56,'#d34147','Compare risk','disease vs. no disease')}${box(720,155,160,56,'#e8a33d','Compare risk','disease vs. no disease')}
${people(280,72,'#d34147',4)}${people(280,182,'#e8a33d',4)}`,
 a:['Measures: incidence, relative risk (RR)','Can be prospective or retrospective','Good for rare exposures; clear time order','Costly, slow; loss to follow-up'],h:['Strengths','Limitations']},
k:{svg:`<text x="450" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6f8b">Direction of inquiry: OUTCOME → past EXPOSURE (looking backward)</text>
${box(20,45,170,56,'#d34147','Cases','have the disease')}${box(20,155,170,56,'#2e8b57','Controls','do not have disease')}
${people(40,72,'#d34147',4)}${people(40,182,'#2e8b57',4)}
<path class="flow" d="M690 130H265" stroke="#222" stroke-width="5" fill="none"/><path d="M267 118L243 130L267 142Z" fill="#222"/>
<text x="480" y="120" text-anchor="middle" font-size="13" fill="#222">look back at past exposure</text>
<path d="M190 73L240 100M190 183L240 160" stroke="#555" stroke-width="3" fill="none"/>
${box(700,45,180,56,'#1f6f8b','Exposure history','of cases')}${box(700,155,180,56,'#1f6f8b','Exposure history','of controls')}`,
 a:['Measures: odds ratio (OR)','Efficient for rare disease or long latency','Faster and less expensive','Recall bias; control selection bias'],h:['Strengths','Limitations']}};
function show(k){$('bc').setAttribute('aria-pressed',k=='c');$('bk').setAttribute('aria-pressed',k=='k');const d=D[k];$('tl').innerHTML=d.svg;
$('cmp').innerHTML=`<div><b>Strengths</b><br>${d.a[0]}<br>${d.a[2]}<br>${d.a[1]}</div><div><b>Limitations</b><br>${d.a[3]}<br>Neither design randomly assigns exposure.</div>`;post()}
$('bc').onclick=()=>show('c');$('bk').onclick=()=>show('k');show('c');
// quiz engine
function quiz(cfg){let i=0,s=0,done=false;const Q=cfg.q.slice().sort(()=>Math.random()-.5);
function render(){done=false;const q=Q[i];$('pr'+cfg.id).textContent=`Question ${i+1} of ${Q.length}`;$('sc'+cfg.id).textContent=`Score: ${s}`;$('q'+cfg.id).textContent=q[0];
const o=$('o'+cfg.id);o.innerHTML='';cfg.opts.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>pick(j,b);o.appendChild(b)});
$('f'+cfg.id).className='fb';$('n'+cfg.id).style.display='none'}
function pick(j,b){if(done)return;done=true;const q=Q[i],ok=j==q[1];if(ok)s++;
[...$('o'+cfg.id).children].forEach((x,k)=>{x.disabled=true;if(k==q[1])x.classList.add('right');else if(x==b)x.classList.add('wrong')});
$('sc'+cfg.id).textContent=`Score: ${s}`;const f=$('f'+cfg.id);f.className='fb show '+(ok?'ok':'no');f.innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q[2];
const n=$('n'+cfg.id);n.style.display='inline-block';n.textContent=i==Q.length-1?'See result':'Next';post()}
$('n'+cfg.id).onclick=()=>{if(i<Q.length-1){i++;render()}else{$('q'+cfg.id).textContent=`You scored ${s} out of ${Q.length}.`;$('o'+cfg.id).innerHTML='';$('f'+cfg.id).className='fb';$('n'+cfg.id).textContent='Try again';$('n'+cfg.id).onclick=()=>{i=0;s=0;Q.sort(()=>Math.random()-.5);$('n'+cfg.id).onclick=null;quiz(cfg)}}};
render()}
quiz({id:2,opts:['Cohort study','Case-control study'],q:[
['Researchers want to know whether a rare liver cancer is linked to past exposure to a workplace solvent. Only 40 patients are available.',1,'A rare outcome calls for a case-control design: start with the cases and compare past exposure with controls.'],
['A health department enrolls 5,000 school-bus drivers and 5,000 office workers and follows them 10 years to compare asthma incidence.',0,'People are grouped by exposure and followed forward to count new cases, which is a cohort study.'],
['An outbreak team interviews 30 ill diners and 60 well diners about what they ate last Saturday.',1,'Grouping by illness and looking back at exposure is case-control.'],
['A team wants to measure the incidence of heart disease among people with a rare genetic mutation.',0,'Rare exposure plus a need for incidence points to a cohort study.'],
['A disease has a 25-year latency and the budget is small. Which design is more practical?',1,'Case-control is faster and cheaper, especially with long latency.'],
['You need direct calculation of relative risk and clear evidence that exposure came before disease.',0,'Cohort studies calculate risk directly and establish time order more clearly.']]});
quiz({id:3,opts:['Recall bias','Selection bias','Loss to follow-up'],q:[
['Mothers of children with birth defects remember medication use in pregnancy more thoroughly than mothers of healthy children.',0,'Cases remember exposures differently than controls: recall bias.'],
['A hospital-based study picks controls from patients in the cardiology ward, who differ from the general population.',1,'Controls who do not represent the source population introduce selection bias.'],
['In a 15-year cohort, the sickest participants move away and cannot be reached for follow-up.',2,'Differential dropout is loss to follow-up, a key cohort limitation.'],
['Only volunteers who already exercise regularly enroll in a fitness study of heart health.',1,'The study group differs systematically from the target population: selection bias.'],
['People with lung cancer overreport past asbestos contact while searching for an explanation.',0,'This is recall bias, which is common in case-control designs.']]});
</script></body></html>
