<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORGS 460 Leadership and Change | Week 2 | Start With Why</title>
<style>
:root{--red:#d34147;--red-d:#a8353a;--sand:#edebe8;--ink:#222;--mute:#5d5a56;--bg:#fcfcfc;--line:#e2ded8;
--navy:#2b4a63;--teal:#23857b;--gold:#d99a1f;--ok:#2e7d4f;--bad:#b3261e;--r:1rem}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.38}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:.5rem;padding:.6rem .8rem .7rem;max-width:62rem;margin:0 auto}
.top{display:flex;align-items:center;gap:.8rem;background:var(--sand);border-radius:var(--r);padding:.4rem .9rem;flex:none}
.top .hero{flex:none;width:4.6rem;height:3.4rem}.top .hero svg{width:100%;height:100%;display:block}
.eyebrow{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--red-d);font-weight:700}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.4rem;line-height:1.15;margin:.05rem 0 0}
.top .sub{margin-left:auto;font-size:.78rem;color:var(--mute);text-align:right;max-width:15rem;line-height:1.25}
.tabs{display:flex;gap:.4rem;flex:none;flex-wrap:wrap}
.tab,.sbtn{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:.3rem .85rem;font-weight:650;font-size:.88rem}
.tab:hover,.sbtn:hover{border-color:var(--red)}
.tab[aria-selected=true],.sbtn[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.stage{flex:1;min-height:0;overflow:hidden}
.panel{height:100%}.panel.on{display:block}.panel:not(.on){display:none!important}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:.75rem .95rem}
.rule{width:3.6rem;height:.3rem;background:var(--red);border-radius:5px;margin:0 0 .4rem}
h2{font-family:Georgia,serif;font-size:1.12rem;margin:0 0 .25rem;color:var(--red-d)}
h3{font-size:.95rem;margin:0 0 .2rem}
p{margin:.2rem 0}
.mute{color:var(--mute);font-size:.84rem}
.btn{background:var(--red);color:#fff;border:0;border-radius:999px;padding:.42rem 1.1rem;font-weight:700}
.btn:hover{background:var(--red-d)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--red-d);border:1.5px solid var(--red)}
.btn.ghost:hover{background:#fdf0f0}
.row{display:flex;gap:.6rem;align-items:center}
.sp{flex:1}
.fb{border-radius:.8rem;padding:.55rem .8rem;border-left:6px solid var(--ok);background:#eef7f1;font-size:.9rem}
.fb.no{border-color:var(--bad);background:#fdeeed}
.fb b{display:block}
.bar{height:.7rem;background:#ece9e4;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.pill{display:inline-block;border-radius:99px;padding:.08rem .6rem;font-size:.72rem;font-weight:700;color:#fff}
.hide{display:none!important}
@media (max-width:640px){.top .sub{display:none}.top .hero{width:3.4rem;height:2.6rem}h1{font-size:1.15rem}
.app{padding:.4rem .5rem}.tab{padding:.25rem .6rem;font-size:.8rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#circle{display:grid;grid-template-columns:1fr 1.25fr;grid-template-rows:1fr auto;gap:.6rem}
.gc{display:flex;align-items:center;justify-content:center;background:var(--sand);border-radius:var(--r);padding:.4rem}
.gc svg{width:100%;height:100%;max-height:21rem}
.ring{cursor:pointer;transition:opacity .2s}.ring:hover{opacity:.9}
.ring:focus-visible{outline:none}.ring:focus-visible path,.ring:focus-visible circle{stroke:#1a73e8;stroke-width:5}
.dcard{display:flex;flex-direction:column;gap:.5rem;justify-content:center;border-top:.4rem solid var(--c,var(--red))}
.dcard h2{font-size:1.5rem;margin:0;color:var(--c)}
.dcard p{font-size:1.02rem}
.say{background:var(--sand);border-radius:.8rem;padding:.5rem .75rem;font-size:.9rem;font-style:italic}
.found{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:.4rem;align-items:stretch}
.fnd{background:#fff;border:1px solid var(--line);border-radius:.8rem;padding:.4rem .7rem;font-size:.82rem;display:flex;gap:.5rem;align-items:center}
.fnd svg{width:1.9rem;height:1.9rem;flex:none}.fnd b{display:block;color:var(--red-d);font-size:.86rem}
.arrow{align-self:center;color:var(--red);font-weight:800;font-size:1.2rem}
/* build */
#build{display:flex;flex-direction:column;gap:.5rem}
.scs{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem}
.slot{border:2px dashed #c9c4bc;border-radius:.8rem;padding:.4rem .6rem;min-height:4.6rem;font-size:.82rem;background:#fff;position:relative}
.slot .n{position:absolute;top:-.6rem;left:.6rem;background:var(--ink);color:#fff;border-radius:99px;font-size:.68rem;font-weight:800;padding:.05rem .5rem}
.slot.filled{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.slot .t{font-weight:800;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.deck{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem}
.mc{background:#fff;border:2px solid var(--c);border-left-width:6px;border-radius:.8rem;padding:.4rem .6rem;text-align:left;font-size:.82rem;line-height:1.3}
.mc b{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.mc:hover:not([disabled]){background:color-mix(in srgb,var(--c) 7%,#fff)}
.mc[disabled]{opacity:.25;cursor:default}
.gauge{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:center}
.gauge .bar{height:1rem}
.bubble{background:#fff;border:1.5px solid var(--line);border-radius:1rem 1rem 1rem .2rem;padding:.4rem .7rem;font-size:.88rem;position:relative}
.rx{display:flex;gap:.6rem;align-items:center}.rx svg{width:2.6rem;height:2.6rem;flex:none}
/* vision */
#vision{display:flex;flex-direction:column;gap:.5rem}
.vs{font-family:Georgia,serif;font-size:1.3rem;text-align:center;padding:.5rem .6rem;line-height:1.3}
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.q{background:#fff;border:1.5px solid var(--line);border-radius:.9rem;padding:.4rem .6rem}
.q h3{font-size:.88rem}.q .mute{font-size:.74rem;display:block;line-height:1.25;margin-bottom:.3rem}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:.3rem}
.yn button{border:2px solid var(--line);background:#fff;border-radius:.6rem;padding:.2rem;font-weight:700;font-size:.85rem}
.yn button[aria-pressed=true]{border-color:var(--navy);background:#e2eaf1}
.yn button.ok{border-color:var(--ok);background:#eef7f1}.yn button.no{border-color:var(--bad);background:#fdeeed}
.q.mark{box-shadow:inset 0 0 0 2px var(--ok)}.q.bad{box-shadow:inset 0 0 0 2px var(--bad)}
@media (max-width:640px){
 #circle{grid-template-columns:1fr;grid-template-rows:auto auto auto}.gc svg{max-height:10rem}
 .found{grid-template-columns:1fr}.arrow{display:none}.fnd{padding:.25rem .5rem}
 .gauge{grid-template-columns:1fr}.mc[disabled]{display:none}.slot{min-height:3.4rem}#build .card>p.mute{display:none}.slots,.deck{grid-template-columns:1fr 1fr}.qs{grid-template-columns:1fr}.vs{font-size:1.05rem}
 .q{display:grid;grid-template-columns:1fr auto;gap:.4rem;align-items:center}.q .mute{display:none}.yn{min-width:7rem}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hero" aria-hidden="true">
      <svg viewBox="0 0 80 60"><circle cx="40" cy="30" r="28" fill="#edebe8" stroke="#222" stroke-width="2"/><circle cx="40" cy="30" r="19" fill="#f0a9ac" stroke="#222" stroke-width="2"/><circle cx="40" cy="30" r="10" fill="#d34147" stroke="#222" stroke-width="2"/>
      <path d="M40 30 L74 6" stroke="#222" stroke-width="2.4" stroke-linecap="round"/><path d="M74 6l-9 1 6 6z" fill="#222"/></svg>
    </div>
    <div><div class="eyebrow">ORGS 460 Leadership and Change · Week 2</div><h1>Start With Why</h1></div>
    <div class="sub">Foundations for Leading Change: purpose, moral purpose, and vision.</div>
  </header>
  <nav class="tabs" aria-label="Activity sections">
    <button class="tab" data-p="circle" aria-selected="true">1 · The Why Circle</button>
    <button class="tab" data-p="build" aria-selected="false">2 · Build the Message</button>
    <button class="tab" data-p="vision" aria-selected="false">3 · Vision Check</button>
  </nav>
  <main class="stage">
    <section class="panel on" id="circle" role="tabpanel">
      <div class="gc"><svg viewBox="0 0 300 300" role="group" aria-label="Three concentric rings: Why, How, What. Select a ring to learn more">
        <g class="ring" tabindex="0" role="button" aria-label="What ring" data-k="what"><circle cx="150" cy="150" r="140" fill="#ddd9d3" stroke="#222" stroke-width="3"/><text x="150" y="36" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#222">WHAT</text></g>
        <g class="ring" tabindex="0" role="button" aria-label="How ring" data-k="how"><circle cx="150" cy="150" r="95" fill="#f0a9ac" stroke="#222" stroke-width="3"/><text x="150" y="92" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#222">HOW</text></g>
        <g class="ring" tabindex="0" role="button" aria-label="Why ring" data-k="why"><circle cx="150" cy="150" r="50" fill="#d34147" stroke="#222" stroke-width="3"/><text x="150" y="159" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="26" fill="#fff">WHY</text></g>
        
      </svg></div>
      <div class="card dcard" id="gdet" aria-live="polite"></div>
      <div class="found">
        <div class="fnd"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#fbe3e4"/><circle cx="16" cy="16" r="9" fill="#d34147"/><circle cx="16" cy="16" r="3.5" fill="#fff"/></svg><div><b>Understand your why</b>The purpose behind the change.</div></div>
        <span class="arrow" aria-hidden="true">&rarr;</span>
        <div class="fnd"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#e2eaf1"/><path d="M16 26s-9-5.6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.400-9 12-9 12z" fill="#2b4a63"/></svg><div><b>Hold your moral purpose</b>Value and treat people fairly.</div></div>
        <span class="arrow" aria-hidden="true">&rarr;</span>
        <div class="fnd"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#dcf0ed"/><path d="M3 19c4-8 10-11 15-9l-2 3 8-1-5 7-1-3c-4-1-9 1-12 5z" fill="#23857b"/></svg><div><b>Cast a vision</b>The future you are creating.</div></div>
      </div>
    </section>

    <section class="panel" id="build" role="tabpanel"><div id="buildBody" style="display:flex;flex-direction:column;gap:.5rem"></div></section>
    <section class="panel" id="vision" role="tabpanel"><div id="visBody" style="display:flex;flex-direction:column;gap:.5rem"></div></section>
  </main>
</div>
<script>
/* Shared helpers: tabs + fit-to-frame (prevents a second scrollbar inside the Canvas iframe) */
var $=function(s,e){return (e||document).querySelector(s)};
var $$=function(s,e){return Array.prototype.slice.call((e||document).querySelectorAll(s))};
var ROOT=document.documentElement;
function fit(){
  var st=$('.stage'),app=$('.app'),s=16;
  ROOT.style.fontSize=s+'px';
  var over=function(){return st.scrollHeight>st.clientHeight+1||st.scrollWidth>st.clientWidth+1||app.scrollHeight>app.clientHeight+1};
  while(over()&&s>9.5){s-=.5;ROOT.style.fontSize=s+'px'}
  st.style.overflowY=over()?'auto':'hidden'; /* last-resort only; normally never shown */
}
var _fq;function refit(){cancelAnimationFrame(_fq);_fq=requestAnimationFrame(fit)}
function showTab(id){
  $$('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.p===id)});
  $$('.panel').forEach(function(p){p.classList.toggle('on',p.id===id)});
  refit();
}
function initTabs(){
  var tabs=$$('.tab');
  tabs.forEach(function(t,i){
    t.setAttribute('role','tab');
    t.addEventListener('click',function(){showTab(t.dataset.p)});
    t.addEventListener('keydown',function(e){
      var n=e.key==='ArrowRight'?i+1:e.key==='ArrowLeft'?i-1:null;
      if(n!==null){n=(n+tabs.length)%tabs.length;tabs[n].focus();showTab(tabs[n].dataset.p)}
    });
  });
  $$('[data-icon]').forEach(function(e){e.innerHTML=ICON[e.dataset.icon]});
  window.addEventListener('resize',refit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refit);
  refit();
}

var ICON={};
/* ---------- 1 CIRCLE ---------- */
var GC={
why:{c:'#d34147',n:'Why',t:'Your purpose',d:'The reason the change matters, whom it serves, and what future it makes possible. Great leaders communicate it first, because it connects the change to what people value.',s:'\u201CBefore I show you the plan, let me tell you why this matters to us.\u201D'},
how:{c:'#a8353a',n:'How',t:'Your approach',d:'The values and ways of working that bring the purpose to life: how people will be treated and how the work will get done.',s:'\u201CHere is how we will do this together, and the principles we will hold to.\u201D'},
what:{c:'#5d5a56',n:'What',t:'The plan',d:'The tasks, steps, and results. Leaders often announce this part first, but people commit more readily when they have already heard the why.',s:'\u201CStarting in January, this is what will change.\u201D'}};
function gsel(k){
  var g=GC[k];$('#gdet').style.setProperty('--c',g.c);
  $$('.ring').forEach(function(r){r.style.opacity=(r.dataset.k===k)?1:.55});
  $('#gdet').innerHTML='<div class="eyebrow" style="color:'+g.c+'">'+g.t+'</div><h2>'+g.n+'</h2><p>'+g.d+'</p><div class="say">'+g.s+'</div>'+
  (k==='why'?'<p class="mute">Sinek\u2019s TED Talk argues that great leaders inspire action by communicating <b>why</b> before how and what.</p>':'');
  refit();
}
$$('.ring').forEach(function(r){r.onclick=function(){gsel(r.dataset.k)};r.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();gsel(r.dataset.k)}}});
gsel('why');

/* ---------- 2 BUILD ---------- */
var COLS={why:'#d34147',who:'#2b4a63',vis:'#23857b',plan:'#5d5a56'};
var LAB={why:'Why',who:'Who it serves',vis:'Vision',plan:'The plan'};
var BS=[
{name:'Campus ministry restructure',why:'We exist to help every student find belonging and purpose, and too many are slipping through the cracks.',who:'Students who feel overlooked, and the volunteers who care for them, deserve a team that is fair and well equipped.',vis:'Picture a campus where every student is known by name and has a place to serve.',plan:'Starting in January, we will merge three ministry teams into one and move to a shared weekly schedule.'},
{name:'Hospital scheduling change',why:'Our nurses are burning out and patients feel the strain. The way we schedule is part of the cause.',who:'Nurses, patients, and families all deserve care that is safe, fair, and sustainable.',vis:'Imagine a unit where shifts are predictable, teams are rested, and patients feel unhurried care.',plan:'On March 1 we will move every unit to a new self-scheduling system, with two weeks of training.'},
{name:'Summer program launch',why:'Kids in our neighborhood lose ground every summer, and families have few affordable options.',who:'Families and neighbors, and the volunteers who show up, deserve a program built with them, not just for them.',vis:'Imagine every child here starting the school year confident and ready.',plan:'We will open a six-week program in June, led by two paid staff and twenty trained volunteers.'}];
var bi=0,order=[];
function renderBuild(){
  var s=BS[bi],B=$('#buildBody'),sc='';
  BS.forEach(function(x,i){sc+='<button class="sbtn" data-b="'+i+'" aria-selected="'+(i===bi)+'" style="font-size:.8rem">'+x.name+'</button>'});
  var slots='';for(var i=0;i<4;i++){var k=order[i];slots+='<div class="slot'+(k?' filled':'')+'"'+(k?' style="--c:'+COLS[k]+'"':'')+'><span class="n">'+(i+1)+'</span>'+(k?'<div class="t">'+LAB[k]+'</div>'+s[k]:'<span class="mute">Tap a card below</span>')+'</div>'}
  var deck='';['plan','vis','why','who'].forEach(function(k){deck+='<button class="mc" style="--c:'+COLS[k]+'" data-k="'+k+'"'+(order.indexOf(k)>-1?' disabled':'')+'><b>'+LAB[k]+'</b>'+s[k]+'</button>'});
  B.innerHTML='<div class="card"><div class="rule"></div><h2>Order the announcement</h2><p class="mute" style="margin:0">You are announcing a change. Tap the four message cards in the order you would say them. Where does the plan belong?</p></div>'+
   '<div class="scs"><span class="mute">Scenario:</span>'+sc+'</div><div class="slots">'+slots+'</div><div class="deck">'+deck+'</div><div id="out"></div>';
  $$('[data-b]').forEach(function(b){b.onclick=function(){bi=+b.dataset.b;order=[];renderBuild()}});
  $$('.mc').forEach(function(b){b.onclick=function(){order.push(b.dataset.k);renderBuild()}});
  if(order.length===4)result();
  refit();
}
function result(){
  var pos=function(k){return order.indexOf(k)},sc=0;
  sc+=[40,25,10,0][pos('why')];sc+=[0,5,15,30][pos('plan')];
  sc+=pos('who')<pos('plan')?15:0;sc+=pos('vis')<pos('plan')?15:0;
  var first=order[0],col=sc>=80?'#2e7d4f':sc>=50?'#d99a1f':'#b3261e';
  var bub=first==='plan'?'\u201CAnother reorganization? What does this mean for my job?\u201D':first==='why'?'\u201COkay, I see why this matters. Tell me more.\u201D':first==='who'?'\u201CGood, they are thinking about people. But why now?\u201D':'\u201CNice picture\u2026 but what are we actually doing, and why?\u201D';
  var lbl=sc>=80?'Strong buy-in':sc>=50?'Mixed buy-in':'Low buy-in';
  var tip=pos('plan')<2?'Leading with the plan makes people react to the <i>what</i> before they understand the <i>why</i>.':pos('why')>0?'Try opening with the why. Explaining the purpose first connects the change to what people value.':'You started with the why and saved the plan for last. That is the Sinek pattern: purpose first, plan after.';
  $('#out').innerHTML='<div class="card gauge"><div class="rx"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="'+col+'" opacity=".2" stroke="'+col+'" stroke-width="2"/><circle cx="14" cy="16" r="2.2" fill="#222"/><circle cx="26" cy="16" r="2.2" fill="#222"/>'+
   (sc>=80?'<path d="M11 24q9 9 18 0" fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round"/>':sc>=50?'<path d="M12 26h16" stroke="#222" stroke-width="2.4" stroke-linecap="round"/>':'<path d="M11 29q9-9 18 0" fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round"/>')+'</svg><div class="bubble">'+bub+'</div></div>'+
   '<div><div class="row"><b style="font-size:.9rem">Team buy-in: <span style="color:'+col+'">'+lbl+'</span></b><span class="sp"></span><span class="mute">'+sc+' / 100</span></div><div class="bar"><i style="width:'+sc+'%;background:'+col+'"></i></div><p class="mute" style="margin-top:.25rem">'+tip+'</p></div>'+
   '<div style="grid-column:1/-1;text-align:right"><button class="btn ghost" id="rs">Reset</button></div></div>';
  $('#rs').onclick=function(){order=[];renderBuild()};
}
/* ---------- 3 VISION ---------- */
var VS=[
{t:'To leverage cross-functional synergies and optimize stakeholder value across verticals.',k:[0,0,0],e:'Jargon makes it unclear, there is nothing vivid to remember, and no picture of a future.'},
{t:'A home for every family in our city.',k:[1,1,1],e:'Plain words, short enough to repeat, and it paints a picture of a future worth building.'},
{t:'We value excellence, integrity, innovation, teamwork, service, and growth.',k:[1,0,0],e:'That is a list of values, not a vision. It is clear but forgettable, and it does not describe a future.'},
{t:'In ten years, we will be the largest, most admired, most innovative, most responsive provider in every market we touch.',k:[1,0,1],e:'It points to a future, but the stack of superlatives is long, generic, and hard to remember.'}];
var QN=[['Clear','Would most people understand it right away?'],['Memorable','Short and vivid enough to repeat?'],['A future','Does it describe what we are creating?']];
var vi=0,va=[null,null,null],vscore=0,vchecked=false;
function renderVis(){
  var B=$('#visBody');
  if(vi>=VS.length){
    B.innerHTML='<div class="card" style="text-align:center;display:flex;flex-direction:column;gap:.5rem;align-items:center"><div class="eyebrow">Vision Check complete</div><div style="font-family:Georgia,serif;font-size:2.4rem;color:var(--red-d);line-height:1">'+vscore+' / 12</div>'+
    '<p>A vision people can understand and remember is clear, memorable, and describes a future.</p>'+
    '<div class="ask" style="background:var(--sand);border-radius:.8rem;padding:.5rem .75rem;text-align:left;font-size:.9rem"><b style="color:var(--red-d)">Next:</b> Think of an organization you know. Is its vision clear? Then see Fullan\u2019s models (Kotter; Beer, Eisenstat &amp; Spector; Hamel) for your Foundations assignment. No single model fits every situation.</div><button class="btn" id="vr">Try again</button></div>';
    $('#vr').onclick=function(){vi=0;vscore=0;va=[null,null,null];vchecked=false;renderVis()};refit();return;}
  var s=VS[vi],q='';
  QN.forEach(function(n,i){q+='<div class="q" id="q'+i+'"><div><h3>'+n[0]+'?</h3><span class="mute">'+n[1]+'</span></div><div class="yn"><button data-q="'+i+'" data-a="1" aria-pressed="'+(va[i]===1)+'">Yes</button><button data-q="'+i+'" data-a="0" aria-pressed="'+(va[i]===0)+'">No</button></div></div>'});
  B.innerHTML='<div class="row"><span class="mute">Statement '+(vi+1)+' of '+VS.length+'</span><span class="sp"></span><span class="mute">Score: <b>'+vscore+'</b></span></div>'+
   '<div class="card"><div class="eyebrow">Is this a vision people can understand and remember?</div><div class="vs">\u201C'+s.t+'\u201D</div></div><div class="qs">'+q+'</div><div id="vf"></div>'+
   '<div class="row"><span class="sp"></span><button class="btn" id="vc" '+(va.indexOf(null)>-1&&!vchecked?'disabled':'')+'>'+(vchecked?(vi===VS.length-1?'See results':'Next statement'):'Check my answers')+'</button></div>';
  $$('.yn button').forEach(function(b){b.onclick=function(){if(vchecked)return;va[+b.dataset.q]=+b.dataset.a;renderVis()}});
  $('#vc').onclick=function(){
    if(!vchecked){vchecked=true;var n=0;
      va.forEach(function(a,i){var ok=a===s.k[i];if(ok){n++;vscore++}$('#q'+i).classList.add(ok?'mark':'bad');
        $$('#q'+i+' button').forEach(function(b){if(+b.dataset.a===s.k[i])b.classList.add('ok');else if(+b.dataset.a===a)b.classList.add('no')})});
      $('#vf').innerHTML='<div class="fb'+(n===3?'':' no')+'"><b>'+n+' of 3 matched.</b>'+s.e+'</div>';
      $('#vc').textContent=vi===VS.length-1?'See results':'Next statement';$('.row .mute b').textContent=vscore;refit();
    } else {vi++;va=[null,null,null];vchecked=false;renderVis()}
  };
  if(vchecked){ /* re-mark after re-render */ }
  refit();
}
initTabs();renderBuild();renderVis();
</script>
</body>
</html>
