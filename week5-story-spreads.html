<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Story Spreads</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1f2a44;--ink2:#4a5675;--gold:#c8962e;--gold2:#f3dfae;--parch:#fbf6ea;--line:#e6dcc3;--sage:#3f7d6b;--rose:#a8433b;--sky:#3b6ea5;--white:#fff}
html,body{height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45}
.app{height:100vh;display:flex;flex-direction:column;background:var(--parch);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hdr{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(100deg,#1f2a44,#2f3e66);color:#fff}
.hdr svg{flex:0 0 auto;width:44px;height:44px}
.hdr h1{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700;line-height:1.15}
.hdr p{font-size:12.5px;color:#d9def0}
.tag{margin-left:auto;background:var(--gold);color:#1f2a44;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.main{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;padding:12px 16px;scrollbar-width:thin}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600}
.btn:hover{background:#2f3e66}.btn:disabled{opacity:.4;cursor:default}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{background:#fff;border:2px solid var(--line);border-radius:99px;padding:5px 14px;font-weight:600;font-size:14px;color:var(--ink2)}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(31,42,68,.08)}
.sr{position:absolute;left:-9999px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){.hdr p{display:none}.tag{display:none}}

.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;height:calc(100% - 50px)}
.col{display:flex;flex-direction:column;gap:8px;min-height:0}
.fig{border:2px solid var(--gold);border-radius:12px;background:#f7ead0;overflow:hidden}
.fig svg{display:block;width:100%;height:auto;max-height:430px}
.ring{cursor:pointer;transition:opacity .2s}
.ring:focus-visible{outline:none;stroke:#1f2a44;stroke-width:4}
.list{display:flex;flex-direction:column;gap:6px}
.rb{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:7px 10px;text-align:left;font-weight:600}
.rb i{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.rb[aria-pressed=true]{border-color:var(--ink);background:var(--gold2)}
.info h3{font-family:Georgia,serif;font-size:18px;margin-bottom:3px}
.info p{font-size:14px;margin-bottom:5px}
.info .ask{font-size:13.5px;background:#fbf3df;border-left:4px solid var(--gold);padding:6px 10px;border-radius:0 8px 8px 0}
.stepbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sd{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700}
.sd[aria-current=step]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sd.seen{border-color:var(--gold)}
.sp{flex:1}
@media (max-width:700px){.grid{grid-template-columns:1fr;height:auto}}
</style></head><body>
<div class="app">
<header class="hdr"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#c8962e"/><path d="M10 14c5-2 10-1 14 2 4-3 9-4 14-2v21c-5-2-10-1-14 2-4-3-9-4-14-2z" fill="#fbf6ea"/><path d="M24 16v21" stroke="#c8962e" stroke-width="2"/><path d="M14 20h7M14 24h7M14 28h7M27 20h7M27 24h7M27 28h7" stroke="#b9ab86" stroke-width="1.4"/></svg><div><h1>The Story Spreads</h1><p>Follow the Spirit from Jerusalem to the ends of the earth</p></div><span class="tag">Week 5</span></header>
<main class="main" id="main">
<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true" id="t1">Acts 1:8 ripple</button><button class="tab" role="tab" aria-selected="false" id="t2">Pentecost to community</button></div>
<div id="v1" class="grid">
 <div class="col"><div class="fig" id="map" role="group" aria-label="Three rings showing how the good news spreads"></div></div>
 <div class="col"><div class="list" id="rings"></div><div class="card info" id="rinfo" aria-live="polite"></div></div>
</div>
<div id="v2" class="grid hide">
 <div class="col"><div class="fig" id="scene" role="img"></div>
  <div class="stepbar"><button class="btn alt" id="prev">‹ Back</button><span id="dots" class="stepbar"></span><span class="sp"></span><button class="btn" id="nxt">Next ›</button></div></div>
 <div class="col"><div class="card info" id="sinfo" aria-live="polite"></div></div>
</div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
/* ---------- Tab 1: ripple ---------- */
const R=[
 {k:'jer',n:'Jerusalem',c:'#c8962e',r:50,ref:'Acts 1-7',t:'The story begins where Luke ended. The disciples wait, the Spirit comes at Pentecost, and the first community forms in the city where Jesus was crucified.',q:'Why might it matter that the good news starts in Jerusalem?'},
 {k:'jud',n:'Judea and Samaria',c:'#3f7d6b',r:94,ref:'Acts 8',t:'Persecution scatters believers, and wherever they go they keep sharing the message. Philip carries it to Samaria and speaks with an Ethiopian official.',q:'How does scattering become expansion in this part of the story?'},
 {k:'end',n:'The ends of the earth',c:'#3b6ea5',r:128,ref:'Acts 28',t:'The message crosses boundaries to Gentiles and travels with Paul all the way to Rome, the center of the empire.',q:'Where might the ends of the earth be in your own setting?'}
];
let rk='jer';
function drawMap(){
 const cx=200,cy=150;
 let s=`<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7d6"/><stop offset="1" stop-color="#f7ead0"/></radialGradient></defs><rect width="400" height="300" fill="url(#g)"/>`;
 [...R].reverse().forEach(o=>{
  const on=o.k===rk;
  s+=`<circle class="ring" tabindex="0" role="button" aria-label="${o.n}" data-k="${o.k}" cx="${cx}" cy="${cy}" r="${o.r}" fill="${o.c}" fill-opacity="${on?.38:.14}" stroke="${o.c}" stroke-width="${on?5:2.5}" ${on?'':'stroke-dasharray="6 6"'}/>`;
 });
 s+=`<g transform="translate(200 150)"><path d="M0 -26c12 14 18 24 12 36-3 7-9 11-12 11s-9-4-12-11c-6-12 0-22 12-36z" fill="#e2574c"/><path d="M0 -10c6 8 9 14 6 20-2 4-4 6-6 6s-4-2-6-6c-3-6 0-12 6-20z" fill="#f6c453"/></g>`;
 s+=`<text x="200" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2a44">Jerusalem</text>`;
 s+=`<text x="200" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2a44">Judea and Samaria</text>`;
 s+=`<text x="200" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2a44">The ends of the earth</text>`;
 s+=`<text x="200" y="290" text-anchor="middle" font-size="12" fill="#4a5675" font-style="italic">“You will be my witnesses…” Acts 1:8</text></svg>`;
 $('map').innerHTML=s;
 $('map').querySelectorAll('.ring').forEach(e=>{e.onclick=()=>{rk=e.dataset.k;ring()};e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();rk=e.dataset.k;ring()}}});
}
function ring(){
 drawMap();
 $('rings').innerHTML=R.map(o=>`<button class="rb" data-k="${o.k}" aria-pressed="${o.k===rk}"><i style="background:${o.c}"></i>${o.n} <span style="margin-left:auto;font-weight:400;color:#4a5675">${o.ref}</span></button>`).join('');
 $('rings').querySelectorAll('.rb').forEach(b=>b.onclick=()=>{rk=b.dataset.k;ring()});
 const o=R.find(x=>x.k===rk);
 $('rinfo').innerHTML=`<h3>${o.n}</h3><p>${o.t}</p><div class="ask"><b>Think about it:</b> ${o.q}</div>`;
}
/* ---------- Tab 2: Pentecost stepper ---------- */
const H=(x,y,c,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="-22" r="7" fill="#e8b98d"/><path d="M-9 -14h18l3 26h-24z" fill="${c}"/></g>`;
const F=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 -16c7 8 10 14 7 20-1 3-4 5-7 5s-6-2-7-5c-3-6 0-12 7-20z" fill="#e2574c"/><path d="M0 -6c4 5 5 8 3 12-1 2-2 3-3 3s-2-1-3-3c-2-4-1-7 3-12z" fill="#f6c453"/></g>`;
const cols=['#3b6ea5','#a8433b','#3f7d6b','#5b4b8a','#c8962e','#7a6f66'];
const sc=[
`<svg viewBox="0 0 400 240"><rect width="400" height="240" fill="#2f3e66"/><rect x="40" y="40" width="320" height="170" rx="8" fill="#f7e1b0"/><rect x="40" y="40" width="320" height="22" fill="#c59e66"/><rect x="170" y="90" width="60" height="50" rx="4" fill="#fff6dc"/><path d="M200 90v50M170 115h60" stroke="#c59e66" stroke-width="3"/>${[80,125,165,235,275,320].map((x,i)=>H(x,190,cols[i],1.1)).join('')}<g stroke="#c8962e" stroke-width="3" fill="none" stroke-linecap="round"><path d="M70 158l-6-12M115 158l-6-12M155 158l-6-12M245 158l6-12M285 158l6-12M330 158l6-12"/></g><text x="200" y="30" text-anchor="middle" fill="#f6efd0" font-weight="700" font-size="14">Waiting and praying together</text></svg>`,
`<svg viewBox="0 0 400 240"><rect width="400" height="240" fill="#2f3e66"/><rect x="40" y="40" width="320" height="170" rx="8" fill="#f7e1b0"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"><path d="M10 70c40-18 70 20 110 0s60-18 90 0"/><path d="M190 120c40-18 80 20 120 0s50-14 80 0"/><path d="M10 150c30-12 60 14 90 0"/></g>${[80,125,165,235,275,320].map((x,i)=>H(x,196,cols[i],1.1)+F(x,152,1.2)).join('')}<text x="200" y="30" text-anchor="middle" fill="#f6efd0" font-weight="700" font-size="14">Wind and fire (Acts 2:1-4)</text></svg>`,
`<svg viewBox="0 0 400 240"><rect width="400" height="240" fill="#fbe5b9"/><path d="M0 190h400v50H0z" fill="#d9bd8a"/>${[60,130,200,270,340].map((x,i)=>H(x,205,cols[i],1.15)).join('')}${[[60,'#3b6ea5','א'],[130,'#a8433b','α'],[200,'#3f7d6b','ع'],[270,'#5b4b8a','Ω'],[340,'#c8962e','ß']].map(([x,c,t],i)=>`<g><path d="M${x-26} ${96-i%2*18}h52a8 8 0 0 1 8 8v22a8 8 0 0 1-8 8H${x-6}l-8 12v-12h-12a8 8 0 0 1-8-8v-22a8 8 0 0 1 8-8z" fill="${c}"/><text x="${x}" y="${123-i%2*18}" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">${t}</text></g>`).join('')}<text x="200" y="28" text-anchor="middle" fill="#1f2a44" font-weight="700" font-size="14">Each person hears in their own language (Acts 2:5-13)</text></svg>`,
`<svg viewBox="0 0 400 240"><rect width="400" height="240" fill="#fbe5b9"/><path d="M0 200h400v40H0z" fill="#d9bd8a"/><rect x="140" y="140" width="120" height="60" fill="#c9a36b"/><rect x="120" y="190" width="160" height="14" fill="#a9824c"/>${H(200,168,'#a8433b',1.5)}<g transform="translate(200 78)"><rect x="-58" y="-24" width="116" height="48" rx="8" fill="#fff" stroke="#c8962e" stroke-width="3"/><path d="M-28 28l28 -4 28 4" fill="none"/><text x="0" y="-4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a44">“I will pour out my</text><text x="0" y="14" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a44">Spirit on all people”</text></g>${[40,80,320,360].map((x,i)=>H(x,215,cols[i],1)).join('')}<text x="200" y="22" text-anchor="middle" fill="#1f2a44" font-weight="700" font-size="14">Peter explains: this is what Joel promised (Acts 2:14-21)</text></svg>`,
`<svg viewBox="0 0 400 240"><rect width="400" height="240" fill="#fbf3df"/><path d="M30 80h340L200 26z" fill="#c8962e"/><rect x="40" y="80" width="320" height="12" fill="#a9824c"/>${[['Teaching','#3b6ea5','M10 6h24v20H10zM14 12h16M14 17h16M14 22h10'],['Fellowship','#a8433b','M8 24c-2-8 4-14 14-14s16 6 14 14M14 12a5 5 0 1 0 0-.1'],['Shared meals','#3f7d6b','M6 22h32M10 22c0-10 6-14 12-14s12 4 12 14'],['Prayer','#5b4b8a','M22 4l-6 12 6 12 6-12zM22 14v8']].map(([n,c,p],i)=>`<g transform="translate(${52+i*76} 100)"><rect x="0" y="0" width="52" height="96" rx="6" fill="${c}"/><rect x="-4" y="-2" width="60" height="8" fill="#a9824c"/><g transform="translate(4 24) scale(.9)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></g><text x="26" y="82" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="700">${n}</text></g>`).join('')}<rect x="30" y="196" width="340" height="12" fill="#a9824c"/><text x="200" y="228" text-anchor="middle" fill="#a8433b" font-weight="700" font-size="13">…and they shared with anyone in need</text></svg>`
];
const S=[
 {n:'Waiting and praying',ref:'Acts 1',t:'Jesus is taken up, and the disciples wait in Jerusalem for the promised Spirit. They pray together and choose Matthias to take Judas’ place among the twelve.',q:'Who is gathered in the upper room? What does that tell you about the first church?'},
 {n:'Wind and fire',ref:'Acts 2:1-4',t:'The Spirit comes with wind and fire. The coming of the Spirit marks a new stage in God’s work and links back to the promise in Luke 24.',q:'How does Pentecost fit into the story of redemption?'},
 {n:'Many languages',ref:'Acts 2:5-13',t:'People from many nations hear the disciples in their own languages. The message is for people of every nation.',q:'What does it say about God’s purpose that everyone hears in their own language?'},
 {n:'Peter explains',ref:'Acts 2:14-21',t:'Peter explains that this is what the prophet Joel promised. He connects what is happening to Scripture the crowd already knows.',q:'Why does Peter begin with Scripture rather than with a new idea?'},
 {n:'A new community',ref:'Acts 2:42-47',t:'The first believers devote themselves to teaching, fellowship, shared meals, and prayer, and they share what they have with those in need. Generosity and worship go together.',q:'What does this picture of church invite you to consider?'}
];
let si=0,seen=new Set([0]);
function step(){
 $('scene').innerHTML=sc[si];$('scene').setAttribute('aria-label',S[si].n);
 $('dots').innerHTML=S.map((_,n)=>`<button class="sd ${seen.has(n)?'seen':''}" ${n===si?'aria-current="step"':''} aria-label="Step ${n+1}: ${S[n].n}" data-n="${n}">${n+1}</button>`).join('');
 $('dots').querySelectorAll('.sd').forEach(b=>b.onclick=()=>{si=+b.dataset.n;seen.add(si);step()});
 const o=S[si];
 $('sinfo').innerHTML=`<h3>${si+1}. ${o.n} <small style="font-weight:400;color:#4a5675">· ${o.ref}</small></h3><p>${o.t}</p><div class="ask"><b>Think about it:</b> ${o.q}</div>`;
 $('prev').disabled=si===0;$('nxt').disabled=si===S.length-1;
}
$('prev').onclick=()=>{si--;seen.add(si);step()};
$('nxt').onclick=()=>{si++;seen.add(si);step()};
function tab(n){
 $('t1').setAttribute('aria-selected',n===1);$('t2').setAttribute('aria-selected',n===2);
 $('v1').classList.toggle('hide',n!==1);$('v2').classList.toggle('hide',n!==2);
}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
ring();step();
</script>
</body></html>
