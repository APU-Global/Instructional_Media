<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero’s Journey – Level 1: Accept the Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0e1030; --bg2:#1c1f55; --panel:#1f2460; --panel2:#2a307a; --line:#5560d6;
  --text:#f6f7ff; --muted:#c9ccf5; --gold:#ffd24a; --gold-d:#b8891a; --teal:#4de1c1; --pink:#ff7aa8; --ink:#1a1440;
  --pixel:'Press Start 2P','Courier New',monospace;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body);font-size:18px;line-height:1.55;color:var(--text);min-height:100vh;
  background:
    radial-gradient(2px 2px at 20px 30px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 90px 120px,rgba(255,255,255,.7),transparent),
    radial-gradient(2px 2px at 160px 60px,var(--gold),transparent),
    radial-gradient(1.5px 1.5px at 130px 170px,rgba(255,255,255,.6),transparent),
    linear-gradient(var(--bg1),var(--bg2));
  background-size:200px 200px,200px 200px,200px 200px,200px 200px,100% 100%;
}
.app{max-width:980px;margin:0 auto;padding:14px 14px 40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0}
:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:#0a0c2a;border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:16px}
.lvl{font-family:var(--pixel);font-size:12px;color:var(--gold)}
.hud-name{font-size:15px;color:var(--muted);margin-left:10px}
.hud-m{display:flex;gap:6px}
.hud-r{display:flex;align-items:center;gap:10px}
.xpbar{width:150px;height:16px;background:#1a1d4d;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.xpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .6s}
.xplabel{font-family:var(--pixel);font-size:10px;color:var(--teal)}

/* panels */
.panel{background:var(--panel);border:4px solid var(--line);border-radius:16px;box-shadow:0 8px 0 #0a0c2a;padding:20px;margin-bottom:22px}
.sub{font-family:var(--pixel);font-size:13px;line-height:1.6;color:var(--gold);margin-bottom:14px}
.small{font-size:15px;color:var(--muted)}
.note{margin:16px 0 0;padding:10px 14px;border-left:5px solid var(--teal);background:rgba(77,225,193,.12);border-radius:0 10px 10px 0;font-size:16px}

/* title */
.scene{border:4px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 0 #0a0c2a;background:#141a52}
.scene svg{display:block;width:100%;height:auto}
.titleblock{text-align:center;padding:26px 10px 10px}
.kicker{font-family:var(--pixel);font-size:11px;color:var(--teal);margin:0 0 14px}
h1.main{font-family:var(--pixel);font-size:clamp(22px,5.2vw,44px);line-height:1.3;color:var(--text);text-shadow:4px 4px 0 #ff4f8b,8px 8px 0 #0a0c2a;letter-spacing:1px}
.level{font-family:var(--pixel);font-size:clamp(12px,2.6vw,20px);color:var(--gold);margin:22px 0 14px;line-height:1.5}
.tag{max-width:34ch;margin:0 auto 26px;font-size:20px}
.how{margin-top:30px}
.how ol{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.how li{display:flex;gap:12px;align-items:center}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-family:var(--pixel);font-size:12px}

/* buttons */
.btn{font-family:var(--pixel);font-size:13px;line-height:1.4;background:var(--gold);color:var(--ink);border:0;border-radius:12px;padding:16px 22px;cursor:pointer;box-shadow:0 6px 0 var(--gold-d);transition:transform .08s,box-shadow .08s}
.btn:hover:not([disabled]){filter:brightness(1.07)}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d)}
.btn[disabled]{background:#6b6f9f;color:#e2e4fa;box-shadow:0 6px 0 #424675;cursor:not-allowed}
.btn.big{font-size:clamp(14px,3vw,18px);padding:20px 30px}
.btn.secondary{background:var(--panel2);color:var(--text);border:3px solid var(--line);box-shadow:0 6px 0 #0a0c2a}
.btnrow{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;margin:8px 0 6px}
.btnrow.center{justify-content:center}
.gate{min-height:1.6em;margin:10px 0 0;text-align:right;color:var(--muted);font-size:16px}

/* guide */
.guide{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:end;margin:0 0 22px}
.owl svg{width:96px;height:96px;display:block}
.bubble{position:relative;background:#fff8dc;color:var(--ink);border:4px solid var(--gold);border-radius:18px;padding:14px 18px 16px;font-size:18px}
.bubble::before{content:"";position:absolute;left:-16px;bottom:26px;border:10px solid transparent;border-right:12px solid var(--gold);border-left:0}
.bubble .who{display:block;font-family:var(--pixel);font-size:10px;color:#7a5a00;margin-bottom:6px}
.bubble p{margin:0 0 10px}.bubble p:last-child{margin:0}
.mission{margin:16px 0 4px;padding:14px;text-align:center;background:var(--ink);color:var(--gold);border-radius:12px;font-family:var(--pixel);font-size:clamp(11px,2.4vw,15px);line-height:1.7}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0 18px}
.dots i{width:12px;height:12px;border-radius:50%;background:#3b4098}
.dots i.on{background:var(--gold)}

/* quest header */
.qtag{font-family:var(--pixel);font-size:11px;color:var(--teal);margin:6px 0 10px}
.qtitle{font-family:var(--pixel);font-size:clamp(15px,3.6vw,24px);line-height:1.5;color:var(--text);margin-bottom:18px}
.gain{display:inline-block;margin:0 0 14px;padding:10px 16px;background:var(--teal);color:var(--ink);font-family:var(--pixel);font-size:12px;border-radius:10px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
label.card{position:relative;display:block;cursor:pointer}
.card input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.card-inner{position:relative;display:flex;flex-direction:column;gap:6px;height:100%;background:var(--panel2);border:3px solid var(--line);border-radius:14px;padding:14px;transition:transform .12s,border-color .12s}
.card:hover .card-inner{transform:translateY(-3px);border-color:#8d97ff}
.card input:focus-visible + .card-inner{outline:4px solid var(--teal);outline-offset:3px}
.card input:checked + .card-inner{border-color:var(--gold);background:#3b3f9a;box-shadow:0 0 0 3px rgba(255,210,74,.35)}
.card input:checked + .card-inner::after{content:"✓";position:absolute;top:8px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-weight:800}
.card .art{height:100px;display:grid;place-items:center}
.card .art svg{max-height:100px}
.card .cname{font-family:var(--pixel);font-size:11px;line-height:1.6;color:var(--gold)}
.card .cdesc{font-size:16px;line-height:1.45}

/* creator */
.creator{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
.preview{background:radial-gradient(circle at 50% 70%,#3b3f9a,#1a1d4d);border:3px solid var(--line);border-radius:14px;padding:12px;display:grid;place-items:center}
.controls .row{margin-bottom:14px}
.controls .lab{display:block;font-size:16px;color:var(--muted);margin-bottom:6px}
.swrow{display:flex;flex-wrap:wrap;gap:10px}
.sw{position:relative}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span.dot{display:block;width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.35)}
.sw input:checked + span.dot{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
.sw input:focus-visible + span.dot{outline:3px solid var(--teal);outline-offset:3px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span.t{display:block;padding:8px 14px;border-radius:10px;border:3px solid var(--line);background:var(--panel2);font-size:16px}
.chip input:checked + span.t{border-color:var(--gold);background:#3b3f9a}
.chip input:focus-visible + span.t{outline:3px solid var(--teal);outline-offset:3px}

/* fields */
.field{margin:0 0 18px}
.field label{display:block;font-size:18px;font-weight:600;margin-bottom:8px}
.field .req{font-size:13px;font-weight:600;color:var(--ink);background:var(--pink);border-radius:6px;padding:1px 8px;margin-left:8px}
.field .opt{font-size:13px;font-weight:600;color:var(--ink);background:var(--muted);border-radius:6px;padding:1px 8px;margin-left:8px}
.field textarea,.field input[type=text]{width:100%;font:inherit;color:var(--text);background:#12153d;border:3px solid var(--line);border-radius:10px;padding:12px}
.field textarea{min-height:96px;resize:vertical}
.field textarea:focus,.field input:focus{outline:4px solid var(--teal);outline-offset:2px}

/* backpack */
.bagrow{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.slots{display:flex;gap:14px;flex-wrap:wrap}
.slot{width:150px;min-height:120px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center;font-size:15px}
.slot.empty{border:3px dashed #7b86ff;color:var(--muted)}
.slot.full{border:3px solid var(--gold);background:#3b3f9a;animation:pop .4s}
.limit{min-height:1.6em;color:var(--gold);margin:12px 0 0}
.encounter{display:flex;gap:18px;align-items:center;background:#3a1f5c;border:4px solid var(--pink);border-radius:14px;padding:16px;margin-bottom:20px}
.encounter .enc-t{font-family:var(--pixel);font-size:12px;color:var(--pink);margin:0 0 8px}
.encounter p{margin:0 0 6px}

/* done */
.badge{text-align:center;margin-bottom:18px}
.badge svg{width:90px;height:112px;animation:float 3s ease-in-out infinite}
.badge h2{font-family:var(--pixel);font-size:clamp(16px,4vw,26px);line-height:1.5;color:var(--gold);margin-top:8px}
.herocard{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:linear-gradient(135deg,#2a307a,#3a1f5c);border:5px solid var(--gold);border-radius:18px;padding:22px;margin-bottom:22px;box-shadow:0 8px 0 #0a0c2a}
.herocard .hname{font-family:var(--pixel);font-size:clamp(14px,3vw,20px);line-height:1.5;color:var(--gold);margin-bottom:4px}
.herocard .hrole{font-size:19px;margin-bottom:14px}
.herocard h3{font-family:var(--pixel);font-size:10px;color:var(--teal);margin:12px 0 8px;line-height:1.6}
.mini{display:flex;align-items:center;gap:10px;margin:6px 0}
.log h3{font-family:var(--pixel);font-size:12px;color:var(--gold);margin:18px 0 8px;line-height:1.6}
.log .q{font-weight:700;margin:12px 0 2px}
.log .a{margin:0;padding:10px 14px;background:#12153d;border-radius:10px;white-space:pre-wrap}
details{margin:14px 0}
summary{cursor:pointer;font-weight:700}
textarea.export{width:100%;min-height:200px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#12153d;color:var(--text);border:3px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.status{min-height:1.6em;color:var(--teal);margin:8px 0 0}
.next-teaser{text-align:center;color:var(--muted)}
footer{margin-top:26px;text-align:center;font-size:14px;color:var(--muted)}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:4px}

.bob svg,.bob{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.screen{animation:fade .35s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:50;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

@media (max-width:640px){
  body{font-size:17px}
  .creator{grid-template-columns:1fr}
  .herocard{grid-template-columns:1fr;text-align:center}
  .herocard .mini{justify-content:center}
  .guide{grid-template-columns:64px 1fr}
  .owl svg{width:64px;height:64px}
  .encounter{flex-direction:column;text-align:center}
  .gate{text-align:left}
  .btnrow .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media print{
  body{background:#fff;color:#000;font-size:12pt}
  .hud,.btnrow,.no-print,.scene,.guide,footer,.gate,.confetti{display:none!important}
  .panel,.herocard{background:#fff!important;border:2px solid #000!important;box-shadow:none!important;color:#000!important}
  .herocard *,.panel *,.badge h2{color:#000!important;text-shadow:none!important}
  .log .a{background:#fff!important;border:1px solid #999}
}
</style>
</head>

<div class="app" id="app"></div>

<script>
/* =====================================================================

   Keep the quotes " " and commas , exactly as they are.

const MIN_CHARS = 10;   // shortest answer allowed for required questions

const CONTENT = {
  introPages: [
    ["Every hero begins somewhere. Your journey starts here.",
     "In every great adventure, there comes a moment when the hero is invited to step into something new. The path ahead may be exciting, uncertain, or a little of both. The hero doesn’t need to know everything about the journey before taking the first step. Starting college can feel the same way."],
    ["Maybe you have a career goal you’re working toward. Maybe you’re creating new opportunities for yourself or your family. Maybe you’re returning to school after time away, starting over, or still figuring out what you want your future to look like.",

    ["In ISTU 101, you’ll build skills to help you find your way through college, notice your strengths, get past challenges, and connect your education to the life you want to build.",

  ],
  equipment: [

    {id:"experience",    name:"Life Experience", desc:"I’ve learned things outside the classroom that I can bring to college."},
    {id:"support",       name:"Support",         desc:"I have people who encourage me or want to see me succeed."},
    {id:"openmind",      name:"An Open Mind",    desc:"I’m willing to try new things and learn from my experiences."},
    {id:"customeq",      name:"Custom Equipment",desc:"I bring a quality, experience, or resource of my own."}
  ],
  challenges: [
    {id:"time",     text:"Managing my time and balancing responsibilities."},
    {id:"online",   text:"Learning to use online courses and digital tools."},
    {id:"expect",   text:"Understanding college assignments and what is expected of me."},
    {id:"help",     text:"Feeling comfortable asking questions or asking for help."},
    {id:"balance",  text:"Balancing college with work, family, or other commitments."},
    {id:"goals",    text:"Figuring out my goals and deciding what comes next."},
    {id:"other",    text:"Something else."}
  ],

  q1: {
    title: "Choose Your Starting Point",
    guide: ["Every hero has a story. Which character is closest to where you are <b>right now</b>?",
            "Tap one card to choose it. Or pick the Custom Character to describe your own."],
    note: "There is no right or wrong choice. Your character may even change as you grow.",
    prompts: [
      {key:"r1a", required:true,  label:"Why did you choose this character? What part of your story does it show?"},
      {key:"r1b", required:false, label:"Finish this sentence: By the end of this course, my hero hopes to…"}
    ]
  },
  q2: {
    title: "Choose Your Starting Equipment",
    guide: ["Every hero brings something useful on the journey. Your equipment is a strength, experience, or helper you can count on when things get hard.",
            "Your backpack holds <b>2 items</b>. Choose one or two."],
    note: "You don’t have to start with every tool you’ll need. Part of the journey is learning what else you can build, and where to find help.",
    prompts: [
      {key:"r2a", required:true,  label:"Pick one item from your backpack. Tell about a time in real life when you used it."},
      {key:"r2b", required:false, label:"What is one tool you would like to add to your backpack this semester? Where could you look for it?"}
    ]
  },
  q3: {

    guide: ["Every journey has obstacles. Spotting one early helps you get ready for it.",
            "Which challenge do you think could be the hardest for you as you start college? Choose one."],
    note: "Naming a challenge doesn’t mean you’re giving up. It’s the beginning of a plan.",
    prompts: [
      {key:"r3a", required:true,  label:"Why might this challenge be hard for you right now?"},
      {key:"r3b", required:true,  label:"Look at your backpack. Which item could help you face this challenge? Who or what else could help?"}
    ]
  },
  done: {
    guide: ["You did it! You made your college character. This hero card shows who is starting the journey.",
            "Take a look at it, then answer one last question."],
    finalPrompt: {key:"final", required:false, label:"Look at your hero card. What stands out to you? What is one thing you noticed about yourself while playing?"},

    teaser: "Level 2 unlocks next week."

/* =================== END OF INSTRUCTOR EDIT ZONE =================== */

const SKINS=['#fde0c8','#f1c27d','#d9a273','#b57a4f','#8a5a3a','#5e3a24'];
const HAIRS=['#2b1b14','#5a3825','#a8522b','#e3c16f','#c8c8d4','#d6457a'];
const OUTFITS=['#3b82f6','#10b981','#ef4444','#a855f7','#f59e0b','#14b8a6'];
const HAIR_NAMES=['Black','Brown','Auburn','Blonde','Silver','Pink'];
const OUTFIT_NAMES=['Blue','Green','Red','Purple','Orange','Teal'];
const HAIRSTYLES=[['short','Short'],['long','Long'],['curly','Curly'],['bun','Bun']];

const app=document.getElementById('app');
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- state ---------- */
function fresh(){return{screen:'title',introPage:0,done:{},gain:'',role:'',customRole:'',heroName:'',skin:SKINS[2],hair:HAIRS[0],hairStyle:'short',outfit:OUTFITS[0],r1a:'',r1b:'',equip:[],customEq:'',r2a:'',r2b:'',challenge:'',customChallenge:'',r3a:'',r3b:'',final:''}}
function load(){try{const s=sessionStorage.getItem('hj_level1');return s?Object.assign(fresh(),JSON.parse(s)):null}catch(e){return null}}
function save(){try{sessionStorage.setItem('hj_level1',JSON.stringify(state))}catch(e){}}
let state=load()||fresh();

/* ---------- graphics ---------- */
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const t=p<0?0:255,k=Math.abs(p);r=Math.round((t-r)*k+r);g=Math.round((t-g)*k+g);b=Math.round((t-b)*k+b);return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}
function starPts(cx,cy,R,r){let p=[];for(let i=0;i<10;i++){const a=(-90+i*36)*Math.PI/180,d=i%2?r:R;p.push((cx+d*Math.cos(a)).toFixed(1)+','+(cy+d*Math.sin(a)).toFixed(1))}return p.join(' ')}
function sparkle(x,y,r){return`M${x} ${y-r}Q${x} ${y} ${x+r} ${y}Q${x} ${y} ${x} ${y+r}Q${x} ${y} ${x-r} ${y}Q${x} ${y} ${x} ${y-r}Z`}

function heroInner(o){
  const sk=o.skin,hr=o.hair,ou=o.outfit,hs=o.hairStyle,role=o.role;
  const dk=shade(ou,-.35),skD=shade(sk,-.12);
  let b=`<ellipse cx="60" cy="146" rx="30" ry="4" fill="#000" opacity=".25"/>`;

  const hero=heroInner(look(state.role||'dream'));

/* ---------- helpers ---------- */
const roleObj=()=>CONTENT.roles.find(r=>r.id===state.role);
const roleName=()=>state.role==='custom'?(state.customRole.trim()||'Custom Character'):(roleObj()?roleObj().name:'');
const equipName=id=>id==='customeq'?(state.customEq.trim()||'Custom Equipment'):CONTENT.equipment.find(e=>e.id===id).name;
const challengeText=()=>state.challenge==='other'?(state.customChallenge.trim()||'Something else'):(CONTENT.challenges.find(c=>c.id===state.challenge)||{text:''}).text;
const heroLabel=()=>state.heroName.trim()||'Your Hero';
const xp=()=>Object.values(state.done).filter(Boolean).length*100;

function guide(paras){return`<div class="guide"><div class="owl" aria-hidden="true">${owlSVG()}</div><div class="bubble"><span class="who">PROFESSOR HOOT, YOUR GUIDE</span>${paras.map(p=>`<p>${p}</p>`).join('')}</div></div>`}
function hud(){const stars=[1,2,3].map(i=>starIcon(state.done['q'+i])).join('');
  return`<header class="hud"><div><span class="lvl">LEVEL 1</span><span class="hud-name">Accept the Call</span></div><div class="hud-m" role="img" aria-label="${Object.values(state.done).filter(Boolean).length} of 3 quests complete">${stars}</div><div class="hud-r"><div class="xpbar" role="progressbar" aria-label="Experience points" aria-valuemin="0" aria-valuemax="300" aria-valuenow="${xp()}"><span style="width:${xp()/3}%"></span></div><span class="xplabel">XP ${xp()}/300</span></div></header>`}
function prompts(list){return list.map(p=>`<div class="field"><label for="f_${p.key}">${p.label}<span class="${p.required?'req':'opt'}">${p.required?'Required':'Optional'}</span></label><textarea id="f_${p.key}" data-bind="${p.key}" rows="3">${esc(state[p.key])}</textarea></div>`).join('')}
function line(key,label,ph){return`<div class="field"><label for="f_${key}">${label}</label><input type="text" id="f_${key}" data-bind="${key}" maxlength="80" placeholder="${ph||''}" value="${esc(state[key])}"></div>`}
function swatches(name,list,names,cur){return`<div class="swrow" role="radiogroup" aria-label="${name}">${list.map((c,i)=>`<label class="sw"><input type="radio" name="${name}" value="${c}" ${cur===c?'checked':''}><span class="dot" style="background:${c}"></span><span class="sr">${names?names[i]:'Skin tone '+(i+1)}</span></label>`).join('')}</div>`}

/* ---------- screens ---------- */
function screenTitle(){return`<section class="screen" aria-labelledby="h">
  <div class="scene">${sceneSVG()}</div>

  <p class="small" style="margin:0">No timer. No score to beat. No wrong answers. This takes about 10 to 15 minutes.</p></div></section>`}

function screenIntro(){const i=state.introPage,pages=CONTENT.introPages,last=i===pages.length-1;

function shell(n,c,body,nextLabel){
  const gain=state.gain?`<p class="gain" role="status">${state.gain}</p>`:'';
  return`<section class="screen" aria-labelledby="h">${gain}<p class="qtag">QUEST ${n} OF 3</p><h2 class="qtitle" id="h" tabindex="-1">${c.title}</h2>${guide(c.guide)}${body}
  <div class="btnrow"><button class="btn secondary" data-act="back">◀ BACK</button><button class="btn" id="nextBtn" data-act="next" disabled>${n===3?'FINISH LEVEL ★':'NEXT QUEST ▶'}</button></div><p class="gate" id="gate" role="status" aria-live="polite"></p></section>`}

function screenQ1(){const c=CONTENT.q1;
  const cards=CONTENT.roles.map(r=>`<label class="card"><input type="radio" name="role" value="${r.id}" ${state.role===r.id?'checked':''}><span class="card-inner"><span class="art" data-role="${r.id}">${heroSVG(look(r.id),80)}</span><span class="cname">${r.name}</span><span class="cdesc">${r.desc}</span></span></label>`).join('');
  const body=`<div class="panel"><h3 class="sub">Pick your character</h3><div class="grid" role="radiogroup" aria-label="Choose your character">${cards}</div><p class="note">${c.note}</p></div>
  <div id="more" ${state.role?'':'hidden'}>
    <div class="panel"><h3 class="sub">Make it look like you</h3>
      <div id="customWrap" ${state.role==='custom'?'':'hidden'}>${line('customRole','Describe your starting point in your own words:','For example: The Comeback Kid')}</div>
      <div class="creator"><div class="preview" id="preview">${state.role?heroSVG(look(state.role),160,true):''}</div>
      <div class="controls">${line('heroName','Name your hero. You can use your own name or make one up.','Hero name')}

        <div class="row"><span class="lab">Hair style</span><div class="swrow" role="radiogroup" aria-label="Hair style">${HAIRSTYLES.map(h=>`<label class="chip"><input type="radio" name="hairStyle" value="${h[0]}" ${state.hairStyle===h[0]?'checked':''}><span class="t">${h[1]}</span></label>`).join('')}</div></div>

        <div class="row"><span class="lab">Outfit color</span>${swatches('outfit',OUTFITS,OUTFIT_NAMES,state.outfit)}</div>
      </div></div></div>
    <div class="panel"><h3 class="sub">Tell us about your hero</h3>${prompts(c.prompts)}</div>
  </div>`;
  return shell(1,c,body)}

function slotsHTML(){return[0,1].map(i=>{const id=state.equip[i];return id?`<div class="slot full">${icon(EQUIP_ICONS,id,56)}<span>${esc(equipName(id))}</span></div>`:`<div class="slot empty"><span>Empty slot</span></div>`}).join('')}
function screenQ2(){const c=CONTENT.q2;
  const cards=CONTENT.equipment.map(e=>`<label class="card"><input type="checkbox" name="equip" value="${e.id}" ${state.equip.includes(e.id)?'checked':''}><span class="card-inner"><span class="art">${icon(EQUIP_ICONS,e.id,80)}</span><span class="cname">${e.name}</span><span class="cdesc">${e.desc}</span></span></label>`).join('');
  const body=`<div class="panel"><div class="bagrow"><div class="bob" id="bagHero">${heroSVG(look(state.role||'dream'),90)}</div><div><h3 class="sub">Your backpack <span class="small" style="font-family:var(--body)">(holds 2 items)</span></h3><div class="slots" id="slots">${slotsHTML()}</div></div></div></div>
  <div class="panel"><h3 class="sub">Choose 1 or 2 items</h3><div class="grid" role="group" aria-label="Choose your equipment">${cards}</div><p class="limit" id="limit" role="status" aria-live="polite"></p><p class="note">${c.note}</p></div>
  <div id="more" ${state.equip.length?'':'hidden'}><div class="panel"><div id="customWrap" ${state.equip.includes('customeq')?'':'hidden'}>${line('customEq','Name your custom equipment:','For example: My two jobs taught me to stay calm')}</div><h3 class="sub">Tell us about your equipment</h3>${prompts(c.prompts)}</div></div>`;
  return shell(2,c,body)}

function encounterHTML(){return state.challenge?`<div class="encounter"><div>${icon(CHALLENGE_ICONS,state.challenge,80)}</div><div><p class="enc-t">CHALLENGE SPOTTED!</p><p><b id="encText">${esc(challengeText())}</b></p><p class="small" style="color:#f0e4ff">Good scouting. Knowing what is ahead is how heroes get ready.</p></div></div>`:''}
function screenQ3(){const c=CONTENT.q3;
  const cards=CONTENT.challenges.map(ch=>`<label class="card"><input type="radio" name="challenge" value="${ch.id}" ${state.challenge===ch.id?'checked':''}><span class="card-inner"><span class="art">${icon(CHALLENGE_ICONS,ch.id,80)}</span><span class="cdesc">${ch.text}</span></span></label>`).join('');
  const body=`<div class="panel"><h3 class="sub">Pick one challenge</h3><div class="grid" role="radiogroup" aria-label="Choose your first challenge">${cards}</div><p class="note">${c.note}</p></div>
  <div id="more" ${state.challenge?'':'hidden'}><div id="enc">${encounterHTML()}</div><div class="panel"><div id="customWrap" ${state.challenge==='other'?'':'hidden'}>${line('customChallenge','Describe your challenge in your own words:','')}</div><h3 class="sub">Make a plan</h3>${prompts(c.prompts)}</div></div>`;
  return shell(3,c,body)}

function answersLog(){
  const sec=(t,rows)=>`<h3>${t}</h3>`+rows.map(r=>`<p class="q">${r[0]}</p><p class="a">${esc(r[1]||'(no answer)')}</p>`).join('');
  const P=(list)=>list.map(p=>[p.label,state[p.key]]);
  return sec('QUEST 1: STARTING POINT',[['Character',roleName()],['Hero name',state.heroName]].concat(P(CONTENT.q1.prompts)))
    +sec('QUEST 2: STARTING EQUIPMENT',[['Equipment',state.equip.map(equipName).join(', ')]].concat(P(CONTENT.q2.prompts)))
    +sec('QUEST 3: FIRST CHALLENGE',[['Challenge',challengeText()]].concat(P(CONTENT.q3.prompts)))}
function buildText(){
  const L=["HERO’S JOURNEY – LEVEL 1: ACCEPT THE CALL",""];
  const add=(t,rows)=>{L.push(t);rows.forEach(r=>{L.push("");L.push(r[0]);L.push(r[1]&&r[1].trim()?r[1].trim():"(no answer)")});L.push("")};
  const P=l=>l.map(p=>[p.label,state[p.key]]);
  add("QUEST 1: STARTING POINT",[["Hero name",state.heroName],["Character",roleName()]].concat(P(CONTENT.q1.prompts)));
  add("QUEST 2: STARTING EQUIPMENT",[["Equipment",state.equip.map(equipName).join(", ")]].concat(P(CONTENT.q2.prompts)));
  add("QUEST 3: FIRST CHALLENGE",[["Challenge",challengeText()]].concat(P(CONTENT.q3.prompts)));
  add("FINAL REFLECTION",[[CONTENT.done.finalPrompt.label,state.final]]);
  return L.join("\n")}

function screenDone(){const d=CONTENT.done;
  return`<section class="screen" aria-labelledby="h">
  <div class="badge"><div>${medalSVG()}</div><h2 id="h" tabindex="-1">LEVEL 1 COMPLETE!</h2><p class="small" style="margin:6px 0 0">+300 XP</p></div>
  <div class="no-print">${guide(d.guide)}</div>
  <div class="herocard"><div class="bob">${heroSVG(look(state.role||'dream'),170)}</div><div>
    <p class="hname">${esc(heroLabel())}</p><p class="hrole">${esc(roleName())}</p>
    <h3>STARTING EQUIPMENT</h3>${state.equip.map(id=>`<div class="mini">${icon(EQUIP_ICONS,id,40)}<span>${esc(equipName(id))}</span></div>`).join('')}
    <h3>FIRST CHALLENGE</h3><div class="mini">${icon(CHALLENGE_ICONS,state.challenge||'other',40)}<span>${esc(challengeText())}</span></div></div></div>
  <div class="panel log"><h2 class="sub">Your quest log</h2>${answersLog()}
    <div class="field" style="margin-top:22px"><label for="f_final">${d.finalPrompt.label}<span class="${d.finalPrompt.required?'req':'opt'}">${d.finalPrompt.required?'Required':'Optional'}</span></label><textarea id="f_final" data-bind="final" rows="3">${esc(state.final)}</textarea></div></div>
  <div class="panel no-print"><h2 class="sub">Save your answers</h2><p style="margin-top:0">${d.submit}</p>
    <div class="btnrow center"><button class="btn" data-act="copy">COPY MY ANSWERS</button><button class="btn secondary" data-act="download">DOWNLOAD FILE</button><button class="btn secondary" data-act="print">PRINT / SAVE PDF</button></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <details><summary>See my answers as plain text</summary><textarea class="export" id="exportBox" readonly aria-label="Your answers as plain text"></textarea></details></div>
  <p class="next-teaser no-print">${d.teaser}</p>
  <div class="btnrow no-print"><button class="btn secondary" data-act="back">◀ BACK TO QUEST 3</button></div></section>`}

/* ---------- gating ---------- */
function missing(){
  const s=state.screen,m=[];
  if(s==='q1'){if(!state.role)m.push('choose a character card');else if(state.role==='custom'&&!state.customRole.trim())m.push('describe your custom character')}
  if(s==='q2'){if(!state.equip.length)m.push('choose at least one item');else if(state.equip.includes('customeq')&&!state.customEq.trim())m.push('name your custom equipment')}
  if(s==='q3'){if(!state.challenge)m.push('choose a challenge');else if(state.challenge==='other'&&!state.customChallenge.trim())m.push('describe your challenge')}
  if(!m.length&&CONTENT[s]&&CONTENT[s].prompts){
    const short=CONTENT[s].prompts.filter(p=>p.required&&state[p.key].trim().length<MIN_CHARS);
    if(short.length)m.push('answer the questions marked Required (a sentence or two is fine)');
  }
  return m}
function refreshGate(){
  const btn=$('#nextBtn');if(!btn)return;const m=missing();
  btn.disabled=m.length>0;
  $('#gate').textContent=m.length?'To keep going: '+m.join(', ')+'.':'Ready when you are!';
}

/* ---------- render + events ---------- */
const FLOW=['q1','q2','q3','done'];
const SCREENS={title:screenTitle,intro:screenIntro,q1:screenQ1,q2:screenQ2,q3:screenQ3,done:screenDone};
function render(){
  const s=state.screen;
  app.innerHTML=(s==='title'?'':hud())+SCREENS[s]()+`<footer>Hero’s Journey · Level 1 · ISTU 101<br><button data-act="reset">Restart Level 1</button></footer>`;
  state.gain='';save();
  bind();refreshGate();
  const h=$('#h');if(h)h.focus({preventScroll:true});
  window.scrollTo(0,0);
  if(s==='done'){const b=$('#exportBox');if(b)b.value=buildText();if(!reduceMotion)confetti()}
}
function go(screen){state.screen=screen;save();render()}

function updateAvatars(){
  app.querySelectorAll('.art[data-role]').forEach(el=>el.innerHTML=heroSVG(look(el.dataset.role),80));
  const p=$('#preview');if(p&&state.role)p.innerHTML=heroSVG(look(state.role),160,true);
}
function toggle(id,show){const e=$('#'+id);if(e)e.hidden=!show}

function bind(){
  app.querySelectorAll('[data-bind]').forEach(el=>el.addEventListener('input',()=>{
    state[el.dataset.bind]=el.value;save();
    if(el.dataset.bind==='customEq'){$('#slots').innerHTML=slotsHTML()}
    if(el.dataset.bind==='customChallenge'){const t=$('#encText');if(t)t.textContent=challengeText()}
    if(state.screen==='done')$('#exportBox').value=buildText();
    refreshGate();
  }));
  app.querySelectorAll('input[name=role]').forEach(el=>el.addEventListener('change',()=>{
    state.role=el.value;save();toggle('more',true);toggle('customWrap',state.role==='custom');updateAvatars();refreshGate()}));
  ['skin','hair','outfit','hairStyle'].forEach(n=>app.querySelectorAll(`input[name=${n}]`).forEach(el=>el.addEventListener('change',()=>{state[n]=el.value;save();updateAvatars()})));
  app.querySelectorAll('input[name=equip]').forEach(el=>el.addEventListener('change',()=>{
    const id=el.value,lim=$('#limit');
    if(el.checked){
      if(state.equip.length>=2){el.checked=false;lim.textContent='Your backpack holds 2 items. Tap one you already picked to put it back, then choose again.';return}
      state.equip.push(id);
    }else state.equip=state.equip.filter(x=>x!==id);
    lim.textContent='';save();
    $('#slots').innerHTML=slotsHTML();toggle('more',state.equip.length>0);toggle('customWrap',state.equip.includes('customeq'));refreshGate()}));
  app.querySelectorAll('input[name=challenge]').forEach(el=>el.addEventListener('change',()=>{
    state.challenge=el.value;save();$('#enc').innerHTML=encounterHTML();toggle('more',true);toggle('customWrap',state.challenge==='other');refreshGate()}));
}

let resetTimer=null;
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='start'){state.introPage=0;go('intro')}
  else if(a==='introNext'){if(state.introPage<CONTENT.introPages.length-1){state.introPage++;save();render()}else go('q1')}
  else if(a==='introBack'){if(state.introPage>0){state.introPage--;save();render()}else go('title')}
  else if(a==='next'){const s=state.screen;if(missing().length)return;state.done[s]=true;state.gain='★ Quest complete! +100 XP';go(FLOW[FLOW.indexOf(s)+1])}
  else if(a==='back'){const i=FLOW.indexOf(state.screen);if(i<=0){state.introPage=CONTENT.introPages.length-1;go('intro')}else go(FLOW[i-1])}
  else if(a==='copy')copyText();
  else if(a==='download')downloadText();
  else if(a==='print')window.print();
  else if(a==='reset'){
    if(t.dataset.armed){state=fresh();save();render()}
    else{t.dataset.armed='1';t.textContent='Click again to erase everything and restart';clearTimeout(resetTimer);resetTimer=setTimeout(()=>{t.removeAttribute('data-armed');t.textContent='Restart Level 1'},4000)}
  }
});

function status(msg){const s=$('#status');if(s)s.textContent=msg}
function copyText(){
  const txt=buildText(),box=$('#exportBox');
  const fallback=()=>{const d=box.closest('details');if(d)d.open=true;box.focus();box.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
    status(ok?'Copied! Now paste it into Canvas.':'Your answers are selected below. Press Ctrl+C (or Cmd+C on a Mac) to copy them.')};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>status('Copied! Now paste it into Canvas.'),fallback)}else fallback()}
function downloadText(){
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buildText()],{type:'text/plain'}));
    a.download='heros-journey-level-1.txt';document.body.appendChild(a);a.click();a.remove();status('Your file is downloading.')}
  catch(e){status('Download did not work here. Use Copy My Answers instead.')}}
function confetti(){const cols=['#ffd24a','#4de1c1','#ff7aa8','#8d97ff','#fff'];
  for(let i=0;i<70;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2.5+Math.random()*2.5)+'s';c.style.animationDelay=(Math.random()*1.2)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),7000)}}

render();
</script>
</body>
</html>
