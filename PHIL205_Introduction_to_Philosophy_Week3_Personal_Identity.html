<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHIL 205 Introduction to Philosophy: Week 3 Interactive: Are You Still You?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Newsreader:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2430;--muted:#566070;--paper:#F5F6F8;--card:#fff;--line:#D5DAE2;--cardinal:#A5313A;--cardinal-d:#852630;
--hue:#2F4C7A;--hue-t:#E6ECF5;--ok:#2A7653;--ok-t:#E1F2E9;--bad:#A8432E;--bad-t:#FBE9E4;
--serif:'Newsreader',Georgia,'Times New Roman',serif;--sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);overscroll-behavior:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;width:900px;height:560px;overflow:hidden}
.hdr{flex:0 0 54px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
.hdr svg.mark{flex:0 0 26px}
.hdr h1{margin:0;font:600 19px/1.1 var(--serif);letter-spacing:.1px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .wk{font-size:13px;font-weight:600;color:var(--hue);background:var(--hue-t);padding:3px 10px;border-radius:99px;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:0 0 auto;padding:8px 20px 0;background:#fff;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;font:600 14px var(--sans);color:var(--muted);padding:8px 14px 9px;border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--cardinal)}
.view{flex:1;min-height:0;display:none;padding:14px 20px 16px;gap:18px}
.view.on{display:flex}
.col-g{flex:0 0 42%;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0}
.col-p{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;min-height:0}
.gfx{flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gfx svg{width:100%;height:100%;display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-height:0;overflow:hidden}
.card.grow{flex:1}
h2{font:600 24px/1.15 var(--serif);margin:0 0 8px}
h3{font:700 14px/1.2 var(--sans);margin:12px 0 3px;color:var(--hue)}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.say{font:italic 400 17px/1.4 var(--serif);color:var(--ink);border-left:3px solid var(--hue);padding:2px 0 2px 12px;margin:8px 0 10px}
.btn{appearance:none;border:1.5px solid var(--cardinal);background:var(--cardinal);color:#fff;font:600 14px var(--sans);padding:8px 16px;border-radius:10px;cursor:pointer}
.btn:hover{background:var(--cardinal-d);border-color:var(--cardinal-d)}
.btn.ghost{background:#fff;color:var(--cardinal)}
.btn.ghost:hover{background:#faf0f1}
.btn[disabled]{opacity:.4;cursor:default}
.pill{appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:600 13.5px var(--sans);padding:7px 13px;border-radius:99px;cursor:pointer;text-align:left}
.pill:hover{border-color:var(--hue)}
.pill[aria-pressed=true],.pill.sel{background:var(--hue);border-color:var(--hue);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.dots i{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line);display:inline-block}
.dots i.on{background:var(--hue);border-color:var(--hue)}
.fb{border-radius:10px;padding:9px 12px;font-size:14px;margin-top:8px}
.fb.ok{background:var(--ok-t);color:#16452F}
.fb.no{background:var(--bad-t);color:#6E2412}
.fb.info{background:var(--hue-t);color:var(--ink)}
:focus-visible{outline:3px solid #1A5FD0;outline-offset:2px;border-radius:6px}
g[role=button]:focus,g[role=button]:focus-visible{outline:none}
g[role=button]:focus-visible .ring{stroke:#1A5FD0;stroke-width:4}
g[role=button]{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* narrow (phone) layout: single column, still no scrolling */
#stage.narrow .view{flex-direction:column;gap:10px;padding:10px 14px 12px}
#stage.narrow .col-g{flex:0 0 40%}
#stage.narrow .col-p{flex:1}
#stage.narrow .hdr{padding:0 14px}
#stage.narrow .tabs{padding:6px 10px 0}
#stage.narrow .card{padding:12px 14px}
#stage.narrow h2{font-size:21px}

:root{--hue:#1B6F6C;--hue-t:#DDF0EE}
.steps{display:flex;gap:6px;padding:10px 20px 0;background:#fff;border-bottom:1px solid var(--line)}
.step{flex:0 0 auto;font:600 14px var(--sans);color:var(--muted);padding:8px 14px 9px;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.step b{width:20px;height:20px;border-radius:50%;background:var(--line);color:#fff;font-size:12px;display:grid;place-items:center}
.step.on{color:var(--ink);border-bottom-color:var(--cardinal)}.step.on b{background:var(--cardinal)}
.step.done b{background:var(--hue)}
.scn{font:italic 400 17px/1.45 var(--serif);margin:0 0 10px}
.ans{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.ans .pill{border-radius:10px;padding:9px 13px;white-space:normal}
.ans .pill.sel{background:var(--hue);border-color:var(--hue);color:#fff}
.th{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.th div{border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13.5px;background:#fff;display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:start}
.th div b{color:var(--hue)}
.th div.mine{border-color:var(--hue);background:var(--hue-t)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
input[type=range]{width:100%;accent-color:var(--cardinal);height:28px;margin:0}
.rl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.bar{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bar i{display:block;height:14px;border-radius:7px;background:var(--hue);transition:width .5s}
.bar .tr{background:#E6EAF0;border-radius:7px}
.cell{transition:fill .2s}.gfx{background:#F4FAF9}
</style></head>
<body>
<div id="stage">
 <div class="hdr">
  <svg class="mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 3h20v13a7 7 0 0 1-7 7H3z" fill="#A5313A"/><path d="M13 3v20M3 11h20" stroke="#fff" stroke-width="2"/></svg>
  <h1>What Is a Human Being? Are you still you?</h1><span class="wk">Week 3</span>
 </div>
 <div class="steps" id="steps"></div>
 <section class="view on" id="main">
  <div class="col-g"><div class="gfx" id="gfx"></div><div id="sl" style="display:none"></div></div>
  <div class="col-p"><div class="card grow" id="panel" aria-live="polite"></div></div>
 </section>
</div>
<script>
(function(){var st=document.getElementById('stage');
function fit(){var w=window.innerWidth,h=window.innerHeight,n=w<620,mw=n?460:900,mh=n?800:560;
var s=Math.min(w/mw,h/mh,1.25);st.classList.toggle('narrow',n);
st.style.width=(w/s)+'px';st.style.height=(h/s)+'px';st.style.transform='scale('+s+')';}
window.addEventListener('resize',fit);fit();
window.$=function(s,r){return (r||document).querySelector(s)};
window.$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
window.tabsInit=function(){var t=$$('.tab');t.forEach(function(b){b.addEventListener('click',function(){
t.forEach(function(x){x.setAttribute('aria-selected',x===b)});
$$('.view').forEach(function(v){v.classList.toggle('on',v.id===b.dataset.v)});});});};
window.keyBtn=function(el,fn){el.addEventListener('click',fn);el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e)}});};
})();

var INK='#1E2430',TEAL='#1B6F6C',RED='#A5313A';
function person(x,y,sc,fill,stroke,extra){return '<g transform="translate('+x+' '+y+') scale('+sc+')" '+(extra||'')+'><circle cx="0" cy="-42" r="16" fill="'+fill+'" stroke="'+stroke+'" stroke-width="3"/><path d="M-26 40v-46a26 26 0 0 1 52 0v46z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="3" stroke-linejoin="round"/></g>'}
function brainBubble(x,y,col,label){return '<g transform="translate('+x+' '+y+')"><ellipse rx="34" ry="24" fill="#fff" stroke="'+col+'" stroke-width="2.5"/><path d="M-14 -4c6-10 14-10 18 0M-2 8c8-8 14-6 16 2M-18 6c2-6 6-8 10-6" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linecap="round"/><text y="-32" text-anchor="middle" font-family="Figtree,sans-serif" font-size="11.5" font-weight="700" fill="'+col+'">'+label+'</text></g>'}
var S=[
{n:'Body swap',
 scn:'A scientist moves all of your memories, personality, and intentions into another person’s body. Your original body wakes up with none of them. Which one is you?',
 opts:[['old','The original body is me'],['new','The body that has my memories is me']],
 v:{body:{a:'old',t:'The original body. You are the same person as long as the same body and brain continue.',d:'Your memories now live in someone else. Few people find “that isn’t me” convincing.'},
    psy:{a:'new',t:'The new body. Memory, character, and intentions make you who you are.',d:'If the transfer could be run twice, two people would each be “you,” which cannot be right.'},
    soul:{a:null,t:'Wherever your soul went. That could be either body.',d:'Nobody can observe a soul, so the theory cannot say which body that is.'}},
 gfx:function(){return '<svg viewBox="0 0 400 300" role="img" aria-label="Memories travel from one body to another"><rect width="400" height="300" fill="#F4FAF9"/>'+person(90,170,1.5,'#CFE6E3',TEAL)+person(310,170,1.5,'#E9ECF1','#6B7585')+'<path d="M140 60h120" stroke="'+RED+'" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/><path d="M252 50l14 10-14 10" fill="none" stroke="'+RED+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'+brainBubble(90,62,TEAL,'memories')+brainBubble(310,62,'#6B7585','blank')+'<text x="90" y="280" text-anchor="middle" font-family="Figtree,sans-serif" font-size="13" font-weight="700" fill="'+INK+'">Original body</text><text x="310" y="280" text-anchor="middle" font-family="Figtree,sans-serif" font-size="13" font-weight="700" fill="'+INK+'">Other body</text></svg>'}},
{n:'Total amnesia',
 scn:'After an accident, a woman wakes with no memories at all and a markedly different character. Her body and brain are the same. Is she the same person as before?',
 opts:[['yes','Yes, she is the same person'],['no','No, the person she was is gone']],
 v:{body:{a:'yes',t:'Yes. The same body and brain continue.',d:'It struggles to explain why we treat a person whose character is erased as deeply changed.'},
    psy:{a:'no',t:'No, or barely. Memory and character are what connect a person over time.',d:'If total amnesia ends the person, loved ones may feel they are mourning someone who is still standing in front of them.'},
    soul:{a:'yes',t:'Yes. The soul underlies every change in memory and character.',d:'It cannot say what the soul contributes if it leaves no trace in who the person is.'}},
 gfx:function(){return '<svg viewBox="0 0 400 300" role="img" aria-label="A person before and after memory loss"><rect width="400" height="300" fill="#F4FAF9"/>'+person(105,175,1.5,'#CFE6E3',TEAL)+person(295,175,1.5,'#CFE6E3','#6B7585')+'<g fill="'+TEAL+'"><circle cx="70" cy="54" r="5"/><circle cx="96" cy="40" r="7"/><circle cx="125" cy="52" r="5"/><circle cx="145" cy="38" r="4"/></g><g fill="#B5BDC9"><circle cx="270" cy="54" r="5" opacity=".7"/><circle cx="296" cy="40" r="7" opacity=".45"/><circle cx="325" cy="52" r="5" opacity=".3"/></g><path d="M165 150h70" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/><path d="M226 140l12 10-12 10" fill="none" stroke="'+INK+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="285" text-anchor="middle" font-family="Figtree,sans-serif" font-size="13" font-weight="700" fill="'+INK+'">Before</text><text x="295" y="285" text-anchor="middle" font-family="Figtree,sans-serif" font-size="13" font-weight="700" fill="'+INK+'">After</text></svg>'}},
{n:'Teleporter',
 scn:'A teleporter scans every detail of you, destroys your body, and rebuilds an exact copy on Mars from new atoms. The copy has all your memories. Did you travel?',
 opts:[['yes','Yes, I traveled to Mars'],['no','No, I was destroyed and a copy exists']],
 v:{body:{a:'no',t:'No. The physical continuity is broken, so the person on Mars is a copy.',d:'Our atoms already turn over across a lifetime, so it is unclear why this break differs from ordinary change.'},
    psy:{a:'yes',t:'Yes. The person on Mars has the same memories and character, so psychological continuity holds.',d:'If the machine made two copies, both would qualify, and you cannot be two people.'},
    soul:{a:null,t:'It depends on whether the soul follows the pattern, and nothing in the process tells us.',d:'The theory gives no way to test its own answer.'}},
 gfx:function(){var s='';for(var i=0;i<18;i++){s+='<circle cx="'+(188+(i%6)*9)+'" cy="'+(100+Math.floor(i/6)*20)+'" r="2.6" fill="'+RED+'" opacity="'+(.9-i*.03)+'"/>'}
  return '<svg viewBox="0 0 400 300" role="img" aria-label="A person is scanned on Earth and rebuilt on Mars"><rect width="400" height="300" fill="#F4FAF9"/><circle cx="60" cy="210" r="90" fill="#CFE6E3"/><circle cx="352" cy="215" r="58" fill="#E9C9BC"/><circle cx="340" cy="195" r="9" fill="#D5A998"/><circle cx="366" cy="226" r="6" fill="#D5A998"/>'+person(80,150,1.1,'#fff',TEAL)+person(330,150,1.1,'#fff','#8A4B3A','opacity=".55" stroke-dasharray="5 4"')+'<g transform="translate(172 80)"><rect x="-10" y="-20" width="76" height="116" rx="12" fill="#fff" stroke="'+INK+'" stroke-width="2.5"/>'+s.replace(/cx="(\d+)"/g,function(m,a){return 'cx="'+(a-172)+'"'}).replace(/cy="(\d+)"/g,function(m,a){return 'cy="'+(a-80)+'"'})+'</g><text x="80" y="285" text-anchor="middle" font-family="Figtree,sans-serif" font-size="13" font-weight="700" fill="'+INK+'">Earth</text><text x="330" y="285" text-anchor="middle" font-family="Figtree,sans-serif" font-size="13" font-weight="700" fill="'+INK+'">Mars</text></svg>'}}
];
var TH={body:'Body or brain',psy:'Psychological',soul:'The soul'};
var step=0,pick=[],shown=[],slid=50,SLIDE=3; // steps 0-2 scenarios, 3 slider, 4 profile
function stepsBar(){var names=['Body swap','Total amnesia','Teleporter','Gradual change','Your pattern'];
 $('#steps').innerHTML=names.map(function(n,i){return '<div class="step '+(i===step?'on':(i<step?'done':''))+'"><b>'+(i<step?'✓':i+1)+'</b>'+n+'</div>'}).join('')}
function sliderGfx(p){ // body made of cells; p = % replaced
 var cells='',n=0,rows=10,cols=7;
 for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){var x=120+c*22,y=60+r*20;
  // body outline test: head circle and torso shape
  var inHead=Math.hypot(x-197,y-82)<0, torso=true;
  var idx=(r*cols+c);var order=(idx*37)%70; var rep=order<(p*.7);
  cells+='<rect class="cell" x="'+x+'" y="'+y+'" width="18" height="16" rx="4" fill="'+(rep?RED:TEAL)+'" opacity="'+(rep?.9:.75)+'"/>'}
 return '<svg viewBox="30 10 350 275" role="img" aria-label="A body made of cells, '+p+' percent replaced with artificial ones"><rect width="400" height="300" fill="#F4FAF9"/><circle cx="197" cy="38" r="22" fill="'+(p>85?'#F3D4D7':'#CFE6E3')+'" stroke="'+(p>85?RED:TEAL)+'" stroke-width="3"/>'+cells+'<g font-family="Figtree,sans-serif" font-size="12" font-weight="700"><rect x="296" y="90" width="12" height="12" rx="3" fill="'+TEAL+'"/><text x="314" y="100" fill="'+INK+'">Original</text><rect x="296" y="112" width="12" height="12" rx="3" fill="'+RED+'"/><text x="314" y="122" fill="'+INK+'">Artificial</text></g><text x="60" y="160" font-family="Newsreader,serif" font-size="38" font-weight="600" fill="'+INK+'" text-anchor="middle">'+p+'%</text></svg>'}
function render(){stepsBar();var g=$('#gfx'),P=$('#panel'),sl=$('#sl');sl.style.display='none';
 if(step<3){var s=S[step];g.innerHTML=s.gfx();var a=pick[step],sh=shown[step];
  var h='<h2>'+s.n+'</h2><p class="scn">'+s.scn+'</p>';
  if(!sh){h+='<div class="ans">'+s.opts.map(function(o){return '<button class="pill'+(a===o[0]?' sel':'')+'" data-a="'+o[0]+'">'+o[1]+'</button>'}).join('')+'</div><div class="nav"><span class="muted">Choose first, then compare.</span><button class="btn" id="go" '+(a?'':'disabled')+'>Compare theories</button></div>';}
  else{h+='<div class="th">'+Object.keys(TH).map(function(k){var v=s.v[k];var mine=v.a&&v.a===a;return '<div class="'+(mine?'mine':'')+'"><b>'+TH[k]+'</b><span>'+v.t+' <span class="muted">'+v.d+'</span></span></div>'}).join('')+'</div><div class="nav"><span class="muted">Shaded rows match your answer.</span><button class="btn" id="nx">Next</button></div>';}
  P.innerHTML=h;
  $$('[data-a]',P).forEach(function(b){b.addEventListener('click',function(){pick[step]=b.dataset.a;render()})});
  var go=$('#go');if(go)go.addEventListener('click',function(){shown[step]=1;render()});
  var nx=$('#nx');if(nx)nx.addEventListener('click',function(){step++;render()});
 } else if(step===3){
  g.innerHTML=sliderGfx(slid);sl.style.display='block';
  sl.innerHTML='<input type="range" id="rg" min="0" max="100" step="5" value="'+slid+'" aria-label="Percent of your body replaced with artificial cells"><div class="rl"><span>All original</span><span>All artificial</span></div>';
  $('#rg').addEventListener('input',function(e){slid=+e.target.value;$('#gfx').innerHTML=sliderGfx(slid);$('#tip').textContent=slid})
  var m=pick[3];
  P.innerHTML='<h2>Gradual change</h2><p class="scn">Over ten years, each cell in your body and brain is swapped for an identical artificial one. Your memories and character never change. Slide to see the swap. At what point, if ever, do you stop being you?</p><div class="muted" style="margin-bottom:6px">Now at <b id="tip" style="color:var(--ink)">'+slid+'</b>% replaced.</div><div class="ans"><button class="pill'+(m==='never'?' sel':'')+'" data-m="never">There is no point. I stay me throughout.</button><button class="pill'+(m==='point'?' sel':'')+'" data-m="point">There is a point where I stop being me.</button></div>'+(m?'<div class="fb info">'+(m==='never'?'Each theory can agree with you: body continuity is unbroken, memories stay connected, and the soul is untouched. The hard question is the reverse. If every part is replaced, what makes it the same body?':'Then name the exact percent. Whatever number you give, 5% earlier you were still you. None of the three theories draws a sharp line, and that gap is the heart of the puzzle.')+'</div>':'')+'<div class="nav"><span></span><button class="btn" id="nx" '+(m?'':'disabled')+'>See your pattern</button></div>';
  $$('[data-m]',P).forEach(function(b){b.addEventListener('click',function(){pick[3]=b.dataset.m;render()})});
  $('#nx').addEventListener('click',function(){step=4;render()});
 } else {
  g.innerHTML='<svg viewBox="0 0 400 300" role="img" aria-label="Three overlapping circles for body, mind, and soul"><rect width="400" height="300" fill="#F4FAF9"/><circle cx="160" cy="130" r="80" fill="'+TEAL+'" opacity=".28"/><circle cx="240" cy="130" r="80" fill="'+RED+'" opacity=".22"/><circle cx="200" cy="198" r="80" fill="#C79A2E" opacity=".28"/><g font-family="Newsreader,serif" font-weight="600" font-size="17" fill="'+INK+'" text-anchor="middle"><text x="132" y="112">Body</text><text x="268" y="112">Mind</text><text x="200" y="250">Soul</text></g><g font-family="Figtree,sans-serif" font-size="11.5" fill="#3A4252" text-anchor="middle"><text x="132" y="130">brain</text><text x="268" y="130">memory</text><text x="200" y="268">self</text></g></svg>';
  var sc={body:0,psy:0,soul:0},tot={body:0,psy:0,soul:0};
  S.forEach(function(s,i){Object.keys(TH).forEach(function(k){var v=s.v[k];if(v.a){tot[k]++;if(pick[i]===v.a)sc[k]++}})});
  var best=Object.keys(TH).sort(function(a,b){return sc[b]/tot[b]-sc[a]/tot[a]});
  var top=sc[best[0]]/tot[best[0]],tie=top===sc[best[1]]/tot[best[1]];
  P.innerHTML='<h2>Your pattern</h2><p>How often your answers matched what each theory says (the soul view gives no verdict on two cases).</p>'+Object.keys(TH).map(function(k){var pc=Math.round(sc[k]/tot[k]*100);return '<div class="bar"><span>'+TH[k]+'</span><div class="tr"><i style="width:'+pc+'%"></i></div><b>'+sc[k]+'/'+tot[k]+'</b></div>'}).join('')+'<div class="fb info">'+(tie?'Your answers fit more than one theory equally, which is common. Most people mix intuitions about bodies and minds.':'Your answers lean toward the <b>'+TH[best[0]].toLowerCase()+'</b> view. Check its difficulty in the comparison rows before you commit to it.')+'</div><p class="muted" style="margin-top:10px">Whatever your answer, it shapes how you value people. In the Christian view of imago Dei, worth rests on what kind of being a person is, not on memory or ability. Use that contrast in your discussion post.</p><div class="nav"><span></span><button class="btn ghost" id="rs">Start over</button></div>';
  $('#rs').addEventListener('click',function(){step=0;pick=[];shown=[];slid=50;render()});
 }}
render();
</script></body></html>
