<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSCI 301 · Course Introduction and Success Tips</title>
<style>:root{
  --crimson:#A5313A; --crimson-d:#7E2229; --crimson-l:#F6E4E5;
  --ink:#1E2B2F; --muted:#51636A; --paper:#F3F6F2; --card:#FFFFFF; --line:#D3DCD4;
  --leaf:#3D7A52; --leaf-l:#E2EFE5; --sky:#2F7FA3; --sky-l:#DDEEF5;
  --sun:#D99A1E; --sun-l:#FBF0D6; --lav:#6A5FA8; --lav-l:#E7E4F4;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:8px 14px 8px 16px;background:var(--card);border-bottom:1px solid var(--line);border-left:6px solid var(--crimson)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.wk{font-size:12px;font-weight:700;color:#fff;background:var(--crimson);border-radius:999px;padding:2px 10px;white-space:nowrap}
h1{font-family:var(--serif);font-size:20px;line-height:1.15;margin:0;font-weight:700}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font:600 13px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.tab:hover{background:var(--crimson-l)}
.tab[aria-selected="true"]{background:var(--crimson);border-color:var(--crimson);color:#fff}
:focus-visible{outline:3px solid #1B66D1;outline-offset:2px}
.stage{flex:1;min-height:0;padding:10px 12px 12px}
.panel{display:none;height:100%;gap:12px;grid-template-columns:minmax(0,1.35fr) minmax(270px,1fr)}
.panel.on{display:grid}
.art{position:relative;min-height:0;min-width:0;border-radius:14px;overflow:hidden;background-color:#fff;background-image:radial-gradient(#C9D6CC 1.2px,transparent 1.6px);background-size:22px 22px;border:1px solid var(--line)}
.art>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.info{min-height:0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.info h2{font-family:var(--serif);font-size:18px;margin:0;line-height:1.2}
.info h3{font-size:13px;margin:0;color:var(--crimson-d);font-weight:700}
.info p{margin:0}
.info ul{margin:0;padding-left:18px}
.info li{margin:2px 0}
.small{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--lav-l);color:#43397F;margin-right:4px}
.tag.g{background:var(--leaf-l);color:#25573A}.tag.s{background:var(--sky-l);color:#1B5875}.tag.c{background:var(--crimson-l);color:var(--crimson-d)}.tag.y{background:var(--sun-l);color:#7A5410}
.btn{font:600 13px var(--sans);border:1px solid var(--crimson);background:var(--crimson);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--crimson-d)}
.btn.ghost{background:#fff;color:var(--crimson-d)}
.btn.ghost:hover{background:var(--crimson-l)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{font:600 13px var(--sans);border:0;background:#fff;color:var(--ink);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.bar{height:8px;border-radius:99px;background:#E4EAE5;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf);transition:width .35s}
.hs{cursor:pointer}

.hs:hover{filter:brightness(1.06)}
.hs.sel{filter:drop-shadow(0 0 3px #A5313A) drop-shadow(0 0 5px #A5313A)}
svg text{font-family:var(--sans)}
.lbl{font-size:15px;font-weight:600;fill:#1E2B2F;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.lbl.s{font-size:13px}
.ctl{position:absolute;left:10px;top:10px;z-index:2}
.mcq{display:grid;gap:6px}
.opt{font:500 14px var(--sans);text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){background:var(--sun-l);border-color:var(--sun)}
.opt.right{background:var(--leaf-l);border-color:var(--leaf)}
.opt.wrong{background:var(--crimson-l);border-color:var(--crimson)}
.opt:disabled{cursor:default}
.fb{border-left:4px solid var(--leaf);background:var(--leaf-l);border-radius:6px;padding:6px 10px;font-size:14px}
.fb.warn{border-color:var(--sun);background:var(--sun-l)}
.fb.no{border-color:var(--crimson);background:var(--crimson-l)}
input[type=range]{width:100%;accent-color:var(--crimson)}
@media (max-width:860px){
  html,body{font-size:14px}
  .top{padding:6px 10px 6px 12px;gap:6px}
  h1{font-size:17px}
  .tab{padding:5px 9px;font-size:12.5px}
  .stage{padding:8px}
  .panel{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:8px}
  .info{padding:10px 12px;gap:6px}
  .info h2{font-size:16px}
  .hide-m{display:none!important}
  .lbl{font-size:18px}
  .lbl.s{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


.chipbtn{font:600 13px var(--sans);border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--ink)}
.chipbtn[aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson);color:#fff}
.nd{cursor:pointer}
.grow{display:grid;grid-template-columns:1fr 90px;gap:2px 8px;align-items:center;cursor:pointer;border-radius:8px;padding:3px 6px;border:1px solid transparent}
.grow.sel{background:var(--sun-l);border-color:var(--sun)}
.grow .nm{font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.grow .nm i{width:11px;height:11px;border-radius:3px;flex:none}
.grow .vl{font-size:13px;text-align:right;color:var(--muted)}
.grow input{grid-column:1/3;margin:0;height:16px}
@media (max-width:860px){.grow{padding:0 6px}.grow .nm{font-size:13px}}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--leaf)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.kv b{color:var(--crimson-d)}
</style></head>
<body><div id="app">
<header class="top"><div class="brand"><span class="wk">Start here</span><h1>Welcome to NSCI 301: Life Science</h1></div><nav class="tabs" role="tablist" aria-label="Sections"><button class="tab" role="tab" aria-selected="false">Welcome</button><button class="tab" role="tab" aria-selected="false">Learning goals</button><button class="tab" role="tab" aria-selected="false">8-week map</button><button class="tab" role="tab" aria-selected="false">Grading</button><button class="tab" role="tab" aria-selected="false">Success tips</button></nav></header>

<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
/* Tabs: click + arrow keys */
function initTabs(onChange){
  const tabs=$$('.tab'), panels=$$('.panel');
  function show(i,focus){
    tabs.forEach((t,j)=>{t.setAttribute('aria-selected',j===i);t.tabIndex=j===i?0:-1});
    panels.forEach((p,j)=>p.classList.toggle('on',j===i));
    if(focus)tabs[i].focus();
    if(onChange)onChange(i);
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>show(i));
    t.addEventListener('keydown',e=>{
      let n=null;
      if(e.key==='ArrowRight')n=(i+1)%tabs.length;
      if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;
      if(n!==null){e.preventDefault();show(n,true)}
    });
  });
  show(0);
  return show;
}
/* Make SVG groups keyboard-operable */
function activatable(root,handler){
  $$('.hs',root).forEach(g=>{
    g.setAttribute('tabindex','0');g.setAttribute('role','button');
    g.addEventListener('click',()=>handler(g));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handler(g)}});
  });
}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function lerp(a,b,t){return a+(b-a)*t}
function mixHex(a,b,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');
}
/* Simple multiple-choice quiz engine. cfg: {host, qs:[{q,opts:[],a:index,why}], onProgress(done,total,score), onDone} */
function quiz(cfg){
  const host=cfg.host;let i=0,score=0,done=false;
  function render(){
    if(i>=cfg.qs.length){
      done=true;host.innerHTML=`<h2>${score} of ${cfg.qs.length} correct</h2><p>${esc(cfg.finish(score))}</p><div class="row"><button class="btn" id="qr">Try again</button></div>`;
      $('#qr',host).onclick=()=>{i=0;score=0;done=false;cfg.onProgress(0,cfg.qs.length,0);render()};
      cfg.onProgress(cfg.qs.length,cfg.qs.length,score);return;
    }
    const q=cfg.qs[i];
    host.innerHTML=`<h3>Question ${i+1} of ${cfg.qs.length}</h3><p style="font-weight:600">${esc(q.q)}</p><div class="mcq">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="qf" aria-live="polite"></div>`;
    $$('.opt',host).forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=k===q.a;
      if(ok)score++;
      $$('.opt',host).forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('right')});
      if(!ok)b.classList.add('wrong');
      $('#qf',host).innerHTML=`<div class="fb ${ok?'':'no'}"><b>${ok?'Correct.':'Not quite.'}</b> ${esc(q.why)}</div><div class="row" style="margin-top:6px"><button class="btn" id="qn">${i+1<cfg.qs.length?'Next question':'See result'}</button></div>`;
      cfg.onProgress(i+1,cfg.qs.length,score);
      $('#qn',host).onclick=()=>{i++;render()};$('#qn',host).focus();
    });
  }
  cfg.onProgress(0,cfg.qs.length,0);render();
}

initTabs();

const C={crimson:'#A5313A',leaf:'#3D7A52',sky:'#2F7FA3',sun:'#D99A1E',lav:'#6A5FA8'};
const tx=(x,y,t,o='')=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="14" font-weight="700" fill="#1E2B2F" style="paint-order:stroke;stroke:#fff;stroke-width:4px" ${o}>${t}</text>`;

/* ---------- Welcome ---------- */
const SK=[
 {n:'Scientific reasoning',sh:'Scientific reasoning',c:C.leaf,d:'Apply the steps of the scientific method to questions in biology, ecology, genetics and evolution, and support claims with evidence.',ic:'<path d="M-7 -16 H7 M-5 -16 V-4 L-16 14 Q-18 18 -13 18 H13 Q18 18 16 14 L5 -4 V-16" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-11 8 H11" stroke="#fff" stroke-width="3"/>'},
 {n:'Research and source evaluation',sh:'Research and sources',c:C.sky,d:'Locate, evaluate and cite scholarly and authoritative sources to support a position or recommendation.',ic:'<circle cx="-3" cy="-3" r="11" fill="none" stroke="#fff" stroke-width="4"/><path d="M5 5 L15 15" stroke="#fff" stroke-width="5" stroke-linecap="round"/>'},
 {n:'Science communication',sh:'Science communication',c:C.sun,d:'Explain complex scientific terms and concepts clearly in writing, in discussion and in a recorded presentation.',ic:'<path d="M-15 -12 H15 V6 H0 L-9 15 V6 H-15Z" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>'},
 {n:'Ethical and stakeholder analysis',sh:'Ethics and stakeholders',c:C.lav,d:'Weigh the interests of multiple stakeholders and the ethical implications of a proposed solution.',ic:'<path d="M0 -16 V14 M-12 16 H12 M-14 -8 H14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M-14 -8 L-20 4 H-8Z M14 -8 L8 4 H20Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>'},
 {n:'Classroom application',sh:'Classroom application',c:C.crimson,d:'Connect science content to K-12 teaching using the CA NGSS and the California State Science Framework.',ic:'<rect x="-16" y="-13" width="32" height="22" rx="3" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M-9 -4 H9 M-9 2 H3 M-8 15 H8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>'}
];
let sk=0;
function drawW(){
  let h=`<defs><clipPath id="lensc"><circle cx="300" cy="235" r="122"/></clipPath><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE0F2"/><stop offset="1" stop-color="#EAF5EC"/></linearGradient></defs>`;
  h+=`<circle cx="300" cy="235" r="136" fill="#fff" stroke="${C.crimson}" stroke-width="10"/><g clip-path="url(#lensc)"><rect x="170" y="110" width="260" height="250" fill="url(#skyg)"/><circle cx="360" cy="170" r="22" fill="#F6C945"/><path d="M170 270 Q250 215 330 262 T430 250 V360 H170Z" fill="#8CC565"/><path d="M170 310 Q270 270 430 305 V360 H170Z" fill="#6BAA4A"/><rect x="262" y="226" width="12" height="52" rx="4" fill="#7A5A3A"/><circle cx="268" cy="214" r="30" fill="#3D7A52"/><circle cx="248" cy="228" r="20" fill="#4F9A3E"/><circle cx="290" cy="228" r="20" fill="#5BA646"/><path d="M330 200 q10 -10 20 0 q10 -10 20 0" fill="none" stroke="#3E2F22" stroke-width="3" stroke-linecap="round"/></g>`;
  h+=`<path d="M404 328 L470 395" stroke="${C.crimson}" stroke-width="0"/>`;
  SK.forEach((s,i)=>{
    const a=(-90+i*72)*Math.PI/180,x=300+205*Math.cos(a),y=235+170*Math.sin(a)*1.0;
    const yy=i===0?50:y;
    h+=`<g class="hs nd ${i===sk?'sel':''}" data-i="${i}" transform="translate(${x} ${yy})" aria-label="${s.n}"><circle class="hl" r="36" fill="${s.c}" stroke="${i===sk?'#1E2B2F':'#fff'}" stroke-width="${i===sk?5:4}"/><g>${s.ic}</g>${tx(0,i===0?-46:54,s.sh,'font-size="13"')}</g>`;
  });
  $('#wsvg').innerHTML=h;
  activatable($('#wsvg'),g=>{sk=+g.dataset.i;drawW();renderW()});
}
function renderW(){
  $('#winfo').innerHTML=`<h2>Welcome to your course</h2><p class="hide-m">This course examines the fundamental concepts of life science: the structure and function of living organisms, ecology, genetics and evolution. You will evaluate how pollution, temperature, resource consumption and conservation affect life, and apply what you learn to real classrooms.</p>
  <h3>Five skills you will build (select one)</h3><div class="row">${SK.map((s,i)=>`<button class="chipbtn" data-i="${i}" aria-pressed="${i===sk}">${s.n}</button>`).join('')}</div>
  <p><b>${SK[sk].n}:</b> ${SK[sk].d}</p>`;
  $$('#winfo [data-i]').forEach(b=>b.onclick=()=>{sk=+b.dataset.i;drawW();renderW()});
}
drawW();renderW();

/* ---------- Learning goals ---------- */
const GO=[
 {s:'Scientific method',v:'Apply',t:'Apply the steps of the scientific method in the context of biology, ecology, genetics and evolution.'},
 {s:'Ethics and education',v:'Describe',t:'Describe the importance of a scientific concept in an educational and ethical context.',w:'Science Symposium Part 2, where you defend a solution, its ethical implications and its importance in the classroom.'},
 {s:'CA NGSS',v:'Apply',t:'Apply knowledge of biology, ecology, genetics and evolution in an educational context using the Next Generation Science Standards for California Public Schools and the California State Science Framework as guidelines.'},
 {s:'K-12 classroom',v:'Apply',t:'Apply scientific terms and concepts in relevant K-12 classroom applications.',w:'Science Symposium Part 2, where you explain a concept’s importance in the classroom.'},
 {s:'Faith and science',v:'Integrate',t:'Integrate principles of Christian worldview and science into your learning and personal growth.',w:'Discussion 7: Evolution and Scripture.'}
];
let gi=0;
function drawG(){
  let h='';
  const P=GO.map((_,i)=>{const a=(-90+i*72)*Math.PI/180;return[300+210*Math.cos(a),240+170*Math.sin(a)]});
  P.forEach(p=>h+=`<line x1="300" y1="240" x2="${p[0]}" y2="${p[1]}" stroke="#B9C7BD" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>`);
  h+=`<circle cx="300" cy="240" r="74" fill="#fff" stroke="${C.crimson}" stroke-width="6"/><text x="300" y="236" text-anchor="middle" font-size="22" font-weight="800" fill="${C.crimson}" style="font-family:var(--serif)">NSCI 301</text><text x="300" y="260" text-anchor="middle" font-size="13" fill="#51636A">Class goals</text>`;
  GO.forEach((g,i)=>{const [x,y]=P[i],sel=i===gi,col=[C.leaf,C.lav,C.sky,C.sun,C.crimson][i];
    h+=`<g class="hs nd" data-i="${i}" transform="translate(${x} ${y})" aria-label="${g.v}: ${g.s}"><rect class="hl" x="-82" y="-34" width="164" height="68" rx="16" fill="${sel?col:'#fff'}" stroke="${col}" stroke-width="${sel?6:4}"/><text y="-8" text-anchor="middle" font-size="13" font-weight="700" fill="${sel?'#fff':col}" style="pointer-events:none">${g.v.toUpperCase()===''?'':g.v}</text><text y="14" text-anchor="middle" font-size="15" font-weight="700" fill="${sel?'#fff':'#1E2B2F'}" style="pointer-events:none">${g.s}</text></g>`});
  $('#gsvg').innerHTML=h;
  activatable($('#gsvg'),g=>{gi=+g.dataset.i;drawG();renderG()});
}
function renderG(){
  const g=GO[gi];
  $('#ginfo').innerHTML=`<div><span class="tag c">Goal ${gi+1} of 5</span></div><h2>${g.v}: ${g.s}</h2><p>Students will ${g.v.toLowerCase()} ${g.t.charAt(0).toLowerCase()===g.t.charAt(0)?g.t:g.t.replace(/^\w+ /,'')}</p>${g.w?`<h3>Where you practice it</h3><p>${g.w}</p>`:''}<div class="row"><button class="btn ghost" id="gp" ${gi===0?'disabled':''}>Previous</button><button class="btn" id="gn" ${gi===4?'disabled':''}>Next goal</button></div>`;
  $('#gp').onclick=()=>{gi--;drawG();renderG()};$('#gn').onclick=()=>{gi++;drawG();renderG()};
}
drawG();renderG();

/* ---------- 8-week map ---------- */
const WKS=[
 {n:'Cells',d:'Discussion 1: Biodiversity Walkabout'},
 {n:'Chemistry of Life',d:'Discussion 2: Science Issue Identification'},
 {n:'Organ Systems',full:'Organization and Organ Systems',d:'Discussion 3: Reflections on Diet'},
 {n:'Organisms & Environment',full:'Organisms and Their Environment',d:'Discussion 4: Keystone and Indicator Species',m:{k:'flag',t:'Science Symposium Part 1: Science Issue Identification',p:60}},
 {n:'Ecosystems',full:'Ecosystems and the Cycling of Matter',d:'Discussion 5: Biodiversity',m:{k:'star',t:'Quiz #1',p:80}},
 {n:'Life Cycles',full:'Life Cycles, Plant Growth and Sources of Variation',d:'Discussion 6: Life Cycles',m:{k:'flag',t:'Science Symposium Part 2: Solution Proposal',p:80}},
 {n:'Evolution',full:'Evolution and Natural Selection',d:'Discussion 7: Evolution and Scripture',m:{k:'flag',t:'Science Symposium Part 3: Symposium (executive summary and recorded presentation)',p:80}},
 {n:'Human Impact',d:'Discussion 8: Science Symposium',m:{k:'star',t:'Quiz #2',p:80},nolab:true}
];
const WPOS=[[90,110],[230,190],[370,110],[510,190],[510,350],[370,420],[230,350],[90,420]];
let wi=0;
function drawM(){
  let h=`<path d="M90 110 C150 110 170 190 230 190 S310 110 370 110 S450 190 510 190 C580 190 580 350 510 350 S430 420 370 420 S290 350 230 350 S150 420 90 420" fill="none" stroke="#C9B48A" stroke-width="26" stroke-linecap="round" opacity=".55"/><path d="M90 110 C150 110 170 190 230 190 S310 110 370 110 S450 190 510 190 C580 190 580 350 510 350 S430 420 370 420 S290 350 230 350 S150 420 90 420" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>`;
  WKS.forEach((w,i)=>{const [x,y]=WPOS[i],sel=i===wi;
    let b='';
    if(w.m)b=w.m.k==='flag'?`<g transform="translate(24 -40)"><path d="M0 0 V28" stroke="#51636A" stroke-width="3"/><path d="M0 0 H22 L16 7 L22 14 H0Z" fill="${C.crimson}"/></g>`:`<path transform="translate(30 -30)" d="M0 -13 L4 -4 L14 -3 L7 4 L9 14 L0 9 L-9 14 L-7 4 L-14 -3 L-4 -4Z" fill="${C.sun}" stroke="#fff" stroke-width="2"/>`;
    h+=`<g class="hs nd" data-i="${i}" transform="translate(${x} ${y})" aria-label="Week ${i+1}: ${w.full||w.n}"><circle class="hl" r="30" fill="${sel?C.crimson:'#fff'}" stroke="${C.crimson}" stroke-width="${sel?6:4}"/><text y="9" text-anchor="middle" font-size="25" font-weight="800" fill="${sel?'#fff':C.crimson}" style="font-family:var(--serif);pointer-events:none">${i+1}</text>${b}${tx(0,i<4?-44:52,w.n)}</g>`;
  });
  h+=`<g transform="translate(40 40)"><path d="M0 0 V24" stroke="#51636A" stroke-width="3"/><path d="M0 0 H18 L13 6 L18 12 H0Z" fill="${C.crimson}"/><text x="26" y="12" font-size="12" fill="#51636A">Science Symposium</text><path transform="translate(160 6)" d="M0 -9 L3 -3 L10 -2 L5 3 L6 10 L0 6 L-6 10 L-5 3 L-10 -2 L-3 -3Z" fill="${C.sun}"/><text x="176" y="12" font-size="12" fill="#51636A">Quiz</text></g>`;
  $('#msvg').innerHTML=h;
  activatable($('#msvg'),g=>{wi=+g.dataset.i;drawM();renderM()});
}
function renderM(){
  const w=WKS[wi];let pts=40+20+(w.nolab?0:20)+(w.m?w.m.p:0);
  $('#minfo').innerHTML=`<div><span class="tag c">Week ${wi+1}</span></div><h2>${w.full||w.n}</h2>
  <div class="kv"><b>Learn</b><span>Deep Dive and Week ${wi+1} Resources</span><b>Discuss</b><span>${w.d} (40 pts)</span><b>Practice</b><span>Vocabulary Graphic Organizer (20 pts)</span>${w.nolab?'':'<b>Apply</b><span>Laboratory Exercise (20 pts)</span>'}${w.m?`<b>Milestone</b><span>${w.m.t} (${w.m.p} pts)</span>`:''}</div>
  <p><b>${pts} points</b> this week.</p>
  <div class="row"><button class="btn ghost" id="mp" ${wi===0?'disabled':''}>Previous week</button><button class="btn" id="mn" ${wi===7?'disabled':''}>Next week</button></div>`;
  $('#mp').onclick=()=>{wi--;drawM();renderM()};$('#mn').onclick=()=>{wi++;drawM();renderM()};
}
drawM();renderM();

/* ---------- Grading ---------- */
const GR=[
 {n:'Discussions',w:32,c:C.crimson,d:'8 discussions at 40 points each (320 points).'},
 {n:'Vocabulary organizers',w:16,c:C.leaf,d:'8 graphic organizers at 20 points each (160 points).'},
 {n:'Laboratory exercises',w:14,c:C.sky,d:'7 labs at 20 points each (140 points), Weeks 1 to 7.'},
 {n:'Quizzes',w:16,c:C.sun,d:'2 quizzes at 80 points each (160 points), in Weeks 5 and 8.'},
 {n:'Science Symposium',w:22,c:C.lav,d:'3 parts worth 60, 80 and 80 points (220 points), Weeks 4, 6 and 7.'}
];
let gsel=0;const score=[90,90,90,90,90];
function est(){return GR.reduce((a,g,i)=>a+g.w*score[i]/100,0)}
function drawD(){
  let h='',a0=-Math.PI/2;const R=150,r=92,cx=300,cy=240;
  GR.forEach((g,i)=>{const a1=a0+g.w/100*2*Math.PI;const lg=g.w>50?1:0;
    const p=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
    const o=gsel===i?10:0,am=(a0+a1)/2,dx=o*Math.cos(am),dy=o*Math.sin(am);
    const [x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[x2,y2]=p(a1,r),[x3,y3]=p(a0,r);
    h+=`<path d="M${x0} ${y0} A${R} ${R} 0 ${lg} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z" fill="${g.c}" stroke="#fff" stroke-width="4" transform="translate(${dx} ${dy})" style="transition:transform .25s"/>`;
    const [lx,ly]=p(am,(R+r)/2);h+=`<text x="${lx+dx}" y="${ly+5+dy}" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">${g.w}%</text>`;
    a0=a1;});
  h+=`<text x="300" y="232" text-anchor="middle" font-size="13" fill="#51636A">Estimated total</text><text x="300" y="268" text-anchor="middle" font-size="36" font-weight="800" fill="#1E2B2F" style="font-family:var(--serif)">${est().toFixed(1)}%</text><text x="300" y="440" text-anchor="middle" font-size="13" fill="#51636A">1,000 points in all. Slide the scores to explore.</text>`;
  $('#dsvg').innerHTML=h;
}
function renderD(){
  $('#dinfo').innerHTML=`<h2>How your grade is built</h2>`+GR.map((g,i)=>`<div class="grow ${i===gsel?'sel':''}" data-i="${i}"><span class="nm"><i style="background:${g.c}"></i>${g.n} · ${g.w}%</span><span class="vl"><span id="v${i}">${score[i]}</span>% score</span><input type="range" min="0" max="100" step="1" value="${score[i]}" data-i="${i}" aria-label="Your score on ${g.n}"></div>`).join('')+`<p class="small" id="gd">${GR[gsel].d}</p><div class="fb warn hide-m"><b>Estimate only.</b> Missing assignments are marked zero in the course settings, so reach out to your instructor early if life gets in the way.</div>`;
  $$('#dinfo .grow').forEach(r=>r.addEventListener('click',()=>{gsel=+r.dataset.i;$$('#dinfo .grow').forEach(x=>x.classList.toggle('sel',x===r));$('#gd').textContent=GR[gsel].d;drawD()}));
  $$('#dinfo input').forEach(inp=>inp.addEventListener('input',()=>{const i=+inp.dataset.i;score[i]=+inp.value;$('#v'+i).textContent=inp.value;gsel=i;$$('#dinfo .grow').forEach(x=>x.classList.toggle('sel',+x.dataset.i===i));$('#gd').textContent=GR[i].d;drawD()}));
}
drawD();renderD();

/* ---------- Success tips ---------- */
const ST=[
 {n:'Read the Deep Dive',c:C.leaf,t:['Start with the Big Idea, then read the key concepts.','Jot one question per section to bring to the discussion.','Readings come from OpenStax Concepts of Biology, which is free online.']},
 {n:'Check the Resources',c:C.sky,t:['Open the Week Resources page before you begin the lab.','Skim it early so you know what to gather and what is expected.']},
 {n:'Join the discussion',c:C.crimson,t:['Discussions are the largest part of your grade (32%).','Post early, use evidence, and reply to classmates with substance.']},
 {n:'Complete the organizer',c:C.sun,t:['Fill in the Vocabulary Graphic Organizer as you read, in your own words.','Eight organizers add up to 16% of your grade.']},
 {n:'Do the lab',c:C.lav,t:['Read the whole exercise before you start.','Record observations as you go, then connect them to the Deep Dive.','Seven labs add up to 14% of your grade.']}
];
let si=0,done=[false,false,false,false,false],sym=false;
try{const v=JSON.parse(localStorage.getItem('nsci301-steps'));if(Array.isArray(v)&&v.length===5)done=v}catch(e){}
function saveDone(){try{localStorage.setItem('nsci301-steps',JSON.stringify(done))}catch(e){}}
function drawS(){
  let h='';const P=ST.map((_,i)=>{const a=(-90+i*72)*Math.PI/180;return[300+175*Math.cos(a),235+155*Math.sin(a),a]});
  for(let i=0;i<5;i++){const a0=P[i][2],a1=P[(i+1)%5][2]+(i===4?2*Math.PI:0);
    const f=a=>[300+175*Math.cos(a),235+155*Math.sin(a)];const s=f(a0),e=f(a1),m=f((a0+a1)/2);const ang=Math.atan2(155*Math.cos((a0+a1)/2),-175*Math.sin((a0+a1)/2))*180/Math.PI;
    h+=`<path d="M${s[0]} ${s[1]} A175 155 0 0 1 ${e[0]} ${e[1]}" fill="none" stroke="#B9C7BD" stroke-width="5"/><path d="M-9 -8 L9 0 L-9 8Z" fill="#8FA095" transform="translate(${m[0]} ${m[1]}) rotate(${ang})"/>`}
  h+=`<g class="hs nd ${sym?'sel':''}" data-i="sym" transform="translate(300 235)" aria-label="Science Symposium thread"><circle class="hl" r="62" fill="${sym?C.lav:'#fff'}" stroke="${C.lav}" stroke-width="6"/><text y="-4" text-anchor="middle" font-size="15" font-weight="800" fill="${sym?'#fff':C.lav}" style="pointer-events:none">Science</text><text y="16" text-anchor="middle" font-size="15" font-weight="800" fill="${sym?'#fff':C.lav}" style="pointer-events:none">Symposium</text></g>`;
  ST.forEach((s,i)=>{const [x,y]=P[i],sel=!sym&&i===si;
    h+=`<g class="hs nd" data-i="${i}" transform="translate(${x} ${y})" aria-label="Step ${i+1}: ${s.n}${done[i]?' (done)':''}"><circle class="hl" r="36" fill="${done[i]?s.c:'#fff'}" stroke="${s.c}" stroke-width="${sel?8:4}"/><text y="9" text-anchor="middle" font-size="26" font-weight="800" fill="${done[i]?'#fff':s.c}" style="font-family:var(--serif);pointer-events:none">${done[i]?'✓':i+1}</text>${tx(0,i===0?-48:52,s.n)}</g>`});
  $('#ssvg').innerHTML=h;
  activatable($('#ssvg'),g=>{if(g.dataset.i==='sym'){sym=true}else{sym=false;si=+g.dataset.i}drawS();renderS()});
}
function renderS(){
  const n=done.filter(Boolean).length;
  const prog=`<div class="small">${n} of 5 weekly steps done</div><div class="bar" aria-hidden="true"><i style="width:${n*20}%"></i></div>`;
  if(sym){
    $('#sinfo').innerHTML=`<h2>Start the Symposium early</h2><p>Three parts build on each other: issue identification in Week 4, solution proposal in Week 6, and the symposium in Week 7, shared with peers in Week 8. Together they are 22% of your grade.</p><ul><li>Keep your sources organized from Part 1 onward.</li><li>Use feedback on each part to strengthen the next.</li></ul>${prog}`;return;
  }
  const s=ST[si];
  $('#sinfo').innerHTML=`<div><span class="tag" style="background:${s.c};color:#fff">Step ${si+1} of 5</span></div><h2>${s.n}</h2><ul>${s.t.map(x=>`<li>${x}</li>`).join('')}</ul>
  <label class="chk"><input type="checkbox" id="dn" ${done[si]?'checked':''}> Mark this step done for the week</label>${prog}
  <p class="small">Stuck? Use Ask the Prof or visit the Professor Corner in the Welcome module.</p>
  <div class="row"><button class="btn ghost" id="rs">Reset steps</button></div>`;
  $('#dn').onchange=e=>{done[si]=e.target.checked;saveDone();drawS();renderS()};
  $('#rs').onclick=()=>{done=[false,false,false,false,false];saveDone();drawS();renderS()};
}
drawS();renderS();
</script></body></html>
