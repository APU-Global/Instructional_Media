.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kid{position:relative;display:flex;gap:10px;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.kid:hover{border-color:#9db7d5}

.kid h4{margin:0 0 2px;font-size:15px;color:var(--navy)}

.kid .chk{position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;background:#fff}
.kid.sel .chk{background:var(--teal);border-color:var(--teal)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-bottom:3px;background:#e8eef5;color:var(--navy)}
.tag.el{background:#fde8d0;color:#8a4b08}.tag.sn{background:#e3e6fb;color:#363f9a}.tag.ot{background:#e0f3ee;color:#1c6b5f}.tag.no{background:#eceff1;color:#455a64}

.opts{display:grid;gap:7px}
.opt{font:inherit;text-align:left;background:#f7f9fc;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--ink)}

select,textarea,input[type=text]{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}

.bubble:before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:var(--navy2);border-left:0}

function mcq(parent,{prompt,options,onCorrect,shuffle=true,cls=''}){
 const box=el('div','q '+cls);if(prompt)box.appendChild(el('p','qp',prompt));
 const list=el('div','opts'),fb=el('div','fb');fb.setAttribute('role','status');let done=false;
 (shuffle?shuf(options):options).forEach(o=>{const b=el('button','opt',o.t);b.type='button';
  b.onclick=()=>{if(done||b.classList.contains('bad'))return;
   if(o.ok){done=true;b.classList.add('good');$$('.opt',list).forEach(x=>x.disabled=true);fb.className='fb show good';fb.innerHTML='✅ '+o.fb;onCorrect&&onCorrect()}
   else{b.classList.add('bad');b.disabled=true;fb.className='fb show bad';fb.innerHTML='🔁 '+o.fb+' <b>Try another option.</b>'}};
  list.appendChild(b)});
 box.appendChild(list);box.appendChild(fb);parent.appendChild(box);return box}

function classify(parent,{items,cats,onDone,shuffle=true}){
 let n=0;const prog=el('div','prog',`0 / ${items.length} sorted`);parent.appendChild(prog);
 (shuffle?shuf(items):items).forEach(it=>{
  const row=el('div','crow');row.appendChild(el('div','',it.t));const btns=el('div','cbtns'),note=el('div','cnote');note.setAttribute('role','status');
  cats.forEach(c=>{const b=el('button','cbtn',c.label);b.type='button';
   b.onclick=()=>{if(row.dataset.ok)return;
    if(c.id===it.cat){row.dataset.ok=1;row.classList.add('ok');$$('.cbtn',btns).forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('dim')});b.classList.add('sel');
     note.className='cnote show good';note.innerHTML='✅ '+it.why;n++;prog.textContent=`${n} / ${items.length} sorted`;if(n===items.length&&onDone)onDone()}
    else{b.classList.add('wrong');b.disabled=true;note.className='cnote show bad';note.innerHTML='🔁 Not quite — try another category.'}};
   btns.appendChild(b)});
  row.appendChild(btns);row.appendChild(note);parent.appendChild(row)})}

function copyBox(ta,btn){btn.onclick=()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 const old=btn.textContent;btn.textContent=ok?'Copied ✓':'Press Ctrl/Cmd + C to copy';setTimeout(()=>btn.textContent=old,2200)}}

function runApp({steps}){
 const stepsEl=$('#steps'),main=$('#main'),back=$('#back'),next=$('#next'),stat=$('#stat');
 const done=steps.map(()=>false);let cur=0;
 const pills=steps.map((s,i)=>{const p=el('button','pill',`<span class="n">${i+1}</span><span class="t">${s.name}</span>`);p.type='button';p.title=s.name;p.onclick=()=>go(i);stepsEl.appendChild(p);return p});
 const panels=steps.map((s,i)=>{const d=el('section','panel');d.setAttribute('aria-label',s.name);main.appendChild(d);
  s.build(d,()=>{done[i]=true;paint()});return d});
 function paint(){pills.forEach((p,i)=>{p.classList.toggle('on',i===cur);p.classList.toggle('done',done[i]);p.querySelector('.n').textContent=done[i]&&i!==cur?'✓':i+1;if(i===cur)p.setAttribute('aria-current','step');else p.removeAttribute('aria-current')});
  panels.forEach((d,i)=>d.classList.toggle('show',i===cur));back.disabled=cur===0;next.disabled=cur===steps.length-1;
  stat.textContent=`Step ${cur+1} of ${steps.length} · ${done.filter(Boolean).length} completed`}
 function go(i){cur=i;paint();steps[i].show&&steps[i].show(panels[i]);main.scrollTop=0}
 back.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);go(0)}

<ellipse cx="650" cy="322" rx="60" ry="22" fill="#b39ddb"/><ellipse cx="650" cy="304" rx="28" ry="18" fill="#7e57c2"/><ellipse cx="650" cy="298" rx="18" ry="9" fill="#9575cd"/><path d="M610 286l22-18 22 18z" fill="#ffb74d" opacity=".0"/>
<g id="hotspots"></g></svg>`;
const CARDS=[
['Fraction strips (colored paper or plastic)','y','A','Concrete models let students see and compare equal parts, which aligns directly to the objective.'],
['Digital fraction number line with audio and captions','y','A','Aligned to comparing fractions, with built-in access features (audio and captions).'],
['Sentence-frame card: “___ is greater than ___ because ___”','y','A','Supports the “explain their reasoning” part of the objective for all learners, especially English learners.'],
['Picture book about sharing a pizza into equal parts','y','A','A story context makes fraction language concrete and engaging.'],
['A 20-problem compare-the-fractions worksheet with small, dense text and no visuals','y','C','The content aligns, but the format creates barriers. Add visuals, chunk it, and use larger font.'],
['English-only fractions video with no captions','y','C','Content aligns, but students need captions, a transcript, or a glossary for access.'],
['Timed multiplication-facts drill','n','N','It’s a valid skill, but it doesn’t support comparing fractions with models and explanations.'],
['Coloring page of farm animals (no math)','n','N','It’s engaging, but nothing in it supports the objective.']];

runApp({steps:[
{name:'Classroom Tour',build(p,ok){
 p.innerHTML=`<h2>What makes a classroom feel safe?</h2><p class="lead">Safety is physical <i>and</i> emotional. Select each numbered hotspot (all eight) to see how this classroom supports learning.</p>`;
 const grid=el('div','grid');grid.style.cssText='grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start';
 const left=el('div','',SCENE),right=el('div','card');right.style.minHeight='200px';
 right.innerHTML='<div class="mini">Progress</div><div class="prog" id="hsprog">0 / 8 found</div><p class="mini">Select a numbered hotspot in the picture to learn more.</p>';
 grid.appendChild(left);grid.appendChild(right);p.appendChild(grid);
 const NS='http://www.w3.org/2000/svg',g=$('#hotspots',left);
 const colors={Physical:'#2f6fb5',Emotional:'#e76f51'};
 function show(i){const h=HS[i];seen.add(i);
  right.innerHTML=`<div class="mini">Progress</div><div class="prog">${seen.size} / ${HS.length} found</div><span class="tag" style="background:${h.k==='Physical'?'#e6f0fb':'#fdece6'};color:${colors[h.k]}">${h.k} safety</span><h3>${h.t}</h3><p style="margin:0">${h.d}</p>`;
  $$('.hs',g)[i].classList.add('seen');$$('.hs',g)[i].querySelector('.dot').setAttribute('fill','#1a7f45');$$('.hs',g)[i].querySelector('text').textContent='✓';
  if(seen.size===HS.length){right.appendChild(el('div','fb show good','🌟 You found all eight. Which can you see in your own placement? Which could you add?'));ok()}}
 HS.forEach((h,i)=>{const e=document.createElementNS(NS,'g');e.setAttribute('class','hs');e.setAttribute('tabindex','0');e.setAttribute('role','button');e.setAttribute('aria-label','Hotspot '+(i+1)+': '+h.t);
  e.innerHTML=`<circle class="ring" cx="${h.x}" cy="${h.y}" r="15" fill="#1d3557" opacity=".5"/><circle class="dot" cx="${h.x}" cy="${h.y}" r="15" fill="#1d3557" stroke="#fff" stroke-width="3"/><text x="${h.x}" y="${h.y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Segoe UI,Arial">${i+1}</text>`;
  e.onclick=()=>show(i);e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();show(i)}};g.appendChild(e)})}},

{name:'Respond with Care',build(p,ok){
 p.innerHTML=`<h2>Responding in the moment</h2><p class="lead">Emotional safety is built by how you respond. Choose the response that best protects the student’s dignity <i>and</i> keeps learning moving.</p>`;
 let n=0;const hit=()=>{if(++n===3){p.appendChild(el('div','fb show good','🌟 <b>Pattern to remember:</b> stay calm, protect dignity, reference shared norms, and follow up privately.'));ok()}};
 [[{name:'Student',bg:'#fde1ec',skin:'#f1c27d',hair:'#b5651d',shirt:'#ab47bc',style:'bun'},'A student answers incorrectly, and a few classmates laugh.',[
  {t:'Calmly restate the norm (“In our class, we help each other learn”), thank the student for trying, and ask what part made sense to them.',ok:1,fb:'It protects dignity, reinforces the norms, and values the student’s thinking.'},
  {t:'Ignore the laughter and move on to the next question.',fb:'Ignoring the laughter tells students it’s okay.'},
  {t:'Call on a stronger student to give the right answer.',fb:'This confirms the student was “wrong” in front of peers.'},
  {t:'Send the laughing students to the hallway.',fb:'A harsh public response can create more fear.'}]],
 [{name:'Student',bg:'#d7e8ff',skin:'#e8c39a',hair:'#161616',shirt:'#2f6fb5',style:'short',glasses:1},'A new student stays at the edge of the group and doesn’t speak.',[
  {t:'Greet them by name, assign a welcoming partner, and use a low-stakes think-pair-share with a sentence frame.',ok:1,fb:'It builds belonging and offers a safe way to participate.'},
  {t:'Wait until they’re ready to join on their own.',fb:'Without support, isolation can continue.'},
  {t:'Ask them to introduce themselves to the whole class right away.',fb:'High-stakes sharing can increase anxiety.'}]],
 [{name:'Student',bg:'#d9f2e6',skin:'#a9744f',hair:'#222',shirt:'#2a9d8f',style:'curly'},'A student puts their head down and won’t start independent work.',[
  {t:'Quietly crouch at eye level, ask what feels hard, and offer a chunked start or a choice. Consider the calm corner.',ok:1,fb:'Private, respectful, and focused on removing the barrier.'},
  {t:'Announce the consequence for not working in front of the class.',fb:'Public consequences damage trust.'},
  {t:'Ignore the student; they’ll start when they’re ready.',fb:'Without support, the pattern repeats.'},
  {t:'Send the student to the office.',fb:'This removes the student from learning without understanding why.'}]]
 ].forEach(([a,s,o])=>{const w=el('div','scn');w.appendChild(el('div','av',avatar(a)));const r=el('div','');r.appendChild(el('div','bubble',s));r.firstChild.style.marginBottom='8px';mcq(r,{options:o,onCorrect:hit});w.appendChild(r);p.appendChild(w)})}},

{name:'Align Resources',build(p,ok){
 p.innerHTML=`<h2>Do your materials match your objective?</h2><div class="callout"><span>🎯</span><div><b>Objective:</b> Students will compare fractions with like numerators or denominators using models and explain their reasoning with math vocabulary.</div></div><p class="lead">Sort each resource: is it <b>aligned &amp; accessible</b>, <b>aligned but needs access changes</b>, or <b>not aligned</b>?</p>`;
 classify(p,{cats:[{id:'A',label:'Aligned & accessible'},{id:'C',label:'Aligned, needs access changes'},{id:'N',label:'Not aligned'}],onDone:ok,items:CARDS.map(c=>({t:c[0],cat:c[2],why:c[3]}))})}},

{name:'Resource Card Builder',build(p,ok){
 p.innerHTML=`<h2>Label and describe each resource</h2><p class="lead">CalTPA asks you to <b>label</b> each resource and give a <b>description and/or image</b>, and to explain how it supports learning. Build one resource card.</p>`;
 const R={strips:['Fraction strips',`<svg viewBox="0 0 200 90" role="img" aria-label="Fraction strips"><rect x="10" y="8" width="180" height="16" fill="#2f6fb5"/><g stroke="#fff" stroke-width="2"><rect x="10" y="30" width="90" height="16" fill="#2a9d8f"/><rect x="100" y="30" width="90" height="16" fill="#2a9d8f"/><rect x="10" y="52" width="45" height="16" fill="#e9a820"/><rect x="55" y="52" width="45" height="16" fill="#e9a820"/><rect x="100" y="52" width="45" height="16" fill="#e9a820"/><rect x="145" y="52" width="45" height="16" fill="#e9a820"/></g><text x="100" y="84" text-anchor="middle" font-size="9" fill="#52606d">1 · 1/2 · 1/4</text></svg>`],
 line:['Digital fraction number line',`<svg viewBox="0 0 200 90" role="img" aria-label="Fraction number line"><path d="M15 45H185" stroke="#1d3557" stroke-width="3"/><g stroke="#1d3557" stroke-width="2"><path d="M15 36v18M57 40v10M100 36v18M143 40v10M185 36v18"/></g><g font-size="10" fill="#1d3557" text-anchor="middle"><text x="15" y="70">0</text><text x="100" y="70">1/2</text><text x="185" y="70">1</text></g><circle cx="100" cy="45" r="7" fill="#e76f51"/><path d="M40 16h20v10l-6-4v-6" fill="none"/><g transform="translate(150 8)"><path d="M0 8h7l8-7v22l-8-7H0z" fill="#2f6fb5"/><path d="M19 7q5 5 0 10" stroke="#2f6fb5" stroke-width="2" fill="none"/></g></svg>`],
 frame:['Sentence-frame card',`<svg viewBox="0 0 200 90" role="img" aria-label="Sentence frame card"><rect x="14" y="10" width="172" height="62" rx="9" fill="#fff8e6" stroke="#e9a820" stroke-width="2"/><g font-size="11" fill="#7a5600" font-family="Segoe UI,Arial"><text x="26" y="34">____ is greater than</text><text x="26" y="52">____ because ____.</text></g><path d="M158 20l4 8 9 1-6 6 2 9-8-5-8 5 2-9-6-6 9-1z" fill="#e9a820"/></svg>`],
 book:['Picture book: sharing a pizza',`<svg viewBox="0 0 200 90" role="img" aria-label="Picture book with pizza"><path d="M20 14h72q8 0 8 8v52H28q-8 0-8-8z" fill="#2a9d8f"/><path d="M180 14h-72q-8 0-8 8v52h72q8 0 8-8z" fill="#7fd1c7"/><circle cx="60" cy="44" r="20" fill="#ffd54f"/><path d="M60 44V24M60 44L77 54M60 44L43 54" stroke="#e76f51" stroke-width="2.5"/><circle cx="54" cy="38" r="3" fill="#e76f51"/><circle cx="68" cy="48" r="3" fill="#e76f51"/><path d="M114 38h60M114 52h50M114 66h40" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`]};
 const form=el('div','card'),prev=el('div','card');const g=el('div','grid');g.style.cssText='grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start';
 const mk=(id,l,opts)=>`<div class="field"><label for="${id}">${l}</label><select id="${id}"><option value="">Choose…</option>${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>`;
 form.innerHTML=`<div class="field"><label for="rl">Label</label><input type="text" id="rl" value="Resource 1"></div>`+
  mk('rs','Resource',Object.entries(R).map(([k,v])=>[k,v[0]]))+
  mk('ru','How I will use it',[['a','Students compare two fractions, then check with the model.'],['b','Pairs rehearse their explanation orally before writing.'],['c','Whole-class launch to connect fractions to a real-life story.'],['x','Students keep it at their desk for the whole lesson.']])+
  mk('ra','Access feature for diverse learners',[['a','Visuals and hands-on models for every student'],['b','Home-language rehearsal and picture support'],['c','Audio and captions, with large, uncluttered layout'],['x','Same format for everyone; no changes']]);
 const fb=el('div','fb');form.appendChild(fb);
 const OKU={strips:'a',line:'a',frame:'b',book:'c'},OKA={strips:'a',line:'c',frame:'b',book:'a'};
 function upd(){const s=$('#rs',form).value,u=$('#ru',form),a=$('#ra',form);const ut=u.selectedOptions[0].text,at=a.selectedOptions[0].text;
  prev.innerHTML=`<div class="mini">Card preview</div><h3>${$('#rl',form).value||'Resource'} — ${s?R[s][0]:'(choose a resource)'}</h3><div style="background:#f3f6fa;border-radius:10px;padding:6px;min-height:92px">${s?R[s][1]:'<div class="mini" style="padding:30px;text-align:center">Image appears here</div>'}</div><p class="mini" style="margin:8px 0 2px"><b>Use:</b> ${u.value?ut:'—'}</p><p class="mini" style="margin:0"><b>Access:</b> ${a.value?at:'—'}</p>`;
  if(s&&u.value&&a.value){if(u.value==='x'||a.value==='x'){fb.className='fb show bad';fb.textContent='🔁 Revise: every resource needs a specific use and an access feature.'}
   else if(u.value!==OKU[s]||a.value!==OKA[s]){fb.className='fb show info';fb.textContent='Almost! Re-read your choices: does the use match what this resource does best, and does the access feature fit it?'}
   else{fb.className='fb show good';fb.innerHTML='✅ <b>A complete card:</b> label, image, purpose, and access. Do this for every resource, then save as a PDF.';ok()}}else fb.className='fb'}
 form.addEventListener('input',upd);form.addEventListener('change',upd);upd();g.appendChild(form);g.appendChild(prev);p.appendChild(g)}}
]});
</script></body></html>
