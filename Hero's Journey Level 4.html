/* Layout: persistent pixel-art scene on top, the hero walks the road as quests are cleared; game panel below. Single committed night-sky look. */
:root{
  --bg:#0d1030; --panel:#1f2562; --panel2:#2a3178; --line:#5560d6; --ink:#f4f5ff; --muted:#c4c9f7;
  --gold:#ffd24a; --gold-d:#d9a42a; --pink:#ff5d8f; --teal:#3ee0c1; --shade:#080a22;
  --exec:#a36bff; --infl:#ff9d3d; --rel:#4aa8ff; --strat:#3ee08f;
  --display:'Pixelify Sans','Courier New',monospace; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background-color:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55;
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:
    radial-gradient(1.5px 1.5px at 30px 40px,#fff9,transparent),
    radial-gradient(1.5px 1.5px at 130px 110px,#ffd24a99,transparent),
    radial-gradient(1px 1px at 200px 20px,#fff8,transparent),
    radial-gradient(1.5px 1.5px at 80px 190px,#fff7,transparent),
    radial-gradient(1px 1px at 230px 170px,#ffd24a88,transparent);
  background-size:260px 230px;
}
.wrap{max-width:960px;margin:0 auto;min-width:0}
h1,h2,h3,.px{font-family:var(--display);font-weight:700;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

.banner{border:4px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 0 var(--shade);background:#1b1d5e}
.banner svg{display:block;width:100%;height:auto}
#hero{transition:transform 1.4s cubic-bezier(.5,0,.3,1)}
#hero .bob{animation:bob 1.1s steps(2,end) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.mk polygon{fill:#8b93f0;transition:fill .4s}
.mk.done polygon{fill:var(--gold)}
@media (prefers-reduced-motion:reduce){#hero{transition:none}#hero .bob{animation:none}*{scroll-behavior:auto!important}}

.center{text-align:center}
.eyebrow{color:var(--teal);font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:.95rem;margin-top:28px}
.title{font-size:clamp(2.3rem,9vw,4.4rem);line-height:1.05;letter-spacing:.06em;color:#fff;text-transform:uppercase;
  text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--shade);margin:10px 0 18px;text-wrap:balance}
.level{color:var(--gold);font-size:clamp(1.2rem,4.4vw,1.9rem);letter-spacing:.1em;text-transform:uppercase;text-wrap:balance}
.lede{max-width:34em;margin:14px auto 26px;color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.08em;text-transform:uppercase;
  background:var(--gold);color:#1a1346;border:0;border-radius:14px;padding:14px 30px;box-shadow:0 6px 0 var(--gold-d);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover:not([aria-disabled="true"]){transform:translateY(-2px);box-shadow:0 8px 0 var(--gold-d)}
.btn:active:not([aria-disabled="true"]){transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d)}
.btn[aria-disabled="true"]{background:#59609f;color:#d3d6f6;box-shadow:0 6px 0 #3a4080;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--gold);border:3px solid var(--gold);box-shadow:0 5px 0 var(--shade);font-size:1.05rem;padding:11px 22px}

.panel{background:var(--panel);border:4px solid var(--line);border-radius:22px;padding:22px 24px;margin-top:28px;box-shadow:0 8px 0 var(--shade)}
.panel h3{color:var(--gold);font-size:1.15rem;letter-spacing:.06em;margin-bottom:14px}
.how{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.how li{display:flex;align-items:center;gap:14px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1a1346;font-family:var(--display);font-weight:700;display:grid;place-items:center}

.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px}
.hud .q{color:var(--teal);font-size:.95rem;letter-spacing:.14em;text-transform:uppercase}
.hud .xp{color:var(--gold);font-size:1rem;letter-spacing:.1em}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.segs i{height:10px;border-radius:3px;background:#303786}
.segs i.on{background:var(--gold)}
.segs i.now{background:var(--teal)}
.stage-title{font-size:clamp(1.5rem,5.4vw,2.3rem);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:3px 3px 0 var(--pink);margin-top:22px;text-wrap:balance}
.scene{max-width:46em;margin:12px 0 0}
.verse{margin:18px 0 0;padding:14px 18px;border:3px dashed #7b84e6;border-radius:14px;color:var(--muted);font-style:italic}
.verse b{display:block;font-style:normal;font-family:var(--display);color:var(--gold);letter-spacing:.06em;margin-top:6px;font-weight:700}
.label{font-family:var(--display);font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin:26px 0 12px;font-size:1.05rem}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}
.card{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:16px;
  box-shadow:0 6px 0 var(--shade);cursor:pointer;min-width:0;transition:transform .1s,border-color .1s,background .1s}
.card:hover{transform:translateY(-3px);background:var(--panel2)}
.card[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2);box-shadow:0 6px 0 var(--gold-d)}
.badge{flex:none;width:34px;height:34px;border-radius:10px;background:var(--gold);color:#1a1346;font-family:var(--display);font-weight:700;display:grid;place-items:center}
.card h4{margin:0 0 4px;font-family:var(--display);font-size:1.12rem;letter-spacing:.04em;color:#fff}
.card p{margin:0;color:var(--muted);font-size:.97rem}
.card .body{min-width:0}

.result{margin-top:26px;background:#162052;border:3px solid var(--teal);border-radius:16px;padding:16px 20px}
.result h3{color:var(--teal);font-size:1rem;letter-spacing:.14em;margin-bottom:6px}
.result p{margin:0 0 8px}
.result p:last-child{margin:0}

fieldset{border:0;margin:24px 0 0;padding:0;min-width:0}
legend{padding:0;font-weight:800;margin-bottom:12px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer;box-shadow:0 4px 0 var(--shade);text-align:left;transition:transform .1s}
.opt:hover{background:var(--panel2);transform:translateY(-2px)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2);box-shadow:0 4px 0 var(--gold-d);color:#fff}
.opt[aria-pressed="true"]::before{content:"\2713\00a0";color:var(--gold);font-weight:800}
.dgroup{margin-bottom:14px}
.dgroup .dn{font-family:var(--display);font-weight:700;letter-spacing:.08em;font-size:.95rem;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dgroup .dn::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.chip{padding:7px 12px;font-size:.95rem;border-radius:10px}
.chip[aria-pressed="true"]{border-color:var(--c)}
.count{color:var(--muted);font-size:.95rem;margin-top:4px}
.nav{display:flex;justify-content:center;margin-top:34px}
.hint{color:var(--muted);text-align:center;margin-top:12px;font-size:.95rem;min-height:1.5em}

.complete{font-size:clamp(1.8rem,7vw,3.2rem);color:var(--gold);letter-spacing:.08em;text-transform:uppercase;text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--shade);margin:26px 0 8px;animation:pop .6s steps(6,end) both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.complete{animation:none}}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin:0}
.sheet div{background:#181e57;border:3px solid #3b43a4;border-radius:14px;padding:12px 14px;min-width:0}
.sheet dt{font-family:var(--display);font-weight:700;color:var(--teal);letter-spacing:.1em;font-size:.82rem;text-transform:uppercase;margin-bottom:2px}
.sheet dd{margin:0;overflow-wrap:anywhere}
.skills{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.skills li{display:flex;gap:10px;align-items:flex-start}
.skills li::before{content:"\2605";color:var(--gold)}
.note{margin-top:28px;background:var(--gold);color:#1a1346;border-radius:18px;padding:18px 22px;box-shadow:0 6px 0 var(--gold-d);font-weight:800}
.note .px{display:block;letter-spacing:.1em;font-size:.9rem;margin-bottom:4px;text-transform:uppercase}
.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:26px}
textarea.copybox{width:100%;margin-top:14px;min-height:150px;background:#0f1445;color:var(--ink);border:3px solid var(--line);border-radius:12px;padding:12px;font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

function placeScene(){
  var road=document.getElementById("road"),hero=document.getElementById("hero");if(!road||!hero)return;
  var len=road.getTotalLength();
  var marks=document.getElementById("marks");
  if(!marks.children.length){
    var h="";QEND.forEach(function(d){var pt=road.getPointAtLength(len*pOf(d));h+='<g class="mk" data-d="'+d+'" transform="translate('+pt.x.toFixed(1)+','+(pt.y-16).toFixed(1)+')"><rect x="-1.5" y="-4" width="3" height="20" fill="#c9c6f0"/><polygon points="'+starPts(0,-8,9)+'"/></g>';});
    marks.innerHTML=h;
  }
  Array.prototype.forEach.call(marks.children,function(m){m.classList.toggle("done",S.done>=Number(m.getAttribute("data-d")));});
  var p=S.screen==="end"?0.96:(S.screen==="start"?0.03:pOf(S.done));
  var pt=road.getPointAtLength(len*p);
  hero.style.transform="translate("+pt.x.toFixed(1)+"px,"+(pt.y+4).toFixed(1)+"px)";
}

/* ---------- rendering ---------- */
function stepComplete(i){
  var st=STEPS[i];if(S.pick[i]==null)return false;
  var a=S.ans[i]||{};
  for(var k=0;k<st.questions.length;k++){var q=st.questions[k];
    if(a[q.id]==null)return false;}
  return true;
}
function hud(i){
  var st=STEPS[i],segs="";
  for(var k=0;k<STEPS.length;k++){segs+='<i class="'+(k<S.done?"on":(k===i?"now":""))+'"></i>';}
  return '<div class="hud"><span class="px q">Quest '+st.quest+' of 4'+(st.round?' &middot; '+esc(st.round):'')+'</span><span class="px xp">XP '+S.xp+'</span></div><div class="segs" aria-hidden="true">'+segs+'</div>';
}
function renderStart(){
  return '<div class="center"><div class="px eyebrow">ISTU 101</div><h1 class="title">Hero’s Journey</h1>'+
  '<h2 class="px level">Level 4: Discover Your Tools</h2>'+
  '<p class="lede">You have accepted the call, prepared for the journey, and gathered your allies. Now open your pack and see the gifts you have been carrying all along, and what it means to use them wisely for yourself and for others.</p>'+
  '<button class="btn" data-act="start" data-k="start"><span aria-hidden="true">&#9654;</span> Press Start</button></div>'+
  '<section class="panel"><h3>How to play</h3><ol class="how">'+
  '<li><span class="num">1</span><span>Tap or click a card to make your choice.</span></li>'+
  '<li><span class="num">2</span><span>Answer a few short questions about your choice.</span></li>'+
  '<li><span class="num">3</span><span>Press the yellow button to keep going.</span></li>'+
  '<li><span class="num">4</span><span>There are no wrong answers. This level takes about 10 minutes.</span></li></ol></section>';
}
function renderStep(i){
  var st=STEPS[i],a=S.ans[i]||{},h=hud(i);
  h+='<h2 class="stage-title">'+esc(st.name)+'</h2><p class="scene">'+esc(st.scene)+'</p>';
  if(st.verse)h+='<blockquote class="verse">“'+esc(st.verse.t)+'”<b>'+esc(st.verse.r)+'</b></blockquote>';
  h+='<div class="label">'+esc(st.cardsLabel)+'</div><div class="grid">';
  st.cards.forEach(function(c,n){
    var on=S.pick[i]===c.id;
    var bs=c.color?' style="background:'+c.color+';color:#140f35"':'';
    h+='<button class="card" data-act="card" data-k="card-'+c.id+'" data-id="'+c.id+'" aria-pressed="'+on+'"><span class="badge"'+bs+'>'+"ABCD".charAt(n)+'</span><span class="body"><h4>'+esc(c.title)+'</h4><p>'+esc(c.text)+'</p></span></button>';
  });
  h+='</div>';
  if(S.pick[i]!=null){
    var card=st.cards.filter(function(c){return c.id===S.pick[i];})[0],lines;
    lines=st.feedback(card);
    h+='<section class="result" id="result" aria-live="polite"><h3>RESULT</h3>'+lines.map(function(l){return '<p>'+esc(l)+'</p>';}).join("")+'</section>';
    st.questions.forEach(function(q){
      h+='<fieldset><legend>'+esc(q.q)+'</legend>';
      h+='<div class="opts">';
      q.options.forEach(function(o,n){h+='<button class="opt" data-act="opt" data-k="o-'+q.id+'-'+n+'" data-q="'+q.id+'" data-v="'+esc(o)+'" aria-pressed="'+(a[q.id]===o)+'">'+esc(o)+'</button>';});
      h+='</div></fieldset>';
    });
  }
  var ok=stepComplete(i),last=i===STEPS.length-1;
  h+='<div class="nav"><button class="btn" data-act="next" data-k="next" aria-disabled="'+(!ok)+'">'+(last?'Finish Level':'Keep Going')+' <span aria-hidden="true">&#9654;</span></button></div>';
  h+='<div class="hint" id="hint">'+(ok?'':(S.pick[i]==null?'Pick a card to continue.':'Answer the questions above to continue.'))+'</div>';
  return h;
}
function dd(i,key){return (S.ans[i]&&S.ans[i][key])||"Not chosen";}
function pickTitle(i){var st=STEPS[i];var c=st.cards.filter(function(x){return x.id===S.pick[i];})[0];return c?c.title:"Not chosen";}
function summaryRows(){
  return [
   ["What filled my pack",pickTitle(0)],
   ["How I see college",dd(0,"college")],
   ["Most thankful for",dd(0,"thanks")],
   ["Servant I relate to",pickTitle(1)],
   ["What holds me back",dd(1,"hold")],
   ["What would help",dd(1,"help")],
   ["First ally I will call",pickTitle(2)],
   ["What I will ask for",dd(2,"ask")],
   ["What I can offer back",dd(2,"offer")],
   ["Where I will invest",pickTitle(3)],
   ["What I will offer",dd(3,"offer")],
   ["My step this week",dd(3,"step")],
   ["Why I will invest it",dd(3,"why")]
  ];
}
function renderEnd(){
  var rows=summaryRows(),h='<div class="center"><div class="px eyebrow">ISTU 101 &middot; Level 4</div><h2 class="complete">Level Complete!</h2>'+
  '<p class="lede">You opened your pack, walked through the parable, called on your allies, and chose where to invest what you have been given. XP earned: '+S.xp+'.</p></div>';
  h+='<section class="panel"><h3>Your hero’s pack</h3><dl class="sheet">'+rows.map(function(r){return '<div><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>';}).join("")+'</dl></section>';
  h+='<section class="panel"><h3>Skills unlocked</h3><ul class="skills">'+SKILLS.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ul></section>';
  h+='<div class="note"><span class="px">Next Mission</span>Keep these reflections close. You will use what you learned here and put it into the assignment titled “Level Up Project.”</div>';
  h+='<div class="actions"><button class="btn ghost" data-act="copy" data-k="copy">Copy my answers</button><button class="btn ghost" data-act="restart" data-k="restart">Play again</button></div>';
  h+='<div class="hint" id="hint" role="status"></div><div id="copyarea"></div>';
  return h;
}
function render(focusKey){
  var el=document.getElementById("screen"),html;
  if(S.screen==="start")html=renderStart();
  else if(S.screen==="end")html=renderEnd();
  else html=renderStep(S.screen);
  el.innerHTML=html;
  placeScene();
  if(focusKey){var f=el.querySelector('[data-k="'+focusKey.replace(/"/g,'\\"')+'"]');if(f)f.focus({preventScroll:true});}
}
function toTop(){window.scrollTo({top:0,behavior:reduced()?"auto":"smooth"});}

/* ---------- actions ---------- */
function toastHint(t){var h=document.getElementById("hint");if(h)h.textContent=t;}
function copyText(){
  var rows=summaryRows();
  return "My Hero's Journey reflections (ISTU 101, Level 4)\n\n"+rows.map(function(r){return r[0]+": "+r[1];}).join("\n");
}
function fallbackCopy(txt){
  var area=document.getElementById("copyarea");
  area.innerHTML='<textarea class="copybox" id="cb" readonly aria-label="Your reflections text"></textarea>';
  var ta=document.getElementById("cb");ta.value=txt;ta.focus();ta.select();
  toastHint("Select the text below and copy it with Ctrl+C or Cmd+C.");
}
document.getElementById("screen").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act"),i=S.screen,key=b.getAttribute("data-k");
  if(act==="start"){S.screen=0;render();toTop();return;}
  if(act==="restart"){S=fresh();render();toTop();return;}
  if(act==="copy"){
    var txt=copyText();
    try{navigator.clipboard.writeText(txt).then(function(){toastHint("Copied. Paste it into your notes.");},function(){fallbackCopy(txt);});}
    catch(err){fallbackCopy(txt);}
    return;
  }
  if(typeof i!=="number")return;
  if(act==="card"){
    var id=b.getAttribute("data-id"),first=S.pick[i]==null;
    S.pick[i]=id;
    render(key);
    if(first){var r=document.getElementById("result");if(r)r.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"nearest"});}
    return;
  }
  if(act==="opt"){
    S.ans[i]=S.ans[i]||{};S.ans[i][b.getAttribute("data-q")]=b.getAttribute("data-v");render(key);return;
  }
  if(act==="next"){
    if(!stepComplete(i)){toastHint(S.pick[i]==null?"Pick a card to continue.":"Answer the questions above to continue.");return;}
    S.xp=Math.max(S.xp,(i+1)*150);S.done=Math.max(S.done,i+1);
    S.screen=(i+1>=STEPS.length)?"end":i+1;
    render();toTop();return;
  }
});

buildBanner();render();
})();
</script>

</body></html>
