<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSYC 510 Week 6: Ethics &amp; Faith in Assessment</title>
<style>
:root{--red:#d34147;--red-d:#a8353a;--sand:#edebe8;--ink:#2b2b2b;--mut:#5b5b5b;--ok:#1d7a4d;--okbg:#e6f4ec;--bad:#a8353a;--badbg:#fbeaea;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#fff}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:15px}
.app{height:100%;overflow-y:auto;overflow-x:hidden;padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--sand);padding-bottom:6px}
header .ico{flex:0 0 44px;width:44px;height:44px}
.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red-d);font-weight:700}
h1{font-size:1.35rem;margin:0;line-height:1.2}
.sub{margin:2px 0 0;color:var(--mut);font-size:.92rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;border:2px solid var(--sand);background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.tab:hover{border-color:var(--red)}
button:focus-visible{outline:3px solid #1a4fd6;outline-offset:2px}
.panel{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:12px;background:var(--sand);border-radius:18px;padding:10px}
.panel[hidden]{display:none}
.gfx{background:#fff;border-radius:14px;padding:8px;display:flex;align-items:center;justify-content:center;min-height:0}
.gfx svg{width:100%;height:auto;max-height:100%;display:block}
.qa{background:#fff;border-radius:14px;padding:10px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.intro{font-size:.9rem;color:var(--mut);margin:0}
.count{font-size:.8rem;font-weight:700;color:var(--red-d);text-transform:uppercase;letter-spacing:.05em}
.bar{height:6px;background:var(--sand);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--red);transition:width .3s}
.q{font-size:1rem;font-weight:600;margin:2px 0}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{font:inherit;text-align:left;background:#fcfcfc;border:2px solid #ddd;border-left:6px solid var(--red);border-radius:12px;padding:6px 12px;cursor:pointer;min-height:42px;color:var(--ink)}
.opt:hover:not(:disabled){background:#fff5f5;border-color:var(--red)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok);border-left-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{min-height:0;font-size:.95rem}
.fb .box{border-radius:12px;padding:7px 12px;font-size:.9rem}
.fb .ok{background:var(--okbg);border-left:6px solid var(--ok)}
.fb .no{background:var(--badbg);border-left:6px solid var(--bad)}
.nav{margin-top:auto;display:flex;justify-content:flex-end;min-height:44px}
.btn{font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:999px;padding:8px 22px;cursor:pointer;min-height:44px}
.btn:hover{background:var(--red-d)}
.btn[hidden]{display:none}
.done{text-align:center;padding:10px}
.done .score{font-size:2.2rem;font-weight:800;color:var(--red-d)}
.note{font-size:.78rem;color:var(--mut);margin:0}
@media (max-width:680px){.panel{grid-template-columns:1fr}.gfx svg{max-height:200px}h1{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header><svg class="ico" viewBox="0 0 52 52" role="img" aria-label="Open book with a cross"><path d="M4 14q11-5 22 2v28q-11-7-22-2z" fill="#edebe8" stroke="#d34147" stroke-width="2.5"/><path d="M48 14q-11-5-22 2v28q11-7 22-2z" fill="#fff" stroke="#d34147" stroke-width="2.5"/><path d="M26 2v14M20 7h12" stroke="#a8353a" stroke-width="4" stroke-linecap="round"/></svg><div><div class="kicker">PSYC 510 &middot; Week 6 Interactive</div><h1>Ethics &amp; Faith in Assessment</h1><p class="sub">Apply the APA General Principles to real situations, then connect them to scripture.</p></div></header>
<div class="tabs" role="tablist" aria-label="Activities"><button type="button" role="tab" class="tab" aria-selected="false">Which Principle?</button><button type="button" role="tab" class="tab" aria-selected="false">Connect to Scripture</button></div>
<section class="panel" id="p1" role="tabpanel"><div class="gfx"></div><div class="qa"></div></section><section class="panel" id="p2" role="tabpanel"><div class="gfx"></div><div class="qa"></div></section>
</div>
<script>
function Quiz(root, items, o){
  o=o||{}; var i=0, score=0, picks=[], answered=false;
  var gfx=root.querySelector('.gfx'), qa=root.querySelector('.qa');
  function esc(s){return s}
  function draw(ans, it){ gfx.innerHTML = o.gfx ? o.gfx(i,picks,ans,it) : it.svg; }
  function render(){
    answered=false; var it=items[i]; draw(false,it);
    var opts=it.opts.map(function(t,k){return '<button type="button" class="opt" data-k="'+k+'">'+t+'</button>';}).join('');
    qa.innerHTML=(o.intro?'<p class="intro">'+o.intro+'</p>':'')+
      '<div class="count">'+(o.label||'Question')+' '+(i+1)+' of '+items.length+'</div>'+
      '<div class="bar" aria-hidden="true"><span style="width:'+(i/items.length*100)+'%"></span></div>'+
      '<p class="q">'+it.q+'</p><div class="opts">'+opts+'</div>'+
      '<div class="fb" aria-live="polite"></div>'+
      '<div class="nav"><button type="button" class="btn next" hidden>'+(i<items.length-1?'Next':'See results')+'</button></div>';
  }
  function finish(){
    gfx.innerHTML = o.doneGfx ? o.doneGfx() : (o.gfx? o.gfx(items.length-1,picks,true,items[items.length-1]):'');
    var pct=Math.round(score/items.length*100);
    var msg = pct===100 ? (o.perfect||'Excellent work.') : pct>=60 ? 'Good progress. Review the explanations and try again for a perfect round.' : 'Worth another pass. Read each explanation, then restart.';
    qa.innerHTML='<div class="done"><div class="count">Results</div><div class="score">'+score+' / '+items.length+'</div><p>'+msg+'</p><button type="button" class="btn restart">Try again</button></div>';
    qa.querySelector('.restart').focus();
  }
  qa.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.classList.contains('restart')){i=0;score=0;picks=[];render();return;}
    if(b.classList.contains('next')){ if(i<items.length-1){i++;render();qa.querySelector('.opt').focus();} else finish(); return;}
    if(b.classList.contains('opt') && !answered){
      answered=true; var it=items[i], k=+b.dataset.k, ok=(k===it.ans); if(ok) score++; picks[i]=k;
      qa.querySelectorAll('.opt').forEach(function(x){x.disabled=true; if(+x.dataset.k===it.ans) x.classList.add('right');});
      if(!ok) b.classList.add('wrong');
      qa.querySelector('.fb').innerHTML='<div class="box '+(ok?'ok':'no')+'"><strong>'+(ok?'Correct. ':'Not quite. ')+'</strong>'+it.why+'</div>';
      var n=qa.querySelector('.next'); n.hidden=false; n.focus(); draw(true,it);
    }
  });
  render();
}
function initTabs(){
  var tabs=[].slice.call(document.querySelectorAll('.tab')), panels=[].slice.call(document.querySelectorAll('.panel'));
  function sel(n){tabs.forEach(function(t,k){t.setAttribute('aria-selected',k===n);t.tabIndex=k===n?0:-1;});panels.forEach(function(p,k){p.hidden=k!==n;});}
  tabs.forEach(function(t,k){t.addEventListener('click',function(){sel(k);});
    t.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){var n=(k+d+tabs.length)%tabs.length;sel(n);tabs[n].focus();}});});
  sel(0);
}

(function(){
var P=["Beneficence and Nonmaleficence","Fidelity and Responsibility","Integrity","Justice","Respect for People’s Rights and Dignity"];
function pillars(hl){
  var N=['Benefi-','Fidelity','Integrity','Justice','Dignity'], s='<svg viewBox="0 0 260 300" role="img" aria-label="Five pillars representing the APA General Principles under a roof with a cross">';
  s+='<path d="M10 90L130 36L250 90z" fill="#edebe8" stroke="#a8353a" stroke-width="3"/><path d="M130 4v28M118 14h24" stroke="#d34147" stroke-width="5" stroke-linecap="round"/>';
  for(var k=0;k<5;k++){var x=24+k*46, on=(hl===k);
    s+='<rect x="'+x+'" y="98" width="34" height="150" rx="5" fill="'+(on?'#d34147':'#fff')+'" stroke="#a8353a" stroke-width="'+(on?4:2.5)+'"/>';
    s+='<text transform="translate('+(x+22)+',236) rotate(-90)" font-size="13" font-weight="700" fill="'+(on?'#fff':'#2b2b2b')+'">'+['Beneficence','Fidelity','Integrity','Justice','Dignity'][k]+'</text>';}
  s+='<rect x="10" y="252" width="240" height="14" rx="4" fill="#a8353a"/><text x="130" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#2b2b2b">APA General Principles</text>';
  return s+'</svg>';
}
Quiz(document.getElementById('p1'),[
 {q:"A psychologist weighs the benefits of a long, distressing test against the risk of harm to the client and adds safeguards.",opts:P,ans:0,why:"Maximizing benefit while avoiding harm is Beneficence and Nonmaleficence."},
 {q:"You report results exactly as found, even though the client hopes for a different outcome, and you do not overstate what a score means.",opts:P,ans:2,why:"Honest, accurate reporting is Integrity."},
 {q:"The client gives informed consent, understands how results will be used, and their private information is protected.",opts:P,ans:4,why:"Consent and confidentiality honor Respect for People’s Rights and Dignity (see the Section 9 standards on informed consent)."},
 {q:"You make sure people from all backgrounds get fair access to sound assessments and you stay alert to your own biases and the limits of your competence.",opts:P,ans:3,why:"Fair access and awareness of bias reflect Justice."},
 {q:"In a pastoral care setting you are clear about your role, keep your professional commitments, and refer a young person to a clinical professional when needed.",opts:P,ans:1,why:"Clear roles, trustworthy conduct, and appropriate referral reflect Fidelity and Responsibility."}
],{label:'Scenario',intro:'Name the APA General Principle most at stake in each situation.',gfx:function(i,p,a,it){return pillars(a?it.ans:-1);},perfect:'You can connect everyday decisions to the APA General Principles.'});
function book(show){
  var s='<svg viewBox="0 0 260 300" role="img" aria-label="Open Bible with a cross above it">';
  s+='<path d="M130 10v50M108 28h44" stroke="#d34147" stroke-width="9" stroke-linecap="round"/>';
  s+='<path d="M20 90q55-24 110 10v170q-55-34-110-10z" fill="#edebe8" stroke="#a8353a" stroke-width="3"/><path d="M240 90q-55-24-110 10v170q55-34 110-10z" fill="#fff" stroke="#a8353a" stroke-width="3"/>';
  for(var k=0;k<6;k++){s+='<rect x="'+(38)+'" y="'+(122+k*20)+'" width="'+(70-k*2)+'" height="6" rx="3" fill="'+(show&&k===2?'#d34147':'#d9d4cd')+'"/><rect x="'+(150)+'" y="'+(122+k*20)+'" width="'+(70-(k%3)*6)+'" height="6" rx="3" fill="#d9d4cd"/>';}
  return s+'</svg>';
}
var V=["Matthew 22:39: “Love your neighbor as yourself.”","Matthew 5:6: “Blessed are those who hunger and thirst for righteousness, for they will be filled.”","Matthew 5:7: “Blessed are the merciful, for they will be shown mercy.”","Matthew 5:8: “Blessed are the pure in heart, for they will see God.”"];
Quiz(document.getElementById('p2'),[
 {q:"Which passage connects most strongly to <strong>Respect for People’s Rights and Dignity</strong>?",opts:V,ans:0,why:"Loving your neighbor as yourself asks you to treat the person being assessed with the dignity you would want for yourself."},
 {q:"Which passage connects most strongly to <strong>Beneficence</strong> (promoting the person’s well-being)?",opts:V,ans:2,why:"Mercy points toward compassionate care. Care that actively seeks the person’s good is the heart of beneficence."},
 {q:"Which passage connects most strongly to <strong>Justice</strong> (fair, equitable treatment)?",opts:V,ans:1,why:"A hunger for righteousness can describe a commitment to fairness and to making things right for people who are overlooked."},
 {q:"Which passage connects most strongly to <strong>Integrity</strong> (honesty and accuracy)?",opts:V,ans:3,why:"Purity of heart suggests undivided, honest motives, which is what accurate and truthful reporting requires."}
],{label:'Connection',intro:'Strong connections can differ between thoughtful readers. Here is one well-supported fit; in Part 2 you explain yours in your own words.',gfx:function(i,p,a){return book(a);},perfect:'Good work. Remember to tie one principle from your chosen code to scripture and explain why.'});
})();
initTabs();
</script>
</body>
</html>
