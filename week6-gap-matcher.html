<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 6 Gap Matcher</title>
<style>
:root{--red:#d34147;--dred:#a8353a;--beige:#edebe8;--paper:#fcfcfc;--ink:#222;--card:#fff;--line:#e3e0dc;--mut:#5b5b5b;--ok:#2e7d5b;--blue:#2f5d8a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--beige:#2a2827;--paper:#201f1e;--ink:#f1efec;--card:#2e2c2b;--line:#47423f;--mut:#bdb7b1;--red:#e5575d;--dred:#f08a8e;--ok:#5fc596;--blue:#7fb0e0}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;background:transparent;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink)}
.app{background:var(--beige);border-radius:20px;padding:14px;width:100%}
.inner{background:var(--card);border-radius:16px;padding:18px 22px;min-height:520px;display:flex;flex-direction:column}
.bar{width:100px;height:6px;background:var(--red);border-radius:5px;margin-bottom:8px}
h1{font-size:21px;margin:0 0 2px;color:var(--ink)}
.sub{margin:0 0 12px;color:var(--mut);font-size:14px;line-height:1.4}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 20px;background:var(--red);color:#fff;cursor:pointer;transition:transform .12s,background .12s}
.btn:hover{background:var(--dred);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--red);border:2px solid var(--red)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.tool:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 280px;min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:14px;padding:12px 16px}
.fb{font-size:14px;line-height:1.45;margin:8px 0 0}
.good{color:var(--ok);font-weight:600}.bad{color:var(--dred);font-weight:600}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.prog>i{display:block;height:100%;background:var(--red);width:0;transition:width .35s}
.foot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hide{display:none!important}
svg{max-width:100%;height:auto;display:block}
@media (max-width:700px){html,body{overflow-y:auto}}
@media (max-width:560px){.inner{padding:14px}h1{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.bridge{margin:4px 0 8px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink);font-size:14px;line-height:1.4;transition:border-color .12s}
.opt:hover:not([disabled]){border-color:var(--red)}
.opt.right{border-color:var(--ok);background:rgba(46,125,91,.14)}
.opt.wrong{border-color:var(--red);background:rgba(211,65,71,.12)}
.plan{display:grid;gap:8px;margin:8px 0}
.plan .card{border-left-color:var(--ok)}
.plan b{color:var(--dred)}
</style></head>
<body><div class="app"><div class="inner">

<div class="bar"></div>
<h1>Week 6 | Link Every Gap to a Recommendation</h1>
<p class="sub">Client: <b>Greenleaf Yoga Studio</b>. A strong plan connects a gap to a tactic and gives the reason. Choose the best recommendation for each gap.</p>
<div id="stage">
 <div class="sub" id="cnt" style="margin:0"></div><div class="prog"><i id="pb"></i></div>
 <svg class="bridge" id="br" viewBox="0 0 640 110" role="img" aria-label="Diagram: current state, gap, and objective"></svg>
 <div class="opts" id="opts"></div>
 <p class="fb" id="fb" aria-live="polite"></p>
</div>
<div id="done" class="hide">
 <h2 style="margin:0 0 4px;font-size:18px">Your Integrated Plan Outline</h2>
 <div class="plan" id="plan"></div>
 <div class="sub" id="sc"></div>
</div>
<div class="foot"><span class="sub" style="margin:0">Next: add evidence from your interview and a credible source to each one.</span>
<span><button class="btn ghost hide" id="again">Restart</button> <button class="btn" id="nx" disabled>Next gap</button></span></div>

</div></div>
<script>
(function(){
  function send(){var h=document.documentElement.scrollHeight||document.body.scrollHeight;
    try{parent.postMessage({type:'dmkt-iframe-height',height:Math.ceil(h)},'*')}catch(e){}}
  window.addEventListener('load',send);window.addEventListener('resize',send);
  if(window.ResizeObserver){new ResizeObserver(send).observe(document.body)}
  window.__sendHeight=send;
})();
</script>
<script>
var G=[
{obj:'Grow new-member trials 20%',cur:'No online booking; phone calls only',opts:[
 ['Add online class booking with a free-trial offer on the website','Right. It removes friction and directly serves the objective.',1],
 ['Run a giveaway of branded water bottles','A giveaway might raise attention but does not close the booking gap.',0],
 ['Redesign the logo','Branding is not what blocks trial sign-ups here.',0]]},
{obj:'Increase repeat attendance',cur:'No contact with members after a class',opts:[
 ['Buy billboard ads across the city','Awareness tactic. The gap is retention, not reach.',0],
 ['Launch a welcome and follow-up email series with class reminders','Right. Email is low cost and builds loyalty with existing members.',1],
 ['Triple the PPC budget','Paid ads acquire new people but do not fix repeat attendance.',0]]},
{obj:'Be found by locals searching "yoga near me"',cur:'Google profile unclaimed; website has no local keywords',opts:[
 ['Post daily dance videos on social media','Social builds reach but does not fix local search visibility.',0],
 ['Send a monthly print flyer','Offline and hard to measure for this objective.',0],
 ['Claim the Google Business Profile and optimize pages for local SEO','Right. It addresses the exact gap affordably.',1]]}];
var i=0,sc=0,locked=false,choice=[];
function $(id){return document.getElementById(id)}
function bridge(g,state){var c=state==='ok'?'#2e7d5b':'#d34147';
 var s='<g font-family="Segoe UI,Arial" font-size="12">';
 s+='<rect x="8" y="22" width="190" height="62" rx="12" fill="#edebe8" stroke="#a8353a" stroke-width="2"/><text x="18" y="42" font-weight="700" fill="#a8353a">WHERE THEY ARE</text><foreignObject x="14" y="46" width="180" height="38"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#222;line-height:1.2">'+g.cur+'</div></foreignObject>';
 s+='<rect x="442" y="22" width="190" height="62" rx="12" fill="#edebe8" stroke="#2f5d8a" stroke-width="2"/><text x="452" y="42" font-weight="700" fill="#2f5d8a">WHERE THEY WANT TO BE</text><foreignObject x="448" y="46" width="180" height="38"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#222;line-height:1.2">'+g.obj+'</div></foreignObject>';
 s+='<path d="M198 56 Q320 '+(state==='ok'?'10':'100')+' 442 56" fill="none" stroke="'+c+'" stroke-width="4" stroke-dasharray="'+(state==='ok'?'0':'8 6')+'" stroke-linecap="round"/>';
 s+='<text x="320" y="'+(state==='ok'?'34':'104')+'" text-anchor="middle" font-weight="700" fill="'+c+'">'+(state==='ok'?'Gap bridged':'THE GAP')+'</text></g>';
 $('br').innerHTML=s}
function load(){locked=false;var g=G[i];$('cnt').textContent='Gap '+(i+1)+' of '+G.length;$('pb').style.width=(i/G.length*100)+'%';
 bridge(g,'gap');$('fb').textContent='';$('nx').disabled=true;
 var o=g.opts.map(function(x,k){return {t:x[0],f:x[1],r:x[2]}});
 o=o.sort(function(){return Math.random()-.5});
 $('opts').innerHTML=o.map(function(x,k){return '<button class="opt" data-k="'+k+'">'+x.t+'</button>'}).join('');
 document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
  if(locked)return;var x=o[+b.getAttribute('data-k')];
  if(x.r){locked=true;b.classList.add('right');if(!b.dataset.w)sc++;choice.push(x.t);
   $('fb').innerHTML='<span class="good">'+x.f+'</span>';bridge(g,'ok');$('nx').disabled=false;$('nx').textContent=i===G.length-1?'See my plan':'Next gap'}
  else{b.classList.add('wrong');b.disabled=true;window.__w=true;$('fb').innerHTML='<span class="bad">Not the best fit.</span> '+x.f+' Try another.'}
  window.__sendHeight&&window.__sendHeight()}})
 ;window.__sendHeight&&window.__sendHeight()}
$('nx').onclick=function(){i++;if(i>=G.length)finish();else load()};
function finish(){$('stage').classList.add('hide');$('done').classList.remove('hide');$('nx').classList.add('hide');$('again').classList.remove('hide');
 $('plan').innerHTML=G.map(function(g,k){return '<div class="card"><b>Gap:</b> '+g.cur+'<br><b>Objective:</b> '+g.obj+'<br><b>Recommendation:</b> '+choice[k]+'</div>'}).join('');
 $('sc').textContent='You matched all three gaps. Each one now has a clear rationale to support in Capstone Project Part 4.';window.__sendHeight&&window.__sendHeight()}
$('again').onclick=function(){i=0;sc=0;choice=[];$('done').classList.add('hide');$('stage').classList.remove('hide');$('nx').classList.remove('hide');$('again').classList.add('hide');load()};
load();
</script>
</body></html>
