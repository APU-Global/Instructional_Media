<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISTU 101 | Week 5: Learning with Integrity</title>
<style>:root{--ink:#1f2a30;--bg:#f5f6f2;--card:#fff;--line:#d8ddd2;--muted:#56626a;--green:#8dc63f;--green-d:#4a7608;--green-t:#ebf5d9;--red:#a8343c;--red-t:#f8e4e5;--char:#263238;--amber:#b86e00;--amber-t:#fbefd9;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--ink:#e9eef0;--bg:#141a1d;--card:#1e272c;--line:#34424a;--muted:#a3b0b7;--green-d:#a9d95f;--green-t:#26341a;--red:#ee8a92;--red-t:#3a2124;--amber:#f0b25a;--amber-t:#3a2d17;--shadow:none}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.hdr{background:var(--char);color:#fff;border-bottom:4px solid var(--green);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.hdr h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.2px;flex:1 1 260px}
.hdr h1 small{display:block;font-weight:500;font-size:.8rem;color:#c9d3d8}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid #5b6b73;background:transparent;color:#e6ecef;border-radius:99px;padding:4px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.steps button[aria-current=step]{background:var(--green);border-color:var(--green);color:#1b2a05;font-weight:700}
.steps button.done:not([aria-current]){border-color:var(--green);color:#d6efb0}
.steps button:focus-visible,.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.cell:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,svg [role=button]:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
main{flex:1;min-height:0;overflow-y:auto;padding:16px;scrollbar-gutter:stable}
.wrap{max-width:980px;margin:0 auto}
h2{margin:0 0 4px;font-size:1.3rem}
.lead{margin:0 0 14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--green-d)}
.btn.primary{background:var(--green);border-color:var(--green);color:#1b2a05}
.btn.primary:hover{filter:brightness(.95)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--green-d);background:var(--green-t);font-weight:700}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;margin:0 0 8px}
.opt:hover:not([disabled]){border-color:var(--green-d)}
.opt.right{border-color:var(--green-d);background:var(--green-t)}
.opt.wrong{border-color:var(--red);background:var(--red-t)}
.fb{border-left:5px solid var(--muted);background:var(--bg);border-radius:8px;padding:10px 14px;margin-top:8px}
.fb.ok{border-color:var(--green-d);background:var(--green-t)}
.fb.no{border-color:var(--red);background:var(--red-t)}
.fb.tip{border-color:var(--amber);background:var(--amber-t)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);transition:width .3s}
label{font-weight:600;display:block;margin:10px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:var(--card);color:var(--ink)}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--green-d);font-weight:800}
.muted{color:var(--muted)}
svg text{font-family:inherit}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.spec{width:100%;height:auto;display:block}
.hl{border:0;border-bottom:3px solid var(--amber);background:var(--amber-t);color:inherit;font:inherit;padding:0 3px;border-radius:3px;cursor:pointer}
.hl.seen{border-bottom-color:var(--green-d);background:var(--green-t)}
.hl[aria-pressed=true]{outline:3px solid #2f7de1}
.doc{font-family:Georgia,"Times New Roman",serif;font-size:1.05rem;line-height:1.9}
.bk3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:620px){.bk3{grid-template-columns:1fr}}
.bk3 .opt{text-align:center;margin:0;font-weight:700}
</style></head>
<body><div class="app">
<header class="hdr"><h1>ISTU 101 | Week 5: Learning with Integrity<small>Interactive: Where Is the Line?</small></h1><nav class="steps" id="steps" aria-label="Activity steps"></nav></header>
<main id="main" tabindex="-1"><div class="wrap" id="stage"></div></main>
</div>
<script>
const STEPS=["1 Sort the scenarios", "2 Read the report", "3 Under pressure"];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let step=0;const doneSteps=new Set();
function renderSteps(){const n=$('#steps');n.innerHTML=STEPS.map((s,i)=>`<button data-i="${i}" class="${doneSteps.has(i)?'done':''}" ${i===step?'aria-current="step"':''}>${esc(s)}</button>`).join('');
 $$('button',n).forEach(b=>b.onclick=()=>go(+b.dataset.i));}
function go(i){step=i;renderSteps();$('#stage').innerHTML='';VIEWS[i]($('#stage'));$('#main').scrollTop=0;}
function navBar(back,next,nextLabel='Continue',nextOff=false){return `<div class="nav"><button class="btn" id="bk" ${back?'':'style="visibility:hidden"'}>Back</button><button class="btn primary" id="nx" ${nextOff?'disabled':''}>${nextLabel}</button></div>`}
function wireNav(root,onNext){const b=$('#bk',root),n=$('#nx',root);if(b)b.onclick=()=>go(step-1);if(n)n.onclick=()=>{doneSteps.add(step);onNext?onNext():go(step+1)};}
function copyText(t,btn){const ok=()=>{const o=btn.textContent;btn.textContent='Copied!';setTimeout(()=>btn.textContent=o,1600)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
 function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){btn.textContent='Select and copy manually'}a.remove()}}
window.addEventListener('load',()=>go(0));

const SCN=[
 ['You ask Spark to explain a concept you do not understand from the reading.','ok','Spark works as a study partner or tutor. Explaining concepts is exactly what it is for.'],
 ['You copy Spark’s answer straight into your discussion post, without quotation marks or a citation.','no','That is submitting someone else’s words as your own. Spark should support your learning, not do your work for you.'],
 ['You quote one sentence from Spark in your post and cite Spark.','cite','If you directly quote Spark, cite it. Giving credit keeps your work honest.'],
 ['You brainstorm possible topics with Spark, then choose one and write about it in your own words.','ok','Brainstorming is an approved use. The thinking and writing remain yours.'],
 ['You paste a paragraph from an article into your paper and change a few words, with no source listed.','no','Lightly rewording without credit is still plagiarism. Use your own words and cite the source, or quote and cite.'],
 ['You include a short quotation from a journal article in quotation marks with a full citation.','cite','Quoted material is acceptable when it is clearly marked and credited.'],
 ['You ask Spark to write your entire essay and submit it.','no','That crosses the line. The work must be yours.'],
 ['You use the library to find credible sources, then get feedback from the Writing Center.','ok','The library and Writing Center support every assignment.'],
 ['You ask Spark to summarize an article, then use that summary’s exact wording in your paper.','cite','Summaries can guide you, but exact wording from Spark must be quoted and cited, or rewritten in your own words after you understand the source.']];
const LAB={ok:'Learning with integrity',cite:'Fine, if cited',no:'Crosses the line'};
const ans=[];let idx=0,pass=0;const VIEWS=[v1,v2,v3];
function spectrum(pos){const dot=pos==null?'':`<circle cx="${pos}" cy="60" r="13" fill="#263238" stroke="#fff" stroke-width="3"/>`;return `<svg class="spec" viewBox="0 0 600 120" role="img" aria-label="Spectrum from Spark as study partner to Spark doing your work"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8dc63f"/><stop offset=".55" stop-color="#e0a526"/><stop offset="1" stop-color="#a8343c"/></linearGradient></defs><rect x="20" y="52" width="560" height="16" rx="8" fill="url(#g)"/><text x="20" y="38" font-size="14" font-weight="700" fill="currentColor">Study partner</text><text x="580" y="38" font-size="14" font-weight="700" text-anchor="end" fill="currentColor">Doing your work</text><text x="20" y="96" font-size="13" fill="currentColor">Explain · brainstorm · guide</text><text x="300" y="96" font-size="13" text-anchor="middle" fill="currentColor">Quote it? Cite it</text><text x="580" y="96" font-size="13" text-anchor="end" fill="currentColor">Submit it as yours</text><line x1="300" y1="44" x2="300" y2="76" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/>${dot}</svg>`}
function v1(r){
 function q(){if(idx>=SCN.length){const c=ans.filter((a,i)=>a===SCN[i][1]).length;r.innerHTML=`<div class="card"><div class="kicker">Step 1 complete</div><h2>${c} of ${SCN.length} sorted correctly</h2><p>Remember: <strong>use Spark to learn, not to do your work, and cite it if you directly quote it.</strong> Integrity is part of the identity you are building.</p></div>${navBar(false,true,'Read a similarity report')}`;wireNav(r);return}
  const s=SCN[idx];r.innerHTML=`<div class="kicker">Step 1 · Scenario ${idx+1} of ${SCN.length}</div><h2>Where is the line?</h2><div class="card" style="margin-bottom:12px" id="sp">${spectrum()}</div>
  <div class="card"><p style="font-size:1.1rem;font-weight:700;margin-top:0">${s[0]}</p><div class="bk3" id="bk3">${Object.keys(LAB).map(k=>`<button class="opt" data-k="${k}">${LAB[k]}</button>`).join('')}</div><div id="fb" aria-live="polite"></div></div>`;
  $$('#bk3 .opt').forEach(b=>b.onclick=()=>{const k=b.dataset.k,ok=k===s[1];ans[idx]=k;$$('#bk3 .opt').forEach(o=>{o.disabled=true;if(o.dataset.k===s[1])o.classList.add('right')});if(!ok)b.classList.add('wrong');
   $('#sp').innerHTML=spectrum({ok:60,cite:300,no:540}[s[1]]);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><strong>${ok?'Yes.':'Not quite.'}</strong> ${s[2]}</div><div class="nav"><span></span><button class="btn primary" id="nq">${idx+1<SCN.length?'Next':'Finish'}</button></div>`;
   $('#nq').onclick=()=>{idx++;q()}})}
 idx=0;ans.length=0;q()}
const SEG=[
 ['“Integrity is the foundation of trust in learning,” according to the policy.','Quoted and cited','Matches here are expected because the text is in quotation marks with a citation. Check the citation is complete and accurate.'],
 ['Students who plan ahead feel less pressure and make better choices on deadline day','Copied without credit','This matches a source and has no quotation marks or citation. Rewrite it in your own words and cite it, or quote it and cite it.'],
 ['Smith, J. (2022). Learning with honesty. Academic Press.','Reference entry','Reference list entries often match other documents. This is normally not a problem.'],
 ['Spark explained that a thesis statement should make one clear, arguable point.','Spark used directly','If you directly quote Spark, cite it. Otherwise, restate the idea in your own words.']];
function v2(r){const seen=new Set();let cur=null;
 r.innerHTML=`<div class="kicker">Step 2</div><h2>Read a similarity report</h2><p class="lead">After you submit, select the percentage next to your submission to open the Similarity Report, which appears after five to ten minutes. Select each highlighted passage to decide what to do.</p>
 <div class="grid"><div class="card doc"><p style="margin:0">In my paper I argue that honesty matters. <button class="hl" data-i="0">“Integrity is the foundation of trust in learning,”</button> says the policy. <button class="hl" data-i="1">Students who plan ahead feel less pressure and make better choices on deadline day.</button> I agree, and I plan my work early. <button class="hl" data-i="3">Spark explained that a thesis statement should make one clear, arguable point.</button> That helped me revise.</p><p style="margin:12px 0 0;font-size:.95rem"><strong>References</strong><br><button class="hl" data-i="2">Smith, J. (2022). Learning with honesty. Academic Press.</button></p></div>
 <div class="card" id="dt" aria-live="polite"><p class="muted">Select a highlighted passage.</p></div></div><div class="muted" id="cn" style="margin-top:8px">0 of 4 reviewed</div>${navBar(true,true,'Now try a tough moment',true)}`;
 $$('.hl').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;seen.add(i);$$('.hl').forEach(h=>{h.setAttribute('aria-pressed',h===b)});b.classList.add('seen');const s=SEG[i];
  $('#dt').innerHTML=`<div class="kicker">${s[1]}</div><p>${s[2]}</p>`;$('#cn').textContent=`${seen.size} of 4 reviewed`;$('#nx').disabled=seen.size<4});wireNav(r)}
function v3(r){r.innerHTML=`<div class="kicker">Step 3</div><h2>It is 10:30 pm and your paper is due at midnight</h2><p class="lead">You are stuck and Spark is open in another tab. What do you do?</p><div class="card" id="o"><div id="ops">
 ${[['a','Ask Spark to write the paper so you can submit it.','no','That would submit work that is not yours. It is also the choice you are most likely to regret.'],
 ['b','Ask Spark to explain the part you are stuck on, then write it in your own words.','ok','This uses Spark as a tutor. The work and the words stay yours. Cite Spark if you quote it.'],
 ['c','Message your professor now, explain where you are, and ask about options.','ok','Reaching out is always allowed. Professors respond best when you are honest and ask early.'],
 ['d','Copy a paragraph from an article and reword a few phrases.','no','Rewording without credit is still plagiarism. Use your own words with a citation.']].map(o=>`<button class="opt" data-ok="${o[2]}" data-t="${esc(o[3])}">${o[1]}</button>`).join('')}</div><div id="fb" aria-live="polite"></div></div>
 <div class="grid" style="margin-top:14px"><div class="card"><strong>Support is there for every assignment</strong><ul style="margin:6px 0 0;padding-left:20px"><li>Library: find credible sources and full-text articles</li><li>Writing Center: strengthen your writing</li><li>Spark: a 24/7 study partner, within the AI policy</li><li>Your professor and Success Coach</li></ul></div>
 <div class="card"><strong>Takeaways</strong><ul style="margin:6px 0 0;padding-left:20px"><li>Integrity is part of who you are</li><li>Know where the line is</li><li>Use the support available</li></ul></div></div>${navBar(true,false,'Start over')}`;
 $$('#ops .opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='ok';$$('#ops .opt').forEach(o=>{o.disabled=true;if(o.dataset.ok==='ok')o.classList.add('right')});if(!ok)b.classList.add('wrong');
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${b.dataset.t}</div>`});
 wireNav(r,()=>{doneSteps.clear();ans.length=0;go(0)})}

</script></body></html>
