<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pitch Room</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons for React -->
    <script src="https://unpkg.com/lucide-react@0.292.0/dist/umd/lucide-react.min.js"></script>
</head>
<body class="bg-[#0a0502] font-sans antialiased text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
          Check, ArrowRight, HelpCircle, Users, Target, Eye, Lightbulb, BarChart3, 
          Map, AlertCircle, MessageSquare, ArrowRightCircle, Activity, CheckCircle2, 
          Volume2, VolumeX, TrendingDown, Bus, Home, UserMinus, BookOpen, Unlink, 
          Link2, Clock, Baby, Globe2, ClipboardList, Sprout, MapPin, Building, 
          ShoppingCart, ChevronRight, Utensils, Heart 
        } = window.lucideReact;

        const PANELIST_AVATAR = 'https://api.dicebear.com/7.x/micah/svg?seed=Panelist&backgroundColor=transparent';

        // --- DATA MODELS & CONTENT ---

        const LENSES = [
          { id: 'ALIGNMENT', title: 'ALIGNMENT', desc: 'Does the strategy actually address the problem?', icon: Target },
          { id: 'PERSPECTIVE', title: 'PERSPECTIVE', desc: 'Whose experience or voice might be missing?', icon: Users },
          { id: 'ASSUMPTIONS', title: 'ASSUMPTIONS', desc: 'What is the strategy taking for granted?', icon: Lightbulb },
          { id: 'IMPACT', title: 'IMPACT', desc: 'How will we know the strategy worked?', icon: BarChart3 }
        ];

        const PITCHES = {
          1: {
            id: 1,
            presenter: { 
              name: 'Max Winslow', 
              role: 'School Improvement Director', 
              initials: 'MW', 
              color: 'from-amber-600 to-amber-800',
              avatar: 'https://api.dicebear.com/7.x/micah/svg?seed=Max&backgroundColor=transparent'
            },
            missingAngle: 'ALIGNMENT',
            feedbackText: 'The strategy addresses one part of the problem, but not the broader diagnosis.',
            feedbackPrinciple: 'A strong strategy should clearly connect the problem identified with the response proposed.',
            script: [
              { speaker: 'MAX', text: 'We\'ve seen an 18% increase in student absenteeism this year.', pathway: ['PROBLEM'] },
              { speaker: 'PANELIST', text: 'What did your team find was driving it?', pathway: ['PROBLEM'] },
              { speaker: 'MAX', text: 'Several things. Transportation is a major issue. Family responsibilities are another. Some students also feel disconnected from school. And for some, academic struggles make it harder.', pathway: ['PROBLEM', 'DIAGNOSIS'] },
              { speaker: 'PANELIST', text: 'And what\'s your proposed response?', pathway: ['PROBLEM', 'DIAGNOSIS'] },
              { speaker: 'MAX', text: 'We\'re proposing after-school tutoring three afternoons a week. Students would receive academic support, supervised study time, and help catching up.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
              { speaker: 'PANELIST', text: 'And you expect that to improve attendance?', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
              { speaker: 'MAX', text: 'Yes. Students who feel more academically supported should become more engaged and more likely to attend.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT_Q'] }
            ]
          },
          2: {
            id: 2,
            presenter: { 
              name: 'Justine', 
              role: 'Community Program Director', 
              initials: 'JU', 
              color: 'from-emerald-600 to-emerald-800',
              avatar: 'https://api.dicebear.com/7.x/micah/svg?seed=Justine&backgroundColor=transparent'
            },
            missingAngle: 'PERSPECTIVE',
            feedbackText: 'The strategy was designed around what the organization believes families need—not what families have said they need.',
            feedbackPrinciple: 'Strong strategies consider the experience of the people they are designed to affect.',
            script: [
              { speaker: 'JUSTINE', text: 'Families aren\'t showing up to our youth health workshops. Attendance has stayed low despite repeated outreach.', pathway: ['PROBLEM'] },
              { speaker: 'PANELIST', text: 'What do you think is getting in the way?', pathway: ['PROBLEM'] },
              { speaker: 'JUSTINE', text: 'We think the biggest issue is commitment. If the workshops are optional, families simply don\'t prioritize them.', pathway: ['PROBLEM', 'DIAGNOSIS'] },
              { speaker: 'PANELIST', text: 'So what\'s your proposed solution?', pathway: ['PROBLEM', 'DIAGNOSIS'] },
              { speaker: 'JUSTINE', text: 'Starting next semester, we\'re proposing one required Saturday workshop each month.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
              { speaker: 'PANELIST', text: 'Did you talk with families about the change?', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
              { speaker: 'JUSTINE', text: 'Not formally. But if attendance is required, we expect participation to increase.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT_Q'] }
            ]
          },
          3: {
            id: 3,
            presenter: { 
              name: 'Alex Morgan', 
              role: 'Neighborhood Initiative Coordinator', 
              initials: 'AM', 
              color: 'from-indigo-600 to-indigo-800',
              avatar: 'https://api.dicebear.com/7.x/micah/svg?seed=Alex&backgroundColor=transparent'
            },
            missingAngle: 'IMPACT',
            feedbackText: 'The strategy makes a plausible claim about impact, but it doesn\'t explain how that impact will be demonstrated.',
            feedbackPrinciple: 'A strategy becomes stronger when its intended outcomes can be observed or measured.',
            script: [
              { speaker: 'ALEX', text: 'Fresh food shouldn\'t depend on where you live. Our neighborhood survey shows strong interest in improving access to fresh produce.', pathway: ['PROBLEM', 'DIAGNOSIS'] },
              { speaker: 'PANELIST', text: 'What\'s your proposed strategy?', pathway: ['PROBLEM', 'DIAGNOSIS'] },
              { speaker: 'ALEX', text: 'We\'re proposing a community garden on an unused neighborhood lot, supported by local volunteers and community partners.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
              { speaker: 'PANELIST', text: 'And what impact do you expect?', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY'] },
              { speaker: 'ALEX', text: 'Greater access to fresh food should contribute to healthier eating and better community health.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT_Q'] },
              { speaker: 'PANELIST', text: 'How will you know whether it\'s actually working?', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT_Q'] },
              { speaker: 'ALEX', text: 'We expect the benefits to become evident as participation grows.', pathway: ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT_Q'] }
            ]
          }
        };

        // --- AUDIO ENGINE ---

        let audioCtx = null;
        const initAudio = () => {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        };

        const playSound = (type, isMuted) => {
          if (isMuted) return;
          initAudio();
          if (!audioCtx) return;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          
          const now = audioCtx.currentTime;
          
          switch(type) {
            case 'click':
              osc.type = 'sine';
              osc.frequency.setValueAtTime(800, now);
              osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
              gain.gain.setValueAtTime(0.1, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
              osc.start(now);
              osc.stop(now + 0.05);
              break;
            case 'error':
              osc.type = 'sine';
              osc.frequency.setValueAtTime(300, now);
              osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
              gain.gain.setValueAtTime(0.15, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
              osc.start(now);
              osc.stop(now + 0.2);
              break;
            case 'success':
              osc.type = 'sine';
              osc.frequency.setValueAtTime(440, now);
              gain.gain.setValueAtTime(0.1, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
              osc.start(now);
              osc.stop(now + 0.15);
              
              setTimeout(() => {
                if (!audioCtx) return;
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(554.37, audioCtx.currentTime); 
                gain2.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(audioCtx.currentTime);
                osc2.stop(audioCtx.currentTime + 0.3);
              }, 100);
              break;
            case 'transition':
              osc.type = 'sine';
              osc.frequency.setValueAtTime(300, now);
              osc.frequency.linearRampToValueAtTime(500, now + 0.1);
              gain.gain.setValueAtTime(0.05, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
              osc.start(now);
              osc.stop(now + 0.15);
              break;
          }
        };

        // --- SHARED UI COMPONENTS ---

        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false }) => {
          const baseStyle = "px-6 py-3 rounded-xl font-black transition-all duration-150 flex items-center justify-center gap-2 active:translate-y-1 active:border-b-0 focus:outline-none";
          const variants = {
            primary: "bg-gradient-to-b from-[#7bed43] to-[#45b811] text-[#0a2e00] border-b-4 border-[#2b7a08] shadow-lg hover:brightness-110 tracking-wide uppercase",
            secondary: "bg-gradient-to-b from-[#fbf4d7] to-[#e6dbb3] text-[#1c3842] border-b-4 border-[#c2b688] shadow-lg hover:brightness-110 uppercase",
            outline: "bg-transparent text-[#fbf4d7] border-2 border-[#fbf4d7] hover:bg-[#fbf4d7] hover:text-[#1c0d07] uppercase",
            lens: "bg-[#1a2533] text-white border-2 border-[#2d3e50] hover:border-[#7bed43] hover:shadow-[0_0_15px_rgba(123,237,67,0.4)] text-left items-start flex-col gap-1 p-5 rounded-2xl active:translate-y-0",
            inverse: "bg-gradient-to-b from-[#fbf4d7] to-[#e6dbb3] text-[#1c3842] border-b-4 border-[#c2b688] hover:brightness-110 uppercase",
          };
          return (
            <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed border-b-0 translate-y-1' : ''} ${className}`}>
              {children}
            </button>
          );
        };

        const Header = ({ pitchNum, pathway = [], isMuted, toggleMute }) => {
          const steps = ['PROBLEM', 'DIAGNOSIS', 'STRATEGY', 'IMPACT'];
          
          return (
            <header className="fixed top-0 w-full bg-white border-b border-slate-200 z-50">
              <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                <div className="flex flex-col">
                  <h1 className="text-lg font-bold tracking-tight text-slate-900 leading-none">THE PITCH ROOM</h1>
                  <span className="text-xs font-semibold tracking-wider text-slate-500 mt-1">STRATEGIC REVIEW PANEL</span>
                </div>
                
                {pitchNum > 0 && pitchNum <= 3 && (
                  <div className="hidden md:flex items-center gap-2 bg-[#1f2937] px-4 py-2 rounded-xl border-b-4 border-[#111827]">
                    {steps.map((step, idx) => {
                      const isComplete = pathway.includes(step);
                      const isQuestion = pathway.includes(step + '_Q') && step === 'IMPACT';
                      
                      return (
                        <React.Fragment key={step}>
                          <div className={`flex items-center gap-1.5 text-xs font-black tracking-widest px-2 py-1 rounded-md ${isComplete ? 'bg-[#7bed43] text-[#0a2e00]' : isQuestion ? 'bg-amber-400 text-amber-900' : 'text-slate-500 bg-slate-800'}`}>
                            <span>{step}</span>
                            {isComplete ? <Check size={14} strokeWidth={4} /> : isQuestion ? <HelpCircle size={14} strokeWidth={4} /> : null}
                          </div>
                          {idx < steps.length - 1 && <ArrowRight size={14} className="text-slate-600 mx-1" strokeWidth={3} />}
                        </React.Fragment>
                      );
                    })}
                  </div>
                )}

                <div className="flex items-center gap-4">
                  {pitchNum > 0 && pitchNum <= 3 && (
                    <div className="text-sm font-semibold text-slate-500">
                      PITCH 0{pitchNum} / 03
                    </div>
                  )}
                  <button 
                    onClick={toggleMute} 
                    className="p-2 rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-700 transition-colors"
                    title={isMuted ? "Unmute Sounds" : "Mute Sounds"}
                  >
                    {isMuted ? <VolumeX size={18} /> : <Volume2 size={18} />}
                  </button>
                </div>
              </div>
            </header>
          );
        };

        const Avatar = ({ initials, color, type = 'presenter', imgUrl }) => {
          const [imgError, setImgError] = useState(false);
          const isPanelist = type === 'panelist';
          
          const actualImgUrl = isPanelist ? PANELIST_AVATAR : imgUrl;

          return (
            <div className={`relative w-20 h-24 rounded-xl flex items-end justify-center font-bold text-lg shadow-[0_4px_10px_rgba(0,0,0,0.3)] border-4 overflow-hidden shrink-0 ${isPanelist ? 'bg-gradient-to-b from-slate-700 to-slate-900 border-slate-600' : `bg-gradient-to-b ${color} border-white`}`}>
              {!imgError && actualImgUrl ? (
                <img 
                  src={actualImgUrl} 
                  alt={initials || "Avatar"} 
                  className={`w-[120%] h-[120%] object-contain object-bottom ${isPanelist ? 'brightness-0 opacity-80' : ''}`}
                  onError={() => setImgError(true)}
                />
              ) : (
                <div className="mb-4">{isPanelist ? <Users size={32} className="text-slate-400" /> : initials}</div>
              )}
            </div>
          );
        };

        const FadeIn = ({ children, delay = 0, className = '' }) => {
          const [isVisible, setIsVisible] = useState(false);
          useEffect(() => {
            const timer = setTimeout(() => setIsVisible(true), delay);
            return () => clearTimeout(timer);
          }, [delay]);

          return (
            <div className={`transition-all duration-700 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'} ${className}`}>
              {children}
            </div>
          );
        };

        // --- VISUALIZATION COMPONENTS ---

        const Pitch1Visual = ({ step, isFeedback }) => {
          return (
            <div className="w-full h-full flex flex-col items-center justify-center p-8 bg-[#1a2533] rounded-3xl border-4 border-[#2d3e50] shadow-[inset_0_0_50px_rgba(0,0,0,0.5)] relative overflow-hidden">
              
              {!isFeedback ? (
                <div className="w-full max-w-lg space-y-8 z-10">
                  <FadeIn delay={100}>
                    <div className={`p-6 bg-[#2d3e50] rounded-2xl shadow-lg border-b-4 border-[#1f2937] transition-all ${step >= 2 ? 'opacity-50 scale-95' : ''}`}>
                      <div className="flex items-center gap-4">
                        <div className="bg-rose-500 p-4 rounded-xl text-white shadow-inner">
                          <TrendingDown size={32} strokeWidth={3} />
                        </div>
                        <div>
                          <div className="text-sm font-black tracking-widest text-rose-400 mb-1">THE PROBLEM</div>
                          <div className="text-3xl font-black text-white">18% Increase</div>
                          <div className="text-slate-300 font-medium">in student absenteeism this year.</div>
                        </div>
                      </div>
                    </div>
                  </FadeIn>

                  {step >= 2 && (
                    <FadeIn>
                      <div className={`space-y-3 transition-all ${step >= 4 ? 'opacity-50 scale-95' : ''}`}>
                        <div className="flex items-center gap-2 text-sm font-black text-[#7bed43] tracking-widest uppercase">
                          <Activity size={16} strokeWidth={3}/> Identified Causes
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                          <div className="bg-[#1f2937] p-4 rounded-xl shadow-inner border border-[#3d536b] flex flex-col items-center gap-2 text-center">
                            <Bus size={20} className="text-amber-400" />
                            <span className="text-sm font-bold text-white">Transportation</span>
                          </div>
                          <div className="bg-[#1f2937] p-4 rounded-xl shadow-inner border border-[#3d536b] flex flex-col items-center gap-2 text-center">
                            <Home size={20} className="text-amber-400" />
                            <span className="text-sm font-bold text-white">Family Duties</span>
                          </div>
                          <div className="bg-[#1f2937] p-4 rounded-xl shadow-inner border border-[#3d536b] flex flex-col items-center gap-2 text-center">
                            <UserMinus size={20} className="text-amber-400" />
                            <span className="text-sm font-bold text-white">Disconnection</span>
                          </div>
                          <div className="bg-[#2d3e50] p-4 rounded-xl shadow-[0_0_15px_rgba(96,165,250,0.3)] border-2 border-blue-400 flex flex-col items-center gap-2 text-center relative overflow-hidden">
                            <BookOpen size={20} className="text-blue-400 relative z-10" />
                            <span className="text-sm font-black text-white relative z-10">Academic Struggles</span>
                          </div>
                        </div>
                      </div>
                    </FadeIn>
                  )}

                  {step >= 4 && (
                    <FadeIn>
                      <div className="p-6 bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl shadow-xl border-b-4 border-blue-900 relative overflow-hidden group">
                        <div className="relative z-10">
                          <div className="text-xs font-black tracking-widest text-blue-200 mb-2 flex items-center gap-2">
                            <Target size={14} /> PROPOSED STRATEGY
                          </div>
                          <div className="text-2xl font-black text-white mb-4">After-School Tutoring</div>
                          <div className="flex gap-2 flex-wrap">
                            <span className="bg-blue-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 border border-blue-400"><CheckCircle2 size={12} className="text-[#7bed43]"/> Support</span>
                            <span className="bg-blue-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 border border-blue-400"><CheckCircle2 size={12} className="text-[#7bed43]"/> Study</span>
                            <span className="bg-blue-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 border border-blue-400"><CheckCircle2 size={12} className="text-[#7bed43]"/> Catch-Up</span>
                          </div>
                        </div>
                      </div>
                    </FadeIn>
                  )}
                </div>
              ) : (
                <div className="w-full max-w-3xl flex items-center justify-between z-10 gap-8 bg-[#1f2937] p-8 rounded-3xl border-2 border-[#3d536b]">
                  <div className="flex-1 space-y-3 relative">
                     <div className="text-xs font-black text-slate-400 mb-6 tracking-widest uppercase">DIAGNOSIS FOUND:</div>
                     
                     <div className="bg-[#111827] p-4 rounded-xl border border-slate-700 flex items-center gap-3 text-slate-500">
                       <Bus size={18} /> <span className="font-bold text-sm">Transportation</span>
                     </div>
                     <div className="bg-[#111827] p-4 rounded-xl border border-slate-700 flex items-center gap-3 text-slate-500">
                       <Home size={18} /> <span className="font-bold text-sm">Family Duties</span>
                     </div>
                     <div className="bg-[#111827] p-4 rounded-xl border border-slate-700 flex items-center gap-3 text-slate-500">
                       <UserMinus size={18} /> <span className="font-bold text-sm">Disconnection</span>
                     </div>
                     <div className="bg-[#2d3e50] p-4 rounded-xl border-2 border-blue-400 flex items-center gap-3 text-white relative shadow-[0_0_15px_rgba(96,165,250,0.3)]">
                       <BookOpen size={18} className="text-blue-400" /> <span className="font-bold text-sm">Academic Struggles</span>
                       {/* Connector Line */}
                       <div className="absolute right-[-64px] top-1/2 w-16 border-t-[4px] border-blue-400 transform -translate-y-1/2 flex items-center justify-end">
                          <div className="w-3 h-3 bg-white rounded-full absolute -right-1 shadow-[0_0_10px_#fff]"></div>
                       </div>
                     </div>
                     
                     {/* Unaddressed connection indicators */}
                     <div className="absolute right-[-48px] top-[15%] w-12 border-t-4 border-slate-600 border-dashed"></div>
                     <div className="absolute right-[-48px] top-[40%] w-12 border-t-4 border-slate-600 border-dashed"></div>
                     <div className="absolute right-[-48px] top-[65%] w-12 border-t-4 border-slate-600 border-dashed"></div>
                  </div>
                  
                  <div className="w-12 flex flex-col items-center justify-center gap-12 text-slate-300 relative z-20">
                     <Unlink size={28} className="text-rose-500" />
                     <Unlink size={28} className="text-rose-500" />
                     <Unlink size={28} className="text-rose-500" />
                     <Link2 size={28} className="text-blue-400" />
                  </div>

                  <div className="flex-1 space-y-2 relative z-10">
                    <div className="text-xs font-black text-[#7bed43] mb-6 tracking-widest uppercase">STRATEGY ADDRESSES:</div>
                     <div className="bg-gradient-to-br from-blue-600 to-blue-800 p-8 rounded-2xl border-b-4 border-blue-900 h-[280px] flex flex-col justify-center items-center relative shadow-xl">
                       <div className="w-16 h-16 bg-white/10 backdrop-blur-sm rounded-full flex items-center justify-center mb-4 text-white shadow-inner">
                         <Target size={32} />
                       </div>
                       <div className="text-2xl font-black text-white text-center leading-tight">After-School<br/>Tutoring</div>
                     </div>
                  </div>
                </div>
              )}
            </div>
          );
        };

        const Pitch2Visual = ({ step, isFeedback }) => {
          return (
            <div className="w-full h-full flex flex-col items-center justify-center p-8 bg-[#1a2533] rounded-3xl border-4 border-[#2d3e50] shadow-[inset_0_0_50px_rgba(0,0,0,0.5)] relative overflow-hidden">
              {!isFeedback ? (
                <div className="w-full max-w-xl space-y-8 z-10 flex flex-col items-center relative">
                  <FadeIn>
                    <div className={`flex flex-col items-center transition-all ${step >= 4 ? 'opacity-30 scale-90' : ''}`}>
                      <div className="bg-rose-500 text-white px-6 py-4 rounded-2xl border-b-4 border-rose-700 text-lg font-black shadow-lg flex items-center gap-3">
                        <Activity size={24} strokeWidth={3} /> LOW WORKSHOP PARTICIPATION
                      </div>
                      {step >= 2 && (
                        <div className="mt-4 bg-amber-400 px-5 py-2 border-b-4 border-amber-600 rounded-xl text-sm font-black text-amber-900 tracking-widest uppercase transform -rotate-2">
                          ASSUMPTION: LACK OF COMMITMENT
                        </div>
                      )}
                    </div>
                  </FadeIn>

                  {step >= 4 && (
                    <FadeIn className="w-full">
                      <div className="relative h-[300px] w-full flex items-center justify-center">
                        {/* Central Strategy Node */}
                        <div className="absolute z-20 p-6 bg-gradient-to-b from-purple-500 to-purple-700 rounded-2xl shadow-xl border-b-4 border-purple-900 text-center w-64 transform transition-all duration-500">
                          <div className="text-xs font-black text-purple-200 mb-2 tracking-widest">STRATEGY</div>
                          <div className="text-2xl font-black text-white leading-tight">MANDATORY SATURDAY WORKSHOP</div>
                        </div>

                        {/* Connecting Lines */}
                        {step >= 6 && (
                          <svg className="absolute inset-0 w-full h-full z-10 pointer-events-none" style={{ filter: 'drop-shadow(0px 2px 2px rgba(0,0,0,0.5))' }}>
                             <path d="M 288 150 L 288 250" stroke="#fbbf24" strokeWidth="6" strokeDasharray="10 10" fill="none" />
                          </svg>

                                  <span className="font-black text-2xl text-white tracking-wide uppercase">{lens.title}</span>
                                  <div className="w-12 h-12 rounded-xl bg-slate-800/50 flex items-center justify-center">
                                    <lens.icon size={24} className="text-slate-400 group-hover:text-[#7bed43]" strokeWidth={2.5} />
                                  </div>
                                </div>
                                <span className="text-lg text-slate-400 font-medium">{lens.desc}</span>
                              </Button>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Right Column: Visualizer */}
                  <div className="w-full md:w-7/12 flex flex-col items-center justify-center relative p-6 md:p-12 min-h-[500px]">
                     <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_rgba(251,191,36,0.1),_transparent_80%)] pointer-events-none"></div>
                     
                     {/* Visual Board Title Badge */}
                     <div className="absolute top-8 left-1/2 transform -translate-x-1/2 z-20 bg-[#fbf4d7] text-[#1c3842] border-b-4 border-[#c2b688] px-6 py-2 rounded-xl text-sm font-black tracking-widest uppercase shadow-[0_5px_15px_rgba(0,0,0,0.5)]">
                       Visual Board
                     </div>

                     <div className="w-full h-full flex items-center justify-center relative z-10 pt-10">
                       {renderVisual()}
                     </div>
                  </div>

                </div>
              </div>
            );
          };

          const ScreenFeedback = () => {
            const pitchData = PITCHES[currentPitch];
            
            const nextScreen = () => {
              playAudio('transition');
              if (currentPitch < 3) {
                setCurrentPitch(prev => prev + 1);
                setCurrentScreen('pitch');
              } else {
                setCurrentScreen('summary');
              }
            };

            const renderFeedbackVisual = () => {
              if (currentPitch === 1) return <Pitch1Visual isFeedback={true} />;
              if (currentPitch === 2) return <Pitch2Visual isFeedback={true} />;
              if (currentPitch === 3) return <Pitch3Visual isFeedback={true} />;
              return null;
            };

            return (
              <div className="min-h-screen bg-gradient-to-b from-[#2a1409] to-[#0a0502] flex flex-col pt-20 text-white">
                <Header pitchNum={currentPitch} pathway={[]} isMuted={isMuted} toggleMute={toggleMute} />
                
                <div className="flex-1 flex flex-col md:flex-row min-h-[calc(100vh-80px)]">
                  {/* Top/Left Half: Explanation */}
                  <div className="w-full md:w-1/3 bg-gradient-to-b from-[#1a2533] to-[#111827] p-6 md:p-12 flex flex-col border-b md:border-b-0 md:border-r-4 border-[#2d3e50] relative z-20 shadow-[20px_0_30px_rgba(0,0,0,0.5)]">
                    <FadeIn delay={200} className="max-w-xl space-y-8 pt-4 md:pt-16 pb-8">
                      <div>
                        <h4 className="text-sm font-black text-amber-400 tracking-widest uppercase mb-4 drop-shadow-md">THE MISSING ANGLE</h4>
                        <div className="inline-block bg-amber-400 text-amber-900 px-6 py-3 rounded-xl text-3xl font-black tracking-widest shadow-[0_10px_20px_rgba(0,0,0,0.4)] border-b-4 border-amber-600 mb-8 transform -rotate-2">
                          {pitchData.missingAngle}
                        </div>
                      </div>
                      
                      <div className="text-2xl text-white leading-relaxed font-black pb-8 border-b-2 border-slate-700 bg-slate-800/40 p-6 rounded-2xl">
                        {pitchData.feedbackText}
                      </div>
                      
                      <div className="pt-4">
                        <p className="text-2xl font-bold text-slate-300 leading-snug mb-10 border-l-4 border-[#7bed43] pl-6">
                          <span className="text-[#7bed43] font-black uppercase block mb-2">Takeaway:</span>
                          {pitchData.feedbackPrinciple}
                        </p>
                        <Button onClick={nextScreen} className="px-10 py-6 w-full text-2xl uppercase">
                          {currentPitch < 3 ? 'NEXT PITCH' : 'SEE WHAT YOU FOUND'} <ArrowRight size={28} strokeWidth={3}/>
                        </Button>
                      </div>
                    </FadeIn>
                  </div>

                  {/* Bottom/Right Half: Visual Reveal */}
                  <div className="w-full md:w-2/3 flex items-center justify-center p-8 md:p-16 relative overflow-hidden h-full min-h-[500px]">
                     <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_rgba(251,191,36,0.1),_transparent_80%)] pointer-events-none"></div>
                    <FadeIn delay={600} className="w-full h-full flex items-center justify-center relative z-10">
                      {renderFeedbackVisual()}
                    </FadeIn>
                  </div>
                </div>
              </div>
            );
          };

          const ScreenSummary = () => (
            <div className="min-h-screen bg-gradient-to-b from-[#4a2411] via-[#241108] to-[#0a0502] pt-32 pb-16 px-6 flex flex-col items-center">
              <Header pitchNum={0} isMuted={isMuted} toggleMute={toggleMute} />
              <FadeIn className="max-w-5xl w-full">
                <div className="text-center mb-20">
                  <h2 className="text-6xl md:text-7xl font-black text-white mb-4 tracking-tight drop-shadow-xl">THREE PITCHES.</h2>
                  <h2 className="text-5xl md:text-6xl font-black text-[#7bed43] mb-10 tracking-tight drop-shadow-[0_0_15px_rgba(123,237,67,0.4)]">THREE MISSING ANGLES.</h2>
                  <p className="text-2xl text-amber-400 font-bold max-w-3xl mx-auto">Strong strategies don't just sound convincing. Their pieces connect.</p>
                </div>

                <div className="flex flex-col gap-8 mb-20">
                  <div className="bg-[#1a2533] p-8 rounded-[2rem] shadow-xl border-4 border-[#2d3e50] flex flex-col md:flex-row items-center gap-8 transform hover:scale-[1.02] transition-transform">
                    <div className="text-7xl font-black text-slate-700 w-28 text-center drop-shadow-lg">01</div>
                    <div className="flex-1 text-center md:text-left">
                      <div className="text-3xl font-black text-white mb-2 uppercase">ATTENDANCE</div>
                      <div className="text-xl text-slate-400 font-bold flex items-center justify-center md:justify-start gap-3 uppercase">Problem <ArrowRight size={24} className="text-amber-500" strokeWidth={3}/> Strategy</div>
                    </div>
                    <div className="bg-[#fbf4d7] text-[#1c3842] px-8 py-4 rounded-2xl font-black tracking-widest text-2xl border-b-8 border-[#c2b688] shadow-lg transform rotate-2">
                      ALIGNMENT
                    </div>
                  </div>

                  <div className="bg-[#1a2533] p-8 rounded-[2rem] shadow-xl border-4 border-[#2d3e50] flex flex-col md:flex-row items-center gap-8 transform hover:scale-[1.02] transition-transform">
                    <div className="text-7xl font-black text-slate-700 w-28 text-center drop-shadow-lg">02</div>
                    <div className="flex-1 text-center md:text-left">
                      <div className="text-3xl font-black text-white mb-2 uppercase">PARENT ENGAGEMENT</div>
                      <div className="text-xl text-slate-400 font-bold flex items-center justify-center md:justify-start gap-3 uppercase">Strategy <ArrowRight size={24} className="text-amber-500" strokeWidth={3}/> People</div>
                    </div>
                    <div className="bg-[#fbf4d7] text-[#1c3842] px-8 py-4 rounded-2xl font-black tracking-widest text-2xl border-b-8 border-[#c2b688] shadow-lg transform -rotate-1">
                      PERSPECTIVE
                    </div>
                  </div>

                  <div className="bg-[#1a2533] p-8 rounded-[2rem] shadow-xl border-4 border-[#2d3e50] flex flex-col md:flex-row items-center gap-8 transform hover:scale-[1.02] transition-transform">
                    <div className="text-7xl font-black text-slate-700 w-28 text-center drop-shadow-lg">03</div>
                    <div className="flex-1 text-center md:text-left">
                      <div className="text-3xl font-black text-white mb-2 uppercase">COMMUNITY GARDEN</div>
                      <div className="text-xl text-slate-400 font-bold flex items-center justify-center md:justify-start gap-3 uppercase">Action <ArrowRight size={24} className="text-amber-500" strokeWidth={3}/> Evidence</div>
                    </div>
                    <div className="bg-[#fbf4d7] text-[#1c3842] px-8 py-4 rounded-2xl font-black tracking-widest text-2xl border-b-8 border-[#c2b688] shadow-lg transform rotate-1">
                      IMPACT
                    </div>
                  </div>
                </div>

                <div className="flex justify-center">
                  <Button onClick={() => { playAudio('transition'); setCurrentScreen('flip'); }} className="py-6 px-16 text-3xl">
                    CONTINUE <ArrowRight size={32} strokeWidth={3} />
                  </Button>
                </div>
              </FadeIn>
            </div>
          );

          const ScreenFlip = () => (
            <div className="min-h-screen bg-gradient-to-b from-[#1a2533] to-[#111827] text-white pt-32 pb-12 px-6 flex flex-col items-center text-center">
              <Header pitchNum={0} isMuted={isMuted} toggleMute={toggleMute} />
              <FadeIn className="max-w-5xl w-full mt-4 md:mt-12">
                <h2 className="text-4xl md:text-5xl font-black tracking-tight mb-8 text-white drop-shadow-[0_5px_10px_rgba(0,0,0,0.5)]">FLIP THE LENS</h2>
                
                <div className="flex flex-col md:flex-row items-center justify-center gap-3 text-xs font-black tracking-widest text-white mb-10 w-full uppercase">
                  <span className="bg-[#2d3e50] px-4 py-3 rounded-xl shadow-[inset_0_4px_10px_rgba(0,0,0,0.3)] border-2 border-slate-600 flex items-center gap-2"><Target size={18} className="text-slate-400"/> THEIR STRATEGY</span>
                  <ArrowRight size={24} className="hidden md:block text-amber-500" strokeWidth={3}/>
                  <ArrowRight size={24} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-[#2d3e50] px-4 py-3 rounded-xl shadow-[inset_0_4px_10px_rgba(0,0,0,0.3)] border-2 border-slate-600 flex items-center gap-2"><Users size={18} className="text-slate-400"/> OUTSIDE PERSPECTIVE</span>
                  <ArrowRight size={24} className="hidden md:block text-amber-500" strokeWidth={3}/>
                  <ArrowRight size={24} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-amber-500 px-4 py-3 rounded-xl text-amber-950 shadow-[0_0_20px_rgba(245,158,11,0.6)] border-b-4 border-amber-700 transform scale-105 flex items-center gap-2"><Eye size={20} /> MISSING ANGLE</span>
                  <ArrowRight size={24} className="hidden md:block text-amber-500" strokeWidth={3}/>
                  <ArrowRight size={24} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-[#7bed43] px-4 py-3 rounded-xl text-[#0a2e00] shadow-[0_0_20px_rgba(123,237,67,0.4)] border-b-4 border-[#2b7a08] flex items-center gap-2"><CheckCircle2 size={18} /> STRONGER STRATEGY</span>
                </div>

                <p className="text-xl md:text-2xl font-bold text-slate-300 max-w-3xl mx-auto mb-10 leading-relaxed bg-[#111827]/50 p-6 rounded-[1.5rem] border-2 border-slate-700">
                  When you're close to an idea, some weaknesses are harder to&nbsp;see.
                </p>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10 max-w-4xl mx-auto text-left">
                  {LENSES.map(lens => (
                    <div key={lens.id} className="bg-[#1f2937] p-5 rounded-2xl border-4 border-[#2d3e50] hover:border-amber-400 transition-colors shadow-lg flex items-center gap-5">
                      <div className="bg-[#111827] p-4 rounded-xl text-amber-400 shadow-inner border border-slate-700">
                        <lens.icon size={32} strokeWidth={2.5} />
                      </div>
                      <div>
                        <div className="text-amber-400 font-black tracking-wider mb-1 text-xl uppercase">{lens.title}</div>
                        <div className="text-white text-base font-bold">{lens.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-[#fbf4d7] max-w-xl mx-auto p-6 md:p-8 rounded-[1.5rem] border-b-[6px] border-[#c2b688] mb-10 shadow-[0_10px_20px_rgba(0,0,0,0.4)] relative overflow-hidden transform -rotate-1">
                   <div className="relative z-10 text-[#1c3842]">
                     <div className="text-slate-500 font-black tracking-widest mb-2 uppercase text-xs">DON'T JUST ASK:</div>
                     <div className="text-xl md:text-2xl text-slate-400 line-through decoration-rose-500 decoration-4 mb-6 font-black">"What do you think?"</div>
                     <div className="text-amber-600 font-black tracking-widest mb-2 uppercase text-sm">ASK:</div>
                     <div className="text-2xl md:text-3xl font-black text-[#1c3842] leading-tight">"What is the missing angle in my strategy?"</div>
                   </div>
                </div>

                <Button onClick={() => { playAudio('transition'); setCurrentScreen('final'); }} className="py-5 px-14 text-2xl w-full max-w-xs mx-auto shadow-[0_10px_20px_rgba(0,0,0,0.5)]">
                  NEXT
                </Button>
              </FadeIn>
            </div>
          );

          const ScreenFinal = () => (
            <div className="min-h-screen bg-gradient-to-b from-[#4a2411] via-[#241108] to-[#0a0502] pt-32 pb-12 px-6 flex flex-col items-center text-center relative">
              <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full h-full max-w-4xl max-h-4xl bg-[radial-gradient(ellipse_at_center,_rgba(251,191,36,0.15),_transparent_70%)] pointer-events-none"></div>
              <Header pitchNum={0} isMuted={isMuted} toggleMute={toggleMute} />
              
              <FadeIn className="max-w-3xl w-full mt-4 md:mt-12 bg-[#1a2533] p-10 md:p-14 rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.6)] border-4 border-[#2d3e50] relative z-10">
                <div className="w-24 h-24 bg-[#fbf4d7] rounded-2xl flex items-center justify-center mx-auto mb-8 text-[#1c3842] shadow-[0_10px_20px_rgba(0,0,0,0.4)] border-b-8 border-[#c2b688] transform -rotate-3 hover:rotate-3 transition-transform">
                  <Eye size={48} strokeWidth={2.5}/>
                </div>
                <h2 className="text-4xl md:text-5xl font-black text-white tracking-tight mb-12 leading-tight drop-shadow-lg">
                  YOU CAN'T ALWAYS SEE<br/>YOUR OWN BLIND SPOTS.
                </h2>
                
                <div className="flex flex-col md:flex-row items-center justify-center gap-4 text-sm font-black tracking-widest text-white mb-12 uppercase">
                  <span className="bg-[#2d3e50] px-4 py-3 rounded-xl border-2 border-slate-600">YOUR STRATEGY</span>
                  <ArrowRight size={20} className="hidden md:block text-amber-500" strokeWidth={3}/>
                  <ArrowRight size={20} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-[#2d3e50] px-4 py-3 rounded-xl border-2 border-slate-600">PEER PERSPECTIVE</span>
                  <ArrowRight size={20} className="hidden md:block text-amber-500" strokeWidth={3}/>
                  <ArrowRight size={20} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-amber-400 px-4 py-3 rounded-xl text-amber-950 border-b-4 border-amber-600 shadow-lg transform scale-105">MISSING ANGLE</span>
                  <ArrowRight size={20} className="hidden md:block text-amber-500" strokeWidth={3}/>
                  <ArrowRight size={20} className="md:hidden rotate-90 text-amber-500" strokeWidth={3}/>
                  <span className="bg-[#7bed43] px-4 py-3 rounded-xl text-[#0a2e00] border-b-4 border-[#2b7a08] shadow-lg">STRONGER STRATEGY</span>
                </div>

                <p className="text-xl font-bold text-slate-300 mb-12 max-w-2xl mx-auto bg-[#111827]/50 p-6 rounded-2xl border border-slate-700">
                  Now it's your turn to put another set of eyes on your strategy.
                </p>

                <Button onClick={() => { playAudio('transition'); setCurrentScreen('intro'); setCurrentPitch(1); }} variant="inverse" className="py-6 px-16 text-3xl w-full max-w-md mx-auto shadow-[0_10px_20px_rgba(0,0,0,0.5)]">
                  START OVER
                </Button>
              </FadeIn>
            </div>
          );

          // Render Router
          switch (currentScreen) {
            case 'intro': return <ScreenIntro />;
            case 'lenses': return <ScreenLenses />;
            case 'pitch': return <ScreenPitch key={currentPitch} />;
            case 'feedback': return <ScreenFeedback key={`fb-${currentPitch}`} />;
            case 'summary': return <ScreenSummary />;
            case 'flip': return <ScreenFlip />;
            case 'final': return <ScreenFinal />;
            default: return <ScreenIntro />;
          }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
