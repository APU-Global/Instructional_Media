<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSYC 460 Motivation | Week 6 Motivational Interviewing Practice</title>
<style>:root{--red:#b5303a;--red2:#d34147;--ink:#222;--mut:#5b5b5b;--soft:#f7f4f0;--line:#e4dfd9;--teal:#1f7a8c;--gold:#d9a21f;--green:#2c8a6e;--navy:#4a5a78;--orange:#d9703c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;font-size:14px;line-height:1.4}
.app{height:100vh;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(95deg,#8f232c,#d34147);color:#fff}
.top h1{font-size:17px;margin:0;font-weight:700}
.top .pill{background:rgba(255,255,255,.22);border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.top .sub{font-size:12px;opacity:.92;margin-left:auto;white-space:nowrap}
.tabs{flex:none;display:flex;gap:4px;padding:6px 16px 0;border-bottom:2px solid var(--line);background:var(--soft)}
.tab{border:0;background:transparent;padding:8px 14px;font-family:inherit;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;border-radius:8px 8px 0 0;margin-bottom:-2px;border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--red);background:#fff;border-bottom-color:var(--red)}
.tab:focus-visible,.btn:focus-visible,.seg button:focus-visible,[tabindex]:focus-visible{outline:3px solid #1f7a8c;outline-offset:2px}
.panel{display:none;flex:1;min-height:0;padding:10px 16px 12px;gap:16px}
.panel.active{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
.col{min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.stage{flex:1;min-height:0;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex}
.stage svg{width:100%;height:100%;display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card.fill{flex:1;min-height:0}
.card h2{font-size:19px;margin:6px 0 4px}
.card p{margin:0 0 8px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:99px;color:#fff;background:var(--red)}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.seg button:hover{border-color:var(--red)}
.seg button.on{background:var(--red);border-color:var(--red);color:#fff}
.btn{border:0;background:var(--red);color:#fff;border-radius:8px;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{background:#9c2630}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.ghost:hover{background:#fbeeee}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;margin:0 0 6px;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--red);background:#fdf6f6}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--green);background:#e9f6f0}
.opt.bad{border-color:var(--red);background:#fdeceb}
.fb{border-left:4px solid var(--teal);background:#eef6f8;padding:7px 11px;border-radius:0 8px 8px 0;margin:6px 0;font-size:13.5px}
.fb.good{border-color:var(--green);background:#e9f6f0}
.fb.bad{border-color:var(--red);background:#fdeceb}
.row{display:grid;grid-template-columns:118px 1fr 30px;align-items:center;gap:8px;margin:5px 0}
.row label{font-weight:600;font-size:13.5px}
.row output{font-weight:700;text-align:right}
input[type=range]{width:100%;accent-color:var(--red)}
.hot{cursor:pointer}
.hot:hover .hl{filter:brightness(1.1)}
.meter{height:12px;border-radius:99px;background:#ece7e1;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .5s}
.steps{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.scorebar{display:flex;gap:10px;align-items:center;justify-content:space-between}
@media (max-width:760px){
 .panel.active{display:flex;flex-direction:column;overflow-y:auto}
 .stage{flex:none;height:300px}
 .col{min-height:auto}
 .top .sub{display:none}
 .tabs{overflow-x:auto}
 .tab{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.quote{border-left:4px solid var(--teal);background:#eef6f8;padding:8px 12px;border-radius:0 10px 10px 0;margin:6px 0 8px}
.zone{font-weight:800;font-size:17px;margin:2px 0 4px}
.pr{margin:0 0 6px;padding:7px 11px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:13.5px}
</style>
</head>
<body>
<div class="app">
 <header class="top"><span class="pill">Week 6</span><h1>Motivational Interviewing Practice Studio</h1><span class="sub">PSYC 460 · Motivation</span></header>
 <nav class="tabs" role="tablist">
  <button class="tab on" role="tab" data-p="p1">Importance &amp; Confidence</button>
  <button class="tab" role="tab" data-p="p2">Name the Skill (OARS)</button>
  <button class="tab" role="tab" data-p="p3">Respond with MI Spirit</button>
 </nav>
 <section class="panel active" id="p1">
  <div class="col"><div class="stage" id="st1"></div></div>
  <div class="col">
   <div class="card"><div class="steps">Choose a client</div><div class="seg" id="cl" style="margin:5px 0 6px"></div><div class="quote" id="clq"></div>
    <div class="row"><label for="im">Importance</label><input type="range" id="im" min="0" max="10" value="4"><output id="oim">4</output></div>
    <div class="row"><label for="cf">Confidence</label><input type="range" id="cf" min="0" max="10" value="3"><output id="ocf">3</output></div>
   </div>
   <div class="card fill" aria-live="polite"><div class="zone" id="zn"></div><p class="small mut" id="zd" style="margin:0 0 8px"></p><div class="steps">Follow-up questions to try</div><div id="prs" style="margin-top:5px"></div></div>
  </div>
 </section>
 <section class="panel" id="p2">
  <div class="col"><div class="stage" id="st2"></div></div>
  <div class="col"><div class="card fill" id="q2" aria-live="polite"></div></div>
 </section>
 <section class="panel" id="p3">
  <div class="col"><div class="stage" id="st3"></div></div>
  <div class="col"><div class="card fill" id="q3" aria-live="polite"></div></div>
 </section>
</div>
<script>
const ICONS={
 drop:'<path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5Z"/>',
 shield:'<path d="M12 2.5 20 5.5V11c0 5-3.5 8.6-8 10.5C7.5 19.6 4 16 4 11V5.5Z"/>',
 heart:'<path d="M12 21S3 14.8 3 8.800A4.6 4.6 0 0 1 12 6.8 4.6 4.6 0 0 1 21 8.800C21 14.8 12 21 12 21Z"/>',
 star:'<path d="M12 2.5 14.9 8.8 21.8 9.5 16.6 14.1 18.2 21 12 17.4 5.8 21 7.4 14.1 2.2 9.5 9.1 8.800Z"/>',
 medal:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14 6.5 22 12 19.5 17.5 22 15.5 14"/>',
 trophy:'<path d="M7 3h10v5.500a5 5 0 0 1-10 0V3Z"/><path d="M7 5H3v2a4 4 0 0 0 4 4M17 5h4v2a4 4 0 0 1-4 4M12 13.500V17M8 21h8M9.5 17h5v4h-5z"/>',
 people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 2.8-6 6.5-6s6.5 2 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c3 0 5 1.5 5 5"/>',
 person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/>',
 crown:'<path d="M3 18 2.5 7 8 11.5 12 5l4 6.500L21.5 7 21 18Z"/>',
 gear:'<circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8" stroke-width="3.5" stroke-dasharray="2.6 2.470"/>',
 bolt:'<path d="M13 2 4 14h7l-1 8 10-13h-7Z"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
 target:'<circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.5"/>',
 chat:'<path d="M4 4h16v12H10l-5 4v-4H4Z"/>',
 help:'<circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.500a2.6 2.6 0 1 1 3.6 2.400c-.8.4-1.1 1-1.1 1.800M12 17.300v.2"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.1M3.5 12h.1M3.5 18h.1"/>',
 echo:'<path d="M4 8v8M8 5v14M12 9v6"/><path d="M16 8.500a5 5 0 0 1 0 7M19 5.500a9 9 0 0 1 0 13"/>',
 hand:'<path d="M12 21c-5-3.5-8-6.5-8-10.500A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 8 2.500c0 4-3 7-8 10.500Z"/>',
 check:'<path d="M4 12.5 9.5 18 20 6.5"/>',
 coin:'<circle cx="12" cy="12" r="9.5"/><path d="M14.5 9a2.5 2 0 0 0-2.5-1.500c-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2A2.6 2 0 0 1 9.5 15M12 6v1.500M12 16.500V18"/>',
 book:'<path d="M4 4.500A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2ZM4 20.500V4.5"/>',
 scale:'<path d="M12 3v18M6 21h12M5 7h14"/><path d="M5 7 2.5 14a3 3 0 0 0 5 0ZM19 7l-2.5 7a3 3 0 0 0 5 0Z"/>'
};
function icon(n,x,y,s,c,sw){return `<g transform="translate(${x-s/2},${y-s/2}) scale(${s/24})" fill="none" stroke="${c||'#fff'}" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</g>`}
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
function press(el,fn){el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e)}})}
function initTabs(){const tabs=$$('.tab'),panels=$$('.panel');tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.toggle('on',x===t);x.setAttribute('aria-selected',x===t)});panels.forEach(p=>p.classList.toggle('active',p.id===t.dataset.p))}))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wrap(t,n){const w=t.split(' ');const L=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>n){L.push(c);c=x}else c=(c+' '+x).trim()});if(c)L.push(c);return L}
function person(x,y,o){o=o||{};const s=o.s||1,sh=o.shirt||'#b5303a',hr=o.hair||'#3b2a20',sk=o.skin||'#f1c9a5',m=o.mood||'neutral';
 const mouth=m==='happy'?'M-8 8Q0 18 8 8':m==='sad'?'M-8 15Q0 7 8 15':'M-7 11H7';
 return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-36 104Q-36 42 0 40Q36 42 36 104Z" fill="${sh}"/><rect x="-8" y="26" width="16" height="18" rx="6" fill="${sk}"/><circle r="27" fill="${sk}"/><path d="M-28-2Q-30-32 0-32Q30-32 28-2Q19-17 0-17Q-19-17-28-2Z" fill="${hr}"/><circle cx="-9" cy="1" r="2.7" fill="#222"/><circle cx="9" cy="1" r="2.7" fill="#222"/><path d="${mouth}" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/></g>`}
function bubble(x,y,w,lines,o){o=o||{};const lh=o.lh||19,fs=o.fs||14,h=lines.length*lh+18;const tx=o.tail!=null?o.tail:x+w/2;
 const tail=`<path d="M${tx-9} ${y+h-1.5}L${tx+4} ${y+h+16}L${tx+12} ${y+h-1.5}Z" fill="#fff"/><path d="M${tx-9} ${y+h}L${tx+4} ${y+h+16}L${tx+12} ${y+h}" fill="none" stroke="#c9c2ba" stroke-width="1.5" stroke-linejoin="round"/>`;
 return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#fff" stroke="#c9c2ba" stroke-width="1.5"/>${tail}<text font-size="${fs}" fill="#222" text-anchor="middle">${lines.map((l,i)=>`<tspan x="${x+w/2}" y="${y+22+i*lh}">${l}</tspan>`).join('')}</text></g>`}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

initTabs();
/* ---- Ruler / quadrant ---- */
const CL=[
 {n:'Walking daily',q:'“My doctor wants me to walk every day. I guess it’s good for me, but I don’t know where I’d find the time.”',what:'walking daily',im:5,cf:3},
 {n:'Cutting back soda',q:'“I drink four sodas a day. My dentist keeps bringing it up, but honestly I love them.”',what:'cutting back on soda',im:3,cf:6},
 {n:'Studying regularly',q:'“I really need to pass this class to stay in the program, but every time I sit down to study I give up.”',what:'studying regularly',im:9,cf:2}
];
let cl=0;
function quad(im,cf){
 const X=70,Y=36,W=440,H=340,px=X+im/10*W,py=Y+H-cf/10*H;
 let o=`<svg viewBox="0 0 560 430" role="img" aria-label="Importance and confidence map">`;
 const zones=[[0,0,'#f7efd6','Explore what matters'],[1,0,'#fde8e6','Build confidence'],[0,1,'#eaf0f6','Low priority for now'],[1,1,'#e2f3ec','Ready to plan']];
 const labs={'0,0':['Low importance','Low confidence'],'1,0':['Build confidence','High importance · low confidence'],'0,1':['Explore importance','Low importance · high confidence'],'1,1':['Ready to plan','High importance · high confidence']};
 [[0,1,'#eaf0f6'],[1,1,'#e2f3ec'],[0,0,'#f7efd6'],[1,0,'#fde8e6']].forEach(z=>{
  const k=`${z[0]},${1-z[1]}`;const t=({'0,1':['Explore importance','confident, but not sure it matters'],'1,1':['Ready to plan','values it and feels able'],'0,0':['Explore ambivalence','doesn’t value it or feel able'],'1,0':['Build confidence','values it, doubts ability']})[`${z[0]},${z[1]}`];
  o+=`<rect x="${X+z[0]*W/2}" y="${Y+(1-z[1])*H/2}" width="${W/2}" height="${H/2}" fill="${z[2]}" stroke="#fff" stroke-width="3"/><text x="${X+z[0]*W/2+W/4}" y="${Y+(1-z[1])*H/2+H/4-4}" font-size="15" font-weight="700" fill="#444" text-anchor="middle">${t[0]}</text><text x="${X+z[0]*W/2+W/4}" y="${Y+(1-z[1])*H/2+H/4+14}" font-size="11.5" fill="#777" text-anchor="middle">${t[1]}</text>`});
 o+=`<path d="M${X} ${Y+H}H${X+W}M${X} ${Y+H}V${Y}" stroke="#666" stroke-width="2"/>`;
 for(let i=0;i<=10;i+=2){o+=`<text x="${X+i/10*W}" y="${Y+H+16}" font-size="11.5" fill="#666" text-anchor="middle">${i}</text><text x="${X-8}" y="${Y+H-i/10*H+4}" font-size="11.5" fill="#666" text-anchor="end">${i}</text>`}
 o+=`<text x="${X+W/2}" y="${Y+H+36}" font-size="14" font-weight="700" fill="#444" text-anchor="middle">Importance of change →</text><text transform="translate(18 ${Y+H/2}) rotate(-90)" font-size="14" font-weight="700" fill="#444" text-anchor="middle">Confidence →</text>`;
 o+=`<g style="transform:translate(${px}px,${py}px);transition:transform .5s cubic-bezier(.3,1.3,.5,1)"><circle r="22" fill="#b5303a" stroke="#fff" stroke-width="4"/>${icon('person',0,0,22,'#fff')}</g></svg>`;
 return o}
function zone(im,cf){
 if(im>=6&&cf>=6)return['Ready to plan','Importance and confidence are both high. Move toward a specific, person-chosen plan.'];
 if(im>=6)return['Build confidence','The change matters, but they doubt they can do it. Explore past successes and small steps.'];
 if(cf>=6)return['Explore importance','They feel able, but it isn’t a priority. Explore their values and what the change could offer.'];
 return['Explore ambivalence','Both are low. Roll with ambivalence, avoid pushing, and explore what matters to them.']}
function r1(){
 const im=+$('#im').value,cf=+$('#cf').value;$('#oim').textContent=im;$('#ocf').textContent=cf;
 $('#st1').innerHTML=quad(im,cf);
 const z=zone(im,cf);$('#zn').textContent=z[0];$('#zd').textContent=z[1];
 const w=CL[cl].what;
 const P=[];
 P.push(im===0?`“What would have to happen for ${w} to matter even a little?”`:im===10?`“What makes ${w} so important to you?”`:`“You said ${im}, and not ${Math.max(0,im-2)}. What makes it a ${im}?”`);
 P.push(im>=10?`“What would you most like to get out of ${w}?”`:`“What would it take to move from a ${im} to a ${Math.min(10,im+2)}?”`);
 P.push(cf===0?`“When have you made a change before, even a small one?”`:cf===10?`“What gives you so much confidence about ${w}?”`:`“You said ${cf} for confidence. What might help you feel more confident?”`);
 $('#prs').innerHTML=P.map(p=>`<div class="pr">${p}</div>`).join('');
}
$('#cl').innerHTML=CL.map((c,i)=>`<button data-i="${i}">${c.n}</button>`).join('');
$$('#cl button').forEach(b=>b.onclick=()=>{cl=+b.dataset.i;$$('#cl button').forEach(x=>x.classList.toggle('on',x===b));$('#clq').textContent=CL[cl].q;$('#im').value=CL[cl].im;$('#cf').value=CL[cl].cf;r1()});
['im','cf'].forEach(id=>$('#'+id).addEventListener('input',r1));
$('#cl button').click();
/* ---- OARS ---- */
const SK=[
 {id:'O',n:'Open question',icon:'help',color:'#1f7a8c',tip:'Invites more than a yes or no.'},
 {id:'A',n:'Affirmation',icon:'medal',color:'#d9a21f',tip:'Recognizes strengths and effort.'},
 {id:'R',n:'Reflection',icon:'echo',color:'#2c8a6e',tip:'Mirrors the meaning behind the words.'},
 {id:'S',n:'Summary',icon:'list',color:'#4a5a78',tip:'Pulls together what you’ve heard.'},
 {id:'X',n:'Advice / persuading',icon:'bolt',color:'#b5303a',tip:'The “righting reflex”: not MI-consistent.'}
];
const OS=[
 ['What would be different in your life if you cut back?','O','It starts with “what” and can’t be answered with yes or no.'],
 ['You showed up today even though you weren’t sure about this. That took courage.','A','It names a strength and an effort, with no “but”.'],
 ['You’re torn: part of you wants the energy, and part of you worries about the cost.','R','It restates the client’s ambivalence in your own words.'],
 ['You should just set an alarm and go to bed earlier.','X','Telling someone what to do is the righting reflex. MI evokes the person’s own reasons.'],
 ['So far you’ve told me mornings feel rushed, you’d like more time with your kids, and you’re unsure you can change your schedule.','S','It gathers several points the client made into one picture.'],
 ['Tell me more about what a good week would look like for you.','O','It invites a broad, open-ended answer.'],
 ['You’ve already tried three different approaches. That shows real persistence.','A','It highlights effort and character the client already shows.'],
 ['It sounds like being a present parent really matters to you.','R','It reflects a value underneath what was said.']
];
let oi=0,os=0,ofb='',oph='ask',otr=0,owr=[];
function r2(){
 const q=$('#q2');
 if(oi>=OS.length){q.innerHTML=`<span class="tag" style="background:var(--green)">Complete</span><h2>${os} of ${OS.length} on the first try</h2><p>${os>=7?'Excellent ear for the core skills.':'Listen for the shape of the sentence. A question asks, an affirmation praises, a reflection mirrors, a summary gathers, and advice directs.'}</p><button class="btn" id="r2b">Practice again</button>`;
  $('#st2').innerHTML=tiles(null,[],null,'');$('#r2b').onclick=()=>{oi=0;os=0;ofb='';oph='ask';otr=0;owr=[];r2()};return}
 const d=OS[oi];
 q.innerHTML=`<div class="scorebar"><span class="steps">Statement ${oi+1} of ${OS.length}</span><span class="steps">Score ${os}</span></div><h2 style="font-size:17px">What is the practitioner doing here?</h2><div class="quote">“${d[0]}”</div><p class="mut small">Click a skill tile on the left.</p>${ofb}${oph==='done'?`<button class="btn" id="n2">${oi===OS.length-1?'See results':'Next'}</button>`:''}`;
 $('#st2').innerHTML=tiles(d,owr,oph==='done'?d[1]:null,d[0]);
 $$('#st2 .hot').forEach(g=>press(g,()=>{if(oph==='done')return;pickO(g.dataset.id)}));
 const n=$('#n2');if(n)n.onclick=()=>{oi++;ofb='';oph='ask';otr=0;owr=[];r2()};
}
function tiles(d,wr,right,text){
 let o=`<svg viewBox="0 0 560 430" role="img" aria-label="OARS skill tiles">`;
 if(d){o+=bubble(40,16,480,wrap(text,52),{tail:420,fs:14.5,lh:20})+person(480,112,{shirt:'#4a5a78',mood:'neutral',s:.9})}
 else o+=icon('chat',280,90,60,'#b5303a',1.6);
 const pos=[[20,200],[195,200],[370,200],[100,308],[290,308]];
 SK.forEach((s,i)=>{const [x,y]=pos[i],w=170,h=96,bad=wr.includes(s.id),ok=right===s.id;
  o+=`<g class="hot" data-id="${s.id}" tabindex="0" role="button" aria-label="${s.n}" opacity="${bad?.4:1}"><rect class="hl" x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="${s.color}" stroke="${ok?'#222':'#fff'}" stroke-width="${ok?5:2}"/>${icon(s.icon,x+w/2,y+34,36,'#fff')}<text x="${x+w/2}" y="${y+66}" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">${s.n}</text><text x="${x+w/2}" y="${y+83}" font-size="10.5" fill="#fff" opacity=".9" text-anchor="middle">${s.tip.length>34?s.tip.slice(0,s.tip.lastIndexOf(' ',34))+'…':s.tip}</text></g>`});
 return o+'</svg>'}
function pickO(id){const d=OS[oi],s=SK.find(x=>x.id===id);
 if(id===d[1]){if(!otr)os++;oph='done';ofb=`<div class="fb good"><b>Yes: ${s.n}.</b> ${d[2]}</div>`}
 else{otr++;owr.push(id);ofb=`<div class="fb bad"><b>Not ${s.n}.</b> Look again at the form of the sentence. Try another tile.</div>`}
 r2()}

let ri=0,rap=40,rfb='',rph='ask',rord=[];
function heart(v){const s=0.5+v/100*0.45;return `<g transform="translate(280 352) scale(${s})"><path d="M0 40C0 40-64 -6-64 -46A32 32 0 0 1 0 -62 32 32 0 0 1 64 -46C64 -6 0 40 0 40Z" fill="#e6e0d8"/><clipPath id="hc"><rect x="-70" y="${40-(v/100)*110}" width="140" height="120"/></clipPath><path clip-path="url(#hc)" d="M0 40C0 40-64 -6-64 -46A32 32 0 0 1 0 -62 32 32 0 0 1 64 -46C64 -6 0 40 0 40Z" fill="#d34147" style="transition:all .5s"/></g><text x="280" y="418" font-size="13.5" font-weight="700" fill="#444" text-anchor="middle">Rapport · ${v}%</text>`}
function r3(){
 const q=$('#q3');
 if(ri>=RS.length){q.innerHTML=`<span class="tag" style="background:var(--green)">Session complete</span><h2>Rapport: ${rap}%</h2><p>${rap>=70?'Strong session. You partnered with the client and evoked their own reasons.':'Review the responses that gave advice or warnings, and try swapping each for a reflection plus an open question.'}</p><div class="limit fb good"><b>Spirit reminder:</b> collaboration, acceptance, compassion, evocation, and healthy change guide the technique.</div><p style="margin-top:12px"><button class="btn" id="r3b">Replay session</button></p>`;
  $('#st3').innerHTML=`<svg viewBox="0 0 560 430">${heart(rap)}</svg>`;$('#r3b').onclick=()=>{ri=0;rap=40;rfb='';rph='ask';r3()};return}
 const r=RS[ri];if(rph==='ask'&&!rord.length)rord=shuffle(r.opts);
 q.innerHTML=`<div class="scorebar"><span class="steps">Client ${ri+1} of ${RS.length}</span><span class="steps">Rapport ${rap}%</span></div><h2 style="font-size:17px">Choose the most MI-consistent response</h2>${rord.map((o,i)=>`<button class="opt ${rph==='done'?(o[2]==='mi'?'good':(o.picked?'bad':'')):''}" data-i="${i}" ${rph==='done'?'disabled':''}>“${o[0]}”</button>`).join('')}${rfb}${rph==='done'?`<button class="btn" id="n3">${ri===RS.length-1?'See results':'Next client'}</button>`:''}`;
 $('#st3').innerHTML=`<svg viewBox="0 0 560 430" role="img" aria-label="Client and rapport meter">${bubble(70,14,420,wrap(r.say,48),{tail:300,fs:14.5,lh:20})}${person(280,140,{shirt:r.shirt,mood:rph==='done'&&rap>=60?'happy':r.mood,s:.9})}${heart(rap)}</svg>`;
 $$('#q3 .opt').forEach(b=>b.onclick=()=>{const o=rord[+b.dataset.i];o.picked=true;rap=clamp(rap+o[1],0,100);rph='done';rfb=`<div class="fb ${o[2]==='mi'?'good':o[2]==='c'?'':'bad'}"><b>${o[2]==='mi'?'MI-consistent':o[2]==='c'?'Neutral':'Righting reflex'}.</b> ${o[3]}</div>`;r3()});
 const n=$('#n3');if(n)n.onclick=()=>{ri++;rfb='';rph='ask';rord=[];r3()};
}
