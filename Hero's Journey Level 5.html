<title>Hero's Journey Level 5</title>

<style>
/* Layout: one centered column. A pixel-art scene on top shows the hero walking toward the library tower; each quest is a bordered panel below it. */
:root{
  --bg:#0c0d2b; --bg2:#161849;
  --panel:#1f2263; --panel2:#171a52;
  --line:#4f5bd5;
  --gold:#ffd24a; --gold-deep:#d9a326;
  --pink:#ff5c8a; --mint:#3fe0b5;
  --ink:#f4f4ff; --muted:#b7bbea; --navy:#16183f;
  --ok:#3fe0b5; --warn:#ff9b6b;
  --pixel:'Press Start 2P',ui-monospace,Menlo,monospace;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding-block:24px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  color:var(--ink);
  font-family:var(--body); font-size:18px; line-height:1.55;
  background:
    radial-gradient(1.5px 1.5px at 22px 40px,rgba(255,255,255,.75) 50%,transparent 52%),
    radial-gradient(1px 1px at 120px 96px,rgba(255,255,255,.55) 50%,transparent 52%),
    radial-gradient(1.5px 1.5px at 70px 170px,rgba(255,210,74,.6) 50%,transparent 52%),
    radial-gradient(1px 1px at 210px 30px,rgba(255,255,255,.5) 50%,transparent 52%),
    linear-gradient(180deg,#0b0c2a 0%,#14164a 100%);
  background-size:230px 220px,170px 190px,310px 260px,260px 150px,auto;
  background-color:var(--bg);
}
.wrap{max-width:952px;margin:0 auto;display:grid;gap:24px}
.wrap>*{min-width:0}

/* Scene */
.scene{border:4px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.42);background:#1a1c5c;line-height:0}
.scene svg{display:block;width:100%;height:auto}
#hero{transition:transform 1.2s cubic-bezier(.45,.05,.3,1)}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}

/* Type */
.center{display:grid;justify-items:center;text-align:center;gap:14px}
.label{font-family:var(--pixel);font-size:12px;letter-spacing:.08em;color:var(--mint);margin:0;text-transform:uppercase}
.title{margin:2px 0 0;font-family:var(--pixel);font-weight:400;font-size:clamp(20px,5.6vw,44px);line-height:1.25;letter-spacing:.02em;color:#fff;text-shadow:3px 3px 0 var(--pink),6px 6px 0 #0a0b24}
.level{margin:6px 0 0;font-family:var(--pixel);font-weight:400;font-size:clamp(11px,2.7vw,20px);line-height:1.6;letter-spacing:.06em;color:var(--gold);text-wrap:balance}
.lede{margin:0;max-width:30ch;font-size:19px}

/* Buttons */
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:12px;
  font-family:var(--pixel);font-size:clamp(12px,3.4vw,17px);letter-spacing:.06em;color:var(--navy);
  background:var(--gold);padding:18px 28px;border-radius:12px;box-shadow:0 6px 0 var(--gold-deep);
  transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 7px 0 var(--gold-deep)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--gold-deep)}
.btn:disabled{opacity:.5;cursor:default;color:var(--navy)}
.btn.ghost{background:transparent;color:var(--gold);border:3px solid var(--gold);box-shadow:none;padding:12px 18px;font-size:12px}
.btn.ghost:hover:not(:disabled){background:rgba(255,210,74,.12);transform:none;box-shadow:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* Panels */
.panel{border:3px solid var(--line);border-radius:20px;background:var(--panel);padding:22px}
.how h3,.sub{margin:0 0 14px;font-family:var(--pixel);font-weight:400;font-size:13px;color:var(--gold);letter-spacing:.04em}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.steps li{display:flex;gap:14px;align-items:center}
.steps .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-family:var(--pixel);font-size:12px}
.fine{margin:14px 0 0;color:var(--muted);font-size:16px}

.quest{display:grid;gap:18px}
.quest>*{min-width:0}
.hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.pips{display:flex;gap:6px}
.pip{width:24px;height:10px;border-radius:3px;background:rgba(255,255,255,.18)}
.pip.done{background:var(--gold)} .pip.now{background:var(--mint)}
.pts{font-family:var(--pixel);font-size:11px;color:var(--gold);letter-spacing:.04em}
.pts b{font-weight:400;color:#fff;margin-left:6px;display:inline-block}
.pts b.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.6);color:var(--mint)}}
.qtitle{margin:0;font-family:var(--pixel);font-weight:400;font-size:clamp(12px,2.5vw,18px);line-height:1.6;letter-spacing:.03em;color:#fff;text-wrap:balance}
.chip{margin:0;justify-self:start;font-family:var(--pixel);font-size:10px;letter-spacing:.06em;color:var(--navy);background:var(--mint);padding:6px 10px;border-radius:6px}
.story{margin:0;font-size:19px}
.prompt{margin:0;color:var(--gold);font-weight:800}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.card{appearance:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;
  background:var(--panel2);border:3px solid var(--line);border-radius:16px;padding:16px;
  display:grid;gap:10px;align-content:start;box-shadow:0 5px 0 rgba(0,0,0,.35);
  transition:transform .15s,border-color .15s,opacity .2s}
.card:hover:not(:disabled){transform:translateY(-3px);border-color:var(--gold)}
.card:disabled{cursor:default;opacity:.4;color:var(--ink)}
.card.picked:disabled{opacity:1;border-color:var(--gold);background:#2b2f7d}
.ctop{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.badge-l{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-family:var(--pixel);font-size:11px}
.spr{color:var(--gold);display:block}
.ctitle{font-weight:800;font-size:18px;line-height:1.25}
.cdesc{color:var(--muted);font-size:16px;line-height:1.4}

/* Story beats */
.beat{border:2px solid rgba(255,255,255,.22);border-radius:14px;background:rgba(255,255,255,.06);padding:14px 16px;display:grid;gap:6px}
.beat .label{font-size:10px}
.beat p{margin:0}
.scroll{border:2px dashed var(--gold);border-radius:14px;background:rgba(255,210,74,.08);padding:14px 16px;display:grid;gap:6px}
.scroll .label{color:var(--gold);font-size:10px}
.scroll q{font-style:italic;quotes:none}
.scroll .ref{color:var(--muted);font-size:15px;margin:0}
.qa{display:grid;gap:12px}
.qtext{margin:0;font-weight:800;font-size:19px}
.opts{display:grid;gap:10px}
.opt{appearance:none;font:inherit;font-size:17px;color:var(--ink);text-align:left;cursor:pointer;width:100%;
  background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:13px 16px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.correct{border-color:var(--ok);background:rgba(63,224,181,.14)}
.opt.correct::before{content:"\2713  ";color:var(--ok);font-weight:800}
.opt.wrong{border-color:var(--warn);background:rgba(255,155,107,.12);opacity:.85}
.opt.wrong::before{content:"\2715  ";color:var(--warn);font-weight:800}
.opt.picked{border-color:var(--gold);background:#2b2f7d}
.opts.locked .opt:not(.correct):not(.picked){opacity:.5}
.fb{border:2px solid;border-radius:12px;padding:12px 14px;font-size:17px}
.fb.ok{border-color:var(--ok);background:rgba(63,224,181,.1)}
.fb.no{border-color:var(--warn);background:rgba(255,155,107,.1)}
.fb b{font-weight:800}
.actions{display:flex;justify-content:center;padding-top:6px}

/* Results */
.res{display:grid;gap:22px}
.res>*{min-width:0}
.hero-res{display:grid;justify-items:center;text-align:center;gap:14px}
.stars{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.stars .off .spr{color:rgba(255,255,255,.2)}
.big{font-family:var(--pixel);font-size:clamp(18px,4.6vw,30px);color:#fff;margin:0;text-shadow:3px 3px 0 var(--pink)}
.rank{font-family:var(--pixel);font-size:clamp(11px,2.6vw,16px);color:var(--gold);margin:0;line-height:1.6}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.bdg{display:flex;gap:14px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--panel2)}
.bdg .spr{flex:none;margin-top:2px}
.bdg strong{display:block;font-weight:800}
.bdg span{color:var(--muted);font-size:16px;line-height:1.4;display:block}
.habit{margin:0;text-align:center}
.habit b{color:var(--gold)}
.next{border:3px solid var(--gold);border-radius:20px;background:#2a2c73;padding:20px 22px;display:grid;gap:8px}
.next .label{color:var(--gold)}
.next p{margin:0;font-size:20px;font-weight:600}

.reveal{animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:480px){
  .panel{padding:18px 16px}
  .story,.lede{font-size:18px}
}
</style>

    <svg viewBox="0 0 950 335" role="img" aria-label="A hero carrying a lantern walks a winding road toward a glowing library tower at sunset.">
      <defs>

  </div>

</main>

<script>
(function(){
  var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var screen = document.getElementById('screen');
  var hero = document.getElementById('hero');
  var road = document.getElementById('road');
  var roadLen = road.getTotalLength();
  var state = {points:0, habit:''};
  var TRI = '<svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><polygon points="0,0 14,8 0,16" fill="currentColor"/></svg>';

  function h(tag, cls, html){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function shuffle(a){
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function look(el){
    try { el.scrollIntoView({behavior: RM ? 'auto' : 'smooth', block: 'nearest'}); } catch(e) {}
  }

  /* Stars */
  (function(){
    var s = 7, out = '';
    function rnd(){ s = (s * 16807) % 2147483647; return s / 2147483647; }
    for (var i = 0; i < 70; i++) {
      var x = (rnd() * 950).toFixed(1), y = (rnd() * 190).toFixed(1), r = (0.7 + rnd() * 1.3).toFixed(1), o = (0.4 + rnd() * 0.6).toFixed(2);
      out += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fff" opacity="' + o + '"' + (i % 7 === 0 ? ' class="tw"' : '') + '/>';
    }
    document.getElementById('stars').innerHTML = out;
  })();

  /* Pixel sprites */
  var SPR = {
    bolt:   ['.....##.','....##..','...##...','..#####.','....##..','...##...','..##....','.#......'],
    magnify:['.####...','#....#..','#....#..','#....#..','.####...','.....##.','......##','.......#'],
    book:   ['.####.####.','#...#.#...#','#...#.#...#','#...#.#...#','#...#.#...#','.####.####.'],
    shield: ['########','#oooooo#','#oooooo#','#oooooo#','.#oooo#.','..#oo#..','...##...'],
    chat:   ['.######.','#......#','#......#','#......#','.######.','..##....','.#......'],
    star:   ['...#...','..###..','#######','.#####.','..###..','.##.##.','.#...#.']
  };
  function sprite(name, size){
    var rows = SPR[name], w = rows[0].length, hh = rows.length, r = '';
    for (var y = 0; y < hh; y++) {
      for (var x = 0; x < w; x++) {
        var c = rows[y].charAt(x);
        if (c === '#') r += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="currentColor"/>';
        else if (c === 'o') r += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#3fe0b5"/>';
      }
    }
    return '<svg class="spr" viewBox="0 0 ' + w + ' ' + hh + '" width="' + (w * size) + '" height="' + (hh * size) + '" shape-rendering="crispEdges" aria-hidden="true">' + r + '</svg>';
  }

  /* Hero movement */
  function moveHero(p, instant){
    var pt = road.getPointAtLength(Math.max(0, Math.min(1, p)) * roadLen);
    if (instant) hero.style.transition = 'none';
    hero.style.transform = 'translate(' + pt.x.toFixed(1) + 'px,' + (pt.y + 3).toFixed(1) + 'px)';
    if (instant) { void hero.getBoundingClientRect(); hero.style.transition = ''; }
  }

  /* Content */
  var Q = [
    {
      title: 'THE RUMOR AT THE CROSSROADS',
      skill: 'Critical Thinking',
      story: 'At a crossroads, a glowing sign flashes: “BRIDGE TO THE TOWER IS CLOSED! Turn back and TELL EVERYONE!” No one signed it. Travelers are already rushing away and passing the news along.',
      cards: [
        {icon:'bolt', title:'Spread the word', desc:'Share it right away so no one gets stuck.',
         out:'You pass the news along fast. Soon a traveler tells you the bridge was open all along. The rumor moved faster than the truth, and you helped it travel.'},
        {icon:'magnify', title:'Pause and investigate', desc:'Ask who posted it and why.',
         out:'You stop and look closer. The sign has no author, no date, and no proof. That is your first clue that something is off.'},
        {icon:'chat', title:'Ask fellow travelers', desc:'See what others have heard.',
         out:'You ask around. Everyone heard it from someone else, and no one saw the bridge. When nobody can point to the original source, the story may only be an echo.'}
      ],
      checks: [
        {q:'Which question best helps you decide whether to trust the sign?',
         a:'Who made this, and what do they want me to believe?',
         w:['How many travelers have already shared it?','Does it look urgent and official?'],
         hint:'Popularity and urgency are easy to fake. Look for a clue that points back to the source.',
         why:'Knowing who made a message, and why, is the first clue to whether you can trust it. Crowds and urgent colors can be used to pressure you.'},
        {q:'The sign makes you feel alarmed and says “share fast.” What should that feeling tell you?',
         a:'Slow down and verify before sharing',
         w:['The message must be true','Act right away and check later'],
         hint:'Messages built to spark strong feelings often want you to act before you think.',
         why:'Strong emotion is a signal to pause. Checking first protects you and the people you might share with.'}
      ]
    },
    {
      title: 'THE FACT-CHECK FORGE',
      skill: 'Fact-Checking',
      story: 'In the forge, a glowing scroll claims: “Students who study at midnight score 40% higher on exams!” It has bright charts, a confident tone, and no listed author. The claim could change your study plan, if it is true.',
      cards: [
        {icon:'bolt', title:'Trust the charts', desc:'They look official, so it must be right.',
         out:'Charts can look official without being accurate. Anyone can make one, and a chart does not show where its numbers came from.'},
        {icon:'magnify', title:'Open new tabs', desc:'See what other sources say about this site and this claim.',
         out:'You leave the scroll and search for the site and the study in new tabs. Fact-checkers call this lateral reading, and it can answer in minutes what staring at one page never will.'},
        {icon:'book', title:'Keep reading the scroll', desc:'Read every word on the page to be sure.',
         out:'You read the whole scroll twice, but the page only tells its own side. To judge it, you need to step away and compare it with other sources.'}
      ],
      checks: [
        {q:'What is lateral reading?',
         a:'Leaving the page to see what other trustworthy sources say about it',
         w:['Reading a page slowly from top to bottom','Reading only the headline and the charts'],
         hint:'Think about where you go while you read, not how fast you read.',
         why:'Lateral reading means opening new tabs to find out who is behind a source and what others say about it.'},
        {q:'The scroll says “a study found” this result. What is your best next step?',
         a:'Find the original study and check who ran it and what it actually found',
         w:['Trust it because it mentions a study','Count how many people shared it'],
         hint:'Mentioning a study is not the same as showing the study.',
         why:'Claims can drift from what research really said. Tracing a claim back to the original is a core fact-checking move.'}
      ]
    },
    {
      title: 'THE LIBRARY VAULT',
      skill: 'Library Research',
      story: 'You need a reliable article about sleep and learning for a class. Behind you is a wide road of search results. Ahead is the vault: your university library, with research databases that hold scholarly articles.',
      cards: [
        {icon:'bolt', title:'Click the first result', desc:'Search the open web and trust the top link.',
         out:'The top results are a mix of ads, opinion posts, and a few useful pages. Search engines rank by many things, and being accurate is not guaranteed.'},
        {icon:'book', title:'Enter the library vault', desc:'Use the university library databases.',
         out:'You unlock the vault. Library databases collect articles from published sources, and you can narrow results by date, subject, or peer-reviewed. Library staff can help if you get stuck.'},
        {icon:'chat', title:'Ask a forum', desc:'Post your question and see who answers.',
         out:'A few people reply, but you cannot tell who they are or what they know. A forum can spark questions, but it is not a source to rely on for coursework.'}
      ],
      checks: [
        {q:'Why can library databases be better for coursework than a general internet search?',
         a:'They offer articles from published, often peer-reviewed sources, and let you filter results',
         w:['They only show articles that agree with you','They always give the shortest answer'],
         hint:'Think about what published sources and filters give you.',
         why:'Databases let you narrow by date, subject, and source type, and their articles come from published sources.'},
        {q:'You found an article. Which clues help you judge it?',
         a:'The author, where it was published, and the evidence it uses',
         w:['Only the title','Only how many pages it has'],
         hint:'Look for who wrote it, who published it, and what backs it up.',
         why:'Author, publication, and supporting evidence are the core clues for judging whether a source is credible.'}
      ]
    },
    {
      title: 'YOUR AI COMPANION',
      skill: 'Using AI Wisely',
      story: 'An AI companion joins your quest and answers in seconds. It gives you a confident answer about sleep and memory and names a source. You search for that source and cannot find it anywhere.',
      cards: [
        {icon:'bolt', title:'Paste it in my paper', desc:'It sounded sure, so use it as is.',
         out:'Risky. AI can give answers that sound sure but are wrong, including sources that do not exist. Your paper would carry that mistake with your name on it.'},
        {icon:'magnify', title:'Verify first', desc:'Check the source in the library, then explain it in your own words.',
         out:'You search the library and find that the real research says something different from the AI. Checking saved you from an error.'},
        {icon:'book', title:'Use it as a study partner', desc:'Brainstorm and practice, then check the facts yourself.',
         out:'You ask your companion to explain ideas and quiz you, then confirm the facts in reliable sources. Your own thinking stays in charge.'}
      ],
      checks: [
        {q:'Your AI companion gave a confident answer and named a source you cannot find. What might be going on?',
         a:'AI can sound sure and still be wrong, even citing sources that do not exist',
         w:['The source must be too new to search for','AI is always right, so the library must be outdated'],
         hint:'A confident tone is not the same as accuracy.',
         why:'AI tools can make errors, including invented citations. Always verify in reliable sources.'},
        {q:'Which is a responsible way to use AI for coursework?',
         a:'Brainstorm and practice with it, verify facts in reliable sources, and follow your instructor’s guidelines on AI',
         w:['Let it write the assignment and submit it as yours','Skip checking its answers to save time'],
         hint:'Responsible use keeps your thinking and your honesty in charge.',
         why:'AI can support your learning, but your work and your judgment must stay your own. Check your course and university guidelines for what is allowed.'}
      ]
    },
    {
      title: 'THE HONEST HERO',
      skill: 'Integrity and Academic Honesty',
      story: 'The deadline is close and the night is long. You found a paragraph online that says exactly what you want to say. No one would ever know if you used it as your own.',
      scroll: {text:'The Lord detests lying lips, but he delights in people who are trustworthy.', ref:'Proverbs 12:22 (NIV)', note:'Seeking truth is more than finding right answers. It is also becoming someone others can trust.'},
      cards: [
        {icon:'bolt', title:'Copy it quietly', desc:'No one is watching.',
         out:'You would save a few minutes and lose something bigger: your own voice and your reputation. Using someone’s words without credit is plagiarism, even when no one notices.'},
        {icon:'shield', title:'Use my own words and give credit', desc:'Explain the idea yourself and name the source.',
         out:'You put the idea in your own words and credit the author. It takes longer, but the work is truly yours and others can find the source.'},
        {icon:'chat', title:'Ask for help', desc:'Reach out to your Success Coach or instructor.',
         out:'You message your instructor and your Success Coach. They help you plan the time you have left. Asking for help is part of a strong alliance.'}
      ],
      checks: [
        {q:'Why does academic honesty matter on a quest for truth?',
         a:'It builds trust and shows the work is truly yours',
         w:['It only matters if someone might catch you','It only matters in writing classes'],
         hint:'Think about what honesty builds over time.',
         why:'Honesty builds trust, in school and in life. When you credit sources and use your own words, others can rely on your work.'},
        {reflect:true, q:'Which truth-seeker habit will you carry forward first?',
         opts:['Pause before I share','Check the source','Search the library first','Verify what AI tells me','Do my own honest work'],
         why:'Great pick. Keep it in mind, because you will use it soon.'}
      ]
    }
  ];
  var MAX = 0;
  Q.forEach(function(qq){ qq.checks.forEach(function(c){ if (!c.reflect) MAX++; }); });

  /* Screens */
  function start(){
    state.points = 0; state.habit = '';
    moveHero(0.12, true);
    screen.innerHTML = '';
    var top = h('div', 'center reveal',
      '<p class="label">ISTU 101</p>' +
      '<h1 class="title">HERO’S JOURNEY</h1>' +
      '<h2 class="level">LEVEL 5: THE QUEST FOR TRUTH</h2>' +
      '<p class="lede">Not every answer on the road is true. A wise hero learns to ask questions, check sources, and seek the truth.</p>');
    var go = h('button', 'btn', TRI + '<span>PRESS START</span>');
    go.type = 'button';
    go.onclick = function(){ quest(0); };
    top.appendChild(go);
    var how = h('section', 'panel how reveal',
      '<h3>How to play</h3>' +
      '<ol class="steps">' +
      '<li><span class="n">1</span><span>Tap or click a card to make your choice.</span></li>' +
      '<li><span class="n">2</span><span>Answer a few short questions about your choice.</span></li>' +
      '<li><span class="n">3</span><span>Press the yellow button to keep going.</span></li>' +
      '</ol>' +
      '<p class="fine">There are 5 quests and it takes about 10 minutes. Finish all 5, then continue to this week’s discussion.</p>');
    screen.appendChild(top);
    screen.appendChild(how);
  }

  function nextBtn(label, fn){
    var wrap = h('div', 'actions reveal');
    var b = h('button', 'btn', '<span>' + label + '</span>' + TRI);
    b.type = 'button';
    b.onclick = function(){ b.disabled = true; fn(); };
    wrap.appendChild(b);
    return wrap;
  }

  function quest(i){
    var d = Q[i];
    screen.innerHTML = '';
    window.scrollTo({top: 0, behavior: RM ? 'auto' : 'smooth'});
    var pips = '';
    for (var k = 0; k < Q.length; k++) pips += '<span class="pip ' + (k < i ? 'done' : (k === i ? 'now' : '')) + '"></span>';
    var p = h('section', 'panel quest reveal',
      '<div class="hud"><p class="label" style="margin:0">QUEST ' + (i + 1) + ' OF ' + Q.length + '</p>' +
      '<div class="pips" role="img" aria-label="Quest ' + (i + 1) + ' of ' + Q.length + '">' + pips + '</div>' +
      '<div class="pts">TRUTH POINTS<b id="pts">' + state.points + '</b></div></div>' +
      '<h2 class="qtitle">' + d.title + '</h2>' +
      '<p class="chip">SKILL: ' + d.skill.toUpperCase() + '</p>' +
      '<p class="story">' + d.story + '</p>' +
      '<p class="prompt">Tap a card to make your choice.</p>');
    var cards = h('div', 'cards');
    var flow = h('div', 'qa');
    flow.setAttribute('aria-live', 'polite');
    var letters = ['A', 'B', 'C'];
    var btns = [];
    d.cards.forEach(function(c, ci){
      var b = h('button', 'card',
        '<span class="ctop"><span class="badge-l">' + letters[ci] + '</span>' + sprite(c.icon, 5) + '</span>' +
        '<span class="ctitle">' + c.title + '</span>' +
        '<span class="cdesc">' + c.desc + '</span>');
      b.type = 'button';
      b.onclick = function(){
        btns.forEach(function(x){ x.disabled = true; });
        b.classList.add('picked');
        b.setAttribute('aria-pressed', 'true');
        var out = h('div', 'beat reveal', '<p class="label">WHAT HAPPENS</p><p>' + c.out + '</p>');
        flow.appendChild(out);
        if (d.scroll) {
          flow.appendChild(h('div', 'scroll reveal',
            '<p class="label">WISDOM SCROLL</p><q>“' + d.scroll.text + '”</q><p class="ref">' + d.scroll.ref + '</p><p style="margin:0">' + d.scroll.note + '</p>'));
        }
        look(out);
        ask(i, 0, flow);
      };
      btns.push(b);
      cards.appendChild(b);
    });
    p.appendChild(cards);
    p.appendChild(flow);
    screen.appendChild(p);
  }

  function ask(i, j, flow){
    var d = Q[i], c = d.checks[j], n = d.checks.length;
    var blk = h('div', 'qa reveal');
    blk.appendChild(h('p', 'label', c.reflect ? 'YOUR PLEDGE' : 'QUICK CHECK ' + (j + 1) + ' OF ' + n));
    blk.appendChild(h('p', 'qtext', c.q));
    var opts = h('div', 'opts');
    var list = c.reflect ? c.opts.map(function(t){ return {t: t, ok: false}; })
                         : shuffle([{t: c.a, ok: true}].concat(c.w.map(function(t){ return {t: t, ok: false}; })));
    var fb = h('div');
    fb.setAttribute('aria-live', 'polite');
    var wrongTry = false;
    var all = [];
    function finish(){
      var last = j === n - 1;
      var isLastQuest = i === Q.length - 1;
      var label = !last ? 'NEXT QUESTION' : (isLastQuest ? 'SEE RESULTS' : 'CONTINUE');
      var nb = nextBtn(label, function(){
        if (!last) ask(i, j + 1, flow);
        else if (!isLastQuest) { moveHero(0.12 + 0.78 * ((i + 1) / Q.length)); setTimeout(function(){ quest(i + 1); }, RM ? 0 : 450); }
        else { moveHero(0.92); results(); }
      });
      blk.appendChild(nb);
      look(nb);
    }
    list.forEach(function(o){
      var b = h('button', 'opt');
      b.type = 'button';
      b.textContent = o.t;
      all.push(b);
      b.onclick = function(){
        if (c.reflect) {
          state.habit = o.t;
          all.forEach(function(x){ x.disabled = true; });
          b.classList.add('picked');
          opts.classList.add('locked');
          fb.className = 'fb ok reveal';
          fb.innerHTML = '<b>Pledge made.</b> ' + c.why;
          finish();
        } else if (o.ok) {
          if (!wrongTry) {
            state.points++;
            var pe = document.getElementById('pts');
            if (pe) { pe.textContent = state.points; pe.classList.remove('pop'); void pe.offsetWidth; pe.classList.add('pop'); }
          }
          all.forEach(function(x){ x.disabled = true; });
          b.classList.add('correct');
          opts.classList.add('locked');
          fb.className = 'fb ok reveal';
          fb.innerHTML = '<b>' + (wrongTry ? 'You got it.' : 'Correct! +1 Truth Point.') + '</b> ' + c.why;
          finish();
        } else {
          wrongTry = true;
          b.disabled = true;
          b.classList.add('wrong');
          fb.className = 'fb no reveal';
          fb.innerHTML = '<b>Not quite.</b> ' + c.hint + ' Try another answer.';
        }
      };
      opts.appendChild(b);
    });
    blk.appendChild(opts);
    blk.appendChild(fb);
    flow.appendChild(blk);
    look(blk);
  }

  function results(){
    screen.innerHTML = '';
    window.scrollTo({top: 0, behavior: RM ? 'auto' : 'smooth'});
    var pts = state.points;
    var rank, msg;
    if (pts >= MAX - 1) { rank = 'RANK: TRUTH SEEKER'; msg = 'You spotted the clues like a pro.'; }
    else if (pts >= 5) { rank = 'RANK: TRAIL SCOUT'; msg = 'Strong instincts. Look back over this week’s readings for the clues you missed.'; }
    else { rank = 'RANK: APPRENTICE SEEKER'; msg = 'Every seeker starts here. Review this week’s readings, then try the quests again.'; }
    var stars = '';
    for (var k = 0; k < MAX; k++) stars += '<span class="' + (k < pts ? 'on' : 'off') + '">' + sprite('star', 4) + '</span>';
    var wrap = h('section', 'panel res reveal');
    wrap.appendChild(h('div', 'hero-res',
      '<p class="label">LEVEL 5 COMPLETE</p>' +
      '<h2 class="big">TRUTH POINTS ' + pts + '/' + MAX + '</h2>' +
      '<div class="stars" role="img" aria-label="' + pts + ' of ' + MAX + ' stars">' + stars + '</div>' +
      '<p class="rank">' + rank + '</p>' +
      '<p style="margin:0;max-width:44ch">' + msg + '</p>'));
    var replay = h('div', 'actions');
    var rb = h('button', 'btn ghost', 'PLAY AGAIN');
    rb.type = 'button';
    rb.onclick = start;
    replay.appendChild(rb);
    wrap.appendChild(replay);

    var kit = h('div');
    kit.appendChild(h('h3', 'sub', 'Your Truth Seeker toolkit'));
    var bd = h('div', 'badges');
    [
      ['chat', 'Pause and Question', 'Check who made it and why before you share.'],
      ['magnify', 'Lateral Reading', 'Leave the page and see what other sources say.'],
      ['book', 'Library Vault Key', 'Use databases, and judge the author, publication, and evidence.'],
      ['bolt', 'AI Reality Check', 'Verify what AI tells you and follow your instructor’s guidelines.'],
      ['shield', 'Honest Hero', 'Do your own work and give credit.']
    ].forEach(function(b){
      bd.appendChild(h('div', 'bdg', sprite(b[0], 4) + '<div><strong>' + b[1] + '</strong><span>' + b[2] + '</span></div>'));
    });
    kit.appendChild(bd);
    wrap.appendChild(kit);

    if (state.habit) {
      wrap.appendChild(h('p', 'habit', 'The habit you pledged to carry forward: <b>' + state.habit + '</b>'));
    }

    wrap.appendChild(h('div', 'scroll',
      '<p class="label">WISDOM SCROLL</p>' +
      '<q>“Jesus answered, ‘I am the way and the truth and the life. No one comes to the Father except through me.’”</q>' +
      '<p class="ref">John 14:6 (NIV)</p>' +
      '<p style="margin:0">As you move on, think about how your faith or values shape what you seek, and why you seek it.</p>'));

    wrap.appendChild(h('div', 'next',
      '<p class="label">NEXT QUEST</p>' +
      '<p>You will use what you learned here and put it into the assignment titled “Level Up Project.”</p>'));
    screen.appendChild(wrap);
  }

  start();
})();
</script>

</body></html>
