<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORGS 520 Week 3: Cultural intelligence and diversity paradigms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1e2230; --ink2:#4a5063; --line:#d9dce3; --wash:#f3f4f7; --paper:#ffffff;
  --brand:#d34147; --brand-d:#a8353a; --brand-t:#fbe9ea;
  --teal:#1f7a80; --teal-t:#e1f1f2; --plum:#5b4b8a; --plum-t:#ece8f6;
  --gold:#d9980f; --gold-t:#fcf1d6; --sky:#2f6fb3; --sky-t:#e2eef9;
  --good:#1d7a4d; --good-t:#e1f3e9; --bad:#b3341f; --bad-t:#fdeae6;
  --accent:var(--teal); --accent-t:var(--teal-t);
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.45}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:var(--ink);color:#fff}
.top h1{margin:0;font:700 19px/1.15 var(--head);letter-spacing:.1px}
.top .course{font-size:12.5px;color:#c9cde0;margin-top:2px}
.wk{flex:none;background:var(--brand);color:#fff;font:700 14px var(--head);padding:6px 13px;border-radius:999px}
.stage{display:grid;grid-template-columns:minmax(260px,43%) minmax(0,1fr);min-height:0}
.art{background:var(--accent-t);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;border-right:1px solid var(--line)}
.art{justify-content:center}
.art svg{width:100%;height:auto;min-height:0;flex:0 1 auto;max-height:100%}
.work{padding:14px 20px 14px;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);flex:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:7px 12px;font:700 14px var(--head);color:var(--ink2);cursor:pointer;border-radius:6px 6px 0 0}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brand)}
.tab:hover{background:var(--wash)}
.pane{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.pane[hidden]{display:none}
h2{margin:0;font:700 18px/1.2 var(--head)}
p{margin:0}
.lede{color:var(--ink2);font-size:14.5px}
.btn{appearance:none;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:700 14.5px var(--head);padding:9px 14px;border-radius:8px;cursor:pointer;text-align:left;transition:transform .12s,background .12s}
.btn:hover:not(:disabled){background:var(--wash)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;text-align:center}
.btn.primary:hover:not(:disabled){background:var(--brand-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:var(--line);color:var(--ink2)}
.btn.good{background:var(--good-t);border-color:var(--good)}
.btn.bad{background:var(--bad-t);border-color:var(--bad)}
.btn small{display:block;font:400 13px var(--body);color:var(--ink2);margin-top:2px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.fb{border-left:5px solid var(--line);background:var(--wash);padding:9px 12px;border-radius:0 8px 8px 0;font-size:14px}
.fb.good{border-color:var(--good);background:var(--good-t)}
.fb.bad{border-color:var(--bad);background:var(--bad-t)}
.fb.info{border-color:var(--accent);background:var(--accent-t)}
.fb b{font-family:var(--head)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
.meter .bar{height:10px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.cur{outline:2px solid var(--ink);outline-offset:1px}
.card{border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper)}
.quote{font:600 17px/1.35 var(--head)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  html,body{overflow:auto;height:auto}
  .app{height:auto;display:block;border-radius:0;border-left:0;border-right:0}
  .stage{display:block}
  .art{border-right:0;border-bottom:1px solid var(--line)}
  .art svg{max-height:230px}
  .top h1{font-size:16px}
}

.opts{display:grid;gap:8px}
.opts .btn{font-size:14px;padding:9px 12px;font-weight:600}
.dim{font:700 15px var(--head);display:flex;gap:8px;align-items:center}
.dim i{width:12px;height:12px;border-radius:50%;display:inline-block}
.def{font-size:13px;color:var(--ink2);margin-top:-4px}
.scen{font-size:15px}
.res{display:grid;gap:8px}
.res .r{display:grid;grid-template-columns:104px 1fr 34px;gap:8px;align-items:center;font-size:13.5px}
.res .bar{height:12px;border-radius:7px;background:var(--wash);overflow:hidden;border:1px solid var(--line)}
.res .bar i{display:block;height:100%}
.pbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pbtns .btn{text-align:center;font-size:13.5px;padding:8px 6px}
.pbtns .btn svg{display:block;margin:0 auto 3px}
.petal{transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-origin:200px 200px}
.pcol{transition:opacity .3s}
.tally rect{transition:height .5s,y .5s}
#svgP{display:none}
</style>
</head>
<body>
<div class="app" style="--accent:var(--plum);--accent-t:var(--plum-t)">
  <header class="top">
    <div><h1>Cultural intelligence in action</h1><div class="course">ORGS 520 Diversity and Cultural Dynamics</div></div>
    <span class="wk">Week 3</span>
  </header>
  <main class="stage">
<section class="art" aria-label="Illustration">
      <svg id="svgC" viewBox="0 0 400 400" role="img" aria-labelledby="cT">
        <title id="cT">A four-petal compass. Each petal is one part of cultural intelligence and grows longer as your answers show more strength in that part.</title>
        <circle cx="200" cy="200" r="190" fill="#fff" opacity=".6"/>
        <g fill="none" stroke="#b9b0d6" stroke-width="1.5"><circle cx="200" cy="200" r="54" stroke-dasharray="3 5"/><circle cx="200" cy="200" r="89" stroke-dasharray="3 5"/><circle cx="200" cy="200" r="125"/></g>
        <g stroke="#b9b0d6" stroke-width="1.5"><line x1="200" y1="62" x2="200" y2="338"/><line x1="62" y1="200" x2="338" y2="200"/></g>
        <g id="petals"></g>
        <circle cx="200" cy="200" r="22" fill="#fff" stroke="#5b4b8a" stroke-width="3"/>
        <text x="200" y="206" text-anchor="middle" font-family="Bricolage Grotesque,Trebuchet MS,sans-serif" font-weight="700" font-size="17" fill="#5b4b8a">CQ</text>
        <g font-family="Bricolage Grotesque,Trebuchet MS,sans-serif" font-weight="700" font-size="19" fill="#1e2230" text-anchor="middle">
          <text x="200" y="40">Motivational</text><text x="200" y="376">Metacognitive</text>
          <text transform="translate(372 200) rotate(90)">Cognitive</text><text transform="translate(28 200) rotate(-90)">Behavioral</text></g>
      </svg>
      <svg id="svgP" viewBox="0 0 400 400" role="img" aria-labelledby="pT">
        <title id="pT">Three columns showing the three paradigms for managing diversity: scales for discrimination and fairness, a storefront for access and legitimacy, and a lightbulb for learning and effectiveness. Each column fills as you match statements correctly.</title>
        <rect x="6" y="6" width="388" height="388" rx="18" fill="#fff" opacity=".6"/>
        <g id="pcols"></g>
      </svg>
      <div class="meters" id="meters"></div>
    </section>
    <section class="work">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="t1" aria-selected="true">1 Build your CQ profile</button>
        <button class="tab" role="tab" id="t2" aria-selected="false">2 Name the paradigm</button>
      </div>
      <div class="pane" id="p1" role="tabpanel" aria-labelledby="t1"></div>
      <div class="pane" id="p2" role="tabpanel" aria-labelledby="t2" hidden></div>
    </section>
  </main>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';
// ---------------- Part 1: CQ ----------------
const DIMS=[
 {k:'Motivational',c:'#d34147',def:'Your interest in and confidence about engaging with other cultures.',
  tip:'Practice curiosity. Before a cross-cultural meeting, write down one thing you are genuinely interested to learn.',
  q:'The executive you will interview leads a team spread across three countries, and you have little experience with that. What is your honest first reaction?',
  o:[[2,'I am interested but nervous, so I will keep to topics I already know.','Interest is there, but staying on safe ground limits what you can learn and signals low confidence.'],
     [3,'I am curious and confident I can learn. I will ask her to tell me about working across those countries.','Curiosity plus confidence is the motivational drive that makes the other three parts possible.'],
     [1,'I would rather avoid it, so I will steer the interview toward familiar ground.','Avoidance closes off the very insight your interview is meant to gather.']]},
 {k:'Cognitive',c:'#2f6fb3',def:'Your knowledge of cultural norms and practices.',
  tip:'Build knowledge. Read about the norms of the organization, industry, and region before you meet.',
  q:'You learn the executive’s company has a strongly hierarchical culture, where junior staff rarely challenge senior leaders. Before the call, you…',
  o:[[1,'assume your usual direct, challenge-everything style will come across as intended.','Assumptions that feel natural to you may be unwelcome to others. Style can be misread.'],
     [3,'read about norms in that organization and industry, then note how they might shape your questions.','This is cultural knowledge put to work: you turn it into specific choices about your questions.'],
     [2,'skim the company website and hope that is enough.','A start, but a skim rarely reveals norms. Look for how people actually work and communicate.']]},
 {k:'Metacognitive',c:'#d9980f',def:'Your awareness and planning before and during cross-cultural encounters.',
  tip:'Plan and check. Set an intention beforehand, then pause mid-conversation to test your assumptions.',
  q:'Ten minutes in, the executive is giving brief answers and glances at the clock. You…',
  o:[[2,'speed up and drop your weaker questions.','Adapting the pace is sensible, but you have not yet asked why it is happening.'],
     [1,'keep going with your plan. You prepared it for a reason.','A plan is a starting point. Awareness means noticing when it is not working.'],
     [3,'pause and ask yourself what you assumed about pacing and topic, then offer to focus on the questions that matter most to her.','You noticed, questioned your own assumptions, and adjusted in the moment.']]},
 {k:'Behavioral',c:'#1f7a80',def:'Your ability to adapt verbal and nonverbal behavior appropriately.',
  tip:'Adapt your behavior. Adjust pace, directness, and follow-up questions, and confirm meaning when wording is indirect.',
  q:'You float a sensitive idea and the executive replies, “That might be difficult.” You…',
  o:[[3,'treat it as possibly a polite no, soften your tone, and ask what would make it workable.','You adapted your wording and invited a fuller answer without putting her on the spot.'],
     [1,'ask directly, “So is that a yes or a no?”','Directness may be your norm, but it can close down a conversation where indirect language signals respect.'],
     [2,'accept the answer and move on without more questions.','You avoided friction, but you may have missed the real message.']]},
];
const sc=[0,0,0,0]; let qi=0;
const pet=$('#petals');
DIMS.forEach((d,i)=>{
  const g=document.createElementNS(NS,'g'); g.setAttribute('class','petal'); g.id='pet'+i;
  g.style.transform=`rotate(${i*90}deg) scale(.15)`;
  g.innerHTML=`<path d="M200 200 C168 160 172 90 200 75 C228 90 232 160 200 200Z" fill="${d.c}" fill-opacity=".88" stroke="#fff" stroke-width="2"/>`;
  pet.appendChild(g);
});
// petal order top, right, bottom, left = Motivational, Cognitive, Metacognitive, Behavioral
function paintPetals(){DIMS.forEach((d,i)=>{ $('#pet'+i).style.transform=`rotate(${i*90}deg) scale(${sc[i]?0.2+sc[i]*0.267:0.15})`})}
function mt(a,b){$('#meters').innerHTML=[a,b].filter(Boolean).map(m=>`<div class="meter"><span>${m.l}</span><span class="bar"><i style="width:${m.v/m.t*100}%"></i></span><span>${m.txt}</span></div>`).join('')}
function p1(){
  const el=$('#p1');
  if(qi>=4){
    const total=sc.reduce((a,b)=>a+b,0), low=sc.indexOf(Math.min(...sc)), hi=sc.indexOf(Math.max(...sc));
    const lvl=total>=11?'Strong cultural intelligence.':total>=8?'A solid base with room to grow.':'Plenty of room to build.';
    el.innerHTML=`<h2>${lvl}</h2>
     <div class="res">${DIMS.map((d,i)=>`<div class="r"><span>${d.k}</span><span class="bar"><i style="width:${sc[i]/3*100}%;background:${d.c}"></i></span><span>${sc[i]}/3</span></div>`).join('')}</div>
     ${sc[hi]===sc[low]?`<div class="fb info"><b>Evenly balanced.</b> All four parts scored the same, so none stands out yet. Choose the part that feels least natural to you and practice it before your interview.</div>`:`<div class="fb info"><b>Strongest: ${DIMS[hi].k}.</b> This is a strength to lean on when your interview gets complicated.</div>
     <div class="fb good"><b>Next to build: ${DIMS[low].k}.</b> ${DIMS[low].tip}</div>`}
     <p class="hint" style="font-size:12.5px;color:var(--ink2)">Cultural intelligence can be developed. Use this profile to shape how you prepare for your executive interview.</p>
     <div class="row"><button class="btn ghost" id="again">Try different choices</button><span class="spacer"></span><button class="btn primary" id="to2">Go to paradigms</button></div>`;
    $('#again').onclick=()=>{sc.fill(0);qi=0;paintPetals();p1();mtPart1()};
    $('#to2').onclick=()=>tab(2);
    return;
  }
  const d=DIMS[qi];
  el.innerHTML=`<div class="dim"><i style="background:${d.c}"></i>${d.k}</div><div class="def">${d.def}</div>
   <div class="scen card pop">${d.q}</div>
   <div class="opts" id="opts">${d.o.map((o,j)=>`<button class="btn" data-j="${j}">${o[1]}</button>`).join('')}</div>
   <div class="fb" id="fb" hidden></div>
   <div class="row"><span class="hint" style="font-size:12.5px;color:var(--ink2)">Question ${qi+1} of 4</span><span class="spacer"></span><button class="btn primary" id="nx" hidden>${qi<3?'Next question':'See your profile'}</button></div>`;
  $$('#opts .btn').forEach(b=>b.onclick=()=>{
    const o=d.o[+b.dataset.j]; sc[qi]=o[0]; paintPetals();
    $$('#opts .btn').forEach(x=>x.disabled=true);
    if(o[0]!==2)b.classList.add(o[0]===3?'good':'bad'); b.style.opacity=1;
    const best=d.o.findIndex(x=>x[0]===3); if(o[0]!==3){$$('#opts .btn')[best].classList.add('good');$$('#opts .btn')[best].style.opacity=1}
    const f=$('#fb'); f.hidden=false; f.className='fb '+(o[0]===3?'good':o[0]===2?'info':'bad');
    f.innerHTML=`<b>${o[0]===3?'Strong choice.':o[0]===2?'Partly there.':'Worth rethinking.'}</b> ${o[2]}${o[0]!==3?' The strongest response is highlighted.':''}`;
    const nx=$('#nx'); nx.hidden=false; nx.focus(); nx.onclick=()=>{qi++;p1();mtPart1()};
  });
}
function mtPart1(){mt({l:'Answered',v:Math.min(qi,4),t:4,txt:Math.min(qi,4)+' of 4'})}
// ---------------- Part 2: Paradigms ----------------
const PAR=[
 {k:'Discrimination and fairness',s:'Equal opportunity and compliance',c:'#2f6fb3',
  icon:'<path d="M0 -26 V22 M-16 24 H16 M-30 -14 H30 M-30 -14 L-40 6 H-20Z M30 -14 L20 6 H40Z" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>'},
 {k:'Access and legitimacy',s:'Reaching diverse markets and clients',c:'#d9980f',
  icon:'<path d="M-32 -8 L-24 -26 H24 L32 -8 Z M-28 -8 V24 H28 V-8 M-8 24 V6 H8 V24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>'},
 {k:'Learning and effectiveness',s:'Insight that changes how the work is done',c:'#1d7a4d',
  icon:'<path d="M0 -28 A17 17 0 0 1 10 4 V12 H-10 V4 A17 17 0 0 1 0 -28Z M-8 20 H8 M-5 26 H5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>'}];
const ST=[
 [0,'“We recruit broadly because the law requires it and we want everyone treated fairly.”'],
 [1,'“Our fastest-growing clients are Spanish-speaking, so we need staff who understand them.”'],
 [2,'“After our newest engineers questioned our process, we redesigned how the whole team plans its work.”'],
 [0,'“Diversity is a compliance checklist for us. Our measure is staying within the numbers and avoiding complaints.”'],
 [1,'“We assign our multicultural staff to the accounts that match their communities.”'],
 [2,'“We ask how our differences change what we do, then we adjust our processes.”'],
];
const hit=[0,0,0]; let si=0,smiss=0;
const pc=$('#pcols');
PAR.forEach((p,i)=>{
  const x=24+i*120;
  pc.innerHTML+=`<g transform="translate(${x} 30)">
    <rect x="0" y="0" width="104" height="250" rx="12" fill="#fff" stroke="${p.c}" stroke-width="2"/>
    <circle cx="52" cy="54" r="38" fill="${p.c}"/><g transform="translate(52 54)">${p.icon}</g>
    <g class="tally"><rect x="30" y="124" width="44" height="120" rx="6" fill="#eef0f4"/><rect id="fill${i}" x="30" y="244" width="44" height="0" rx="6" fill="${p.c}"/></g>
    <text x="52" y="116" text-anchor="middle" font-family="Atkinson Hyperlegible,Segoe UI,sans-serif" font-size="12" fill="#4a5063">matched</text></g>
   <text x="${x+52}" y="318" text-anchor="middle" font-family="Bricolage Grotesque,Trebuchet MS,sans-serif" font-weight="700" font-size="12.5" fill="#1e2230">${p.k.split(' and ')[0]}</text>
   <text x="${x+52}" y="334" text-anchor="middle" font-family="Bricolage Grotesque,Trebuchet MS,sans-serif" font-weight="700" font-size="12.5" fill="#1e2230">and ${p.k.split(' and ')[1]}</text>`;
});
function paintFill(){hit.forEach((h,i)=>{const hgt=h*60; const f=$('#fill'+i); f.setAttribute('height',hgt); f.setAttribute('y',244-hgt)})}
function p2(){
  const el=$('#p2');
  if(si>=ST.length){
    el.innerHTML=`<h2>All six matched.</h2>
     <div class="fb good"><b>Same facts, different purpose.</b> In the first paradigm diversity is about fairness and compliance. In the second it is about reaching markets. In the third it is a source of insight that changes how the work is done.</div>
     <div class="fb info"><b>Use it in your project.</b> Listen for these three purposes in your executive’s interview and describe which one the organization’s practices most resemble. Many organizations show more than one.</div>
     ${smiss?`<p class="hint" style="font-size:12.5px;color:var(--ink2)">You needed ${smiss} retr${smiss>1?'ies':'y'}. The first two paradigms sound alike until you ask what the organization expects diversity to do.</p>`:''}
     <div class="row"><button class="btn ghost" id="again2">Play again</button></div>`;
    $('#again2').onclick=()=>{hit.fill(0);si=0;smiss=0;paintFill();p2();mtPart2()};
    return;
  }
  el.innerHTML=`<p class="lede">Thomas and Ely (1996) describe three ways organizations understand the purpose of diversity. Which one is this executive describing?</p>
   <div class="card pop"><div class="quote" style="font-size:16px">${ST[si][1]}</div></div>
   <div class="pbtns" id="pb">${PAR.map((p,i)=>`<button class="btn" data-i="${i}"><svg width="40" height="40" viewBox="-36 -34 72 68" aria-hidden="true"><circle r="33" fill="${p.c}"/><g transform="scale(.8)">${p.icon}</g></svg>${p.k}<small>${p.s}</small></button>`).join('')}</div>
   <div class="fb" id="fb2" hidden aria-live="polite"></div>
   <div class="row"><span class="hint" style="font-size:12.5px;color:var(--ink2)">Statement ${si+1} of 6</span><span class="spacer"></span><button class="btn primary" id="nx2" hidden>${si<5?'Next statement':'See the result'}</button></div>`;
  $$('#pb .btn').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, f=$('#fb2'); f.hidden=false;
    if(i===ST[si][0]){
      $$('#pb .btn').forEach(x=>x.disabled=true); b.classList.add('good'); hit[i]++; paintFill(); si++;
      const why=['Fairness and compliance: diversity is a matter of equal opportunity and avoiding legal trouble.','Access and legitimacy: diversity is a way to connect with diverse markets and clients.','Learning and effectiveness: diversity changes how the work itself is done.'][i];
      f.className='fb good'; f.innerHTML='<b>Yes.</b> '+why;
      const n=$('#nx2'); n.hidden=false; n.focus(); n.onclick=()=>{p2();mtPart2()};
    }else{b.disabled=true;b.classList.add('bad','shake');smiss++;f.className='fb bad';f.innerHTML='<b>Not quite.</b> Ask what the executive expects diversity to do for the organization, then try again.'}
  });
}
function mtPart2(){mt({l:'Matched',v:Math.min(si,6),t:6,txt:Math.min(si,6)+' of 6'})}
// ---------------- Tabs ----------------
function tab(n){
  $('#t1').setAttribute('aria-selected',n===1);$('#t2').setAttribute('aria-selected',n===2);
  $('#p1').hidden=n!==1;$('#p2').hidden=n!==2;
  $('#svgC').style.display=n===1?'':'none';$('#svgP').style.display=n===2?'block':'none';
  n===1?mtPart1():mtPart2();
}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
paintPetals();p1();p2();mtPart1();
</script>
</body>
</html>
