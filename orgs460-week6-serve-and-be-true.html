<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORGS 460 Leadership and Change | Week 6 | Serve and Be True</title>
<style>
:root{--red:#d34147;--red-d:#a8353a;--sand:#edebe8;--ink:#222;--mute:#5d5a56;--bg:#fcfcfc;--line:#e2ded8;
--navy:#2b4a63;--teal:#23857b;--gold:#d99a1f;--ok:#2e7d4f;--bad:#b3261e;--r:1rem}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.38}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:.5rem;padding:.6rem .8rem .7rem;max-width:62rem;margin:0 auto}
.top{display:flex;align-items:center;gap:.8rem;background:var(--sand);border-radius:var(--r);padding:.4rem .9rem;flex:none}
.top .hero{flex:none;width:4.6rem;height:3.4rem}.top .hero svg{width:100%;height:100%;display:block}
.eyebrow{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--red-d);font-weight:700}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.4rem;line-height:1.15;margin:.05rem 0 0}
.top .sub{margin-left:auto;font-size:.78rem;color:var(--mute);text-align:right;max-width:15rem;line-height:1.25}
.tabs{display:flex;gap:.4rem;flex:none;flex-wrap:wrap}
.tab,.sbtn{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:.3rem .85rem;font-weight:650;font-size:.88rem}
.tab:hover,.sbtn:hover{border-color:var(--red)}
.tab[aria-selected=true],.sbtn[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.stage{flex:1;min-height:0;overflow:hidden}
.panel{height:100%}.panel.on{display:block}.panel:not(.on){display:none!important}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:.75rem .95rem}
.rule{width:3.6rem;height:.3rem;background:var(--red);border-radius:5px;margin:0 0 .4rem}
h2{font-family:Georgia,serif;font-size:1.12rem;margin:0 0 .25rem;color:var(--red-d)}
h3{font-size:.95rem;margin:0 0 .2rem}
p{margin:.2rem 0}
.mute{color:var(--mute);font-size:.84rem}
.btn{background:var(--red);color:#fff;border:0;border-radius:999px;padding:.42rem 1.1rem;font-weight:700}
.btn:hover{background:var(--red-d)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--red-d);border:1.5px solid var(--red)}
.btn.ghost:hover{background:#fdf0f0}
.row{display:flex;gap:.6rem;align-items:center}
.sp{flex:1}
.fb{border-radius:.8rem;padding:.55rem .8rem;border-left:6px solid var(--ok);background:#eef7f1;font-size:.9rem}
.fb.no{border-color:var(--bad);background:#fdeeed}
.fb b{display:block}
.bar{height:.7rem;background:#ece9e4;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.pill{display:inline-block;border-radius:99px;padding:.08rem .6rem;font-size:.72rem;font-weight:700;color:#fff}
.hide{display:none!important}
@media (max-width:640px){.top .sub{display:none}.top .hero{width:3.4rem;height:2.6rem}h1{font-size:1.15rem}
.app{padding:.4rem .5rem}.tab{padding:.25rem .6rem;font-size:.8rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{--S:#2b4a63;--Au:#d34147;--B:#8a5a99}
#styles{display:grid;grid-template-columns:1fr 1.2fr;gap:.7rem}
.venn{display:flex;align-items:center;justify-content:center;background:var(--sand);border-radius:var(--r);padding:.4rem}
.venn svg{width:100%;height:100%;max-height:20rem}
.vz{cursor:pointer}.vz:focus-visible{outline:none}.vz:focus-visible .o{stroke:#1a73e8;stroke-width:5}
.vd{display:flex;flex-direction:column;gap:.5rem;justify-content:center;border-top:.4rem solid var(--c,var(--red))}
.vd h2{font-size:1.5rem;margin:0;color:var(--c)}
.vd ul{margin:.1rem 0 0;padding-left:1.1rem;font-size:.92rem}.vd li{margin:.15rem 0}
.vd svg.pyr{width:100%;max-height:4.8rem}
.faith{background:var(--sand);border-radius:.8rem;padding:.45rem .7rem;font-size:.84rem}
/* sort */
#sort{display:flex;flex-direction:column;gap:.5rem}
.stmt{flex:1 1 auto;display:flex;align-items:center;gap:.9rem;font-size:1.2rem;font-family:Georgia,serif}
.stmt svg{flex:none;width:7rem;height:5rem}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.sb{background:#fff;border:2.5px solid var(--c);border-radius:var(--r);padding:.5rem;font-weight:800;color:var(--c);display:flex;flex-direction:column;align-items:center;gap:.1rem}
.sb small{font-weight:500;color:var(--mute);font-size:.74rem}
.sb:hover:not([disabled]){background:color-mix(in srgb,var(--c) 8%,#fff)}
.sb.right{background:#eef7f1;border-color:var(--ok);color:var(--ok)}.sb.wrong{background:#fdeeed;border-color:var(--bad);color:var(--bad)}
.sb[disabled]{cursor:default}
/* mirror */
#mirror{display:grid;grid-template-columns:1.25fr 1fr;gap:.7rem}
.it{margin:.28rem 0}.it label{display:flex;justify-content:space-between;gap:.5rem;font-size:.86rem;font-weight:600}
.it .end{display:flex;justify-content:space-between;font-size:.68rem;color:var(--mute)}
.res2{display:flex;flex-direction:column;gap:.5rem;justify-content:center}
.bb{display:grid;grid-template-columns:5.8rem 1fr 2rem;gap:.5rem;align-items:center;font-weight:700;font-size:.88rem}
.bb .bar{height:1.1rem}
@media (max-width:640px){
 #styles{grid-template-columns:1fr}.venn svg{max-height:9rem}.vd svg.pyr{display:none}.vd h2{font-size:1.15rem}
 .stmt{font-size:1rem}.stmt svg{display:none}.three{gap:.3rem}.sb{padding:.35rem .2rem;font-size:.85rem}.sb small{display:none}
 #mirror{grid-template-columns:1fr}.it .end{display:none}.it{margin:.1rem 0}.it label{font-size:.78rem}.res2{order:-1}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hero" aria-hidden="true">
      <svg viewBox="0 0 80 60"><circle cx="30" cy="30" r="20" fill="#2b4a63" opacity=".85"/><circle cx="50" cy="30" r="20" fill="#d34147" opacity=".85"/><path d="M40 12.600A20 20 0 0 1 40 47.400 20 20 0 0 1 40 12.600z" fill="#8a5a99"/><path d="M40 24v12M34 30h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
    <div><div class="eyebrow">ORGS 460 Leadership and Change · Week 6</div><h1>Serve and Be True</h1></div>
    <div class="sub">Servant and Authentic Leadership: care, transparency, humility, character.</div>
  </header>
  <nav class="tabs" aria-label="Activity sections">
    <button class="tab" data-p="styles" aria-selected="true">1 · Two Styles</button>
    <button class="tab" data-p="sort" aria-selected="false">2 · Sort It</button>
    <button class="tab" data-p="mirror" aria-selected="false">3 · Reflection Mirror</button>
  </nav>
  <main class="stage">
    <section class="panel on" id="styles" role="tabpanel">
      <div class="venn"><svg viewBox="0 0 320 240" role="group" aria-label="Venn diagram: servant leadership, authentic leadership, and the humility and character they share">
        <g class="vz" tabindex="0" role="button" aria-label="Servant leadership" data-k="S"><circle class="o" cx="118" cy="118" r="88" fill="#2b4a63" fill-opacity=".8" stroke="#2b4a63" stroke-width="3"/><text x="78" y="106" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="17" fill="#fff">Servant</text><text x="78" y="126" text-anchor="middle" font-size="11" fill="#fff">share power</text></g>
        <g class="vz" tabindex="0" role="button" aria-label="Authentic leadership" data-k="Au"><circle class="o" cx="202" cy="118" r="88" fill="#d34147" fill-opacity=".75" stroke="#d34147" stroke-width="3"/><text x="244" y="106" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="17" fill="#fff">Authentic</text><text x="244" y="126" text-anchor="middle" font-size="11" fill="#fff">be true</text></g>
        <g class="vz" tabindex="0" role="button" aria-label="Shared humility and character" data-k="B"><path class="o" d="M160 40.7A88 88 0 0 1 160 195.3A88 88 0 0 1 160 40.7z" fill="#8a5a99" stroke="#fff" stroke-width="3"/><text x="160" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Humility</text><text x="160" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">&amp; character</text></g>
        <text x="160" y="228" text-anchor="middle" font-size="11" fill="#5d5a56">Select a circle to explore</text>
      </svg></div>
      <div class="card vd" id="vd" aria-live="polite"></div>
    </section>
    <section class="panel" id="sort" role="tabpanel"><div id="sortBody" style="height:100%;display:flex;flex-direction:column;gap:.5rem"></div></section>
    <section class="panel" id="mirror" role="tabpanel">
      <div class="card"><div class="rule"></div><h2>How true is each statement of you?</h2><div id="items"></div></div>
      <div class="card res2" aria-live="polite" id="res2"></div>
    </section>
  </main>
</div>
<script>
/* Shared helpers: tabs + fit-to-frame (prevents a second scrollbar inside the Canvas iframe) */
var $=function(s,e){return (e||document).querySelector(s)};
var $$=function(s,e){return Array.prototype.slice.call((e||document).querySelectorAll(s))};
var ROOT=document.documentElement;
function fit(){
  var st=$('.stage'),app=$('.app'),s=16;
  ROOT.style.fontSize=s+'px';
  var over=function(){return st.scrollHeight>st.clientHeight+1||st.scrollWidth>st.clientWidth+1||app.scrollHeight>app.clientHeight+1};
  while(over()&&s>9.5){s-=.5;ROOT.style.fontSize=s+'px'}
  st.style.overflowY=over()?'auto':'hidden'; /* last-resort only; normally never shown */
}
var _fq;function refit(){cancelAnimationFrame(_fq);_fq=requestAnimationFrame(fit)}
function showTab(id){
  $$('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.p===id)});
  $$('.panel').forEach(function(p){p.classList.toggle('on',p.id===id)});
  refit();
}
function initTabs(){
  var tabs=$$('.tab');
  tabs.forEach(function(t,i){
    t.setAttribute('role','tab');
    t.addEventListener('click',function(){showTab(t.dataset.p)});
    t.addEventListener('keydown',function(e){
      var n=e.key==='ArrowRight'?i+1:e.key==='ArrowLeft'?i-1:null;
      if(n!==null){n=(n+tabs.length)%tabs.length;tabs[n].focus();showTab(tabs[n].dataset.p)}
    });
  });
  $$('[data-icon]').forEach(function(e){e.innerHTML=ICON[e.dataset.icon]});
  window.addEventListener('resize',refit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refit);
  refit();
}

var ICON={};
/* 1 STYLES */
var PYR_TRAD='<svg class="pyr" viewBox="0 0 200 70" aria-hidden="true"><path d="M10 64h80L50 8z" fill="#c9c4bc"/><circle cx="50" cy="20" r="5" fill="#222"/><text x="50" y="68" text-anchor="middle" font-size="7" fill="#222"></text><path d="M110 64h80L150 8z" fill="none"/></svg>';
var PYR_SERV='<svg class="pyr" viewBox="0 0 260 72" aria-hidden="true"><path d="M56 4l48 62H8z" fill="#c9c4bc"/><circle cx="56" cy="10" r="6" fill="#222"/><text x="56" y="58" text-anchor="middle" font-size="9" fill="#222">Boss on top</text><path d="M116 36h20" stroke="#222" stroke-width="2.4"/><path d="M136 30l8 6-8 6z" fill="#222"/><path d="M156 6h96l-48 62z" fill="#2b4a63"/><circle cx="204" cy="64" r="6" fill="#d99a1f"/><text x="204" y="24" text-anchor="middle" font-size="9" fill="#fff">Team on top</text></svg>';
var VD={
S:{c:'#2b4a63',n:'Servant Leadership',e:'Share power and serve',d:'Instead of workers serving the boss, the servant leader shares power and serves people for the greater good and success of the team or organization.',l:['Empowers and cares for others','Shares power instead of hoarding it','Measures success by the good of the team'],x:PYR_SERV},
Au:{c:'#d34147',n:'Authentic Leadership',e:'Be transparent and true',d:'Authentic leaders are transparent, trustworthy, and true. They build trust through consistency between what they say and what they do.',l:['Is open about what they know and don\u2019t know','Acts in line with their stated values','Earns trust through honesty and consistency'],x:''},
B:{c:'#8a5a99',n:'Humility & Character',e:'The shared foundation',d:'Humility and character underpin both styles. Humble leaders create space for others to contribute, and strong character keeps care and honesty steady under pressure.',l:['Makes room for others\u2019 ideas and gifts','Admits limits and mistakes','Stays trustworthy when it is costly'],x:'<div class="faith"><b>Christian worldview:</b> Jesus is the ultimate example of both servant and authentic leadership.</div>'}};
function vsel(k){
  var v=VD[k],d=$('#vd');d.style.setProperty('--c',v.c);
  $$('.vz').forEach(function(z){z.style.opacity=z.dataset.k===k?1:.6});
  d.innerHTML='<div class="eyebrow" style="color:'+v.c+'">'+v.e+'</div><h2>'+v.n+'</h2><p>'+v.d+'</p><ul>'+v.l.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'+v.x;refit();
}
$$('.vz').forEach(function(z){z.onclick=function(){vsel(z.dataset.k)};z.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();vsel(z.dataset.k)}}});
vsel('S');
/* 2 SORT */
var ST=[
{t:'Shares power instead of hoarding it.',a:'S',w:'Sharing power is the heart of servant leadership.'},
{t:'Builds trust by being open about what they do not know.',a:'Au',w:'Transparency is a hallmark of authentic leadership.'},
{t:'Measures success by the good of the team and organization.',a:'S',w:'The servant leader\u2019s measure is the greater good, not personal credit.'},
{t:'Makes room for others to contribute their ideas.',a:'B',w:'Creating space for others is humility, which underpins both styles.'},
{t:'Acts in line with stated values, even when it costs something.',a:'Au',w:'Being consistent and true to one\u2019s values is authenticity.'},
{t:'Empowers and cares for the people they lead.',a:'S',w:'Empowering and caring for others defines servant leadership.'},
{t:'Admits mistakes without being asked.',a:'B',w:'Admitting limits takes humility and character, which both styles require.'},
{t:'Is trustworthy and true to who they are.',a:'Au',w:'Trustworthy and true: that is the language of authentic leadership.'}];
var SB={S:['Servant','shares power','#2b4a63'],B:['Both','humility &amp; character','#8a5a99'],Au:['Authentic','transparent &amp; true','#d34147']};
var sti=0,ssc=0,sdn=false;
var SCENE='<svg viewBox="0 0 110 80" aria-hidden="true"><rect width="110" height="80" rx="12" fill="#edebe8"/><circle cx="30" cy="26" r="9" fill="#2b4a63"/><path d="M16 56q0-18 14-18t14 18z" fill="#2b4a63"/><circle cx="80" cy="26" r="9" fill="#d34147"/><path d="M66 56q0-18 14-18t14 18z" fill="#d34147"/><path d="M45 44h20" stroke="#8a5a99" stroke-width="3" stroke-dasharray="3 4" stroke-linecap="round"/><path d="M55 36v16" stroke="#8a5a99" stroke-width="3" stroke-linecap="round" opacity="0"/><path d="M8 66h94" stroke="#c9c4bc" stroke-width="2"/></svg>';
function renderSort(){
  var B=$('#sortBody');
  if(sti>=ST.length){
    B.innerHTML='<div class="card" style="flex:1;display:flex;flex-direction:column;gap:.5rem;align-items:center;justify-content:center;text-align:center"><div class="eyebrow">Sort complete</div><div style="font-family:Georgia,serif;font-size:2.4rem;color:var(--red-d);line-height:1">'+ssc+' / '+ST.length+'</div><p>'+(ssc>=7?'You can tell the styles apart and see what holds them together.':ssc>=5?'Good. The overlap is where it gets interesting: humility and character support both.':'Revisit the Two Styles tab, then try again.')+'</p><p class="mute">Take it to Discussion 6: where have you seen humility and character make a leader more trustworthy?</p><button class="btn" id="sa">Try again</button></div>';
    $('#sa').onclick=function(){sti=0;ssc=0;sdn=false;renderSort()};refit();return}
  var s=ST[sti],o='';
  ['S','B','Au'].forEach(function(k){o+='<button class="sb" data-k="'+k+'" style="--c:'+SB[k][2]+'">'+SB[k][0]+'<small>'+SB[k][1]+'</small></button>'});
  B.innerHTML='<div class="row"><span class="mute">Statement '+(sti+1)+' of '+ST.length+'</span><span class="sp"></span><span class="mute">Score: <b>'+ssc+'</b></span></div>'+
   '<div class="card stmt">'+SCENE+'<div><div class="eyebrow" style="font-family:system-ui">This leader\u2026 which style is it?</div>\u201C'+s.t+'\u201D</div></div><div class="three">'+o+'</div><div id="sf" style="min-height:3.2rem"></div><div class="row"><span class="sp"></span><button class="btn hide" id="sn">'+(sti===ST.length-1?'See results':'Next')+'</button></div>';
  $$('.sb').forEach(function(b){b.onclick=function(){
    var ok=b.dataset.k===s.a;if(ok)ssc++;
    $$('.sb').forEach(function(x){x.disabled=true;if(x.dataset.k===s.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#sf').innerHTML='<div class="fb'+(ok?'':' no')+'"><b>'+(ok?'Yes.':'Not quite. Best fit: '+SB[s.a][0]+'.')+'</b>'+s.w+'</div>';$('#sn').classList.remove('hide');refit()}});
  $('#sn').onclick=function(){sti++;renderSort()};refit();
}
/* 3 MIRROR */
var MI=[['S','I share decisions and credit instead of keeping them to myself.'],['S','I judge my success by how well my team is doing.'],['S','I ask people what they need before telling them what to do.'],
['A','I am open about what I know, what I don\u2019t, and what I am still learning.'],['A','My actions match my stated values, even when it is costly.'],['A','I admit my mistakes without being asked.']];
var MV=[3,3,3,3,3,3];
(function(){
  var h='';MI.forEach(function(m,i){h+='<div class="it"><label for="m'+i+'"><span>'+m[1]+'</span><b id="mv'+i+'">3</b></label><input type="range" id="m'+i+'" min="1" max="5" value="3" style="width:100%;accent-color:#d34147"><div class="end"><span>Rarely</span><span>Always</span></div></div>'});
  $('#items').innerHTML=h;
  MI.forEach(function(m,i){$('#m'+i).oninput=function(){MV[i]=+this.value;$('#mv'+i).textContent=this.value;drawMirror()}});drawMirror();
})();
function drawMirror(){
  var s=(MV[0]+MV[1]+MV[2])/3,a=(MV[3]+MV[4]+MV[5])/3,d=s-a;
  var lean=Math.abs(d)<.5?'Your two styles are in balance.':d>0?'You lean <b style="color:var(--S)">servant</b>: you naturally share power and put others first.':'You lean <b style="color:var(--Au)">authentic</b>: you naturally lead with transparency and consistency.';
  var grow=Math.abs(d)<.5?'Choose one statement you scored lowest and plan one action this week.':d>0?'Stretch: practice saying aloud what you are unsure of, and when you were wrong.':'Stretch: ask a teammate what they need and hand over a decision they could own.';
  $('#res2').innerHTML='<div class="eyebrow">Your reflection</div>'+
   '<div class="bb"><span style="color:var(--S)">Servant</span><div class="bar"><i style="width:'+(s*20)+'%;background:var(--S)"></i></div><span>'+s.toFixed(1)+'</span></div>'+
   '<div class="bb"><span style="color:var(--Au)">Authentic</span><div class="bar"><i style="width:'+(a*20)+'%;background:var(--Au)"></i></div><span>'+a.toFixed(1)+'</span></div>'+
   '<p>'+lean+'</p><p class="mute">'+grow+'</p><div class="faith" style="background:var(--sand);border-radius:.8rem;padding:.45rem .7rem;font-size:.8rem">A quick self-reflection, not a validated assessment. Pair it with the <b>What Is Your Leadership Style?</b> interactive as you prepare to revise your leadership philosophy.</div>';
  refit();
}
initTabs();renderSort();
</script>
</body>
</html>
