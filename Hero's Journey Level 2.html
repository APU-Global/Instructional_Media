<style>
/* Layout: one centered column, a framed banner on the start screen, then a bordered quest panel per level step. Dark arcade look by design. */
:root{
  --bg:#13143d; --bg-deep:#0a0b2a; --panel:#1d1f63; --panel-2:#2a2d80; --panel-3:#363a9a;
  --line:#4f5bd5; --text:#ffffff; --muted:#c7caf8;
  --gold:#ffd24a; --gold-deep:#d19a1c; --pink:#ff5d8f; --teal:#3ee0c0; --ok:#56e39f; --bad:#ff7a8a; --ink:#1a1650;
  --pixel:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg-deep)}
body{
  margin:0;color:var(--text);font:400 17px/1.55 var(--body);background-color:#12133f;
  background-image:
    radial-gradient(circle at 30px 40px,#fff 0 1.5px,transparent 2px),
    radial-gradient(circle at 120px 150px,#cfd3ff 0 1px,transparent 1.6px),
    radial-gradient(circle at 200px 70px,var(--gold) 0 1.4px,transparent 2px),
    radial-gradient(circle at 70px 210px,#fff 0 1px,transparent 1.6px),
    linear-gradient(180deg,#0a0b2a 0%,#15175a 100%);
  background-size:230px 250px,170px 190px,270px 230px,140px 260px,auto;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-deep)}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
h1,h2,h3,p{margin:0}

.banner{border:4px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 8px 0 var(--bg-deep);background:#1d1f5e;line-height:0}
.banner svg{display:block;width:100%;height:auto}
.hero-text{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-block:32px 8px}
.eyebrow{font:400 12px/1.5 var(--pixel);color:var(--teal);letter-spacing:.12em}
.title{font:400 clamp(26px,7vw,54px)/1.3 var(--pixel);color:#fff;text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--bg-deep);text-wrap:balance}
.level{font:400 clamp(12px,2.8vw,20px)/1.7 var(--pixel);color:var(--gold);text-wrap:balance}
.lead{max-width:34ch;font-size:18px;color:#fff}

.btn{display:inline-flex;align-items:center;gap:12px;font:400 clamp(13px,3.2vw,17px)/1.2 var(--pixel);background:var(--gold);color:var(--ink);border:0;border-radius:14px;padding:18px 28px;cursor:pointer;box-shadow:0 7px 0 var(--gold-deep);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--gold-deep)}
.btn:disabled{background:#59609f;color:#d6d8f5;box-shadow:0 7px 0 #3a4078;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--gold);border:3px solid var(--gold);box-shadow:none;padding:12px 18px}

.panel{background:var(--panel);border:4px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 8px 0 var(--bg-deep)}
.howto{margin-top:34px}
.howto h2{font:400 14px/1.4 var(--pixel);color:var(--gold);margin-bottom:16px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.steps li{display:flex;align-items:center;gap:14px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font:400 13px/1 var(--pixel)}
.note{margin-top:16px;color:var(--muted);font-size:15px}

.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hud .tag{font:400 12px/1 var(--pixel);color:var(--gold)}
.pips{display:flex;gap:8px}
.pip{width:26px;height:12px;border-radius:4px;background:#0f1146;border:2px solid var(--line)}
.pip.done{background:var(--teal);border-color:var(--teal)}
.pip.now{background:var(--gold);border-color:var(--gold)}
.xp{font:400 12px/1 var(--pixel);color:var(--teal)}

.qhead{display:grid;gap:12px;margin-bottom:22px}
.qtitle{font:400 clamp(16px,4.2vw,26px)/1.45 var(--pixel);color:#fff;text-wrap:balance}
.story{max-width:68ch}
.verse{font-size:15px;color:var(--muted);font-style:italic;max-width:68ch}
.how{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.how p{color:var(--gold);font-weight:800}
.count{font:400 12px/1 var(--pixel);color:var(--teal)}

.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;text-align:left;padding:14px 16px;border-radius:18px;border:3px solid var(--line);background:var(--panel-2);cursor:pointer;box-shadow:0 5px 0 #14165a;transition:transform .08s,box-shadow .08s}
.card:hover{background:#31359a}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #14165a}
.card[aria-pressed="true"]{border-color:var(--gold);background:var(--panel-3)}
.card:disabled{cursor:default;opacity:.7}
.card .tx{min-width:0;flex:1}
.ico{flex:none;width:46px;height:46px;border-radius:12px;background:#151857;display:grid;place-items:center;color:var(--gold)}
.ico.t{color:var(--teal)} .ico.p{color:var(--pink)}
.ct{font-weight:800;font-size:17px;line-height:1.3}
.cs{font-size:14px;color:var(--muted);line-height:1.4}
.badge{flex:none;font:400 9px/1 var(--pixel);color:var(--ink);background:var(--gold);padding:6px 7px;border-radius:6px}

.status{margin-top:16px;padding:12px 16px;border-radius:14px;background:#151857;border:2px solid var(--line);font-weight:700}
.status.good{border-color:var(--ok)} .status.warn{border-color:var(--gold)} .status.bad{border-color:var(--bad)}
.status ul{margin:6px 0 0;padding-left:20px;font-weight:600}

.meter{background:#101247;border:3px solid var(--line);border-radius:18px;padding:14px 16px 12px;margin-bottom:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mnum{font:400 13px/1 var(--pixel);color:var(--teal)}
.mnum.over{color:var(--pink)}
.bar{position:relative;display:flex;height:22px;border-radius:8px;background:#0a0c36;border:2px solid #0a0c36;margin-block:10px 6px}
.bar span{height:100%;transition:width .2s}
.b-kept{background:var(--gold)} .b-free{background:var(--teal)}
.mark{position:absolute;top:-6px;bottom:-6px;width:3px;background:#fff;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.gold{background:var(--gold)} .sw.teal{background:var(--teal)} .sw.mk{background:#fff;width:3px}
.mstat{margin-top:8px;font-weight:700;font-size:15px}

.rows{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 18px;align-items:center;padding:12px 14px;border:3px solid var(--line);border-radius:18px;background:var(--panel-2)}
.row.is-down{background:#2a2766}
.rl{display:flex;align-items:center;gap:14px;min-width:0}
.seg{display:flex}
.seg button{font:700 14px/1.2 var(--body);padding:10px 14px;border:2px solid var(--line);background:#151857;color:#fff;cursor:pointer}
.seg button+button{border-left-width:0}
.seg button:first-child{border-radius:12px 0 0 12px}
.seg button:last-child{border-radius:0 12px 12px 0}
.seg button.keep[aria-pressed="true"]{background:var(--teal);color:var(--ink);border-color:var(--teal)}
.seg button.scale[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.seg button.down[aria-pressed="true"]{background:var(--pink);color:var(--ink);border-color:var(--pink)}
.rnote{grid-column:1/-1;font-size:14px;color:var(--gold);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
.stat{display:grid;grid-template-columns:minmax(88px,120px) minmax(0,1fr) 46px;gap:10px;align-items:center;font-weight:700;font-size:15px}
.blocks{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.blk{height:16px;background:#0a0c36;border-radius:2px}
.blk.lo{background:var(--pink)} .blk.mid{background:var(--gold)} .blk.hi{background:var(--teal)}
.sv{font:400 11px/1 var(--pixel);text-align:right}

.scene{margin-top:18px;padding:16px 18px;border-radius:16px;background:#151857;border:3px dashed var(--pink)}
.scene .eyebrow{color:var(--pink);display:block;margin-bottom:8px}

.qbox{margin-top:26px;padding-top:22px;border-top:3px dashed #4a55c8;display:grid;gap:26px}
.qlabel{font:400 11px/1.4 var(--pixel);color:var(--teal);margin-bottom:10px}
.qtext{font-weight:800;font-size:19px;line-height:1.4;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:13px 16px;border:3px solid var(--line);border-radius:14px;background:var(--panel-2);font:600 16px/1.45 var(--body);cursor:pointer;box-shadow:0 4px 0 #14165a}
.opt:hover:not(:disabled){background:#31359a}
.opt.right{border-color:var(--ok);background:#1d5a58}
.opt.bad{border-color:var(--bad);background:#552550}
.opt:disabled{cursor:default;box-shadow:none}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;background:#151857;border:2px solid var(--line)}
.fb.good{border-color:var(--ok)} .fb.try{border-color:var(--bad)}

.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.field{display:grid;gap:6px;font-weight:800;font-size:15px}
select{font:600 16px/1.3 var(--body);color:#fff;background:#151857;border:3px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.sentence{margin-top:16px}

.actions{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:30px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:15px;flex:1;min-width:200px}

.done-head{display:grid;gap:14px;justify-items:center;text-align:center;padding-block:28px 6px}
.logs{display:grid;gap:14px;margin:18px 0 0}
.logs div{padding:14px 16px;border-radius:14px;background:#151857;border:2px solid var(--line)}
.logs dt{font:400 11px/1.5 var(--pixel);color:var(--teal);margin-bottom:6px}
.logs dd{margin:0}
.logtext{width:100%;min-height:200px;margin-top:14px;padding:12px;border-radius:12px;border:3px solid var(--line);background:#0e1047;color:#fff;font:400 15px/1.5 var(--body);resize:vertical}
.bigq{margin-top:22px;padding:16px 18px;border-radius:16px;background:#151857;border:3px solid var(--teal)}
.bigq .eyebrow{display:block;margin-bottom:8px}
.levelup{margin-top:22px;padding:20px;border-radius:20px;background:#2c2670;border:4px solid var(--gold)}
.levelup .eyebrow{color:var(--gold);display:block;margin-bottom:10px}
.levelup p+p{margin-top:8px;color:var(--muted)}
.levelup strong{color:var(--gold)}

@media (max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
@media (max-width:560px){.cards{grid-template-columns:1fr}.row{grid-template-columns:minmax(0,1fr)}.seg{width:100%}.seg button{flex:1;padding-inline:6px}.panel{padding:18px;border-radius:22px}.btn{padding:16px 20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- State ---------- */
const S = {screen:"start", xp:0, packed:[], load:{}, rest:[], storm:null, qs:{}, step:null, day:"", time:"", backup:"", locked:false, awarded:{}};
LOAD.forEach(l => { S.load[l.id] = "keep"; });

function qs(k){ return S.qs[k] || (S.qs[k] = {idx:0, done:{}, wrong:{}, last:{}}); }
function award(id, n){ if(!S.awarded[id]){ S.awarded[id] = 1; S.xp += n; } }
function say(t){ const l = document.getElementById("live"); if(l){ l.textContent = ""; setTimeout(() => { l.textContent = t; }, 30); } }
function hoursFor(l){ const v = S.load[l.id]; return v === "down" ? 0 : v === "scale" ? Math.ceil(l.h/2) : l.h; }
function keptHours(){ return LOAD.reduce((a,l) => a + hoursFor(l), 0); }
function restStats(){
  const v = {physical:3, mental:3, quiet:3, social:3};
  REST.filter(r => S.rest.includes(r.id)).forEach(r => { for(const t in r.d) v[t] += r.d[t]; });
  for(const t in v) v[t] = Math.max(0, Math.min(10, v[t]));
  return v;
}
function questionsFor(k){
  if(k === "q1") return [
    {id:"q1a", text:"Why does a hero pack provisions before the exciting parts of the adventure?", opts:[
      {t:"Because the exciting parts do not really matter.", fb:"They matter. Provisions are what let you reach them."},
      {t:"Because without them the adventure does not last.", ok:1, fb:"Right. Sleep, meals, family, faith, health, and work are what keep you going."},
      {t:"Because packing is the only thing a hero needs to do.", fb:"Packing is the start, not the whole journey."}]},
    {id:"q1b", text:"Where do your college commitments fit?", opts:[
      {t:"Around your essentials, not instead of them.", ok:1, fb:"Yes. You plan college around what sustains you, so you can keep going."},
      {t:"In place of sleep and meals when time gets tight.", fb:"That trade works for a night or two, then it breaks the plan."},
      {t:"Wherever there is a gap, with no plan at all.", fb:"Gaps disappear quickly. A plan protects the time on purpose."}]}
  ];
  if(k === "q2") return [
    {id:"q2a", text:"How should a hero think about the things they set down?", opts:[
      {t:"As failure. A real hero would do it all.", fb:"No hero carries everything. Limits are part of being human."},
      {t:"As stewardship: choosing what matters most right now.", ok:1, fb:"Yes. Setting something down is not giving up. It is deciding what matters most for this season."},
      {t:"As permanent. You can never pick it back up.", fb:"Seasons change. Many things you scale back now can return later."}]},
    {id:"q2b", reflective:1, text:"Which describes your choices best?", opts:[
      {t:"It felt like letting someone down.", fb:"That feeling is real. Notice who you pictured, because it may belong in your discussion post."},
      {t:"I did not realize how many hours some of these take.", fb:"Hours add up quietly. Seeing them is the first step to stewarding them."},
      {t:"It was easier than I expected.", fb:"Good. Sometimes the load is lighter to set down than to carry."},
      {t:"I am still not sure what I would really set down.", fb:"That is honest. You will get another chance to decide in your discussion post."}]}
  ];
  if(k === "q3") return [
    {id:"q3a", reflective:1, text:"Which kind of rest do you need most right now?", opts:[
      {t:"Physical rest: more sleep.", fb:"Sleep is a provision, not a reward. Even one earlier night helps."},
      {t:"Mental rest: feeling caught up and organized.", fb:"A short weekly plan clears a lot of mental clutter."},
      {t:"Quiet rest: time alone, away from screens.", fb:"Quiet time can be prayer, a walk, or simply silence."},
      {t:"Social rest: time with people who refill me.", fb:"Time with people you love is fuel. Put it in the plan."}]},
    {id:"q3b", text:"What happens to your energy, focus, and attitude when rest is missing?", opts:[
      {t:"Nothing. Rest is for people who cannot keep up.", fb:"Even the strongest travelers run down without rest."},
      {t:"All three dip. Rest is part of the plan, not a reward for finishing it.", ok:1, fb:"Yes. When rest is missing, energy, focus, and attitude all slip."},
      {t:"Only your energy changes. Focus stays the same.", fb:"Focus and attitude usually slip right along with energy."}]}
  ];
  if(k === "q4"){
    const s = STORMS.find(x => x.id === S.storm); if(!s) return [];
    return [s.q,
      {id:"q4b", text:"Which habit makes the next surprise easier to handle?", opts:[
        {t:"Fill every hour so nothing is wasted.", fb:"A packed plan has no room to bend, so one surprise breaks it."},
        {t:"Keep a few buffer hours open each week.", ok:1, fb:"Buffer is margin. It turns a crisis into a bump."},
        {t:"Plan nothing, so nothing can be disrupted.", fb:"With no plan you cannot tell what to move. A flexible plan beats no plan."}]}];
  }
  return [];
}
function qDone(k){ const l = questionsFor(k); return l.length > 0 && qs(k).idx >= l.length; }

/* ---------- Shared pieces ---------- */
function frame(k, body, ok, hint){
  const m = META[k];
  const pips = [1,2,3,4,5].map(i => `<span class="pip ${i<m.n?"done":i===m.n?"now":""}"></span>`).join("");
  const last = m.next === "done";
  return `<div class="hud"><span class="tag">LEVEL 2</span><div class="pips" role="img" aria-label="Quest ${m.n} of 5">${pips}</div><span class="xp">XP ${S.xp}</span></div>
<section class="panel" aria-labelledby="qt">
<header class="qhead"><p class="eyebrow">QUEST ${m.n} OF 5</p><h1 class="qtitle" id="qt">${m.title}</h1>
<p class="story">${m.story}</p><p class="verse">&ldquo;${esc(m.verse[0])}&rdquo; &mdash; ${esc(m.verse[1])} (NIV)</p></header>
${body}
<div class="actions"><p class="hint">${ok ? "Nice work. You are ready to move on." : esc(hint)}</p>
<button class="btn" data-act="next" data-to="${m.next}" data-k="next" ${ok?"":"disabled"}>${last?"FINISH LEVEL":"NEXT QUEST"} <span aria-hidden="true">&#9654;</span></button></div>
</section>`;
}
function qhtml(k){
  const list = questionsFor(k), st = qs(k); if(!list.length) return "";
  let out = `<div class="qbox">`;
  list.forEach((q,i) => {
    if(i > st.idx) return;
    const done = st.done[q.id] !== undefined, last = st.last[q.id];
    out += `<div><p class="qlabel">QUICK CHECK ${i+1} OF ${list.length}</p><p class="qtext" id="${q.id}-t">${esc(q.text)}</p><div class="opts" role="group" aria-labelledby="${q.id}-t">`;
    q.opts.forEach((o,j) => {
      const wrong = (st.wrong[q.id]||[]).includes(j), right = done && st.done[q.id] === j;
      out += `<button class="opt ${right?"right":wrong?"bad":""}" data-act="ans" data-q="${q.id}" data-j="${j}" data-k="${q.id}-${j}" ${done?"disabled":""}>${esc(o.t)}</button>`;
    });
    out += `</div>`;
    if(done) out += `<div class="fb good"><strong>${q.reflective?"Noted.":"Nice!"}</strong> ${esc(q.opts[st.done[q.id]].fb)}</div>`;
    else if(last !== undefined) out += `<div class="fb try"><strong>Not quite.</strong> ${esc(q.opts[last].fb)} Try another answer.</div>`;
    out += `</div>`;
  });
  return out + `</div>`;
}

  return [
    ["My Provisions", "I packed " + S.packed.map(id => PROV.find(p => p.id === id).t.toLowerCase()).join(", ") + ". I plan college around these, not in place of them."],
    ["My Load", `Set down: ${join(names(LOAD, l => S.load[l.id]==="down"))}. Scaled back: ${join(names(LOAD, l => S.load[l.id]==="scale"))}. Kept: ${join(names(LOAD, l => S.load[l.id]==="keep"))}. That leaves ${free} open hours a week for college.`],
    ["My Rest", `My rest power-ups: ${rest.join(", ")}. My meters ended at physical ${v.physical}, mental ${v.mental}, quiet ${v.quiet}, and social ${v.social} out of 10.`],
    ["My Storm Plan", `If ${storm.t.toLowerCase()} hits, I will use my buffer hours, adjust my plan on purpose, and ask for help early.`],
    ["My First Step", stepSentence()]
  ];
}
views.done = () => {
  const items = logItems();
  const dl = items.map(([a,b]) => `<div><dt>${a.toUpperCase()}</dt><dd>${esc(b)}</dd></div>`).join("");
  const text = items.map(([a,b]) => `${a}: ${b}`).join("\n\n");
  return `${banner()}
<header class="done-head"><p class="eyebrow">LEVEL 2 COMPLETE</p><h1 class="title" style="font-size:clamp(22px,6vw,42px)">YOU CROSSED THE THRESHOLD</h1>
<p class="level">+${S.xp} XP EARNED</p>
<p class="verse" style="text-align:center">&ldquo;There is a time for everything, and a season for every activity under the heavens.&rdquo; &mdash; Ecclesiastes 3:1 (NIV)</p></header>
<section class="panel" aria-labelledby="logt"><h2 id="logt" class="qtitle" style="font-size:16px">YOUR QUEST LOG</h2>
<p class="story" style="margin-top:10px">Here is what you decided. Use it when you respond to this week's discussion activity.</p>
<dl class="logs">${dl}</dl>
<textarea class="logtext" id="logtext" readonly aria-label="Your quest log as plain text">${esc(text)}</textarea>
<div class="actions" style="margin-top:14px"><span class="hint" id="copyhint"></span><button class="btn ghost" data-act="copy" data-k="copy">COPY MY QUEST LOG</button></div>
<div class="bigq"><span class="eyebrow">THE BIGGER QUEST</span><p>What would change if you saw time as something to steward rather than something you are losing?</p></div>
<div class="levelup"><span class="eyebrow">NEXT: LEVEL UP</span>
<p>What you learned here does not end with this game. <strong>You will use it in the assignment titled &ldquo;Level Up Project.&rdquo;</strong></p>
<p>Keep your quest log handy. Next, complete this week's discussion activity and share what you discovered.</p></div>
<div class="actions"><button class="btn ghost" data-act="restart" data-k="restart">PLAY AGAIN</button><span></span></div></section>`;
};

/* ---------- Engine ---------- */
const app = document.getElementById("app");
function update(){
  const a = document.activeElement, key = a && a.dataset ? a.dataset.k : null, y = window.scrollY;
  app.innerHTML = views[S.screen]();
  window.scrollTo(0, y);
  if(key){ const n = app.querySelector(`[data-k="${key}"]`); if(n && !n.disabled) n.focus({preventScroll:true}); }
}
function go(s){
  S.screen = s; app.innerHTML = views[s]();
  window.scrollTo(0, 0);
  const h = app.querySelector("h1"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
}
function toggle(list, id, max){
  const i = list.indexOf(id);
  if(i >= 0){ list.splice(i,1); return true; }
  if(list.length >= max){ say("Full. Tap a picked card to put it back first."); return false; }
  list.push(id); return true;
}
function act(a, d){
  if(a === "start") return go("q1");
  if(a === "next") return go(d.to);
  if(a === "restart"){
    S.xp = 0; S.packed = []; S.rest = []; S.storm = null; S.qs = {}; S.step = null; S.day = ""; S.time = ""; S.backup = ""; S.locked = false; S.awarded = {};
    LOAD.forEach(l => { S.load[l.id] = "keep"; });
    return go("start");
  }
  if(a === "pack"){ toggle(S.packed, d.id, PACK); return update(); }
  if(a === "rest"){ toggle(S.rest, d.id, RESTPICKS); return update(); }
  if(a === "load"){ S.load[d.id] = d.v; return update(); }
  if(a === "storm"){ S.storm = d.id; S.qs.q4 = null; delete S.qs.q4; return update(); }
  if(a === "step"){ S.step = d.id; S.locked = false; return update(); }
  if(a === "lock"){ S.locked = true; award("lock", 20); say("Plan locked."); return update(); }
  if(a === "ans"){
    const k = S.screen, list = questionsFor(k), q = list.find(x => x.id === d.q), j = +d.j, st = qs(k), o = q.opts[j];
    st.last[q.id] = j;
    if(o.ok || q.reflective){
      st.done[q.id] = j; award("a-" + q.id, (st.wrong[q.id]||[]).length ? 5 : 10);
      st.idx = Math.max(st.idx, list.indexOf(q) + 1); say(o.fb);
    } else { (st.wrong[q.id] = st.wrong[q.id] || []).push(j); say("Not quite. " + o.fb); }
    return update();
  }
  if(a === "copy"){
    const ta = document.getElementById("logtext"), hint = document.getElementById("copyhint");
    const fallback = () => { ta.focus(); ta.select(); if(hint) hint.textContent = "Press Ctrl+C (or Cmd+C) to copy."; };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(() => { if(hint) hint.textContent = "Copied. Paste it into your notes."; say("Copied."); }, fallback);
      } else fallback();
    } catch(e){ fallback(); }
  }
}
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  act(b.dataset.act, b.dataset);
});
app.addEventListener("change", e => {
  const s = e.target.closest("[data-sel]"); if(!s) return;
  S[s.dataset.sel] = s.value; S.locked = false; update();
});
app.innerHTML = views.start();
</script>
