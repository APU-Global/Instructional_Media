*{box-sizing:border-box}

.kid.sel .chk{background:var(--teal);border-color:var(--teal)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-bottom:3px;background:#e8eef5;color:var(--navy)}

.cbtn.sel{background:var(--ok);border-color:var(--ok);color:#fff}
.cbtn.wrong{border-color:#e0b4a8;color:#b88a7f;background:#faf1ee;text-decoration:line-through}

.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-weight:600;font-size:13.5px;color:var(--navy)}
select,textarea,input[type=text]{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}
textarea{min-height:140px;resize:vertical}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:14px}
.checks label:has(input:checked){border-color:var(--teal);background:#effaf8}
.checks input{margin-top:3px;accent-color:var(--teal)}
.bubble{position:relative;background:#fff;border:2px solid var(--navy2);border-radius:14px;padding:8px 12px;font-style:italic}
.bubble:before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:var(--navy2);border-left:0}
.scn{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:start;margin-bottom:8px}
.scn .av svg{width:76px;height:76px}
.hs{cursor:pointer}.hs .ring{animation:pulse 1.8s infinite;transform-box:fill-box;transform-origin:center}
.hs.seen .ring{animation:none;opacity:0}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.hs:hover circle.dot,.hs:focus circle.dot{stroke:#f2b705;stroke-width:4}
.ok-badge{display:inline-flex;align-items:center;gap:6px;background:var(--okbg);color:#0f4d2a;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}
.mini{font-size:12.5px;color:var(--mute)}
.sumrow{border-left:4px solid var(--teal);padding:4px 10px;margin:0 0 8px;background:#fff;border-radius:0 8px 8px 0}
@media (max-width:720px){.hero .bn{display:none}.hero h1{font-size:18px}.hero p{display:none}.pill .t{display:none}.pill{justify-content:center;padding:5px}.g2,.g3{grid-template-columns:1fr}.crow{grid-template-columns:1fr}.cbtns{justify-content:flex-start}main{padding:12px}.scn{grid-template-columns:56px 1fr}.scn .av svg{width:52px;height:52px}}

function mcq(parent,{prompt,options,onCorrect,shuffle=true,cls=''}){
 const box=el('div','q '+cls);if(prompt)box.appendChild(el('p','qp',prompt));
 const list=el('div','opts'),fb=el('div','fb');fb.setAttribute('role','status');let done=false;
 (shuffle?shuf(options):options).forEach(o=>{const b=el('button','opt',o.t);b.type='button';
  b.onclick=()=>{if(done||b.classList.contains('bad'))return;
   if(o.ok){done=true;b.classList.add('good');$$('.opt',list).forEach(x=>x.disabled=true);fb.className='fb show good';fb.innerHTML='✅ '+o.fb;onCorrect&&onCorrect()}
   else{b.classList.add('bad');b.disabled=true;fb.className='fb show bad';fb.innerHTML='🔁 '+o.fb+' <b>Try another option.</b>'}};
  list.appendChild(b)});
 box.appendChild(list);box.appendChild(fb);parent.appendChild(box);return box}

function classify(parent,{items,cats,onDone,shuffle=true}){
 let n=0;const prog=el('div','prog',`0 / ${items.length} sorted`);parent.appendChild(prog);
 (shuffle?shuf(items):items).forEach(it=>{
  const row=el('div','crow');row.appendChild(el('div','',it.t));const btns=el('div','cbtns'),note=el('div','cnote');note.setAttribute('role','status');
  cats.forEach(c=>{const b=el('button','cbtn',c.label);b.type='button';
   b.onclick=()=>{if(row.dataset.ok)return;
    if(c.id===it.cat){row.dataset.ok=1;row.classList.add('ok');$$('.cbtn',btns).forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('dim')});b.classList.add('sel');
     note.className='cnote show good';note.innerHTML='✅ '+it.why;n++;prog.textContent=`${n} / ${items.length} sorted`;if(n===items.length&&onDone)onDone()}
    else{b.classList.add('wrong');b.disabled=true;note.className='cnote show bad';note.innerHTML='🔁 Not quite — try another category.'}};
   btns.appendChild(b)});
  row.appendChild(btns);row.appendChild(note);parent.appendChild(row)})}

function copyBox(ta,btn){btn.onclick=()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 const old=btn.textContent;btn.textContent=ok?'Copied ✓':'Press Ctrl/Cmd + C to copy';setTimeout(()=>btn.textContent=old,2200)}}

function runApp({steps}){
 const stepsEl=$('#steps'),main=$('#main'),back=$('#back'),next=$('#next'),stat=$('#stat');
 const done=steps.map(()=>false);let cur=0;
 const pills=steps.map((s,i)=>{const p=el('button','pill',`<span class="n">${i+1}</span><span class="t">${s.name}</span>`);p.type='button';p.title=s.name;p.onclick=()=>go(i);stepsEl.appendChild(p);return p});
 const panels=steps.map((s,i)=>{const d=el('section','panel');d.setAttribute('aria-label',s.name);main.appendChild(d);
  s.build(d,()=>{done[i]=true;paint()});return d});
 function paint(){pills.forEach((p,i)=>{p.classList.toggle('on',i===cur);p.classList.toggle('done',done[i]);p.querySelector('.n').textContent=done[i]&&i!==cur?'✓':i+1;if(i===cur)p.setAttribute('aria-current','step');else p.removeAttribute('aria-current')});
  panels.forEach((d,i)=>d.classList.toggle('show',i===cur));back.disabled=cur===0;next.disabled=cur===steps.length-1;
  stat.textContent=`Step ${cur+1} of ${steps.length} · ${done.filter(Boolean).length} completed`}
 function go(i){cur=i;paint();steps[i].show&&steps[i].show(panels[i]);main.scrollTop=0}
 back.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);go(0)}

{name:'Three Levers',build(p,ok){

 classify(p,{cats:[{id:'a',label:'Access'},{id:'e',label:'Engage'},{id:'s',label:'Show'}],onDone:ok,items:[

 {t:'Offer sentence starters for written explanations.',cat:'s',why:'Scaffolds for expression, while the goal stays the same.'}]})}},

{name:'Adaptation Studio',build(p,ok){
 p.innerHTML=`<h2>Plan an adaptation for each focus student</h2><p class="lead">Strong adaptations connect to <b>evidence</b> (observations or assessment) and to <b>assets</b>. Choose the best adaptation for each student.</p>`;
 let n=0;FS.forEach(f=>{const w=el('div','scn');w.appendChild(el('div','av',avatar(f.av)));const r=el('div','');
  r.appendChild(el('div','',`<span class="tag ot">${f.role}</span> <b>${f.name}</b>`));
  r.appendChild(el('div','mini',`<b>Evidence:</b> ${f.evidence}<br><b>Asset:</b> ${f.asset}`));
  mcq(r,{prompt:'Which adaptation fits '+f.name+'?',options:f.opts,onCorrect:()=>{const o=f.opts.find(x=>x.ok);plan[f.id]=`I will ${o.adapt} for ${f.name} because ${o.ev}, building on ${o.as}.`;if(++n===FS.length){p.appendChild(el('div','fb show good','🌟 <b>All three adaptations selected.</b> Each has a rationale tied to evidence and an asset. Your rationale sentences are ready in the final step.'));ok()}}});
  w.appendChild(r);p.appendChild(w)})}},

 p.innerHTML=`<h2>Collaborate with your campus team</h2><p class="lead">Special educators, counselors, EL coordinators, and your master teacher share responsibility for student progress. Who would you go to first?</p>
 <svg viewBox="0 0 700 110" style="width:100%;max-height:100px;display:block;margin:0 0 10px" role="img" aria-label="Candidate in the center connected to four campus team members">
 <rect width="700" height="110" rx="12" fill="#fff" stroke="#d5dee8"/><g stroke="#9db7d5" stroke-width="2"><path d="M350 55H165M350 55H265M350 55H435M350 55H535"/></g>
 <g font-family="Segoe UI,Arial" font-size="12" text-anchor="middle" fill="#1d3557" font-weight="600">
 <circle cx="350" cy="55" r="26" fill="#1d3557"/><text x="350" y="60" fill="#fff" font-size="13">You</text>
 <circle cx="140" cy="45" r="22" fill="#5c6bc0"/><text x="140" y="50" fill="#fff" font-size="16">IEP</text><text x="140" y="92">Case manager</text>
 <circle cx="255" cy="45" r="22" fill="#e76f51"/><text x="255" y="52" fill="#fff" font-size="19">♥</text><text x="255" y="92">Counselor</text>
 <circle cx="445" cy="45" r="22" fill="#2a9d8f"/><text x="445" y="51" fill="#fff" font-size="16">EL</text><text x="445" y="92">EL coordinator</text>
 <circle cx="560" cy="45" r="22" fill="#e9a820"/><text x="560" y="52" fill="#fff" font-size="18">★</text><text x="560" y="92">Master teacher</text></g></svg>`;
 classify(p,{cats:[{id:'cm',label:'Case manager'},{id:'co',label:'Counselor'},{id:'el',label:'EL coordinator'},{id:'mt',label:'Master teacher'}],onDone:ok,items:[
 {t:'You’re unsure how to apply a student’s IEP math-test accommodations.',cat:'cm',why:'The case manager or special educator knows the IEP and how it’s implemented. Plan with families, too.'},
 {t:'A student seems withdrawn and anxious after a change at home.',cat:'co',why:'Counselors support student well-being and can advise on next steps.'},
 {t:'You need language-proficiency data and ideas for supporting a newcomer.',cat:'el',why:'EL coordinators share proficiency information and strategies.'},
 {t:'You want to co-plan adaptations and learn the class’s routines for early finishers.',cat:'mt',why:'Your master teacher knows the students and routines and can co-plan with you.'}]})}},

{name:'Technology Tools',build(p,ok){
 p.innerHTML=`<h2>Let technology serve the learning goal</h2><p class="lead">Choose tools that remove a barrier, not tools that add complexity. Match each barrier to the best type of tool from the Free Learning Tools Repository.</p>
 <svg viewBox="0 0 700 100" style="width:100%;max-height:92px;display:block;margin:0 0 10px" role="img" aria-label="Four tool types: read-aloud, virtual manipulatives, voice recording, visual timer">
 <rect width="700" height="100" rx="12" fill="#fff" stroke="#d5dee8"/><g font-family="Segoe UI,Arial" font-size="12" font-weight="600" fill="#1d3557" text-anchor="middle">
 <g><rect x="40" y="14" width="130" height="56" rx="10" fill="#e6f0fb"/><path d="M80 42h10l12-10v28l-12-10H80z" fill="#2f6fb5"/><path d="M112 36q6 6 0 12M118 32q10 10 0 20" stroke="#2f6fb5" stroke-width="3" fill="none" stroke-linecap="round"/><text x="105" y="88">Read-aloud</text></g>
 <g><rect x="200" y="14" width="130" height="56" rx="10" fill="#e5f6ec"/><rect x="224" y="32" width="38" height="20" rx="3" fill="#2a9d8f"/><rect x="266" y="32" width="19" height="20" rx="3" fill="#7fd1c7"/><rect x="288" y="32" width="19" height="20" rx="3" fill="#7fd1c7"/><text x="265" y="88">Virtual manipulatives</text></g>
 <g><rect x="360" y="14" width="130" height="56" rx="10" fill="#fdece6"/><rect x="418" y="22" width="14" height="26" rx="7" fill="#e76f51"/><path d="M410 42q0 14 15 14t15-14" stroke="#e76f51" stroke-width="3" fill="none"/><text x="425" y="88">Voice recording</text></g>
 <g><rect x="520" y="14" width="140" height="56" rx="10" fill="#fff8e6"/><circle cx="590" cy="42" r="19" fill="none" stroke="#e9a820" stroke-width="4"/><path d="M590 42V30M590 42l9 5" stroke="#e9a820" stroke-width="3" stroke-linecap="round"/><text x="590" y="88">Visual timer</text></g></g></svg>`;
 classify(p,{cats:[{id:'tts',label:'Read-aloud'},{id:'vm',label:'Virtual manipulatives'},{id:'stt',label:'Voice recording'},{id:'tm',label:'Visual timer'}],onDone:ok,items:[
 {t:'Marcus decodes word problems slowly and loses the math thinking.',cat:'tts',why:'Text-to-speech provides access to the words so he can focus on the math (also an IEP accommodation).'},
 {t:'Marcus needs to build and see equal parts at home, away from the physical tiles.',cat:'vm',why:'Virtual fraction tiles extend the concrete model into other settings.'},
 {t:'Sofia explains ideas orally but struggles to write them.',cat:'stt',why:'Recording or voice-typing lets her show understanding while she builds writing skills.'},
 {t:'Jayden loses track of time during independent work.',cat:'tm',why:'A visual timer with a checklist supports pacing and self-regulation.'}]})}},

{name:'My Adaptation Plan',show(p){this.draw(p)},build(p,ok){this.ok=ok;this.draw=(root)=>{
 root.innerHTML=`<h2>Your Part 2 draft</h2><p class="lead">Each rationale connects <b>what you’ll adapt</b>, <b>the evidence</b>, and <b>the asset</b>. Edit the text to reflect your real focus students, then copy it into your CalTPA Plan | Part 2.</p>`;
 const have=FS.filter(f=>plan[f.id]);
 if(have.length<3)root.appendChild(el('div','callout','<span>ℹ️</span><div>Complete the <b>Adaptation Studio</b> step to generate all three rationale sentences.</div>'));
 const ta=el('textarea');ta.style.minHeight='190px';ta.setAttribute('aria-label','Editable adaptation plan');
 ta.value=FS.map(f=>`${f.role.toUpperCase()}\n${plan[f.id]||'(not yet completed)'}\n`).join('\n')+'\nCAMPUS TEAM: I will consult the case manager (IEP), counselor (well-being), EL coordinator (language data), and my master teacher (co-planning).\n\nTECHNOLOGY: read-aloud for word problems, virtual manipulatives for practice, voice recording for explanations, and a visual timer for pacing.';
 root.appendChild(ta);const r=el('div','');r.style.marginTop='8px';const cp=el('button','btn','Copy plan');cp.type='button';copyBox(ta,cp);r.appendChild(cp);root.appendChild(r);
 root.appendChild(el('div','callout','<span>✅</span><div><b>Before you submit:</b> Is each adaptation tied to evidence? Do you name an asset? Is the expectation still high?</div>')).style.marginTop='12px';
 if(have.length===3)this.ok()}}}
]});
</script></body></html>
