<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSYC 510 Week 3: From Broad Screen to Targeted Measure</title>
<style>
:root{--red:#d34147;--red-d:#a8353a;--sand:#edebe8;--ink:#2b2b2b;--mut:#5b5b5b;--ok:#1d7a4d;--okbg:#e6f4ec;--bad:#a8353a;--badbg:#fbeaea;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#fff}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:15px}
.app{height:100%;overflow-y:auto;overflow-x:hidden;padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--sand);padding-bottom:6px}
header .ico{flex:0 0 44px;width:44px;height:44px}
.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red-d);font-weight:700}
h1{font-size:1.35rem;margin:0;line-height:1.2}
.sub{margin:2px 0 0;color:var(--mut);font-size:.92rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;border:2px solid var(--sand);background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.tab:hover{border-color:var(--red)}
button:focus-visible{outline:3px solid #1a4fd6;outline-offset:2px}
.panel{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:12px;background:var(--sand);border-radius:18px;padding:10px}
.panel[hidden]{display:none}
.gfx{background:#fff;border-radius:14px;padding:8px;display:flex;align-items:center;justify-content:center;min-height:0}
.gfx svg{width:100%;height:auto;max-height:100%;display:block}
.qa{background:#fff;border-radius:14px;padding:10px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.intro{font-size:.9rem;color:var(--mut);margin:0}
.count{font-size:.8rem;font-weight:700;color:var(--red-d);text-transform:uppercase;letter-spacing:.05em}
.bar{height:6px;background:var(--sand);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--red);transition:width .3s}
.q{font-size:1rem;font-weight:600;margin:2px 0}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{font:inherit;text-align:left;background:#fcfcfc;border:2px solid #ddd;border-left:6px solid var(--red);border-radius:12px;padding:6px 12px;cursor:pointer;min-height:42px;color:var(--ink)}
.opt:hover:not(:disabled){background:#fff5f5;border-color:var(--red)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok);border-left-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{min-height:0;font-size:.95rem}
.fb .box{border-radius:12px;padding:7px 12px;font-size:.9rem}
.fb .ok{background:var(--okbg);border-left:6px solid var(--ok)}
.fb .no{background:var(--badbg);border-left:6px solid var(--bad)}
.nav{margin-top:auto;display:flex;justify-content:flex-end;min-height:44px}
.btn{font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:999px;padding:8px 22px;cursor:pointer;min-height:44px}
.btn:hover{background:var(--red-d)}
.btn[hidden]{display:none}
.done{text-align:center;padding:10px}
.done .score{font-size:2.2rem;font-weight:800;color:var(--red-d)}
.note{font-size:.78rem;color:var(--mut);margin:0}
@media (max-width:680px){.panel{grid-template-columns:1fr}.gfx svg{max-height:200px}h1{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header><svg class="ico" viewBox="0 0 52 52" role="img" aria-label="Layered funnel"><path d="M6 8h40l-6 10H12z" fill="#d34147"/><path d="M12 22h28l-5 10H17z" fill="#a8353a"/><path d="M18 36h16l-3 10H21z" fill="#edebe8" stroke="#d34147" stroke-width="2.5"/></svg><div><div class="kicker">PSYC 510 &middot; Week 3 Interactive</div><h1>From Broad Screen to Targeted Measure</h1><p class="sub">Build an instrument plan for three adult cases using the Level 1 to Level 2 approach.</p></div></header>
<div class="tabs" role="tablist" aria-label="Activities"><button type="button" role="tab" class="tab" aria-selected="false">Case A: Marcus</button><button type="button" role="tab" class="tab" aria-selected="false">Case B: Priya</button><button type="button" role="tab" class="tab" aria-selected="false">Case C: Dana</button></div>
<section class="panel" id="c_a" role="tabpanel"><div class="gfx"></div><div class="qa"></div></section><section class="panel" id="c_b" role="tabpanel"><div class="gfx"></div><div class="qa"></div></section><section class="panel" id="c_c" role="tabpanel"><div class="gfx"></div><div class="qa"></div></section>
</div>
<script>
function Quiz(root, items, o){
  o=o||{}; var i=0, score=0, picks=[], answered=false;
  var gfx=root.querySelector('.gfx'), qa=root.querySelector('.qa');
  function esc(s){return s}
  function draw(ans, it){ gfx.innerHTML = o.gfx ? o.gfx(i,picks,ans,it) : it.svg; }
  function render(){
    answered=false; var it=items[i]; draw(false,it);
    var opts=it.opts.map(function(t,k){return '<button type="button" class="opt" data-k="'+k+'">'+t+'</button>';}).join('');
    qa.innerHTML=(o.intro?'<p class="intro">'+o.intro+'</p>':'')+
      '<div class="count">'+(o.label||'Question')+' '+(i+1)+' of '+items.length+'</div>'+
      '<div class="bar" aria-hidden="true"><span style="width:'+(i/items.length*100)+'%"></span></div>'+
      '<p class="q">'+it.q+'</p><div class="opts">'+opts+'</div>'+
      '<div class="fb" aria-live="polite"></div>'+
      '<div class="nav"><button type="button" class="btn next" hidden>'+(i<items.length-1?'Next':'See results')+'</button></div>';
  }
  function finish(){
    gfx.innerHTML = o.doneGfx ? o.doneGfx() : (o.gfx? o.gfx(items.length-1,picks,true,items[items.length-1]):'');
    var pct=Math.round(score/items.length*100);
    var msg = pct===100 ? (o.perfect||'Excellent work.') : pct>=60 ? 'Good progress. Review the explanations and try again for a perfect round.' : 'Worth another pass. Read each explanation, then restart.';
    qa.innerHTML='<div class="done"><div class="count">Results</div><div class="score">'+score+' / '+items.length+'</div><p>'+msg+'</p><button type="button" class="btn restart">Try again</button></div>';
    qa.querySelector('.restart').focus();
  }
  qa.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.classList.contains('restart')){i=0;score=0;picks=[];render();return;}
    if(b.classList.contains('next')){ if(i<items.length-1){i++;render();qa.querySelector('.opt').focus();} else finish(); return;}
    if(b.classList.contains('opt') && !answered){
      answered=true; var it=items[i], k=+b.dataset.k, ok=(k===it.ans); if(ok) score++; picks[i]=k;
      qa.querySelectorAll('.opt').forEach(function(x){x.disabled=true; if(+x.dataset.k===it.ans) x.classList.add('right');});
      if(!ok) b.classList.add('wrong');
      qa.querySelector('.fb').innerHTML='<div class="box '+(ok?'ok':'no')+'"><strong>'+(ok?'Correct. ':'Not quite. ')+'</strong>'+it.why+'</div>';
      var n=qa.querySelector('.next'); n.hidden=false; n.focus(); draw(true,it);
    }
  });
  render();
}
function initTabs(){
  var tabs=[].slice.call(document.querySelectorAll('.tab')), panels=[].slice.call(document.querySelectorAll('.panel'));
  function sel(n){tabs.forEach(function(t,k){t.setAttribute('aria-selected',k===n);t.tabIndex=k===n?0:-1;});panels.forEach(function(p,k){p.hidden=k!==n;});}
  tabs.forEach(function(t,k){t.addEventListener('click',function(){sel(k);});
    t.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){var n=(k+d+tabs.length)%tabs.length;sel(n);tabs[n].focus();}});});
  sel(0);
}

(function(){
function ladder(step,done,cap){
  var L=[['LEVEL 1','Broad screen',20,240],['LEVEL 2','Deeper dive',70,200],['THIRD MEASURE','Severity / disability / personality / development',120,160]];
  var s='<svg viewBox="0 0 260 300" role="img" aria-label="Three-step funnel: Level 1 screen, Level 2 follow-up, then a third measure">';
  L.forEach(function(l,k){
    var y=20+k*88, x=(260-l[3])/2, active=(k===step&&!done), ok=(k<step)||done;
    s+='<rect x="'+x+'" y="'+y+'" width="'+l[3]+'" height="70" rx="12" fill="'+(ok?'#e6f4ec':active?'#d34147':'#edebe8')+'" stroke="'+(ok?'#1d7a4d':'#a8353a')+'" stroke-width="'+(active?4:2)+'"/>';
    s+='<text x="130" y="'+(y+28)+'" text-anchor="middle" font-size="14" font-weight="800" fill="'+(active?'#fff':'#2b2b2b')+'">'+(ok?'\u2713 ':'')+l[0]+'</text>';
    var t=l[1].length>26?['Severity, disability,','personality, development']:[l[1]];
    t.forEach(function(tt,j){s+='<text x="130" y="'+(y+47+j*15)+'" text-anchor="middle" font-size="'+(t.length>1?11:12)+'" fill="'+(active?'#fff':'#2b2b2b')+'">'+tt+'</text>';});
    if(k<2) s+='<path d="M130 '+(y+72)+'v14" stroke="#a8353a" stroke-width="3" /><path d="M123 '+(y+80)+'l7 8 7-8" fill="none" stroke="#a8353a" stroke-width="3"/>';
  });
  return s+'</svg>';
}
var S1=["Level 1 cross-cutting symptom screen (a broad look across many domains)","A single disorder-specific severity measure","A personality inventory","A disability measure only"];
function mk(name,vig,l2,l3,whys){
  return [
   {q:'<strong>'+name+':</strong> '+vig+'<br><em>Step 1. What should the clinician use first?</em>',opts:S1,ans:0,why:"Start broad. A Level 1 screen flags which symptom domains deserve a closer look before narrowing to specific tools."},
   {q:'<em>Step 2. The Level 1 screen flags a concern. Which Level 2 follow-up fits best?</em>',opts:l2.o,ans:l2.a,why:l2.w},
   {q:'<em>Step 3. Which additional type of measure adds the most for this case?</em>',opts:l3.o,ans:l3.a,why:l3.w}
  ];
}
var T3=["Disorder-specific severity measure","Disability measure","Personality inventory","Early development and home background form"];
var casesData={
 a:mk("Marcus, age 34","For several months he has felt down, lost interest in his usual activities, sleeps poorly, and has been missing shifts at work.",
  {o:["Level 2: Depression","Level 2: Mania","Level 2: Substance use","Level 2: Repetitive thoughts and behaviors"],a:0,w:"Low mood and loss of interest point to the depression domain."},
  {o:T3,a:1,w:"He is missing work, so how symptoms affect daily functioning matters. A disability measure captures that impact. A severity measure could also be defended; justify your choice with the readings. The early development form is for children."}),
 b:mk("Priya, age 28","Since a serious car accident she has frequent nightmares, avoids driving, and startles easily.",
  {o:["Level 2: Anxiety","Level 2: Mania","Level 2: Substance use","Level 2: Memory"],a:0,w:"Avoidance, hyperarousal, and fear after a trauma align most closely with the anxiety domain."},
  {o:T3,a:0,w:"A disorder-specific severity measure (for trauma symptoms) helps the clinician gauge how intense the symptoms are. A personality inventory is not the best fit for a single recent event, and the development form is for children."}),
 c:mk("Dana, age 41","Over many years she has had intense conflicts with coworkers, unstable close relationships, and frequent anger that she says surprises even her.",
  {o:["Level 2: Anger","Level 2: Sleep disturbance","Level 2: Somatic symptoms","Level 2: Mania"],a:0,w:"Frequent, intense anger is the clearest flagged domain, so the Level 2 anger follow-up is the sensible next step."},
  {o:T3,a:2,w:"A long-standing pattern across relationships and settings calls for a look at personality functioning, so a personality inventory fits. Remember: you recommend, and the licensed clinician selects, administers, and interprets."})
};
['a','b','c'].forEach(function(k){
  Quiz(document.getElementById('c_'+k),casesData[k],{label:'Step',
    intro:'Practice exercise: you recommend; the clinician decides.',
    gfx:function(i,p,a){return ladder(i,false);},
    doneGfx:function(){return ladder(3,true);},
    perfect:'Strong recommendations: broad screen first, then targeted follow-up, then a measure matched to the case.'});
});
})();
initTabs();
</script>
</body>
</html>
