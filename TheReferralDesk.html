<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Referral Desk - Intervention Coordinator Simulation</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600;800;900&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    .font-handwriting {
      font-family: 'Caveat', cursive;
    }
  </style>
</head>
<body class="bg-[#A67C52] h-screen w-screen overflow-hidden">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- SVG ICON COMPONENTS ---
    const ArrowLeft = ({ size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    );

    const CheckCircle2 = ({ size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
    );

    const AlertTriangle = ({ size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    );

    const FileText = ({ size = 18, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
    );

    const BarChart2 = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    );

    const Users = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    );

    const Clock = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    );

    const BookOpenCheck = ({ size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H2v15h6a4 4 0 0 1 4 4 4 4 0 0 1 4-4h6V3h-6a4 4 0 0 0-4 4 4 4 0 0 0-4-4z"/><path d="m9 12 2 2 4-4"/></svg>
    );

    const RotateCcw = ({ size = 14 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    );

    // --- DATA STRUCTURES ---
    const DECISION_TYPES = {
      RTI: { 
        id: 'RTI', 
        label: 'RTI REFERRAL', 
        bgColor: 'bg-[#2563EB]', 
        hoverColor: 'hover:bg-[#1D4ED8]',
        textColor: 'text-white',
        icon: BarChart2 
      },
      EL: { 
        id: 'EL', 
        label: 'EL SUPPORT REFERRAL', 
        bgColor: 'bg-[#D97706]', 
        hoverColor: 'hover:bg-[#B45309]',
        textColor: 'text-white',
        icon: Users 
      },
      DATA: { 
        id: 'DATA', 
        label: 'NEED MORE DATA', 
        bgColor: 'bg-[#9333EA]', // Royal Purple
        hoverColor: 'hover:bg-[#7E22CE]',
        textColor: 'text-white',
        icon: Clock 
      },
    };

    const CASES = [
      {
        id: 1,
        student: "Diego",
        grade: 3,
        avatar: "https://raw.githubusercontent.com/APU-Global/Instructional_Media/main/Diego.jpeg",
        visuals: [
          "5 MONTHS IN U.S.",
          "MATH COMPUTATION: GRADE LEVEL",
          "READING DISCUSSION: STRUGGLES",
          "TEACHER OBSERVATION"
        ],
        readable: [
          "Diego moved to the U.S. five months ago.",
          "His math computation scores are at grade level.",
          "His teacher notes he \"seems to struggle to keep up\" during whole-class reading discussions.",
          "In class, he rarely raises his hand and takes longer than classmates to respond to questions in English."
        ],
        correctDecision: DECISION_TYPES.EL.id,
        decidingClue: {
          clue: "Diego's math computation — a less language-dependent skill — is at grade level, while his difficulty appears during English-heavy reading discussions. Combined with only five months of English exposure, the evidence points first toward language support rather than an assumed skill deficit.",
          note: "Strong performance in a lower-language-load task + limited English exposure = investigate language access first."
        }
      },
      {
        id: 2,
        student: "Amara",
        grade: 5,
        avatar: "https://raw.githubusercontent.com/APU-Global/Instructional_Media/main/Amara.jpeg",
        visuals: [
          "ENROLLED SINCE KINDERGARTEN",
          "ENGLISH FIRST LANGUAGE",
          "READING FLUENCY: STALLED",
          "NO GROWTH FOR 2+ YEARS"
        ],
        readable: [
          "Amara has been enrolled in the district since kindergarten and speaks English as her first language.",
          "Her running records show she has not progressed in reading fluency in over two years despite consistent classroom instruction.",
          "She has already completed two rounds of documented small-group reteaching with no measurable growth."
        ],
        correctDecision: DECISION_TYPES.RTI.id,
        decidingClue: {
          clue: "The concern has persisted over time despite consistent instruction and documented intervention. The evidence shows stalled growth and limited response to support.",
          note: "Persistent skill difficulty + documented intervention + progress-monitoring data = RTI evidence."
        }
      },
      {
        id: 3,
        student: "Kwame",
        grade: 7,
        avatar: "https://raw.githubusercontent.com/APU-Global/Instructional_Media/main/Kwame.jpeg",
        visuals: [
          "RECENTLY ARRIVED",
          "FRANCOPHONE BACKGROUND",
          "STRONG FRENCH LITERACY",
          "IDEAS: COMPLEX & ORGANIZED"
        ],
        readable: [
          "Kwame recently arrived from a Francophone country and has strong literacy skills in French.",
          "In English class, his writing shows sentence-level grammar errors typical of French-to-English language transfer.",
          "His ideas are complex and well-organized when he's allowed to plan in French first."
        ],
        correctDecision: DECISION_TYPES.EL.id,
        decidingClue: {
          clue: "Kwame's errors follow a predictable first-language transfer pattern, while his ideas and organization remain strong when the language barrier is reduced.",
          note: "Language-transfer pattern + strong underlying literacy = investigate language support before assuming a learning deficit."
        }
      },
      {
        id: 4,
        student: "Priya",
        grade: 2,
        avatar: "https://raw.githubusercontent.com/APU-Global/Instructional_Media/main/Priya.jpeg",
        visuals: [
          "NATIVE ENGLISH SPEAKER",
          "LETTER REVERSALS",
          "PHONICS INTERVENTION: 6 WKS",
          "MINIMAL GROWTH OBSERVED"
        ],
        readable: [
          "Priya is a native English speaker exhibiting letter reversals and difficulty rhyming in core instruction.",
          "Has consistently missed early literacy benchmarks.",
          "Completed a 6-week direct phonics intervention cycle followed by a second intervention cycle with minimal growth."
        ],
        correctDecision: DECISION_TYPES.RTI.id,
        decidingClue: {
          clue: "There is no English-acquisition factor in the file, and multiple documented intervention cycles have already been attempted and monitored. The progress data shows insufficient growth.",
          note: "Intervention attempted + progress monitored + insufficient response = evidence for RTI review."
        }
      },
      {
        id: 5,
        student: "Malia",
        grade: 4,
        avatar: "https://raw.githubusercontent.com/APU-Global/Instructional_Media/main/Malia.jpeg",
        isTrap: true,
        visuals: [
          "18 MONTHS IN U.S.",
          "CONVERSATIONAL: FLUENT",
          "WRITING SCORE: LOW",
          "SINGLE PROMPT REFERRAL"
        ],
        readable: [
          "Malia has been in the U.S. for 18 months. Her oral English is conversational and fluent-sounding.",
          "She was recently referred for RTI based on a single low score on a grade-level writing prompt.",
          "No one has yet checked her academic English proficiency or looked at writing samples in a less language-dependent format."
        ],
        missingEvidence: [
          "ACADEMIC ENGLISH PROFICIENCY?",
          "ALTERNATE WRITING SAMPLE?",
          "ADDITIONAL DATA?"
        ],
        correctDecision: DECISION_TYPES.DATA.id,
        decidingClue: {
          clue: "Malia's conversational English may sound fluent without telling us whether she has developed the academic English needed for grade-level writing. One low score is not enough to determine the cause of the difficulty.",
          note: "ONE SCORE + NO ACADEMIC LANGUAGE DATA + NO ALTERNATE EVIDENCE = NEED MORE DATA"
        }
      }
    ];

    const FlatDeskDecorations = () => (
      <div className="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        {/* Laptop Top-Left */}
        <div className="absolute -top-10 -left-10 w-60 h-52 bg-stone-300 border-4 border-stone-400 rounded-xl rotate-12 flex flex-col items-center justify-end p-2 shadow-2xl opacity-75">
          <div className="w-full h-3/4 bg-slate-800 rounded border-2 border-slate-900 mb-1 p-2 flex flex-col justify-between">
            <div className="w-full h-2 bg-slate-700 rounded"></div>
            <div className="w-2/3 h-2 bg-slate-700 rounded"></div>
            <div className="w-1/2 h-2 bg-slate-700 rounded"></div>
          </div>
          <div className="w-4/5 h-1/5 bg-stone-400 rounded-sm grid grid-cols-10 gap-0.5 p-1">
            {[...Array(20)].map((_, i) => <div key={i} className="bg-stone-500 rounded-[1px]"></div>)}
          </div>
        </div>

        {/* Calendar Top-Center */}
        <div className="absolute top-2 left-1/4 transform -translate-x-1/2 w-40 h-20 bg-white border border-stone-300 rounded shadow-md flex flex-col opacity-80">
          <div className="bg-red-700 h-4 text-white font-black text-[9px] flex items-center justify-center uppercase tracking-wider">
            OCTOBER
          </div>
          <div className="grid grid-cols-7 flex-1 p-1 gap-1 text-[8px] text-center font-bold text-stone-500">
            {[...Array(14)].map((_, i) => (
              <div key={i} className={`flex items-center justify-center ${i === 8 ? 'bg-amber-300 text-stone-900 rounded-full font-black' : ''}`}>
                {i + 10}
              </div>
            ))}
          </div>
        </div>

        {/* Sticky Note Reminder */}
        <div className="absolute top-8 left-[31%] bg-[#FEF08A] p-2 rotate-6 shadow-md border border-amber-300 z-10">
          <p className="font-handwriting font-extrabold text-xs text-amber-950 leading-none">
            RTI TEAM MEETING
          </p>
        </div>

        {/* Clock Top-Right */}
        <div className="absolute top-2 right-1/4 w-24 h-24 bg-white rounded-full border-4 border-stone-800 shadow-xl flex items-center justify-center opacity-80">
          <div className="w-2 h-2 bg-black rounded-full absolute z-10"></div>
          <div className="w-1 h-7 bg-black absolute bottom-1/2 left-[calc(50%-2px)] origin-bottom rotate-45"></div>
          <div className="w-1.5 h-5 bg-black absolute bottom-1/2 left-[calc(50%-3px)] origin-bottom rotate-[300deg]"></div>
          <span className="absolute top-1 text-[8px] font-black text-stone-700">12</span>
          <span className="absolute bottom-1 text-[8px] font-black text-stone-700">6</span>
          <span className="absolute left-1 text-[8px] font-black text-stone-700">9</span>
          <span className="absolute right-1 text-[8px] font-black text-stone-700">3</span>
        </div>

        {/* Telephone Right-Edge */}
        <div className="absolute top-1/3 -right-8 w-24 h-44 bg-stone-800 rounded-xl shadow-2xl border-2 border-stone-700 flex flex-col p-2 opacity-75">
          <div className="w-full h-7 bg-slate-900 rounded mb-2"></div>
          <div className="grid grid-cols-3 gap-1 flex-1">
            {[...Array(12)].map((_, i) => <div key={i} className="bg-stone-600 rounded-full"></div>)}
          </div>
        </div>

        {/* Coffee Cup Bottom-Left */}
        <div className="absolute bottom-4 left-6 w-14 h-14 bg-stone-200 rounded-full shadow-xl border-4 border-white flex items-center justify-center opacity-85">
          <div className="w-10 h-10 bg-[#4A2E24] rounded-full border-2 border-[#362119]"></div>
        </div>
      </div>
    );

    function App() {
      const [gameState, setGameState] = useState('intro'); 
      const [currentCaseIndex, setCurrentCaseIndex] = useState(0);
      const [selectedDecision, setSelectedDecision] = useState(null);
      const [revealed, setRevealed] = useState(false);
      const [history, setHistory] = useState(['intro']);
      const [results, setResults] = useState([]);

      const currentCase = CASES[currentCaseIndex];

      const pushState = (newState) => {
        setHistory(prev => [...prev, newState]);
        setGameState(newState);
      };

      const handleBack = () => {
        if (history.length <= 1) return;
        const newHistory = [...history];
        newHistory.pop();
        const previousState = newHistory[newHistory.length - 1];

        if (gameState === 'playing' && revealed) {
          setRevealed(false);
          setSelectedDecision(null);
        } else if (gameState === 'playing' && !revealed && currentCaseIndex > 0) {
          const prevIdx = currentCaseIndex - 1;
          setCurrentCaseIndex(prevIdx);
          setRevealed(true);
          const prevResult = results.find(r => r.caseIndex === prevIdx);
          setSelectedDecision(prevResult ? prevResult.choice : null);
        } else {
          setGameState(previousState);
        }
        setHistory(newHistory);
      };

      const handleDecisionSelect = (decisionId) => {
        if (revealed) return;
        setSelectedDecision(decisionId);
        setRevealed(true);

        const isCorrect = decisionId === currentCase.correctDecision;
        setResults(prev => {
          const filtered = prev.filter(r => r.caseIndex !== currentCaseIndex);
          return [...filtered, { caseIndex: currentCaseIndex, choice: decisionId, isCorrect }];
        });
      };

      const handleNextCase = () => {
        if (currentCaseIndex < CASES.length - 1) {
          setCurrentCaseIndex(prev => prev + 1);
          setSelectedDecision(null);
          setRevealed(false);
          pushState('playing');
        } else {
          pushState('synthesis');
        }
      };

      const startReview = () => {
        setCurrentCaseIndex(0);
        setSelectedDecision(null);
        setRevealed(false);
        setResults([]);
        pushState('playing');
      };

      return (
        <div className="h-screen w-screen bg-[#A67C52] flex flex-col font-sans overflow-hidden select-none relative">
          
          {/* HEADER BAR */}
          <header className="h-14 bg-stone-900 text-stone-100 flex items-center px-6 shadow-md z-30 shrink-0 border-b border-stone-800">
            <div className="w-1/3 flex items-center gap-3">
              <div className="bg-amber-500 text-stone-950 px-2.5 py-1 rounded font-black text-xs tracking-wider">
                CASE FILE DESK
              </div>
              <h1 className="font-black text-lg tracking-tight text-stone-100">THE REFERRAL DESK</h1>
            </div>

            <div className="w-1/3 text-center">
              <span className="bg-stone-800 text-amber-400 font-extrabold text-xs uppercase px-3 py-1 rounded-full border border-stone-700 tracking-wider">
                RTI TEAM MEETING REVIEW
              </span>
            </div>

            <div className="w-1/3 flex items-center justify-end gap-3 font-bold text-xs">
              <span className="text-stone-300">FILES REVIEWED: <strong className="text-white text-sm">{gameState === 'intro' ? 0 : currentCaseIndex + (revealed ? 1 : 0)}/5</strong></span>
              <div className="flex gap-1.5">
                {CASES.map((_, i) => {
                  const isDone = (gameState === 'playing' && i < currentCaseIndex) || (i === currentCaseIndex && revealed) || gameState === 'synthesis' || gameState === 'score';
                  const isCurrent = gameState === 'playing' && i === currentCaseIndex && !revealed;
                  return (
                    <div 
                      key={i} 
                      className={`w-5 h-5 rounded-full flex items-center justify-center font-bold text-[10px] transition-all ${
                        isDone ? 'bg-emerald-500 text-white' : isCurrent ? 'bg-amber-400 text-stone-900 ring-2 ring-amber-300' : 'bg-stone-700 text-stone-400'
                      }`}
                    >
                      {isDone ? '✓' : i + 1}
                    </div>
                  );
                })}
              </div>
            </div>
          </header>

          {/* MAIN VIEWPORT BODY */}
          <div className="flex-1 relative overflow-hidden flex items-center justify-center p-3">
            <FlatDeskDecorations />

            {/* 1. INTRO SCREEN */}
            {gameState === 'intro' && (
              <div className="z-20 bg-stone-50 border-4 border-stone-300 rounded-2xl shadow-2xl max-w-2xl w-full p-8 text-stone-900 flex flex-col items-center text-center my-auto">
                <span className="bg-amber-100 text-amber-900 border border-amber-300 font-black text-xs px-3 py-1 rounded-full uppercase tracking-widest mb-3">
                  INTERVENTION COORDINATOR SIMULATION
                </span>
                <h2 className="text-4xl font-black tracking-tight uppercase text-stone-900 mb-2">THE REFERRAL DESK</h2>
                <p className="text-lg font-extrabold text-stone-600 uppercase tracking-wide mb-6">
                  Five files. One meeting. Make the call.
                </p>
                
                <div className="bg-amber-50/90 border-2 border-amber-200 rounded-xl p-5 mb-6 text-stone-900 text-base font-semibold leading-relaxed text-left space-y-2">
                  <p>You're the intervention coordinator at your school. The RTI team meets to review this week's referrals — and five student files just landed on your desk.</p>
                  <p className="font-extrabold text-stone-950">Your job: review the evidence and decide what happens next.</p>
                </div>

                <div className="grid grid-cols-3 gap-3 w-full mb-8">
                  {Object.values(DECISION_TYPES).map(d => (
                    <div key={d.id} className={`${d.bgColor} ${d.textColor} font-black text-sm p-3.5 rounded-xl shadow-md text-center flex flex-col items-center justify-center gap-1.5`}>
                      <d.icon size={22} />
                      <span>{d.label}</span>
                    </div>
                  ))}
                </div>

                <button 
                  onClick={startReview}
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xl py-4 rounded-xl shadow-lg transition-transform hover:scale-[1.01] active:scale-[0.99] uppercase tracking-wider"
                >
                  START CASE REVIEW →
                </button>
              </div>
            )}

            {/* 2. CASE FILE GAMEPLAY SCREEN */}
            {gameState === 'playing' && (
              <div className="z-20 w-full max-w-[1280px] h-full flex gap-4 items-stretch relative min-h-0">
                
                {/* LEFT & CENTER: MANILA CASE FOLDER */}
                <div className="flex-1 bg-[#E8D299] border-2 border-[#D6B772] rounded-2xl shadow-2xl flex flex-col min-h-0 overflow-hidden relative">
                  
                  {/* Folder Tab Header */}
                  <div className="bg-[#D6B772] text-stone-900 px-6 py-1.5 font-black text-xs uppercase tracking-wider w-max rounded-b-lg ml-6 shadow-inner flex items-center gap-2">
                    <FileText size={16} /> FILE 0{currentCase.id} — {currentCase.student.toUpperCase()} (GRADE {currentCase.grade})
                  </div>

                  {/* Folder Body */}
                  <div className="flex-1 flex p-4 gap-4 min-h-0 overflow-hidden">
                    
                    {/* LEFT FLAP: Student Details & Visual Evidence */}
                    <div className="w-[42%] flex flex-col justify-between min-h-0 overflow-y-auto pr-1">
                      <div>
                        {/* Student Polaroid & Name */}
                        <div className="flex gap-4 items-start mb-4">
                          <div className="bg-white p-2 pb-3 shadow-lg rounded border border-stone-200 rotate-[-2deg] w-32 shrink-0 relative">
                            <div className="absolute -top-3 left-4 w-4 h-8 bg-stone-300/80 rounded-full border border-stone-400 rotate-12"></div>
                            <img 
                              src={currentCase.avatar} 
                              alt={currentCase.student} 
                              className="w-full h-28 object-cover rounded bg-stone-100" 
                            />
                            <p className="text-center font-handwriting font-extrabold text-stone-800 text-base mt-1">{currentCase.student}</p>
                          </div>

                          <div className="flex-1">
                            <span className="bg-amber-900 text-amber-100 font-extrabold text-[10px] px-2 py-0.5 rounded uppercase tracking-wider">
                              STUDENT PROFILE
                            </span>
                            <h3 className="text-2xl font-black text-stone-950 uppercase tracking-tight mt-0.5">
                              {currentCase.student}
                            </h3>
                            <p className="text-xs font-extrabold text-stone-800 uppercase">Grade {currentCase.grade}</p>
                          </div>
                        </div>

                        {/* Visual Evidence Cards */}
                        <div className="space-y-2 mb-3">
                          <p className="text-[11px] font-black uppercase text-stone-900 tracking-wider">Visual Evidence Badges:</p>
                          {currentCase.visuals.map((badge, idx) => (
                            <div key={idx} className="bg-sky-100 border border-sky-300 text-sky-950 font-extrabold text-xs px-3 py-2 rounded-lg shadow-sm flex items-center gap-2">
                              <span className="w-2.5 h-2.5 rounded-full bg-sky-600"></span>
                              <span>{badge}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Deciding Clue Sticky (Shown upon reveal) */}
                      {revealed && (
                        <div className="bg-[#FEF08A] border-2 border-amber-300 p-3.5 shadow-md rotate-1 rounded-lg animate-in fade-in duration-300">
                          <div className="flex items-center gap-1.5 text-amber-950 font-black text-xs uppercase mb-1">
                            <BookOpenCheck size={16} /> Deciding Clue
                          </div>
                          <p className="text-xs text-stone-950 font-bold leading-snug">
                            {currentCase.decidingClue.clue}
                          </p>
                        </div>
                      )}
                    </div>

                    {/* RIGHT FLAP: Readable Case File Document */}
                    <div className="w-[58%] bg-white rounded-xl shadow-md p-5 border border-stone-200 flex flex-col justify-between min-h-0 overflow-y-auto relative">
                      <div>
                        <div className="border-b-2 border-stone-200 pb-2 mb-3 flex justify-between items-center">
                          <h4 className="font-black text-stone-900 text-xs tracking-wider uppercase flex items-center gap-2">
                            <FileText size={16} className="text-stone-500" /> OFFICIAL CASE EVIDENCE
                          </h4>
                          <span className="text-[10px] font-black text-stone-400 uppercase">CONFIDENTIAL</span>
                        </div>

                        <div className="space-y-2.5">
                          {currentCase.readable.map((paragraph, idx) => (
                            <div key={idx} className="p-3 bg-stone-50 rounded-lg border border-stone-200 text-stone-950 font-bold text-sm leading-snug">
                              {paragraph}
                            </div>
                          ))}

                          {currentCase.isTrap && (
                            <div className="p-3 bg-red-50 border-2 border-red-300 rounded-lg text-red-950 font-extrabold text-xs space-y-1">
                              <p className="flex items-center gap-1 text-red-700 font-black">
                                <AlertTriangle size={16}/> MISSING EVIDENCE WARNING:
                              </p>
                              <ul className="list-disc pl-5 text-[11px] text-red-900">
                                {currentCase.missingEvidence.map((m, i) => <li key={i}>{m}</li>)}
                              </ul>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Stamp Effect */}
                      {revealed && (
                        <div className="mt-3 bg-emerald-100 border-2 border-emerald-600 text-emerald-800 p-2.5 rounded-lg flex items-center justify-between font-black text-xs uppercase shadow-inner">
                          <span className="flex items-center gap-2">
                            <CheckCircle2 size={18} /> CLUE FOUND & FILED
                          </span>
                          <span className="bg-emerald-600 text-white px-2 py-0.5 rounded text-[10px]">VERIFIED</span>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Bottom Student Switcher Bar */}
                  <div className="bg-[#D6B772] px-6 py-2 flex items-center justify-between border-t border-[#C5A661]">
                    <span className="text-[10px] font-black text-stone-900 uppercase tracking-wider">STUDENT CASE FILES:</span>
                    <div className="flex gap-3">
                      {CASES.map((c, i) => {
                        const isCurrent = i === currentCaseIndex;
                        return (
                          <div 
                            key={c.id} 
                            className={`flex items-center gap-1.5 px-3 py-1 rounded-full transition-all ${
                              isCurrent ? 'bg-stone-900 text-white font-black shadow' : 'bg-stone-200/80 text-stone-900 font-bold opacity-80'
                            }`}
                          >
                            <img src={c.avatar} alt={c.student} className="w-5 h-5 rounded-full object-cover" />
                            <span className="text-xs uppercase">{c.student}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* RIGHT TRAY: SELECTION FOLDERS */}
                <div className="w-[330px] bg-stone-300/90 border-2 border-stone-400 rounded-2xl p-4 shadow-xl flex flex-col justify-between shrink-0">
                  <div>
                    <div className="bg-stone-900 text-stone-100 text-center py-2 px-3 rounded-xl font-black text-xs uppercase tracking-widest mb-4 shadow">
                      SORT THIS FILE
                    </div>

                    <div className="space-y-4">
                      {Object.values(DECISION_TYPES).map((decision) => {
                        const isSelected = selectedDecision === decision.id;
                        const isCorrect = decision.id === currentCase.correctDecision;
                        
                        let buttonStyle = `${decision.bgColor} ${decision.hoverColor} ${decision.textColor}`;
                        if (revealed) {
                          if (isSelected && isCorrect) {
                            buttonStyle = "bg-emerald-600 text-white ring-4 ring-emerald-300";
                          } else if (isSelected && !isCorrect) {
                            buttonStyle = "bg-red-600 text-white ring-4 ring-red-300";
                          } else if (isCorrect) {
                            buttonStyle = `${decision.bgColor} text-white ring-4 ring-emerald-500 opacity-90`;
                          } else {
                            buttonStyle = "bg-stone-400 text-stone-600 opacity-40 grayscale";
                          }
                        }

                        return (
                          <button
                            key={decision.id}
                            disabled={revealed}
                            onClick={() => handleDecisionSelect(decision.id)}
                            className={`w-full p-4 rounded-xl shadow-lg font-black transition-all flex flex-col items-center justify-center gap-1.5 border-b-4 border-black/20 ${buttonStyle} ${
                              !revealed ? 'hover:-translate-y-0.5 active:translate-y-0' : 'cursor-default'
                            }`}
                          >
                            <div className="flex items-center gap-2">
                              <decision.icon size={26} />
                              <span className="text-xl tracking-tight leading-none uppercase">{decision.label}</span>
                            </div>
                            {revealed && isSelected && (
                              <span className="text-xs bg-black/20 px-3 py-0.5 rounded-full uppercase tracking-wider font-black mt-1">
                                {isCorrect ? "✓ Correct Referral" : "✕ Incorrect Path"}
                              </span>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Reveal Explanation Box */}
                  {revealed ? (
                    <div className="bg-white p-3.5 rounded-xl border-2 border-stone-300 shadow text-stone-900 space-y-2">
                      <div className="flex items-center gap-1.5 font-black text-xs uppercase text-amber-800">
                        <BookOpenCheck size={16}/> File Note
                      </div>
                      <p className="text-xs font-bold leading-tight text-stone-900">
                        {currentCase.decidingClue.note}
                      </p>
                      <button
                        onClick={handleNextCase}
                        className="w-full bg-stone-900 hover:bg-black text-white font-black text-sm py-2.5 rounded-lg shadow uppercase tracking-wider mt-2 flex items-center justify-center gap-1"
                      >
                        {currentCaseIndex < CASES.length - 1 ? `OPEN FILE 0${currentCase.id + 1} →` : "REVIEW EVIDENCE →"}
                      </button>
                    </div>
                  ) : (
                    <div className="text-center p-3 text-stone-700 font-extrabold text-xs uppercase tracking-wider">
                      Select one destination tray for this case file.
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* 3. FINAL SYNTHESIS SCREEN */}
            {gameState === 'synthesis' && (
              <div className="z-20 bg-stone-50 border-4 border-stone-300 rounded-2xl shadow-2xl max-w-4xl w-full p-8 text-stone-900 flex flex-col items-center text-center my-auto">
                <span className="bg-amber-100 text-amber-900 border border-amber-300 font-black text-sm px-4 py-1.5 rounded-full uppercase tracking-widest mb-3">
                  CASEWORK SYNTHESIS
                </span>
                <h2 className="text-4xl font-black tracking-tight uppercase text-stone-900 mb-6">
                  FIVE FILES. ONE PATTERN.
                </h2>

                <div className="grid grid-cols-3 gap-4 w-full mb-6">
                  <div className="bg-blue-50 border-2 border-blue-200 p-4 rounded-xl text-left">
                    <span className="font-black text-sm text-blue-800 uppercase block mb-1.5">RTI REFERRAL</span>
                    <p className="text-sm font-bold leading-snug text-blue-950">Evidence of a persistent skill difficulty and limited response to intervention.</p>
                  </div>
                  <div className="bg-amber-50 border-2 border-amber-200 p-4 rounded-xl text-left">
                    <span className="font-black text-sm text-amber-800 uppercase block mb-1.5">EL SUPPORT</span>
                    <p className="text-sm font-bold leading-snug text-amber-950">Evidence suggests language access/acquisition may explain the difficulty.</p>
                  </div>
                  <div className="bg-purple-50 border-2 border-purple-200 p-4 rounded-xl text-left">
                    <span className="font-black text-sm text-purple-800 uppercase block mb-1.5">NEED MORE DATA</span>
                    <p className="text-sm font-bold leading-snug text-purple-950">The existing evidence is not enough to determine the cause or next step.</p>
                  </div>
                </div>

                <div className="bg-amber-100/90 border-2 border-amber-300 rounded-xl p-5 text-left text-sm font-bold text-stone-900 mb-6 space-y-2">
                  <p className="text-base font-black text-amber-950 uppercase tracking-wide">The Core Takeaway:</p>
                  <p className="leading-relaxed">Notice the pattern across all five cases: the deciding clue was never just the struggle itself. It was what other data was — or wasn't — already on file.</p>
                  <p className="text-amber-950 font-black leading-relaxed">Referring too quickly, based on too little evidence, can send a learner toward the wrong kind of support.</p>
                </div>

                <button 
                  onClick={() => pushState('score')}
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xl py-4 rounded-xl shadow-lg uppercase tracking-wider transition-transform hover:scale-[1.01]"
                >
                  VIEW TRIAGE RESULTS →
                </button>
              </div>
            )}

            {/* 4. FINAL SCORE & CHECKLIST SCREEN */}
            {gameState === 'score' && (
              <div className="z-20 bg-stone-50 border-4 border-stone-300 rounded-2xl shadow-2xl max-w-4xl w-full p-8 text-stone-900 flex flex-col items-center text-center my-auto">
                <h2 className="text-4xl font-black tracking-tight uppercase text-stone-900 mb-3">TRIAGE COMPLETE</h2>
                
                <div className="bg-stone-900 text-white px-10 py-3.5 rounded-2xl mb-6 shadow flex items-center gap-4">
                  <span className="text-base font-bold text-stone-300 uppercase">FINAL SCORE:</span>
                  <span className="text-4xl font-black text-amber-400">
                    {results.filter(r => r.isCorrect).length} / {CASES.length}
                  </span>
                </div>

                {/* Student Summary Cards */}
                <div className="grid grid-cols-5 gap-3 w-full mb-6">
                  {CASES.map((c, i) => {
                    const res = results.find(r => r.caseIndex === i);
                    const isPassed = res && res.isCorrect;
                    return (
                      <div key={c.id} className="bg-white border-2 border-stone-200 p-2.5 rounded-xl flex flex-col items-center shadow-sm">
                        <img src={c.avatar} alt={c.student} className="w-12 h-12 rounded-full object-cover mb-1.5" />
                        <span className="font-black text-sm uppercase">{c.student}</span>
                        <span className={`text-xs font-black mt-1 ${isPassed ? 'text-emerald-600' : 'text-red-600'}`}>
                          {isPassed ? '✓ Correct' : '✕ Review'}
                        </span>
                      </div>
                    );
                  })}
                </div>

                <div className="bg-stone-100 border-2 border-stone-300 rounded-xl p-5 text-left w-full text-sm space-y-2 mb-6">
                  <p className="font-black text-stone-950 uppercase tracking-wider text-base mb-1">BEFORE YOU REFER... ASK:</p>
                  <ul className="list-disc pl-6 font-bold text-stone-900 text-base space-y-1.5 leading-snug">
                    <li>What evidence do I actually have?</li>
                    <li>What does the evidence suggest?</li>
                    <li>What evidence is missing?</li>
                    <li>Am I interpreting a language difference as a learning difficulty?</li>
                  </ul>
                </div>

                <button 
                  onClick={() => { setGameState('intro'); setHistory(['intro']); }}
                  className="w-full bg-stone-900 hover:bg-black text-white font-black text-lg py-4 rounded-xl shadow-lg uppercase tracking-wider transition-transform hover:scale-[1.01]"
                >
                  RETURN TO CASE DESK
                </button>
              </div>
            )}

          </div>

          {/* FOOTER BAR */}
          <footer className="h-14 bg-stone-900 text-stone-300 flex items-center px-6 justify-between shadow-inner z-30 shrink-0 border-t border-stone-800 text-xs font-bold">
            <div className="w-1/3 flex items-center">
              {history.length > 1 && (
                <button 
                  onClick={handleBack}
                  className="flex items-center gap-1.5 bg-stone-800 hover:bg-stone-700 text-stone-200 px-3 py-1.5 rounded-lg border border-stone-700 uppercase tracking-wider transition-colors"
                >
                  <ArrowLeft size={16} /> BACK
                </button>
              )}
            </div>

            <div className="w-1/3 text-center text-stone-400 uppercase tracking-widest text-[10px]">
              Fictional Scenario for Instructional Purposes
            </div>

            <div className="w-1/3 flex justify-end items-center gap-2">
              <button 
                onClick={() => { setGameState('intro'); setHistory(['intro']); }}
                className="flex items-center gap-1 text-stone-400 hover:text-white px-2 py-1 uppercase text-[11px]"
              >
                <RotateCcw size={14}/> START OVER
              </button>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
