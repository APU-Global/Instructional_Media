<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 1 | Ask the Right Question First</title>
<style>
:root{--ink:#1c2638;--muted:#566175;--line:#d5dbe5;--soft:#f2f5f9;--navy:#23395d;--acc:#17727f;--acc-d:#0f5560;--acc-soft:#e3f2f4;--good:#1d7a4a;--good-soft:#e2f4e9;--bad:#b3282f;--bad-soft:#fbe8e9;--gold:#e3a72f;--gold-soft:#fdf3da}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;background:#fff;color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:1000px;margin:0 auto;padding:16px 18px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.badge{flex:none;width:52px;height:52px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center}
.badge .ic{width:30px;height:30px}
.hd h1{margin:0;font-size:clamp(1.15rem,2.6vw,1.5rem);line-height:1.2;letter-spacing:-.01em}
.hd p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.steps{display:flex;gap:6px;list-style:none;margin:0 0 14px;padding:0}
.steps li{flex:1;font-size:.8rem;color:var(--muted);border-top:4px solid var(--line);padding-top:5px;line-height:1.25}
.steps li.on{border-color:var(--acc);color:var(--ink);font-weight:600}
.steps li.done{border-color:var(--acc)}
h2{font-size:1.1rem;margin:0 0 4px;line-height:1.3}
.lead{margin:0 0 12px;color:var(--muted);font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid #f0a81a;outline-offset:2px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600;min-height:44px}
.btn:hover{background:var(--acc-d)}
.btn:disabled{background:#b9c2ce;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:.82rem;color:var(--muted)}
.fb{border-radius:10px;padding:10px 12px;font-size:.92rem;border-left:5px solid var(--line);background:var(--soft)}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.info{background:var(--acc-soft);border-color:var(--acc)}
.fb b{display:block;margin-bottom:2px}
@media (prefers-reduced-motion:no-preference){.tr{transition:all .35s ease}}
@media (max-width:600px){.app{padding:12px;border-radius:10px}.badge{width:42px;height:42px}.badge .ic{width:24px;height:24px}.steps li{font-size:.7rem}}

:root{--acc:#17727f}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.area{border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.area:hover{border-color:var(--acc);background:var(--acc-soft)}
.area svg.scene{width:100%;height:auto;display:block;border-radius:8px}
.area b{font-size:1rem;padding:0 4px}
.area span{font-size:.84rem;color:var(--muted);padding:0 4px 4px}
.two{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.two .scene{width:100%;height:auto;border-radius:10px;display:block}
.scn{font-size:.88rem;color:var(--muted);margin:8px 0 0}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.opt{text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:.95rem}
.opt:hover{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel.good{border-color:var(--good);background:var(--good-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;margin-bottom:12px}
.tile{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;min-height:58px}
.tile .ib{flex:none;width:36px;height:36px;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--navy)}
.tile.sel{border-color:var(--acc);background:var(--acc-soft)}
.tile.sel .ib{background:var(--acc);color:#fff}
.tile .t{font-weight:600;font-size:.93rem;line-height:1.25}
.tile .w{display:block;font-size:.8rem;color:var(--muted);margin-top:2px;line-height:1.3}
.tile.ok{border-color:var(--good);background:var(--good-soft)}
.tile.ok .ib{background:var(--good);color:#fff}
.tile.no{border-color:var(--bad);background:var(--bad-soft)}
.tile.no .ib{background:var(--bad);color:#fff}
.brief{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:.95rem}
.card ul{margin:0;padding-left:18px;font-size:.9rem}
.card p{margin:0;font-size:.92rem}
.score{font-size:1.6rem;font-weight:700;color:var(--acc)}
@media (max-width:640px){.two,.brief{grid-template-columns:1fr}.two .scene{max-width:260px}}
</style>
</head>

(function(){
  var app=document.getElementById('app');
  function send(){
    var h=Math.ceil(app.getBoundingClientRect().height)+4;
    try{
      parent.postMessage({subject:'lti.frameResize',height:h},'*');
      parent.postMessage({type:'iframe-resize',height:h},'*');
    }catch(e){}
  }
  if(window.ResizeObserver){new ResizeObserver(send).observe(app);}
  window.addEventListener('load',send);window.addEventListener('resize',send);send();
})();

var scenes={

var AREAS=[
{id:"retention",name:"Customer retention",scn:"A meal-kit company is losing about 1 in 4 new subscribers in their first 90 days.",
 q:[{t:"Which data should we collect about our customers?",g:0,f:"This starts with the data, not the problem. Without a defined problem you can’t tell which data matters."},

var st=document.getElementById("stage"),stp=document.getElementById("steps");
function drawSteps(){stp.innerHTML=stepNames.map(function(n,i){return '<li class="'+(i===S.step?'on':i<S.step?'done':'')+'">'+n+'</li>';}).join("");}

function s1(){
  st.innerHTML='<h2>Which business area do you want to improve?</h2><p class="lead">Good analytics starts with a business problem. Choose a scenario to work through.</p><div class="areas">'+
  AREAS.map(function(a,i){return '<button class="area" data-i="'+i+'">'+scenes[a.id]+'<b>'+a.name+'</b><span>'+a.scn+'</span></button>';}).join("")+'</div>';

}
function s2(){
  var a=S.area;
  st.innerHTML='<div class="two"><div>'+scenes[a.id]+'<p class="scn"><b>'+a.name+':</b> '+a.scn+'</p></div><div><h2>Which question should lead the analysis?</h2><p class="lead">Pick the one that best defines the problem and points to the data you need.</p><div class="opts" id="opts"></div><div id="fb"></div><div class="row" style="margin-top:10px"><button class="btn ghost" id="back">Change area</button><button class="btn" id="next" disabled>Choose the data</button></div></div></div>';
  var o=document.getElementById("opts");
  o.innerHTML=a.q.map(function(q,i){return '<button class="opt" data-i="'+i+'">'+q.t+'</button>';}).join("");
  function mark(){
    o.querySelectorAll(".opt").forEach(function(b){var i=+b.dataset.i;b.className="opt"+(S.qi===i?" sel "+(a.q[i].g===2?"good":"bad"):"");});
    var fb=document.getElementById("fb");
    if(S.qi!==null){var q=a.q[S.qi],good=q.g===2;fb.innerHTML='<div class="fb '+(good?'good':'bad')+'"><b>'+(good?'Strong question':q.g===1?'Getting closer':'Not yet')+'</b>'+q.f+(good?'':' Try another.')+'</div>';}
    document.getElementById("next").disabled=!S.qOk;
  }
  o.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){S.qi=+b.dataset.i;if(a.q[S.qi].g===2)S.qOk=true;mark();};});
  document.getElementById("back").onclick=function(){go(0);};
  document.getElementById("next").onclick=function(){go(2);};
  if(S.qi!==null)mark();
}
function s3(){
  var a=S.area;
  st.innerHTML='<h2>Which data sets would help answer your question?</h2><p class="lead">“'+a.q.filter(function(q){return q.g===2;})[0].t+'” Select every data set you would include (you don’t need to know if it exists yet).</p><div class="tiles" id="tiles"></div><div id="fb"></div><div class="row" style="margin-top:10px"><button class="btn ghost" id="back">Back</button><button class="btn" id="chk">Check my picks</button><button class="btn" id="next" style="display:none">See my brief</button></div>';
  var t=document.getElementById("tiles");
  function draw(){
    t.innerHTML=a.d.map(function(d,i){
      var cls="tile";if(S.checked){cls+=d.r?(S.picks[i]?" ok":""):(S.picks[i]?" no":"");}else if(S.picks[i])cls+=" sel";
      var why=S.checked?'<span class="w">'+(S.picks[i]&&d.r?'Good pick. ':S.picks[i]&&!d.r?'Not helpful here. ':d.r?'Missed. ':'')+d.w+'</span>':'';
      return '<button class="'+cls+'" data-i="'+i+'" aria-pressed="'+(!!S.picks[i])+'"><span class="ib">'+ic(S.checked&&S.picks[i]?(d.r?'check':'cross'):d.i)+'</span><span><span class="t">'+d.n+'</span>'+why+'</span></button>';}).join("");
    t.querySelectorAll(".tile").forEach(function(b){b.onclick=function(){if(S.checked)return;S.picks[+b.dataset.i]=!S.picks[+b.dataset.i];draw();};});
  }
  draw();
  document.getElementById("back").onclick=function(){go(1);};
  document.getElementById("chk").onclick=function(){
    var n=Object.keys(S.picks).filter(function(k){return S.picks[k];}).length;
    if(!n){document.getElementById("fb").innerHTML='<div class="fb info">Select at least one data set first.</div>';return;}
    S.checked=true;draw();
    var sc=score();
    document.getElementById("fb").innerHTML='<div class="fb info"><b>'+sc.hit+' of '+sc.rel+' relevant data sets found'+(sc.miss?', '+sc.miss+' not helpful':'')+'</b>Explaining why a data set matters is the skill, not knowing in advance where it lives.</div>';
    this.style.display="none";document.getElementById("next").style.display="";
  };
  document.getElementById("next").onclick=function(){go(3);};
}
function score(){var hit=0,rel=0,miss=0;S.area.d.forEach(function(d,i){if(d.r)rel++;if(S.picks[i]&&d.r)hit++;if(S.picks[i]&&!d.r)miss++;});return{hit:hit,rel:rel,miss:miss};}
function s4(){
  var a=S.area,sc=score(),q=a.q.filter(function(x){return x.g===2;})[0];
  var chosen=a.d.filter(function(d,i){return S.picks[i];});
  st.innerHTML='<h2>Your analytics brief</h2><p class="lead">One business area, one sharp question, and the data that serves it.</p><div class="brief"><div><div class="card" style="margin-bottom:12px"><h3>Business area</h3><p>'+a.name+'</p></div><div class="card"><h3>Guiding question</h3><p>'+q.t+'</p></div></div><div><div class="card" style="margin-bottom:12px"><h3>Data sets you selected</h3><ul>'+chosen.map(function(d){return '<li>'+d.n+(d.r?'':' (low value)')+'</li>';}).join("")+'</ul></div><div class="card"><h3>Data match</h3><p><span class="score">'+sc.hit+'/'+sc.rel+'</span> relevant sets found</p></div></div></div><div class="fb info" style="margin-top:12px"><b>Next step for your discussion post</b>Choose one data set above and find a peer-reviewed or industry-authoritative source that supports why it matters.</div><div class="row" style="margin-top:12px"><button class="btn" id="again">Try another area</button></div>';
  document.getElementById("again").onclick=function(){S.area=null;go(0);};
}
render();
})();
</script>
</body>
</html>
