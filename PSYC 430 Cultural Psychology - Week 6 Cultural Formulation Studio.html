<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSYC 430 Cultural Psychology - Week 6 Cultural Formulation Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--s:1;--ink:#1d2433;--ink2:#4d576d;--line:#d6dcea;--wash:#f1f4fa;--red:#c8333f;--redd:#a3262f;--gold:#f2b84b;--plum:#5b3f8c;--teal:#0f7a7a;--ok:#1b7248;--okbg:#e5f4ec;--warn:#8a5200;--warnbg:#fff2dc;--bad:#a3262f;--badbg:#fbe8ea}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(16px*var(--s));height:100%;overflow:hidden}
body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:.95rem;line-height:1.38}
h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;margin:0;line-height:1.12;letter-spacing:-.01em}
p{margin:0}
.app{height:100%;display:flex;flex-direction:column;gap:.6rem;padding:.7rem .9rem .8rem}
.top{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;border-bottom:3px solid var(--red);padding-bottom:.5rem}
.top h1{font-size:1.5rem;font-weight:800}
.top .wk{font-size:.82rem;color:var(--ink2);margin-top:.15rem}
.top .tag{font-size:.78rem;color:var(--ink2);text-align:right;white-space:nowrap}
.stage{flex:1;min-height:0;display:grid;gap:.9rem}
.card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:.85rem 1rem;min-height:0;display:flex;flex-direction:column;gap:.55rem}
.btn{border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:700;padding:.55rem 1rem;min-height:2.4rem;transition:background .15s}
.btn:hover{background:var(--redd)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.ghost:hover{background:var(--wash)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.note{font-size:.8rem;color:var(--ink2)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fb{border-left:5px solid var(--ink2);background:var(--wash);border-radius:0 10px 10px 0;padding:.5rem .75rem;font-size:.9rem}
.fb.good{border-color:var(--ok);background:var(--okbg)}
.fb.try{border-color:var(--warn);background:var(--warnbg)}
.fb b{display:block;margin-bottom:.1rem}
@media (max-width:640px){.top .tag{display:none}.top h1{font-size:1.25rem}.app{padding:.55rem .6rem .6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.stage{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.left{background:var(--wash);border-color:transparent}
.client{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:.7rem;align-items:center}
.portrait{width:100%;aspect-ratio:1/1}
.portrait svg{width:100%;height:100%;display:block}
.pname{font-size:.78rem;color:var(--ink2);text-align:center;margin-top:.1rem}
.bubble{position:relative;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:.55rem .75rem;font-size:.9rem;min-height:3.6rem}
.bubble:before{content:"";position:absolute;left:-.62rem;top:1.3rem;width:.9rem;height:.9rem;background:#fff;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;flex:1;min-height:0;align-content:start}
.bc{border:2px dashed #b4bdd2;border-radius:10px;background:transparent;padding:.4rem .55rem;display:flex;flex-direction:column;gap:.15rem;min-height:0;transition:background .3s,border-color .3s}
.bc h3{font-size:.9rem}
.bc p{font-size:.84rem;line-height:1.3;color:var(--ink2);font-style:italic}
.bc.on{background:#fff;border-style:solid;border-width:2px;border-top-width:6px}
.bc.on p{color:var(--ink);font-style:normal}
.bc.c0.on{border-color:var(--teal)}.bc.c1.on{border-color:var(--plum)}.bc.c2.on{border-color:#c98a12}.bc.c3.on{border-color:var(--red)}
.step h2{font-size:1.2rem}
.meta{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.pills{display:flex;gap:.25rem}
.pill{width:1.5rem;height:.42rem;border-radius:99px;background:var(--line)}
.pill.done{background:var(--teal)}.pill.now{background:var(--red)}
.topic{font-weight:700;color:var(--teal);font-size:.9rem}
.opts{display:flex;flex-direction:column;gap:.45rem}
.opt{text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:.55rem .75rem;line-height:1.3}
.opt:hover:not([disabled]){border-color:var(--ink);background:var(--wash)}
.opt.ok{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.no{border-color:var(--warn);background:var(--warnbg);color:var(--ink2)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.score{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.02rem}
.plan{margin:0;padding:0;list-style:none;display:grid;gap:.3rem}
.plan li{display:grid;grid-template-columns:1rem 1fr;gap:.4rem;font-size:.9rem}
.plan li:before{content:"";width:.65rem;height:.65rem;margin-top:.3rem;border-radius:50%;background:var(--teal)}
.chk{display:grid;grid-template-columns:1.3rem 1fr;gap:.45rem;align-items:start;font-size:.88rem;cursor:pointer}
.chk input{width:1.1rem;height:1.1rem;margin:.1rem 0 0;accent-color:var(--red)}
.chks{display:grid;gap:.3rem}
@media (min-width:701px){.step h2{font-size:1.3rem}.opt{font-size:.98rem}}
@media (max-width:700px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:.45rem}
  .left{padding:.45rem .55rem;gap:.35rem}
  .client{grid-template-columns:3.3rem minmax(0,1fr);gap:.5rem}
  .pname{display:none}
  .bubble{font-size:.8rem;padding:.35rem .55rem;min-height:2.6rem;display:flex;align-items:center}.bubble:before{top:.7rem}
  .board{grid-template-columns:repeat(4,1fr);gap:.25rem;flex:none}
  .bc{padding:.25rem .3rem;border-width:2px}.bc.on{border-top-width:5px}
  .bc h3{font-size:.68rem;line-height:1.1}.bc p{display:none}
  .card{padding:.55rem .7rem;gap:.4rem}
  .opt{padding:.4rem .6rem;font-size:.86rem}
  .fb{font-size:.82rem}.chk{font-size:.82rem}.plan li{font-size:.84rem}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Cultural Formulation Studio</h1>
      <div class="wk">Week 6 &middot; Cultural Psychology Cases and Treatments</div>
    </div>
    <div class="tag">PSYC 430<br>Cultural Psychology</div>
  </header>
  <main class="stage">
    <aside class="card left" aria-label="Client and case board">
      <div class="client">
        <div>
          <div class="portrait">
            <svg id="rosa" viewBox="0 0 160 160" role="img" aria-label="Illustration of Rosa, the client">
              <defs><clipPath id="pc"><circle cx="80" cy="80" r="78"/></clipPath></defs>
              <g clip-path="url(#pc)">
                <rect width="160" height="160" fill="#d3ece8"/>
                <circle cx="80" cy="30" r="14" fill="#2b1d1a"/>
                <ellipse cx="80" cy="62" rx="40" ry="44" fill="#2b1d1a"/>
                <path d="M14 170 Q18 120 80 114 Q142 120 146 170 Z" fill="#1f6f78"/>
                <path d="M60 116 Q80 138 100 116" fill="none" stroke="#f2b84b" stroke-width="3" stroke-linecap="round"/>
                <rect x="70" y="92" width="20" height="26" rx="6" fill="#c48a63"/>
                <ellipse cx="80" cy="76" rx="31" ry="36" fill="#d79d74"/>
                <path d="M48 70 Q50 36 80 34 Q110 36 112 70 Q100 50 80 49 Q60 50 48 70Z" fill="#2b1d1a"/>
                <line id="brL" x1="61" y1="68" x2="73" y2="63" stroke="#2b1d1a" stroke-width="2.6" stroke-linecap="round"/>
                <line id="brR" x1="87" y1="63" x2="99" y2="68" stroke="#2b1d1a" stroke-width="2.6" stroke-linecap="round"/>
                <ellipse cx="68" cy="78" rx="3.2" ry="3.8" fill="#2b1d1a"/><ellipse cx="92" cy="78" rx="3.2" ry="3.8" fill="#2b1d1a"/>
                <path d="M80 80 q-3.5 8 1.5 10" fill="none" stroke="#b37650" stroke-width="2" stroke-linecap="round"/>
                <ellipse cx="60" cy="90" rx="6" ry="4" fill="#e58a6a" opacity=".35"/><ellipse cx="100" cy="90" rx="6" ry="4" fill="#e58a6a" opacity=".35"/>
                <path id="mouth" d="M71 99 Q80 95 89 99" fill="none" stroke="#7a3b2a" stroke-width="3" stroke-linecap="round"/>
              </g>
              <circle cx="80" cy="80" r="77" fill="none" stroke="#1d2433" stroke-width="2.5"/>
            </svg>
          </div>
          <div class="pname">Rosa, 41</div>
        </div>
        <div class="bubble" id="bubble" aria-live="polite"></div>
      </div>
      <div class="board" id="board" aria-label="Case board"></div>
    </aside>
    <section class="card step" id="step" aria-live="polite"></section>
  </main>
</div>

<script>
var BOARD=['Her words','Meaning and cause','Strengths and supports','Barriers and hopes'];
var DOM=[
 {t:'How she defines the problem',
  o:[{t:'In your own words, what has been troubling you, and what do you call it?',ok:1,
      f:'Her own word, \u201cnervios,\u201d is now on the table. In DSM-5 terms it is a cultural idiom of distress: a way of talking about suffering that may not match one diagnosis.',
      r:'\u201cMy nervios. My hands shake, my head hurts, and I can\u2019t sleep. Since I lost my job, I feel like I\u2019m failing my family.\u201d',
      b:'Calls it \u201cnervios\u201d: shaking hands, headaches, poor sleep since losing her job. Feels she is failing her family.'},
     {t:'Many people from your community express stress through the body, so I assume yours is physical.',h:'Stereotyping',
      f:'Patterns are not rules. Cultural knowledge is a starting point for curiosity, not a conclusion about a person.',r:'Rosa looks down. \u201cMaybe. I don\u2019t know.\u201d'},
     {t:'Let me run through an anxiety checklist. Do you worry excessively on most days?',h:'Diagnosis first',
      f:'A checklist narrows her story into symptoms before you have heard her words. DSM-5 pairs diagnostic criteria with cultural context, not instead of it.',r:'Rosa hesitates. \u201cI\u2026 I don\u2019t know. I just know I am not okay.\u201d'}]},
 {t:'What she thinks caused it, and who weighs in',
  o:[{t:'Have you had a panic attack, or felt low most days for two weeks?',h:'Diagnostic fishing',
      f:'It jumps to criteria before you know what she thinks is happening. Ask what she makes of it first.',r:'\u201cNo\u2026 I don\u2019t think so. It\u2019s not like that.\u201d'},
     {t:'Does your culture believe this is caused by the evil eye?',h:'Assuming a belief',
      f:'You are guessing at a belief she may not hold. Let her name the cause.',r:'Rosa frowns. \u201cNo. Why would you think that?\u201d'},
     {t:'What do you think brought this on, and who in your life has a view about it?',ok:1,
      f:'You asked for her explanation and her circle. Explanations of cause shape which kinds of help feel acceptable.',
      r:'\u201cMy mother says nervios come from carrying everyone\u2019s worries. My pastor says to trust God and rest. My husband says it\u2019s just stress.\u201d',
      b:'Mother: from carrying everyone\u2019s worries. Pastor: trust God and rest. Husband: just stress.'}].sort(function(a,b){return 0})},
 {t:'How she has coped so far',
  o:[{t:'I would like to teach you some relaxation techniques we use for anxiety. Shall we start?',h:'Jumping to an intervention',
      f:'It skips what she is already doing. Start from her own coping, then build on it.',r:'\u201cOkay\u2026 if you think so.\u201d She sounds unsure.'},
     {t:'What have you tried so far to feel better, and what has helped even a little?',ok:1,
      f:'You found strengths to build on instead of starting from zero.',
      r:'\u201cI pray with my church group on Wednesdays. My neighbor taught me chamomile tea, and walking with my sister helps. Sleep is still bad.\u201d',
      b:'Prayer group on Wednesdays, chamomile tea, walks with her sister.'},
     {t:'I assume your family is very supportive and handles everything, right?',h:'Assuming support',
      f:'Close families can be a strength and a source of pressure. Ask how they help, and how they do not.',r:'Rosa shrugs. \u201cThey try.\u201d'}]},
 {t:'What shapes whether she seeks help now',
  o:[{t:'Weekly sessions should work with your insurance and schedule, so I will book them.',h:'Assuming access',
      f:'You have not asked what makes counseling easy or hard for her.',r:'\u201cI\u2026 suppose.\u201d She looks worried.'},
     {t:'Hispanic families usually distrust therapy, so I assume you do too.',h:'Stereotyping',
      f:'It labels her by her group instead of asking about her.',r:'Rosa stiffens. \u201cI came, didn\u2019t I?\u201d'},
     {t:'What would make it easier, or harder, for you to come to counseling?',ok:1,
      f:'You surfaced stigma, money, schedule, and a hope that her faith will be respected. Each one affects the plan.',
      r:'\u201cI worry people will think something is wrong with me or my family. Money is tight and I work odd hours. I\u2019d like someone who understands that my faith matters.\u201d',
      b:'Fears stigma for herself and her family. Tight money and odd work hours. Wants her faith respected.'}]}
];
/* fix option order so the best question is not always in the same slot */
DOM[1].o=[DOM[1].o[2],DOM[1].o[1],DOM[1].o[0]];
DOM[0].o=[DOM[0].o[1],DOM[0].o[2],DOM[0].o[0]];
var TX={t:'Treatment fit',
  o:[{t:'Deliver a standard CBT protocol for generalized anxiety exactly as written.',h:'Treatment first, culture later',
      f:'It ignores how Rosa understands her distress, along with the family and faith that shape her coping and her choices. Adapt interventions to her values and context.'},
     {t:'Use CBT for anxiety adapted to her context: keep \u201cnervios\u201d as shared language, include her family and church support as she chooses, and ask her doctor to check the headaches and sleep.',ok:1,
      f:'The plan uses her language, builds on her strengths, respects her explanation, and takes the physical symptoms seriously. Treatment fit comes from the whole case, not from one diagnosis.'},
     {t:'Refer her straight to a psychiatrist because her symptoms are mostly physical.',h:'Medicalizing too fast',
      f:'Physical symptoms deserve attention, but a referral alone skips her explanation of the problem and leaves out her strengths and supports. Medical care can be part of the plan, not all of it.'}]};
var step=document.getElementById('step'), boardEl=document.getElementById('board'), bubble=document.getElementById('bubble');
var si=-1, got=[null,null,null,null], firstTry=0, tried={}, answered=false, goods=0;
function mood(n){
  var m={0:'M71 100 Q80 95 89 100',1:'M72 99 Q80 98 88 99',2:'M72 98 Q80 104 88 98'};
  var lv=n<=1?0:(n<=3?1:2);
  document.getElementById('mouth').setAttribute('d',m[lv]);
  var b=lv===0?[[61,68,73,63],[87,63,99,68]]:lv===1?[[61,66,73,64],[87,64,99,66]]:[[61,65,73,64],[87,64,99,65]];
  var L=document.getElementById('brL'),R=document.getElementById('brR');
  ['x1','y1','x2','y2'].forEach(function(k,i){L.setAttribute(k,b[0][i]);R.setAttribute(k,b[1][i])});
}
function drawBoard(){
  boardEl.innerHTML=BOARD.map(function(n,i){var g=got[i];
    return '<div class="bc c'+i+(g?' on':'')+'"><h3>'+(g?'\u2713 ':'')+n+'</h3><p>'+(g||'Not asked yet')+'</p></div>'}).join('');
}
function say(h){bubble.innerHTML=h}
function pills(){var h='<div class="pills" aria-hidden="true">';for(var i=0;i<5;i++)h+='<span class="pill '+(i<si?'done':(i===si?'now':''))+'"></span>';return h+'</div>'}
function intro(){
  si=-1;got=[null,null,null,null];firstTry=0;tried={};goods=0;mood(0);drawBoard();
  say('\u201cThank you for seeing me. I haven\u2019t been myself since I lost my job.\u201d');
  step.innerHTML='<h2>Meet Rosa</h2>'+
   '<p>Rosa, 41, is a Spanish-speaking mother of two. She came in after losing her job, and her family urged her to come.</p>'+
   '<p>You will explore her story through the four domains of the DSM-5 Cultural Formulation Interview, build a case board from what you learn, and then choose a treatment direction.</p>'+
   '<div class="row"><button class="btn" id="go">Begin the interview</button></div>'+
   '<p class="note" style="margin-top:auto">Rosa is a fictional composite. Not everyone from a community shares the same beliefs, so treat what you learn as true of Rosa, not of her whole community.</p>';
  step.querySelector('#go').onclick=function(){round(0)};fit();
}
function round(i){
  si=i;answered=false;var D=i<4?DOM[i]:TX;
  var h='<div class="meta">'+pills()+'<span class="topic">'+(i<4?'Interview domain '+(i+1)+' of 4: ':'Last step: ')+D.t+'</span></div>'+
   '<h2>'+(i<4?'Choose your next question.':'The board is full. Which treatment direction fits best?')+'</h2><div class="opts">'+
   D.o.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+o.t+'</button>'}).join('')+'</div><div id="fbw"></div><div class="row" id="act" style="margin-top:auto"></div>';
  step.innerHTML=h;
  step.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){choose(+b.dataset.k,b)}});fit();
}
function choose(k,btn){
  if(answered)return;var D=si<4?DOM[si]:TX,o=D.o[k],w=step.querySelector('#fbw');
  if(o.ok){
    answered=true;if(!tried[si])firstTry++;
    step.querySelectorAll('.opt').forEach(function(b,j){b.disabled=true;if(j===k)b.classList.add('ok');else if(!b.classList.contains('no'))b.classList.add('dim')});
    w.innerHTML='<div class="fb good"><b>Well chosen</b>'+o.f+'</div>';
    if(si<4){got[si]=o.b;goods++;mood(goods);drawBoard();say(o.r)}
    var last=si===4;
    step.querySelector('#act').innerHTML='<button class="btn" id="nx">'+(last?'See the case summary':(si===3?'Choose a treatment':'Next domain'))+'</button>';
    step.querySelector('#nx').onclick=function(){last?finish():round(si+1)};step.querySelector('#nx').focus();
  } else {
    tried[si]=1;btn.disabled=true;btn.classList.add('no');
    w.innerHTML='<div class="fb try"><b>'+o.h+'</b>'+o.f+' Try another one.</div>';
    if(o.r)say(o.r);
  }
  fit();
}
function finish(){
  si=5;mood(4);say('\u201cThank you for asking what I think. That helps.\u201d');
  step.innerHTML='<h2>Case conceptualization ready</h2><p class="score">'+firstTry+' of 5 best choices on your first try</p>'+
   '<ul class="plan"><li><span><b>Language:</b> keep \u201cnervios\u201d as shared vocabulary in session.</span></li>'+
   '<li><span><b>Context:</b> include family and church support as Rosa chooses, and address stigma openly.</span></li>'+
   '<li><span><b>Body:</b> coordinate with her doctor about the headaches and sleep.</span></li></ul>'+
   '<div class="fb"><b>Before you write Part 3</b><div class="chks" id="chks">'+
   ['Explain why this recommendation is the best course of action.','Consider opposing treatment viewpoints.','Reflect on where transference may affect how you see the client.','Consider how Christian worldview principles can inform your plan.'].map(function(t,i){
     return '<label class="chk"><input type="checkbox" data-i="'+i+'"><span>'+t+'</span></label>'}).join('')+'</div></div>'+
   '<div class="row" style="margin-top:auto"><span class="note" id="cnt">0 of 4 ready</span><span class="spacer"></span><button class="btn ghost" id="again">Start over</button></div>';
  step.querySelector('#chks').onchange=function(){var n=step.querySelectorAll('#chks input:checked').length;step.querySelector('#cnt').textContent=n+' of 4 ready'};
  step.querySelector('#again').onclick=intro;fit();
}
intro();
</script>
<script>
/* Keeps everything inside the iframe so only the Canvas page scrolls (no double scroll bar). */
(function(){
  var STEPS=[1,.95,.9,.85,.8,.75,.7,.66];
  var root=document.documentElement;
  function over(){
    var app=document.querySelector('.app'); if(!app) return false;
    var H=window.innerHeight,W=window.innerWidth;
    if(app.scrollHeight>app.clientHeight+1||app.scrollWidth>app.clientWidth+1) return true;
    var all=app.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var el=all[i],tag=el.tagName.toLowerCase();
      if(el.closest('svg')&&tag!=='svg') continue;
      var cs=getComputedStyle(el);
      if(cs.display==='none'||cs.display==='inline'||cs.position==='absolute'&&el.classList.contains('sr')) continue;
      var r=el.getBoundingClientRect(); if(!r.width&&!r.height) continue;
      if(r.bottom>H+1||r.right>W+1||r.left<-1) return true;
      if(tag!=='svg'&&el.clientHeight&&el.scrollHeight>el.clientHeight+1) return true;
      if(tag!=='svg'&&el.clientWidth&&el.scrollWidth>el.clientWidth+1) return true;
    }
    return false;
  }
  window.fit=function(){
    for(var i=0;i<STEPS.length;i++){root.style.setProperty('--s',STEPS[i]); if(!over()) return;}
  };
  var t; function later(){clearTimeout(t);t=setTimeout(window.fit,60)}
  window.addEventListener('resize',later);
  window.addEventListener('load',function(){window.fit();later()});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(window.fit);
})();

</script>
</body>
</html>
