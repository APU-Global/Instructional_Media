<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSYC 320 Personality Theory | Week 2 | Barnum Effect Lab</title>
<style>
:root{
  --red:#d34147; --red-d:#b32d34; --red-dd:#8f2229;
  --cream:#edebe8; --cream-l:#f7f5f2; --ink:#2a2826; --muted:#625d58; --line:#d9d4ce;
  --teal:#2c5f6b; --teal-l:#dcebed; --gold:#e3a72f; --gold-l:#fbf0d4;
  --ok:#2f7d4f; --ok-l:#dff1e5; --bad-l:#f8e1e2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);
  font:16px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0;color:var(--ink)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}

/* app shell: fills the iframe exactly, so the parent page is the only thing that scrolls */
.app{height:100%;display:flex;flex-direction:column;padding:12px 16px 12px;gap:10px;min-height:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rule{width:100px;height:6px;border-radius:5px;background:var(--red);margin-bottom:8px}
h1{font-size:1.4rem}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:2px solid var(--cream);background:#fff;border-radius:999px;padding:6px 16px;font-weight:600;font-size:.9rem;color:var(--muted)}
.tab:hover{border-color:var(--red)}
.tab[aria-selected="true"]{background:var(--red-d);border-color:var(--red-d);color:#fff}
.stage{flex:1;min-height:0;background:var(--cream);border-radius:18px;padding:12px;display:flex}
.panel{flex:1;min-width:0;min-height:0;background:#fff;border-radius:12px;padding:16px;display:none}
.panel.on{display:flex;gap:18px}
.col{min-width:0;min-height:0;display:flex;flex-direction:column}
.btn{border:0;background:var(--red-d);color:#fff;font-weight:600;border-radius:10px;padding:9px 18px}
.btn:hover:not(:disabled){background:var(--red-dd)}
.btn:disabled{background:#c9c4be;color:#fff;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--red-d);border:2px solid var(--red-d);padding:7px 16px}
.btn.ghost:hover{background:var(--cream-l)}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:.88rem;font-weight:600}
.chip:hover{border-color:var(--red)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.note{background:var(--gold-l);border-left:5px solid var(--gold);border-radius:10px;padding:9px 13px;font-size:.88rem}
.lead{font-size:.95rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{display:block;max-width:100%}

/* narrow screens: stack and let the page flow (iframe needs to be taller) */
@media (max-width:760px){
  html,body{overflow:auto;height:auto}
  .app{height:auto}
  .stage{display:block}
  .panel.on{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Week 2 specific ---------- */
.p1{align-items:stretch}
.p1 .art{width:225px;flex:none;align-items:center;justify-content:flex-start;gap:10px;text-align:center}
.p1 .main{flex:1}
.formrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px}
.formrow label{font-size:.85rem;font-weight:600;display:flex;flex-direction:column;gap:3px}
.formrow input,.formrow select{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:8px;min-width:150px;background:#fff}
.steps{margin:18px 0 0;padding:14px 16px 14px 36px;background:var(--cream-l);border-radius:12px;line-height:1.7;font-size:.93rem}
.stmt{display:flex;align-items:center;gap:12px;padding:5px 0;border-bottom:1px solid var(--cream)}
.stmt:last-child{border-bottom:0}
.stmt .t{flex:1;font-size:.92rem;line-height:1.35}
.rate{display:flex;gap:4px;flex:none}
.rate button{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:#fff;font-weight:700}
.rate button:hover{border-color:var(--red)}
.rate button[aria-pressed="true"]{background:var(--red-d);border-color:var(--red-d);color:#fff}
.tag{display:inline-block;margin-top:3px;background:var(--teal-l);color:var(--teal);font-weight:700;font-size:.74rem;border-radius:999px;padding:1px 9px}
.scale-hint{display:flex;justify-content:flex-end;gap:10px;font-size:.76rem;color:var(--muted);margin-bottom:2px}
.banner{background:var(--teal);color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;margin-bottom:6px}
.banner b{font-family:Georgia,serif;font-size:1.9rem;line-height:1}
.banner span{font-size:.9rem}
/* tab 2 */
.round{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:2px solid var(--line);background:var(--cream-l);border-radius:14px;padding:16px;text-align:left;font-size:.98rem;line-height:1.45;min-height:190px;position:relative;font-size:1.05rem;display:flex;flex-direction:column;gap:6px}
.card:hover:not(.locked){border-color:var(--red);background:#fff}
.card.right{border-color:var(--ok);background:var(--ok-l)}
.card.wrong{border-color:var(--red);background:var(--bad-l)}
.card.locked{cursor:default}
.badge{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--ink)}
.badge svg{flex:none}
.card .lab{display:block;font-weight:700;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.fb{border-radius:12px;padding:10px 14px;font-size:.92rem;min-height:64px}
.fb.good{background:var(--ok-l)} .fb.bad{background:var(--bad-l)}
.prog{display:flex;gap:6px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cream);border:2px solid var(--line)}
.dot.now{border-color:var(--red-d)} .dot.ok{background:var(--ok);border-color:var(--ok)} .dot.no{background:var(--red);border-color:var(--red)}
/* tab 3 */
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tgt{border:2px solid var(--line);background:var(--cream-l);border-radius:14px;padding:8px 6px 10px;text-align:center;font-weight:600;font-size:.85rem}
.tgt:hover:not(.locked){border-color:var(--red);background:#fff}
.tgt.right{border-color:var(--ok);background:var(--ok-l)}
.tgt.wrong{border-color:var(--red);background:var(--bad-l)}
.tgt svg{margin:0 auto 4px;width:100%;max-width:165px;height:auto}
.scn{font-family:Georgia,serif;font-size:1.08rem;line-height:1.4;background:var(--cream-l);border-radius:12px;padding:12px 16px;border-left:6px solid var(--red)}
@media (min-width:761px) and (max-width:940px){
  .p1 .art{width:150px}.p1 .art svg{width:140px;height:auto}
  .stmt .t{font-size:.86rem}.why{display:none}
  .banner{padding:8px 12px}.banner span{font-size:.84rem}.banner b{font-size:1.6rem}
}
@media (max-width:760px){.p1 .art{width:auto}.pair,.targets{grid-template-columns:1fr 1fr}.stmt{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="rule"></div>
      <h1>Barnum Effect Lab</h1>
      <p class="sub">Week 2 · Research Methods, Validity, and Ethics</p>
    </div>
    <div class="tabs" role="tablist" aria-label="Activities">
      <button class="tab" role="tab" id="t1" aria-selected="true" aria-controls="p1">1. Your reading</button>
      <button class="tab" role="tab" id="t2" aria-selected="false" aria-controls="p2">2. Spot the Barnum</button>
      <button class="tab" role="tab" id="t3" aria-selected="false" aria-controls="p3">3. Reliable or valid?</button>
    </div>
  </header>

  <main class="stage">
    <!-- ===== TAB 1 ===== -->
    <section class="panel p1 on" id="p1" role="tabpanel" aria-labelledby="t1">
      <div class="col art" id="art1"></div>
      <div class="col main" id="main1"></div>
    </section>

    <!-- ===== TAB 2 ===== -->
    <section class="panel" id="p2" role="tabpanel" aria-labelledby="t2">
      <div class="col round" id="round"></div>
    </section>

    <!-- ===== TAB 3 ===== -->
    <section class="panel" id="p3" role="tabpanel" aria-labelledby="t3" style="flex-direction:column">
      <div class="col" style="gap:12px;flex:1" id="tgtwrap"></div>
    </section>
  </main>
</div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var NS="http://www.w3.org/2000/svg";

/* ---------- tabs ---------- */
var tabs=[].slice.call(document.querySelectorAll(".tab"));
tabs.forEach(function(t,i){
  t.addEventListener("click",function(){show(i)});
  t.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight")show((i+1)%3,true); if(e.key==="ArrowLeft")show((i+2)%3,true);
  });
});
function show(i,focus){
  tabs.forEach(function(t,j){
    t.setAttribute("aria-selected",j===i);
    $("#p"+(j+1)).classList.toggle("on",j===i);
  });
  if(focus)tabs[i].focus();
}

/* ---------- TAB 1 ---------- */
var STMTS=[
 {t:"You have a great deal of unused potential that you have not yet turned to your advantage.",tag:"Flattering",why:"Positive and nearly impossible to disprove."},
 {t:"At times you are outgoing and sociable, while at other times you prefer quiet and privacy.",tag:"Both-sided",why:"Covers both ends of the trait."},
 {t:"You like some change and variety, yet you also value routine and predictability.",tag:"Both-sided",why:"Covers both ends of the trait."},
 {t:"You sometimes doubt whether you made the right decision, though you usually trust your judgment.",tag:"Hedged",why:"“Sometimes” and “usually” fit anyone."},
 {t:"You want others to like you, and you are harder on yourself than you let anyone see.",tag:"Universal",why:"Nearly everyone shares this need."},
 {t:"Some of your goals are realistic, while others are more hopeful than practical.",tag:"Unfalsifiable",why:"No result could prove this wrong."}
];
var ratings=[],revealed=false;

function fortuneArt(){
  return '<svg viewBox="0 0 220 250" width="200" role="img" aria-label="A fortune card decorated with stars and a crystal ball">'+
  '<rect x="30" y="14" width="160" height="206" rx="16" fill="#fff" stroke="#d34147" stroke-width="5"/>'+
  '<rect x="42" y="26" width="136" height="182" rx="10" fill="#fbf0d4"/>'+
  '<g fill="#e3a72f"><path d="M110 40l5 12 13 1-10 8 3 13-11-7-11 7 3-13-10-8 13-1z"/>'+
  '<path d="M64 62l3 7 8 .6-6 5 2 8-7-4-7 4 2-8-6-5 8-.6z" transform="scale(.8) translate(18 14)"/>'+
  '<path d="M64 62l3 7 8 .6-6 5 2 8-7-4-7 4 2-8-6-5 8-.6z" transform="translate(98 -6) scale(.8)"/></g>'+
  '<circle cx="110" cy="128" r="38" fill="#2c5f6b"/>'+
  '<ellipse cx="97" cy="114" rx="11" ry="7" fill="#fff" opacity=".35" transform="rotate(-30 97 114)"/>'+
  '<path d="M80 166h60l8 22H72z" fill="#b32d34"/>'+
  '<text x="110" y="136" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#fbf0d4">?</text>'+
  '<rect x="62" y="194" width="96" height="6" rx="3" fill="#d34147" opacity=".55"/></svg>';
}
function crowdArt(){
  var cols=["#d34147","#2c5f6b","#e3a72f","#8f2229","#4c8c97","#c98a1a"];
  var s='<svg viewBox="0 0 220 250" width="200" role="img" aria-label="Six different people each holding an identical reading card">';
  for(var i=0;i<6;i++){
    var col=i%2,row=Math.floor(i/2);
    var x=44+col*84, y=10+row*72, c=cols[i];
    s+='<g transform="translate('+x+' '+y+')">'+
      '<circle cx="22" cy="14" r="11" fill="'+c+'"/>'+
      '<path d="M4 58c0-16 8-27 18-27s18 11 18 27z" fill="'+c+'"/>'+
      '<rect x="14" y="40" width="22" height="26" rx="3" fill="#fff" stroke="#2a2826" stroke-width="1.5" transform="rotate(8 25 53)"/>'+
      '<g stroke="#9a948e" stroke-width="1.4" transform="rotate(8 25 53)"><path d="M18 46h14M18 51h14M18 56h10"/></g></g>';
  }
  s+='<text x="110" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5f6b" font-family="Segoe UI,Arial,sans-serif">Same text, every reader</text></svg>';
  return s;
}

function render1(stage){
  var art=$("#art1"),main=$("#main1");
  if(stage==="intro"){
    art.innerHTML=fortuneArt();
    main.innerHTML=
     '<h2 style="font-size:1.25rem">Get your personalized personality reading</h2>'+
     '<p class="lead" style="margin-top:6px">Answer two quick questions and this lab will write a reading just for you. Then rate how well it describes you.</p>'+
     '<div class="formrow">'+
      '<label>First name<input id="nm" type="text" maxlength="24" autocomplete="off" placeholder="e.g., Jordan"></label>'+
      '<label>Birth month<select id="mo"><option value="">Choose…</option>'+
       "January February March April May June July August September October November December".split(" ").map(function(m){return "<option>"+m+"</option>"}).join("")+
      '</select></label>'+
      '<button class="btn" id="gen">Create my reading</button>'+
     '</div>'+
     '<p class="lead" style="margin-top:10px;font-size:.82rem">Nothing you type here is saved or sent anywhere.</p>'+
     '<ol class="steps"><li><b>Rate</b> six statements from 1 to 5.</li><li><b>Reveal</b> how the reading was built.</li><li><b>Practice</b> spotting the pattern in tabs 2 and 3.</li></ol>';
    main.style.justifyContent="center";
    $("#gen").addEventListener("click",function(){ratings=[];revealed=false;render1("rate");});
  }else{
    var nm=($("#nm")&&$("#nm").value.trim())||window.__nm||"";
    window.__nm=nm;
    main.style.justifyContent="flex-start";
    art.innerHTML=revealed?crowdArt():fortuneArt();
    var h='';
    if(revealed){
      var sum=ratings.reduce(function(a,b){return a+b},0),avg=(sum/ratings.length).toFixed(1);
      h+='<div class="banner"><b>'+avg+'</b><span>was your average accuracy rating (out of 5). <strong>Every reader received these exact six sentences.</strong> Forer’s classic classroom demo averaged about 4.3. Next time a result feels “exactly right,” ask who else it would fit.</span><button class="btn ghost" id="again" style="flex:none;margin-left:auto">Start over</button></div>';
    }else{
      h+='<h2 style="font-size:1.15rem">'+(nm?esc(nm)+", here is your reading":"Here is your reading")+'</h2>'+
         '<div class="scale-hint"><span>1 = not me at all</span><span>5 = describes me exactly</span></div>';
    }
    h+='<div id="list">';
    STMTS.forEach(function(s,i){
      h+='<div class="stmt"><div class="t">'+s.t+
        (revealed?'<br><span class="tag">'+s.tag+'</span> <span class="why" style="font-size:.8rem;color:var(--muted)">'+s.why+'</span>':'')+
        '</div>';
      if(revealed){h+='<div style="flex:none;text-align:center;font-size:.72rem;color:var(--muted);line-height:1.1">You<br><b style="font-size:1.3rem;color:var(--red-d);font-family:Georgia,serif">'+ratings[i]+'</b></div>';}
      else{h+='<div class="rate" role="group" aria-label="Accuracy rating for statement '+(i+1)+'">';
      for(var r=1;r<=5;r++){h+='<button data-i="'+i+'" data-r="'+r+'" aria-pressed="'+(ratings[i]===r)+'">'+r+'</button>';}
      h+='</div>';}
      h+='</div>';
    });
    h+='</div>';
    if(!revealed){
      h+='<div style="display:flex;gap:10px;align-items:center;margin-top:10px"><button class="btn" id="rev" disabled>Reveal the trick</button><span class="lead" id="cnt" style="font-size:.85rem"></span></div>';
    }else{
      h+='';
    }
    main.innerHTML=h;
    [].forEach.call(main.querySelectorAll(".rate button"),function(b){
      b.addEventListener("click",function(){
        ratings[+b.dataset.i]=+b.dataset.r;
        var group=b.parentNode;
        [].forEach.call(group.children,function(x){x.setAttribute("aria-pressed",x===b)});
        updCount();
      });
    });
    if(!revealed){updCount();$("#rev").addEventListener("click",function(){revealed=true;render1("rate")});}
    else $("#again").addEventListener("click",function(){ratings=[];revealed=false;render1("intro")});
  }
}
function updCount(){
  var n=ratings.filter(function(x){return x}).length;
  $("#rev").disabled=n<STMTS.length;
  $("#cnt").textContent=n<STMTS.length?(n+" of "+STMTS.length+" rated"):"All rated. Ready?";
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
render1("intro");

/* ---------- TAB 2 ---------- */
var ROUNDS=[
 {b:"Security is one of your important life goals, although you also crave excitement.",
  s:"On a 10-item orderliness scale you scored 38 of 50. The average in the comparison group was 31.",
  why:"The Barnum line pairs opposite desires, so it fits nearly everyone. The other gives a number and a comparison group that someone could check."},
 {b:"You can be warm with friends yet guarded around people you do not know well.",
  s:"Three people who know you well rated how often you start conversations with strangers. Their average was 2 out of 7.",
  why:"The Barnum line hedges (“can be”) and covers both sides. The other names a behavior, who rated it, and a scale."},
 {b:"You have strengths you have not yet fully used, and you sometimes feel unappreciated.",
  s:"When you retook this inventory two weeks later, your score on each scale changed by less than 3 points.",
  why:"Flattering plus a common worry makes the Barnum line feel personal. The other tells you about reliability, which can be tested."},
 {b:"You pride yourself on independent thinking, but you value others’ opinions too.",
  s:"Your results predicted how a supervisor rated your teamwork (r = .42 in the validation sample).",
  why:"Independence plus openness to others covers almost every possibility. The other reports evidence of validity."},
 {b:"Disciplined on the outside, you can feel worried and insecure on the inside.",
  s:"This test’s publisher reports that its items were reviewed for fairness across cultural groups.",
  why:"Positive outside, vulnerable inside is a classic Barnum pattern. The other names a specific quality check, one worth asking about."}
];
var ri=0,score=0,marks=[],order=[];
function renderRound(){
  var box=$("#round");
  if(ri>=ROUNDS.length){
    var msg=score>=4?"You are reading assessment claims like a researcher.":"Good start. Re-read the explanations and try again.";
    box.innerHTML='<div style="display:flex;gap:22px;align-items:center;flex:1">'+
      checklistArt()+
      '<div><h2 style="font-size:1.25rem">'+score+' of '+ROUNDS.length+' correct</h2><p class="lead" style="margin:4px 0 12px">'+msg+'</p>'+
      '<ol style="margin:0 0 14px;padding-left:20px;line-height:1.6;font-size:.95rem"><li>Could this describe almost anyone?</li><li>Is it flattering, hedged, or two-sided?</li><li>Could evidence ever prove it wrong?</li><li>Is there evidence of reliability and validity?</li></ol>'+
      '<button class="btn" id="redo">Play again</button></div></div>';
    $("#redo").addEventListener("click",function(){ri=0;score=0;marks=[];renderRound()});
    return;
  }
  var R=ROUNDS[ri],flip=(ri*7+3)%2===0;
  var cards=flip?[{k:"b",t:R.b},{k:"s",t:R.s}]:[{k:"s",t:R.s},{k:"b",t:R.b}];
  var d='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'+
    '<h2 style="font-size:1.15rem">Which result line is the Barnum statement?</h2>'+
    '<div class="prog" aria-label="Round '+(ri+1)+' of '+ROUNDS.length+'">'+ROUNDS.map(function(_,i){
      return '<span class="dot '+(i===ri?'now ':'')+(marks[i]===1?'ok':marks[i]===0?'no':'')+'"></span>'}).join("")+'</div></div>'+
    '<p class="lead">Both lines appear on a made-up personality report. Pick the one that would feel “true” to almost anyone.</p>'+
    '<div class="pair">'+cards.map(function(c,i){return '<button class="card" data-k="'+c.k+'"><span class="lab">Line '+"AB"[i]+'</span>'+c.t+'</button>'}).join("")+'</div>'+
    '<div class="fb" id="fb" aria-live="polite"></div>'+
    '<div style="display:flex;justify-content:flex-end"><button class="btn" id="nx" style="visibility:hidden">'+(ri===ROUNDS.length-1?"See results":"Next round")+'</button></div>';
  box.innerHTML=d;
  [].forEach.call(box.querySelectorAll(".card"),function(c){
    c.addEventListener("click",function(){
      if(c.classList.contains("locked"))return;
      var ok=c.dataset.k==="b";
      [].forEach.call(box.querySelectorAll(".card"),function(x){
        x.classList.add("locked");
        if(x.dataset.k==="b")x.classList.add("right");
        x.insertAdjacentHTML("beforeend",x.dataset.k==="b"?BADGE_B:BADGE_S);
      });
      if(!ok)c.classList.add("wrong");
      if(ok)score++;
      marks[ri]=ok?1:0;
      var fb=$("#fb");fb.className="fb "+(ok?"good":"bad");
      fb.innerHTML="<strong>"+(ok?"Yes. ":"Not quite. ")+"</strong>"+R.why;
      var nx=$("#nx");nx.style.visibility="visible";nx.focus();
      nx.addEventListener("click",function(){ri++;renderRound()});
    });
  });
}
var BADGE_B='<span class="badge"><svg width="46" height="30" viewBox="0 0 46 30" aria-hidden="true"><path d="M12 24a8 8 0 0 1 1-16 10 10 0 0 1 19-1 8 8 0 0 1 2 17z" fill="#b9c7cb"/><path d="M8 28h30" stroke="#9aa9ae" stroke-width="3" stroke-linecap="round"/></svg>Vague: fits almost anyone</span>';
var BADGE_S='<span class="badge"><svg width="46" height="30" viewBox="0 0 46 30" aria-hidden="true"><rect x="2" y="9" width="42" height="13" rx="3" fill="#fbf0d4" stroke="#b9862a" stroke-width="2"/><path d="M9 9v7M16 9v5M23 9v7M30 9v5M37 9v7" stroke="#b9862a" stroke-width="2"/></svg>Specific: can be checked</span>';
function checklistArt(){
  return '<svg viewBox="0 0 170 200" width="170" role="img" aria-label="Clipboard checklist"><rect x="14" y="16" width="142" height="176" rx="12" fill="#fff" stroke="#b32d34" stroke-width="5"/>'+
  '<rect x="52" y="6" width="66" height="22" rx="8" fill="#2c5f6b"/>'+
  [0,1,2,3].map(function(i){var y=50+i*34;return '<rect x="30" y="'+y+'" width="18" height="18" rx="4" fill="#dff1e5" stroke="#2f7d4f" stroke-width="2.5"/><path d="M34 '+(y+9)+'l4 4 8-9" fill="none" stroke="#2f7d4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="58" y="'+(y+3)+'" width="'+(70-i*6)+'" height="5" rx="2.5" fill="#cfc9c2"/><rect x="58" y="'+(y+12)+'" width="'+(48-i*3)+'" height="5" rx="2.5" fill="#e3ded8"/>'}).join("")+'</svg>';
}
renderRound();

/* ---------- TAB 3 ---------- */
var TG=[
 {n:"Reliable and valid",d:[[0,0],[5,-4],[-5,3],[3,6],[-4,-6],[2,-2]]},
 {n:"Reliable, not valid",d:[[36,-30],[40,-34],[33,-35],[38,-27],[42,-30],[35,-32]]},
 {n:"Valid on average, not reliable",d:[[-34,20],[30,-28],[-8,38],[22,32],[-30,-24],[12,-40]]},
 {n:"Neither",d:[[-48,-20],[-30,-46],[-12,-14],[-44,10],[-22,-32],[-6,-48]]}
];
var SC=[
 {t:"A bathroom scale reads exactly 5 pounds too heavy, every single time you step on it.",a:1,why:"The readings agree with each other (reliable) but are consistently off target (not valid)."},
 {t:"An online quiz tells you that you are an introvert on Monday and an extravert on Wednesday, with no change in your life.",a:3,why:"Scores jump around and are not hitting any clear target. It is neither reliable nor valid."},
 {t:"A carefully built Big Five inventory gives you similar scores when retaken two weeks later, and those scores line up with how close friends rate you.",a:0,why:"Consistent results that also measure what they claim to measure: reliable and valid."},
 {t:"A mood checklist gives very different scores each day, but across many days its average lands close to your true typical mood.",a:2,why:"Individual scores scatter (not reliable), though they center on the truth. Useful for averages, risky for single scores."}
];
var si=0;
function targetSvg(d){
  var s='<svg viewBox="-60 -60 120 120" role="img" aria-label="Target"><circle r="56" fill="#fff" stroke="#8f2229" stroke-width="2"/><circle r="40" fill="#fbf0d4" stroke="#8f2229" stroke-width="1.5"/><circle r="24" fill="#f3c7c9" stroke="#8f2229" stroke-width="1.5"/><circle r="9" fill="#d34147"/>';
  d.forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.2" fill="#2c5f6b" stroke="#fff" stroke-width="1.5"/>'});
  return s+'</svg>';
}
function renderTarget(){
  var box=$("#tgtwrap");
  if(si>=SC.length){
    box.innerHTML='<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px">'+
      '<div class="targets" style="width:min(520px,100%)">'+TG.map(function(t){return '<div style="pointer-events:none">'+targetSvg(t.d)+'</div>'}).join("")+'</div>'+
      '<h2 style="font-size:1.2rem">Remember: a test can be reliable without being valid.</h2>'+
      '<p class="lead" style="max-width:520px">Consistency is necessary, but not enough. Ask whether the assessment hits the target it claims to measure.</p>'+
      '<button class="btn" id="rst">Try again</button></div>';
    $("#rst").addEventListener("click",function(){si=0;renderTarget()});
    return;
  }
  var S=SC[si];
  box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:1.15rem">Which target matches this assessment?</h2><span class="lead" style="font-size:.85rem">Scenario '+(si+1)+' of '+SC.length+'</span></div>'+
   '<div class="scn">'+S.t+'</div>'+
   '<div class="targets">'+TG.map(function(t,i){return '<button class="tgt" data-i="'+i+'">'+targetSvg(t.d)+t.n+'</button>'}).join("")+'</div>'+
   '<div class="fb" id="fb3" aria-live="polite"></div>'+
   '<div style="display:flex;justify-content:flex-end"><button class="btn" id="nx3" style="visibility:hidden">Next scenario</button></div>';
  [].forEach.call(box.querySelectorAll(".tgt"),function(b){
    b.addEventListener("click",function(){
      if(b.classList.contains("locked"))return;
      var ok=+b.dataset.i===S.a;
      [].forEach.call(box.querySelectorAll(".tgt"),function(x){x.classList.add("locked");if(+x.dataset.i===S.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      var fb=$("#fb3");fb.className="fb "+(ok?"good":"bad");
      fb.innerHTML="<strong>"+(ok?"Correct. ":"Not quite. ")+"</strong>"+S.why;
      var nx=$("#nx3");nx.style.visibility="visible";nx.focus();
      nx.onclick=function(){si++;renderTarget()};
    });
  });
}
renderTarget();
})();
</script>
</body>
</html>
