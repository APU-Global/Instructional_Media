<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Your Learning Environment</title>
<style>:root{--a1:#2f6b4f;--a2:#2a9d8f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#fff;color:#1d2733;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45}
.app{height:100vh;display:flex;flex-direction:column}
header{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(120deg,var(--a1),var(--a2));color:#fff}
header svg{flex:0 0 auto;width:64px;height:64px}
header .wk{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.92;font-weight:600}
header h1{margin:0;font-size:21px;line-height:1.2}
header p{margin:2px 0 0;font-size:13.5px;opacity:.95}
nav{flex:0 0 auto;display:flex;gap:4px;padding:8px 14px 0;border-bottom:2px solid #e3e8ee;background:#f7f9fb}
nav button{font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border:0;background:transparent;color:#41505f;border-radius:8px 8px 0 0;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button[aria-selected=true]{color:var(--a1);background:#fff;border-bottom-color:var(--a1)}
nav button:hover{background:#eef3f7}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
main{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.panel{position:absolute;inset:0;padding:12px 18px;display:none;gap:16px}
.panel.on{display:flex}
.stage{flex:1 1 56%;min-width:0;display:flex;align-items:center;justify-content:center}
.stage svg{width:100%;height:100%;max-height:100%}
.side{flex:1 1 44%;min-width:0;display:flex;flex-direction:column;gap:10px}
.card{border:1px solid #d9e1e8;border-radius:12px;padding:12px 14px;background:#fff;box-shadow:0 1px 3px rgba(20,40,60,.07)}
.card h2{margin:0 0 4px;font-size:17px;color:var(--a1)}
.card h3{margin:8px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#5a6a79}
.card p{margin:0 0 4px}
.hint{font-size:13.5px;color:#4a5a69;background:#f2f6f9;border-left:4px solid var(--a2);padding:8px 10px;border-radius:6px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;border:2px solid var(--a1);background:#fff;color:var(--a1);cursor:pointer}
.btn:hover{background:#eef6f6}
.btn[aria-pressed=true],.btn.solid{background:var(--a1);color:#fff}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:9px 12px;margin:0 0 7px;border:2px solid #cfd8e0;border-radius:10px;background:#fff;cursor:pointer;color:#1d2733}
.opt:hover:not(:disabled){border-color:var(--a1);background:#f4fafa}
.opt.good{border-color:#1f8a4c;background:#e8f6ee}
.opt.bad{border-color:#c0392b;background:#fdecea}
.opt.dim{opacity:.6}
.fb{font-size:14px;margin-top:2px;min-height:44px}
.fb b.g{color:#1f7a45}.fb b.r{color:#b03324}
.node{cursor:pointer}
.node:focus-visible{outline:none}
.node:focus-visible circle.ring{stroke:#f5a623;stroke-width:5}
label{font-weight:600;font-size:14px}
input[type=range]{width:100%;accent-color:var(--a1)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--a1);color:#fff}
.prog{font-size:13px;color:#4a5a69}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:719px),(max-height:600px){
 html,body{overflow:auto}.app{height:auto;min-height:100vh}
 main{overflow:visible}.panel{position:static;flex-direction:column}.panel.on{display:flex}
 .stage{height:340px;flex:none}
}
</style></head>

<section class="panel" id="p1" role="tabpanel" aria-labelledby="t1">

const tabs=[...document.querySelectorAll('[role=tab]')],panels=[...document.querySelectorAll('.panel')];
function showTab(i){tabs.forEach((t,j)=>{t.setAttribute('aria-selected',j==i);t.tabIndex=j==i?0:-1});panels.forEach((p,j)=>p.classList.toggle('on',j==i))}
tabs.forEach((t,i)=>{t.onclick=()=>showTab(i);t.onkeydown=e=>{if(e.key=='ArrowRight'||e.key=='ArrowLeft'){const n=(i+(e.key=='ArrowRight'?1:tabs.length-1))%tabs.length;showTab(n);tabs[n].focus()}}});
showTab(0);

function runQuiz(items, ids){
  let i=0, score=0;
  const $=id=>document.getElementById(id);
  function render(){
    const it=items[i];
    $(ids.q).innerHTML='<h2>'+it.title+'</h2><p>'+it.text+'</p>';
    $(ids.o).innerHTML='';
    $(ids.f).innerHTML='Choose the response you would plan as the teacher.';
    $(ids.n).style.display='none';
    $(ids.p).textContent='Scenario '+(i+1)+' of '+items.length+' \u2022 Score: '+score;
    it.opts.forEach((o,k)=>{
      const b=document.createElement('button');b.className='opt';b.textContent=o.t;
      b.onclick=()=>{
        [...$(ids.o).children].forEach((c,j)=>{c.disabled=true;c.classList.add(items[i].opts[j].ok?'good':'dim')});
        if(o.ok){score++;b.classList.add('good')}else{b.classList.remove('dim');b.classList.add('bad')}
        $(ids.f).innerHTML=(o.ok?'<b class="g">Strong choice.</b> ':'<b class="r">Not quite.</b> ')+o.f+(o.ok?'':' <br><b class="g">Better:</b> '+it.opts.find(x=>x.ok).f);
        $(ids.p).textContent='Scenario '+(i+1)+' of '+items.length+' \u2022 Score: '+score;
        $(ids.n).style.display='';$(ids.n).textContent=i<items.length-1?'Next scenario \u2192':'See results';
        $(ids.n).focus();
      };
      $(ids.o).appendChild(b);
    });
  }
  $(ids.n).onclick=()=>{
    if(i<items.length-1){i++;render()}
    else if($(ids.n).dataset.done){i=0;score=0;$(ids.n).dataset.done='';render()}
    else{$(ids.q).innerHTML='<h2>Complete: '+score+' of '+items.length+'</h2><p>'+(score==items.length?'Excellent. You consistently chose the response that matches the learning goal.':'Review the feedback on any missed scenarios and try again to see how the reasoning changes.')+'</p>';$(ids.o).innerHTML='';$(ids.f).innerHTML='';$(ids.n).textContent='Try again';$(ids.n).dataset.done='1'}
  };
  render();
}
