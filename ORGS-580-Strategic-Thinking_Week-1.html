<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORGS 580 Strategic Thinking - Week 1: Three Terms, Three Jobs</title>
<style>
:root{--red:#d34147;--dark:#a8353a;--ink:#26262b;--mut:#626770;--line:#e4e1dd;--bg:#faf8f6;--card:#fff;--ok:#2e8b57;--okbg:#e6f4ec;--bad:#c0392b;--badbg:#fbeaea;--gold:#e0a526;--goldbg:#fff6df;--blue:#2f6fa8;--blue-bg:#e8f1f9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{height:100vh;display:flex;flex-direction:column;min-height:0}
.hdr{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 22px;background:linear-gradient(100deg,#26262b 0%,#3a2a2d 55%,#a8353a 100%);color:#fff}
.hdr .eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.8}
.hdr h1{margin:1px 0 1px;font-size:21px;line-height:1.15;font-weight:700}
.hdr p{margin:0;font-size:13px;opacity:.88}
.hdr svg{flex:0 0 auto;height:70px;width:auto}
.nav{flex:0 0 auto;display:flex;gap:6px;padding:8px 22px 0;background:#fff;border-bottom:1px solid var(--line)}
.nav button{border:0;background:transparent;padding:8px 14px;border-bottom:3px solid transparent;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:8px}
.nav button .n{width:22px;height:22px;border-radius:50%;background:#e9e6e2;color:var(--mut);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.nav button.on{color:var(--dark);border-bottom-color:var(--red)}
.nav button.on .n{background:var(--red);color:#fff}
.nav button.done .n{background:var(--ok);color:#fff}
.nav button:disabled{opacity:.45;cursor:not-allowed}
.stage{flex:1 1 auto;min-height:0;padding:12px 22px 12px;display:flex;flex-direction:column;gap:10px}
.view{display:none;flex:1 1 auto;min-height:0}
.view.on{display:flex;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;background:var(--red);color:#fff}
.btn:hover{background:var(--dark)}
.btn.sec{background:#fff;color:var(--dark);border:1.5px solid var(--red)}
.btn.sec:hover{background:#fdf1f1}
.btn:disabled{background:#cfcbc6;color:#fff;cursor:not-allowed;border-color:#cfcbc6}
.fb{border-radius:10px;padding:9px 12px;font-size:14px;border:1px solid var(--line);background:#fff}
.fb.ok{background:var(--okbg);border-color:#b6dec6}
.fb.bad{background:var(--badbg);border-color:#efc2bd}
.fb.info{background:var(--blue-bg);border-color:#c4dbef}
.fb.gold{background:var(--goldbg);border-color:#f0dba0}
.h2{font-size:15.5px;font-weight:700;margin:0 0 4px}
.small{font-size:13px;color:var(--mut)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#f1ece8;color:var(--dark)}
.sr{position:absolute;left:-9999px}
@media (max-width:780px){
 html,body{overflow:auto;height:auto}
 .app{height:auto;min-height:100vh}
 .hdr svg{display:none}
 .view.on{flex-direction:column}
 .stage{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.term{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.term:hover{transform:translateY(-2px)}
.term.on{border-color:var(--red);background:#fffafa}
.term svg{width:54px;height:54px}
.term b{font-size:16px}
.term span{font-size:13px;color:var(--mut)}
.col{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.detail{display:flex;gap:14px;align-items:stretch;flex:1;min-height:0}
.detail .card{flex:1;min-width:0}
.detail ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.detail li{margin:2px 0}
.anchor{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.anchor button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.anchor button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.practice{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.sc{display:flex;gap:14px;align-items:center;font-size:17px;padding:14px 16px}
.sc .num{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--red);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;font-weight:700;text-align:left}
.choice svg{width:38px;height:38px;flex:0 0 auto}
.choice:hover:not(:disabled){border-color:var(--red)}
.choice.right{border-color:var(--ok);background:var(--okbg)}
.choice.wrong{border-color:var(--bad);background:var(--badbg)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;background:#e4e1dd;display:block}
.dots i.cur{box-shadow:0 0 0 3px #f3c9cb;background:var(--red)}
.dots i.g{background:var(--ok)}.dots i.b{background:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.result{align-items:center;text-align:center;justify-content:center;gap:10px;display:flex;flex-direction:column;flex:1}
.result .score{font-size:46px;font-weight:800;color:var(--dark);line-height:1}
@media (max-width:780px){.tri,.choices{grid-template-columns:1fr}.detail{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
 <header class="hdr">
  <div>
   <div class="eyebrow">ORGS 580 Strategic Thinking &middot; Week 1</div>
   <h1>Three Terms, Three Jobs</h1>
   <p>Strategic thinking, planning, and management: learn the difference, then sort the work.</p>
  </div>
  <svg viewBox="0 0 260 70" role="img" aria-label="Illustration: compass, clipboard and gauge connected by arrows">
   <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <circle cx="35" cy="35" r="24"/><path d="M35 17v6M35 47v6M17 35h6M47 35h6"/><path d="M42 28l-5 12-12 5 5-12z" fill="#d34147" stroke="#fff"/>
    <path d="M70 35h26M90 29l6 6-6 6"/>
    <rect x="108" y="12" width="44" height="46" rx="6"/><rect x="120" y="7" width="20" height="9" rx="3" fill="#26262b"/><path d="M116 28h28M116 37h28M116 46h18"/>
    <path d="M160 35h26M180 29l6 6-6 6"/>
    <path d="M196 50a28 28 0 1 1 56 0"/><path d="M224 50l14-18" stroke="#f3c9cb" stroke-width="3.5"/><circle cx="224" cy="50" r="4" fill="#d34147"/>
   </g>
  </svg>
 </header>
 <nav class="nav" aria-label="Activity steps">
  <button id="t1" class="on" onclick="show(1)"><span class="n">1</span>Explore</button>
  <button id="t2" onclick="show(2)"><span class="n">2</span>Sort the work</button>
 </nav>
 <main class="stage">
  <section id="v1" class="view on">
   <div class="col">
    <div class="tri" role="tablist" aria-label="Choose a term">
     <button class="term on" data-k="think" role="tab">
      <svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="25" fill="#fdecec"/><circle cx="27" cy="27" r="16" fill="none" stroke="#a8353a" stroke-width="2.5"/><path d="M33 21l-4 10-10 4 4-10z" fill="#d34147"/><circle cx="27" cy="27" r="2" fill="#fff"/></svg>
      <b>Strategic Thinking</b><span>Where should we go, and why?</span></button>
     <button class="term" data-k="plan" role="tab">
      <svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="25" fill="#fdecec"/><rect x="15" y="12" width="24" height="30" rx="3" fill="#fff" stroke="#a8353a" stroke-width="2.5"/><rect x="22" y="9" width="10" height="6" rx="2" fill="#d34147"/><path d="M20 24h14M20 30h14M20 36h8" stroke="#a8353a" stroke-width="2.2" stroke-linecap="round"/></svg>
      <b>Strategic Planning</b><span>How do we organize the journey?</span></button>
     <button class="term" data-k="manage" role="tab">
      <svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="25" fill="#fdecec"/><path d="M11 36a16 16 0 1 1 32 0" fill="none" stroke="#a8353a" stroke-width="3" stroke-linecap="round"/><path d="M27 36l8-10" stroke="#d34147" stroke-width="3" stroke-linecap="round"/><circle cx="27" cy="36" r="3.5" fill="#d34147"/></svg>
      <b>Strategic Management</b><span>Are we on track, and do we adjust?</span></button>
    </div>
    <div class="detail">
     <div class="card" id="detail"></div>
     <div class="card" style="max-width:330px">
      <div class="h2">Strategy needs an anchor</div>
      <svg viewBox="0 0 300 118" style="width:100%;height:auto;display:block" role="img" aria-label="Think, plan, manage loop resting on mission, vision, values">
       <g font-size="11" font-weight="700" text-anchor="middle" fill="#fff">
        <rect x="8" y="8" width="84" height="30" rx="15" fill="#d34147"/><text x="50" y="27">Think</text>
        <rect x="108" y="8" width="84" height="30" rx="15" fill="#a8353a"/><text x="150" y="27">Plan</text>
        <rect x="208" y="8" width="84" height="30" rx="15" fill="#26262b"/><text x="250" y="27">Manage</text>
       </g>
       <g fill="none" stroke="#626770" stroke-width="2" stroke-linecap="round"><path d="M94 23h12M102 19l4 4-4 4M194 23h12M202 19l4 4-4 4"/><path d="M250 40v14H50V40M54 46l-4-6-4 6"/></g>
       <text x="150" y="68" text-anchor="middle" font-size="10.5" fill="#626770">continuous loop</text>
       <rect x="8" y="80" width="284" height="30" rx="8" fill="#f1ece8" stroke="#e4e1dd"/>
       <text x="150" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#26262b">Mission &middot; Vision &middot; Values</text>
      </svg>
      <div class="anchor" style="margin-top:8px" id="anchor">
       <button data-a="m">Mission</button><button data-a="v">Vision</button><button data-a="va">Values</button>
      </div>
      <div class="small" id="anchorTxt" style="margin-top:6px;min-height:36px">Tap an anchor to see what it does.</div>
     </div>
    </div>
    <div class="row"><span class="small">Tap each term, then try the sorting practice.</span><button class="btn" onclick="show(2)">Start sorting &rarr;</button></div>
   </div>
  </section>

  <section id="v2" class="view">
   <div class="practice" id="practice"></div>
  </section>
 </main>
</div>
<script>
// Reports height to the parent page (used only if the host listens); layout itself never needs a second scrollbar.
(function(){function send(){try{var h=Math.ceil(document.documentElement.scrollHeight);parent.postMessage({subject:'lti.frameResize',height:h},'*');}catch(e){}}
if(window.ResizeObserver){new ResizeObserver(send).observe(document.body);}window.addEventListener('load',send);})();

var T={
 think:{name:'Strategic Thinking',tag:'Explores',lead:'The ongoing, creative practice of making sense of the environment and imagining how the organization could be different.',pts:['Looks outward and ahead, not only at current operations','Combines analysis with curiosity, intuition and creativity','Questions the assumptions behind the current direction','A habit of leaders at every level, not an annual event']},
 plan:{name:'Strategic Planning',tag:'Organizes',lead:'Turns the direction set by thinking into goals, priorities, resources and timelines.',pts:['Produces a documented plan for a defined period','Aligns goals with mission, vision and values','Allocates people, budget and time to top priorities','Works best when revisited, not filed away']},
 manage:{name:'Strategic Management',tag:'Executes',lead:'The continuing work of carrying out strategy, monitoring results and adjusting as conditions change.',pts:['Connects strategy to day-to-day decisions and measures','Assigns accountability and communicates priorities','Reviews results against goals and corrects course','Links thinking and planning to organizational performance']}
};
var A={m:'Mission explains why the organization exists.',v:'Vision describes the future the organization is working toward.',va:'Values guide how people behave while pursuing the vision.'};
function show(n){document.getElementById('v1').classList.toggle('on',n==1);document.getElementById('v2').classList.toggle('on',n==2);
 document.getElementById('t1').classList.toggle('on',n==1);document.getElementById('t2').classList.toggle('on',n==2);if(n==2&&!window._init){startPractice();window._init=1}}
function renderDetail(k){var d=T[k];document.getElementById('detail').innerHTML='<span class="pill">'+d.tag+'</span><div class="h2" style="margin-top:6px;font-size:18px">'+d.name+'</div><p style="margin:2px 0 4px">'+d.lead+'</p><ul>'+d.pts.map(function(p){return'<li>'+p+'</li>'}).join('')+'</ul>';}
document.querySelectorAll('.term').forEach(function(b){b.onclick=function(){document.querySelectorAll('.term').forEach(function(x){x.classList.remove('on')});b.classList.add('on');renderDetail(b.dataset.k)}});
document.querySelectorAll('#anchor button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#anchor button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('anchorTxt').textContent=A[b.dataset.a]}});
renderDetail('think');

var ICON={think:document.querySelector('[data-k=think] svg').outerHTML,plan:document.querySelector('[data-k=plan] svg').outerHTML,manage:document.querySelector('[data-k=manage] svg').outerHTML};
var Q=[
 ['A director spends Friday afternoon asking how rising telehealth use could change what patients expect in five years, and whether today\u2019s service model still fits.','think','Imagining how the organization could be different and questioning current assumptions is strategic thinking.'],
 ['The leadership team turns the new direction into three goals, assigns budget, and sets deadlines for the next two years.','plan','Converting direction into goals, resources and timelines is strategic planning.'],
 ['Each quarter, a VP reviews results against the plan\u2019s measures and moves staff to an initiative that is falling behind.','manage','Monitoring results against goals and correcting course is strategic management.'],
 ['A manager notices a competitor\u2019s pricing shift and asks which assumption in the current direction it challenges.','think','Scanning outward and testing assumptions is a thinking habit, not a planning or tracking task.'],
 ['A one-page plan ties each goal to the mission and names an owner and a timeline for it.','plan','Aligning goals with mission and assigning owners and timelines is planning work.'],
 ['A leader clearly communicates priorities to every team and assigns accountability for each measure.','manage','Communicating priorities and assigning accountability keeps the organization aligned during execution.'],
 ['Budget lines and staffing levels are allocated to the three highest-priority goals.','plan','Allocating people, budget and time to priorities is part of strategic planning.'],
 ['A regulatory change makes a plan assumption obsolete, so a leader adjusts course and explains the reasoning to staff.','manage','Adjusting as conditions change, and explaining why, is strategic management.']
];
var i,score,res;
function startPractice(){i=0;score=0;res=[];draw()}
function dots(){return'<div class="dots" aria-label="Progress">'+Q.map(function(_,j){return'<i class="'+(j<res.length?(res[j]?'g':'b'):(j==i?'cur':''))+'"></i>'}).join('')+'</div>'}
function draw(){var p=document.getElementById('practice');
 if(i>=Q.length){var msg=score==Q.length?'Excellent. You can tell the three jobs apart.':score>=6?'Strong work. Review the explanations for the ones you missed.':'Good start. Revisit the Explore tab and try again.';
  p.innerHTML='<div class="card result"><svg width="90" height="90" viewBox="0 0 90 90"><circle cx="45" cy="45" r="42" fill="#fdecec"/><circle cx="45" cy="45" r="30" fill="none" stroke="#d34147" stroke-width="6" stroke-dasharray="'+(188*score/Q.length)+' 188" transform="rotate(-90 45 45)" stroke-linecap="round"/><path d="M33 46l9 9 16-18" fill="none" stroke="#a8353a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="score">'+score+' / '+Q.length+'</div><div style="font-size:17px">'+msg+'</div><div class="small" style="max-width:520px">Remember: thinking explores, planning organizes, management executes. All three are anchored in mission, vision and values, and the loop never stops.</div><div class="row"><button class="btn" onclick="startPractice()">Try again</button><button class="btn sec" onclick="show(1)">Back to Explore</button></div></div>';return}
 var q=Q[i];
 p.innerHTML='<div class="row"><b>Which job is this?</b>'+dots()+'</div>'+
 '<div class="card sc"><div class="num">'+(i+1)+'</div><div>'+q[0]+'</div></div>'+
 '<div class="choices">'+['think','plan','manage'].map(function(k){return'<button class="choice" data-k="'+k+'">'+ICON[k]+T[k].name+'</button>'}).join('')+'</div>'+
 '<div id="fb" class="fb info" style="flex:1">Choose the term that best describes the work.</div>'+
 '<div class="row"><span class="small">Score: '+score+'</span><button class="btn" id="nx" disabled>'+(i==Q.length-1?'See results':'Next')+' &rarr;</button></div>';
 var done=false;
 p.querySelectorAll('.choice').forEach(function(b){b.onclick=function(){if(done)return;var ok=b.dataset.k==q[1];
  if(ok){done=true;score++;res.push(1);b.classList.add('right');fb('ok','<b>Correct.</b> '+q[2])}
  else{done=true;res.push(0);b.classList.add('wrong');p.querySelector('[data-k='+q[1]+']').classList.add('right');fb('bad','<b>Not quite.</b> '+q[2])}
  p.querySelectorAll('.choice').forEach(function(x){x.disabled=true});document.getElementById('nx').disabled=false}});
 document.getElementById('nx').onclick=function(){i++;draw()};
 function fb(c,t){var f=document.getElementById('fb');f.className='fb '+c;f.style.flex='1';f.innerHTML=t}
}
</script>
</body>
</html>
