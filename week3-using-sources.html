<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 3: Using Sources</title><style>
:root{--navy:#14274e;--teal:#0e7c7b;--gold:#f4b400;--ink:#1f2937;--muted:#566074;--bg:#f4f7fb;--card:#fff;--line:#d5dcea;
--good:#136c3a;--goodbg:#e4f4ea;--bad:#a8261b;--badbg:#fdeceb;--accent:#0e7c7b;--accentbg:#e3f3f2}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
.app{height:100%;display:flex;flex-direction:column}
header{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:#fff;padding:10px 18px 12px}
.hl{min-width:0}
.wk{display:inline-block;background:var(--gold);color:#14274e;font-weight:700;font-size:12px;letter-spacing:.08em;padding:2px 8px;border-radius:99px}
h1{margin:4px 0 0;font-size:clamp(18px,3.2vw,24px);line-height:1.15}
header p{margin:2px 0 0;font-size:14px;color:#d6def0}
.bn{flex:none;width:150px;height:62px}.bn svg{width:100%;height:100%;display:block}
.prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.18)}
.prog span{display:block;height:100%;width:0;background:var(--gold);transition:width .35s}
#stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 18px 18px;scrollbar-width:thin}
.wrap{max-width:880px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(20,39,78,.07)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px;gap:8px}
.pill{background:var(--accentbg);color:#0a5958;border-radius:99px;padding:2px 10px;font-weight:600;font-size:13px}
h2{margin:0 0 6px;font-size:19px;color:var(--navy)}
.lead{margin:0 0 10px;color:var(--muted)}
.btns{display:grid;gap:8px;margin-top:12px}
.btns.c3{grid-template-columns:repeat(3,1fr)}.btns.c2{grid-template-columns:repeat(2,1fr)}.btns.c4{grid-template-columns:repeat(4,1fr)}
button{font:inherit;cursor:pointer}
.opt{min-height:46px;padding:8px 10px;border:2px solid var(--line);background:#fff;border-radius:12px;color:var(--navy);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--accentbg)}
.opt:focus-visible,.primary:focus-visible,.ghost:focus-visible,.blk:focus-visible,.slot:focus-visible{outline:3px solid #1a5fd0;outline-offset:2px}
.opt.right{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt:disabled{cursor:default}
.primary{min-height:44px;padding:8px 20px;border:0;border-radius:99px;background:var(--navy);color:#fff;font-weight:700}
.primary:hover:not(:disabled){background:#0d1b38}.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{min-height:40px;padding:6px 16px;border:2px solid var(--navy);border-radius:99px;background:#fff;color:var(--navy);font-weight:700}
.fb{margin-top:12px;border-radius:12px;padding:10px 14px;border-left:6px solid var(--good);background:var(--goodbg)}
.fb.no{border-left-color:var(--bad);background:var(--badbg)}
.fb b{display:block;margin-bottom:2px}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.res{text-align:center}.res .big{font-size:44px;font-weight:800;color:var(--navy);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chip{background:var(--accentbg);border-radius:12px;padding:6px 12px;font-weight:600;color:#0a5958;font-size:14px}
mark{background:#ffe08a;border-radius:3px;padding:0 1px}
@media (max-width:620px){.bn{display:none}.btns.c3,.btns.c4{grid-template-columns:1fr}#stage{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><div class="app">
<header><div class="hl"><span class="wk">WEEK 3</span><h1>Quote, Paraphrase, or Copy?</h1><p>Judge student writing, then pick the right tool for each situation.</p></div>
<div class="bn" aria-hidden="true"><svg viewBox="0 0 150 62" xmlns="http://www.w3.org/2000/svg">
<rect x="4" y="12" width="38" height="40" rx="4" fill="#fff"/><g stroke="#8a94ab" stroke-width="3"><line x1="10" y1="22" x2="36" y2="22"/><line x1="10" y1="30" x2="36" y2="30"/><line x1="10" y1="38" x2="28" y2="38"/></g><rect x="9" y="19" width="28" height="6" fill="#ffe08a" opacity=".8"/>
<path d="M50 32h28" stroke="#f4b400" stroke-width="4" stroke-linecap="round"/><path d="M72 24l10 8-10 8" fill="none" stroke="#f4b400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="90" y="12" width="38" height="40" rx="4" fill="#0e7c7b"/><g stroke="#fff" stroke-width="3"><line x1="96" y1="22" x2="122" y2="22"/><line x1="96" y1="30" x2="122" y2="30"/><line x1="96" y1="38" x2="112" y2="38"/></g>
<path d="M118 56l22-30 6 5-22 30-9 3z" fill="#f4b400" stroke="#14274e" stroke-width="2" stroke-linejoin="round"/></svg></div>
<div class="prog" id="progbox" role="progressbar" aria-label="Activity progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="pbar"></span></div></header>
<main id="stage"></main></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const stage=$('#stage');
function setProg(n,t){$('#pbar').style.width=Math.round(100*n/t)+'%';$('#progbox').setAttribute('aria-valuenow',Math.round(100*n/t));}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toTop(){stage.scrollTop=0;}

const ORIG='Workers who receive written feedback within two days of submitting a task are more likely to revise their work than those who wait a week or longer, suggesting that timing matters as much as content.';
const CITE='Alvarez (2021, p. 14) — fictional practice passage';
const J={ok:'Acceptable paraphrase',patch:'Too close to the original',quote:'Needs quotation marks',nocite:'Missing citation'};
const T={quote:'Quote',para:'Paraphrase',sum:'Summarize'};
const items=[
{type:'judge',s:'Employees who get written feedback within two days of turning in a task are more likely to revise than those who wait a week or more, which suggests timing matters as much as content (Alvarez, 2021).',a:'patch',w:'The sentence has the same structure as the original with a few swapped words. That is patchwriting, and it still counts as copying. Rebuild the sentence in your own structure.'},
{type:'judge',s:'Alvarez (2021) found that prompt feedback encourages revision, so when comments arrive may carry as much weight as what they say.',a:'ok',w:'New wording, new sentence structure, same meaning, and a citation. This is a strong paraphrase.'},
{type:'judge',s:'Workers who receive written feedback within two days of submitting a task are more likely to revise their work (Alvarez, 2021, p. 14).',a:'quote',w:'The wording is copied exactly, so it must go in quotation marks. Adding a citation alone does not fix it. Either quote it or paraphrase it.'},
{type:'judge',s:'People tend to improve their drafts more when comments come back quickly, so instructors should return feedback fast.',a:'nocite',w:'The idea comes from the source, but nothing credits it. Paraphrases need an in-text citation too, such as (Alvarez, 2021).'},
{type:'tool',s:'Your paper analyzes a company slogan, “Fail early, learn loudly,” and how employees repeat it.',a:'quote',w:'When the exact wording is the evidence, quote it.'},
{type:'tool',s:'You need to mention one specific finding from page 14 of an article: the timing of feedback affects revision.',a:'para',w:'A single specific idea is best restated in your own words and sentence structure, with a citation.'},
{type:'tool',s:'You want readers to understand the main argument of a 30-page chapter in two sentences.',a:'sum',w:'Condensing a large piece into its main points is summarizing.'}
];
let i=0,score=0;
const tri=a=>{const o=[];for(let n=0;n<=a.length-3;n++)o.push(a.slice(n,n+3).join(' '));return o};
const norm=w=>w.toLowerCase().replace(/[^a-z0-9]/g,'');
function overlap(stu){
 const ow=ORIG.split(/\s+/).map(norm).filter(Boolean),set=new Set(tri(ow));
 const words=stu.split(/\s+/),nw=words.map(norm),hit=new Array(words.length).fill(false);
 for(let n=0;n<=nw.length-3;n++)if(set.has(nw.slice(n,n+3).join(' ')))hit[n]=hit[n+1]=hit[n+2]=true;
 const body=words.map((w,n)=>hit[n]?'<mark>'+esc(w)+'</mark>':esc(w)).join(' ');
 return{html:body,pct:Math.round(100*hit.filter(Boolean).length/words.length)};
}
function show(){
 if(i>=items.length)return done();
 const it=items[i];setProg(i,items.length);
 let h=`<div class="wrap"><div class="card"><div class="meta"><span class="pill">${it.type==='judge'?'Check the paraphrase':'Choose the right tool'} · ${i+1} of ${items.length}</span><span>Score: ${score}</span></div>`;
 if(it.type==='judge'){
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" class="two">
  <div style="background:#eef2fa;border-radius:12px;padding:10px 12px"><div style="font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">📄 Original source</div><div style="margin-top:4px">${esc(ORIG)}</div><div style="font-size:13px;color:var(--muted);margin-top:4px">${CITE}</div></div>
  <div style="background:var(--accentbg);border-radius:12px;padding:10px 12px"><div style="font-size:13px;font-weight:700;color:#0a5958;text-transform:uppercase;letter-spacing:.05em">✏️ A student wrote</div><div id="stu" style="margin-top:4px">${esc(it.s)}</div><div id="meter"></div></div></div>
  <p style="margin:12px 0 0;font-weight:700;color:var(--navy)">What is the verdict?</p>
  <div class="btns c4">${Object.keys(J).map(k=>`<button class="opt" data-k="${k}">${J[k]}</button>`).join('')}</div>`;
 }else{
  h+=`<div style="display:flex;gap:12px;align-items:center"><svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true" style="flex:none"><rect x="8" y="8" width="48" height="48" rx="10" fill="#14274e"/><text x="32" y="43" text-anchor="middle" font-size="34" font-weight="800" fill="#f4b400" font-family="Georgia,serif">“”</text></svg><div><h2>Your situation</h2><div>${esc(it.s)}</div></div></div>
  <p style="margin:12px 0 0;font-weight:700;color:var(--navy)">Which tool fits best?</p>
  <div class="btns c3">${Object.keys(T).map(k=>`<button class="opt" data-k="${k}">${T[k]}</button>`).join('')}</div>`;
 }
 h+=`<div id="fb" aria-live="polite"></div></div></div>`;
 stage.innerHTML=h;
 stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b.dataset.k));toTop();
}
function pick(k){
 const it=items[i],ok=k===it.a;if(ok)score++;
 stage.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.k===it.a)b.classList.add('right');else if(b.dataset.k===k)b.classList.add('wrong');});
 let extra='';
 if(it.type==='judge'){
  const o=overlap(it.s);$('#stu').innerHTML=o.html;
  $('#meter').innerHTML=`<div style="margin-top:8px;font-size:13px"><b>${o.pct}%</b> of the words sit in phrases copied from the original <mark>highlighted</mark></div><div style="height:8px;background:#fff;border-radius:99px;overflow:hidden;margin-top:4px"><div style="width:${o.pct}%;height:100%;background:${o.pct>40?'#a8261b':'#0e7c7b'}"></div></div>`;
 }
 const lab=it.type==='judge'?J[it.a]:T[it.a];
 $('#fb').innerHTML=`<div class="fb ${ok?'':'no'}"><b>${ok?'✓ Correct':'✗ Not quite — the answer is “'+lab+'”'}</b>${esc(it.w)}</div><div class="row"><button class="primary" id="nx">${i+1<items.length?'Next →':'See results →'}</button></div>`;
 $('#nx').onclick=()=>{i++;show();};$('#nx').focus();$('#fb').scrollIntoView({block:'nearest'});
}
function done(){
 setProg(1,1);
 stage.innerHTML=`<div class="wrap"><div class="card res"><h2>Activity complete</h2><div class="big">${score}/${items.length}</div>
 <p class="lead">${score>=6?'You know how to use sources and keep your own voice.':'Review the tips below and try again.'}</p>
 <div class="chips"><span class="chip">Quote: exact words, in quotation marks</span><span class="chip">Paraphrase: new words and new structure</span><span class="chip">Summarize: the big picture, shorter</span><span class="chip">Always cite</span></div>
 <button class="ghost" id="rs">Try again</button></div></div>`;
 $('#rs').onclick=()=>{i=0;score=0;show();};
}
const st=document.createElement('style');st.textContent='@media (max-width:620px){.two{grid-template-columns:1fr!important}.btns.c4{grid-template-columns:1fr 1fr!important}}';document.head.appendChild(st);
show();
</script></body></html>
