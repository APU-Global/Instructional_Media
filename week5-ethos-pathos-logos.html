<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 5: Ethos, Pathos, Logos</title><style>
:root{--brick:#b0262c;--red:#d34147;--ink:#2a2220;--sand:#edebe8;--paper:#fff;--teal:#1e6b73;--tealbg:#e3f1f2;--gold:#8a6100;--goldbg:#fbf0d0;--mute:#5f5652;--line:#d9d4cf}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;overflow:hidden}
.app{max-width:920px;margin:0 auto;padding:12px 14px 14px}
.hero{display:flex;gap:16px;align-items:center;background:var(--sand);border-left:6px solid var(--brick);padding:10px 16px;border-radius:0 10px 10px 0}
.hero svg{flex:0 0 auto;width:130px;height:auto}
.hero h1{font:700 25px/1.15 Georgia,"Times New Roman",serif;margin:0 0 4px;color:var(--brick)}
.hero p{margin:0;color:var(--mute);font-size:15px}
.tabs{display:flex;gap:6px;margin:12px 0 10px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.tab[aria-selected=true]{background:var(--brick);border-color:var(--brick);color:#fff}
.tab:disabled{opacity:.55;cursor:default}.tab[aria-selected=true]:disabled{opacity:1}
.stage{min-height:420px}
.btn{background:var(--brick);color:#fff;border:0;padding:9px 18px;border-radius:8px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn:hover{background:#8f1e23}.btn.ghost{background:#fff;color:var(--brick);border:2px solid var(--brick)}
.btn:disabled{background:#bbb;cursor:default}
:focus-visible{outline:3px solid #1b57b8;outline-offset:2px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 12px;margin:0 0 8px;font:15px/1.4 inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--brick)}
.opt.right{border-color:var(--teal);background:var(--tealbg)}
.opt.wrong{border-color:var(--brick);background:#fbe9ea}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{border-radius:10px;padding:8px 12px;margin:4px 0 8px;font-size:14.5px;background:var(--sand);min-height:0}
.fb.ok{background:var(--tealbg);border-left:5px solid var(--teal)}.fb.no{background:#fbe9ea;border-left:5px solid var(--brick)}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}.dot.on{background:var(--brick)}.dot.done{background:var(--teal)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px}
.q{font:700 18px/1.3 Georgia,serif;margin:0 0 10px}
.small{font-size:13.5px;color:var(--mute)}
@media (max-width:640px){.hero svg{width:84px}.hero h1{font-size:20px}.hero p{font-size:13.5px}.stage{min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="app">
<header class="hero"><svg viewBox="0 0 130 90" role="img" aria-label="Triangle with three corners: credibility, emotion, reasoning"><rect width="130" height="90" rx="10" fill="#fff"/><polygon points="65,10 20,78 110,78" fill="#edebe8" stroke="#2a2220" stroke-width="2"/><circle cx="65" cy="10" r="8" fill="#8a6100"/><circle cx="20" cy="78" r="8" fill="#b0262c"/><circle cx="110" cy="78" r="8" fill="#1e6b73"/></svg><div><h1>Week 5: Balance the Triangle</h1><p>Sort lines from a distracted-driving speech and watch each persuasive appeal grow.</p></div></header>
<div class="stage" id="stage"></div>
</div><script>
function $(s,r){return (r||document).querySelector(s)}
function h(t,a,c){var e=document.createElement(t);for(var k in (a||{})){if(k==='class')e.className=a[k];else if(k==='html')e.innerHTML=a[k];else e.setAttribute(k,a[k])}(c||[]).forEach(function(x){e.appendChild(typeof x==='string'?document.createTextNode(x):x)});return e}
function postH(){try{var H=document.querySelector('.app').offsetHeight+4;parent.postMessage({type:'comm105-resize',height:H},'*')}catch(e){}}
window.addEventListener('load',postH);window.addEventListener('resize',postH);
if(window.ResizeObserver){new ResizeObserver(postH).observe(document.documentElement)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}


var C={ethos:{n:'Ethos',d:'Credibility',col:'#8a6100',bg:'#fbf0d0'},pathos:{n:'Pathos',d:'Emotion',col:'#b0262c',bg:'#fbe9ea'},logos:{n:'Logos',d:'Reasoning',col:'#1e6b73',bg:'#e3f1f2'}};
var S=[
['As a paramedic for twelve years, I have responded to more than 200 crashes.','ethos','Speaking from direct experience builds credibility. That is ethos.'],
['Picture Maya’s parents opening the door to two police officers.','pathos','A vivid scene invites listeners to feel the loss. That is pathos.'],
['Distracted driving killed more than 3,000 people in the U.S. in 2022, according to NHTSA.','logos','A statistic with a named source is evidence. That is logos.'],
['I used to text while driving too, so I am not here to judge you.','ethos','Showing goodwill and honesty earns trust. That is ethos.'],
['Imagine the silence in that car and a seat that will never be filled again.','pathos','Imagery that moves the audience emotionally is pathos.'],
['If drivers cannot hold a phone, they cannot text, so a hands-free law targets the cause directly.','logos','This is a step-by-step line of reasoning. That is logos.'],
['I have no sponsor and no paycheck tied to this, only concern for our community.','ethos','Showing you have no hidden motive supports credibility. That is ethos.'],
['Think of the last time you hugged someone you love, and what you would give for one more.','pathos','This asks listeners to feel something personal. That is pathos.'],
['Reading one text takes your eyes off the road for about five seconds. At 55 mph, that is a football field.','logos','A concrete comparison backed by data is logos.']];
S=shuffle(S);
var i=0,sc=0,cnt={ethos:0,pathos:0,logos:0},st=$('#stage');
function tri(act){
 var f=function(k){return cnt[k]?C[k].col:'#fff'};
 var r=function(k){return Math.min(16+cnt[k]*4,34)};
 var pts={ethos:[150,82,'middle',150,30],pathos:[44,236,'start',4,288],logos:[256,236,'end',296,288]};
 return '<svg viewBox="0 0 300 300" role="img" aria-label="Rhetorical triangle. Ethos '+cnt.ethos+', pathos '+cnt.pathos+', logos '+cnt.logos+'" style="width:100%;max-width:330px;height:auto;display:block;margin:auto">'
 +'<polygon points="150,82 44,236 256,236" fill="#edebe8" stroke="#2a2220" stroke-width="3"/>'
 +Object.keys(pts).map(function(k){var p=pts[k];
  return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r(k)+'" fill="'+f(k)+'" stroke="'+C[k].col+'" stroke-width="'+(act===k?7:4)+'"/>'
  +'<text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="15" font-weight="700" fill="'+(cnt[k]?'#fff':C[k].col)+'">'+cnt[k]+'</text>'
  +'<text x="'+p[3]+'" y="'+p[4]+'" text-anchor="'+p[2]+'" font-family="Georgia,serif" font-size="17" font-weight="700" fill="'+C[k].col+'">'+C[k].n+': '+C[k].d+'</text>'}).join('')
 +'<text x="150" y="176" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#5f5652">Persuasive</text><text x="150" y="196" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#5f5652">message</text></svg>';
}
function show(act){
 st.innerHTML='';
 var w=h('div',{style:'display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;align-items:center'});
 var L=h('div',{});L.innerHTML=tri(act);
 var R=h('div',{});
 if(i>=S.length){fin(R);}else{
  var s=S[i];
  R.appendChild(h('p',{class:'small',style:'margin:0 0 4px'},['Line '+(i+1)+' of '+S.length+'. Which appeal is this speaker using?']));
  R.appendChild(h('div',{style:'background:#2a2220;color:#fff;border-radius:14px 14px 14px 2px;padding:12px 16px;font:italic 18px/1.35 Georgia,serif;margin-bottom:10px'},['“'+s[0]+'”']));
  var fb=h('div',{class:'fb','aria-live':'polite'},['Choose Ethos, Pathos or Logos.']);
  var row=h('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px'});
  var nx=h('button',{class:'btn',style:'display:none'},[i===S.length-1?'See results':'Next line']);
  Object.keys(C).forEach(function(k){var b=h('button',{class:'opt',style:'width:auto;flex:1 1 90px;margin:0;text-align:center;font-weight:700;color:'+C[k].col+';border-color:'+C[k].col},[C[k].n]);
   b.onclick=function(){var ok=k===s[1];if(ok){sc++;cnt[k]++;}
    row.querySelectorAll('button').forEach(function(x){x.disabled=true});
    b.style.background=ok?C[k].bg:'#fbe9ea';
    fb.className='fb '+(ok?'ok':'no');fb.textContent=(ok?'Correct. ':'This one is '+C[s[1]].n+'. ')+s[2];
    if(!ok)cnt[s[1]]++;
    $('#triwrap').innerHTML=tri(s[1]);nx.style.display='inline-block';nx.focus();postH()};row.appendChild(b)});
  R.appendChild(row);R.appendChild(fb);R.appendChild(nx);
  nx.onclick=function(){i++;show()};
 }
 L.id='triwrap';
 w.appendChild(L);w.appendChild(R);st.appendChild(w);
 if(window.innerWidth<640)w.style.gridTemplateColumns='1fr';
 postH();
}
function fin(R){
 var b=h('button',{class:'btn'},['Play again']);b.onclick=function(){S=shuffle(S);i=0;sc=0;cnt={ethos:0,pathos:0,logos:0};show()};
 R.appendChild(h('p',{class:'q',style:'font-size:26px'},['You matched '+sc+' of '+S.length]));
 R.appendChild(h('p',{},['Strong persuasive speeches balance all three corners: credibility to earn trust, emotion to make it matter, and reasoning to back the claim with evidence.']));
 R.appendChild(h('p',{class:'small'},['Ethical persuasion invites listeners to weigh good reasons. Check every statistic before you use it in your Persuasive Speech.']));
 R.appendChild(b);
}
show();
</script></body></html>
