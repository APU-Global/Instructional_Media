<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSYC 430 Cultural Psychology - Week 2 ADDRESSING Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--s:1;--ink:#1d2433;--ink2:#4d576d;--line:#d6dcea;--wash:#f1f4fa;--red:#c8333f;--redd:#a3262f;--gold:#f2b84b;--plum:#5b3f8c;--teal:#0f7a7a;--ok:#1b7248;--okbg:#e5f4ec;--warn:#8a5200;--warnbg:#fff2dc;--bad:#a3262f;--badbg:#fbe8ea}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(16px*var(--s));height:100%;overflow:hidden}
body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:.95rem;line-height:1.38}
h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;margin:0;line-height:1.12;letter-spacing:-.01em}
p{margin:0}
.app{height:100%;display:flex;flex-direction:column;gap:.6rem;padding:.7rem .9rem .8rem}
.top{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;border-bottom:3px solid var(--red);padding-bottom:.5rem}
.top h1{font-size:1.5rem;font-weight:800}
.top .wk{font-size:.82rem;color:var(--ink2);margin-top:.15rem}
.top .tag{font-size:.78rem;color:var(--ink2);text-align:right;white-space:nowrap}
.stage{flex:1;min-height:0;display:grid;gap:.9rem}
.card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:.85rem 1rem;min-height:0;display:flex;flex-direction:column;gap:.55rem}
.btn{border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:700;padding:.55rem 1rem;min-height:2.4rem;transition:background .15s}
.btn:hover{background:var(--redd)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.ghost:hover{background:var(--wash)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.note{font-size:.8rem;color:var(--ink2)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fb{border-left:5px solid var(--ink2);background:var(--wash);border-radius:0 10px 10px 0;padding:.5rem .75rem;font-size:.9rem}
.fb.good{border-color:var(--ok);background:var(--okbg)}
.fb.try{border-color:var(--warn);background:var(--warnbg)}
.fb b{display:block;margin-bottom:.1rem}
@media (max-width:640px){.top .tag{display:none}.top h1{font-size:1.25rem}.app{padding:.55rem .6rem .6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.stage{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.wheelbox{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.wheelbox svg{width:100%;height:100%;display:block}
.wedge{cursor:pointer;outline:none}
.wedge path.shape{fill:#e8ebf5;stroke:#fff;stroke-width:2;transition:fill .2s}
.wedge:hover path.shape{fill:#d9deef}
.wedge[data-st="adv"] path.shape{fill:var(--gold)}
.wedge[data-st="dis"] path.shape{fill:var(--plum)}
.wedge[data-st="both"] path.shape{fill:url(#stripes)}
.wedge.sel path.shape{stroke:var(--red);stroke-width:5}
.wedge:focus-visible path.shape{stroke:var(--ink);stroke-width:5}
.wedge .badge{fill:#fff;stroke:var(--ink);stroke-width:1.5}
.wedge .ltr{font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-weight:800;font-size:26px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.wedge .ico{fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hub-n{font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-weight:800;font-size:44px;fill:var(--ink);text-anchor:middle}
.hub-t{font-size:15px;fill:var(--ink2);text-anchor:middle}
.panel h2{font-size:1.25rem}
.panel .lead{color:var(--ink2)}
.dimhead{display:flex;align-items:center;gap:.7rem}
.dimicon{flex:none;width:2.7rem;height:2.7rem;border-radius:50%;background:var(--wash);display:grid;place-items:center;border:2px solid var(--ink)}
.dimicon svg{width:1.6rem;height:1.6rem;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dimhead .ltrbig{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.8rem;color:var(--ink2)}
.therapy{background:var(--wash);border-radius:10px;padding:.5rem .75rem;font-size:.9rem}
.therapy b{font-weight:700}
.q{font-weight:700;margin-top:.1rem}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
.rbtn{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:.5rem .6rem;font-weight:700;font-size:.86rem;line-height:1.2;color:var(--ink)}
.rbtn:hover{border-color:var(--ink)}
.rbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--wash);box-shadow:inset 0 0 0 1px var(--ink)}
.sw{width:1.6rem;height:.6rem;border-radius:99px;display:block;border:1px solid var(--ink)}
.sw.adv{background:var(--gold)}.sw.dis{background:var(--plum)}
.sw.both{background:repeating-linear-gradient(45deg,var(--gold) 0 4px,var(--plum) 4px 8px)}
.prog{display:flex;align-items:center;gap:.6rem;margin-top:auto}
.dots{display:flex;gap:.28rem}
.dot{width:.7rem;height:.7rem;border-radius:50%;border:1.5px solid var(--ink2);background:#fff}
.dot.adv{background:var(--gold);border-color:var(--ink)}.dot.dis{background:var(--plum);border-color:var(--ink)}
.dot.both{background:repeating-linear-gradient(45deg,var(--gold) 0 2px,var(--plum) 2px 4px);border-color:var(--ink)}
.dot.cur{outline:2px solid var(--red);outline-offset:1px}
.tally{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.4rem;border:1.5px solid var(--ink);border-radius:99px;padding:.15rem .6rem .15rem .45rem;font-size:.82rem;font-weight:700;background:#fff}
.sum p{font-size:.88rem}
.sum p b{font-weight:700}
.sum .names{font-weight:700}
@media (max-width:700px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,36%) minmax(0,1fr);gap:.5rem}
  .card{padding:.65rem .75rem;gap:.4rem}
  .rate{gap:.3rem}.rbtn{padding:.4rem .45rem;font-size:.78rem}
  .therapy{font-size:.82rem}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>The ADDRESSING Wheel</h1>
      <div class="wk">Week 2 &middot; Introspection and Self-Reflection</div>
    </div>
    <div class="tag">PSYC 430<br>Cultural Psychology</div>
  </header>
  <main class="stage">
    <div class="wheelbox"><svg id="wheel" viewBox="0 0 500 500" role="group" aria-label="ADDRESSING wheel with ten identity dimensions"></svg></div>
    <section class="card panel" id="panel" aria-live="polite"></section>
  </main>
</div>

<script>
var DIMS=[
 {l:'A',n:'Age and generational influences',d:'The era you grew up in and your stage of life shape what feels normal, what you value, and how others treat you.',t:'A client in her seventies and a clinician in his twenties may hear \u201crespect\u201d and \u201cindependence\u201d very differently.',q:'Whose experiences shaped your sense of what is \u201cnormal\u201d?',i:'<path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>'},
 {l:'D',n:'Developmental disability',d:'Conditions that begin early in life, such as autism or an intellectual disability, shape access, expectations, and how people are treated.',t:'A client may have spent years being spoken about instead of spoken to.',q:'When have you been assumed capable, or not, because of how you learn?',i:'<path d="M12 21v-9"/><path d="M12 12c0-4-3-6-7-6 0 4 2 6 7 6z"/><path d="M12 14c0-3 2-5 6-5 0 3-2 5-6 5z"/>'},
 {l:'D',n:'Acquired disability',d:'Disabilities from injury, illness, or aging, whether physical, sensory, or cognitive, that can change daily life suddenly.',t:'Office layout, paperwork, and scheduling can include or exclude a client before the first session begins.',q:'What parts of your day assume a body or mind that works a certain way?',i:'<rect x="2.5" y="8" width="19" height="8" rx="4" transform="rotate(-40 12 12)"/><path d="M10.2 13.8l3.6-3.6"/>'},
 {l:'R',n:'Religion and spirituality',d:'Faith, spirituality, or the absence of either. Majority and minority traditions are treated differently in many settings.',t:'A client\u2019s faith may be a source of strength, a source of conflict, or both.',q:'How often do your holidays and practices appear on the calendar by default?',i:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'},
 {l:'E',n:'Ethnic and racial identity',d:'The ethnic and racial groups you belong to, and how others perceive you.',t:'A client may wonder whether you will understand their experiences of bias before they ever say so.',q:'When do you notice your ethnicity, and when can you forget about it?',i:'<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>'},
 {l:'S',n:'Socioeconomic status',d:'Income, education, occupation, and wealth, both the level you grew up with and the one you have now.',t:'Fees, transportation, and work schedules decide who can attend sessions and how consistently.',q:'What did you never have to worry about growing up?',i:'<path d="M3 21h5v-5h5v-5h5V6h3"/>'},
 {l:'S',n:'Sexual orientation',d:'Who you are attracted to, and how safe it feels to be open about that.',t:'Whether a client feels safe naming a partner can shape the whole intake.',q:'Where can you mention your partner or dating life without a second thought?',i:'<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/>'},
 {l:'I',n:'Indigenous heritage',d:'Ancestral ties to the first peoples of a land, including histories of displacement and resilience.',t:'Community, land, and history may be part of how a client understands both problems and healing.',q:'Whose history is told in the places where you learned?',i:'<path d="M12 21V10"/><circle cx="12" cy="6.5" r="4.5"/><path d="M12 16l-4 3M12 16l4 3"/>'},
 {l:'N',n:'National origin',d:'Where you or your family come from, including immigration, citizenship, and language.',t:'Accent, language, or immigration status can affect trust, safety, and what a client chooses to share.',q:'When has your accent or citizenship been questioned, or never mentioned?',i:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'},
 {l:'G',n:'Gender',d:'Your gender identity and the roles and expectations attached to it.',t:'Expectations about who may show emotion, ask for help, or lead can shape what a client says in session.',q:'Which expectations about your gender have you accepted, resisted, or never noticed?',i:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/>'}
];
var N=DIMS.length, state=new Array(N).fill(null), cur=-1, view='intro';
var LAB={adv:'Mostly advantage',dis:'Mostly disadvantage',both:'Both or it depends'};
var svg=document.getElementById('wheel'), panel=document.getElementById('panel');
function pol(r,deg){var a=(deg-90)*Math.PI/180;return [250+r*Math.cos(a),250+r*Math.sin(a)]}
function sector(r0,r1,a0,a1){var p0=pol(r1,a0),p1=pol(r1,a1),p2=pol(r0,a1),p3=pol(r0,a0);
  return 'M'+p0+'A'+r1+' '+r1+' 0 0 1 '+p1+'L'+p2+'A'+r0+' '+r0+' 0 0 0 '+p3+'Z'}
function buildWheel(){
  var h='<defs><pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#f2b84b"/><rect width="7" height="14" fill="#5b3f8c"/></pattern></defs>';
  for(var i=0;i<N;i++){
    var c=i*36, d=DIMS[i], pl=pol(118,c), pi=pol(176,c);
    h+='<g class="wedge" id="w'+i+'" role="button" tabindex="0" aria-label="'+d.n+'" data-i="'+i+'"><title>'+d.n+'</title>'+
      '<path class="shape" d="'+sector(84,222,c-17.2,c+17.2)+'"/>'+
      '<circle class="badge" cx="'+pl[0]+'" cy="'+pl[1]+'" r="22"/><text class="ltr" x="'+pl[0]+'" y="'+pl[1]+'">'+d.l+'</text>'+
      '<circle class="badge" cx="'+pi[0]+'" cy="'+pi[1]+'" r="21"/>'+
      '<g transform="translate('+(pi[0]-14)+' '+(pi[1]-14)+') scale(1.17)" class="ico">'+d.i+'</g></g>';
  }
  h+='<circle cx="250" cy="250" r="76" fill="#fff" stroke="#1d2433" stroke-width="2"/>'+
     '<text class="hub-n" id="hubn" x="250" y="258">0/10</text><text class="hub-t" x="250" y="282">reflected</text>';
  svg.innerHTML=h;
  svg.addEventListener('click',function(e){var g=e.target.closest('.wedge');if(g)pick(+g.dataset.i)});
  svg.addEventListener('keydown',function(e){var g=e.target.closest&&e.target.closest('.wedge');
    if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(+g.dataset.i)}});
}
function paint(){
  var done=0;
  for(var i=0;i<N;i++){var g=document.getElementById('w'+i);
    if(state[i]){g.setAttribute('data-st',state[i]);done++}else g.removeAttribute('data-st');
    g.classList.toggle('sel',i===cur && view==='dim');}
  if(cur>=0&&view==='dim'){var s=document.getElementById('w'+cur);s.parentNode.appendChild(s);
    var hub=svg.querySelectorAll('circle[r="76"],#hubn,.hub-t');hub.forEach(function(x){svg.appendChild(x)});}
  document.getElementById('hubn').textContent=done+'/'+N;
}
function pick(i){cur=i;view='dim';render()}
function nextUnrated(){for(var k=1;k<=N;k++){var j=(cur+k)%N;if(!state[j])return j}return -1}
function dots(){var h='<div class="dots" aria-hidden="true">';for(var i=0;i<N;i++)h+='<span class="dot '+(state[i]||'')+(i===cur&&view==='dim'?' cur':'')+'"></span>';return h+'</div>'}
function count(){return state.filter(Boolean).length}
function render(){
  paint();
  var h='';
  if(view==='intro'){
    h='<h2>Map your own identity</h2>'+
      '<p class="lead">Dr. Pamela Hays\u2019 ADDRESSING model names ten influences that shape who you are. Each one can bring privilege, disadvantage, or both.</p>'+
      '<p>Select a segment of the wheel, read how it can show up in therapy, then mark where you stand. Your wheel fills in as you go.</p>'+
      '<div class="row"><button class="btn" id="start">Start with Age</button></div>'+
      '<p class="note" style="margin-top:auto">This is a private reflection, not a test. Nothing you choose is saved or sent anywhere.</p>';
  } else if(view==='dim'){
    var d=DIMS[cur], s=state[cur], all=count()===N;
    h='<div class="dimhead"><div class="dimicon"><svg viewBox="0 0 24 24" aria-hidden="true">'+d.i+'</svg></div><div><h2>'+d.n+'</h2></div></div>'+
      '<p>'+d.d+'</p>'+
      '<div class="therapy"><b>In the therapy room: </b>'+d.t+'</div>'+
      '<p class="q">'+d.q+'</p>'+
      '<div class="rate" role="group" aria-label="Where do you stand on '+d.n+'?">'+
        ['adv','dis','both'].map(function(k){return '<button class="rbtn" data-k="'+k+'" aria-pressed="'+(s===k)+'"><span class="sw '+k+'"></span>'+LAB[k]+'</button>'}).join('')+'</div>'+
      '<div class="prog">'+dots()+'<span class="spacer"></span><button class="btn" id="next" '+(s?'':'disabled')+'>'+(all?'See my constellation':'Next dimension')+'</button></div>';
  } else {
    var g={adv:[],dis:[],both:[]};state.forEach(function(v,i){if(v)g[v].push(DIMS[i].n.toLowerCase())});
    function names(a){return '<span class="names">'+a.join(', ')+'</span>'}
    h='<h2>Your constellation</h2><div class="tally">'+['adv','dis','both'].map(function(k){return '<span class="chip"><span class="sw '+k+'"></span>'+g[k].length+' '+LAB[k].toLowerCase()+'</span>'}).join('')+'</div><div class="sum">'+
      (g.adv.length?'<p><b>Advantage:</b> '+names(g.adv)+'. Advantage often feels like \u201cjust how things are,\u201d so it is easy to miss in a client\u2019s story.</p>':'')+
      (g.dis.length?'<p style="margin-top:.35rem"><b>Disadvantage:</b> '+names(g.dis)+'. These experiences can build empathy, but they do not make you an expert on anyone else\u2019s.</p>':'')+
      (g.both.length?'<p style="margin-top:.35rem"><b>Both:</b> '+names(g.both)+'. Mixed identities are common, and context decides which side shows up.</p>':'')+
      '</div><div class="therapy">Take this into <b>Discussion 2</b>. Ephesians 4:32 invites kindness and compassion, and that starts with seeing your own position clearly.</div>'+
      '<div class="row" style="margin-top:auto"><button class="btn ghost" id="back">Back to wheel</button><button class="btn ghost" id="reset">Start over</button></div>';
  }
  panel.innerHTML=h;
  var b;
  if(b=panel.querySelector('#start'))b.onclick=function(){pick(0)};
  panel.querySelectorAll('.rbtn').forEach(function(x){x.onclick=function(){state[cur]=x.dataset.k;render();var n=panel.querySelector('#next');if(n)n.focus()}});
  if(b=panel.querySelector('#next'))b.onclick=function(){if(count()===N){view='sum';render()}else pick(nextUnrated())};
  if(b=panel.querySelector('#back'))b.onclick=function(){view='dim';render()};
  if(b=panel.querySelector('#reset'))b.onclick=function(){state=new Array(N).fill(null);cur=-1;view='intro';render()};
  window.fit&&window.fit();
}
buildWheel();render();
</script>
<script>
/* Keeps everything inside the iframe so only the Canvas page scrolls (no double scroll bar). */
(function(){
  var STEPS=[1,.95,.9,.85,.8,.75,.7,.66];
  var root=document.documentElement;
  function over(){
    var app=document.querySelector('.app'); if(!app) return false;
    var H=window.innerHeight,W=window.innerWidth;
    if(app.scrollHeight>app.clientHeight+1||app.scrollWidth>app.clientWidth+1) return true;
    var all=app.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var el=all[i],tag=el.tagName.toLowerCase();
      if(el.closest('svg')&&tag!=='svg') continue;
      var cs=getComputedStyle(el);
      if(cs.display==='none'||cs.display==='inline'||cs.position==='absolute'&&el.classList.contains('sr')) continue;
      var r=el.getBoundingClientRect(); if(!r.width&&!r.height) continue;
      if(r.bottom>H+1||r.right>W+1||r.left<-1) return true;
      if(tag!=='svg'&&el.clientHeight&&el.scrollHeight>el.clientHeight+1) return true;
      if(tag!=='svg'&&el.clientWidth&&el.scrollWidth>el.clientWidth+1) return true;
    }
    return false;
  }
  window.fit=function(){
    for(var i=0;i<STEPS.length;i++){root.style.setProperty('--s',STEPS[i]); if(!over()) return;}
  };
  var t; function later(){clearTimeout(t);t=setTimeout(window.fit,60)}
  window.addEventListener('resize',later);
  window.addEventListener('load',function(){window.fit();later()});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(window.fit);
})();

</script>
</body>
</html>
