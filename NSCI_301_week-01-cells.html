<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSCI 301 · Week 1 · Cell Explorer</title>
<style>:root{
  --crimson:#A5313A; --crimson-d:#7E2229; --crimson-l:#F6E4E5;
  --ink:#1E2B2F; --muted:#51636A; --paper:#F3F6F2; --card:#FFFFFF; --line:#D3DCD4;
  --leaf:#3D7A52; --leaf-l:#E2EFE5; --sky:#2F7FA3; --sky-l:#DDEEF5;
  --sun:#D99A1E; --sun-l:#FBF0D6; --lav:#6A5FA8; --lav-l:#E7E4F4;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:8px 14px 8px 16px;background:var(--card);border-bottom:1px solid var(--line);border-left:6px solid var(--crimson)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.wk{font-size:12px;font-weight:700;color:#fff;background:var(--crimson);border-radius:999px;padding:2px 10px;white-space:nowrap}
h1{font-family:var(--serif);font-size:20px;line-height:1.15;margin:0;font-weight:700}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font:600 13px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.tab:hover{background:var(--crimson-l)}
.tab[aria-selected="true"]{background:var(--crimson);border-color:var(--crimson);color:#fff}
:focus-visible{outline:3px solid #1B66D1;outline-offset:2px}
.stage{flex:1;min-height:0;padding:10px 12px 12px}
.panel{display:none;height:100%;gap:12px;grid-template-columns:minmax(0,1.35fr) minmax(270px,1fr)}
.panel.on{display:grid}
.art{position:relative;min-height:0;min-width:0;border-radius:14px;overflow:hidden;background-color:#fff;background-image:radial-gradient(#C9D6CC 1.2px,transparent 1.6px);background-size:22px 22px;border:1px solid var(--line)}
.art>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.info{min-height:0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.info h2{font-family:var(--serif);font-size:18px;margin:0;line-height:1.2}
.info h3{font-size:13px;margin:0;color:var(--crimson-d);font-weight:700}
.info p{margin:0}
.info ul{margin:0;padding-left:18px}
.info li{margin:2px 0}
.small{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--lav-l);color:#43397F;margin-right:4px}
.tag.g{background:var(--leaf-l);color:#25573A}.tag.s{background:var(--sky-l);color:#1B5875}.tag.c{background:var(--crimson-l);color:var(--crimson-d)}.tag.y{background:var(--sun-l);color:#7A5410}
.btn{font:600 13px var(--sans);border:1px solid var(--crimson);background:var(--crimson);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--crimson-d)}
.btn.ghost{background:#fff;color:var(--crimson-d)}
.btn.ghost:hover{background:var(--crimson-l)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{font:600 13px var(--sans);border:0;background:#fff;color:var(--ink);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.bar{height:8px;border-radius:99px;background:#E4EAE5;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf);transition:width .35s}
.hs{cursor:pointer}

.hs:hover{filter:brightness(1.06)}
.hs.sel{filter:drop-shadow(0 0 3px #A5313A) drop-shadow(0 0 5px #A5313A)}
svg text{font-family:var(--sans)}
.lbl{font-size:15px;font-weight:600;fill:#1E2B2F;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.lbl.s{font-size:13px}
.ctl{position:absolute;left:10px;top:10px;z-index:2}
.mcq{display:grid;gap:6px}
.opt{font:500 14px var(--sans);text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){background:var(--sun-l);border-color:var(--sun)}
.opt.right{background:var(--leaf-l);border-color:var(--leaf)}
.opt.wrong{background:var(--crimson-l);border-color:var(--crimson)}
.opt:disabled{cursor:default}
.fb{border-left:4px solid var(--leaf);background:var(--leaf-l);border-radius:6px;padding:6px 10px;font-size:14px}
.fb.warn{border-color:var(--sun);background:var(--sun-l)}
.fb.no{border-color:var(--crimson);background:var(--crimson-l)}
input[type=range]{width:100%;accent-color:var(--crimson)}
@media (max-width:860px){
  html,body{font-size:14px}
  .top{padding:6px 10px 6px 12px;gap:6px}
  h1{font-size:17px}
  .tab{padding:5px 9px;font-size:12.5px}
  .stage{padding:8px}
  .panel{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:8px}
  .info{padding:10px 12px;gap:6px}
  .info h2{font-size:16px}
  .hide-m{display:none!important}
  .lbl{font-size:18px}
  .lbl.s{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


.badge{position:absolute;left:12px;bottom:10px;z-index:2;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px;background:#fff;border:1px solid var(--line);color:var(--ink)}
.theory li{margin:3px 0}
.focus{position:absolute;right:12px;bottom:10px;z-index:2;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px;background:#fff;border:1px solid var(--line)}
</style></head>

<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
/* Tabs: click + arrow keys */
function initTabs(onChange){
  const tabs=$$('.tab'), panels=$$('.panel');
  function show(i,focus){
    tabs.forEach((t,j)=>{t.setAttribute('aria-selected',j===i);t.tabIndex=j===i?0:-1});
    panels.forEach((p,j)=>p.classList.toggle('on',j===i));
    if(focus)tabs[i].focus();
    if(onChange)onChange(i);
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>show(i));
    t.addEventListener('keydown',e=>{
      let n=null;
      if(e.key==='ArrowRight')n=(i+1)%tabs.length;
      if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;
      if(n!==null){e.preventDefault();show(n,true)}
    });
  });
  show(0);
  return show;
}
/* Make SVG groups keyboard-operable */
function activatable(root,handler){
  $$('.hs',root).forEach(g=>{
    g.setAttribute('tabindex','0');g.setAttribute('role','button');
    g.addEventListener('click',()=>handler(g));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handler(g)}});
  });
}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function lerp(a,b,t){return a+(b-a)*t}
function mixHex(a,b,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');
}
/* Simple multiple-choice quiz engine. cfg: {host, qs:[{q,opts:[],a:index,why}], onProgress(done,total,score), onDone} */
function quiz(cfg){
  const host=cfg.host;let i=0,score=0,done=false;
  function render(){
    if(i>=cfg.qs.length){
      done=true;host.innerHTML=`<h2>${score} of ${cfg.qs.length} correct</h2><p>${esc(cfg.finish(score))}</p><div class="row"><button class="btn" id="qr">Try again</button></div>`;
      $('#qr',host).onclick=()=>{i=0;score=0;done=false;cfg.onProgress(0,cfg.qs.length,0);render()};
      cfg.onProgress(cfg.qs.length,cfg.qs.length,score);return;
    }
    const q=cfg.qs[i];
    host.innerHTML=`<h3>Question ${i+1} of ${cfg.qs.length}</h3><p style="font-weight:600">${esc(q.q)}</p><div class="mcq">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="qf" aria-live="polite"></div>`;
    $$('.opt',host).forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=k===q.a;
      if(ok)score++;
      $$('.opt',host).forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('right')});
      if(!ok)b.classList.add('wrong');
      $('#qf',host).innerHTML=`<div class="fb ${ok?'':'no'}"><b>${ok?'Correct.':'Not quite.'}</b> ${esc(q.why)}</div><div class="row" style="margin-top:6px"><button class="btn" id="qn">${i+1<cfg.qs.length?'Next question':'See result'}</button></div>`;
      cfg.onProgress(i+1,cfg.qs.length,score);
      $('#qn',host).onclick=()=>{i++;render()};$('#qn',host).focus();
    });
  }
  cfg.onProgress(0,cfg.qs.length,0);render();
}

const PA={color:'#3FA796',pat:'spots',tail:'long',name:'Parent A'},PB={color:'#E3A72F',pat:'stripes',tail:'short',name:'Parent B'};
function critter(cx,cy,s,t){
  const dark=mixHex(t.color,'#000000',.3);
  const tail=t.tail==='long'?`<path d="M${cx+34*s} ${cy+6*s} C${cx+70*s} ${cy-4*s} ${cx+66*s} ${cy-42*s} ${cx+88*s} ${cy-38*s}" fill="none" stroke="${dark}" stroke-width="${5*s}" stroke-linecap="round"/>`:`<circle cx="${cx+40*s}" cy="${cy+4*s}" r="${7*s}" fill="${dark}"/>`;
  const pat=t.pat==='spots'?`<circle cx="${cx-14*s}" cy="${cy-8*s}" r="${5*s}" fill="${dark}"/><circle cx="${cx+8*s}" cy="${cy-14*s}" r="${4.5*s}" fill="${dark}"/><circle cx="${cx+14*s}" cy="${cy+6*s}" r="${5*s}" fill="${dark}"/>`:`<path d="M${cx-16*s} ${cy-18*s}V${cy+14*s}M${cx} ${cy-22*s}V${cy+18*s}M${cx+16*s} ${cy-18*s}V${cy+14*s}" stroke="${dark}" stroke-width="${6*s}" stroke-linecap="round"/>`;
  return `<g>${tail}<ellipse cx="${cx-14*s}" cy="${cy+30*s}" rx="${9*s}" ry="${5*s}" fill="${dark}"/><ellipse cx="${cx+14*s}" cy="${cy+30*s}" rx="${9*s}" ry="${5*s}" fill="${dark}"/><ellipse cx="${cx}" cy="${cy}" rx="${38*s}" ry="${30*s}" fill="${t.color}" stroke="${dark}" stroke-width="${3*s}"/>${pat}<circle cx="${cx-14*s}" cy="${cy-4*s}" r="${0}" fill="#fff"/><circle cx="${cx-22*s}" cy="${cy-24*s}" r="${6*s}" fill="#fff" stroke="${dark}" stroke-width="${1.5*s}"/><circle cx="${cx-3*s}" cy="${cy-26*s}" r="${6*s}" fill="#fff" stroke="${dark}" stroke-width="${1.5*s}"/><circle cx="${cx-21*s}" cy="${cy-23*s}" r="${2.6*s}" fill="#1E2B2F"/><circle cx="${cx-2*s}" cy="${cy-25*s}" r="${2.6*s}" fill="#1E2B2F"/></g>`;
}
let rmode='asexual',fert='external',kids=[];
function makeKids(){
  kids=[];
  for(let i=0;i<4;i++){
    kids.push(rmode==='asexual'?{...PA}:{color:pick([PA,PB]).color,pat:pick([PA,PB]).pat,tail:pick([PA,PB]).tail});

}
function drawRep(){
  const s=$('#repsvg');let h='';
  const xs=[105,235,365,495];
  if(rmode==='asexual'){
    h+=`<text x="300" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#1E2B2F">One parent</text>`;

  }else{
    h+=fert==='external'?`<rect x="20" y="196" width="560" height="74" rx="14" fill="#DDEEF5"/><g fill="#fff" opacity=".8"><circle cx="60" cy="214" r="5"/><circle cx="130" cy="250" r="4"/><circle cx="480" cy="220" r="5"/><circle cx="540" cy="252" r="4"/></g>`:`<ellipse cx="300" cy="226" rx="120" ry="42" fill="#F6E4E5" stroke="#B5555B" stroke-width="3" stroke-dasharray="6 5"/>`;
    h+=`<text x="150" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#1E2B2F">Parent A</text><text x="450" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#1E2B2F">Parent B</text>`;
    h+=critter(130,115,1.15,PA)+critter(430,115,1.15,PB);
    h+=`<path d="M170 170 Q250 190 288 218" fill="none" stroke="#51636A" stroke-width="3" stroke-dasharray="5 4"/><path d="M430 170 Q350 190 312 218" fill="none" stroke="#51636A" stroke-width="3" stroke-dasharray="5 4"/>`;

}
function renderRep(){

  const host=$('#repinfo');

  host.innerHTML=`<h2>${asex?'Asexual reproduction':'Sexual reproduction'}</h2>

  ${asex?'':`<div class="row"><div class="seg" role="group" aria-label="Fertilization"><button data-f="external" aria-pressed="${fert==='external'}">External</button><button data-f="internal" aria-pressed="${fert==='internal'}">Internal</button></div></div><p class="small">${fert==='external'?'Eggs and sperm meet outside the body, usually in water. Examples: many fish and frogs.':'Eggs and sperm meet inside the body of one parent. Examples: mammals, birds and reptiles.'}</p>`}
  <div class="fb" style="${looks>1?'':'background:var(--sun-l);border-color:var(--sun)'}"><b>${looks} different ${looks===1?'look':'looks'}</b> among the 4 offspring.<br>${asex?'Clones: no new variation.':'Mixing traits creates variation.'}</div>
