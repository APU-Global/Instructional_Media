 const d=done[cur];$('#fb').innerHTML=d===undefined?'':'<div class="fb '+(d===e.a?'ok':'no')+'">'+(d===e.a?'':'Not quite. ')+e.ex+'</div>';
 $('#prev').disabled=cur===0;$('#next').disabled=cur===EV.length-1;
 const right=Object.keys(done).filter(k=>done[k]===EV[k].a).length;
 $('#prog').textContent='Explored '+seen.size+'/'+EV.length+' · Correct '+right+'/'+EV.length;
 postH();
}
function persp(){const e=EV[cur],p=$('#persp');p.className='persp'+(view==='L'?' loy':'');
 p.innerHTML='<b>'+(view==='P'?'Patriot view':'Loyalist view')+'</b>'+(view==='P'?e.pat:e.loy);
 $('#bP').setAttribute('aria-pressed',view==='P');$('#bL').setAttribute('aria-pressed',view==='L')}
$('#bP').onclick=()=>{view='P';persp()};$('#bL').onclick=()=>{view='L';persp()};
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
render();
