<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSCI 301 · Week 5 · Energy and Matter in Ecosystems</title>
<style>:root{
  --crimson:#A5313A; --crimson-d:#7E2229; --crimson-l:#F6E4E5;
  --ink:#1E2B2F; --muted:#51636A; --paper:#F3F6F2; --card:#FFFFFF; --line:#D3DCD4;
  --leaf:#3D7A52; --leaf-l:#E2EFE5; --sky:#2F7FA3; --sky-l:#DDEEF5;
  --sun:#D99A1E; --sun-l:#FBF0D6; --lav:#6A5FA8; --lav-l:#E7E4F4;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:8px 14px 8px 16px;background:var(--card);border-bottom:1px solid var(--line);border-left:6px solid var(--crimson)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.wk{font-size:12px;font-weight:700;color:#fff;background:var(--crimson);border-radius:999px;padding:2px 10px;white-space:nowrap}
h1{font-family:var(--serif);font-size:20px;line-height:1.15;margin:0;font-weight:700}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font:600 13px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.tab:hover{background:var(--crimson-l)}
.tab[aria-selected="true"]{background:var(--crimson);border-color:var(--crimson);color:#fff}
:focus-visible{outline:3px solid #1B66D1;outline-offset:2px}
.stage{flex:1;min-height:0;padding:10px 12px 12px}
.panel{display:none;height:100%;gap:12px;grid-template-columns:minmax(0,1.35fr) minmax(270px,1fr)}
.panel.on{display:grid}
.art{position:relative;min-height:0;min-width:0;border-radius:14px;overflow:hidden;background-color:#fff;background-image:radial-gradient(#C9D6CC 1.2px,transparent 1.6px);background-size:22px 22px;border:1px solid var(--line)}
.art>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.info{min-height:0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.info h2{font-family:var(--serif);font-size:18px;margin:0;line-height:1.2}
.info h3{font-size:13px;margin:0;color:var(--crimson-d);font-weight:700}
.info p{margin:0}
.info ul{margin:0;padding-left:18px}
.info li{margin:2px 0}
.small{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--lav-l);color:#43397F;margin-right:4px}
.tag.g{background:var(--leaf-l);color:#25573A}.tag.s{background:var(--sky-l);color:#1B5875}.tag.c{background:var(--crimson-l);color:var(--crimson-d)}.tag.y{background:var(--sun-l);color:#7A5410}
.btn{font:600 13px var(--sans);border:1px solid var(--crimson);background:var(--crimson);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--crimson-d)}
.btn.ghost{background:#fff;color:var(--crimson-d)}
.btn.ghost:hover{background:var(--crimson-l)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{font:600 13px var(--sans);border:0;background:#fff;color:var(--ink);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.bar{height:8px;border-radius:99px;background:#E4EAE5;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf);transition:width .35s}
.hs{cursor:pointer}

.hs:hover{filter:brightness(1.06)}
.hs.sel{filter:drop-shadow(0 0 3px #A5313A) drop-shadow(0 0 5px #A5313A)}
svg text{font-family:var(--sans)}
.lbl{font-size:15px;font-weight:600;fill:#1E2B2F;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.lbl.s{font-size:13px}
.ctl{position:absolute;left:10px;top:10px;z-index:2}
.mcq{display:grid;gap:6px}
.opt{font:500 14px var(--sans);text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){background:var(--sun-l);border-color:var(--sun)}
.opt.right{background:var(--leaf-l);border-color:var(--leaf)}
.opt.wrong{background:var(--crimson-l);border-color:var(--crimson)}
.opt:disabled{cursor:default}
.fb{border-left:4px solid var(--leaf);background:var(--leaf-l);border-radius:6px;padding:6px 10px;font-size:14px}
.fb.warn{border-color:var(--sun);background:var(--sun-l)}
.fb.no{border-color:var(--crimson);background:var(--crimson-l)}
input[type=range]{width:100%;accent-color:var(--crimson)}
@media (max-width:860px){
  html,body{font-size:14px}
  .top{padding:6px 10px 6px 12px;gap:6px}

  .stage{padding:8px}
  .panel{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:8px}
  .info{padding:10px 12px;gap:6px}
  .info h2{font-size:16px}
  .hide-m{display:none!important}
  .lbl{font-size:18px}
  .lbl.s{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


.nd{cursor:pointer}
.legend{position:absolute;left:12px;bottom:8px;right:12px;z-index:2;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.stat{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--crimson-d);line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:14px}
.kv b{color:var(--crimson-d)}

<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
/* Tabs: click + arrow keys */
function initTabs(onChange){
  const tabs=$$('.tab'), panels=$$('.panel');
  function show(i,focus){
    tabs.forEach((t,j)=>{t.setAttribute('aria-selected',j===i);t.tabIndex=j===i?0:-1});
    panels.forEach((p,j)=>p.classList.toggle('on',j===i));
    if(focus)tabs[i].focus();
    if(onChange)onChange(i);
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>show(i));
    t.addEventListener('keydown',e=>{
      let n=null;
      if(e.key==='ArrowRight')n=(i+1)%tabs.length;
      if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;
      if(n!==null){e.preventDefault();show(n,true)}
    });
  });
  show(0);
  return show;
}
/* Make SVG groups keyboard-operable */
function activatable(root,handler){
  $$('.hs',root).forEach(g=>{
    g.setAttribute('tabindex','0');g.setAttribute('role','button');
    g.addEventListener('click',()=>handler(g));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handler(g)}});
  });
}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function lerp(a,b,t){return a+(b-a)*t}
function mixHex(a,b,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');
}
/* Simple multiple-choice quiz engine. cfg: {host, qs:[{q,opts:[],a:index,why}], onProgress(done,total,score), onDone} */
function quiz(cfg){
  const host=cfg.host;let i=0,score=0,done=false;
  function render(){
    if(i>=cfg.qs.length){
      done=true;host.innerHTML=`<h2>${score} of ${cfg.qs.length} correct</h2><p>${esc(cfg.finish(score))}</p><div class="row"><button class="btn" id="qr">Try again</button></div>`;
      $('#qr',host).onclick=()=>{i=0;score=0;done=false;cfg.onProgress(0,cfg.qs.length,0);render()};
      cfg.onProgress(cfg.qs.length,cfg.qs.length,score);return;
    }
    const q=cfg.qs[i];
    host.innerHTML=`<h3>Question ${i+1} of ${cfg.qs.length}</h3><p style="font-weight:600">${esc(q.q)}</p><div class="mcq">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="qf" aria-live="polite"></div>`;
    $$('.opt',host).forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=k===q.a;
      if(ok)score++;
      $$('.opt',host).forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('right')});
      if(!ok)b.classList.add('wrong');
      $('#qf',host).innerHTML=`<div class="fb ${ok?'':'no'}"><b>${ok?'Correct.':'Not quite.'}</b> ${esc(q.why)}</div><div class="row" style="margin-top:6px"><button class="btn" id="qn">${i+1<cfg.qs.length?'Next question':'See result'}</button></div>`;
      cfg.onProgress(i+1,cfg.qs.length,score);
      $('#qn',host).onclick=()=>{i++;render()};$('#qn',host).focus();
    });
  }
  cfg.onProgress(0,cfg.qs.length,0);render();
}

initTabs();

/* ---------- Food web ---------- */
const ORGS={
 grass:{n:'Grass',x:150,y:352,ic:'grass',role:'Producer',t:'Captures light energy through photosynthesis and forms the base of the web.'},
 flower:{n:'Wildflowers',x:400,y:352,ic:'flower',role:'Producer',t:'Another producer. Its nectar, leaves and seeds feed many consumers.'},
 hopper:{n:'Grasshopper',x:70,y:252,ic:'hopper',role:'Primary consumer',t:'An herbivore that eats plants and is food for frogs.'},
 rabbit:{n:'Rabbit',x:250,y:252,ic:'rabbit',role:'Primary consumer',t:'An herbivore that eats plants and is hunted by foxes and hawks.'},
 mouse:{n:'Mouse',x:420,y:252,ic:'mouse',role:'Primary consumer',t:'Eats plants and seeds, and is prey for snakes, foxes and hawks.'},
 frog:{n:'Frog',x:70,y:152,ic:'frog',role:'Secondary consumer',t:'Eats insects such as grasshoppers and is eaten by snakes.'},
 snake:{n:'Snake',x:225,y:152,ic:'snake',role:'Secondary and tertiary consumer',t:'Eats mice and frogs, so it feeds at more than one level.'},
 fox:{n:'Fox',x:415,y:152,ic:'fox',role:'Secondary consumer',t:'A carnivore that hunts rabbits and mice.'},
 hawk:{n:'Hawk',x:320,y:58,ic:'hawk',role:'Top predator',t:'Eats snakes, mice and rabbits. Few hawks can be supported because little energy reaches the top.'},
 decomp:{n:'Decomposers',x:560,y:352,ic:'mush',role:'Decomposers (fungi and bacteria)',t:'Break down dead organisms and wastes, returning nutrients to the soil for producers.'}
};
const EDGES=[['grass','hopper'],['grass','rabbit'],['grass','mouse'],['flower','hopper'],['flower','rabbit'],['flower','mouse'],['hopper','frog'],['frog','snake'],['mouse','snake'],['mouse','fox'],['rabbit','fox'],['snake','hawk'],['mouse','hawk'],['rabbit','hawk']];
const PROD=['grass','flower'];
const eats=id=>EDGES.filter(e=>e[1]===id).map(e=>e[0]);
const eatenBy=id=>EDGES.filter(e=>e[0]===id).map(e=>e[1]);
let wsel=null,removed=new Set(),msg='';
function impacts(){
  const risk=new Set(),stress=new Set(),boom=new Set();
  Object.keys(ORGS).forEach(id=>{
    if(id==='decomp'||removed.has(id))return;
    const prey=eats(id);
    if(prey.length){const gone=prey.filter(p=>removed.has(p)).length;if(gone===prey.length)risk.add(id);else if(gone)stress.add(id)}
    const pred=eatenBy(id);
    if(pred.length&&pred.every(p=>removed.has(p)))boom.add(id);
  });
  if(removed.has('decomp'))PROD.forEach(p=>{if(!removed.has(p))stress.add(p)});
  return{risk,stress,boom};
}
function drawWeb(){
  const imp=impacts();let e='',n='';
  const inSel=id=>wsel&&(id===wsel||eats(wsel).includes(id)||eatenBy(wsel).includes(id));
  EDGES.forEach(([a,b])=>{
    const A=ORGS[a],B=ORGS[b];const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
    const hot=wsel&&(a===wsel||b===wsel);
    const dead=removed.has(a)||removed.has(b);
    e+=`<line x1="${A.x+ux*35}" y1="${A.y+uy*35}" x2="${B.x-ux*40}" y2="${B.y-uy*40}" stroke="${hot?'#A5313A':'#8FA095'}" stroke-width="${hot?4:2.5}" opacity="${dead?.12:(wsel&&!hot?.28:.9)}" marker-end="url(#${hot?'arrR':'arr'})"/>`;
  });
  let x='';
  x+=`<g><circle cx="275" cy="352" r="22" fill="#F6C945" stroke="#D99A1E" stroke-width="3"/><g stroke="#D99A1E" stroke-width="3" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${275+28*Math.cos(r)}" y1="${352+28*Math.sin(r)}" x2="${275+36*Math.cos(r)}" y2="${352+36*Math.sin(r)}"/>`}).join('')}</g><text x="275" y="406" text-anchor="middle" class="lbl s">Sunlight</text></g>`;
  x+=`<line x1="238" y1="352" x2="190" y2="352" stroke="#E3A72F" stroke-width="5" marker-end="url(#arrY)"/><line x1="312" y1="352" x2="360" y2="352" stroke="#E3A72F" stroke-width="5" marker-end="url(#arrY)"/>`;
  x+=`<line x1="522" y1="352" x2="444" y2="352" stroke="#9A7B4F" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrB)"/><text x="482" y="342" text-anchor="middle" font-size="12" fill="#6F5936">nutrients</text>`;
  $('#webextra').innerHTML=x;
  Object.keys(ORGS).forEach(id=>{
    const o=ORGS[id];const gone=removed.has(id);
    let ring='#C5D1C7',w=3,badge='';
    if(imp.risk.has(id)){ring='#A5313A';w=6}
    else if(imp.stress.has(id)){ring='#D99A1E';w=6}
    else if(imp.boom.has(id)){ring='#2F7FA3';w=6;badge=`<path d="M22 -30 l8 -10 l8 10z" fill="#2F7FA3"/>`}
    if(wsel===id)w=7,ring=gone?ring:'#1E2B2F';
    const dim=wsel&&!inSel(id)&&!gone;
    n+=`<g class="hs nd" data-id="${id}" transform="translate(${o.x} ${o.y})" opacity="${gone?.35:(dim?.5:1)}" aria-label="${o.n}${gone?' (removed)':''}"><circle class="hl" r="34" fill="${gone?'#E3E8E4':'#fff'}" stroke="${ring}" stroke-width="${w}"/><use href="#i-${o.ic}" x="-25" y="-25" width="50" height="50" ${gone?'style="filter:grayscale(1)"':''}/>${gone?'<path d="M-20 -20 L20 20 M20 -20 L-20 20" stroke="#A5313A" stroke-width="5" stroke-linecap="round"/>':''}<text y="54" text-anchor="middle" class="lbl s">${o.n}</text>${badge}</g>`;
  });
  $('#webedges').innerHTML=e;$('#webnodes').innerHTML=n;
  activatable($('#webnodes'),g=>{wsel=g.dataset.id;msg='';drawWeb();renderWeb();});
}
function names(set){return [...set].map(i=>ORGS[i].n).join(', ')}
function cascade(){
  let lost=0;
  for(let k=0;k<8;k++){const r=[...impacts().risk];if(!r.length)break;r.forEach(i=>removed.add(i));lost+=r.length}
  msg=lost?`Chain reaction: ${lost} more ${lost>1?'species were':'species was'} lost because their food ran out.`:'No further species are at risk right now.';
}
function renderWeb(){
  const imp=impacts(),host=$('#webinfo');
  let top;
  if(!wsel){
    top=`<h2>Grassland food web</h2><p>Select an organism to see what it eats and what eats it. Then remove it to see how a disturbance spreads.</p>`;
  }else{
    const o=ORGS[wsel],gone=removed.has(wsel);
    const food=wsel==='decomp'?'Dead organisms and wastes':(eats(wsel).length?eats(wsel).map(i=>ORGS[i].n).join(', '):'Sunlight (photosynthesis)');
    const by=eatenBy(wsel).length?eatenBy(wsel).map(i=>ORGS[i].n).join(', '):(wsel==='decomp'?'None. They recycle nutrients':'Nothing in this web');
    top=`<div><span class="tag g">${o.role}</span></div><h2>${o.n}</h2><p>${o.t}</p><div class="kv"><b>Gets energy from</b><span>${food}</span><b>Eaten by</b><span>${by}</span></div>`;
  }
  let eff='';
  if(removed.size){
    const parts=[];
    if(imp.risk.size)parts.push(`<b style="color:#A5313A">At risk:</b> ${names(imp.risk)}`);
    if(imp.stress.size)parts.push(`<b style="color:#9A6B10">Stressed:</b> ${names(imp.stress)}`);
    if(imp.boom.size)parts.push(`<b style="color:#2F7FA3">May increase:</b> ${names(imp.boom)}`);
    eff=`<div class="fb ${imp.risk.size?'no':(imp.stress.size?'warn':'')}">${parts.join('<br>')||'No other species affected yet.'}</div>`;
  }
  const rm=wsel?`<button class="btn" id="rmb">${removed.has(wsel)?'Restore '+ORGS[wsel].n:'Remove '+ORGS[wsel].n}</button>`:'';
  host.innerHTML=top+eff+(msg?`<p class="small">${msg}</p>`:'')+`<div class="row">${rm}${imp.risk.size?'<button class="btn ghost" id="casc">Let it play out</button>':''}${removed.size?'<button class="btn ghost" id="rsb">Reset web</button>':''}</div>`+(removed.size?'':`<p class="small">Disturbing one part of an ecosystem often affects other parts in ways people do not expect.</p>`);
  if($('#rmb'))$('#rmb').onclick=()=>{removed.has(wsel)?removed.delete(wsel):removed.add(wsel);msg='';drawWeb();renderWeb()};
  if($('#casc'))$('#casc').onclick=()=>{cascade();drawWeb();renderWeb()};
  if($('#rsb'))$('#rsb').onclick=()=>{removed=new Set();msg='';drawWeb();renderWeb()};
}
drawWeb();renderWeb();

/* ---------- Energy pyramid ---------- */
let E0=10000,eff=10;
const LV5=[{n:'Producers',ic:'grass',c:'#5BA646'},{n:'Primary consumers',ic:'hopper',c:'#A9C94A'},{n:'Secondary consumers',ic:'frog',c:'#E3A72F'},{n:'Tertiary consumers',ic:'snake',c:'#D9733A'}];
const fmt=v=>v>=100?Math.round(v).toLocaleString('en-US'):(v>=10?v.toFixed(0):v.toFixed(1));
function drawPyr(){
  const E=LV5.map((_,i)=>E0*Math.pow(eff/100,i));
  const wb=[400,300,200,100],wt=[300,200,100,0],H=88,cx=250;let h='';
  LV5.forEach((l,i)=>{
    const yb=420-i*(H+4),yt=yb-H,mid=(yb+yt)/2;
    h+=`<path d="M${cx-wb[i]/2} ${yb} L${cx+wb[i]/2} ${yb} L${cx+wt[i]/2} ${yt} L${cx-wt[i]/2} ${yt}Z" fill="${l.c}" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>`;
    const isz=i===3?34:50,icy=yb-H*(i===3?.36:.46);h+=`<circle cx="${cx}" cy="${icy}" r="${isz/2+5}" fill="#fff" opacity=".85"/><use href="#i-${l.ic}" x="${cx-isz/2}" y="${icy-isz/2}" width="${isz}" height="${isz}"/>`;
    const rx=cx+(wb[i]+wt[i])/4+8,ry=mid;
    h+=`<path d="M${rx} ${ry} H462" stroke="#9FB0A5" stroke-width="2" stroke-dasharray="3 4"/>`;
    h+=`<text x="470" y="${ry-3}" font-size="15" font-weight="700" fill="#1E2B2F">${l.n}</text><text x="470" y="${ry+18}" font-size="17" font-weight="800" fill="#7E2229">${fmt(E[i])} kcal</text>`;
    const lx=cx-(wb[i]+wt[i])/4-8;
    h+=`<path d="M${lx} ${ry+4} q-14 -4 -16 -20 q-2 -10 -14 -16" fill="none" stroke="#A5313A" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/><text x="${lx-34}" y="${ry-28}" text-anchor="end" font-size="12" font-weight="600" fill="#7E2229">heat</text>`;
  });
  h+=`<text x="330" y="458" text-anchor="middle" font-size="13" fill="#51636A">Each level keeps about ${eff}% of the energy below it. The rest is lost, mainly as heat.</text>`;
  $('#pyrsvg').innerHTML=h;
  const top=E[3],loss=100-(Math.pow(eff/100,3)*100);
  $('#pyrout').innerHTML=`<div class="kv"><b>Reaches the top level</b><span>${fmt(top)} kcal</span><b>Lost on the way</b><span>${loss.toFixed(loss>99.9?2:1)}%</span></div><p>It takes <b>${fmt(E0)} kcal</b> of producers to support only <b>${fmt(top)} kcal</b> of tertiary consumers. This is why top predators are rare.</p>`;
}
(function(){
  $('#pyrinfo').innerHTML=`<h2>Energy flows one way</h2><p>Producers capture light energy. At each step up, only a fraction passes to the next trophic level.</p>
  <label class="small" for="e0">Energy stored by producers: <b id="e0v"></b> kcal</label><input type="range" id="e0" min="1000" max="100000" step="1000" value="${E0}">
  <label class="small" for="ef">Share passed to the next level: <b id="efv"></b>%</label><input type="range" id="ef" min="5" max="20" step="1" value="${eff}">
  <div id="pyrout"></div>`;
  const upd=()=>{E0=+$('#e0').value;eff=+$('#ef').value;$('#e0v').textContent=E0.toLocaleString('en-US');$('#efv').textContent=eff;drawPyr()};
  $('#e0').oninput=upd;$('#ef').oninput=upd;upd();
})();

/* ---------- Cycles ---------- */
const CY={
 water:{n:'Water cycle',c:'#2F7FA3',nodes:[
  {n:'Oceans, lakes & rivers',d:'Most of Earth’s water is stored here.'},
  {n:'Evaporation & transpiration',d:'The sun’s heat turns liquid water into vapor. Plants also release vapor through their leaves (transpiration).'},
  {n:'Condensation (clouds)',d:'Water vapor cools and forms tiny droplets, which gather as clouds.'},
  {n:'Precipitation',d:'Rain, snow, sleet or hail returns water to Earth’s surface.'},
  {n:'Runoff & groundwater',d:'Water flows over land or soaks into the ground and moves back toward the sea.',h:'Pavement and removing vegetation increase runoff, and pumping groundwater faster than it refills disrupts this stage.'}]},
 carbon:{n:'Carbon cycle',c:'#4E7D5B',nodes:[
  {n:'Atmosphere (CO₂)',d:'Carbon dioxide gas holds carbon in the air.'},
  {n:'Producers',d:'Plants and algae use photosynthesis to turn CO₂ into sugars.'},
  {n:'Consumers',d:'Animals get carbon by eating producers or other animals, and release CO₂ by respiration.'},
  {n:'Decomposers',d:'Break down dead matter and return CO₂ to the air. Buried remains can slowly become fossil fuels.'},
  {n:'Fossil fuels',d:'Carbon stored underground for millions of years as coal, oil and natural gas.'},
  {n:'Burning (combustion)',d:'Burning releases stored carbon as CO₂.',h:'Burning fossil fuels releases carbon much faster than natural processes remove it.'}]},
 nitrogen:{n:'Nitrogen cycle',c:'#6A5FA8',nodes:[
  {n:'Atmosphere (N₂)',d:'About 78% of air is nitrogen gas, but most organisms cannot use it directly.'},
  {n:'Nitrogen-fixing bacteria',d:'Convert N₂ into forms plants can use. Many live in the root nodules of legumes.'},
  {n:'Soil nitrogen',d:'Ammonium and nitrate in soil are forms that plants can absorb.',h:'Fertilizer adds extra nitrate. Runoff can fuel algal blooms in waterways.'},
  {n:'Plants & animals',d:'Plants use nitrogen to build proteins, and animals get it by eating.'},
  {n:'Decomposers',d:'Break down wastes and dead matter, returning nitrogen to the soil.'},
  {n:'Denitrifying bacteria',d:'Convert nitrate back into N₂ gas, which returns to the atmosphere.'}]},
 phosphorus:{n:'Phosphorus cycle',c:'#C4733A',nodes:[
  {n:'Rocks',d:'Phosphorus is stored in rocks as phosphate. There is no gas stage in this cycle.'},
  {n:'Weathering & erosion',d:'Rain slowly wears rock away, releasing phosphate into soil and water.'},
  {n:'Soil & water',d:'Dissolved phosphate that producers can absorb.',h:'Fertilizer and detergent runoff add extra phosphate, which can cause algal blooms.'},
  {n:'Plants',d:'Producers absorb phosphate and use it to build important molecules.'},
  {n:'Animals',d:'Animals get phosphorus by eating plants and other animals.'},
  {n:'Decomposers & sediments',d:'Remains and wastes return phosphate to soil and water. Some settles into sediment that may eventually form rock again.'}]}
};
let cyc='water',cn=0,human=false,timer=null,playing=false;
function cpos(i,n){const a=-Math.PI/2+i*2*Math.PI/n;return[300+205*Math.cos(a),255+170*Math.sin(a),a]}
function drawCyc(){
  const C=CY[cyc],n=C.nodes.length;let h=`<defs><marker id="arr3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${C.c}"/></marker></defs>`;
  for(let i=0;i<n;i++){
    const a0=-Math.PI/2+i*2*Math.PI/n,a1=-Math.PI/2+(i+1)*2*Math.PI/n,am=(a0+a1)/2;
    const p0=[300+205*Math.cos(a0),255+170*Math.sin(a0)],p1=[300+205*Math.cos(a1),255+170*Math.sin(a1)];
    h+=`<path d="M${p0[0]} ${p0[1]} A205 170 0 0 1 ${p1[0]} ${p1[1]}" fill="none" stroke="${C.c}" stroke-width="4" opacity=".45"/>`;
    const mx=300+205*Math.cos(am),my=255+170*Math.sin(am);const tx=-205*Math.sin(am),ty=170*Math.cos(am);const ang=Math.atan2(ty,tx)*180/Math.PI;
    h+=`<path d="M-9 -8 L9 0 L-9 8Z" fill="${C.c}" transform="translate(${mx} ${my}) rotate(${ang})"/>`;
  }
  h+=`<text x="300" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="${C.c}" style="font-family:var(--serif)">${C.n}</text><text x="300" y="272" text-anchor="middle" font-size="13" fill="#51636A">Select a stage or follow the cycle</text>`;
  C.nodes.forEach((nd,i)=>{
    const [x,y]=cpos(i,n);const sel=i===cn,hi=human&&nd.h;
    h+=`<g class="hs nd" data-i="${i}" transform="translate(${x} ${y})" aria-label="${esc(nd.n)}"><rect class="hl" x="-92" y="-23" width="184" height="46" rx="23" fill="${sel?C.c:'#fff'}" stroke="${hi?'#A5313A':C.c}" stroke-width="${hi?6:3}"/><text y="5" text-anchor="middle" font-size="13.5" font-weight="700" fill="${sel?'#fff':'#1E2B2F'}" style="pointer-events:none">${esc(nd.n.length>22?nd.n.replace(' & ',' &\u2009'):nd.n)}</text></g>`;
  });
  const [px,py]=cpos(cn,n);
  h+=`<circle id="dot" r="9" fill="#F6C945" stroke="#7A5410" stroke-width="3" style="transform:translate(${px}px,${py - 36}px);transition:transform .8s ease" pointer-events="none"/>`;
  $('#cycsvg').innerHTML=h;
  activatable($('#cycsvg'),g=>{stop();cn=+g.dataset.i;drawCyc();renderCyc()});
}
function renderCyc(){
  const C=CY[cyc],nd=C.nodes[cn];
  $('#cycinfo').innerHTML=`<div><span class="tag" style="background:${C.c};color:#fff">${C.n}</span></div><h2>${esc(nd.n)}</h2><p>${esc(nd.d)}</p>
  ${human?`<div class="fb ${nd.h?'no':''}">${nd.h?'<b>Human impact:</b> '+esc(nd.h):'No major human impact is highlighted at this stage. Look for the red outline.'}</div>`:''}
  <p class="small">Unlike energy, matter is recycled through living and nonliving parts of ecosystems.</p>
  <div class="row"><button class="btn" id="play">${playing?'Pause':'Follow the cycle'}</button><button class="btn ghost" id="hum" aria-pressed="${human}">${human?'Hide':'Show'} human impact</button></div>`;
  $('#play').onclick=()=>{playing?stop():start()};
  $('#hum').onclick=()=>{human=!human;drawCyc();renderCyc()};
}
function step(){cn=(cn+1)%CY[cyc].nodes.length;drawCyc();renderCyc();}
function start(){playing=true;renderCyc();timer=setInterval(step,2600)}
function stop(){playing=false;clearInterval(timer);if($('#play'))renderCyc()}
$$('#cycsel button').forEach(b=>b.onclick=()=>{stop();cyc=b.dataset.c;cn=0;$$('#cycsel button').forEach(x=>x.setAttribute('aria-pressed',x===b));drawCyc();renderCyc()});
drawCyc();renderCyc();
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
</script></body></html>
