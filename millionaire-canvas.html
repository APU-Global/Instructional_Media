<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Wants to Be a Millionaire: Signature Assignment Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0f3c;color:#fff;font-family:Georgia,'Times New Roman',serif}
.wrap{max-width:960px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 190px;gap:16px}
@media(max-width:700px){.wrap{grid-template-columns:1fr}.ladder{order:-1;flex-direction:row!important;overflow-x:auto}.ladder div{flex:0 0 auto}}
h1{font-size:1.4rem;color:#ffc83d;margin:0 0 4px;text-align:center;grid-column:1/-1}
.sub{text-align:center;color:#aeb6ff;grid-column:1/-1;margin:0}
.card{background:#141b5e;border:2px solid #ffc83d;border-radius:18px;padding:18px}
.part{color:#ffc83d;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
h2{margin:6px 0 4px;font-size:1.25rem}
.prize{font-size:1.6rem;color:#ffc83d;font-weight:bold}
label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:8px 0;border:1px solid #3b46b5;border-radius:14px;cursor:pointer;background:#0d1450}
label:hover{border-color:#ffc83d}
label.dim{opacity:.3}
input[type=checkbox]{margin-top:4px;width:18px;height:18px;flex:none}
button{font:inherit;background:#ffc83d;color:#1a1a1a;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:bold;margin:4px 4px 0 0}
button.ghost{background:transparent;color:#ffc83d;border:1px solid #ffc83d}
button:disabled{opacity:.35;cursor:not-allowed}
.lifelines{margin:12px 0}
.msg{margin-top:12px;padding:12px;border-radius:12px;background:#0d1450;border-left:5px solid #ffc83d}
.msg.ok{border-color:#2ecc71}.msg.mid{border-color:#f39c12}.msg.bad{border-color:#e74c3c}
textarea{width:100%;min-height:120px;background:#0d1450;color:#fff;border:1px solid #ffc83d;border-radius:12px;padding:10px;font:inherit;font-size:.9rem}
.ladder{display:flex;flex-direction:column-reverse;gap:4px}
.ladder div{padding:6px 10px;border-radius:8px;font-size:.9rem;color:#ffc83d;background:#0d1450;display:flex;justify-content:space-between;gap:8px}
.ladder .safe{color:#fff}
.ladder .cur{background:#ffc83d;color:#111;font-weight:bold}
.ladder .done{background:#1f7a46;color:#fff}
.ladder .miss{background:#7a3b1f;color:#fff}
.rain{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.big{font-size:2.2rem;color:#ffc83d;text-align:center}
.cut{padding:10px 12px;margin:8px 0;border:1px dashed #5a63c9;border-radius:14px;color:#8d96e8;text-decoration:line-through;font-size:.9rem}
.modal{position:fixed;inset:0;background:rgba(0,0,10,.8);display:none;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:20}
.modal.open{display:flex}
.modal .card{max-width:640px;width:100%}
.topbtn{grid-column:1/-1;text-align:center}
</style></head><body>
<div class="wrap">
<h1>💰 Who Wants to Be a Millionaire? 💰</h1>
<p class="sub">Signature Assignment Edition · Parts A, B &amp; C · 35 points</p>
<div class="topbtn"><button class="ghost" data-act="help">📖 Instructions</button></div>
<main id="main"></main>
<aside class="ladder" id="ladder"></aside>
</div>
<div class="modal" id="modal"><div class="card" id="helpbox"></div></div>
<script>
(function(){
var PRIZES=[500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
var SAFE=[1,6];
var Q=[
["Part A · Foundation","Grade, Topic & Standards",2,["I named a specific grade level and a History/Social Science topic","I listed grade-appropriate ELA standards","I listed History/Social Science standards","I listed VAPA standards"],"Missing one of the three domains (ELA, HSS, VAPA) drops you to half credit."],
["Part A · Foundation","The Text Set (3–5 Resources)",2,["I chose 3 to 5 distinct resources","Informational, Motivational AND Multimodal types are all included (textbook pp. 126–127)","I explained how each resource builds content knowledge","I explained how each resource builds literacy development"],"Explanations that only talk about content, not literacy, earn half credit."],
["Part A · Foundation","Vocabulary Focus & Rationale",2,["I selected 4 to 6 high-impact words","I justified them with cross-curricular (Tier 2/3) utility","I discussed Greek/Latin word parts (morphology)"],"Use root words to show morphology thinking."],
["Part A · Foundation","Vocabulary Activity Exemplar",2,["I designed a graphic organizer (e.g., Frayer Model)","I filled out ONE completed, high-quality student model","The exemplar matches my chosen vocabulary strategy"],"A blank template described in words is only half credit. Fill it in!"],
["Part A · Foundation","Anticipation Guide",2,["I wrote 5 to 7 Agree/Disagree statements","Statements target big ideas, misconceptions or themes","None is simple trivia a student could just look up"],"Opinion and theme statements spark critical thinking. Trivia does not."],
["Part B · Action Map","Arts Activities (VAPA)",5,["I outlined TWO distinct arts activities (music, drama or visual arts)","Each has 2–3 detailed paragraphs","Each explains step-by-step how it works","Each explicitly deepens history knowledge (not just a craft)"],"Only one activity, or under 2 paragraphs each, caps you at 2.5 points."],
["Part B · Action Map","Writing Activities",5,["I outlined TWO different writing genres (essay, poetry, letter...)","Each has 2–3 detailed paragraphs","I explained the operational steps for elementary writers","I explained how each targets historical analysis AND literacy growth"],"Explain the HOW of the writing process, not just the what."],
["Part B · Action Map","Field Trip Experience",3,["My virtual or physical field trip is highly purposeful","I explained its role and 'thematic power'","I described what students actually do on the trip","It anchors the unit's key historical concepts"],"A field trip that feels like an afterthought is half credit."],
["Part B · Action Map","Map Format & Creativity",2,["Polished slide deck or narrative with distinct headings","Formatting is consistent throughout","I added a relevant 'creative extra' (math activity, guest speaker, poster)"],"The creative extra must have instructional substance."],
["Part C · Deep Dive","Refinement & Polish",3,["I can point to revisions based on previous feedback","I fixed errors and vague details from earlier drafts","I filled instructional gaps and polished for professional quality"],"Superficial edits earn half credit. Show real revision."],
["Part C · Deep Dive","Unit Closure Activity",4,["I designed a final activity that wraps up the unit","It is a synthesis, not just a test or simple recap","I explicitly explain how it reinforces the unit's big ideas","It pulls together key elements learned across the unit"],"Explain the connection to big ideas explicitly."],
["Final Tier · Million-Dollar Question","Final Compilation & Submission",3,["Parts A, B and C are in ONE cohesive deck or narrative","Transitions between parts are seamless","Formatting is professional and classroom-ready","I cross-checked every rubric and nothing is missing"],"Missing sections or disjointed formatting means half credit."]
];
var st,main=document.getElementById('main'),lad=document.getElementById('ladder');
function reset(){st={i:-1,res:[],checks:[],used:{},dim:false,box:''}}
function fmt(n){return '$'+n.toLocaleString('en-US')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ladder(){
 var h='';
 for(var k=0;k<PRIZES.length;k++){
  var c=SAFE.indexOf(k)>-1?'safe':'';
  if(st.res[k]!==undefined)c=st.res[k]>0?'done':'miss';else if(k===st.i)c='cur';
  h+='<div class="'+c+'"><span>'+(k+1)+'</span><span>'+fmt(PRIZES[k])+'</span></div>';
 }
 lad.innerHTML=h;
}
var HELP='<div class="big">📖 How to Play</div>'+
 '<p>Your Signature Assignment is due in two weeks. Keep your working draft (slide deck or narrative) open beside this window. Each of the 12 questions is one rubric criterion from Parts A, B and C.</p>'+
 '<p><b>Answering:</b> Tick every box you can honestly prove in your draft, then press <b>Final Answer</b>. All boxes = full points. Some boxes = half points. None = zero.</p>'+
 '<p><b>Lifelines</b> (one use each for the whole game):</p>'+
 '<p>🙋 <b>Ask the Expert</b>: writes a ready-to-paste question for your instructor in the class chat.</p>'+
 '<p>✂️ <b>50/50</b>: removes half of the checklist for that question, leaving only the core items. You are scored on the core items only, and the removed ones are listed afterward so you can still check them yourself. Best used when you are short on time.</p>'+
 '<p>📞 <b>Phone-a-Friend</b>: drafts an email to a peer or fieldwork host teacher asking for feedback.</p>'+
 '<p>At the end you get a <b>1 Million Dollar Checklist</b> to paste into your Canvas submission.</p>'+
 '<button data-act="closehelp">Got it, back to the game</button>';
function start(){
 main.innerHTML='<div class="card"><div class="big">🎬 Welcome, Candidate!</div>'+HELP.replace('<div class="big">📖 How to Play</div>','').replace(/<button.*<\/button>/,'')+
 '<p>Climb all 12 steps to reach <b>$1,000,000</b>!</p><button data-act="next">Enter the Hot Seat ▶</button></div>';
 ladder();
}
function next(){st.i++;st.dim=false;st.box='';render()}
function render(){
 if(st.i>=Q.length)return finish();
 var q=Q[st.i];if(!st.checks[st.i])st.checks[st.i]=[];
 var items='';
 var nv=st.dim?Math.ceil(q[3].length/2):q[3].length;
 for(var k=0;k<q[3].length;k++){
  if(k>=nv){items+='<div class="cut">✂️ '+esc(q[3][k])+'</div>';continue}
  items+='<label><input type="checkbox" data-k="'+k+'" '+(st.checks[st.i][k]?'checked':'')+'>'+esc(q[3][k])+'</label>';
 }
 function L(k,t){return '<button class="ghost" data-act="life" data-life="'+k+'" '+(st.used[k]?'disabled':'')+'>'+t+'</button>'}
 main.innerHTML='<div class="card"><div class="part">'+q[0]+' · Question '+(st.i+1)+' of 12</div>'+
 '<div class="prize">'+fmt(PRIZES[st.i])+'</div><h2>'+esc(q[1])+' <small>('+q[2]+' pts)</small></h2>'+
 '<p>Can you prove each of these in your draft?</p>'+items+
 '<div class="lifelines">'+L('expert','🙋 Ask the Expert')+L('fifty','✂️ 50/50')+L('friend','📞 Phone-a-Friend')+'</div>'+
 '<div>'+st.box+'</div><button data-act="lock">🔒 Final Answer</button></div>';
 ladder();
}
function life(k){
 st.used[k]=true;var q=Q[st.i];
 if(k==='fifty'){st.dim=true;st.box='<div class="msg">✂️ 50/50 used! Half the checklist is removed. You will be scored on the core items that remain. Tip: '+esc(q[4])+'</div>'}
 if(k==='expert'){st.box='<div class="msg">🙋 Paste this into the chat:<textarea id="t" readonly>Professor, I\'m working on "'+esc(q[1])+'" ('+esc(q[0])+'). What would a Highly Proficient example look like for this criterion?</textarea></div>'}
 if(k==='friend'){st.box='<div class="msg">📞 Draft email:<textarea id="t" readonly>Subject: Quick feedback on my Signature Assignment?\n\nHi! I\'m finishing "'+esc(q[1])+'" for my History/Social Science thematic unit. Could you look at that section and tell me whether it clearly shows: '+esc(q[3][0].toLowerCase())+'? Thank you so much!</textarea></div>'}
 render();
}
function lock(){
 var q=Q[st.i],c=0,n=st.dim?Math.ceil(q[3].length/2):q[3].length;
 for(var k=0;k<n;k++)if(st.checks[st.i][k])c++;
 var pts=c===n?q[2]:(c>0?q[2]/2:0);st.res[st.i]=pts;
 var cls=pts===q[2]?'ok':(pts>0?'mid':'bad');
 var msg=pts===q[2]?'✅ Correct! Full '+q[2]+' points. You bank '+fmt(PRIZES[st.i])+'!':(pts>0?'🟠 Developing: '+pts+' of '+q[2]+' points. Fix the unchecked items before submitting. Hint: '+esc(q[4]):'❌ Missing: 0 of '+q[2]+' points. Hint: '+esc(q[4]));
 if(st.dim&&n<q[3].length){var sk=[];for(var j=n;j<q[3].length;j++)sk.push(esc(q[3][j]));msg+='<br><br>✂️ <b>Still verify on your own (removed by 50/50):</b> '+sk.join('; ')+'.'}
 if(pts===q[2])rain(12);
 main.innerHTML='<div class="card"><div class="part">'+esc(q[1])+'</div><div class="msg '+cls+'">'+msg+'</div>'+
 '<button data-act="next">'+(st.i===Q.length-1?'See my results ▶':'Next question ▶')+'</button>'+
 (pts<q[2]?'<button class="ghost" data-act="retry">↩ Revise and retry</button>':'')+'</div>';
 ladder();
}
function finish(){
 var tot=0,lines=[],k;
 for(k=0;k<Q.length;k++){tot+=st.res[k]||0;lines.push((st.res[k]===Q[k][2]?'[x] ':'[ ] ')+fmt(PRIZES[k])+' · '+Q[k][1]+': '+(st.res[k]||0)+'/'+Q[k][2])}
 var win=tot===35;
 var txt='1 MILLION DOLLAR CHECKLIST\nSelf-audit score: '+tot+'/35\n\n'+lines.join('\n')+'\n\nAll items verified against the Part A, B and C rubrics: '+(win?'YES':'NOT YET');
 if(win)rain(60);
 main.innerHTML='<div class="card"><div class="big">'+(win?'🏆 YOU ARE A MILLIONAIRE! 🏆':'💼 You walk away with '+tot+'/35!')+'</div>'+
 '<p style="text-align:center">'+(win?'Every rubric criterion is covered. Submit in Canvas!':'Revisit the orange or red items, then replay to lock in the million.')+'</p>'+
 '<textarea id="cl" readonly style="min-height:300px">'+esc(txt)+'</textarea>'+
 '<button data-act="copy">📋 Copy checklist</button><button class="ghost" data-act="again">Play again</button>'+
 '<p style="color:#aeb6ff;font-size:.9rem">Paste this checklist into your Canvas submission along with your deck or narrative.</p></div>';
 ladder();
}
function copy(){
 var t=document.getElementById('cl');t.focus();t.select();
 try{document.execCommand('copy')}catch(e){}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).catch(function(){})}
}
function rain(n){
 var e=['💵','💰','🪙','💸'];
 for(var k=0;k<n;k++){(function(k){
  var d=document.createElement('div');d.className='rain';d.textContent=e[k%4];
  d.style.left=(Math.random()*95)+'%';d.style.animationDuration=(2+Math.random()*3)+'s';d.style.animationDelay=(Math.random()*1.5)+'s';
  document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},7000);
 })(k)}
}
document.addEventListener('click',function(ev){
 var b=ev.target.closest?ev.target.closest('button[data-act]'):null;if(!b)return;
 var a=b.getAttribute('data-act');
 if(a==='next')next();
 else if(a==='lock')lock();
 else if(a==='life')life(b.getAttribute('data-life'));
 else if(a==='retry'){st.res[st.i]=undefined;render()}
 else if(a==='copy')copy();
 else if(a==='again'){reset();start()}
 else if(a==='help'){document.getElementById('helpbox').innerHTML=HELP;document.getElementById('modal').className='modal open'}
 else if(a==='closehelp'){document.getElementById('modal').className='modal'}
});
document.addEventListener('change',function(ev){
 var c=ev.target;if(c.type==='checkbox'&&c.hasAttribute('data-k')){st.checks[st.i][+c.getAttribute('data-k')]=c.checked}
});
reset();start();
})();
</script></body></html>
