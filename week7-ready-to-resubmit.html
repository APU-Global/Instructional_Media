<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 7 | Confirm Your Portfolio Is Ready</title>
<style>
:root{--crimson:#a63238;--crimson-d:#7e2227;--ink:#27262b;--muted:#5f5b63;--bg:#fbf8f6;--card:#fff;--line:#e6dfda;--teal:#23757c;--gold:#e3a72f;--green:#2e7d4f;--red:#b3261e;--soft:#f6ecea}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;padding:12px 16px}
.top{display:flex;align-items:center;gap:16px;background:linear-gradient(100deg,var(--crimson),var(--crimson-d));color:#fff;border-radius:14px;padding:6px 20px 6px 10px;flex:none}
.top svg{height:82px;width:auto;flex:none}
.wk{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.88;font-weight:700}
h1{font-size:22px;line-height:1.15;margin:1px 0 3px}
.sub{font-size:13.5px;opacity:.93}
.tabs{display:flex;gap:6px;margin:10px 0 0;flex:none;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-weight:650;cursor:pointer}
.tab:hover{border-color:var(--crimson)}
.tab[aria-selected=true]{background:var(--crimson);color:#fff;border-color:var(--crimson)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.panel{flex:1;min-height:0;overflow:hidden;padding-top:10px}
.panel[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--crimson);color:#fff}
.btn:hover{background:var(--crimson-d)}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover{border-color:var(--crimson)}
.btn:disabled{opacity:.45;cursor:not-allowed}
h2{font-size:18px;line-height:1.2}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin-top:6px}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){
 .app{padding:8px 10px}.top{padding:6px 12px;gap:10px}.top svg{height:54px}h1{font-size:17px}.sub{display:none}
 .tab{padding:6px 12px;font-size:14px}.tabs{margin:8px 0 6px}
}

.gate{display:grid;grid-template-columns:1fr 280px;gap:14px;height:100%}
.cl{display:flex;flex-direction:column;gap:7px}
.it{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.it input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--green)}
.it.on{border-color:var(--green);background:#e9f6ee}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--crimson);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.launch{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.launch svg{width:100%;height:auto;max-height:250px}
#rocket{transition:transform 1.1s cubic-bezier(.3,.1,.2,1)}
#rocket.go{transform:translateY(-34px)}
#bar{transition:transform .6s;transform-origin:56px 190px}
#bar.open{transform:rotate(-78deg)}
.status{font-weight:750;padding:8px 12px;border-radius:10px;width:100%;font-size:14px}
.status.hold{background:#fdeceb;color:#7e2227}.status.wait{background:#fff3e0;color:#7a4b00}.status.ok{background:#e9f6ee;color:#1f5b38}
.scn{display:grid;grid-template-columns:1fr 200px;gap:14px;height:100%}
.scn .q{display:flex;flex-direction:column;gap:10px;justify-content:center}
.sc{font-size:17px;line-height:1.4;padding:14px 16px;background:var(--soft);border-radius:12px;border-left:5px solid var(--crimson)}
.gw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:800;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.gb:hover:not(:disabled){border-color:var(--crimson)}.gb.right{border-color:var(--green);background:#e9f6ee}.gb.wrong{border-color:var(--red);background:#fdeceb}
.sig svg{width:100%;height:auto;max-height:240px}
@media (max-width:760px){.gate,.scn{grid-template-columns:1fr}.launch svg,.sig{display:none}.status{font-size:13px}.sc{font-size:15px;padding:10px 12px}}
@media (max-width:640px){.it{padding:6px 8px;font-size:13.5px}.cl{gap:5px}}
</style></head><body>
<div class="app">
<header class="top"><svg viewBox="0 0 230 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A rocket on a launch pad">
<circle cx="115" cy="58" r="50" fill="#fff" opacity=".13"/>
<g fill="#fff" opacity=".8"><circle cx="30" cy="24" r="2.5"/><circle cx="190" cy="18" r="3"/><circle cx="208" cy="58" r="2"/><circle cx="52" cy="62" r="2"/><circle cx="170" cy="40" r="2"/></g>
<rect x="64" y="94" width="102" height="10" rx="4" fill="#27262b"/><rect x="82" y="86" width="66" height="9" rx="3" fill="#7a7580"/>
<g transform="translate(115 0)"><path d="M0 6C16 20 18 46 14 76H-14C-18 46-16 20 0 6z" fill="#fff"/>
<path d="M0 6C8 12 12 20 13 28H-13C-12 20-8 12 0 6z" fill="#a63238"/>
<circle cx="0" cy="46" r="9" fill="#23757c" stroke="#27262b" stroke-width="3"/>
<path d="M-14 62L-30 84 -14 78zM14 62L30 84 14 78z" fill="#e3a72f"/>
<path d="M-8 78h16l-8 22z" fill="#e3a72f"/><path d="M-4 78h8l-4 12z" fill="#fff"/></g>
<path d="M176 94V50M176 50h22M176 94h0" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M178 50h26v14h-26z" fill="#2e7d4f"/><path d="M185 57l4 4 8-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg><div><div class="wk">Week 7</div><h1>Ready to Resubmit?</h1><div class="sub">Run the final readiness check, then test your judgment on real-world situations.</div></div></header>
<div class="tabs" role="tablist"><button class="tab" role="tab" id="t-0" aria-controls="p-gate" aria-selected="true" tabindex="0">Readiness Checklist</button><button class="tab" role="tab" id="t-1" aria-controls="p-scn" aria-selected="false" tabindex="-1">Go or Wait?</button></div>

<section id="p-gate" class="panel" role="tabpanel" aria-labelledby="t-0">
 <div class="gate">
  <div class="card cl" id="cl">
   <div><h2>Confirm each item before you resubmit</h2><p class="small muted">Items tagged <span class="tag">REQUIRED</span> are course rules.</p></div>
  </div>
  <div class="card launch"><svg viewBox="0 0 220 250" role="img" aria-label="Rocket on a launch pad behind a gate">
<rect width="220" height="250" rx="16" fill="#27262b"/>
<g fill="#fff" opacity=".75"><circle cx="30" cy="30" r="2"/><circle cx="190" cy="44" r="2.5"/><circle cx="160" cy="18" r="1.8"/><circle cx="52" cy="90" r="1.6"/><circle cx="200" cy="110" r="1.8"/></g>
<g id="rocket"><g transform="translate(110 0)"><path d="M0 40C20 58 22 100 17 150H-17C-22 100-20 58 0 40z" fill="#fff"/><path d="M0 40C10 48 15 58 16 68H-16C-15 58-10 48 0 40z" fill="#a63238"/><circle cx="0" cy="102" r="11" fill="#23757c" stroke="#27262b" stroke-width="3"/><path d="M-17 128L-37 160-17 152zM17 128L37 160 17 152z" fill="#e3a72f"/><path d="M-10 152h20l-10 26z" fill="#e3a72f"/></g></g>
<rect x="50" y="206" width="120" height="14" rx="5" fill="#7a7580"/><rect x="30" y="220" width="160" height="16" rx="5" fill="#4a464f"/>
<rect x="46" y="176" width="10" height="34" fill="#a63238"/><rect x="164" y="176" width="10" height="34" fill="#a63238"/>
<g id="bar"><rect x="56" y="186" width="108" height="9" rx="3" fill="#e3a72f"/><g fill="#27262b"><polygon points="66,186 78,186 72,195"/><polygon points="92,186 104,186 98,195"/><polygon points="118,186 130,186 124,195"/><polygon points="144,186 156,186 150,195"/></g></g>
</svg><div class="status hold" id="status" aria-live="polite"></div></div>
 </div>
</section>
<section id="p-scn" class="panel" role="tabpanel" aria-labelledby="t-1" hidden>
 <div class="card scn" id="scn">
  <div class="q">
   <div class="dots" id="dots" style="display:flex;gap:6px;align-items:center"></div>
   <p class="muted small">Sample situations. Should this candidate resubmit to Pearson now?</p>
   <div class="sc" id="sc"></div>
   <div class="gw"><button class="gb" id="bw">Wait</button><button class="gb" id="bg">Go: resubmit</button></div>
   <div id="fb" class="small" style="min-height:44px" aria-live="polite"></div>
   <div><button class="btn" id="nx" hidden>Next</button></div>
  </div>
  <div class="sig"><svg viewBox="0 0 200 240" role="img" aria-label="Traffic light with go and wait">
<rect x="62" y="10" width="76" height="160" rx="20" fill="#27262b"/><circle cx="100" cy="46" r="20" fill="#b3261e" opacity=".35"/><circle cx="100" cy="90" r="20" fill="#e3a72f" opacity=".35"/><circle cx="100" cy="134" r="20" fill="#2e7d4f"/>
<rect x="94" y="170" width="12" height="60" fill="#4a464f"/><rect x="70" y="226" width="60" height="8" rx="4" fill="#4a464f"/>
<text x="26" y="52" font-size="12" font-weight="800" fill="#7e2227" font-family="Arial" text-anchor="middle">WAIT</text><text x="176" y="140" font-size="12" font-weight="800" fill="#1f5b38" font-family="Arial" text-anchor="middle">GO</text></svg></div>
 </div>
</section>

</div>
<script>
(function(){
 var tabs=[].slice.call(document.querySelectorAll('.tab'));
 function show(id){tabs.forEach(function(t){var on=t.getAttribute('aria-controls')===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on;});}
 tabs.forEach(function(t,i){
  t.addEventListener('click',function(){show(t.getAttribute('aria-controls'))});
  t.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;var n=tabs[(i+d+tabs.length)%tabs.length];n.focus();n.click();});
 });
 window.copyText=function(txt,btn){
  function done(){var o=btn.textContent;btn.textContent='Copied!';setTimeout(function(){btn.textContent=o},1600)}
  function fallback(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){btn.textContent='Select text to copy'}document.body.removeChild(ta)}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,fallback)}else fallback();
 };
})();
</script>
<script>
(function(){
 var ITEMS=[
  ['I addressed each of the Pearson evaluator’s comments in my revised portfolio.',0],
  ['I checked my document for spelling and grammatical errors.',0],
  ['I submitted Part 3: Revised Portfolio (due Week 7, Monday 8 AM Pacific).',0],
  ['I attended Coaching Session 3 in Week 7.',1],
  ['My coach confirmed that everything is in order.',1],
  ['My remaining questions have been answered.',0]
 ],on=[0,0,0,0,0,0],cl=document.getElementById('cl');
 ITEMS.forEach(function(it,i){
  var l=document.createElement('label');l.className='it';
  l.innerHTML='<input type="checkbox"><span>'+it[0]+(it[1]?'<span class="tag">REQUIRED</span>':'')+'</span>';
  l.querySelector('input').onchange=function(e){on[i]=e.target.checked?1:0;l.classList.toggle('on',!!on[i]);upd()};
  cl.appendChild(l);
 });
 function upd(){
  var n=on.reduce(function(a,b){return a+b},0),s=document.getElementById('status'),r=document.getElementById('rocket'),b=document.getElementById('bar');
  var gateOk=on[3]&&on[4],all=n===ITEMS.length;
  r.classList.toggle('go',all);b.classList.toggle('open',all);
  if(all){s.className='status ok';s.textContent='Clear to resubmit to Pearson. Nice work!';}
  else if(!gateOk){s.className='status hold';s.textContent='Hold: do not resubmit until after your third coaching session. '+n+' of 6 confirmed.';}
  else{s.className='status wait';s.textContent='Almost there: '+n+' of 6 confirmed. Finish the remaining items.';}
 }
 upd();
 var SC=[
  ['You submitted Part 3 on Monday. Your Coaching Session 3 is booked for Thursday, but you feel ready. Do you resubmit to Pearson on Wednesday?','w','Wait. Do not resubmit to Pearson until after your third coaching session.'],
  ['You attended Coaching Session 3, your coach confirmed everything is in order, and your revision addresses every evaluator comment.','g','Go. The required steps are complete and your coach has confirmed the portfolio is ready.'],
  ['You finished Coaching Session 3, but while rereading you notice one evaluator comment you never addressed.','w','Wait. Revise that section and check with your coach before you resubmit, so everything is in order.'],
  ['Your portfolio is done and Session 3 is complete, but you have not yet checked spelling and grammar.','w','Wait. Proofread first. The Part 3 requirements ask you to check for spelling and grammatical errors.']
 ],qi=0,sc=0,res=[],ans=false;
 var $=function(i){return document.getElementById(i)};
 function dots(){$('dots').innerHTML=SC.map(function(_,i){return '<span style="width:12px;height:12px;border-radius:50%;display:inline-block;background:'+(res[i]===1?'#2e7d4f':res[i]===0?'#b3261e':'#e6dfda')+(i===qi?';outline:2px solid #27262b':'')+'"></span>'}).join('')+'<span class="small muted" style="margin-left:6px">'+(qi+1)+' of '+SC.length+'</span>';}
 function load(){ans=false;$('sc').textContent=SC[qi][0];$('fb').textContent='';$('nx').hidden=true;['bw','bg'].forEach(function(i){$(i).disabled=false;$(i).className='gb'});dots();}
 function pick(k){
  if(ans)return;ans=true;var ok=k===SC[qi][1];res[qi]=ok?1:0;if(ok)sc++;
  var right=$(SC[qi][1]==='w'?'bw':'bg'),ch=$(k==='w'?'bw':'bg');right.classList.add('right');if(!ok)ch.classList.add('wrong');
  $('bw').disabled=$('bg').disabled=true;
  $('fb').innerHTML='<b>'+(ok?'Correct. ':'Not quite. ')+'</b>'+SC[qi][2];
  $('nx').textContent=qi===SC.length-1?'See my result':'Next';$('nx').hidden=false;$('nx').focus();dots();
 }
 $('bw').onclick=function(){pick('w')};$('bg').onclick=function(){pick('g')};
 $('nx').onclick=function(){
  if(qi<SC.length-1){qi++;load();return}
  $('scn').innerHTML='<div style="grid-column:1/-1;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center"><div style="font-size:42px;font-weight:800;color:#a63238">'+sc+' / '+SC.length+'</div><h2>'+(sc===4?'Launch-ready judgment':'Review the checklist once more')+'</h2><p style="max-width:520px">The rule of thumb: finish your revision, complete Coaching Session 3, and get your coach’s confirmation, then resubmit.</p><button class="btn alt" id="again">Try again</button></div>';
  $('again').onclick=function(){location.reload()};
 };
 load();
})();
</script>
</body></html>
