<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCAD 300 | Strategic Plan Builder</title>
<style>
*{box-sizing:border-box}
:root{--red:#d34147;--dred:#a8353a;--ink:#222;--mut:#555;--line:#d6d6d6;--card:#fcfcfc;--ok:#1e7a4c;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbe9e7;--blue:#2f6f8f}
html,body{margin:0;padding:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;font-size:15px;line-height:1.4}
.wrap{max-width:980px;margin:0 auto;padding:8px 12px 10px}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#a8353a,#d34147);color:#fff;border-radius:14px;padding:8px 16px;margin-bottom:10px}
.hero svg{width:54px;height:54px;flex:none}
.hero .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.hero h1{margin:0;font-size:20px;line-height:1.2}
.hero p{margin:2px 0 0;font-size:13px;opacity:.95}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:14px;padding:12px 14px}
.card h2{margin:0 0 4px;font-size:17px}
.card h3{margin:8px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--dred)}
.card p{margin:0 0 4px}
.grid{display:grid;gap:12px}
.btn{font:inherit;font-weight:600;border:2px solid var(--red);background:#fff;color:var(--dred);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left}
.btn:hover,.btn:focus-visible{background:#fdeeee;outline:none}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:var(--dred)}
.btn:disabled{opacity:.5;cursor:default}
.fb{border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--dred)}
.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.hidden{display:none!important}
.sr{position:absolute;left:-9999px}
@media(max-width:720px){.hero h1{font-size:17px}.hero p{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:720px){#sw,#lad{grid-template-columns:1fr!important}}</style></head>
<body><div class="wrap">
<header class="hero"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#fff" opacity=".18"/><path d="M10 52h12V42h12V32h12V22h10v30z" fill="#fff"/><path d="M12 30 24 18l8 6 16-14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 10h8v8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="tag">HCAD 300 · Week 6 · Strategic Planning in Healthcare</div><h1>Strategic Plan Builder</h1><p>Strategy connects mission to action. Sort a SWOT, then build the plan ladder.</p></div></header>

<div id="tabs" style="display:flex;gap:8px;margin-bottom:8px">
 <button class="btn primary" id="t1">Step 1 · SWOT sort</button><button class="btn" id="t2">Step 2 · Plan ladder</button>
</div>
<div id="p1">
 <div class="card" style="margin-bottom:8px;padding:8px 12px"><b>Rural Community Hospital.</b> <span style="color:var(--mut)">Pick a card, then tap the quadrant where it belongs.</span></div>
 <div class="grid" style="grid-template-columns:1fr 1.5fr;align-items:start" id="sw">
  <div class="card" style="padding:8px"><div id="chips" style="display:grid;gap:6px"></div><div id="fb" style="font-size:13px"></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="quad"></div>
 </div>
</div>
<div id="p2" class="hidden">
 <div class="grid" style="grid-template-columns:150px 1fr;align-items:stretch" id="lad">
  <div class="card" style="padding:8px;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 120 200" style="width:120px" id="stairs"></svg></div>
  <div class="card" style="min-height:310px">
   <div class="chip" id="lv"></div>
   <h2 id="lt" style="margin-top:4px"></h2><p id="lp"></p>
   <div id="lo" style="display:grid;gap:6px;margin-top:6px"></div><div id="lfb"></div>
   <div style="text-align:right;margin-top:6px"><button class="btn primary hidden" id="ln">Next level →</button></div>
  </div>
 </div>
</div>

</div>
<script>
const $=id=>document.getElementById(id);
const Qd=[['S','Strengths','Internal \u00b7 helpful','#3a8a6a'],['W','Weaknesses','Internal \u00b7 harmful','#8a6d2f'],['O','Opportunities','External \u00b7 helpful','#2f6f8f'],['T','Threats','External \u00b7 harmful','#a8353a']];
const ITEMS=[['Strong reputation for nursing care','S'],['Outdated scheduling system','W'],['Nearest competitor closing its ER','O'],['State Medicaid cuts proposed','T'],['Loyal volunteer base','S'],['High night-shift staff turnover','W'],['New telehealth grant available','O'],['Rising supply costs','T']];
let sel=null,placed=0;
const quad=$('quad'),chips=$('chips');
Qd.forEach(q=>{const d=document.createElement('div');d.className='card';d.style.cssText=`border-left-color:${q[3]};min-height:150px;padding:8px 10px;cursor:pointer`;d.dataset.q=q[0];
 d.innerHTML=`<div style="display:flex;align-items:center;gap:8px"><span style="background:${q[3]};color:#fff;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800">${q[0]}</span><div><b>${q[1]}</b><div style="font-size:11px;color:var(--mut)">${q[2]}</div></div></div><div class="dz" style="display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:13px"></div>`;
 d.onclick=()=>drop(q[0],d);quad.appendChild(d)});
ITEMS.forEach((it,i)=>{const b=document.createElement('button');b.className='btn';b.style.cssText='padding:5px 10px;font-size:13px';b.textContent=it[0];b.onclick=()=>{[...chips.children].forEach(c=>c.classList.remove('primary'));sel=i;b.classList.add('primary');$('fb').innerHTML=''};chips.appendChild(b)});
function drop(q,d){
 if(sel===null){$('fb').innerHTML='<div class="fb bad">Select a card first.</div>';return}
 const it=ITEMS[sel];
 if(it[1]===q){const l=document.createElement('div');l.textContent='\u2022 '+it[0];d.querySelector('.dz').appendChild(l);chips.children[sel].classList.add('hidden');sel=null;placed++;
  $('fb').innerHTML=placed===8?'<div class="fb ok">All sorted! Internal factors (S/W) are within your control; external (O/T) are not. Move on to Step 2.</div>':'<div class="fb ok">Correct.</div>';
  if(placed===8)$('t2').classList.add('primary')}
 else{const internal='SW'.includes(it[1]);$('fb').innerHTML=`<div class="fb bad">Not quite. Ask: is it <b>inside</b> or <b>outside</b> the organization, and does it help or hurt?</div>`}
}
const L=[
{n:'Mission',t:'Start with mission',p:'Mission: \u201cProvide compassionate, accessible care to our rural community.\u201d Which objective best serves it and is measurable?',o:[['Reduce average wait for a primary-care appointment from 21 days to 7 days within 12 months.',1,'Measurable, time-bound, and tied to access.'],['Be the best hospital around.',0,'Vague and not measurable.'],['Install new software.',0,'That is an action, not an objective.']]},
{n:'Objective',t:'Choose the strategy',p:'Objective: cut appointment wait to 7 days within 12 months. Which strategy is the approach to get there?',o:[['Expand access through telehealth visits and extended clinic hours.',1,'A strategy describes the approach linked to the objective.'],['Hire an assistant by Friday.',0,'That is an action step, not a strategy.'],['Wait for the competitor to close.',0,'Reactive, not a strategy within the organization\u2019s control.']]},
{n:'Strategy',t:'Define the action step',p:'Strategy: expand telehealth and extended hours. Which is a true actionable step (who, what, when)?',o:[['The operations director will apply for the telehealth grant and select a vendor by March 31.',1,'Names who, what, and when, and links to the strategy.'],['Improve patient access.',0,'Too general to act on.'],['Everyone should try harder.',0,'No owner, task, or deadline.']]},
{n:'Action',t:'Plan for change',p:'The state proposes Medicaid cuts mid-year. What belongs in a strong plan?',o:[['Contingencies, risk monitoring, and measures to evaluate and revise the plan.',1,'Plans should anticipate external factors and be revised using results.'],['Ignore it. The plan is set.',0,'Plans must adapt to external factors.'],['Cancel the whole strategy now.',0,'Overreaction. Adjust with contingencies rather than abandon.']]}];
let li=0;
function stairs(n){let s='';for(let k=0;k<4;k++){const f=k<n?'#d34147':'#e3e3e3';s+=`<rect x="${6+k*26}" y="${150-k*38}" width="26" height="${40+k*38}" fill="${f}" rx="3"/>`}
 s+=`<text x="60" y="190" text-anchor="middle" font-size="11" fill="#555">Mission \u2192 Objective \u2192 Strategy \u2192 Action</text>`;return s}
function lad(){const l=L[li];$('stairs').innerHTML=stairs(li);$('lv').textContent=`Level ${li+1} of 4`;$('lt').textContent=l.t;$('lp').textContent=l.p;$('lfb').innerHTML='';$('ln').classList.add('hidden');
 const o=$('lo');o.innerHTML='';l.o.forEach(x=>{const b=document.createElement('button');b.className='btn';b.textContent=x[0];b.onclick=()=>{$('lfb').innerHTML=`<div class="fb ${x[1]?'ok':'bad'}">${x[2]}</div>`;if(x[1]){[...o.children].forEach(c=>c.disabled=true);b.style.background='#e6f4ec';$('ln').textContent=li===3?'Finish':'Next level \u2192';$('ln').classList.remove('hidden')}};o.appendChild(b)})}
$('ln').onclick=()=>{li++;if(li>=4){$('stairs').innerHTML=stairs(4);$('lv').textContent='Complete';$('lt').textContent='Your plan is aligned';$('lp').textContent='Mission \u2192 measurable objective \u2192 strategy \u2192 owned action steps \u2192 contingencies and evaluation. This alignment is what you will build in the Part 4 strategic proposal.';$('lo').innerHTML='';$('lfb').innerHTML='';$('ln').classList.add('hidden')}else lad()};
$('t1').onclick=()=>{$('p1').classList.remove('hidden');$('p2').classList.add('hidden');$('t1').classList.add('primary');$('t2').classList.remove('primary')};
$('t2').onclick=()=>{$('p2').classList.remove('hidden');$('p1').classList.add('hidden');$('t2').classList.add('primary');$('t1').classList.remove('primary')};
lad();
</script>
<script>
(function(){function send(){try{parent.postMessage({type:'iframe-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}
window.addEventListener('load',send);window.addEventListener('resize',send);
if(window.MutationObserver)new MutationObserver(send).observe(document.body,{childList:true,subtree:true,attributes:true});})();
</script>
</body></html>
