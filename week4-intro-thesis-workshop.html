<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 4: Introductions and Conclusions</title><style>
:root{--navy:#14274e;--teal:#0e7c7b;--gold:#f4b400;--ink:#1f2937;--muted:#566074;--bg:#f4f7fb;--card:#fff;--line:#d5dcea;
--good:#136c3a;--goodbg:#e4f4ea;--bad:#a8261b;--badbg:#fdeceb;--accent:#0e7c7b;--accentbg:#e3f3f2}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
.app{height:100%;display:flex;flex-direction:column}
header{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:#fff;padding:10px 18px 12px}
.hl{min-width:0}
.wk{display:inline-block;background:var(--gold);color:#14274e;font-weight:700;font-size:12px;letter-spacing:.08em;padding:2px 8px;border-radius:99px}
h1{margin:4px 0 0;font-size:clamp(18px,3.2vw,24px);line-height:1.15}
header p{margin:2px 0 0;font-size:14px;color:#d6def0}
.bn{flex:none;width:150px;height:62px}.bn svg{width:100%;height:100%;display:block}
.prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.18)}
.prog span{display:block;height:100%;width:0;background:var(--gold);transition:width .35s}
#stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 18px 18px;scrollbar-width:thin}
.wrap{max-width:880px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(20,39,78,.07)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px;gap:8px}
.pill{background:var(--accentbg);color:#0a5958;border-radius:99px;padding:2px 10px;font-weight:600;font-size:13px}
h2{margin:0 0 6px;font-size:19px;color:var(--navy)}
.lead{margin:0 0 10px;color:var(--muted)}
.btns{display:grid;gap:8px;margin-top:12px}
.btns.c3{grid-template-columns:repeat(3,1fr)}.btns.c2{grid-template-columns:repeat(2,1fr)}.btns.c4{grid-template-columns:repeat(4,1fr)}
button{font:inherit;cursor:pointer}
.opt{min-height:46px;padding:8px 10px;border:2px solid var(--line);background:#fff;border-radius:12px;color:var(--navy);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--accentbg)}
.opt:focus-visible,.primary:focus-visible,.ghost:focus-visible,.blk:focus-visible,.slot:focus-visible{outline:3px solid #1a5fd0;outline-offset:2px}
.opt.right{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt:disabled{cursor:default}
.primary{min-height:44px;padding:8px 20px;border:0;border-radius:99px;background:var(--navy);color:#fff;font-weight:700}
.primary:hover:not(:disabled){background:#0d1b38}.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{min-height:40px;padding:6px 16px;border:2px solid var(--navy);border-radius:99px;background:#fff;color:var(--navy);font-weight:700}
.fb{margin-top:12px;border-radius:12px;padding:10px 14px;border-left:6px solid var(--good);background:var(--goodbg)}
.fb.no{border-left-color:var(--bad);background:var(--badbg)}
.fb b{display:block;margin-bottom:2px}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.res{text-align:center}.res .big{font-size:44px;font-weight:800;color:var(--navy);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chip{background:var(--accentbg);border-radius:12px;padding:6px 12px;font-weight:600;color:#0a5958;font-size:14px}
mark{background:#ffe08a;border-radius:3px;padding:0 1px}
@media (max-width:620px){.bn{display:none}.btns.c3,.btns.c4{grid-template-columns:1fr}#stage{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><div class="app">
<header><div class="hl"><span class="wk">WEEK 4</span><h1>Thesis & Introduction Workshop</h1><p>Spot a real thesis, build an introduction, and choose a strong conclusion.</p></div>
<div class="bn" aria-hidden="true"><svg viewBox="0 0 150 62" xmlns="http://www.w3.org/2000/svg">
<polygon points="8,8 92,8 78,24 22,24" fill="#f4b400"/><polygon points="24,28 76,28 66,42 34,42" fill="#0e7c7b"/><polygon points="36,46 64,46 58,58 42,58" fill="#fff"/>
<circle cx="120" cy="30" r="22" fill="none" stroke="#fff" stroke-width="4"/><circle cx="120" cy="30" r="13" fill="none" stroke="#f4b400" stroke-width="4"/><circle cx="120" cy="30" r="4" fill="#fff"/>
<path d="M120 30L142 8" stroke="#fff" stroke-width="3"/><path d="M142 8l-9 1 3 7z" fill="#fff"/></svg></div>
<div class="prog" id="progbox" role="progressbar" aria-label="Activity progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="pbar"></span></div></header>
<main id="stage"></main></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const stage=$('#stage');
function setProg(n,t){$('#pbar').style.width=Math.round(100*n/t)+'%';$('#progbox').setAttribute('aria-valuenow',Math.round(100*n/t));}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toTop(){stage.scrollTop=0;}

const tri=(w)=>`<svg viewBox="0 0 100 24" width="${w}" height="24" aria-hidden="true"><polygon points="0,0 100,0 ${50+w/2},24 ${50-w/2},24" fill="currentColor"/></svg>`;
let step=0;
const STEPS=['Topic or thesis?','Build an introduction','Strong conclusion'];
function rail(){return `<div style="display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap">${STEPS.map((s,n)=>`<span class="chip" style="${n===step?'background:var(--navy);color:#fff':n<step?'background:var(--goodbg);color:var(--good)':'background:#eef1f7;color:var(--muted)'}">${n<step?'✓ ':(n+1)+'. '}${s}</span>`).join('')}</div>`}

/* ---------- Step 1 ---------- */
const TH={topic:'Topic',weak:'Thesis needs work',strong:'Strong thesis'};
const ts=[
{s:'Remote work and productivity',a:'topic',w:'This names a subject but makes no claim. A thesis must say something a reader could disagree with.'},
{s:'Companies should adopt four-day workweeks because pilot programs show higher productivity without lower output.',a:'strong',w:'It takes a clear, arguable position and previews the reason that supports it.'},
{s:'This paper will discuss social media and teenagers.',a:'topic',w:'An announcement of what the paper covers is still just a topic. State what you will argue about it.'},
{s:'Social media is bad for people.',a:'weak',w:'It is a position, but it is vague. Bad how, for whom, and why? Narrow it and add a reason.'},
{s:'Employers who ban social media at work lose more in trust than they gain in focus, so workplaces should replace bans with clear guidelines.',a:'strong',w:'Specific, arguable, and it points to the evidence you will need to provide.'},
{s:'Many people use cell phones every day.',a:'weak',w:'This is a fact few would dispute, so there is nothing to prove. Make a claim that invites disagreement.'}
];
let a=0,as=0;
function stepA(){
 if(a>=ts.length){step=1;return stepB();}
 setProg(a,ts.length+2);const it=ts[a];
 stage.innerHTML=`<div class="wrap">${rail()}<div class="card"><div class="meta"><span class="pill">Statement ${a+1} of ${ts.length}</span><span>Score: ${as}</span></div>
 <div style="display:flex;gap:12px;align-items:center"><svg viewBox="0 0 64 64" width="56" height="56" style="flex:none" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="#e3f3f2" stroke="#0e7c7b" stroke-width="3"/><circle cx="32" cy="32" r="15" fill="none" stroke="#14274e" stroke-width="3"/><circle cx="32" cy="32" r="5" fill="#f4b400"/></svg>
 <div><div class="lead" style="margin:0">Read the statement</div><h2 style="font-size:20px;margin:0">“${esc(it.s)}”</h2></div></div>
 <div class="btns c3">${Object.keys(TH).map(k=>`<button class="opt" data-k="${k}">${TH[k]}</button>`).join('')}</div><div id="fb" aria-live="polite"></div></div></div>`;
 stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const ok=b.dataset.k===it.a;if(ok)as++;
  stage.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.k===it.a)x.classList.add('right');else if(x===b)x.classList.add('wrong');});
  $('#fb').innerHTML=`<div class="fb ${ok?'':'no'}"><b>${ok?'✓ Correct':'✗ Not quite — this is a '+TH[it.a].toLowerCase()}</b>${esc(it.w)}</div><div class="row"><button class="primary" id="nx">Next →</button></div>`;
  $('#nx').onclick=()=>{a++;stepA();};$('#nx').focus();$('#fb').scrollIntoView({block:'nearest'});
 });toTop();
}

/* ---------- Step 2 ---------- */
const BL=[
{id:'thesis',t:'Because pilot programs report steady output and higher employee well-being, employers should adopt four-day workweeks.'},
{id:'dist',t:'In conclusion, the evidence shows employers should change their schedules.'},
{id:'hook',t:'What if the most productive workday of the week never had to happen?'},
{id:'context',t:'In recent years, several organizations have experimented with four-day workweeks while keeping pay the same.'}
];
const SL=[['hook','Hook','Grab attention',90],['context','Context','Orient the reader',64],['thesis','Thesis','State your position',38]];
let slots=[null,null,null],checked=false;
function stepB(){
 setProg(ts.length,ts.length+2);
 const used=slots.filter(Boolean);
 stage.innerHTML=`<div class="wrap">${rail()}<div class="card"><h2>Build an introduction</h2><p class="lead">An introduction narrows from a broad opening to a specific claim. Tap a sentence to place it in the next open slot. Tap a placed sentence to remove it. One sentence does not belong.</p>
 <div id="slots">${SL.map((s,n)=>{const b=BL.find(x=>x.id===slots[n]);const st=checked?(slots[n]===s[0]?'right':'wrong'):'';
  return `<button class="slot opt ${st}" data-n="${n}" style="width:100%;justify-content:flex-start;text-align:left;margin-bottom:6px;min-height:58px;font-weight:${b?500:600}" ${b&&!checked?'':(b?'disabled':'disabled')}><span style="color:var(--teal);flex:none;width:92px">${tri(s[3])}</span><span><b style="color:var(--navy)">${s[1]}</b> <span style="color:var(--muted);font-size:13px">· ${s[2]}</span><br>${b?esc(b.t):'<span style="color:var(--muted);font-weight:400">Empty slot</span>'}</span></button>`}).join('')}</div>
 <div style="font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px">Sentence bank</div>
 <div id="bank">${BL.filter(b=>!used.includes(b.id)).map(b=>`<button class="blk opt" data-id="${b.id}" ${checked?'disabled':''} style="width:100%;justify-content:flex-start;text-align:left;margin-bottom:6px;font-weight:500">${esc(b.t)}</button>`).join('')||'<span class="lead">All placed.</span>'}</div>
 <div id="fb" aria-live="polite"></div>
 <div class="row"><button class="ghost" id="rst">Reset</button><button class="primary" id="chk" ${slots.includes(null)||checked?'disabled':''}>Check order</button></div></div></div>`;
 stage.querySelectorAll('.blk').forEach(b=>b.onclick=()=>{const n=slots.indexOf(null);if(n>-1){slots[n]=b.dataset.id;stepB();}});
 stage.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{if(checked)return;slots[+b.dataset.n]=null;stepB();});
 $('#rst').onclick=()=>{slots=[null,null,null];checked=false;stepB();};
 $('#chk').onclick=()=>{
  checked=true;const good=SL.every((s,n)=>slots[n]===s[0]);stepB();
  $('#fb').innerHTML=`<div class="fb ${good?'':'no'}"><b>${good?'✓ Well built':'✗ Check the highlighted slots'}</b>${good?'The hook opens, the context orients, and the thesis closes the funnel. The “In conclusion” sentence belongs at the end of the paper.':'Hook first, context second, thesis last. The “In conclusion” sentence belongs in a conclusion, not an introduction.'}</div><div class="row"><button class="primary" id="nx">${good?'Continue →':'Try again'}</button></div>`;
  $('#nx').onclick=()=>{if(good){step=2;stepC();}else{slots=[null,null,null];checked=false;stepB();}};$('#nx').focus();$('#fb').scrollIntoView({block:'nearest'});
 };toTop();
}

/* ---------- Step 3 ---------- */
const CO=[
{id:'A',t:'In conclusion, this paper discussed four-day workweeks. Pilot programs report steady output and higher well-being, and employers should adopt four-day workweeks.',w:'It mostly repeats the thesis in the same words and stops there, with no significance and nothing left for the reader.'},
{id:'B',t:'Another factor is commuting costs, which this paper has not yet discussed. Commuting can cost workers hundreds of dollars a year.',w:'New evidence in the conclusion belongs in the body. A conclusion should wrap up your argument, not open a new one.'},
{id:'C',t:'Shorter weeks have held up in trials because focused time is more valuable than hours logged. If employers measure results instead of hours, they may find that less time at work produces better work and healthier teams.',w:'It restates the argument in fresh words, explains why it matters, and leaves the reader with something to consider.'}
];
let cd=false;
function stepC(){
 setProg(ts.length+1,ts.length+2);
 stage.innerHTML=`<div class="wrap">${rail()}<div class="card"><h2>Pick the strongest conclusion</h2><p class="lead">A conclusion restates the argument in fresh words, explains why it matters (“so what?”), and leaves the reader something to consider.</p>
 ${CO.map(c=>`<button class="opt co" data-id="${c.id}" style="width:100%;justify-content:flex-start;text-align:left;margin-bottom:8px;font-weight:500"><span style="flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">${c.id}</span><span>${esc(c.t)}</span></button>`).join('')}
 <div id="fb" aria-live="polite"></div></div></div>`;
 stage.querySelectorAll('.co').forEach(b=>b.onclick=()=>{
  const ok=b.dataset.id==='C',c=CO.find(x=>x.id===b.dataset.id);
  stage.querySelectorAll('.co').forEach(x=>{x.disabled=true;if(x.dataset.id==='C')x.classList.add('right');else if(x===b)x.classList.add('wrong');});
  $('#fb').innerHTML=`<div class="fb ${ok?'':'no'}"><b>${ok?'✓ Correct — option C':'✗ Not quite — option C is strongest'}</b>${esc(ok?CO[2].w:c.w+' Option C is stronger: '+CO[2].w)}</div><div class="row"><button class="primary" id="nx">Finish →</button></div>`;
  $('#nx').onclick=finish;$('#nx').focus();$('#fb').scrollIntoView({block:'nearest'});
 });toTop();
}
function finish(){
 setProg(1,1);
 stage.innerHTML=`<div class="wrap"><div class="card res"><h2>Activity complete</h2>
 <svg viewBox="0 0 300 70" width="260" height="62" aria-hidden="true"><polygon points="0,4 300,4 250,34 50,34" fill="#f4b400"/><polygon points="55,38 245,38 215,56 85,56" fill="#0e7c7b"/><polygon points="90,60 210,60 195,68 105,68" fill="#14274e"/></svg>
 <p class="lead">Thesis spotting: <b>${as}/${ts.length}</b>. You also built an introduction and chose a strong conclusion.</p>
 <div class="chips"><span class="chip">Intro: hook → context → thesis</span><span class="chip">Thesis: specific and arguable</span><span class="chip">Conclusion: fresh words + “so what?”</span></div>
 <button class="ghost" id="rs">Start over</button></div></div>`;
 $('#rs').onclick=()=>{a=0;as=0;slots=[null,null,null];checked=false;step=0;stepA();};
}
stepA();
</script></body></html>
