<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSCI 150 | Week 8: Exoplanet Research Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101b34; --ink2:#47536c; --paper:#f3f6fb; --line:#d3dcea; --night:#0a1126;
  --accent:#0f7f6e;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
/* One scroll container only: the page never scrolls, so there is no double scroll bar inside the Canvas iframe. */
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font:15px/1.45 var(--body)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;gap:16px;padding:10px 16px 0;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:9px;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font:800 21px/1 var(--display);letter-spacing:-.01em}
.brand span{display:block;font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{appearance:none;border:0;background:none;cursor:pointer;text-align:left;padding:7px 14px 8px;border-bottom:4px solid transparent;color:var(--ink2);border-radius:8px 8px 0 0}
.tab small{display:block;font-size:11.5px}
.tab strong{display:block;font:700 14px/1.2 var(--display)}
.tab:hover{background:#f0f4fa}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--tc)}
:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
.w4s:focus,.w4s:focus-visible,.w2mk:focus{outline:none}
.w4s:focus-visible .halo{opacity:1!important;stroke:#7fb4ff}
.w2mk:focus-visible circle{stroke:#7fb4ff;stroke-width:3}

/* ---------- panel layout ---------- */
.panel{display:grid;grid-template-columns:minmax(0,1fr) 345px;gap:14px;padding:14px;min-height:0;height:100%}
.panel[hidden]{display:none}
.stage{position:relative;display:flex;flex-direction:column;min-height:0;border-radius:20px;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 10%,#17224a 0%,#0a1126 60%,#060a18 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 1px 2px rgba(16,27,52,.12)}
.stage svg.main{flex:1;min-height:0;width:100%;display:block}
.stage svg text{font-family:var(--body)}
.side{min-height:0;display:flex;flex-direction:column;gap:9px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;padding-right:2px}
.side h2{font:800 22px/1.1 var(--display);letter-spacing:-.015em;margin:0}
.lede{margin:0;color:var(--ink2);font-size:14px}
.src{margin:auto 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2);line-height:1.35}
.src b{color:var(--ink)}

/* ---------- controls ---------- */
.ctl{display:grid;gap:2px}
.ctl label,.ctl .lab{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px}
.ctl output{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--accent);height:22px}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:-3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;line-height:1.3}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#e6ecf5;border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 8px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,27,52,.18)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:7px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn:hover{filter:brightness(1.08)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.read{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:13.5px}
.read dt{color:var(--ink2)}
.read dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.note{margin:0;font-size:13.5px}
.try{margin:0;font-size:13.5px;padding:8px 12px;border-left:4px solid var(--accent);background:#fff;border-radius:0 10px 10px 0}
.try b{color:var(--accent)}
.state{display:inline-block;color:#fff;border-radius:999px;padding:2px 11px;font-weight:700;font-size:13px}

/* week-2 gauge */
.bigT{display:flex;align-items:baseline;gap:6px}
.bigT span{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}
.bigT small{font-size:15px;color:var(--ink2);white-space:nowrap}
.gauge{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,#9cc7ee 0%,#9cc7ee 19.35%,#4fcf93 19.35%,#4fcf93 35.48%,#f2a45b 35.48%,#e0502a 100%);margin:6px 0 2px}
.gauge i{position:absolute;top:-5px;width:4px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-50%);transition:left .15s}
.gauge-l{position:relative;height:14px;font-size:11px;color:var(--ink2)}
.gauge-l span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* week-5 rail & timeline */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:0 12px 12px}
.rail button{appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#dbe4f7;border-radius:12px;padding:7px 4px 7px;cursor:pointer;font-size:12px;line-height:1.2;display:grid;justify-items:center;gap:5px}
.rail button i{width:14px;height:14px;border-radius:50%;display:block}
.rail button:hover{background:rgba(255,255,255,.12)}
.rail button[aria-current=step]{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.tl{position:relative;height:30px;margin:4px 6px 0}
.tl .bar{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,#ff7aa8,#ffb35a,#fff1a8,#ffb35a,#d1452e)}
.tl .mk{position:absolute;top:2px;transform:translateX(-50%);font-size:10.5px;color:var(--ink2);text-align:center;white-space:nowrap}
.tl .mk::after{content:"";display:block;width:2px;height:12px;background:var(--ink2);margin:0 auto;opacity:.6}
.tl .you{position:absolute;top:6px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink);transform:translateX(-50%);transition:left .15s}
.tl-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin:0 4px}

/* motion: only after a click, never on load; all off for reduced-motion users */
@media (prefers-reduced-motion:no-preference){
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .spin{animation:spin 2.4s linear infinite;transform-origin:320px 180px}
  .boom{animation:boom 1.9s ease-out infinite;transform-origin:320px 180px}
  .ring{animation:ring 2.6s ease-out infinite;transform-origin:320px 180px}
  .ping{animation:ping 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .lyr{transition:opacity .35s}
}
@keyframes pulse{50%{opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes boom{0%{transform:scale(.82);opacity:1}100%{transform:scale(1.04);opacity:.85}}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}

/* ---------- narrow screens: stack; the content area (not the page) scrolls ---------- */
@media (max-width:820px){
  .top{flex-wrap:wrap;gap:0}
  .tabs{margin-left:0;width:100%;overflow-x:auto}
  .tab{padding:6px 10px 7px;flex:1 0 auto}
  .brand span{display:none}
  .panel{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) minmax(0,1fr);gap:10px;padding:10px}
}
@media (max-height:620px) and (min-width:821px){ .side h2{font-size:19px} .lede{display:none} }
.wk{margin-left:auto;align-self:flex-end;padding:7px 14px 8px;border-bottom:4px solid var(--tc)}
.wk small{display:block;font-size:11.5px;color:var(--ink2)}
.wk strong{display:block;font:700 14px/1.2 var(--display)}
@media (max-width:820px){.wk{margin-left:auto;padding:4px 10px 6px}}
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#101b34"/><ellipse cx="17" cy="17" rx="13" ry="5" fill="none" stroke="#f2b84b" stroke-width="1.6" transform="rotate(-24 17 17)"/><circle cx="17" cy="17" r="5.5" fill="#f2b84b"/><circle cx="27" cy="11" r="2" fill="#7fb4ff"/></svg>
    <div><b>NSCI 150</b><span>Introduction to Astronomy/Lab</span></div>
  </div>
  <div class="wk" style="--tc:#2f5fd6"><small>Week 8</small><strong>Exoplanet Research</strong></div>
</header>

<main>
<section class="panel" id="w8" role="region" aria-label="NSCI 150 Week 8: Exoplanet Research" style="--accent:#2f5fd6">
  <div class="stage">
    <svg class="main" id="w8svg" viewBox="0 0 640 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="NSCI 150 Week 8 simulation of detecting an exoplanet by the transit method or the wobble method."></svg>
  </div>
  <div class="side">
    <h2>Catch a planet you can’t see</h2>
    <div class="seg" role="group" aria-label="Detection method"><button id="w8m1" aria-pressed="true">Transit</button><button id="w8m2" aria-pressed="false">Wobble</button></div>
    <div class="chips" role="group" aria-label="Example planets" id="w8chips"></div>
    <div class="ctl" id="c-r"><label for="w8r">Planet radius <output id="w8rv"></output></label><input type="range" id="w8r" min="0.5" max="15" step="0.1" value="11.2"></div>
    <div class="ctl" id="c-m" hidden><label for="w8mass">Planet mass <output id="w8mv"></output></label><input type="range" id="w8mass" min="0" max="100" step="0.5" value="85"></div>
    <div class="ctl"><label for="w8d">Distance from its star <output id="w8dv"></output></label><input type="range" id="w8d" min="0" max="100" step="0.5" value="40"></div>
    <div class="ctl" id="c-t"><label for="w8t">Orbit tilt <output id="w8tv"></output></label><input type="range" id="w8t" min="0" max="6" step="0.01" value="0"></div>
    <div class="card"><dl class="read" id="w8dl"></dl></div>
    <p class="note" id="w8msg" aria-live="polite"></p>
    <p class="try" id="w8try"></p>
    <p class="src"><b>NSCI 150 Week 8</b> · Deep Dive: Exoplanets, Habitability, and Scientific Reasoning. Sun-like star; visuals enlarged, numbers calculated.</p>
  </div>
</section>
</main>
</div>
<script>

/* =========================================================  shared helpers  ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function starfield(w,h,n,seed,maxr){const r=rng(seed);let s='';for(let i=0;i<n;i++){s+=`<circle cx="${(r()*w).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(0.3+r()*(maxr||1.2)).toFixed(2)}" fill="#fff" opacity="${(0.2+r()*0.6).toFixed(2)}"/>`}return s}
function kelvinRGB(K){const t=clamp(K,1000,40000)/100;let r,g,b;
  if(t<=66){r=255;g=99.4708025861*Math.log(t)-161.1195681661;b=t<=19?0:138.5177312231*Math.log(t-10)-305.0447927307}
  else{r=329.698727446*Math.pow(t-60,-0.1332047592);g=288.1221695283*Math.pow(t-60,-0.0755148492);b=255}
  return `rgb(${clamp(r,0,255)|0},${clamp(g,0,255)|0},${clamp(b,0,255)|0})`}
const starCol=T=>kelvinRGB(T<9000?T*0.86:T);
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const pow10=n=>'10'+String(n).split('').map(c=>SUP[c]).join('');
function svgPoint(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* =========================================================  WEEK 8  ========================================================= */
(function(){
  const svg=$('#w8svg');
  const RS_RE=109.1,AU_RS=215.03,MJ_ME=317.8;
  const SX=320,SY=108,SR=56;                        // star centre & radius (transit view)
  const CX0=70,CX1=610,CY0=246,CY1=346;             // chart box
  const S={mode:'transit',r:13.5,mv:72.4,dv:23.5,tilt:0,play:true};
  const massOfSlider=v=>Math.pow(10,v/100*3.0)*1;   // 1 ... 1000 Earth masses
  const dist=v=>Math.pow(10,-1.7+v/100*1.7);        // 0.02 ... 1 AU
  function overlap(z,k){if(z>=1+k)return 0;if(z<=Math.abs(1-k))return k<1?Math.PI*k*k:Math.PI;
    const k0=Math.acos((k*k+z*z-1)/(2*k*z)),k1=Math.acos((1-k*k+z*z)/(2*z));return k*k*k0+k1-0.5*Math.sqrt(Math.max(0,4*z*z-Math.pow(1+z*z-k*k,2)))}
  const flux=(z,k)=>1-overlap(z,k)/Math.PI;

  svg.innerHTML=`<defs>
    <radialGradient id="w8star" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7d0"/><stop offset=".6" stop-color="#ffd35a"/><stop offset="1" stop-color="#e9913a"/></radialGradient>
    <radialGradient id="w8halo"><stop offset="0" stop-color="#ffc24a" stop-opacity=".5"/><stop offset="1" stop-color="#ffc24a" stop-opacity="0"/></radialGradient>
    <linearGradient id="w8rain" x1="0" x2="1"><stop offset="0" stop-color="#7a3cff"/><stop offset=".2" stop-color="#3b6bff"/><stop offset=".4" stop-color="#2fc4ff"/><stop offset=".55" stop-color="#3ee27c"/><stop offset=".72" stop-color="#ffe44d"/><stop offset=".86" stop-color="#ff9b2f"/><stop offset="1" stop-color="#ff3b2f"/></linearGradient>
    <clipPath id="w8spclip"><rect x="410" y="74" width="210" height="42"/></clipPath>
    <clipPath id="w8chart"><rect x="${CX0}" y="${CY0-6}" width="${CX1-CX0}" height="${CY1-CY0+12}"/></clipPath>
    <filter id="w8b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <g>${starfield(640,600,110,5,1.1)}</g>
  <g transform="translate(0 110)"><g id="w8scene"></g>
  <g id="w8chartg"></g></g>`;
  const scene=$('#w8scene'),chartg=$('#w8chartg');

  function params(){
    const k=S.r/RS_RE,d=dist(S.dv),aRs=d*AU_RS,P=365.25*Math.pow(d,1.5);
    const b=aRs*Math.sin(S.tilt*Math.PI/180),T0=P*24/Math.PI/aRs;
    const ME=massOfSlider(S.mv),MJ=ME/MJ_ME,K=28.4*MJ*Math.pow(P/365.25,-1/3);
    const dens=5.51*ME/Math.pow(S.r,3);
    return{k,d,aRs,P,b,T0,ME,MJ,K,dens,depth:k*k,transits:b<1+k,dur:b<1+k?T0*Math.sqrt((1+k)*(1+k)-b*b):0};
  }
  const fmtH=h=>h>=48?(h/24).toFixed(1)+' days':h>=10?Math.round(h)+' hours':h.toFixed(1)+' hours';
  const fmtD=p=>p>=100?Math.round(p)+' days':p>=10?p.toFixed(0)+' days':p.toFixed(1)+' days';
  const fmtPct=x=>x>=1?x.toFixed(2)+'%':x>=0.1?x.toFixed(2)+'%':x>=0.01?x.toFixed(3)+'%':x.toFixed(4)+'%';
  const fmtK=k=>k>=10?k.toFixed(0):k>=1?k.toFixed(1):k.toFixed(2);

  /* static pieces drawn on param change */
  let P0=params(),curve=[];
  function rebuild(){
    P0=params();
    if(S.mode==='transit'){
      const N=300,W=1.8*P0.T0;curve=[];
      for(let i=0;i<=N;i++){const t=lerp(-W,W,i/N),u=2*t/P0.T0,z=Math.hypot(u,P0.b);curve.push([t,flux(z,P0.k)])}
    }
    drawChart();readouts();
  }
  function drawChart(){
    let h=`<rect x="${CX0}" y="${CY0-6}" width="${CX1-CX0}" height="${CY1-CY0+12}" rx="8" fill="#0d1636" stroke="#26335f"/>`;
    if(S.mode==='transit'){
      const D=Math.max(P0.depth,1e-6),yTop=1+0.12*D,yBot=1-1.35*D;
      const Y=f=>lerp(CY0,CY1,(yTop-f)/(yTop-yBot));
      const dec=P0.depth*100>=0.5?2:P0.depth*100>=0.05?3:4;
      h+=`<line x1="${CX0}" x2="${CX1}" y1="${Y(1)}" y2="${Y(1)}" stroke="#2c3a6c"/><text x="${CX0-6}" y="${Y(1)+4}" fill="#9fb0d0" font-size="11" text-anchor="end">100%</text>`;
      h+=`<line x1="${CX0}" x2="${CX1}" y1="${Y(1-D)}" y2="${Y(1-D)}" stroke="#4a5d9a" stroke-dasharray="4 5"/><text x="${CX0-6}" y="${Y(1-D)+4}" fill="#9fb0d0" font-size="11" text-anchor="end">${(100-D*100).toFixed(dec)}%</text>`;
      const W=1.8*P0.T0;
      [-1,0,1].forEach(m=>{const x=lerp(CX0,CX1,(m*P0.T0*0.9+W)/(2*W));h+=`<line x1="${x}" x2="${x}" y1="${CY1}" y2="${CY1+5}" stroke="#7d8fbd"/><text x="${x}" y="${CY1+19}" fill="#9fb0d0" font-size="11" text-anchor="middle">${m===0?'mid-transit':(m*P0.T0*0.9>0?'+':'−')+Math.abs(m*P0.T0*0.9).toFixed(1)+' h'}</text>`});
      h+=`<text x="${(CX0+CX1)/2}" y="${CY1+34}" fill="#dbe4f7" font-size="12.5" font-weight="700" text-anchor="middle">Star’s brightness over time</text>`;
      const pts=curve.map(([t,f])=>[lerp(CX0,CX1,(t+W)/(2*W)),Y(f)]);
      h+=`<path d="M${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')}" fill="none" stroke="#4f6cb0" stroke-width="2.2" clip-path="url(#w8chart)"/>`;
      h+=`<path id="w8trace" fill="none" stroke="#8fd0ff" stroke-width="3" clip-path="url(#w8chart)"/><circle id="w8dot" r="5.5" fill="#fff" stroke="#2f5fd6" stroke-width="2"/>`;
      if(!P0.transits)h+=`<text x="${(CX0+CX1)/2}" y="${(CY0+CY1)/2+4}" fill="#ffb2a3" font-size="14" font-weight="700" text-anchor="middle">No dip: the planet misses the star’s face</text>`;
    }else{
      const K=Math.max(P0.K,1e-3),Y=v=>lerp(CY1,CY0,(v/(1.25*K)+1)/2);
      h+=`<line x1="${CX0}" x2="${CX1}" y1="${Y(0)}" y2="${Y(0)}" stroke="#2c3a6c"/><text x="${CX0-6}" y="${Y(0)+4}" fill="#9fb0d0" font-size="11" text-anchor="end">0</text>`;
      h+=`<text x="${CX0-6}" y="${Y(K)+4}" fill="#ffb4a8" font-size="11" text-anchor="end">+${fmtK(K)}</text><text x="${CX0-6}" y="${Y(-K)+4}" fill="#a9c6ff" font-size="11" text-anchor="end">−${fmtK(K)}</text>`;
      h+=`<line x1="${CX0}" x2="${CX1}" y1="${Y(K)}" y2="${Y(K)}" stroke="#3b2f4f" stroke-dasharray="4 5"/><line x1="${CX0}" x2="${CX1}" y1="${Y(-K)}" y2="${Y(-K)}" stroke="#2a3f6a" stroke-dasharray="4 5"/>`;
      h+=`<text x="${CX1-6}" y="${CY0+10}" fill="#ffb4a8" font-size="10.5" text-anchor="end">moving away (red shift)</text><text x="${CX1-6}" y="${CY1-4}" fill="#a9c6ff" font-size="10.5" text-anchor="end">approaching (blue shift)</text>`;
      [0,.5,1].forEach(m=>{const x=lerp(CX0,CX1,m);h+=`<line x1="${x}" x2="${x}" y1="${CY1}" y2="${CY1+5}" stroke="#7d8fbd"/><text x="${x}" y="${CY1+19}" fill="#9fb0d0" font-size="11" text-anchor="middle">${m===0?'start':m===1?'1 orbit':'½ orbit'}</text>`});
      h+=`<text x="${(CX0+CX1)/2}" y="${CY1+34}" fill="#dbe4f7" font-size="12.5" font-weight="700" text-anchor="middle">Star’s speed along our line of sight (m/s), one orbit = ${fmtD(P0.P)}</text>`;
      let d='';for(let i=0;i<=120;i++){const f=i/120;d+=(i?' L':'M')+(lerp(CX0,CX1,f)).toFixed(1)+','+Y(P0.K*Math.cos(f*2*Math.PI)).toFixed(1)}
      h+=`<path d="${d}" fill="none" stroke="#4f6cb0" stroke-width="2.2"/><circle id="w8dot" r="5.5" fill="#fff" stroke="#2f5fd6" stroke-width="2"/>`;
    }
    chartg.innerHTML=h;
  }
  function readouts(){
    const p=P0;let dl='',msg='';
    if(S.mode==='transit'){
      dl=`<dt>Dip in brightness</dt><dd>${p.transits?fmtPct(p.depth*100):'none'}</dd><dt>Orbit time</dt><dd>${fmtD(p.P)}</dd><dt>Transit lasts</dt><dd>${p.transits?fmtH(p.dur):'none'}</dd><dt>Chance an orbit lines up</dt><dd>${(Math.min(1,(1+p.k)/p.aRs)*100).toFixed(p.aRs>50?2:1)}%</dd>`;
      if(!p.transits)msg='The orbit is tilted so the planet passes above the star. Transit surveys would never notice it.';
      else{const d=p.depth*100;msg=d>=0.1?'A dip this deep is easy to see, even from the ground.':d>=0.01?'A shallow dip: it takes a space telescope or great care.':'A tiny dip: only detectable by stacking many transits together.'}
    }else{
      dl=`<dt>Star’s speed change</dt><dd>${fmtK(p.K)} m/s</dd><dt>Orbit time</dt><dd>${fmtD(p.P)}</dd><dt>Planet mass</dt><dd>${p.MJ>=0.1?p.MJ.toFixed(2)+' Jupiters':p.ME.toFixed(1)+' Earths'}</dd>`;
      msg=p.K>=3?'Today’s spectrographs measure this wobble easily.':p.K>=1?'Near the limit of good spectrographs, which reach about 1 m/s.':p.K>=0.1?'Only the very best instruments (about 0.1 m/s) could notice this.':'Far too small to detect. Earth tugs the Sun by only about 0.1 m/s.';
    }
    const dn=p.dens;const type=dn>=3.5?'rocky':dn>=2?'mixed':'giant';
    dl+=`<dt>Density (size + mass)</dt><dd>${dn.toFixed(1)} g/cm³ (${type})</dd>`;
    $('#w8dl').innerHTML=dl;$('#w8msg').textContent=msg;
    $('#w8rv').textContent=S.r.toFixed(1)+' Earths wide';
    const me=massOfSlider(S.mv);$('#w8mv').textContent=me>=100?(me/MJ_ME).toFixed(2)+' Jupiters':me.toFixed(1)+' Earths';
    $('#w8dv').textContent=p.d.toFixed(2)+' AU';$('#w8tv').textContent=S.tilt.toFixed(2)+'°';
  }

  /* ---------- animation ---------- */
  let t0=performance.now(),phaseS=0.5;
  function frame(now){
    if(S.play&&!reduce)phaseS=((now-t0)/(S.mode==='transit'?7000:6000))%1;
    drawScene(phaseS);requestAnimationFrame(frame)}
  function drawScene(f){
    const p=P0;let h='';
    if(S.mode==='transit'){
      const W=1.8*p.T0,t=lerp(-W,W,f),u=2*t/p.T0,z=Math.hypot(u,p.b),fl=flux(z,p.k);
      const px=SX+u*SR,off=clamp(p.b*SR,0,98),py=SY-off,pr=Math.max(3.4,SR*p.k*1.6);
      h+=`<circle cx="${SX}" cy="${SY}" r="150" fill="url(#w8halo)"/><circle cx="${SX}" cy="${SY}" r="${SR}" fill="url(#w8star)"/>`;
      h+=`<line x1="${SX-210}" x2="${SX+210}" y1="${py}" y2="${py}" stroke="#7d8fbd" stroke-dasharray="3 6" opacity=".7"/>`;
      h+=`<circle cx="${px}" cy="${py}" r="${pr}" fill="#070b19" stroke="#3a4a7d" stroke-width="1"/>`;
      h+=`<text x="26" y="34" fill="#e8eefc" font-size="13" font-weight="700">${p.transits?'The planet crosses the star’s face':'The planet passes above the star'}</text>`;
      h+=`<text x="26" y="52" fill="#9fb0d0" font-size="11.5">Planet drawn larger than true scale</text>`;
      h+=`<text x="614" y="34" fill="#e8eefc" font-size="12.5" text-anchor="end" font-weight="700">Brightness ${(fl*100).toFixed(fl<0.9999?(p.depth*100<0.05?4:3):2)}%</text>`;
      scene.innerHTML=h;
      const dot=$('#w8dot');if(dot){const x=lerp(CX0,CX1,f),yTop=1+0.12*Math.max(p.depth,1e-6),yBot=1-1.35*Math.max(p.depth,1e-6);const y=lerp(CY0,CY1,(yTop-fl)/(yTop-yBot));dot.setAttribute('cx',x);dot.setAttribute('cy',y);
        const tr=$('#w8trace');if(tr){let d='';const n=Math.floor(f*curve.length);for(let i=0;i<=n&&i<curve.length;i++){const q=curve[i];d+=(i?' L':'M')+lerp(CX0,CX1,i/(curve.length-1)).toFixed(1)+','+lerp(CY0,CY1,(yTop-q[1])/(yTop-yBot)).toFixed(1)}tr.setAttribute('d',d)}}
    }else{
      const phi=f*2*Math.PI,R=84,cx=210,cy=108,K=p.K;
      const rw=clamp(5+35*(Math.log10(Math.max(K,0.05))+1.3)/3.6,4,40);
      const plx=cx+R*Math.cos(phi),ply=cy+R*Math.sin(phi),stx=cx-rw*Math.cos(phi),sty=cy-rw*Math.sin(phi);
      const rv=K*Math.cos(phi),shift=26*Math.tanh(rv/60);
      h+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#7d8fbd" stroke-dasharray="3 6" opacity=".7"/>`;
      h+=`<circle cx="${cx}" cy="${cy}" r="${rw}" fill="none" stroke="#ffd35a" stroke-dasharray="2 3" opacity=".6"/>`;
      h+=`<circle cx="${stx}" cy="${sty}" r="24" fill="url(#w8halo)" /><circle cx="${stx}" cy="${sty}" r="17" fill="url(#w8star)"/>`;
      h+=`<circle cx="${plx}" cy="${ply}" r="${clamp(4+Math.log10(Math.max(p.ME,1))*2,4,11)}" fill="#6b8be0" stroke="#dbe4f7" stroke-width="1"/>`;
      h+=`<g transform="translate(${cx} ${cy+R+22})"><circle r="8" fill="#3f86d8"/><path d="M-5,-3 q3,-4 7,-1 q1,5 -4,6z" fill="#4aa65b"/></g><text x="${cx+16}" y="${cy+R+26}" fill="#9fb0d0" font-size="11.5">Observer on Earth, looking up from below</text>`;
      h+=`<text x="26" y="30" fill="#e8eefc" font-size="13" font-weight="700">Top view: star and planet circle a shared center</text>`;
      h+=`<text x="26" y="48" fill="#9fb0d0" font-size="11.5">Star’s wobble enlarged</text>`;
      h+=`<text x="415" y="62" fill="#e8eefc" font-size="12.5" font-weight="700">Starlight spectrum</text>`;
      h+=`<rect x="410" y="74" width="210" height="42" rx="4" fill="url(#w8rain)"/>`;
      h+=`<g clip-path="url(#w8spclip)"><g transform="translate(${shift.toFixed(2)} 0)">${[440,478,514,555,586,598].map(x=>`<rect x="${x}" y="74" width="3" height="42" fill="#0a0e1e" opacity=".85"/>`).join('')}</g></g>`;
      [440,478,514,555,586,598].forEach(x=>{h+=`<path d="M${x-3},68 l3,5 l3,-5z" fill="#fff" opacity=".5"/>`});
      h+=`<text x="415" y="136" fill="#9fb0d0" font-size="11.5">Triangles: lines at rest</text>`;
      h+=`<text x="415" y="164" fill="${rv>=0?'#ffb4a8':'#a9c6ff'}" font-size="15" font-weight="700">${rv>=0?'+':'−'}${fmtK(Math.abs(rv))} m/s ${Math.abs(rv)<0.005?'':rv>0?'(moving away)':'(approaching)'}</text>`;
      scene.innerHTML=h;
      const dot=$('#w8dot');if(dot){const Y=v=>lerp(CY1,CY0,(v/(1.25*Math.max(K,1e-3))+1)/2);dot.setAttribute('cx',lerp(CX0,CX1,f));dot.setAttribute('cy',Y(rv))}
    }
  }

  /* ---------- wiring ---------- */
  const chips=$('#w8chips');
  const PRE=[['Earth-like',{r:1,mv:0,dv:100,t:0}],['Neptune-like',{r:3.9,mv:41,dv:60,t:0}],['Jupiter-like',{r:11.2,mv:83.5,dv:100,t:0}],['Hot Jupiter',{r:13.5,mv:72.4,dv:23.5,t:0}]];
  PRE.forEach(([n,p])=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.setAttribute('aria-pressed','false');b.onclick=()=>{S.r=p.r;S.mv=p.mv;S.dv=p.dv;S.tilt=p.t;sync();rebuild();mark(n)};chips.appendChild(b)});
  function mark(n){$$('.chip',chips).forEach(c=>c.setAttribute('aria-pressed',String(c.textContent===n)))}
  function sync(){$('#w8r').value=S.r;$('#w8mass').value=S.mv;$('#w8d').value=S.dv;$('#w8t').value=S.tilt}
  [['w8r','r'],['w8mass','mv'],['w8d','dv'],['w8t','tilt']].forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{S[k]=+e.target.value;mark('');rebuild()}));
  function setMode(m){S.mode=m;$('#w8m1').setAttribute('aria-pressed',String(m==='transit'));$('#w8m2').setAttribute('aria-pressed',String(m==='rv'));
    $('#w8try').innerHTML=m==='transit'?'<b>Think:</b> At 1 AU, tilt the orbit just 1°. The dip vanishes. How many planets do transit surveys miss?':'<b>Think:</b> Choose Earth-like. The wobble drops far below 1 m/s. Why are Earth twins so hard to find this way?';
    $('#c-r').hidden=m!=='transit';$('#c-t').hidden=m!=='transit';$('#c-m').hidden=m!=='rv';rebuild()}
  $('#w8m1').onclick=()=>setMode('transit');$('#w8m2').onclick=()=>setMode('rv');
  // Hot Jupiter is the default starting view (its transit is easy to see)
  S.r=13.5;S.mv=72.4;S.dv=23.5;sync();mark('Hot Jupiter');setMode('transit');
  if(reduce){phaseS=.5}
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
