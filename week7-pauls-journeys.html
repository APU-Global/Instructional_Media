<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paul’s Journeys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1f2a44;--ink2:#4a5675;--gold:#c8962e;--gold2:#f3dfae;--parch:#fbf6ea;--line:#e6dcc3;--sage:#3f7d6b;--rose:#a8433b;--sky:#3b6ea5;--white:#fff}
html,body{height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45}
.app{height:100vh;display:flex;flex-direction:column;background:var(--parch);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hdr{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(100deg,#1f2a44,#2f3e66);color:#fff}
.hdr svg{flex:0 0 auto;width:44px;height:44px}
.hdr h1{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700;line-height:1.15}
.hdr p{font-size:12.5px;color:#d9def0}
.tag{margin-left:auto;background:var(--gold);color:#1f2a44;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.main{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;padding:12px 16px;scrollbar-width:thin}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600}
.btn:hover{background:#2f3e66}.btn:disabled{opacity:.4;cursor:default}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{background:#fff;border:2px solid var(--line);border-radius:99px;padding:5px 14px;font-weight:600;font-size:14px;color:var(--ink2)}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(31,42,68,.08)}
.sr{position:absolute;left:-9999px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){.hdr p{display:none}.tag{display:none}}

.grid{display:flex;flex-direction:column;gap:8px;height:100%}
.col{display:flex;flex-direction:column;gap:8px;min-height:0}
.fig{border:2px solid var(--gold);border-radius:12px;background:#cfe3ee;overflow:hidden}
.fig svg{display:block;width:100%;height:100%}
.fig{flex:1 1 auto;min-height:150px;max-height:350px}
.stop{cursor:pointer}
.stop:focus-visible circle.hit{stroke:#1f2a44;stroke-width:4}
.info h3{font-family:Georgia,serif;font-size:18px;margin-bottom:2px}
.info .sub{font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.info p{font-size:14px;margin-bottom:6px}
.info{flex:0 0 auto}
.info .ask{font-size:13.5px;background:#fbf3df;border-left:4px solid var(--gold);padding:6px 10px;border-radius:0 8px 8px 0}
.ico{width:46px;height:46px;float:right;margin:0 0 4px 8px}
.nav{display:flex;gap:8px;align-items:center}
.nav .ct{flex:1;text-align:center;font-size:13px;color:var(--ink2);font-weight:600}
@media (max-width:700px){.grid{grid-template-columns:1fr;height:auto}}
</style></head><body>
<div class="app">
<header class="hdr"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#c8962e"/><path d="M10 14c5-2 10-1 14 2 4-3 9-4 14-2v21c-5-2-10-1-14 2-4-3-9-4-14-2z" fill="#fbf6ea"/><path d="M24 16v21" stroke="#c8962e" stroke-width="2"/><path d="M14 20h7M14 24h7M14 28h7M27 20h7M27 24h7M27 28h7" stroke="#b9ab86" stroke-width="1.4"/></svg><div><h1>Paul’s Journeys</h1><p>Travel from Antioch to Rome and notice how the message goes out</p></div><span class="tag">Week 7</span></header>
<main class="main" id="main">
<div class="grid">
 <div class="fig" id="map" role="group" aria-label="Map of Paul’s journeys from Antioch to Rome"></div>
 <div class="card info" id="info" aria-live="polite"></div>
 <div class="nav"><button class="btn alt" id="prev">‹ Previous stop</button><span class="ct" id="ct"></span><button class="btn" id="nxt">Next stop ›</button></div>
</div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const X=lon=>(lon-8)*21, Y=lat=>(46-lat)*21;
const poly=a=>a.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
const sea=[[8,43.6],[8.9,44.4],[10.2,43.6],[11,42.5],[12.3,41.7],[13.5,41.2],[14.3,40.8],[15.3,40],[16.1,38.9],[15.7,38],[16.5,38.4],[17.1,39],[16.6,39.7],[17.5,40.4],[18.5,40.1],[18,40.7],[16.8,41.2],[15.9,41.9],[14.5,42.2],[13.6,43.5],[12.5,44.2],[12.3,45.2],[13.6,45.7],[14.5,45],[15.5,44],[17,43.2],[18.5,42.4],[19.4,41.8],[19.5,40.5],[20,39.7],[20.7,39],[21.1,37.9],[21.6,37],[22.4,36.4],[23.1,36.5],[23,37.2],[23,37.9],[23.6,37.9],[24,37.7],[24.2,38.4],[23.5,38.9],[22.8,39.2],[22.9,40],[23.1,40.5],[23.7,39.9],[24.3,40.1],[24,40.5],[24.4,40.9],[26,40.8],[26.4,40.2],[26.2,39.8],[26.7,39.3],[26.9,38.6],[26.3,38.3],[27.3,38.4],[27.2,37.8],[27.4,37.3],[27.5,36.9],[28.3,36.7],[29.2,36.3],[30.5,36.2],[30.7,36.9],[31.5,36.6],[32.8,36],[33.8,36.2],[34.6,36.8],[35.8,36.7],[36,36],[35.8,35],[35.8,34],[35.4,33.3],[34.9,32.5],[34.5,31.8],[34.2,31.3],[33,31.1],[32.3,31.3],[31,31.6],[30,31.3],[29,30.9],[27.9,31.2],[26,31.6],[25,31.9],[23,32.7],[21.5,32.9],[20,32.1],[19.3,30.5],[18,30.3],[16.5,31.2],[15.2,32.3],[13.5,32.8],[11.5,33.2],[10,34],[10.8,35.5],[11,37],[10,37.3],[8.6,37],[8,36.9]];
const blk=[[28,41.9],[28.6,43.5],[29.7,45.2],[33,46],[40,46],[40,41],[35,42],[31,41.1],[28.5,41.2]];
const isl={sic:[[12.4,37.9],[13.3,38.2],[15.6,38.25],[15.1,36.7],[14.3,37],[12.5,37.6]],sar:[[8.2,41.1],[9.7,41],[9.6,39.1],[8.4,39],[8.2,40]],cre:[[23.5,35.5],[26.3,35.3],[26,35],[24,35.1]],cyp:[[32.3,35.1],[33.6,35.4],[34.5,35.7],[34,35],[32.9,34.6]],mal:[[14.2,36.05],[14.6,36.05],[14.5,35.85],[14.2,35.9]]};
const T=[
 {k:'ant',n:'Antioch',lon:36.2,lat:36.2,ref:'Acts 13:1-3',off:[-12,-4],ico:'flame',
  sub:'Sent by the Spirit',t:'The church in Antioch worships and fasts, and the Holy Spirit sets apart Barnabas and Saul for a new work. The message goes to both Jews and Gentiles.',q:'Notice how the mission begins in prayer and how a local church supports the work.'},
 {k:'jer',n:'Jerusalem Council',lon:35.6,lat:32.6,ref:'Acts 15',off:[-12,-3],ico:'scroll',
  sub:'Grace for all peoples',t:'Church leaders gather to decide whether Gentile believers must follow Jewish law. They conclude that “we will be saved through the grace of the Lord Jesus.”',q:'How do the leaders handle disagreement? What role do stories of what God is doing play?'},
 {k:'phi',n:'Philippi',lon:24.3,lat:41,ref:'Acts 13-20',off:[-4,-10],ico:'church',
  sub:'New churches form',t:'Paul travels to cities such as Philippi, and new churches form in each place. Look for the pattern of hope and opposition in each stop.',q:'What do you notice about how people respond to the message in each city?'},
 {k:'the',n:'Thessalonica',lon:23,lat:40.6,ref:'Acts 13-20',off:[-14,14],ico:'church',
  sub:'Hope and opposition',t:'Thessalonica is another city on Paul’s route where a new community of believers takes shape.',q:'What patterns repeat from city to city?'},
 {k:'ath',n:'Athens',lon:23.7,lat:38,ref:'Acts 17:22-31',off:[-6,20],ico:'columns',
  sub:'Same gospel, new audience',t:'In Athens Paul speaks about God to a philosophical audience. He adapts how he speaks to different audiences without changing the gospel.',q:'What changes about Paul’s approach here, and what stays the same?'},
 {k:'cor',n:'Corinth',lon:22.9,lat:37.9,ref:'Acts 13-20',off:[-26,-4],ico:'church',
  sub:'Another new church',t:'Corinth is one of the cities where Paul’s journeys lead to new churches taking root.',q:'Why might Luke list so many cities?'},
 {k:'eph',n:'Ephesus',lon:27.3,lat:37.9,ref:'Acts 13-20',off:[-8,-10],ico:'church',
  sub:'The message keeps spreading',t:'Ephesus is another stop on the journeys described in Acts 13-20, where Paul continues to teach and proclaim the message.',q:'How does the Spirit’s sending in Acts 13 shape how you read these later stops?'},
 {k:'jer2',n:'Jerusalem: arrest',lon:35.3,lat:31.4,ref:'Acts 21-26',off:[-12,9],ico:'chain',
  sub:'Bearing witness in custody',t:'Paul is arrested in Jerusalem and defends himself before several rulers. He appeals to Caesar.',q:'What does Luke show about Paul’s witness even while he is in custody?',skipDot:true},
 {k:'mal',n:'Shipwreck',lon:14.4,lat:35.95,ref:'Acts 27-28',off:[8,4],ico:'ship',
  sub:'God’s promises hold through danger',t:'Paul survives a shipwreck on the way to Rome. His witness continues through danger.',q:'What does Luke want readers to take from the voyage?'},
 {k:'rom',n:'Rome',lon:12.5,lat:41.9,ref:'Acts 28:30-31',off:[-6,-12],ico:'crown',
  sub:'An open ending',t:'Paul arrives in Rome “proclaiming the kingdom of God and teaching about the Lord Jesus Christ with all boldness and without hindrance.” The story does not close; it invites readers to continue it.',q:'Consider how your own story fits into God’s story.'}
];
const route=[T[0],T[1],T[2],T[3],T[4],T[5],T[6],T[7],T[8],T[9]];
const icons={
 flame:'<path d="M23 4c9 10 13 18 9 26-2 5-6 8-9 8s-7-3-9-8c-4-8 0-16 9-26z" fill="#e2574c"/><path d="M23 18c5 6 6 10 4 14-1 2-3 4-4 4s-3-2-4-4c-2-4-1-8 4-14z" fill="#f6c453"/>',
 scroll:'<rect x="9" y="6" width="28" height="34" rx="4" fill="#fff6dc" stroke="#c8962e" stroke-width="3"/><path d="M15 15h16M15 22h16M15 29h10" stroke="#8c6a43" stroke-width="2.5"/>',
 church:'<path d="M8 40V22l15-12 15 12v18z" fill="#d9a67a"/><path d="M23 2v10M18 6h10" stroke="#a8433b" stroke-width="3"/><rect x="19" y="28" width="8" height="12" fill="#6b4630"/>',
 columns:'<path d="M4 14L23 4l19 10z" fill="#c8962e"/><g fill="#e8dcc0"><rect x="8" y="16" width="6" height="22"/><rect x="20" y="16" width="6" height="22"/><rect x="32" y="16" width="6" height="22"/></g><rect x="4" y="38" width="38" height="5" fill="#a9824c"/>',
 chain:'<g fill="none" stroke="#5b4b8a" stroke-width="5"><rect x="5" y="16" width="20" height="14" rx="7"/><rect x="21" y="16" width="20" height="14" rx="7"/></g>',
 ship:'<path d="M6 28h34l-6 10H12z" fill="#8c6a43"/><path d="M23 6v22" stroke="#5b3f25" stroke-width="3"/><path d="M23 8l14 16H23z" fill="#fff6dc" stroke="#c8962e" stroke-width="2"/><path d="M2 42c6-4 10 4 16 0s10 4 16 0 8 2 12 0" fill="none" stroke="#3b6ea5" stroke-width="3"/>',
 crown:'<path d="M6 34V14l9 9 8-13 8 13 9-9v20z" fill="#f3c34a" stroke="#c8962e" stroke-width="2.5"/><rect x="6" y="34" width="34" height="6" fill="#c8962e"/>'
};
let i=0;
function build(){
 const W=X(40),Hh=Y(29);
 let s=`<svg viewBox="0 ${Y(43.5)} ${W} ${Y(30.7)-Y(43.5)}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${Hh}" fill="#e6d3a3"/><polygon points="${poly(sea)}" fill="#bcd9e8"/><polygon points="${poly(blk)}" fill="#bcd9e8"/>`;
 Object.values(isl).forEach(p=>s+=`<polygon points="${poly(p)}" fill="#e6d3a3" stroke="#c9ae74" stroke-width="1"/>`);
 s+=`<polygon points="${poly(sea)}" fill="none" stroke="#c9ae74" stroke-width="1.2"/>`;
 s+=`<g font-size="10" fill="#8c7a52" font-style="italic" letter-spacing="2"><text x="${X(24)}" y="${Y(33.6)}">Mediterranean Sea</text><text x="${X(31)}" y="${Y(43.8)}" fill="#6b92a8">Black Sea</text><text x="${X(30.5)}" y="${Y(39)}">ASIA MINOR</text><text x="${X(20.2)}" y="${Y(42.9)}" font-size="9">MACEDONIA</text><text x="${X(9.5)}" y="${Y(45.5)}">ITALY</text></g>`;
 const pts=route.map(t=>X(t.lon)+','+Y(t.lat)).join(' ');
 s+=`<polyline points="${pts}" fill="none" stroke="#a8433b" stroke-width="2.6" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
 const done=route.slice(0,i+1).map(t=>X(t.lon)+','+Y(t.lat)).join(' ');
 s+=`<polyline points="${done}" fill="none" stroke="#a8433b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>`;
 const seenKeys=new Set();
 T.forEach((t,n)=>{
  const x=X(t.lon),y=Y(t.lat),on=n===i,past=n<i;
  s+=`<g class="stop" tabindex="0" role="button" aria-label="Stop ${n+1}: ${t.n}" data-n="${n}"><circle class="hit" cx="${x}" cy="${y}" r="${on?10:7}" fill="${on?'#c8962e':past?'#a8433b':'#fff'}" stroke="${on?'#1f2a44':'#a8433b'}" stroke-width="2.5"/><text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="${on?10:8.5}" font-weight="700" fill="${on||past?'#fff':'#a8433b'}" ${on?'fill="#1f2a44"':''}>${n+1}</text><text x="${x+t.off[0]}" y="${y+t.off[1]}" text-anchor="${t.off[0]<-10?'end':'start'}" font-size="10.5" font-weight="700" fill="#1f2a44" stroke="#fff" stroke-width="3" paint-order="stroke">${t.n}</text></g>`;
 });
 s+=`</svg>`;
 $('map').innerHTML=s;
 $('map').querySelectorAll('.stop').forEach(g=>{
  const go=()=>{i=+g.dataset.n;render()};
  g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};
 });
}
function render(){
 build();const t=T[i];
 $('info').innerHTML=`<svg class="ico" viewBox="0 0 46 46" aria-hidden="true">${icons[t.ico]}</svg><h3>${i+1}. ${t.n}</h3><div class="sub">${t.sub} · ${t.ref}</div><p>${t.t}</p><div class="ask"><b>Notice:</b> ${t.q}</div>`;
 $('ct').textContent=`Stop ${i+1} of ${T.length}`;
 $('prev').disabled=i===0;$('nxt').disabled=i===T.length-1;
}
$('prev').onclick=()=>{i--;render()};$('nxt').onclick=()=>{i++;render()};
render();
</script>
</body></html>
