<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 5: Writing Arguments</title><style>
:root{--navy:#14274e;--teal:#0e7c7b;--gold:#f4b400;--ink:#1f2937;--muted:#566074;--bg:#f4f7fb;--card:#fff;--line:#d5dcea;
--good:#136c3a;--goodbg:#e4f4ea;--bad:#a8261b;--badbg:#fdeceb;--accent:#0e7c7b;--accentbg:#e3f3f2}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
.app{height:100%;display:flex;flex-direction:column}
header{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:#fff;padding:10px 18px 12px}
.hl{min-width:0}
.wk{display:inline-block;background:var(--gold);color:#14274e;font-weight:700;font-size:12px;letter-spacing:.08em;padding:2px 8px;border-radius:99px}
h1{margin:4px 0 0;font-size:clamp(18px,3.2vw,24px);line-height:1.15}
header p{margin:2px 0 0;font-size:14px;color:#d6def0}
.bn{flex:none;width:150px;height:62px}.bn svg{width:100%;height:100%;display:block}
.prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.18)}
.prog span{display:block;height:100%;width:0;background:var(--gold);transition:width .35s}
#stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 18px 18px;scrollbar-width:thin}
.wrap{max-width:880px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(20,39,78,.07)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px;gap:8px}
.pill{background:var(--accentbg);color:#0a5958;border-radius:99px;padding:2px 10px;font-weight:600;font-size:13px}
h2{margin:0 0 6px;font-size:19px;color:var(--navy)}
.lead{margin:0 0 10px;color:var(--muted)}
.btns{display:grid;gap:8px;margin-top:12px}
.btns.c3{grid-template-columns:repeat(3,1fr)}.btns.c2{grid-template-columns:repeat(2,1fr)}.btns.c4{grid-template-columns:repeat(4,1fr)}
button{font:inherit;cursor:pointer}
.opt{min-height:46px;padding:8px 10px;border:2px solid var(--line);background:#fff;border-radius:12px;color:var(--navy);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--accentbg)}
.opt:focus-visible,.primary:focus-visible,.ghost:focus-visible,.blk:focus-visible,.slot:focus-visible{outline:3px solid #1a5fd0;outline-offset:2px}
.opt.right{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt:disabled{cursor:default}
.primary{min-height:44px;padding:8px 20px;border:0;border-radius:99px;background:var(--navy);color:#fff;font-weight:700}
.primary:hover:not(:disabled){background:#0d1b38}.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{min-height:40px;padding:6px 16px;border:2px solid var(--navy);border-radius:99px;background:#fff;color:var(--navy);font-weight:700}
.fb{margin-top:12px;border-radius:12px;padding:10px 14px;border-left:6px solid var(--good);background:var(--goodbg)}
.fb.no{border-left-color:var(--bad);background:var(--badbg)}
.fb b{display:block;margin-bottom:2px}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.res{text-align:center}.res .big{font-size:44px;font-weight:800;color:var(--navy);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chip{background:var(--accentbg);border-radius:12px;padding:6px 12px;font-weight:600;color:#0a5958;font-size:14px}
mark{background:#ffe08a;border-radius:3px;padding:0 1px}
@media (max-width:620px){.bn{display:none}.btns.c3,.btns.c4{grid-template-columns:1fr}#stage{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><div class="app">
<header><div class="hl"><span class="wk">WEEK 5</span><h1>Appeals Detective</h1><p>Find the ethos, pathos, or logos in each excerpt.</p></div>
<div class="bn" aria-hidden="true"><svg viewBox="0 -2 150 68" xmlns="http://www.w3.org/2000/svg">
<polygon points="75,4 126,58 24,58" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
<circle cx="75" cy="8" r="9" fill="#f4b400"/><path d="M71 8l3 3 6-7" fill="none" stroke="#14274e" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="24" cy="56" r="9" fill="#e5484d"/><path d="M24 61c-6-4-8-7-8-10a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 3-2 6-8 10z" fill="#fff"/>
<circle cx="126" cy="56" r="9" fill="#0e7c7b"/><g fill="#fff"><circle cx="126" cy="56" r="4"/></g><g stroke="#fff" stroke-width="2"><line x1="126" y1="49" x2="126" y2="51"/><line x1="126" y1="61" x2="126" y2="63"/><line x1="119" y1="56" x2="121" y2="56"/><line x1="131" y1="56" x2="133" y2="56"/></g></svg></div>
<div class="prog" id="progbox" role="progressbar" aria-label="Activity progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="pbar"></span></div></header>
<main id="stage"></main></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const stage=$('#stage');
function setProg(n,t){$('#pbar').style.width=Math.round(100*n/t)+'%';$('#progbox').setAttribute('aria-valuenow',Math.round(100*n/t));}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toTop(){stage.scrollTop=0;}

const AP={
 ethos:{n:'Ethos',d:'Credibility & fairness',c:'#b8860b',bg:'#fff4d1',ic:'<svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#f4b400"/><path d="M14 25l7 7 13-16" fill="none" stroke="#14274e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'},
 pathos:{n:'Pathos',d:'Emotion & values',c:'#b42318',bg:'#fde7e7',ic:'<svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#e5484d"/><path d="M24 36c-10-7-12-12-12-16a6 6 0 0 1 12-2 6 6 0 0 1 12 2c0 4-2 9-12 16z" fill="#fff"/></svg>'},
 logos:{n:'Logos',d:'Logic & evidence',c:'#0a5958',bg:'#dff2f1',ic:'<svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#0e7c7b"/><g fill="#fff"><rect x="12" y="26" width="6" height="10"/><rect x="21" y="18" width="6" height="18"/><rect x="30" y="12" width="6" height="24"/></g></svg>'}
};
const items=[
{p:['As a nurse with twenty years in intensive care, ','I have seen what understaffing does to patients.'],clue:0,a:'ethos',w:'The writer builds trust by pointing to personal experience and expertise. That is credibility, or ethos.'},
{p:['Hospitals that kept one nurse for every four patients saw ','14% fewer readmissions','in a review of 300 hospitals.'],clue:1,a:'logos',w:'Specific numbers and a study stand in as evidence. That is reasoning from data, or logos.'},
{p:['','Picture a mother waiting alone in a hospital corridor at 3 a.m.,',' with no one coming to tell her whether her son will wake up.'],clue:1,a:'pathos',w:'A vivid scene meant to make readers feel concern. That is an emotional appeal, or pathos.'},
{p:['Our commission, ','made up of both critics and supporters of the plan,',' spent two years weighing the evidence before drawing conclusions.'],clue:1,a:'ethos',w:'Showing fairness and a balanced process makes the writer more trustworthy. Fairness builds ethos.'},
{p:['','If rates fall by two points, the budget saves $4 million; if they fall by three, it saves $6 million.',' The math is plain.'],clue:1,a:'logos',w:'A clear if-then calculation appeals to reason. That is logos.'},
{p:['','Every child deserves to walk into a school that feels like a home,',' not a warning.'],clue:1,a:'pathos',w:'This speaks to shared values and feelings about children and safety. That is pathos.'}
];
let i=0,score=0;const tally={ethos:[0,0],pathos:[0,0],logos:[0,0]};
function triangle(hl){
 const f=k=>(!hl||hl===k)?'1':'.3';
 return `<svg viewBox="0 0 220 150" width="190" aria-hidden="true"><polygon points="110,14 200,134 20,134" fill="#eef2fa" stroke="#14274e" stroke-width="3" stroke-linejoin="round"/>
 <g opacity="${f('ethos')}"><circle cx="110" cy="18" r="14" fill="#f4b400"/><path d="M103 18l5 5 9-11" fill="none" stroke="#14274e" stroke-width="3.5" stroke-linecap="round"/></g>
 <g opacity="${f('pathos')}"><circle cx="22" cy="132" r="14" fill="#e5484d"/><path d="M22 141c-8-5-10-9-10-12a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 3-2 7-10 12z" fill="#fff"/></g>
 <g opacity="${f('logos')}"><circle cx="198" cy="132" r="14" fill="#0e7c7b"/><g fill="#fff"><rect x="190" y="132" width="4" height="7"/><rect x="196" y="126" width="4" height="13"/><rect x="202" y="121" width="4" height="18"/></g></g>
 <text x="110" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#14274e">Ethos</text><text x="64" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#14274e">Pathos</text><text x="156" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#14274e">Logos</text>
 <text x="110" y="100" text-anchor="middle" font-size="10" fill="#566074">argument</text></svg>`;
}
function show(){
 if(i>=items.length)return done();
 const it=items[i];setProg(i,items.length);
 const txt=it.p.map((s,n)=>n===it.clue?`<span id="cl">${esc(s)}</span>`:esc(s)).join('');
 stage.innerHTML=`<div class="wrap"><div class="card"><div class="meta"><span class="pill">Excerpt ${i+1} of ${items.length}</span><span>Score: ${score}</span></div>
 <div class="ap" style="display:flex;gap:14px;align-items:center"><div style="flex:none" id="tri">${triangle('')}</div>
 <div><div class="lead" style="margin:0 0 4px">Which appeal is doing the most work here?</div><blockquote style="margin:0;padding:10px 14px;border-left:5px solid var(--navy);background:#eef2fa;border-radius:0 12px 12px 0;font-size:18px;font-family:Georgia,serif">“${txt}”</blockquote><div style="font-size:12px;color:var(--muted);margin-top:4px">Fictional practice excerpt</div></div></div>
 <div class="btns c3">${Object.keys(AP).map(k=>`<button class="opt" data-k="${k}" style="flex-direction:column;gap:2px">${AP[k].ic}<span>${AP[k].n}</span><span style="font-weight:400;font-size:13px;color:var(--muted)">${AP[k].d}</span></button>`).join('')}</div>
 <div id="fb" aria-live="polite"></div></div></div>`;
 stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b.dataset.k));toTop();
}
function pick(k){
 const it=items[i],ok=k===it.a;if(ok)score++;tally[it.a][1]++;if(ok)tally[it.a][0]++;
 stage.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.k===it.a)b.classList.add('right');else if(b.dataset.k===k)b.classList.add('wrong');});
 $('#cl').innerHTML='<mark>'+$('#cl').innerHTML+'</mark>';$('#tri').innerHTML=triangle(it.a);
 $('#fb').innerHTML=`<div class="fb ${ok?'':'no'}"><b>${ok?'✓ Correct — '+AP[it.a].n:'✗ Not quite — this is '+AP[it.a].n}</b>${esc(it.w)} The highlighted words are the clue.</div><div class="row"><button class="primary" id="nx">${i+1<items.length?'Next →':'See results →'}</button></div>`;
 $('#nx').onclick=()=>{i++;show();};$('#nx').focus();$('#fb').scrollIntoView({block:'nearest'});
}
function done(){
 setProg(1,1);
 stage.innerHTML=`<div class="wrap"><div class="card res"><h2>Activity complete</h2><div class="big">${score}/${items.length}</div>
 <div style="display:flex;justify-content:center">${triangle('')}</div>
 <div class="chips">${Object.keys(AP).map(k=>`<span class="chip" style="background:${AP[k].bg};color:#14274e">${AP[k].n}: ${tally[k][0]}/${tally[k][1]}</span>`).join('')}</div>
 <p class="lead">Strong arguments blend all three appeals to suit the audience and purpose. Try spotting them in the next article you read.</p>
 <button class="ghost" id="rs">Try again</button></div></div>`;
 $('#rs').onclick=()=>{i=0;score=0;for(const k in tally)tally[k]=[0,0];show();};
}
const st=document.createElement('style');st.textContent='@media (max-width:620px){.ap{flex-direction:column}}';document.head.appendChild(st);
show();
</script></body></html>
