<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Wants to Be a Millionaire: Signature Assignment Edition</title>
<style>
:root{box-sizing:border-box;--bg:#0a0f3c;--panel:#141b5e;--gold:#ffc83d;--ink:#fff;--mute:#aeb6ff;--ok:#2ecc71;--mid:#f39c12;--bad:#e74c3c;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#1d2a9c,var(--bg) 70%);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 190px;gap:16px}
@media(max-width:700px){.wrap{grid-template-columns:1fr}.ladder{order:-1;flex-direction:row!important;overflow-x:auto}.ladder div{flex:0 0 auto}}
h1{font-size:1.4rem;color:var(--gold);margin:0 0 4px;text-align:center;grid-column:1/-1}
.sub{text-align:center;color:var(--mute);grid-column:1/-1;margin:0 0 4px}
.card{background:var(--panel);border:2px solid var(--gold);border-radius:18px;padding:18px}
.part{color:var(--gold);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
h2{margin:6px 0 4px;font-size:1.25rem}
.prize{font-size:1.6rem;color:var(--gold);font-weight:bold}
label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:8px 0;border:1px solid #3b46b5;border-radius:999px 999px 999px 999px;border-radius:14px;cursor:pointer;background:#0d1450}
label:hover{border-color:var(--gold)}
label.dim{opacity:.3}
input{margin-top:4px;accent-color:var(--gold);width:18px;height:18px;flex:none}
button{font:inherit;background:var(--gold);color:#1a1a1a;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:bold;margin:4px 4px 0 0}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
button:disabled{opacity:.35;cursor:not-allowed}
.lifelines{margin:12px 0}
.msg{margin-top:12px;padding:12px;border-radius:12px;background:#0d1450;border-left:5px solid var(--gold)}
.msg.ok{border-color:var(--ok)}.msg.mid{border-color:var(--mid)}.msg.bad{border-color:var(--bad)}
textarea{width:100%;min-height:120px;background:#0d1450;color:#fff;border:1px solid var(--gold);border-radius:12px;padding:10px;font:inherit;font-size:.9rem}
.ladder{display:flex;flex-direction:column-reverse;gap:4px}
.ladder div{padding:6px 10px;border-radius:8px;font-size:.9rem;color:var(--gold);background:#0d1450;display:flex;justify-content:space-between;gap:8px}
.ladder .safe{color:#fff}
.ladder .cur{background:var(--gold);color:#111;font-weight:bold}
.ladder .done{background:#1f7a46;color:#fff}
.ladder .miss{background:#7a3b1f;color:#fff}
.rain{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.big{font-size:2.4rem;color:var(--gold);text-align:center}
@media(prefers-reduced-motion:reduce){.rain{display:none}}
</style></head><body>
<div class="wrap">
<h1>💰 Who Wants to Be a Millionaire? 💰</h1>
<p class="sub">Signature Assignment Edition · Parts A, B &amp; C · 35 points</p>
<main id="main"></main>
<aside class="ladder" id="ladder" aria-label="Prize ladder"></aside>
</div>
<script>
const PRIZES=[500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
const SAFE=[1,6];
const Q=[
["Part A · Foundation","Grade, Topic & Standards",2,["I named a specific grade level and a History/Social Science topic","I listed grade-appropriate ELA standards","I listed History/Social Science standards","I listed VAPA standards"],"Missing one of the three domains (ELA, HSS, VAPA) drops you to half credit."],
["Part A · Foundation","The Text Set (3–5 Resources)",2,["I chose 3 to 5 distinct resources","Informational, Motivational AND Multimodal types are all included (textbook pp. 126–127)","I explained how each resource builds content knowledge","I explained how each resource builds literacy development"],"Explanations that only talk about content, not literacy, earn half credit."],
["Part A · Foundation","Vocabulary Focus & Rationale",2,["I selected 4 to 6 high-impact words","I justified them with cross-curricular (Tier 2/3) utility","I discussed Greek/Latin word parts (morphology)"],"Use root words like 'dem-' or 'port-' to show morphology thinking."],
["Part A · Foundation","Vocabulary Activity Exemplar",2,["I designed a graphic organizer (e.g., Frayer Model)","I filled out ONE completed, high-quality student model","The exemplar matches my chosen vocabulary strategy"],"A blank template described in words is only half credit. Fill it in!"],
["Part A · Foundation","Anticipation Guide",2,["I wrote 5 to 7 Agree/Disagree statements","Statements target big ideas, misconceptions or themes","None is simple trivia a student could just look up"],"Opinion and theme statements spark critical thinking. Trivia does not."],
["Part B · Action Map","Arts Activities (VAPA)",5,["I outlined TWO distinct arts activities (music, drama or visual arts)","Each has 2–3 detailed paragraphs","Each explains step-by-step how it works","Each explicitly deepens history knowledge (not just a craft)"],"Only one activity, or under 2 paragraphs each, caps you at 2.5 points."],
["Part B · Action Map","Writing Activities",5,["I outlined TWO different writing genres (essay, poetry, letter...)","Each has 2–3 detailed paragraphs","I explained the operational steps for elementary writers","I explained how each targets historical analysis AND literacy growth"],"Explain the HOW of the writing process, not just the what."],
["Part B · Action Map","Field Trip Experience",3,["My virtual or physical field trip is highly purposeful","I explained its role and 'thematic power'","I described what students actually do on the trip","It anchors the unit's key historical concepts"],"A field trip that feels like an afterthought is half credit."],
["Part B · Action Map","Map Format & Creativity",2,["Polished slide deck or narrative with distinct headings","Formatting is consistent throughout","I added a relevant 'creative extra' (math activity, guest speaker, poster)"],"The creative extra must have instructional substance."],
["Part C · Deep Dive","Refinement & Polish",3,["I can point to revisions based on previous feedback","I fixed errors and vague details from earlier drafts","I filled instructional gaps and polished for professional quality"],"Superficial edits earn half credit. Show real revision."],
["Part C · Deep Dive","Unit Closure Activity",4,["I designed a final activity that wraps up the unit","It is a synthesis, not just a test or simple recap","I explicitly explain how it reinforces the unit's big ideas","It pulls together key elements learned across the unit"],"Explain the connection to big ideas explicitly. Do not leave it vague."],
["Final Tier · Million-Dollar Question","Final Compilation & Submission",3,["Parts A, B and C are in ONE cohesive deck or narrative","Transitions between parts are seamless","Formatting is professional and classroom-ready","I cross-checked every rubric and nothing is missing"],"Missing sections or disjointed formatting means half credit."]
];
const st={i:-1,res:[],checks:[],used:{},dim:false,box:null};
const $=id=>document.getElementById(id);
const fmt=n=>'$'+n.toLocaleString();
function ladder(){
 $('ladder').innerHTML=PRIZES.map((p,k)=>{let c=SAFE.includes(k)?'safe':'';
  if(st.res[k]!==undefined)c=st.res[k]>0?'done':'miss';else if(k===st.i)c='cur';
  return `<div class="${c}"><span>${k+1}</span><span>${fmt(p)}</span></div>`}).join('');
}
function start(){
 $('main').innerHTML=`<div class="card"><div class="big">🎬 Welcome, Candidate!</div>
 <p>Your Signature Assignment is due in two weeks. Open your working draft (slide deck or narrative) beside this window. Each question is a rubric criterion. Tick every box you can honestly prove in your draft, then lock in your answer.</p>
 <p><b>Lifelines</b> (one each): 🙋 <b>Ask the Expert</b> writes a chat question for your instructor. ✂️ <b>50/50</b> dims the extras so you focus on core standards. 📞 <b>Phone-a-Friend</b> drafts an email to a peer or host teacher.</p>
 <p>Full checklist = full points. Some boxes = half points. None = zero. Climb all 12 steps to reach <b>$1,000,000</b>!</p>
 <button onclick="next()">Enter the Hot Seat ▶</button></div>`;
 ladder();
}
function next(){st.i++;st.dim=false;st.box=null;render()}
function render(){
 if(st.i>=Q.length)return finish();
 const q=Q[st.i];st.checks[st.i]=st.checks[st.i]||[];
 const L=(k,t)=>`<button class="ghost" ${st.used[k]?'disabled':''} onclick="life('${k}')">${t}</button>`;
 $('main').innerHTML=`<div class="card"><div class="part">${q[0]} · Question ${st.i+1} of 12</div>
 <div class="prize">${fmt(PRIZES[st.i])}</div><h2>${q[1]} <small>(${q[2]} pts)</small></h2>
 <p>Can you prove each of these in your draft?</p>
 <div id="items">${q[3].map((t,k)=>`<label class="${st.dim&&k>1?'dim':''}"><input type="checkbox" ${st.checks[st.i][k]?'checked':''} onchange="st.checks[st.i][${k}]=this.checked">${t}</label>`).join('')}</div>
 <div class="lifelines">${L('expert','🙋 Ask the Expert')}${L('fifty','✂️ 50/50')}${L('friend','📞 Phone-a-Friend')}</div>
 <div id="box">${st.box||''}</div>
 <button onclick="lock()">🔒 Final Answer</button></div>`;
 ladder();
}
function copy(id){const t=$(id);t.select();navigator.clipboard&&navigator.clipboard.writeText(t.value).catch(()=>{});document.execCommand&&document.execCommand('copy')}
function life(k){
 st.used[k]=true;const q=Q[st.i];
 if(k==='fifty'){st.dim=true;st.box=`<div class="msg">✂️ Two core items remain bright. Nail these first, then circle back to the rest. Tip: ${q[4]}</div>`}
 if(k==='expert'){st.box=`<div class="msg">🙋 Paste this into the chat:<textarea id="t">Professor, I'm working on "${q[1]}" (${q[0]}). My question: what would a Highly Proficient example look like for this criterion?</textarea><button onclick="copy('t')">Copy</button></div>`}
 if(k==='friend'){st.box=`<div class="msg">📞 Draft email:<textarea id="t">Subject: Quick feedback on my Signature Assignment?\n\nHi! I'm finishing "${q[1]}" for my History/Social Science thematic unit. Could you look at that section and tell me whether it clearly shows: ${q[3][0].toLowerCase()}? Thank you so much!</textarea><button onclick="copy('t')">Copy</button></div>`}
 render();
}
function lock(){
 const q=Q[st.i],c=(st.checks[st.i]||[]).filter(Boolean).length,n=q[3].length;
 let pts=c===n?q[2]:c>0?q[2]/2:0;st.res[st.i]=pts;
 const cls=pts===q[2]?'ok':pts>0?'mid':'bad';
 const msg=pts===q[2]?`✅ Correct! Full ${q[2]} points. You bank ${fmt(PRIZES[st.i])}!`:pts>0?`🟠 Developing: ${pts} of ${q[2]} points. Fix the unchecked items before submitting. Hint: ${q[4]}`:`❌ Missing: 0 of ${q[2]} points. Hint: ${q[4]}`;
 if(pts===q[2])rain(12);
 $('main').innerHTML=`<div class="card"><div class="part">${q[1]}</div><div class="msg ${cls}">${msg}</div>
 <button onclick="next()">${st.i===Q.length-1?'See my results ▶':'Next question ▶'}</button>
 ${pts<q[2]?`<button class="ghost" onclick="st.res[st.i]=undefined;render()">↩ Revise and retry</button>`:''}</div>`;
 ladder();
}
function finish(){
 const tot=st.res.reduce((a,b)=>a+(b||0),0),max=35;
 const lines=Q.map((q,k)=>`${st.res[k]===q[2]?'[x]':'[ ]'} ${fmt(PRIZES[k])} · ${q[1]}: ${st.res[k]||0}/${q[2]}`).join('\n');
 const txt=`1 MILLION DOLLAR CHECKLIST\nSelf-audit score: ${tot}/${max}\n\n${lines}\n\nAll items verified against the Part A, B and C rubrics: ${tot===max?'YES':'NOT YET'}`;
 const win=tot===max;
 if(win)rain(60);
 $('main').innerHTML=`<div class="card"><div class="big">${win?'🏆 YOU ARE A MILLIONAIRE! 🏆':'💼 You walk away with '+tot+'/'+max+'!'}</div>
 <p style="text-align:center">${win?'Every rubric criterion is covered. Submit in Canvas!':'Revisit the orange or red items, then replay to lock in the million.'}</p>
 <textarea id="cl" readonly style="min-height:300px">${txt}</textarea>
 <button onclick="copy('cl')">📋 Copy checklist</button><button class="ghost" onclick="location.reload()">Play again</button>
 <p style="color:var(--mute);font-size:.9rem">Paste this checklist into your Canvas submission along with your deck or narrative.</p></div>`;
 ladder();
}
function rain(n){
 for(let k=0;k<n;k++){const e=document.createElement('div');e.className='rain';e.textContent=['💵','💰','🪙','💸'][k%4];
  e.style.left=Math.random()*100+'vw';e.style.animationDuration=(2+Math.random()*3)+'s';e.style.animationDelay=(Math.random()*1.5)+'s';
  document.body.appendChild(e);setTimeout(()=>e.remove(),7000)}
}
start();
</script></body></html>
