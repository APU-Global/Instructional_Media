<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Interactive | Culturally Responsive Literacy and Intervention Planning</title><style>*{box-sizing:border-box}
:root{--red:#a8353a;--red2:#d34147;--soft:#edebe8;--ink:#222;--line:#d9d4cd;--ok:#1f7a4d;--okbg:#e4f4ea;--bad:#b3261e;--badbg:#fdeceb;--accent:#2a6f97;--accentbg:#e5f0f7}
html,body{height:100%;margin:0;overflow:hidden;background:#fff}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer}
.app{height:100%;display:flex;flex-direction:column;background:#fff;min-height:0}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--red);color:#fff;flex-wrap:wrap}
.badge{background:#fff;color:var(--red);font-weight:700;border-radius:999px;padding:2px 12px;font-size:.85rem;white-space:nowrap}
.ttl{font-weight:700;font-size:1.05rem;flex:1;min-width:160px}
.dots{display:flex;gap:7px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:transparent;padding:0}
.dot.done{background:#fff}.dot.cur{box-shadow:0 0 0 3px rgba(255,255,255,.55);background:#ffd9d9}
.dot:disabled{opacity:.5;cursor:default}
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 20px;background:#fff;scrollbar-width:thin}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);background:var(--soft)}
.bar .lbl{flex:1;text-align:center;font-size:.88rem;color:#555}
.btn{border:2px solid var(--red);background:#fff;color:var(--red);border-radius:8px;padding:7px 18px;font-weight:600}
.btn:hover:not(:disabled){background:#fbeeee}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover:not(:disabled){background:#8c2a2f}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
.split{display:grid;grid-template-columns:minmax(220px,38%) 1fr;gap:20px;align-items:start}
.art{background:var(--accentbg);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.art svg{width:100%;height:auto;max-height:300px}
.art .cap{font-size:.82rem;color:#444;text-align:center}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.7rem;margin:0 0 6px;color:var(--red)}
h2{font-family:Georgia,"Times New Roman",serif;font-size:1.25rem;margin:0 0 8px}
h3{margin:0 0 4px;font-size:1rem}
p{margin:0 0 8px}
.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:4px}
.goals{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:7px}
.goals li{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:10px;padding:8px 12px}
.goals .ic{font-size:1.2rem;line-height:1.2}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;gap:10px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;width:100%;align-items:flex-start;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accentbg)}
.opt .ltr{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);font-weight:700;display:grid;place-items:center;font-size:.85rem}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .ltr{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg);opacity:.85}.opt.bad .ltr{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{min-height:44px;border-radius:10px;padding:8px 12px;margin:6px 0;font-size:.95rem}
.fb.ok{background:var(--okbg);border-left:5px solid var(--ok)}
.fb.bad{background:var(--badbg);border-left:5px solid var(--bad)}
.fb.empty{background:transparent;border-left:5px solid transparent}
.qhead{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ctx{background:var(--soft);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:.95rem}
.ctx.quote{font-style:italic;border-left:5px solid var(--red2)}
.sortcols{display:grid;gap:10px;margin-top:10px}
.col{border:2px dashed var(--line);border-radius:12px;background:#fff;padding:8px;text-align:left;min-height:120px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.col:hover:not(:disabled){border-color:var(--accent);background:var(--accentbg)}
.col:disabled{cursor:default}
.col .chd{font-weight:700;display:flex;gap:6px;align-items:center}
.col .cds{font-size:.8rem;color:#555}
.chip{font-size:.78rem;background:var(--okbg);border:1px solid #bfe2cc;border-radius:8px;padding:3px 7px}
.card{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:14px 16px;font-size:1.05rem;box-shadow:0 3px 0 rgba(0,0,0,.08);display:flex;gap:12px;align-items:center}
.card.shake{animation:shake .35s;border-color:var(--bad)}
.card.good{border-color:var(--ok);background:var(--okbg)}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.checks{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;background:var(--soft);padding:8px 12px;border-radius:10px;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--red)}
.scorebox{display:flex;gap:14px;align-items:center;background:var(--accentbg);border-radius:12px;padding:10px 14px;margin:10px 0}
.scorebox .big{font-size:2rem;font-weight:800;color:var(--accent)}
.take{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0}
.take div{border:2px solid var(--line);border-radius:12px;padding:9px 12px}
.take b{color:var(--red);display:block}
table.plan{width:100%;border-collapse:collapse;font-size:.9rem;margin:8px 0}
table.plan th,table.plan td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.plan th{background:var(--soft);width:28%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px;color:#fff;background:var(--accent);margin-right:6px}
.tag.s{background:#2a6f97}.tag.d{background:#7a4ea3}.tag.i{background:#2f7d5b}.tag.a{background:#c26a1b}
@media (max-width:720px){.split{grid-template-columns:1fr}.art svg{max-height:190px}.stage{padding:12px}h1{font-size:1.4rem}.ttl{font-size:.95rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><script>const $=(s,r=document)=>r.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const App={steps:[],idx:0,done:{},right:0,total:0,cfg:null,cache:{}};
function kid(skin,hair,shirt,size=56){return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="${shirt}" opacity=".18"/><path d="M12 64c2-14 12-20 20-20s18 6 20 20z" fill="${shirt}"/><circle cx="32" cy="30" r="13" fill="${skin}"/><path d="M18 28c0-12 8-16 15-16s14 5 13 16c-3-6-8-8-14-8s-11 2-14 8z" fill="${hair}"/><circle cx="27" cy="31" r="1.6" fill="#222"/><circle cx="37" cy="31" r="1.6" fill="#222"/><path d="M27 37q5 4 10 0" stroke="#222" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`}
function init(cfg){
  App.cfg=cfg;App.steps=cfg.steps;
  document.title=cfg.title;
  document.documentElement.style.setProperty('--accent',cfg.accent);
  document.documentElement.style.setProperty('--accentbg',cfg.accentbg);
  document.body.innerHTML=`<div class="app"><header class="top"><span class="badge">Week ${cfg.week}</span><span class="ttl">${cfg.title}</span><nav class="dots" id="dots" aria-label="Progress"></nav></header><main class="stage" id="stage" tabindex="-1"></main><footer class="bar"><button class="btn" id="back">&larr; Back</button><span class="lbl" id="lbl"></span><button class="btn primary" id="next">Next &rarr;</button></footer></div>`;
  $('#back').onclick=()=>go(App.idx-1);$('#next').onclick=()=>go(App.idx+1);
  go(0);
}
function go(i){
  if(i<0||i>=App.steps.length)return;
  App.idx=i;const s=App.steps[i];const st=$('#stage');st.innerHTML='';
  const panel=document.createElement('div');st.appendChild(panel);
  const api={complete(){App.done[i]=true;nav()},record(ok){App.total++;if(ok)App.right++}};
  if(s.auto||App.done[i])App.done[i]=true;
  s.render(panel,api);st.scrollTop=0;nav();
}
function nav(){
  const i=App.idx,n=App.steps.length;
  $('#dots').innerHTML=App.steps.map((s,k)=>`<button class="dot ${App.done[k]?'done':''} ${k===i?'cur':''}" aria-label="Step ${k+1}: ${s.name}" ${k===i?'aria-current="step"':''} ${(App.done[k]||k<=i||App.done[k-1])?'':'disabled'} data-k="${k}"></button>`).join('');
  document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.k));
  $('#back').disabled=i===0;
  const nx=$('#next');nx.disabled=i===n-1||!App.done[i];nx.style.visibility=i===n-1?'hidden':'visible';
  $('#lbl').textContent=`Step ${i+1} of ${n}: ${App.steps[i].name}`+((!App.done[i]&&i<n-1)?'  \u2022  finish this activity to continue':'');
}
function split(el,art,cap){el.innerHTML=`<div class="split"><div class="art">${art}${cap?`<div class="cap">${cap}</div>`:''}</div><div class="work"></div></div>`;return $('.work',el)}
function intro(el,o){
  const w=split(el,o.art,o.cap);
  w.innerHTML=`<div class="kicker">${o.kicker}</div><h1>${o.title}</h1><p>${o.text}</p><h3>In this interactive you will:</h3><ul class="goals">${o.goals.map(g=>`<li><span class="ic" aria-hidden="true">${g[0]}</span><span>${g[1]}</span></li>`).join('')}</ul><p style="margin-top:10px;font-size:.88rem;color:#555">Takes about 10&ndash;15 minutes. Use the Next button or the dots above to move through.</p>`;
}
/* ---- Multiple choice engine ---- */
function mc(el,api,cfg){
  let qi=0;const collected=[];const n=cfg.qs.length;
  function show(){
    const q=cfg.qs[qi];let tried=false;
    const opts=cfg.noShuffle?q.o:shuffle(q.o);
    el.innerHTML=`<div class="qhead"><span>${cfg.label||'Question'} ${qi+1} of ${n}</span><span>${cfg.sub||''}</span></div><div class="prog"><i style="width:${qi/n*100}%"></i></div>${q.ctx?`<div class="ctx ${q.quote?'quote':''}">${q.ctx}</div>`:''}<h2>${q.p}</h2><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="ltr">${'ABCD'[k]}</span><span>${o.t}</span></button>`).join('')}</div><div class="fb empty" aria-live="polite" role="status"></div><div class="row" id="ct"></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.k];const fb=$('.fb',el);
      if(o.ok){
        if(!tried)api.record(true);
        el.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('ok');
        fb.className='fb ok';fb.innerHTML='<b>\u2713 Yes.</b> '+o.fb;
        collected.push({slot:q.slot,t:o.t});
        const last=qi===n-1;
        $('#ct',el).innerHTML=`<button class="btn primary" id="cn">${last?(cfg.finish||'Finish'):'Next question'} &rarr;</button>`;
        $('#cn',el).onclick=()=>{if(last)finish();else{qi++;show()}};$('#cn',el).focus();
      }else{
        if(!tried){api.record(false);tried=true}
        b.disabled=true;b.classList.add('bad');fb.className='fb bad';fb.innerHTML='<b>Not quite.</b> '+o.fb+' Try another choice.';
      }
    });
  }
  function finish(){
    api.complete();
    el.innerHTML=`<div class="prog"><i style="width:100%"></i></div><h2>\u2705 ${cfg.doneTitle||'Activity complete'}</h2>${cfg.summary?cfg.summary(collected):''}<p>${cfg.doneText||'Select <b>Next</b> to continue.'}</p>`;
    if(cfg.afterFinish)cfg.afterFinish(el,collected);
  }
  show();
}
/* ---- Sorter engine ---- */
function sorter(el,api,cfg){
  let i=0;const items=shuffle(cfg.items);const placed={};cfg.buckets.forEach(b=>placed[b.id]=[]);let tried=false,locked=false;
  const cols=cfg.buckets.length;
  function draw(){
    const it=items[i];
    el.innerHTML=`<div class="qhead"><span>${cfg.label||'Sort'} ${Math.min(i+1,items.length)} of ${items.length}</span><span>${cfg.sub||'Tap the group it belongs in'}</span></div><div class="prog"><i style="width:${i/items.length*100}%"></i></div>
    <div class="card" id="card">${it.icon?`<span style="flex:none">${it.icon}</span>`:''}<span>${it.t}</span></div>
    <div class="fb empty" aria-live="polite" role="status"></div>
    <div class="row" id="ct"></div>
    <div class="sortcols" style="grid-template-columns:repeat(auto-fit,minmax(${cols>3?150:170}px,1fr))">${cfg.buckets.map(b=>`<button class="col" data-b="${b.id}" style="border-color:${b.color}"><span class="chd" style="color:${b.color}">${b.icon||''} ${b.label}</span><span class="cds">${b.desc||''}</span>${placed[b.id].map(t=>`<span class="chip">${t}</span>`).join('')}</button>`).join('')}</div>`;
    tried=false;locked=false;
    el.querySelectorAll('.col').forEach(c=>c.onclick=()=>{
      if(locked)return;const fb=$('.fb',el),card=$('#card',el);
      if(c.dataset.b===it.b){
        if(!tried)api.record(true);locked=true;
        placed[it.b].push(it.short||it.t.slice(0,38)+(it.t.length>38?'\u2026':''));
        card.classList.add('good');fb.className='fb ok';fb.innerHTML='<b>\u2713 Right.</b> '+it.why;
        const last=i===items.length-1;
        const cl=$('.col[data-b="'+it.b+'"]',el);cl.insertAdjacentHTML('beforeend',`<span class="chip">${placed[it.b].slice(-1)[0]}</span>`);
        $('#ct',el).innerHTML=`<button class="btn primary" id="cn">${last?'Finish':'Next card'} &rarr;</button>`;
        $('#cn',el).onclick=()=>{i++;if(i>=items.length)end();else draw()};$('#cn',el).focus();
      }else{
        if(!tried){api.record(false);tried=true}
        card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
        fb.className='fb bad';fb.innerHTML='<b>Not quite.</b> '+(it.hint||'Think about the purpose and try another group.');
      }
    });
  }
  function end(){api.complete();el.innerHTML=`<div class="prog"><i style="width:100%"></i></div><h2>\u2705 ${cfg.doneTitle||'All sorted!'}</h2><p>${cfg.doneText||'Select <b>Next</b> to continue.'}</p><div class="sortcols" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${cfg.buckets.map(b=>`<div class="col" style="border-color:${b.color};border-style:solid"><span class="chd" style="color:${b.color}">${b.icon||''} ${b.label}</span>${placed[b.id].map(t=>`<span class="chip">${t}</span>`).join('')}</div>`).join('')}</div>`}
  draw();
}
/* ---- Summary screen ---- */
function summary(el,api,o){
  api.complete();
  const pct=App.total?Math.round(App.right/App.total*100):100;
  el.innerHTML=`<div class="kicker">Wrap-up</div><h1>${o.title}</h1>
  <div class="scorebox"><div class="big">${App.right}/${App.total}</div><div><b>First-try accuracy: ${pct}%</b><br><span style="font-size:.9rem">Missing a choice is part of learning &mdash; the feedback is the point. Use the dots above to revisit any activity.</span></div></div>
  <h3>Key takeaways</h3><div class="take">${o.takeaways.map(t=>`<div><b>${t[0]}</b>${t[1]}</div>`).join('')}</div>
  <h3>${o.checkTitle}</h3><ul class="checks">${o.checks.map((c,k)=>`<li><label><input type="checkbox"> <span>${c}</span></label></li>`).join('')}</ul>
  <div class="row"><button class="btn" id="restart">\u21BA Restart this interactive</button></div>`;
  $('#restart',el).onclick=()=>{App.done={};App.right=0;App.total=0;go(0)};
}
function copyText(txt,btn){
  const done=()=>{const o=btn.textContent;btn.textContent='\u2713 Copied';setTimeout(()=>btn.textContent=o,1500)};
  try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
  function fallback(){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){btn.textContent='Select & copy manually'}t.remove()}
}

const heroHome=`<svg viewBox="0 0 360 280" role="img" aria-label="A home and a school connected by a heart bridge, with greeting bubbles in two languages"><rect y="220" width="360" height="60" fill="#8bc34a" opacity=".45"/><g><rect x="30" y="140" width="90" height="80" fill="#fff" stroke="#c26a1b" stroke-width="4"/><path d="M20 142l55-50 55 50z" fill="#c26a1b"/><rect x="62" y="168" width="26" height="52" fill="#c26a1b"/><rect x="40" y="154" width="18" height="18" fill="#ffd9a8"/></g><g><rect x="240" y="130" width="100" height="90" fill="#fff" stroke="#a8353a" stroke-width="4"/><path d="M232 132h116l-58-36z" fill="#a8353a"/><rect x="278" y="176" width="24" height="44" fill="#a8353a"/><rect x="252" y="146" width="16" height="16" fill="#ffd9a8"/><rect x="312" y="146" width="16" height="16" fill="#ffd9a8"/><path d="M290 96V66" stroke="#444" stroke-width="3"/><path d="M290 66h24l-6 8 6 8h-24z" fill="#c26a1b"/></g><path d="M120 190q60-70 120-10" fill="none" stroke="#c26a1b" stroke-width="5" stroke-dasharray="8 6"/><path d="M180 150c-12-14-32-4-24 10 6 10 24 18 24 18s18-8 24-18c8-14-12-24-24-10z" fill="#d34147"/><g font-size="13" font-weight="700" text-anchor="middle"><rect x="20" y="30" width="90" height="34" rx="14" fill="#fff" stroke="#c26a1b" stroke-width="2"/><text x="65" y="52" fill="#c26a1b">¡Hola!</text><rect x="250" y="26" width="90" height="34" rx="14" fill="#fff" stroke="#a8353a" stroke-width="2"/><text x="295" y="48" fill="#a8353a">Hello!</text></g></svg>`;
const O=(t,ok,fb)=>({t,ok,fb});
const W7=[
 {name:'Welcome',auto:1,render:el=>intro(el,{art:heroHome,cap:'Belonging supports learning.',kicker:'Deep Dive \u2022 Week 7',title:'Culturally Responsive Literacy & Intervention Planning',text:'Students learn best in classrooms that recognize their identities and experiences. Literacy plans should reflect both what students need and who they are.',goals:[['💬','Rewrite deficit language into asset-based language.'],['🤝','Respond to real classroom and family scenarios.'],['📋','Build a reading intervention chart for Luis.'],['🤖','Evaluate an AI-generated plan critically.']]})},
 {name:'Asset-based language',render:(el,api)=>{const w=split(el,`<svg viewBox="0 0 240 230" role="img" aria-label="Two speech bubbles: a red crossed-out deficit statement and a green asset-based statement"><rect x="12" y="14" width="200" height="64" rx="16" fill="#fff" stroke="#b3261e" stroke-width="3"/><text x="112" y="40" text-anchor="middle" font-size="13" fill="#b3261e" font-weight="700">&ldquo;He can&rsquo;t&hellip;&rdquo;</text><text x="112" y="60" text-anchor="middle" font-size="12" fill="#444">Deficit thinking</text><path d="M24 24l176 44" stroke="#b3261e" stroke-width="3"/><path d="M104 88v26M96 106l8 10 8-10" stroke="#444" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="28" y="126" width="200" height="82" rx="16" fill="#fff" stroke="#1f7a4d" stroke-width="3"/><text x="128" y="152" text-anchor="middle" font-size="13" fill="#1f7a4d" font-weight="700">&ldquo;He can&hellip; and he&rsquo;s building&hellip;&rdquo;</text><text x="128" y="172" text-anchor="middle" font-size="12" fill="#444">Asset-based thinking</text><text x="128" y="192" text-anchor="middle" font-size="12" fill="#444">Funds of knowledge</text></svg>`,'Words shape how we plan');
   mc(w,api,{label:'Rewrite',sub:'Choose the asset-based version',doneTitle:'Assets first',

   {ctx:'&ldquo;Luis is an ELL who can\u2019t read at grade level.&rdquo;',quote:1,p:'Which rewrite is <b>asset-based</b> and accurate?',o:[O('Luis reads fluently in Spanish and is building English decoding skills.',1,'It names his biliteracy as a strength and describes the skill being built.'),O('Luis is a low reader, but he tries hard.',0,'This still centers a deficit and a vague label.'),O('Luis is limited English proficient and needs remediation.',0,'Both terms frame him by what he lacks.'),O('Luis has a language problem.',0,'This pathologizes a multilingual learner.')]},
   {ctx:'&ldquo;Her family doesn\u2019t care about school.&rdquo;',quote:1,p:'Which rewrite is asset-based?',o:[O('Her family has not been able to attend daytime events, so I will ask how they would like to connect and offer flexible options.',1,'It assumes care, asks the family, and widens access.'),O('Her family is uninvolved.',0,'It labels the family without evidence.'),O('Send worksheets home instead of inviting the family in.',0,'This removes partnership rather than building it.'),O('Parents of struggling readers rarely engage.',0,'This is a generalization.')]},
   {ctx:'&ldquo;These kids come in with no background knowledge.&rdquo;',quote:1,p:'Which rewrite is asset-based?',o:[O('Students bring rich knowledge from home and community; I will ask about it and connect it to the text.',1,'That is the funds-of-knowledge approach: build on what students bring.'),O('Students need to be filled up with knowledge first.',0,'This is deficit thinking.'),O('Students lack the experiences of other classes.',0,'It compares students rather than naming assets.'),O('Students need easier texts until they catch up.',0,'This lowers rigor without building on strengths.')]},
   {ctx:'&ldquo;He\u2019s a behavior problem during reading.&rdquo;',quote:1,p:'Which rewrite reflects a <b>trauma-informed</b> view?',o:[O('He becomes unsettled during unpredictable reading tasks, so I will try predictable routines, choices and a trusted check-in.',1,'This describes the situation and plans supportive routines and relationships.'),O('He needs stricter consequences when reading is hard.',0,'This can increase fear and shut-down.'),O('He just wants attention.',0,'This assumes motive instead of looking at needs.'),O('He should be removed from reading groups.',0,'Exclusion removes access to instruction.')]}]})}},
 {name:'Families & belonging',render:(el,api)=>{const w=split(el,heroHome,'Partner with families and colleagues');
   mc(w,api,{label:'Scenario',sub:'Pick the strongest response',doneTitle:'Belonging supports learning',
   qs:[
   {ctx:'A student often shuts down during surprise partner reading.',p:'Which routine fits a culturally responsive and trauma-informed approach? <i>(TPE 2)</i>',o:[O('Preview the task, offer a choice of partner or solo rehearsal, and use a predictable routine',1,'Predictability, choice and relationships build safety while keeping the reading expectation.'),O('Cold-call the student to build resilience',0,'Surprise public demands increase stress.'),O('Excuse the student from reading altogether',0,'High expectations with support are better than removing access.'),O('Give a consequence for not participating',0,'Punishment does not build safety or skill.')]},
   {ctx:'You need to share assessment results with a multilingual family.',p:'What is the best approach?',o:[O('Email the score report as an attachment',0,'Scores without explanation or language access are not communication.'),O('Share in clear, jargon-free language with an interpreter if needed, highlighting strengths and next steps',1,'Clear communication about results and decisions treats the family as a partner.'),O('Wait until end-of-year conferences',0,'Families should know early and often.'),O('Share only the concerns so they understand urgency',0,'Always include what the child can do.')]},
   {ctx:'A culturally and linguistically diverse student is behind in reading.',p:'Which keeps the student in rigorous, grade-level work?',o:[O('Pull the student to separate low-level worksheets all day',0,'This limits access to grade-level content.'),O('Keep the student in the grade-level lesson with scaffolds such as word banks, partner talk and bilingual texts',1,'Contextualizing literacy in the grade-level classroom keeps students engaged in rigorous work.'),O('Wait until English proficiency is higher',0,'Language and literacy grow together; do not delay.'),O('Give only texts well below grade level',0,'This lowers rigor and engagement.')]}]})}},
 {name:'Build the plan',render:(el,api)=>{const w=split(el,kid('#a9744f','#111','#c26a1b',150).replace('<svg ','<svg style="max-width:110px" ')+`<div style="font-size:.88rem;text-align:left;width:100%"><b>Luis, grade 4</b><ul style="margin:4px 0 0 16px;padding:0"><li>Speaks Spanish at home and English at school</li><li>Strong oral storytelling; loves soccer and drawing comics</li><li>Phonemic awareness secure</li><li>Multisyllabic decoding below grade level</li><li>Comprehension dips when words are hard to decode</li></ul></div>`);

   qs:[
   {slot:'Goal',p:'Choose the best <b>goal</b> for Luis.',o:[O('By March, Luis will accurately read 80% of multisyllabic words in grade-level passages on weekly probes.',1,'Specific, measurable and tied to the data.'),O('Luis will improve his reading.',0,'Too vague to measure.'),O('Luis will read more.',0,'This is not tied to the skill gap.'),O('Luis will stop translating in his head.',0,'This frames a multilingual strength as a problem.')]},
   {slot:'Strategy',p:'Choose the best <b>strategy</b>.',o:[O('Explicit syllable-division routine with multisyllabic word lists, then connected text, three times a week in a small group.',1,'Explicit and systematic, targeted to the gap, and applied to connected text.'),O('Twenty minutes of silent reading daily.',0,'This does not directly teach the missing skill.'),O('Repeat grade-level worksheets.',0,'This does not teach a new strategy.'),O('Move him to a lower-grade English-only phonics program.',0,'It lowers rigor and ignores his assets.')]},
   {slot:'Cultural / linguistic connection',p:'Choose the best way to <b>honor his assets</b>.',o:[O('Use soccer and comic-themed texts and Spanish\u2013English cognates to preview vocabulary.',1,'Connects to his interests and home language without stereotyping.'),O('Avoid Spanish so English develops faster.',0,'Home language is a resource.'),O('Choose texts about holidays assumed for Latino families.',0,'This stereotypes rather than listening to the student.'),O('No connection is needed for decoding.',0,'Connections increase motivation and meaning.')]},
   {slot:'Progress monitoring',p:'Choose the best way to <b>monitor progress</b>.',o:[O('Weekly one-minute multisyllabic word probe and a running record every two weeks; adjust groups at four weeks.',1,'Frequent, aligned data lets you adjust instruction.'),O('Check at the end of the semester.',0,'Too late to adjust instruction.'),O('Rely on a single high-stakes test.',0,'One score cannot guide weekly decisions.'),O('Use the teacher\u2019s general impression.',0,'Impressions without data are unreliable.')]}],
   summary:c=>`<table class="plan"><tr><th>Student</th><td>Luis, grade 4 \u2022 multilingual (Spanish/English)</td></tr>${c.map(x=>`<tr><th>${x.slot}</th><td>${x.t}</td></tr>`).join('')}</table><div class="row"><button class="btn" id="cp">Copy chart text</button></div>`,
