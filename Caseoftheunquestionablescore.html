<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Case of the Questionable Score</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Let the React app handle scrolling inside its containers */
        }
        #root {
            width: 100%;
            height: 100%;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Fragment } = React;

        const CLUES = [
          { id: 1, title: "ALIGNMENT", text: "An assessment should match what students are expected to learn and do." },
          { id: 2, title: "LOOK BENEATH THE AVERAGE", text: "An overall score can hide important patterns in the data." },
          { id: 3, title: "RELIABILITY", text: "Consistency matters, but consistency alone doesn't prove an assessment measured the right thing." },
          { id: 4, title: "MULTIPLE SOURCES", text: "Different evidence can answer different questions. Investigate before drawing a conclusion." }
        ];

        const SCREENS = {
          INTRO: 'INTRO',
          BOARD: 'BOARD',
          CASE1: 'CASE1',
          CASE2: 'CASE2',
          CASE3: 'CASE3',
          CASE4: 'CASE4',
          CASE5: 'CASE5',
          FINAL: 'FINAL',
          END: 'END',
          FINISHED: 'FINISHED'
        };

        const SCREEN_ORDER = [
          SCREENS.INTRO, SCREENS.CASE1, SCREENS.CASE2, 
          SCREENS.CASE3, SCREENS.CASE4, SCREENS.CASE5, SCREENS.FINAL
        ];

        const TopNav = ({ currentScreen, unlockedCases, cluesCollected, onRestart }) => {
          const getScreenLabel = () => {
            switch (currentScreen) {
              case SCREENS.INTRO: return "INTRODUCTION";
              case SCREENS.BOARD: return "CASE BOARD";
              case SCREENS.CASE1: return "CASE 01: THE MISMATCH";
              case SCREENS.CASE2: return "CASE 02: THE 58% MYSTERY";
              case SCREENS.CASE3: return "CASE 03: THE REPEAT TEST";
              case SCREENS.CASE4: return "CASE 04: SHOW ME WHAT YOU KNOW";
              case SCREENS.CASE5: return "CASE 05: THE EVIDENCE BOARD";
              case SCREENS.FINAL: return "FINAL CASE: CASE CLOSED?";
              case SCREENS.END: return "INVESTIGATION COMPLETE";
              case SCREENS.FINISHED: return "CASE COMPLETE";
              default: return "";
            }
          };

          return (
            <div className="w-full bg-slate-900 text-white px-4 pt-8 pb-4 shadow-md flex flex-col md:flex-row justify-between items-center z-50 border-b-4 border-slate-700 flex-shrink-0 gap-4">
              <div className="flex flex-col items-center md:items-start">
                <h1 className="text-2xl font-black tracking-wider text-amber-500 text-center uppercase">The Case of the Questionable Score</h1>
                <div className="text-xs sm:text-sm font-bold text-slate-300 bg-slate-800 px-3 py-1 rounded-full mt-2 border border-slate-600 inline-block">
                  {getScreenLabel()}
                </div>
              </div>
              
              <div className="flex items-center gap-4 flex-wrap justify-center mt-2 md:mt-0">
                <div className="hidden lg:flex items-center gap-2 text-xs font-mono text-slate-400">
                  {['INTRO', '01', '02', '03', '04', '05', 'FINAL'].map((step, idx) => (
                    <Fragment key={step}>
                      <span className={unlockedCases >= idx ? 'text-amber-400 font-bold' : ''}>{step}</span>
                      {idx < 6 && <span>→</span>}
                    </Fragment>
                  ))}
                </div>
                <div className="bg-slate-800 border-2 border-slate-600 rounded px-4 py-2 flex items-center gap-2">
                  <span className="text-xl">🔎</span>
                  <span className="font-bold font-mono tracking-widest text-amber-400">CLUES: {cluesCollected.length}/4</span>
                </div>
                <button 
                  onClick={onRestart}
                  className="bg-slate-700 hover:bg-red-600 text-white text-xs font-bold px-3 py-2 rounded flex items-center gap-1 transition-colors border border-slate-600 hover:border-red-500"
                >
                  ↻ RESTART
                </button>
              </div>
            </div>
          );
        };

        const BottomNav = ({ onBack, onBoard, onNext, backDisabled, nextDisabled, showNextPulse, currentScreen }) => {
          if (currentScreen === SCREENS.FINISHED) return null;
          
          return (
            <div className="w-full bg-slate-900 p-4 border-t-4 border-slate-700 flex justify-between items-center z-50 h-20 flex-shrink-0">
              <button 
                onClick={onBack} 
                disabled={backDisabled}
                className={`px-4 sm:px-6 py-2 rounded font-bold transition-all flex items-center gap-2 text-sm sm:text-base
                  ${backDisabled ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-700 text-white hover:bg-slate-600 active:bg-slate-500'}`}
              >
                ← BACK
              </button>

              <button 
                onClick={onBoard}
                disabled={currentScreen === SCREENS.BOARD || currentScreen === SCREENS.INTRO}
                className={`px-4 sm:px-6 py-2 rounded font-bold transition-all flex items-center gap-2 text-sm sm:text-base
                  ${(currentScreen === SCREENS.BOARD || currentScreen === SCREENS.INTRO) ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-amber-600 text-white hover:bg-amber-500 active:bg-amber-400 shadow-lg'}`}
              >
                🗂️ CASE BOARD
              </button>

              <button 
                onClick={onNext} 
                disabled={nextDisabled}
                className={`px-4 sm:px-6 py-2 rounded font-bold transition-all flex items-center gap-2 border-2 text-sm sm:text-base
                  ${nextDisabled 
                    ? 'bg-slate-800 text-slate-600 border-slate-800 cursor-not-allowed' 
                    : showNextPulse 
                      ? 'bg-green-600 text-white border-green-400 shadow-[0_0_15px_rgba(74,222,128,0.6)] animate-pulse hover:bg-green-500' 
                      : 'bg-green-700 text-white border-green-600 hover:bg-green-600'}`}
              >
                NEXT →
              </button>
            </div>
          );
        };

        const ClassroomScene = ({ children }) => (
          <div className="relative w-full h-full bg-[#E8DCC4] overflow-y-auto overflow-x-hidden flex flex-col items-center">
            <div className="absolute top-0 w-full h-[65%] bg-[#F2E8D5] pointer-events-none" />
            <div className="absolute bottom-0 w-full h-[35%] bg-[#6B4423] border-t-[12px] border-[#4A2E15] pointer-events-none" />
            <div className="absolute bottom-0 w-full h-[33%] bg-[#8B5A2B] opacity-50 pointer-events-none" />
            <div className="relative z-10 w-full max-w-6xl h-full flex flex-col p-4 sm:p-8">
              {children}
            </div>
          </div>
        );

        const CorkboardScene = ({ children }) => (
          <div className="relative w-full h-full bg-[#C19A6B] overflow-y-auto overflow-x-hidden p-4 sm:p-8">
            <div className="absolute inset-0 opacity-20 pointer-events-none" style={{ backgroundImage: 'radial-gradient(#4A2E15 1px, transparent 1px)', backgroundSize: '10px 10px' }}></div>
            <div className="absolute inset-4 border-[16px] border-[#5C3A21] shadow-2xl pointer-events-none" />
            <div className="relative z-10 w-full h-full max-w-6xl mx-auto flex flex-col items-center pt-16 pb-8">
              {children}
            </div>
          </div>
        );

        const ScreenIntro = ({ onStart }) => (
          <ClassroomScene>
            <div className="flex-1 flex flex-col lg:flex-row items-center justify-center gap-8">
              <div className="w-full lg:w-1/2 flex flex-col items-center text-center">
                <div className="text-[120px] leading-none mb-4 drop-shadow-xl">👩🏽‍🏫</div>
                <div className="bg-white p-6 rounded-2xl shadow-2xl relative border-4 border-amber-200">
                  <div className="absolute -top-4 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-b-[20px] border-b-white"></div>
                  <p className="text-xl sm:text-2xl font-semibold text-slate-800">
                    "My class scored 58% on the assessment. Does that mean they didn't learn?"
                  </p>
                  <p className="mt-2 text-sm text-slate-500 font-bold uppercase">— Ms. Rivera, 4th Grade Teacher</p>
                </div>
              </div>
              
              <div className="w-full lg:w-1/2 flex flex-col items-center lg:items-start space-y-8">
                <div className="bg-slate-800 text-white p-8 rounded-xl shadow-2xl border-l-8 border-amber-500 w-full transform rotate-1 hover:rotate-0 transition-transform">
                  <h2 className="text-sm font-bold text-amber-500 uppercase tracking-widest mb-2">You are the Assessment Detective</h2>
                  <h3 className="text-3xl font-black mb-4">One score. A lot of questions.</h3>
                  <p className="text-lg text-slate-300">
                    Your mission: Follow the evidence. Find the clues. Figure out what the <span className="font-bold text-red-400 bg-red-900/30 px-2 py-1 rounded">58%</span> score really tells you.
                  </p>
                </div>
                
                <button 
                  onClick={onStart}
                  className="bg-amber-500 hover:bg-amber-400 text-slate-900 text-2xl font-black px-10 py-5 rounded-lg shadow-[0_8px_0_#b45309] active:shadow-[0_0px_0_#b45309] active:translate-y-2 transition-all flex items-center gap-3 w-full justify-center lg:w-auto"
                >
                  START THE INVESTIGATION <span>→</span>
                </button>
              </div>
            </div>
          </ClassroomScene>
        );

        const ScreenBoard = ({ unlockedCases, onSelectCase, completedCases }) => {
          const folders = [
            { id: 1, title: "THE MISMATCH", screen: SCREENS.CASE1 },
            { id: 2, title: "THE 58% MYSTERY", screen: SCREENS.CASE2 },
            { id: 3, title: "THE REPEAT TEST", screen: SCREENS.CASE3 },
            { id: 4, title: "SHOW ME WHAT YOU KNOW", screen: SCREENS.CASE4 },
            { id: 5, title: "THE EVIDENCE BOARD", screen: SCREENS.CASE5 },
            { id: 6, title: "CASE CLOSED?", screen: SCREENS.FINAL, isFinal: true }
          ];

          return (
            <CorkboardScene>
              {/* Investigation Wall header removed as requested */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 w-full max-w-5xl mt-8">
                {folders.map((folder, index) => {
                  const isUnlocked = unlockedCases >= index + 1;
                  const isCompleted = completedCases.includes(index + 1);
                  
                  return (
                    <button
                      key={folder.id}
                      onClick={() => isUnlocked && onSelectCase(folder.screen)}
                      disabled={!isUnlocked}
                      className={`relative h-48 w-full rounded-tr-3xl rounded-bl-md rounded-br-md border-t-8 border-l-2 border-r-2 border-b-2 flex flex-col items-center justify-center p-4 transition-all duration-300
                        ${isUnlocked 
                          ? 'bg-[#E3C27C] border-[#B89645] hover:bg-[#F2D696] hover:-translate-y-2 hover:shadow-2xl shadow-xl cursor-pointer' 
                          : 'bg-slate-300 border-slate-400 opacity-60 cursor-not-allowed grayscale'}`}
                    >
                      <div className={`absolute -top-6 left-0 h-6 w-1/3 rounded-t-md border-t-2 border-l-2 border-r-2 border-b-0
                        ${isUnlocked ? 'bg-[#E3C27C] border-[#B89645]' : 'bg-slate-300 border-slate-400'}`}></div>
                      
                      {!isUnlocked && (
                        <div className="absolute top-2 right-2 text-3xl">🔒</div>
                      )}
                      
                      <div className="text-center z-10">
                        <div className="text-sm font-bold text-amber-900/60 tracking-widest mb-2">
                          CASE 0{folder.id} {folder.isFinal && '(FINAL)'}
                        </div>
                        <div className="text-xl font-black text-[#4A2E15]">
                          {folder.title}
                        </div>
                      </div>

                      {isCompleted && (
                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
                          <div className="text-red-600 border-4 border-red-600 rounded px-4 py-1 text-2xl font-black transform -rotate-12 bg-white/90 shadow-md">
                            CLUE FOUND ✓
                          </div>
                        </div>
                      )}
                      
                      <div className="absolute top-2 right-4 w-12 h-16 bg-white border border-gray-200 -z-10 transform rotate-12 shadow-sm"></div>
                    </button>
                  );
                })}
              </div>
              
              <svg className="absolute inset-0 pointer-events-none w-full h-full hidden lg:block" style={{ zIndex: 0 }}>
                 <path d="M 300 200 Q 500 150 700 200" stroke="#FF5722" strokeWidth="3" fill="none" opacity="0.6" strokeDasharray="5,5"/>
                 <path d="M 300 450 Q 500 500 700 450" stroke="#FF5722" strokeWidth="3" fill="none" opacity="0.6" strokeDasharray="5,5"/>
              </svg>
            </CorkboardScene>
          );
        };

        const ScreenCase1 = ({ onComplete }) => {
          const [answered, setAnswered] = useState(false);
          const [correct, setCorrect] = useState(false);

          const handleAnswer = (choiceId) => {
            setAnswered(true);
            if (choiceId === 2) {
              setCorrect(true);
              onComplete(CLUES[0]);
            } else {
              setCorrect(false);
            }
          };

          return (
            <ClassroomScene>
              <div className="flex flex-col h-full w-full max-w-5xl mx-auto space-y-6 pb-8">
                <div className="w-full bg-white rounded-lg border-[12px] border-gray-300 shadow-xl p-6 relative">
                  <div className="absolute bottom-2 right-4 text-3xl">🖍️</div>
                  <h3 className="text-blue-800 font-bold uppercase tracking-wider mb-2 border-b-2 border-blue-200 inline-block">Learning Goal</h3>
                  <p className="text-2xl sm:text-3xl text-gray-800 font-medium">
                    Students will <span className="bg-yellow-200 font-bold px-2 rounded">use evidence</span> from a story to <span className="bg-yellow-200 font-bold px-2 rounded">explain</span> why a character made a decision.
                  </p>
                </div>

                <div className="w-full sm:w-2/3 mx-auto bg-[#F9F7F1] shadow-2xl border border-gray-200 p-8 transform rotate-1 relative mt-4">
                  <div className="absolute -top-3 left-1/2 text-2xl transform -translate-x-1/2">📌</div>
                  <div className="border-b-2 border-gray-300 pb-2 mb-6 flex justify-between">
                    <span className="font-mono text-gray-500">Name: _____________</span>
                    <span className="font-mono text-gray-500">Score: 58%</span>
                  </div>
                  <h3 className="text-lg font-bold text-gray-700 uppercase mb-4">Question 1</h3>
                  <p className="text-xl sm:text-2xl font-semibold mb-6">
                    What does the word "<span className="underline decoration-2 decoration-red-400">evidence</span>" mean?
                  </p>
                  <ul className="space-y-3 text-lg">
                    <li className="flex items-center gap-3"><div className="w-5 h-5 rounded-full border-2 border-gray-400"></div> A. A type of book</li>
                    <li className="flex items-center gap-3"><div className="w-5 h-5 rounded-full border-2 border-gray-400"></div> B. Proof or facts</li>
                    <li className="flex items-center gap-3"><div className="w-5 h-5 rounded-full border-2 border-gray-400"></div> C. The main character</li>
                    <li className="flex items-center gap-3"><div className="w-5 h-5 rounded-full border-2 border-gray-400"></div> D. The end of a story</li>
                  </ul>
                </div>

                <div className="flex flex-col items-center justify-center pt-4">
                  {!answered || !correct ? (
                    <div className="w-full max-w-3xl flex flex-col items-center">
                      <h2 className="text-xl sm:text-2xl font-black text-slate-800 bg-white/90 px-6 py-2 rounded-full shadow-md mb-4 text-center border border-slate-300">
                        WHY IS THIS ASSESSMENT QUESTION FLAWED?
                      </h2>
                      <div className="flex flex-col gap-3 w-full">
                        <button onClick={() => handleAnswer(1)} className="text-left w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold p-4 rounded-xl shadow border-2 border-slate-300 transition-colors">
                          A. It asks students to write too much.
                        </button>
                        <button onClick={() => handleAnswer(2)} className="text-left w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold p-4 rounded-xl shadow border-2 border-slate-300 transition-colors">
                          B. It tests vocabulary memorization instead of the ability to use evidence to explain.
                        </button>
                        <button onClick={() => handleAnswer(3)} className="text-left w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold p-4 rounded-xl shadow border-2 border-slate-300 transition-colors">
                          C. The reading passage was likely too difficult.
                        </button>
                      </div>
                      {answered && !correct && (
                        <div className="text-red-700 bg-red-100 p-3 rounded font-bold mt-4 border border-red-300 w-full text-center">
                          Look closely at the Learning Goal vs the Question. The issue isn't about passage difficulty or writing length. Try again.
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="bg-emerald-100 border-4 border-emerald-500 rounded-xl p-6 shadow-xl w-full max-w-3xl transform animate-[pulse_0.5s_ease-in-out_1]">
                      <div className="flex items-start gap-4">
                        <div className="text-5xl">💡</div>
                        <div>
                          <h3 className="text-xl font-bold text-emerald-800 mb-2">You got it!</h3>
                          <p className="text-lg text-emerald-900 mb-4">
                            "A student could know what evidence means without being able to use evidence to explain a character's decision."
                          </p>
                          <div className="bg-white p-4 rounded border-l-4 border-amber-500 shadow flex items-center justify-between">
                            <div>
                              <div className="text-sm text-amber-600 font-bold uppercase tracking-wider">Clue #1 Discovered</div>
                              <div className="text-xl font-black text-slate-800">{CLUES[0].title}</div>
                              <div className="text-slate-600">{CLUES[0].text}</div>
                            </div>
                            <div className="text-4xl">📎</div>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </ClassroomScene>
          );
        };

        const ScreenCase2 = ({ onComplete }) => {
          const [answered, setAnswered] = useState(false);
          const [correct, setCorrect] = useState(false);

          const handleAnswer = (choiceId) => {
            setAnswered(true);
            if (choiceId === 3) {
              setCorrect(true);
              onComplete(CLUES[1]);
            } else {
              setCorrect(false);
            }
          };

          return (
            <ClassroomScene>
              <div className="flex flex-col h-full w-full max-w-5xl mx-auto gap-4 overflow-y-auto pb-8">
                <h2 className="text-2xl sm:text-3xl font-black text-slate-800 mb-2 text-center bg-white/80 py-2 rounded-lg flex-shrink-0 border border-slate-300">ASSESSMENT DATA BREAKDOWN</h2>
                
                <div className="bg-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 flex flex-col md:flex-row gap-8 items-center text-white relative flex-shrink-0">
                  <div className="w-full md:w-1/3 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-slate-600 pb-6 md:pb-0">
                    <div className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-2">Class Average</div>
                    <div className="text-8xl sm:text-[120px] leading-none font-black text-red-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]">
                      58%
                    </div>
                  </div>
                  
                  <div className="w-full md:w-2/3 flex flex-col space-y-6">
                    <div>
                      <div className="flex justify-between mb-1 font-bold">
                        <span className="text-blue-300">RECALL (Multiple Choice)</span>
                        <span>82%</span>
                      </div>
                      <div className="w-full bg-slate-700 rounded-full h-6">
                        <div className="bg-blue-500 h-6 rounded-full" style={{ width: '82%' }}></div>
                      </div>
                    </div>
                    
                    <div>
                      <div className="flex justify-between mb-1 font-bold">
                        <span className="text-amber-300">USING EVIDENCE (Short Answer)</span>
                        <span>61%</span>
                      </div>
                      <div className="w-full bg-slate-700 rounded-full h-6">
                        <div className="bg-amber-500 h-6 rounded-full" style={{ width: '61%' }}></div>
                      </div>
                    </div>
                    
                    <div>
                      <div className="flex justify-between mb-1 font-bold">
                        <span className="text-red-300">EXPLAINING THINKING (Essay)</span>
                        <span>39%</span>
                      </div>
                      <div className="w-full bg-slate-700 rounded-full h-6">
                        <div className="bg-red-500 h-6 rounded-full" style={{ width: '39%' }}></div>
                      </div>
                    </div>
                  </div>
                </div>
                
                <div className="flex flex-col items-center justify-center mt-2 flex-shrink-0">
                  {!answered || !correct ? (
                     <div className="w-full max-w-3xl flex flex-col items-center bg-white/90 p-4 rounded-xl shadow border border-slate-300">
                       <h2 className="text-xl sm:text-2xl font-black text-slate-800 mb-4 text-center">
                         WHAT DOES THIS DATA BREAKDOWN REVEAL?
                       </h2>
                       <div className="flex flex-col gap-3 w-full">
                         <button onClick={() => handleAnswer(1)} className="text-left w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold p-4 rounded-xl shadow border-2 border-slate-300 transition-colors">
                           A. The class failed, so the teacher needs to reteach the entire reading unit from the beginning.
                         </button>
                         <button onClick={() => handleAnswer(2)} className="text-left w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold p-4 rounded-xl shadow border-2 border-slate-300 transition-colors">
                           B. The assessment is completely unreliable and should be thrown out.
                         </button>
                         <button onClick={() => handleAnswer(3)} className="text-left w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold p-4 rounded-xl shadow border-2 border-slate-300 transition-colors">
                           C. The overall score hides the fact that students mastered recall but specifically struggle with explaining their thinking.
                         </button>
                       </div>
                       {answered && !correct && (
                         <div className="text-red-700 bg-red-100 p-3 rounded font-bold mt-4 border border-red-300 w-full text-center">
                           Not quite. Throwing it out or reteaching everything ignores the specific insights hidden in the bar charts. Try again.
                         </div>
                       )}
                     </div>
                  ) : (
                     <div className="bg-emerald-100 border-4 border-emerald-500 rounded-xl p-6 shadow-xl w-full max-w-3xl animate-[pulse_0.5s_ease-in-out_1]">
                      <div className="flex items-start gap-4">
                        <div className="text-5xl">📊</div>
                        <div>
                          <h3 className="text-xl font-bold text-emerald-800 mb-2">Pattern Discovered!</h3>
                          <p className="text-lg text-emerald-900 mb-4">
                            "The overall average tells us something, but it doesn't tell us everything. They are great at recall, but struggling with explanation."
                          </p>
                          <div className="bg-white p-4 rounded border-l-4 border-amber-500 shadow flex items-center justify-between">
                            <div>
                              <div className="text-sm text-amber-600 font-bold uppercase tracking-wider">Clue #2 Discovered</div>
                              <div className="text-xl font-black text-slate-800">{CLUES[1].title}</div>
                              <div className="text-slate-600">{CLUES[1].text}</div>
                            </div>
                            <div className="text-4xl">📎</div>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </ClassroomScene>
          );
        };

          const goToScreen = (screen) => {
            setHistory(prev => [...prev, currentScreen]);
            setCurrentScreen(screen);
          };

          const goBack = () => {
            if (history.length === 0) return;
            const newHistory = [...history];
            const prev = newHistory.pop();
            setHistory(newHistory);
            setCurrentScreen(prev);
          };

          const handleNext = () => {
            const currentIndex = SCREEN_ORDER.indexOf(currentScreen);
            if (currentIndex >= 0 && currentIndex < SCREEN_ORDER.length - 1) {
              goToScreen(SCREEN_ORDER[currentIndex + 1]);
            } else if (currentScreen === SCREENS.FINAL) {
              goToScreen(SCREENS.END);
            }
          };

          const handleRestart = () => {
            setCurrentScreen(SCREENS.INTRO);
            setHistory([]);
            setUnlockedCases(1);
            setCompletedCases([]);
            setCluesCollected([]);
            setNextPulseMap({});
          };

          const completeCase = (caseId, clue = null) => {
            if (!completedCases.includes(caseId)) {
              setCompletedCases(prev => [...prev, caseId]);
              if (unlockedCases < caseId + 1) {
                setUnlockedCases(caseId + 1);
              }
              if (clue && !cluesCollected.find(c => c.id === clue.id)) {
                setCluesCollected(prev => [...prev, clue]);
              }
            }
            setNextPulseMap(prev => ({ ...prev, [currentScreen]: true }));
          };

          const isNextDisabled = () => {
            if (currentScreen === SCREENS.INTRO) return true;
            if (currentScreen === SCREENS.BOARD) return true;
            if (currentScreen === SCREENS.END) return true;
            if (currentScreen === SCREENS.FINISHED) return true;

            const caseIndexMap = {
              [SCREENS.CASE1]: 1, [SCREENS.CASE2]: 2, [SCREENS.CASE3]: 3,
              [SCREENS.CASE4]: 4, [SCREENS.CASE5]: 5, [SCREENS.FINAL]: 6
            };
            
            const requiredCaseId = caseIndexMap[currentScreen];
            return requiredCaseId ? !completedCases.includes(requiredCaseId) : true;
          };

          return (
            <div className="flex flex-col h-full w-full bg-slate-900 font-sans overflow-hidden text-base">
              <TopNav 
                currentScreen={currentScreen} 
                unlockedCases={unlockedCases} 
                cluesCollected={cluesCollected} 
                onRestart={handleRestart}
              />
              
              <div className="flex-1 relative overflow-hidden bg-black flex flex-col">
                {currentScreen === SCREENS.INTRO && <ScreenIntro onStart={() => goToScreen(SCREENS.BOARD)} />}
                
                {currentScreen === SCREENS.BOARD && (
                  <ScreenBoard 
                    unlockedCases={unlockedCases} 
                    completedCases={completedCases}
                    onSelectCase={goToScreen} 
                  />
                )}
                
                {currentScreen === SCREENS.CASE1 && <ScreenCase1 onComplete={(clue) => completeCase(1, clue)} />}
                {currentScreen === SCREENS.CASE2 && <ScreenCase2 onComplete={(clue) => completeCase(2, clue)} />}
                {currentScreen === SCREENS.CASE3 && <ScreenCase3 onComplete={(clue) => completeCase(3, clue)} />}
                {currentScreen === SCREENS.CASE4 && <ScreenCase4 onComplete={(clue) => completeCase(4, clue)} />}
                {currentScreen === SCREENS.CASE5 && <ScreenCase5 onComplete={() => completeCase(5)} />}
                {currentScreen === SCREENS.FINAL && <ScreenFinal onComplete={() => completeCase(6)} />}
                
                {currentScreen === SCREENS.END && (
                  <ScreenEnd 
                    clues={cluesCollected} 
                    onReturnBoard={() => goToScreen(SCREENS.BOARD)} 
                    onFinish={() => setCurrentScreen(SCREENS.FINISHED)} 
                  />
                )}

                {currentScreen === SCREENS.FINISHED && (
                  <div className="w-full h-full flex items-center justify-center bg-slate-900 relative">
                     <div className="text-center animate-[fadeIn_1s_ease-out] z-10 flex flex-col items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className="w-24 h-24 text-red-500 mb-6 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]">
                          <path d="M11.7 2.805a.75.75 0 0 1 .6 0A60.65 60.65 0 0 1 22.83 8.72a.75.75 0 0 1-.231 1.337 49.94 49.94 0 0 0-9.902 3.912l-.003.002c-.874.472-1.926.472-2.8 0a50.04 50.04 0 0 0-9.905-3.914.75.75 0 0 1-.231-1.337A60.65 60.65 0 0 1 11.7 2.805Z" />
                          <path d="M13.06 15.473c-.836.45-1.808.45-2.644 0a49.98 49.98 0 0 1-5.602-2.316.751.751 0 0 0-1.07.69v2.247c0 2.211 4.542 4.152 8.646 4.152 4.104 0 8.646-1.94 8.646-4.152v-2.247a.751.751 0 0 0-1.07-.69c-1.85.814-3.666 1.636-5.602 2.316Z" />
                        </svg>
                        <h1 className="text-3xl sm:text-4xl font-black text-green-500 tracking-widest px-4">CASE COMPLETE ✓</h1>
                        <p className="text-slate-400 mt-4 text-lg">Thank you for playing.</p>
                        <button 
                          onClick={handleRestart}
                          className="mt-10 bg-slate-700 hover:bg-amber-600 text-white font-bold py-4 px-10 rounded-lg shadow-lg transition-colors tracking-wider"
                        >
                          ↻ RESTART INVESTIGATION
                        </button>
                     </div>
                  </div>
                )}
              </div>

              <BottomNav 
                currentScreen={currentScreen}
                onBack={goBack} 
                onBoard={() => goToScreen(SCREENS.BOARD)} 
                onNext={handleNext}
                backDisabled={history.length === 0 || currentScreen === SCREENS.FINISHED}
                nextDisabled={isNextDisabled()}
                showNextPulse={nextPulseMap[currentScreen]}
              />
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
