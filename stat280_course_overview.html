<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAT 280 Course Overview</title><style>
*{box-sizing:border-box}
body{margin:0;height:100vh;font:13px/1.3 Arial,sans-serif;background:#edebe8;color:#222;display:flex;flex-direction:column;padding:10px}
h1{font-size:15px;margin:0 0 8px;color:#000}
#g{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:8px;flex:1;min-height:0;overflow:auto}
@media(max-width:420px){#g{grid-template-columns:repeat(2,1fr)}}
.t{background:#fff;border:2px solid #d34147;border-radius:10px;padding:6px 8px;text-align:left;font:12px/1.2 Arial,sans-serif;color:#000;cursor:pointer;min-height:70px}
.t b{display:block;color:#b52e34;font-size:13px;margin-bottom:2px}
.t:hover,.t:focus{background:#d34147;color:#fff;outline:3px solid #000}
.t:hover b,.t:focus b{color:#fff}
#v{flex:1;min-height:0;flex-direction:column;display:flex}
#d{flex:1;min-height:0;overflow:auto;background:#fff;border-radius:10px;padding:10px 14px}
h2{font-size:15px;margin:0 0 6px}
h3{font-size:12px;margin:8px 0 2px;color:#b52e34;text-transform:uppercase}
ul{margin:0;padding-left:18px}
#b{background:#a8262c;color:#fff;border:0;border-radius:8px;padding:6px 12px;font:bold 13px Arial,sans-serif;cursor:pointer;margin-bottom:8px;align-self:flex-start}
#b:focus{outline:3px solid #000}
[hidden]{display:none!important}
</style></head><body>
<h1 id="h"></h1><div id="g"></div>
<div id="v" hidden><button id="b" type="button">&larr; All weeks</button><div id="d" tabindex="-1"></div></div>
<script>
var C="STAT 280";
var W=[
["Introduction to Statistics and Sampling Methods","Discussion 1: Growth Mindset",["Week 1 | Introduction to Statistics & Sampling Methods","Real Estate Market Valuation Project | Part 1.1 - Set Up Google Sheets and Slides"],[]],
["Descriptive Statistics","Discussion 2: Descriptive Statistics",["Week 2 | Descriptive Statistics","Real Estate Market Valuation Project | Part 1.2 - Generate a Random Sample from the Data Set"],["STAT 280 Week 2 Interactive"]],
["Regression, Correlation, and Discrete Probability Distributions","Discussion 3: Correlation and Regression",["Week 3 | Linear Regression & Correlation & Discrete Probability Distributions","Real Estate Market Valuation Project | Part 1.3 - Use Descriptive Statistics to Describe the Data Set"],["STAT 280 Week 3 Interactive"]],
["Probability and Probability Distributions","Discussion 4: Probability and Sampling Distributions",["Week 4 | Probability Distributions","Real Estate Market Valuation Project | Part 1.4 - Regression Analysis"],[]],
["The Normal Distribution and the Central Limit Theorem","Discussion 5: The Normal Distribution and The Central Limit Theorem",["Week 5 | The Normal Distribution & the Central Limit Theorem","Real Estate Market Valuation Project | Part 1.5 - Present Analysis Working With Datasets"],["Normal Distribution and Central Limit Theorem Tool","STAT 280 Week 5 Interactive"]],
["Confidence Intervals","Discussion 6: Confidence Intervals",["Week 6 | Confidence Intervals"],["Confidence Interval and Sample Size Tool","STAT 280 Week 6 Interactive"]],
["Hypothesis Testing with One Sample","Discussion 7: Hypothesis Testing With One Sample",["Week 7 | Hypothesis Testing with One Sample","Real Estate Market Valuation Project | Part 2 - Analysis of Ethical Use of Statistical Data"],["Hypothesis Testing Tool"]],
["Statistics and Ethics","Discussion 8: Statistics and Ethics",["Christian Worldview on Statistical Data Validity","Week 8 | The Chi-Square Distribution"],[]]
];
var g=document.getElementById("g"),v=document.getElementById("v"),d=document.getElementById("d"),L=0,T=[];
document.getElementById("h").textContent=C+" Course Overview: select a week";
function el(n,x,p){var e=document.createElement(n);if(x)e.textContent=x;if(p)p.appendChild(e);return e}
function sec(h,a){if(!a.length)return;el("h3",h,d);var u=el("ul","",d);a.forEach(function(s){el("li",s,u)})}
W.forEach(function(w,i){var b=el("button","",g);b.type="button";b.className="t";el("b","Week "+(i+1),b);el("span",w[0],b);b.onclick=function(){show(i)};T.push(b)});
function show(i){var w=W[i];L=i;d.textContent="";el("h2","Week "+(i+1)+": "+w[0],d);sec("Discussion",[w[1]]);sec("Assignments",w[2]);sec("Tools and Interactives",w[3]);g.hidden=true;v.hidden=false;d.focus()}
document.getElementById("b").onclick=function(){v.hidden=true;g.hidden=false;T[L].focus()};
</script></body></html>
