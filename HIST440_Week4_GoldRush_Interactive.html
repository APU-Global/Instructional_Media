<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIST440 Week 4 | The California Gold Rush: Gains and Losses Ledger</title>
<style>
:root{--teal:#0b4f6c;--teal2:#136f8f;--gold:#e0a526;--gold-d:#8a5f00;--terra:#b5532f;--cream:#fbf7ef;--paper:#ffffff;--ink:#1f2a33;--muted:#55636f;--line:#e2d9c6;--good:#1f7a4d;--bad:#b3261e;--sea:#cfe6ef}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
header.top{flex:0 0 auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(90deg,var(--teal),var(--teal2));color:#fff;min-height:58px}
header.top .txt{position:relative;z-index:1;max-width:72%}
header.top .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--ink);padding:1px 8px;border-radius:99px;margin-bottom:2px}
header.top h1{margin:0;font-size:19px;line-height:1.15}
header.top p{margin:2px 0 0;font-size:13px;opacity:.95}
header.top svg.art{position:absolute;right:0;top:0;height:100%;width:auto;max-width:40%}
main{flex:1 1 auto;min-height:0;display:grid;gap:12px;padding:10px 16px 12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:0;min-width:0;display:flex;flex-direction:column}
h2{font-size:15px;margin:0 0 6px;color:var(--teal)}
button{font:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid #1b6ef3;outline-offset:2px}
.btn{border:1.5px solid var(--teal);background:#fff;color:var(--teal);border-radius:8px;padding:6px 12px;font-weight:600}
.btn:hover{background:#eaf4f8}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:#093f57}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#f4efe3;border-radius:8px;padding:6px 8px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold-d);}
.pill{display:inline-block;background:#eef5f8;color:var(--teal);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;margin:0 4px 4px 0}
.fb{border-radius:8px;padding:6px 10px;font-size:13.5px;margin-top:6px}
.fb.good{background:#e6f4ec;border:1px solid #9fd2b5;color:#14503a}
.fb.bad{background:#fdeceb;border:1px solid #f0b4b0;color:#7a1b15}
.fb.info{background:#fff6dc;border:1px solid #ecd48a;color:#5b4300}
.small{font-size:13px;color:var(--muted)}
.sr{position:absolute;left:-9999px}
.think{background:#fff6dc;border-left:4px solid var(--gold);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13.5px}
svg text{font-family:inherit}
@media (max-width:720px){
 html,body{overflow:auto;height:auto}
 .app{height:auto}
 main{display:flex;flex-direction:column}
 header.top .txt{max-width:100%}
 header.top svg.art{opacity:.25}
 .mapwrap{height:420px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

main{grid-template-columns:minmax(280px,42%) 1fr}
.left{overflow:hidden}
.tl{display:flex;justify-content:space-between;position:relative;margin:4px 0 6px}
.tl:before{content:"";position:absolute;left:8%;right:8%;top:13px;height:3px;background:var(--line)}
.tl button{position:relative;background:none;border:0;flex:1;text-align:center;padding:0 2px;color:var(--ink)}
.tl button i{display:block;width:22px;height:22px;margin:2px auto 3px;border-radius:50%;background:#fff;border:3px solid var(--teal)}
.tl button[aria-pressed=true] i{background:var(--gold);border-color:var(--gold-d)}
.tl button b{display:block;font-size:13px}
.tl button span{display:block;font-size:11.5px;color:var(--muted);line-height:1.15}
#tlinfo{min-height:62px}
.chartbox{border:1px solid var(--line);border-radius:10px;background:#faf6ec;padding:4px;margin-top:6px;flex:1 1 auto;min-height:0}
.chartbox svg{width:100%;height:100%;display:block}
.gtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.gtabs button{border:1.5px solid var(--line);background:#f4efe3;border-radius:10px;padding:5px 4px;font-weight:700;font-size:12.5px;line-height:1.15;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.gtabs button svg{width:30px;height:26px}
.gtabs button[aria-selected=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.gtabs button .ct{font-weight:500;font-size:11.5px}
.ec{border:1px solid var(--line);border-radius:10px;padding:5px 9px;margin-bottom:5px;background:#fff}
.ec p{margin:0 0 4px;font-size:13.5px;line-height:1.3}
.rate{display:flex;gap:6px}
.rate button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:3px 4px;font-weight:700;font-size:13px}
.rate button.gain{color:var(--good);border-color:#9fd2b5}.rate button.mixed{color:#8a5f00;border-color:#ecd48a}.rate button.loss{color:var(--bad);border-color:#f0b4b0}
.rate button:hover:not([disabled]){filter:brightness(.95);background:#f7f7f7}
.rate button[disabled]{cursor:default;opacity:.5}
.rate button.chosen{opacity:1;color:#fff}
.rate button.gain.chosen{background:var(--good)}.rate button.mixed.chosen{background:#b07a00}.rate button.loss.chosen{background:var(--bad)}
.ec .fb{margin-top:4px;padding:3px 8px;font-size:12.5px;line-height:1.25}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:auto;padding-top:2px}
.ledger div{background:#eef5f8;border-radius:8px;padding:2px 6px;font-size:12px;text-align:center;line-height:1.2}
.ledger b{display:block;font-size:15px;color:var(--teal)}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="txt"><span class="tag">HIST440 &bull; Week 4</span>
 <h1>The California Gold Rush: Gains &amp; Losses Ledger</h1>
 <p>Big Question: Who gained and who lost during the California Gold Rush?</p></div>
 <svg class="art" viewBox="0 0 300 60" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <ellipse cx="240" cy="38" rx="42" ry="12" fill="#5a3a1c"/><ellipse cx="240" cy="34" rx="36" ry="9" fill="#8b8f93"/><ellipse cx="240" cy="35" rx="26" ry="5" fill="#6e7276"/>
  <path d="M230 33l6-4 7 3-5 5z" fill="#e0a526"/><circle cx="250" cy="35" r="3" fill="#f4c542"/><circle cx="222" cy="36" r="2.5" fill="#f4c542"/>
  <path d="M120 60l18-30 20 30Z" fill="#0a3f57"/><circle cx="150" cy="20" r="10" fill="#e0a526" opacity=".9"/>
 </svg>
</header>
<main>
 <section class="panel left" aria-label="Gold Rush timeline and population chart">
  <h2>Timeline: select an event</h2>
  <div class="tl" id="tl"></div>
  <div class="fb info" id="tlinfo" aria-live="polite"></div>
  <h2 style="margin-top:8px">A sudden, huge migration</h2>
  <div class="chartbox"><svg id="chart" viewBox="0 0 400 250" role="img" aria-label="Bar charts: non-Native population rose from about 14,000 in 1848 to about 100,000 by the end of 1849 and about 255,000 in 1852; Native population fell from about 150,000 in 1848 to about 30,000 by 1870."></svg></div>
 </section>
 <section class="panel" aria-label="Gains and losses activity">
  <h2>Rate the evidence: gain, mixed, or loss?</h2>
  <div class="gtabs" id="gtabs" role="tablist"></div>
  <div id="cards" aria-live="polite"></div>
  <div class="ledger" id="ledger"></div>
 </section>
</main>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const CA_OUT=[[-124.2,42.0],[-120,42],[-120,39],[-114.6,35.0],[-114.7,32.7],[-117.1,32.5],[-117.3,33.0],[-118.4,33.8],[-118.5,34.0],[-119.2,34.1],[-120.5,34.45],[-120.65,35.15],[-121.3,35.7],[-121.9,36.6],[-122.0,36.95],[-122.5,37.5],[-122.5,37.8],[-123.0,38.0],[-123.7,38.9],[-123.8,39.6],[-124.4,40.4],[-124.1,41.0]];
function mkProj(o){const c=Math.cos(37.5*Math.PI/180);return (lon,lat)=>[(lon-o.lonMin)*c*o.k,(o.latMax-lat)*o.k];}
function pathOf(P,pts){return 'M'+pts.map(p=>P(p[0],p[1]).map(v=>v.toFixed(1)).join(' ')).join('L')+'Z';}
function lineOf(P,pts){return 'M'+pts.map(p=>P(p[0],p[1]).map(v=>v.toFixed(1)).join(' ')).join('L');}
function waves(w,h,n){let s='';for(let i=0;i<n;i++){const x=(i*97)%w,y=(i*53+20)%h;s+=`<path d="M${x} ${y}q6 -5 12 0t12 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>`;}return s;}

const TL=[
{y:'Jan 1848',t:'Gold at Coloma',d:'John Marshall finds gold in the American River while building a sawmill for John Sutter. News spreads slowly at first, then explodes.'},
{y:'1849',t:'The Forty-Niners',d:'Miners rush to California in the largest migration in U.S. history. Population grows rapidly, speeding California toward statehood.'},
{y:'Apr 1850',t:'Two new laws',d:'The state passes the Act for the Government and Protection of Indians and a Foreign Miners&rsquo; Tax, both reshaping who could work and live free on the land.'},
{y:'Sep 1850',t:'Statehood',d:'After political compromise, California is admitted to the Union, only two years after it was acquired from Mexico.'}];
$('#tl').innerHTML=TL.map((e,i)=>`<button data-i="${i}" aria-pressed="${i===0}"><i></i><b>${e.y}</b><span>${e.t}</span></button>`).join('');
function tl(i){$$('#tl button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===i));$('#tlinfo').innerHTML=`<b>${TL[i].y}: ${TL[i].t}.</b> ${TL[i].d}`;}
$$('#tl button').forEach(b=>b.onclick=()=>tl(+b.dataset.i));tl(0);
// chart
(function(){let s='';const base=200,max=255000,H=150;
 const bars=[['1848',14000,'#e0a526','14,000'],['End of 1849',100000,'#e0a526','~100,000'],['1852',255000,'#e0a526','~255,000']];
 s+=`<text x="12" y="16" font-size="12.5" font-weight="700" fill="#0b4f6c">Non-Native population (estimates)</text>`;
 bars.forEach((b,i)=>{const hh=Math.max(4,b[1]/max*H),x=22+i*72;s+=`<rect x="${x}" y="${base-hh}" width="52" height="${hh}" rx="4" fill="${b[2]}" stroke="#8a5f00"/><text x="${x+26}" y="${base-hh-5}" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2a33">${b[3]}</text><text x="${x+26}" y="${base+15}" font-size="11.5" text-anchor="middle" fill="#55636f">${b[0]}</text>`;});
 s+=`<line x1="14" x2="244" y1="${base}" y2="${base}" stroke="#55636f"/>`;
 const nb=[['1848',150000,'#b5532f','~150,000'],['1870',30000,'#b5532f','~30,000']];
 s+=`<text x="262" y="16" font-size="12.5" font-weight="700" fill="#b5532f">Native pop. (est.)</text>`;
 nb.forEach((b,i)=>{const hh=b[1]/max*H,x=268+i*62;s+=`<rect x="${x}" y="${base-hh}" width="46" height="${hh}" rx="4" fill="${b[2]}"/><text x="${x+23}" y="${base-hh-5}" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2a33">${b[3]}</text><text x="${x+23}" y="${base+15}" font-size="11.5" text-anchor="middle" fill="#55636f">${b[0]}</text>`;});
 s+=`<line x1="260" x2="392" y1="${base}" y2="${base}" stroke="#55636f"/><text x="200" y="240" font-size="11" text-anchor="middle" fill="#55636f">Historians&rsquo; figures vary; values are rounded estimates.</text>`;
 $('#chart').innerHTML=s;})();
const G=[
{n:'Native Californians',s:'Native',ico:'<circle cx="15" cy="9" r="5" fill="#b5532f"/><path d="M5 25q10-16 20 0z" fill="#b5532f"/>',cards:[
 {t:'The 1850 Act for the Government and Protection of Indians allowed Native adults and children to be forced into indentured labor.',a:'loss',w:'Loss. The law legalized coercive labor, deepening harm to Native communities.'},
 {t:'Mining camps, diverted streams, and new diseases disrupted Native food sources and communities.',a:'loss',w:'Loss. Environmental damage and disease sharply reduced Native populations.'},
 {t:'Some Native workers earned wages in mines and on ranches.',a:'mixed',w:'Mixed. Wages brought some income, but work was often coerced, dangerous, and unequal.'}]},
{n:'Mexican nationals & Californios',s:'Mexican',ico:'<rect x="6" y="14" width="18" height="11" fill="#0b4f6c"/><path d="M3 14l12-9 12 9z" fill="#0b4f6c"/>',cards:[
 {t:'The Foreign Miners&rsquo; Tax was set at $20 a month, which fell hard on foreign-born miners, many of them Mexican.',a:'loss',w:'Loss. The tax targeted miners from other countries and pushed many out of the diggings.'},
 {t:'Miners&rsquo; demand for beef pushed up cattle prices for Californio ranchers.',a:'mixed',w:'Mixed. A short-term boom, but later pressures (like land claims) cost many ranchers their holdings.'},
 {t:'The Land Act of 1851 required landholders to prove their claims in court, often at great cost and delay.',a:'loss',w:'Loss. Legal fees and delays caused many Californios to lose land.'}]},
{n:'American migrants',s:'American',ico:'<circle cx="15" cy="9" r="5" fill="#e0a526"/><path d="M5 25q10-16 20 0z" fill="#e0a526"/>',cards:[
 {t:'Merchants and suppliers who sold goods to miners often earned steady profits.',a:'gain',w:'Gain. Many of the surest fortunes were made by selling supplies, not by digging.'},
 {t:'Most individual miners found modest amounts of gold, while a few struck it rich.',a:'mixed',w:'Mixed. A few became wealthy; many earned little in harsh conditions far from home.'},
 {t:'California entered the Union in 1850 as a free state, giving new American settlers a voice in national politics.',a:'gain',w:'Gain. Statehood brought representation, though not for everyone living in California.'}]},
{n:'Land, rivers & economy',s:'Land/Econ.',ico:'<path d="M2 20q7-8 13 0t13 0v5H2z" fill="#136f8f"/><path d="M8 14l7-10 7 10z" fill="#4f8a5b"/>',cards:[
 {t:'Hydraulic mining washed hillsides into rivers, burying farmland and clogging waterways.',a:'loss',w:'Loss. Sediment from mining damaged rivers and valley farms.'},
 {t:'Mercury used to separate gold left long-lasting contamination, including in San Francisco Bay.',a:'loss',w:'Loss. Mining&rsquo;s mercury still lingers in the environment.'},
 {t:'Gold-fueled growth turned San Francisco into a major port city and helped build California&rsquo;s economy.',a:'gain',w:'Gain. Gold transformed the state&rsquo;s economy, cities, and place in the nation.'}]}];
const LBL={gain:'Gain',mixed:'Mixed',loss:'Loss'};
const ans={};let gi=0;
$('#gtabs').innerHTML=G.map((g,i)=>`<button role="tab" data-i="${i}" aria-selected="${i===0}"><svg viewBox="0 0 30 28" aria-hidden="true">${g.ico}</svg>${g.n}<span class="ct" id="ct${i}"></span></button>`).join('');
$$('#gtabs button').forEach(b=>b.onclick=()=>{gi=+b.dataset.i;render();});
function stats(i){let d=0,c=0;G[i].cards.forEach((x,j)=>{const a=ans[i+'-'+j];if(a){d++;if(a===x.a)c++;}});return[d,c];}
function render(){
 $$('#gtabs button').forEach(b=>b.setAttribute('aria-selected',+b.dataset.i===gi));
 const g=G[gi];
 $('#cards').innerHTML=g.cards.map((c,j)=>{const a=ans[gi+'-'+j];return `<div class="ec"><p>${c.t}</p><div class="rate">${['gain','mixed','loss'].map(k=>`<button class="${k}${a===k?' chosen':''}" data-j="${j}" data-k="${k}" ${a?'disabled':''}>${LBL[k]}</button>`).join('')}</div>${a?`<div class="fb ${a===c.a?'good':'bad'}">${a===c.a?'<b>Correct.</b> ':'<b>Look again.</b> '}${c.w}</div>`:''}</div>`;}).join('');
 $$('#cards .rate button').forEach(b=>b.onclick=()=>{ans[gi+'-'+b.dataset.j]=b.dataset.k;render();});
 let tot=0,cor=0;
 $('#ledger').innerHTML=G.map((x,i)=>{const[d,c]=stats(i);tot+=d;cor+=c;$('#ct'+i).textContent=d+'/3 rated';return `<div><b>${c}/${d}</b>${x.s}</div>`;}).join('');
 if(tot===12){$('#ledger').insertAdjacentHTML('beforebegin',`<div class="fb info" id="done" style="margin:2px 0 4px;font-size:12.5px"><b>Ledger complete (${cor}/12 matched).</b> No group is all gain or all loss: pick one and write a claim with two pieces of evidence.</div>`);}
 else{const o=$('#done');if(o)o.remove();}
}
render();
</script>
</body>
</html>
