<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISTU 101 | Week 6: Your Academic Plan</title>
<style>:root{--ink:#1f2a30;--bg:#f5f6f2;--card:#fff;--line:#d8ddd2;--muted:#56626a;--green:#8dc63f;--green-d:#4a7608;--green-t:#ebf5d9;--red:#a8343c;--red-t:#f8e4e5;--char:#263238;--amber:#b86e00;--amber-t:#fbefd9;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--ink:#e9eef0;--bg:#141a1d;--card:#1e272c;--line:#34424a;--muted:#a3b0b7;--green-d:#a9d95f;--green-t:#26341a;--red:#ee8a92;--red-t:#3a2124;--amber:#f0b25a;--amber-t:#3a2d17;--shadow:none}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.hdr{background:var(--char);color:#fff;border-bottom:4px solid var(--green);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.hdr h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.2px;flex:1 1 260px}
.hdr h1 small{display:block;font-weight:500;font-size:.8rem;color:#c9d3d8}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid #5b6b73;background:transparent;color:#e6ecef;border-radius:99px;padding:4px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.steps button[aria-current=step]{background:var(--green);border-color:var(--green);color:#1b2a05;font-weight:700}
.steps button.done:not([aria-current]){border-color:var(--green);color:#d6efb0}
.steps button:focus-visible,.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.cell:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,svg [role=button]:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
main{flex:1;min-height:0;overflow-y:auto;padding:16px;scrollbar-gutter:stable}
.wrap{max-width:980px;margin:0 auto}
h2{margin:0 0 4px;font-size:1.3rem}
.lead{margin:0 0 14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--green-d)}
.btn.primary{background:var(--green);border-color:var(--green);color:#1b2a05}
.btn.primary:hover{filter:brightness(.95)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--green-d);background:var(--green-t);font-weight:700}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;margin:0 0 8px}
.opt:hover:not([disabled]){border-color:var(--green-d)}
.opt.right{border-color:var(--green-d);background:var(--green-t)}
.opt.wrong{border-color:var(--red);background:var(--red-t)}
.fb{border-left:5px solid var(--muted);background:var(--bg);border-radius:8px;padding:10px 14px;margin-top:8px}
.fb.ok{border-color:var(--green-d);background:var(--green-t)}
.fb.no{border-color:var(--red);background:var(--red-t)}
.fb.tip{border-color:var(--amber);background:var(--amber-t)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);transition:width .3s}
label{font-weight:600;display:block;margin:10px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:var(--card);color:var(--ink)}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--green-d);font-weight:800}
.muted{color:var(--muted)}
svg text{font-family:inherit}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}
.badge{flex:none;width:30px;height:30px;border-radius:8px;background:var(--line);color:var(--ink);font-weight:800;display:grid;place-items:center}
.badge.on{background:var(--green);color:#1b2a05}
.prev{font-size:1.05rem;border-left:5px solid var(--green);padding:8px 14px;background:var(--bg);border-radius:8px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}@media(max-width:560px){.kpi{grid-template-columns:1fr}}
.kpi div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}.kpi b{display:block;font-size:1.4rem;color:var(--green-d)}
.two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}@media(max-width:620px){.two{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<header class="hdr"><h1>ISTU 101 | Week 6: Your Academic Plan<small>Interactive: SMART Goals, Path and Funding</small></h1><nav class="steps" id="steps" aria-label="Activity steps"></nav></header>
<main id="main" tabindex="-1"><div class="wrap" id="stage"></div></main>
</div>
<script>
const STEPS=["1 Spot the SMART goal", "2 Build your goal", "3 Path and funding"];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let step=0;const doneSteps=new Set();
function renderSteps(){const n=$('#steps');n.innerHTML=STEPS.map((s,i)=>`<button data-i="${i}" class="${doneSteps.has(i)?'done':''}" ${i===step?'aria-current="step"':''}>${esc(s)}</button>`).join('');
 $$('button',n).forEach(b=>b.onclick=()=>go(+b.dataset.i));}
function go(i){step=i;renderSteps();$('#stage').innerHTML='';VIEWS[i]($('#stage'));$('#main').scrollTop=0;}
function navBar(back,next,nextLabel='Continue',nextOff=false){return `<div class="nav"><button class="btn" id="bk" ${back?'':'style="visibility:hidden"'}>Back</button><button class="btn primary" id="nx" ${nextOff?'disabled':''}>${nextLabel}</button></div>`}
function wireNav(root,onNext){const b=$('#bk',root),n=$('#nx',root);if(b)b.onclick=()=>go(step-1);if(n)n.onclick=()=>{doneSteps.add(step);onNext?onNext():go(step+1)};}
function copyText(t,btn){const ok=()=>{const o=btn.textContent;btn.textContent='Copied!';setTimeout(()=>btn.textContent=o,1600)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
 function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){btn.textContent='Select and copy manually'}a.remove()}}
window.addEventListener('load',()=>go(0));

const G=[
 ['“I want to do better in school.”',['I will study more this year.','I will complete my 3 courses this session by earning a B or higher on each, studying 4 evenings a week, by the end of Week 8.','I will try to be a great student.'],1,'The second option names exactly what, how it is measured, how, why it matters and when. The others are vague and cannot be measured.'],
 ['“I need to stay on top of my work.”',['I will do all my homework early.','I will be organized.','I will enter every due date from my syllabus into my calendar by Sunday, then check it each morning for the next 8 weeks.'],2,'This goal is specific, measurable (every due date), time-bound (by Sunday, 8 weeks) and achievable.'],
 ['“I want to finish my degree.”',['I will meet with my Success Coach to confirm my next four courses and enroll by the end of this session.','I will graduate someday.','I will take as many classes as possible.'],0,'This turns a big dream into a concrete next step with a deadline, and it uses your Success Coach.']];
const LET=[['S','Specific','What exactly will you do? Who or what is involved?','I will complete my next course with a B or higher'],['M','Measurable','How will you know you reached it?','by earning at least 80% on every assignment'],['A','Achievable','What makes this realistic for your life right now?','by studying three evenings a week around my work shift'],['R','Relevant','Why does it matter to you, your strengths and your degree?','because it moves me one course closer to graduation'],['T','Time-bound','By when?','by the end of Week 8']];
const gAns={},fields=['','','','',''];const VIEWS=[v1,v2,v3];const M={units:'',per:'',rate:''};
function v1(r){let i=0;
 function q(){if(i>=G.length){const c=Object.keys(gAns).filter(k=>gAns[k]).length;r.innerHTML=`<div class="card"><h2>${c} of ${G.length} correct</h2><p>SMART goals are <strong>S</strong>pecific, <strong>M</strong>easurable, <strong>A</strong>chievable, <strong>R</strong>elevant and <strong>T</strong>ime-bound. Next you will write your own.</p></div>${navBar(false,true,'Build my goal')}`;wireNav(r);return}
  const g=G[i];r.innerHTML=`<div class="kicker">Step 1 · Goal ${i+1} of ${G.length}</div><h2>Which rewrite is a SMART goal?</h2><svg viewBox="0 0 600 60" style="width:100%;height:auto;margin:6px 0" role="img" aria-label="S M A R T letters">${LET.map((l,k)=>`<g transform="translate(${20+k*116} 8)"><rect width="104" height="44" rx="10" fill="${k%2?'#263238':'#8dc63f'}"/><text x="52" y="29" text-anchor="middle" font-size="18" font-weight="800" fill="${k%2?'#fff':'#1b2a05'}">${l[0]} · ${l[1].slice(0,6)}</text></g>`).join('')}</svg>
  <div class="card"><p style="font-weight:700;margin-top:0">Vague goal: ${g[0]}</p><div id="os">${g[1].map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><div id="fb" aria-live="polite"></div></div>`;
  $$('#os .opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===g[2];gAns[i]=ok;$$('#os .opt').forEach(o=>{o.disabled=true;if(+o.dataset.k===g[2])o.classList.add('right')});if(!ok)b.classList.add('wrong');
   $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><strong>${ok?'Yes!':'Not quite.'}</strong> ${g[3]}</div><div class="nav"><span></span><button class="btn primary" id="nq">${i+1<G.length?'Next goal':'Finish'}</button></div>`;$('#nq').onclick=()=>{i++;q()}})}
 q()}
function sentence(){const t=fields.map(f=>f.trim()).filter(Boolean);return t.length?t.join(', ')+'.':''}
function v2(r){r.innerHTML=`<div class="kicker">Step 2</div><h2>Build your own SMART goal</h2><p class="lead">Goals give you direction and keep you motivated when things get tough. Complete each part, using your strengths from Week 4. Fill in the boxes and watch your goal take shape.</p>
 <div class="grid"><div class="card">${LET.map((l,k)=>`<label for="f${k}">${l[0]} · ${l[1]}: <span class="muted" style="font-weight:400">${l[2]}</span></label><input type="text" id="f${k}" placeholder="e.g. ${esc(l[3])}" value="${esc(fields[k])}">`).join('')}</div>
 <div class="card"><strong>Checklist</strong><div id="ck"></div><div style="margin-top:12px" class="kicker">Your goal</div><div class="prev" id="pv" aria-live="polite"></div><div style="margin-top:10px"><button class="btn primary" id="cp">Copy goal</button></div></div></div>${navBar(true,true,'Path and funding')}`;
 const paint=()=>{$('#ck').innerHTML=LET.map((l,k)=>{const on=fields[k].trim().length>=8;return `<div class="chk"><span class="badge ${on?'on':''}">${on?'✓':l[0]}</span><div><b>${l[1]}</b></div></div>`}).join('');const s=sentence();$('#pv').textContent=s||'Your SMART goal will appear here.'};
 LET.forEach((l,k)=>{$('#f'+k).oninput=e=>{fields[k]=e.target.value;paint()}});paint();$('#cp').onclick=e=>copyText(sentence()||'',e.target);wireNav(r)}
function v3(r){r.innerHTML=`<div class="kicker">Step 3</div><h2>See the path and plan the funding</h2><p class="lead">Your advising worksheet shows which courses remain. Enter your numbers to see how far you are from graduation. Have your Student Account Specialist confirm the current tuition rate.</p>
 <div class="grid"><div class="card"><div class="two"><div><label for="u">Units still needed</label><input type="number" id="u" min="0" inputmode="numeric" placeholder="e.g. 60" value="${M.units}"></div><div><label for="p">Units per session</label><input type="number" id="p" min="1" inputmode="numeric" placeholder="e.g. 6" value="${M.per}"></div><div><label for="rt">Tuition per unit ($)</label><input type="number" id="rt" min="0" inputmode="decimal" placeholder="enter current rate" value="${M.rate}"></div></div>
 <div class="kpi" id="kp"></div><p class="muted" style="font-size:.88rem;margin:10px 0 0">This is an estimate for planning. It does not include fees, aid or other changes.</p></div>
 <div class="card"><strong>Your path</strong><div id="rd" style="margin-top:6px"></div></div></div>${navBar(true,false,'Start over')}`;
 const money=n=>n.toLocaleString(undefined,{style:'currency',currency:'USD',maximumFractionDigits:0});
 const paint=()=>{const u=+M.units,p=+M.per,rt=+M.rate,ok=u>0&&p>0,sess=ok?Math.ceil(u/p):0;
  $('#kp').innerHTML=`<div><b>${rt>0&&u>0?money(u*rt):'—'}</b>total to graduation</div><div><b>${sess||'—'}</b>sessions to go</div><div><b>${rt>0&&ok?money(Math.min(u,p)*rt):'—'}</b>per full session</div>`;
  const n=Math.min(sess,16);let s='';
  if(!n){s='<p class="muted">Enter units still needed and units per session to see your path.</p>'}
  else{const w=560/(n+1);s=`<svg viewBox="0 0 600 150" style="width:100%;height:auto" role="img" aria-label="Path of ${sess} sessions to graduation"><path d="M20 110 H580" stroke="#d8ddd2" stroke-width="6" stroke-linecap="round"/>`+Array.from({length:n},(_,k)=>{const x=30+w*(k+1)-w/2,y=110-(k+1)*(60/n);return `<circle cx="${x}" cy="${110}" r="${Math.min(18,w/2.2)}" fill="${k%2?'#263238':'#8dc63f'}"/><text x="${x}" y="115" text-anchor="middle" font-size="${n>10?11:15}" font-weight="800" fill="${k%2?'#fff':'#1b2a05'}">${k+1}</text>`}).join('')+`<g transform="translate(560 40)"><path d="M0 0v62" stroke="#263238" stroke-width="4"/><path d="M0 2h34l-10 12 10 12H0z" fill="#a8343c"/></g><text x="30" y="140" font-size="17" fill="currentColor">Today</text><text x="580" y="140" font-size="17" text-anchor="end" fill="currentColor">Graduation</text></svg>${sess>16?`<p class="muted" style="margin:0">Showing the first 16 of ${sess} sessions.</p>`:''}`}
  $('#rd').innerHTML=s};
 [['u','units'],['p','per'],['rt','rate']].forEach(([id,k])=>{$('#'+id).oninput=e=>{M[k]=e.target.value;paint()}});paint();
 wireNav(r,()=>{fields.fill('');for(const k in gAns)delete gAns[k];M.units=M.per=M.rate='';doneSteps.clear();go(0)})}

</script></body></html>
