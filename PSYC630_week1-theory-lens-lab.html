<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSYC 630 Week 1: Theory Lens Lab</title>
<style>:root{--navy:#1f3a5f;--teal:#12857f;--gold:#e0a526;--rose:#c4506b;--violet:#6b5bb5;--ink:#22303f;--muted:#5b6b7c;--bg:#f5f8fb;--card:#fff;--line:#d6dfe8;--ok:#1f8a4c;--bad:#b3392f}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
.app{max-width:980px;margin:0 auto;padding:12px}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--navy),#2d5d8c);color:#fff;border-radius:14px;padding:12px 16px}
.hero svg{flex:0 0 auto;width:84px;height:84px}
.hero h1{margin:0;font-size:1.25rem;line-height:1.2}
.hero p{margin:4px 0 0;font-size:.92rem;opacity:.92}
.tabs{display:flex;gap:6px;margin:12px 0 10px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.92rem;cursor:pointer;font-family:inherit}
.tab[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.tab:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:var(--panel-h,500px)}
.panel.on{display:block}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){html,body{overflow-y:auto}.grid2,.grid3{grid-template-columns:1fr}.hero svg{width:56px;height:56px}.app{padding:8px}}
@media(max-width:760px){.grid2{gap:10px}.tab{padding:6px 10px;font-size:.85rem}}
h2{margin:0 0 6px;font-size:1.1rem;color:var(--navy)}
h3{margin:0 0 4px;font-size:1rem;color:var(--navy)}
p{margin:0 0 8px}
.small{font-size:.88rem;color:var(--muted)}
.btn{border:0;background:var(--teal);color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;margin:0 0 7px;font-size:.95rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.choice:hover:not(:disabled){border-color:var(--teal);background:#f0faf9}
.choice.right{border-color:var(--ok);background:#e8f6ee}
.choice.wrong{border-color:var(--bad);background:#fbeceb}
.feedback{border-left:5px solid var(--teal);background:#eef7f7;border-radius:8px;padding:9px 12px;margin-top:8px;font-size:.93rem}
.feedback.bad{border-color:var(--gold);background:#fff8e6}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;color:#fff;background:var(--navy)}
.bar{height:10px;background:#e3eaf1;border-radius:99px;overflow:hidden;margin:6px 0 10px}
.bar>i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.card{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink)}
.card[aria-pressed=true]{border-color:var(--navy);background:#eef3f9}
.card svg{width:64px;height:64px}
.scene{background:#f0f5fa;border-radius:12px;padding:8px}
.scene svg{width:100%;height:auto;display:block}
.region{cursor:pointer;transition:filter .15s}
.region:hover{filter:brightness(1.08)}
.region:focus-visible{outline:none;stroke:#000;stroke-width:3}
.takeaway{background:#fff8e6;border:1px solid #f0d58a;border-radius:10px;padding:8px 12px;font-size:.9rem}
.score{font-weight:700;color:var(--navy)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.info{background:#f0f5fa;border-radius:12px;padding:10px 12px}

.stair rect{cursor:default}
</style></head><body>
<div class="app">
<header class="hero">
<svg viewBox="0 0 90 90" role="img" aria-label="Three lenses: Piaget, Vygotsky, Erikson"><circle cx="24" cy="30" r="20" fill="#e0a526" opacity=".95"/><circle cx="52" cy="30" r="20" fill="#12857f" opacity=".85"/><circle cx="38" cy="54" r="20" fill="#c4506b" opacity=".8"/><text x="24" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#1f3a5f">P</text><text x="56" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">V</text><text x="38" y="59" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">E</text></svg>
<div><h1>PSYC 630 Week 1: Theory Lens Lab</h1><p>Major Theories of Cognitive Development. Explore three lenses, then decide which one best explains what you observe.</p></div>
</header>
<div class="tabs" role="tablist" aria-label="Activity sections">
<button class="tab" role="tab">1. Meet the Lenses</button><button class="tab" role="tab">2. Lens Lab</button></div>

<section class="panel" role="tabpanel" aria-label="Meet the Lenses">
<div class="grid3" id="lensCards"></div>
<div class="grid2" style="margin-top:12px">
<div class="scene" id="lensDiagram" aria-live="polite"></div>
<div><h2 id="lensTitle"></h2><div id="lensBody"></div></div></div>
</section>

<section class="panel" role="tabpanel" aria-label="Lens Lab">
<div class="grid2">
<div class="scene" id="labArt" aria-hidden="true"></div>
<div>
<div class="small"><span id="qNum">Scenario 1 of 6</span> · <span class="score" id="score">Score: 0</span></div>
<div class="bar"><i id="prog"></i></div>
<h2>Which lens fits best?</h2>
<p id="scenario"></p>
<div id="opts"></div>
<div id="fb" aria-live="polite"></div>
<div style="margin-top:8px"><button class="btn" id="next" style="display:none">Next scenario</button></div>
</div></div>
</section>
<p class="small" style="margin:8px 4px 0">Theories are lenses, not rules. Describe and interpret what you see; do not diagnose.</p>
</div>

<script>
var L={

 pts:["Children actively construct knowledge by acting on the world.","Assimilation fits new information into an existing schema; accommodation changes the schema.","Four stages: sensorimotor, preoperational, concrete operational, formal operational.","Critique: change is often more gradual and varies across cultures."]},

 return '<svg viewBox="0 0 64 64" aria-hidden="true"><line x1="6" y1="34" x2="58" y2="34" stroke="#c4506b" stroke-width="4"/><g fill="#c4506b"><circle cx="8" cy="34" r="4"/><circle cx="20" cy="34" r="4"/><circle cx="32" cy="34" r="6"/><circle cx="44" cy="34" r="4"/><circle cx="56" cy="34" r="4"/></g></svg>';}

 e.forEach(function(n,i){var x=30+i*48,up=i%2===0;s2+='<circle cx="'+x+'" cy="125" r="9" fill="#c4506b"/><text x="'+x+'" y="'+(up?100:156)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#5a1f30">'+(i+1)+'</text><text x="'+x+'" y="'+(up?84:176)+'" text-anchor="middle" font-size="10.5" fill="#5a1f30">'+n+'</text>';});
 return s2+'<text x="30" y="226" font-size="11" fill="#5a1f30">Infancy</text><text x="372" y="226" text-anchor="end" font-size="11" fill="#5a1f30">Late adulthood</text></svg>';}
var cards=document.getElementById('lensCards');
Object.keys(L).forEach(function(k){var b=document.createElement('button');b.className='card';b.setAttribute('aria-pressed','false');b.innerHTML=icon(k)+'<h3>'+L[k].n+'</h3><div class="small">'+L[k].sub+'</div>';b.onclick=function(){show(k)};b.dataset.k=k;cards.appendChild(b)});

 document.getElementById('lensDiagram').innerHTML=diagram(k);

show('piaget');
var S=[
{t:"A 4-year-old watches water poured from a short, wide glass into a tall, thin one and insists the tall glass now holds more.",a:"piaget",w:"Piaget: this is a classic preoperational pattern (difficulty with conservation). The child is relying on how things look rather than on logical operations.",alt:"Vygotsky could add: how might an adult's language and questions scaffold the child's thinking?"},
{t:"A 6-year-old cannot finish a puzzle alone. A parent says, \"Try the edge pieces first,\" and the child succeeds, then does the next puzzle independently.",a:"vygotsky",w:"Vygotsky: the child worked inside the zone of proximal development, and the parent's hint was scaffolding that was later withdrawn.",alt:"Piaget would focus instead on the child's own actions and schemas."},
{t:"A 15-year-old keeps switching friend groups and styles and often asks, \"Who am I really?\"",a:"erikson",w:"Erikson: this fits identity vs. role confusion, the central challenge of adolescence.",alt:"Vygotsky could add how peers and culture supply the tools for identity."},
{t:"A toddler calls a cow \"doggy\" because it has four legs. After seeing many animals, she creates a new category for \"cow.\"",a:"piaget",w:"Piaget: first assimilation (fitting the cow into the dog schema), then accommodation (building a new schema).",alt:"Vygotsky would also notice how adults naming animals shapes categories."},
{t:"A preschooler builds with blocks while quietly talking to herself: \"First the big one... no, that falls... try the flat one.\"",a:"vygotsky",w:"Vygotsky: this is private speech, language that began as a social tool and is becoming an inner tool for thinking.",alt:"Piaget called similar behavior egocentric speech, a different interpretation of the same behavior."},
{t:"A 72-year-old reviews her life and wonders whether it was meaningful, sometimes feeling peace and sometimes regret.",a:"erikson",w:"Erikson: this fits integrity vs. despair, the final psychosocial stage.",alt:"Because many lifespan tasks are social-emotional, Erikson is the strongest single lens here."}];

document.getElementById('labArt').innerHTML=art('piaget');

 document.getElementById('next').style.display='none';var o=document.getElementById('opts');o.innerHTML='';
 Object.keys(L).forEach(function(k){var b=document.createElement('button');b.className='choice';b.textContent=L[k].n+' ('+L[k].sub+')';b.onclick=function(){pick(k,b)};o.appendChild(b)});window.__resize&&__resize()}
function pick(k,b){if(done)return;done=true;var q=order[i],ok=k===q.a;if(ok)sc++;b.classList.add(ok?'right':'wrong');
 [].forEach.call(document.getElementById('opts').children,function(x,j){x.disabled=true;if(Object.keys(L)[j]===q.a)x.classList.add('right')});
 document.getElementById('score').textContent='Score: '+sc;document.getElementById('labArt').innerHTML=art(q.a);

 var n=document.getElementById('next');n.style.display='';n.textContent=i===order.length-1?'See results':'Next scenario';window.__resize&&__resize()}

 if(finished){finished=false;order=shuffle(S);i=0;sc=0;document.getElementById('score').textContent='Score: 0';document.getElementById('labArt').innerHTML=art('piaget');render();return}
