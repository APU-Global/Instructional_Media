                                        <span className="font-black text-xl text-brand-dark">Record with Loom</span>

                                <a href="https://www.screencastify.com/" target="_blank" rel="noopener noreferrer" className="flex items-center justify-between bg-white hover:bg-orange-50 border-2 border-black/10 hover:border-brand-orange p-5 rounded-2xl transition-all group shadow-sm">

                                </a>
                            </div>
                            
                            <div className="mt-8 text-center text-sm text-slate-500 font-black uppercase tracking-widest border-t-2 border-black/10 pt-6">
                                Drop the recording link in your team slide!
                            </div>
                        </div>

                        {/* Pitch Format List */}
                        <div className="bg-white p-8 md:p-10 rounded-3xl shadow-flat border-[3px] border-brand-dark border-l-[12px] border-l-brand-teal relative overflow-hidden h-full">
                            <div className="absolute top-0 right-0 p-6 opacity-5"><IconTarget className="w-40 h-40"/></div>
                            <h3 className="text-3xl font-black uppercase mb-8 text-brand-dark border-b-2 border-black/10 pb-4 relative z-10 flex items-center gap-4"><IconChefHat className="text-brand-teal"/> 45-Second Pitch</h3>

                                    { title: "Instruction", script: "\"Our instructional recipe targets ______.\"" },

                        <IconSearch className="w-40 h-40 text-black/5 absolute -bottom-6 -right-6 transition-transform group-hover:scale-110" />
                        <h2 className="text-xl font-black mb-4 mt-4 text-brand-dark uppercase tracking-tight relative z-10">What did you notice?</h2>

                        <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-brand-dark text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl font-black shadow-sm z-10">2</div>
                        <IconTrendingUp className="w-40 h-40 text-black/5 absolute -bottom-6 -right-6 transition-transform group-hover:scale-110" />
                        <h2 className="text-xl font-black mb-4 mt-4 text-brand-dark uppercase tracking-tight relative z-10">What changed?</h2>
                        <p className="text-slate-700 leading-relaxed text-lg font-bold relative z-10">How did your diagnosis change the instructional strategy you selected?</p>
                    </div>
                    
                    <div className="bg-brand-cream p-8 md:p-10 rounded-3xl shadow-flat border-[3px] border-brand-dark border-t-8 border-t-brand-red relative group hover:-translate-y-2 transition-transform transform md:-translate-y-12 overflow-hidden">
                        <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-brand-dark text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl font-black shadow-sm z-10">3</div>
                        <IconMapPin className="w-40 h-40 text-black/5 absolute -bottom-6 -right-6 transition-transform group-hover:scale-110" />
                        <h2 className="text-xl font-black mb-4 mt-4 text-brand-dark uppercase tracking-tight relative z-10">What will you do differently?</h2>
                        <p className="text-slate-700 leading-relaxed text-lg font-bold relative z-10">How might this approach change how you respond to spelling errors in your own classroom?</p>
                    </div>
                </div>
                
                <div className="bg-white text-brand-dark py-10 px-8 md:px-16 rounded-3xl text-2xl md:text-4xl font-medium shadow-flat flex flex-col md:flex-row items-center justify-center gap-8 border-[3px] border-brand-dark max-w-5xl z-10 text-center md:text-left">
                    <IconUtensils className="w-16 h-16 text-brand-orange shrink-0" />
                    <div>
                        <span className="italic text-slate-600">"Don't just correct the spelling.</span> <br className="md:hidden"/><strong className="font-black text-brand-dark not-italic uppercase bg-brand-gold px-2 py-1 rounded md:ml-2">Read the evidence.</strong>"
                    </div>
                </div>

                <div className="mt-20 pb-16 z-10 flex flex-wrap justify-center gap-6">
                    <Button onClick={() => navigateTo('MASTER_RECIPES')} variant="secondary" className="px-10 py-5 text-xl rounded-full">View Master Answer Key <IconCheck className="w-6 h-6"/></Button>
                    <Button onClick={() => navigateTo('SUBMIT')} className="px-10 py-5 text-xl rounded-full">Close Kitchen <IconArrowRight className="w-6 h-6"/></Button>
                </div>
            </div>
        );

        const MasterRecipesScreen = ({ navigateTo, goBack }) => {
            const [activeTab, setActiveTab] = React.useState('A');
            const student = STUDENTS[activeTab];

            return (
                <div className="min-h-screen p-6 md:p-12 flex flex-col relative safe-bottom">
                    <BackButton onClick={goBack} />
                    
                    <div className="max-w-6xl mx-auto w-full mt-16 md:mt-8 relative z-10 flex flex-col items-center">
                        <div className="bg-white p-8 md:p-10 rounded-3xl shadow-flat border-[3px] border-brand-dark text-center w-full mb-12">
                            <h1 className="text-4xl md:text-6xl font-black uppercase tracking-tight text-brand-dark flex items-center justify-center gap-4 mb-4">
                                <IconStar className="w-10 h-10 md:w-12 md:h-12 text-brand-gold"/> Master Chef Answer Key
                            </h1>
                            <p className="text-slate-600 text-lg font-bold">Review the recommended targeted interventions for each mystery basket profile.</p>
                        </div>
                        
                        <div className="flex gap-2 md:gap-4 mb-8 flex-wrap justify-center w-full">
                            {['A', 'B', 'C', 'D'].map(letter => (
                                <button 
                                    key={letter}
                                    onClick={() => setActiveTab(letter)}
                                    className={`px-8 py-4 rounded-xl font-black text-xl transition-all border-[3px] ${activeTab === letter ? 'bg-brand-red text-white border-brand-dark shadow-flat transform -translate-y-1' : 'bg-white text-brand-dark border-black/10 hover:bg-brand-cream hover:border-brand-dark'}`}
                                >
                                    STUDENT {letter}
                                </button>
                            ))}
                        </div>

                        <div className="bg-brand-cream p-8 md:p-12 rounded-3xl shadow-flat relative overflow-hidden border-[3px] border-brand-dark w-full animate-fade-in">
                            <div className="absolute -right-10 -top-10 opacity-5"><IconUtensils className="w-64 h-64 text-brand-dark"/></div>
                            
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b-2 border-black/10 pb-6 relative z-10 gap-4">
                                <div>
                                    <h3 className="text-xs font-black uppercase text-brand-orange tracking-widest mb-1 flex items-center gap-2"><IconChefHat className="w-5 h-5"/> Student {student.id} Target Skill</h3>
                                    <h2 className="text-2xl md:text-4xl font-black text-brand-dark">{student.recipeFocus}</h2>
                                </div>
                                <div className="bg-white border-2 border-black/10 px-4 py-2 rounded-xl text-brand-teal font-black text-sm uppercase shadow-sm">
                                    {student.stage}
                                </div>
                            </div>
                            
                            <div className="grid md:grid-cols-2 gap-10 relative z-10">
                                <div>
                                    <h4 className="font-black text-brand-dark uppercase text-sm mb-4 flex items-center gap-2"><IconCheck className="w-5 h-5 text-green-600"/> Recommended Ingredients</h4>
                                    <ul className="space-y-3">
                                        {student.recipeIngredients.map((ing, i) => (
                                            <li key={i} className="flex items-center gap-4 bg-white p-4 rounded-2xl border-2 border-black/10 shadow-sm text-brand-dark font-bold">
                                                <span className="w-4 h-4 rounded-full bg-brand-gold border-2 border-brand-dark"></span> {ing}
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                <div className="flex flex-col gap-6">
                                    <div className="bg-white p-6 rounded-2xl border-2 border-teal-200 shadow-sm h-full">
                                        <h4 className="font-black text-brand-teal uppercase text-sm mb-3 flex items-center gap-2"><IconBrain className="w-6 h-6"/> Clinical Dyslexia Profile Link</h4>
                                        <p className="text-base text-slate-700 leading-relaxed font-bold">{student.dyslexiaNote}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [phase, setPhase] = React.useState('START');
            const [globalTimeLeft, setGlobalTimeLeft] = React.useState(30 * 60);
            const [isGlobalTimerRunning, setIsGlobalTimerRunning] = React.useState(false);
            const [audioEnabled, setAudioEnabled] = React.useState(false);
            const [isMuted, setIsMuted] = React.useState(true);
            const synthsRef = React.useRef(null);

            React.useEffect(() => {
                let interval;
                if (isGlobalTimerRunning && globalTimeLeft > 0) {
                    interval = setInterval(() => setGlobalTimeLeft(prev => prev - 1), 1000);
                }
                return () => clearInterval(interval);
            }, [isGlobalTimerRunning, globalTimeLeft]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const navigateTo = (newPhase) => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setPhase(newPhase);
            };

            const initAudio = async () => {
                if (synthsRef.current) return;
                await Tone.start();
                
                const vol = new Tone.Volume(-15).toDestination(); 
                
                const marimba = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.0, release: 0.2 },
                    volume: -8
                }).connect(vol);
                
                const woodblock = new Tone.MembraneSynth({
                    pitchDecay: 0.01,
                    octaves: 1.5,
                    oscillator: { type: "square" },
                    envelope: { attack: 0.001, decay: 0.1, sustain: 0.0, release: 0.1 },
                    volume: -10
                }).connect(vol);

                const loop = new Tone.Loop((time) => {
                    woodblock.triggerAttackRelease("C4", "16n", time);
                }, "4n");
                
                const melody = new Tone.Sequence((time, note) => {
                    if (note !== null) marimba.triggerAttackRelease(note, "16n", time);
                }, ["E4", "G4", "C5", null, "G4", "C5", "E5", null], "8n");

                Tone.Transport.bpm.value = 130;
                synthsRef.current = { vol, loop, melody };
                
                Tone.Transport.start();
                synthsRef.current.loop.start(0);
                synthsRef.current.melody.start(0);
                
                setAudioEnabled(true);
                setIsMuted(false); 
            };

            const toggleMute = () => {
                if (synthsRef.current) {
                    const newMute = !isMuted;
                    synthsRef.current.vol.mute = newMute;
                    Tone.Destination.mute = newMute;
                    setIsMuted(newMute);
                }
            };

            return (
                <div className="font-sans antialiased text-brand-dark selection:bg-brand-gold selection:text-brand-dark flex flex-col min-h-screen relative overflow-x-hidden">
                    
                    {phase !== 'START' && (
                        <>
                            <header className="bg-brand-cream text-brand-dark p-4 flex justify-between items-center z-50 border-b-4 border-black/10">
                                <div className="font-black uppercase tracking-wider flex items-center gap-2 cursor-pointer hover:text-brand-orange transition-colors text-sm md:text-base" onClick={() => navigateTo('MYSTERY_BASKET')}>
                                    <IconChefHat className="text-brand-red"/> Stage <span className="text-brand-red bg-red-100 px-2 rounded ml-1">CHOPPED</span>
                                </div>
                                <div className="flex gap-2 md:gap-4 items-center">
                                    {audioEnabled && (
                                        <button onClick={toggleMute} className="text-brand-dark hover:bg-white transition-colors bg-white/50 px-3 md:px-4 py-2 rounded-xl border-2 border-brand-dark flex items-center gap-2 font-black text-xs md:text-sm shadow-sm">
                                            {isMuted ? <><IconVolumeX className="w-4 h-4 md:w-5 h-5"/> Play Music</> : <><IconVolume className="w-4 h-4 md:w-5 h-5 text-brand-orange"/> Mute Music</>}
                                        </button>
                                    )}
                                    <div className={`font-mono font-black px-2 md:px-3 py-1.5 rounded-xl border-[3px] flex items-center gap-2 shadow-sm bg-white ${globalTimeLeft < 300 ? 'text-brand-red border-brand-red animate-pulse' : 'text-brand-dark border-brand-dark'}`}>
                                        <button onClick={() => setIsGlobalTimerRunning(!isGlobalTimerRunning)} className="hover:bg-brand-gold hover:text-brand-dark text-slate-500 transition-colors focus:outline-none flex items-center justify-center bg-brand-cream border-2 border-black/10 p-1.5 rounded-lg">
                                            {isGlobalTimerRunning ? <IconPause className="w-3 h-3"/> : <IconPlay className="w-3 h-3 pl-0.5"/>}
                                        </button>
                                        <span className="w-12 text-center text-sm md:text-base">{formatTime(globalTimeLeft)}</span>
                                    </div>
                                </div>
                            </header>
                            <ProgressBar currentPhase={phase} />
                        </>
                    )}

                    <main className="flex-grow">
                        {phase === 'START' && <StartScreen nextPhase={() => navigateTo('KITCHEN_STADIUM')} initAudio={initAudio} />}
                        {phase === 'KITCHEN_STADIUM' && <FacilitatorIntroScreen nextPhase={() => navigateTo('MISE_EN_PLACE')} goBack={() => navigateTo('START')} />}
                        {phase === 'MISE_EN_PLACE' && <MiseEnPlaceScreen nextPhase={() => navigateTo('BREAKOUT')} goBack={() => navigateTo('KITCHEN_STADIUM')} />}
                        {phase === 'BREAKOUT' && <BreakoutScreen nextPhase={() => navigateTo('KITCHEN_RULES')} goBack={() => navigateTo('MISE_EN_PLACE')} />}
                        {phase === 'KITCHEN_RULES' && <RulesScreen nextPhase={() => navigateTo('MYSTERY_BASKET')} goBack={() => navigateTo('BREAKOUT')} />}
                        {phase === 'MYSTERY_BASKET' && <MysteryBasketScreen navigateTo={navigateTo} />}
                        {phase === 'STUDENT_A' && <StudentArtifactScreen student={STUDENTS.A} goBack={() => navigateTo('MYSTERY_BASKET')} />}
                        {phase === 'STUDENT_B' && <StudentArtifactScreen student={STUDENTS.B} goBack={() => navigateTo('MYSTERY_BASKET')} />}
                        {phase === 'STUDENT_C' && <StudentArtifactScreen student={STUDENTS.C} goBack={() => navigateTo('MYSTERY_BASKET')} />}
                        {phase === 'STUDENT_D' && <StudentArtifactScreen student={STUDENTS.D} goBack={() => navigateTo('MYSTERY_BASKET')} />}
                        {phase === 'FRAMEWORK' && <FrameworkScreen navigateTo={navigateTo} />}
                        {phase === 'SORTING' && <SortingScreen navigateTo={navigateTo} />}
                        {phase === 'DYSLEXIA' && <DyslexiaScreen navigateTo={navigateTo} />}
                        {phase === 'PLATE' && <PlateScreen navigateTo={navigateTo} />}
                        {phase === 'JUDGES' && <JudgesPitchScreen navigateTo={navigateTo} />}
                        {phase === 'DEBRIEF' && <DebriefScreen navigateTo={navigateTo} />}
                        {phase === 'MASTER_RECIPES' && <MasterRecipesScreen navigateTo={navigateTo} goBack={() => navigateTo('DEBRIEF')} />}
                        
                        {phase === 'SUBMIT' && (
                            <div className="min-h-screen p-8 flex flex-col items-center justify-center text-center safe-bottom">
                                <div className="bg-white p-8 md:p-12 rounded-3xl border-[3px] border-brand-dark shadow-flat max-w-2xl w-full text-left relative overflow-hidden">
                                    <div className="absolute -top-10 -right-10 bg-green-100 rounded-full w-48 h-48 flex items-center justify-center border-4 border-green-200">
                                        <IconCheck className="w-24 h-24 text-green-500 ml-4 mt-4" />
                                    </div>
                                    <h1 className="text-5xl md:text-7xl font-black uppercase text-brand-dark mb-4 relative z-10">Done!</h1>
                                    <h2 className="text-2xl font-black uppercase mb-8 text-brand-orange pb-4 relative z-10">Service Complete</h2>
                                    <ul className="space-y-4 mb-10 relative z-10">
                                        <li className="flex items-center gap-4 bg-brand-cream p-4 rounded-2xl border-2 border-black/10 text-brand-dark font-bold shadow-sm"><IconCheck className="w-6 h-6 text-green-600"/> Completed collaborative slide deck</li>
                                        <li className="flex items-center gap-4 bg-brand-cream p-4 rounded-2xl border-2 border-black/10 text-brand-dark font-bold shadow-sm"><IconCheck className="w-6 h-6 text-green-600"/> Final instructional recipe</li>
                                        <li className="flex items-center gap-4 bg-brand-cream p-4 rounded-2xl border-2 border-black/10 text-brand-dark font-bold shadow-sm"><IconCheck className="w-6 h-6 text-green-600"/> 45-second cooking-show pitch</li>
                                    </ul>
                                    <button className="w-full bg-brand-dark text-white p-6 rounded-2xl text-xl font-black uppercase tracking-widest hover:bg-black transition-colors flex items-center justify-center gap-3 shadow-flat relative z-10">
                                        [INSERT CANVAS LINK] <IconArrowRight className="w-6 h-6"/>
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
