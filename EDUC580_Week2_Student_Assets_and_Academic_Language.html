*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.45}
.app{height:100%;display:flex;flex-direction:column}
.hero{flex:none;display:flex;align-items:center;gap:16px;padding:8px 20px;background:linear-gradient(115deg,var(--navy),var(--navy2) 60%,#2a6f8f);color:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kid{position:relative;display:flex;gap:10px;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}

.kid.sel .chk{background:var(--teal);border-color:var(--teal)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-bottom:3px;background:#e8eef5;color:var(--navy)}
.tag.el{background:#fde8d0;color:#8a4b08}.tag.sn{background:#e3e6fb;color:#363f9a}.tag.ot{background:#e0f3ee;color:#1c6b5f}.tag.no{background:#eceff1;color:#455a64}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}

.opts{display:grid;gap:7px}
.opt{font:inherit;text-align:left;background:#f7f9fc;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--ink)}

.opt:disabled{cursor:default}.opt:disabled:not(.good):not(.bad){opacity:.55}

.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-weight:600;font-size:13.5px;color:var(--navy)}
select,textarea,input[type=text]{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}

.checks input{margin-top:3px;accent-color:var(--teal)}

.bubble:before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:var(--navy2);border-left:0}

.hs{cursor:pointer}.hs .ring{animation:pulse 1.8s infinite;transform-box:fill-box;transform-origin:center}
.hs.seen .ring{animation:none;opacity:0}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.hs:hover circle.dot,.hs:focus circle.dot{stroke:#f2b705;stroke-width:4}
.ok-badge{display:inline-flex;align-items:center;gap:6px;background:var(--okbg);color:#0f4d2a;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}
.mini{font-size:12.5px;color:var(--mute)}

@media (max-width:720px){.hero .bn{display:none}.hero h1{font-size:18px}.hero p{display:none}.pill .t{display:none}.pill{justify-content:center;padding:5px}.g2,.g3{grid-template-columns:1fr}.crow{grid-template-columns:1fr}.cbtns{justify-content:flex-start}main{padding:12px}.scn{grid-template-columns:56px 1fr}.scn .av svg{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<script>const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function shuf(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}
let _uid=0;
function avatar(o,size=72){const id='c'+(++_uid),H=o.hair;
 const front={short:`<path d="M24 35Q22 15 40 15Q58 15 56 35Q50 25 40 26Q30 25 24 35Z" fill="${H}"/>`,
 long:`<path d="M24 35Q24 19 40 19Q56 19 56 35Q48 26 40 27Q32 26 24 35Z" fill="${H}"/>`,
 curly:`<circle cx="26" cy="27" r="9" fill="${H}"/><circle cx="40" cy="21" r="10" fill="${H}"/><circle cx="54" cy="27" r="9" fill="${H}"/><circle cx="24" cy="38" r="6" fill="${H}"/><circle cx="56" cy="38" r="6" fill="${H}"/>`,

 buzz:`<path d="M25 33Q25 18 40 18Q55 18 55 33Q48 26 40 26Q32 26 25 33Z" fill="${H}"/>`}[o.style||'short'];
 const back=o.style==='long'?`<path d="M22 40Q20 13 40 13Q60 13 58 40L58 64L22 64Z" fill="${H}"/>`:'';
 const gl=o.glasses?`<g fill="none" stroke="#333" stroke-width="1.6"><circle cx="34" cy="38" r="5.5"/><circle cx="46" cy="38" r="5.5"/><path d="M39.5 38h1"/></g>`:'';
 return `<svg viewBox="0 0 80 80" width="${size}" height="${size}" role="img" aria-label="${o.name||'Student'} illustration"><defs><clipPath id="${id}"><circle cx="40" cy="40" r="40"/></clipPath></defs><g clip-path="url(#${id})"><rect width="80" height="80" fill="${o.bg}"/>${back}<path d="M10 82Q12 57 40 57Q68 57 70 82Z" fill="${o.shirt}"/><rect x="35" y="48" width="10" height="12" rx="3" fill="${o.skin}"/><circle cx="40" cy="38" r="16" fill="${o.skin}"/>${front}<circle cx="34" cy="38" r="1.9" fill="#222"/><circle cx="46" cy="38" r="1.9" fill="#222"/><path d="M34 44.5Q40 49 46 44.5" stroke="#7a3b2e" stroke-width="2" fill="none" stroke-linecap="round"/>${gl}</g></svg>`}

function mcq(parent,{prompt,options,onCorrect,shuffle=true,cls=''}){
 const box=el('div','q '+cls);if(prompt)box.appendChild(el('p','qp',prompt));
 const list=el('div','opts'),fb=el('div','fb');fb.setAttribute('role','status');let done=false;
 (shuffle?shuf(options):options).forEach(o=>{const b=el('button','opt',o.t);b.type='button';
  b.onclick=()=>{if(done||b.classList.contains('bad'))return;
   if(o.ok){done=true;b.classList.add('good');$$('.opt',list).forEach(x=>x.disabled=true);fb.className='fb show good';fb.innerHTML='✅ '+o.fb;onCorrect&&onCorrect()}
   else{b.classList.add('bad');b.disabled=true;fb.className='fb show bad';fb.innerHTML='🔁 '+o.fb+' <b>Try another option.</b>'}};
  list.appendChild(b)});
 box.appendChild(list);box.appendChild(fb);parent.appendChild(box);return box}

function classify(parent,{items,cats,onDone,shuffle=true}){
 let n=0;const prog=el('div','prog',`0 / ${items.length} sorted`);parent.appendChild(prog);
 (shuffle?shuf(items):items).forEach(it=>{
  const row=el('div','crow');row.appendChild(el('div','',it.t));const btns=el('div','cbtns'),note=el('div','cnote');note.setAttribute('role','status');
  cats.forEach(c=>{const b=el('button','cbtn',c.label);b.type='button';
   b.onclick=()=>{if(row.dataset.ok)return;
    if(c.id===it.cat){row.dataset.ok=1;row.classList.add('ok');$$('.cbtn',btns).forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('dim')});b.classList.add('sel');
     note.className='cnote show good';note.innerHTML='✅ '+it.why;n++;prog.textContent=`${n} / ${items.length} sorted`;if(n===items.length&&onDone)onDone()}
    else{b.classList.add('wrong');b.disabled=true;note.className='cnote show bad';note.innerHTML='🔁 Not quite — try another category.'}};
   btns.appendChild(b)});
  row.appendChild(btns);row.appendChild(note);parent.appendChild(row)})}

function copyBox(ta,btn){btn.onclick=()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 const old=btn.textContent;btn.textContent=ok?'Copied ✓':'Press Ctrl/Cmd + C to copy';setTimeout(()=>btn.textContent=old,2200)}}

function runApp({steps}){
 const stepsEl=$('#steps'),main=$('#main'),back=$('#back'),next=$('#next'),stat=$('#stat');
 const done=steps.map(()=>false);let cur=0;
 const pills=steps.map((s,i)=>{const p=el('button','pill',`<span class="n">${i+1}</span><span class="t">${s.name}</span>`);p.type='button';p.title=s.name;p.onclick=()=>go(i);stepsEl.appendChild(p);return p});
 const panels=steps.map((s,i)=>{const d=el('section','panel');d.setAttribute('aria-label',s.name);main.appendChild(d);
  s.build(d,()=>{done[i]=true;paint()});return d});
 function paint(){pills.forEach((p,i)=>{p.classList.toggle('on',i===cur);p.classList.toggle('done',done[i]);p.querySelector('.n').textContent=done[i]&&i!==cur?'✓':i+1;if(i===cur)p.setAttribute('aria-current','step');else p.removeAttribute('aria-current')});
  panels.forEach((d,i)=>d.classList.toggle('show',i===cur));back.disabled=cur===0;next.disabled=cur===steps.length-1;
  stat.textContent=`Step ${cur+1} of ${steps.length} · ${done.filter(Boolean).length} completed`}
 function go(i){cur=i;paint();steps[i].show&&steps[i].show(panels[i]);main.scrollTop=0}
 back.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);go(0)}

const KIDS=[
{id:'sofia',name:'Sofia',cat:'el',tag:'English learner',av:{name:'Sofia',bg:'#ffe0b8',skin:'#c68642',hair:'#2b1b17',shirt:'#e76f51',style:'long'},

const kcard=k=>`<div class="av">${avatar(k.av)}</div><div><span class="tag ${k.cat}">${k.tag}</span><h4>${k.name}</h4><p>${k.info}</p></div>`;

runApp({steps:[
{name:'Focus Students',build(p,ok){
 p.innerHTML=`<h2>Meet your class of 24</h2><p class="lead">Your Grade 3 math class is learning to compare fractions. CalTPA asks for <b>three focus students</b> who show a <b>variety of assets and learning needs</b>.</p><div class="callout"><span>🎯</span><div><b>Your task:</b> select three students: one <b>English learner</b>, one with <b>special needs</b> (IEP/504), and one with <b>other learning or social needs</b>.</div></div>`;
 const g=el('div','grid g3');const fb=el('div','fb');const btn=el('button','btn','Check my selection');btn.type='button';
 KIDS.forEach(k=>{const b=el('button','kid',kcard(k)+'<span class="chk" aria-hidden="true"></span>');b.type='button';b.setAttribute('aria-pressed','false');
  b.onclick=()=>{const i=picked.indexOf(k.id);if(i>-1)picked.splice(i,1);else if(picked.length<3)picked.push(k.id);else{fb.className='fb show info';fb.textContent='You can choose three. Deselect one to swap.';return}
   $$('.kid',g).forEach((x,j)=>{const s=picked.includes(KIDS[j].id);x.classList.toggle('sel',s);x.setAttribute('aria-pressed',s);x.querySelector('.chk').textContent=s?'✓':''});fb.className='fb'};g.appendChild(b)});
 btn.onclick=()=>{const cs=picked.map(id=>KIDS.find(k=>k.id===id).cat);
  if(picked.length<3){fb.className='fb show info';fb.textContent='Select three students first.';return}
  const has=c=>cs.includes(c);
  if(has('el')&&has('sn')&&has('ot')){fb.className='fb show good';fb.innerHTML='✅ <b>Great variety!</b> You have an English learner, a student with special needs, and a student with other learning or social needs. Each one gives you different assets to plan around. Move on to the next step.';ok()}
  else{let m='🔁 Not yet. ';if(!has('el'))m+='Add an English learner. ';if(!has('sn'))m+='Add a student with an IEP or 504. ';if(!has('ot'))m+='Add a student with other learning or social needs. ';if(has('no'))m+='Lily is a wonderful student, but she doesn’t add variety of needs for this assessment. ';if(cs.filter(c=>c==='el').length>1)m+='Two English learners overlap, so swap one. ';fb.className='fb show bad';fb.textContent=m}};
 p.appendChild(g);const row=el('div','',''); row.style.cssText='margin-top:12px';row.appendChild(btn);p.appendChild(row);p.appendChild(fb)}},

{name:'Asset Language',build(p,ok){
 p.innerHTML=`<h2>Describe students by what they bring</h2><p class="lead">An asset-based description starts with strengths and avoids deficit-oriented language. For each statement, choose the stronger rewrite.</p>`;
 let n=0;const total=4;const hit=()=>{if(++n===total){const d=el('div','fb show good','🌟 <b>Nice work.</b> Notice the pattern: name the asset, name the need accurately, and state the support you’ll provide.');p.appendChild(d);ok()}};
 [['“Marcus is bad at reading, so he can’t do word problems.”',[{t:'Marcus has an IEP for reading and shows strong spatial reasoning, so I’ll pair word problems with diagrams and read-aloud support.',ok:1,fb:'Asset, accurate need, and support are all named.'},{t:'Marcus struggles with word problems, so he’ll do the easier ones.',fb:'This is still deficit-focused and lowers expectations.'},{t:'Marcus’s reading disability limits what he can learn in math.',fb:'This is a deficit claim and isn’t true — access is the barrier, not ability.'}]],
 ['“Sofia doesn’t speak English well.”',[{t:'Sofia is building English and explains math clearly in Spanish, so I’ll let her rehearse ideas in Spanish before sharing in English with a sentence frame.',ok:1,fb:'It recognizes her bilingual strength and plans language support.'},{t:'Sofia has limited English, so she needs a translator.',fb:'“Limited” frames her by what she lacks.'},{t:'Sofia isn’t ready for grade-level math talk.',fb:'Language development isn’t the same as math readiness.'}]],
 ['“Jayden is a behavior problem.”',[{t:'Jayden is a natural peer leader who is still learning to manage frustration, so I’ll give him clear routines and structured leadership roles.',ok:1,fb:'It names the leadership asset and a concrete plan.'},{t:'Jayden is disruptive and needs consequences.',fb:'This labels the student instead of describing needs and supports.'},{t:'Jayden has behavior issues, so he must sit apart.',fb:'It removes him from peers who could help.'}]],
 ['“Ava can’t pay attention.”',[{t:'Ava has a 504 for ADHD and is a gifted storyteller, so I’ll chunk tasks and invite her to tell the math story with movement breaks.',ok:1,fb:'Uses her plan and her strength together.'},{t:'Ava is hyper and won’t focus on math.',fb:'This is vague and negative.'},{t:'Ava’s ADHD makes group work impossible.',fb:'It’s an absolute deficit claim, and it contradicts what she does well.'}]]
 ].forEach(([s,o])=>{const b=el('div','','');p.appendChild(el('p','mini','Deficit-oriented statement:'));mcq(p,{prompt:s,options:o,onCorrect:hit})})}},

{name:'Assets → Math',show(p){this.draw(p)},build(p,ok){this.ok=ok;p.innerHTML='';this.draw=(root)=>{root.innerHTML=`<h2>Connect each asset to your math lesson</h2><p class="lead">For each of your focus students, choose the lesson idea that best builds on their asset.</p>`;let n=0;const cs=chosen();
  cs.forEach(k=>{const w=el('div','scn');w.appendChild(el('div','av',avatar(k.av)));const r=el('div','');
   r.appendChild(el('div','',`<span class="tag ${k.cat}">${k.tag}</span> <b>${k.name}</b>`));r.appendChild(el('div','mini',`<b>Asset:</b> ${k.asset}<br><b>Need:</b> ${k.need}`));
   mcq(r,{prompt:'Which lesson idea best uses '+k.name+'’s asset?',options:k.opts,onCorrect:()=>{if(++n===cs.length){root.appendChild(el('div','fb show good','🌟 All three connections made. In your CalTPA Plan, name each asset <b>and</b> explain how it informs your math instruction.'));this.ok()}}});
   w.appendChild(r);root.appendChild(w)})}}},

{name:'Language Demands',build(p,ok){
 p.innerHTML=`<h2>Academic Language Development (ALD)</h2><p class="lead">Lesson: <b>“Compare 1/2 and 1/4 with fraction strips and explain which is greater.”</b> First, name the language domain each task demands.</p>`;
 let a=false,b=false;const chk=()=>{if(a&&b)ok()};
 classify(p,{cats:[{id:'L',label:'Listening'},{id:'S',label:'Speaking'},{id:'R',label:'Reading'},{id:'W',label:'Writing'}],onDone:()=>{a=true;chk()},items:[
 {t:'Hear a partner explain why 1/2 is greater than 1/4.',cat:'L',why:'Taking in spoken math reasoning is a listening demand.'},
 {t:'Tell a partner: “1/2 is greater than 1/4 because…”',cat:'S',why:'Producing oral explanations is a speaking demand.'},
 {t:'Read the word problem: “Mia ate 1/3 of a pizza…”',cat:'R',why:'Making meaning of printed text is a reading demand.'},
 {t:'Write a math-journal explanation using numerator and denominator.',cat:'W',why:'Composing written explanations is a writing demand.'},
 {t:'Follow the teacher’s spoken directions for using the strips.',cat:'L',why:'Following oral directions is a listening demand.'},
 {t:'Share your comparison with the class using a sentence frame.',cat:'S',why:'Presenting to the class is a speaking demand.'}]});
 const h=el('div','',`<h3 style="margin-top:14px">Now choose language supports</h3><p class="lead">Select <b>at least three</b> supports that make these demands accessible <i>without</i> lowering the math.</p>`);p.appendChild(h);
 const sup=[['Sentence frames (“___ is greater than ___ because ___”)',1],['Visual word wall with fraction pictures',1],['Partner talk, with home-language rehearsal allowed',1],['Manipulatives and gestures to show meaning',1],['Bilingual glossary of key terms',1],['Avoid academic vocabulary altogether',0],['Give answers so students don’t have to explain',0]];
 const box=el('div','checks');sup.forEach(([t,g])=>{const l=el('label','',`<input type="checkbox" data-g="${g}"><span>${t}</span>`);box.appendChild(l)});p.appendChild(box);
 const fb=el('div','fb');const bt=el('button','btn','Check my supports');bt.type='button';bt.style.marginTop='10px';
 bt.onclick=()=>{const c=$$('input:checked',box);const bad=c.filter(x=>x.dataset.g==='0').length;
  if(bad){fb.className='fb show bad';fb.textContent='🔁 Remove the supports that take the language work away. ALD means building language, not avoiding it.'}
  else if(c.length<3){fb.className='fb show info';fb.textContent='Choose at least three supports.'}
  else{fb.className='fb show good';fb.innerHTML='✅ Strong choices. These supports keep rigor high while making language accessible.';b=true;chk()}};
 p.appendChild(bt);p.appendChild(fb)}},

{name:'My Plan Snapshot',show(p){this.draw(p)},build(p,ok){this.ok=ok;this.draw=(root)=>{const cs=chosen();
  root.innerHTML=`<h2>Your Part 1 snapshot</h2><p class="lead">Finish with Universal Design for Learning (UDL): plan options before you teach. Then copy your snapshot into your notes for the CalTPA Plan | Part 1.</p>`;
  const g=el('div','grid g3');[['Engagement','How students are motivated',['Choice of real-world context (baking, sports, puzzles)','Same task for everyone, no choices','Teacher decides all partners and topics']],['Representation','How content is presented',['Strips, number lines, and read-aloud text','Text-only worksheet','Teacher lecture only']],['Action & Expression','How students show learning',['Build, draw, say, or write the comparison','Written answer only','Oral answer only, in English']]].forEach(([t,d,o])=>{const f=el('div','field');f.innerHTML=`<label>${t}<span class="mini"> · ${d}</span></label>`;const s=el('select');s.innerHTML='<option value="">Choose an option…</option>'+shuf(o.map((x,i)=>`<option data-ok="${i===0?1:0}">${x}</option>`)).join('');s.dataset.t=t;f.appendChild(s);g.appendChild(f)});root.appendChild(g);
  const ta=el('textarea');ta.readOnly=true;ta.setAttribute('aria-label','Your snapshot');const cp=el('button','btn','Copy snapshot');cp.type='button';copyBox(ta,cp);
  const upd=()=>{const u=$$('select',g).map(s=>`• ${s.dataset.t}: ${s.value||'(not chosen)'}`).join('\n');
   ta.value=`FOCUS STUDENTS\n`+cs.map(k=>`• ${k.name} (${k.tag}) — Asset: ${k.asset} Need: ${k.need}`).join('\n')+`\n\nUDL PLAN (Grade 3: Comparing Fractions)\n${u}\n\nACADEMIC LANGUAGE: Name at least three ALD supports (e.g., sentence frames, visual word wall, partner talk).`;
   if($$('select',g).every(s=>s.value==='')){return}
   const sel=$$('select',g);if(sel.some(s=>!s.value)){fb.className='fb show info';fb.textContent='Choose an option in all three UDL areas.';return}
   const wrong=sel.filter(s=>s.selectedOptions[0].dataset.ok!=='1').map(s=>s.dataset.t);
   if(wrong.length){fb.className='fb show bad';fb.textContent='🔁 Revisit: '+wrong.join(', ')+'. UDL offers multiple options, not one path for everyone.'}else{fb.className='fb show good';fb.innerHTML='✅ <b>Snapshot complete.</b> Every area offers multiple options. Copy it below.';this.ok()}};
  const fb=el('div','fb');g.addEventListener('change',upd);upd();root.appendChild(fb);
  root.appendChild(el('p','qp','Your snapshot')).style.marginTop='12px';root.appendChild(ta);const r=el('div','');r.style.marginTop='8px';r.appendChild(cp);root.appendChild(r)}}}
]});
</script></body></html>
