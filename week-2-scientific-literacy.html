<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSYC 510 Week 2: Reading Research Like a Practitioner</title>
<style>
:root{--red:#d34147;--red-d:#a8353a;--sand:#edebe8;--ink:#2b2b2b;--mut:#5b5b5b;--ok:#1d7a4d;--okbg:#e6f4ec;--bad:#a8353a;--badbg:#fbeaea;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#fff}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.45;font-size:15px}
.app{height:100%;overflow-y:auto;overflow-x:hidden;padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--sand);padding-bottom:6px}
header .ico{flex:0 0 44px;width:44px;height:44px}
.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red-d);font-weight:700}
h1{font-size:1.35rem;margin:0;line-height:1.2}
.sub{margin:2px 0 0;color:var(--mut);font-size:.92rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;border:2px solid var(--sand);background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.tab:hover{border-color:var(--red)}
button:focus-visible{outline:3px solid #1a4fd6;outline-offset:2px}
.panel{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:12px;background:var(--sand);border-radius:18px;padding:10px}
.panel[hidden]{display:none}
.gfx{background:#fff;border-radius:14px;padding:8px;display:flex;align-items:center;justify-content:center;min-height:0}
.gfx svg{width:100%;height:auto;max-height:100%;display:block}
.qa{background:#fff;border-radius:14px;padding:10px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.intro{font-size:.9rem;color:var(--mut);margin:0}
.count{font-size:.8rem;font-weight:700;color:var(--red-d);text-transform:uppercase;letter-spacing:.05em}
.bar{height:6px;background:var(--sand);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--red);transition:width .3s}
.q{font-size:1rem;font-weight:600;margin:2px 0}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{font:inherit;text-align:left;background:#fcfcfc;border:2px solid #ddd;border-left:6px solid var(--red);border-radius:12px;padding:6px 12px;cursor:pointer;min-height:42px;color:var(--ink)}
.opt:hover:not(:disabled){background:#fff5f5;border-color:var(--red)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok);border-left-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{min-height:0;font-size:.95rem}
.fb .box{border-radius:12px;padding:7px 12px;font-size:.9rem}
.fb .ok{background:var(--okbg);border-left:6px solid var(--ok)}
.fb .no{background:var(--badbg);border-left:6px solid var(--bad)}
.nav{margin-top:auto;display:flex;justify-content:flex-end;min-height:44px}
.btn{font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:999px;padding:8px 22px;cursor:pointer;min-height:44px}
.btn:hover{background:var(--red-d)}
.btn[hidden]{display:none}
.done{text-align:center;padding:10px}
.done .score{font-size:2.2rem;font-weight:800;color:var(--red-d)}
.note{font-size:.78rem;color:var(--mut);margin:0}
@media (max-width:680px){.panel{grid-template-columns:1fr}.gfx svg{max-height:200px}h1{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header><svg class="ico" viewBox="0 0 52 52" role="img" aria-label="Bar chart with magnifying glass"><rect x="6" y="28" width="9" height="16" fill="#edebe8" stroke="#d34147" stroke-width="2.5"/><rect x="18" y="18" width="9" height="26" fill="#d34147"/><rect x="30" y="24" width="9" height="20" fill="#edebe8" stroke="#d34147" stroke-width="2.5"/><circle cx="36" cy="14" r="8" fill="#fff" stroke="#a8353a" stroke-width="3"/><path d="M42 20l6 6" stroke="#a8353a" stroke-width="4" stroke-linecap="round"/></svg><div><div class="kicker">PSYC 510 &middot; Week 2 Interactive</div><h1>Reading Research Like a Practitioner</h1><p class="sub">Match statistics to questions, then identify the reliability and validity evidence in a study.</p></div></header>
<div class="tabs" role="tablist" aria-label="Activities"><button type="button" role="tab" class="tab" aria-selected="false">Pick the Analysis</button><button type="button" role="tab" class="tab" aria-selected="false">Find the Evidence</button></div>
<section class="panel" id="p1" role="tabpanel"><div class="gfx"></div><div class="qa"></div></section><section class="panel" id="p2" role="tabpanel"><div class="gfx"></div><div class="qa"></div></section>
</div>
<script>
function Quiz(root, items, o){
  o=o||{}; var i=0, score=0, picks=[], answered=false;
  var gfx=root.querySelector('.gfx'), qa=root.querySelector('.qa');
  function esc(s){return s}
  function draw(ans, it){ gfx.innerHTML = o.gfx ? o.gfx(i,picks,ans,it) : it.svg; }
  function render(){
    answered=false; var it=items[i]; draw(false,it);
    var opts=it.opts.map(function(t,k){return '<button type="button" class="opt" data-k="'+k+'">'+t+'</button>';}).join('');
    qa.innerHTML=(o.intro?'<p class="intro">'+o.intro+'</p>':'')+
      '<div class="count">'+(o.label||'Question')+' '+(i+1)+' of '+items.length+'</div>'+
      '<div class="bar" aria-hidden="true"><span style="width:'+(i/items.length*100)+'%"></span></div>'+
      '<p class="q">'+it.q+'</p><div class="opts">'+opts+'</div>'+
      '<div class="fb" aria-live="polite"></div>'+
      '<div class="nav"><button type="button" class="btn next" hidden>'+(i<items.length-1?'Next':'See results')+'</button></div>';
  }
  function finish(){
    gfx.innerHTML = o.doneGfx ? o.doneGfx() : (o.gfx? o.gfx(items.length-1,picks,true,items[items.length-1]):'');
    var pct=Math.round(score/items.length*100);
    var msg = pct===100 ? (o.perfect||'Excellent work.') : pct>=60 ? 'Good progress. Review the explanations and try again for a perfect round.' : 'Worth another pass. Read each explanation, then restart.';
    qa.innerHTML='<div class="done"><div class="count">Results</div><div class="score">'+score+' / '+items.length+'</div><p>'+msg+'</p><button type="button" class="btn restart">Try again</button></div>';
    qa.querySelector('.restart').focus();
  }
  qa.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.classList.contains('restart')){i=0;score=0;picks=[];render();return;}
    if(b.classList.contains('next')){ if(i<items.length-1){i++;render();qa.querySelector('.opt').focus();} else finish(); return;}
    if(b.classList.contains('opt') && !answered){
      answered=true; var it=items[i], k=+b.dataset.k, ok=(k===it.ans); if(ok) score++; picks[i]=k;
      qa.querySelectorAll('.opt').forEach(function(x){x.disabled=true; if(+x.dataset.k===it.ans) x.classList.add('right');});
      if(!ok) b.classList.add('wrong');
      qa.querySelector('.fb').innerHTML='<div class="box '+(ok?'ok':'no')+'"><strong>'+(ok?'Correct. ':'Not quite. ')+'</strong>'+it.why+'</div>';
      var n=qa.querySelector('.next'); n.hidden=false; n.focus(); draw(true,it);
    }
  });
  render();
}
function initTabs(){
  var tabs=[].slice.call(document.querySelectorAll('.tab')), panels=[].slice.call(document.querySelectorAll('.panel'));
  function sel(n){tabs.forEach(function(t,k){t.setAttribute('aria-selected',k===n);t.tabIndex=k===n?0:-1;});panels.forEach(function(p,k){p.hidden=k!==n;});}
  tabs.forEach(function(t,k){t.addEventListener('click',function(){sel(k);});
    t.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){var n=(k+d+tabs.length)%tabs.length;sel(n);tabs[n].focus();}});});
  sel(0);
}

(function(){
function axes(){return '<line x1="30" y1="20" x2="30" y2="200" stroke="#2b2b2b" stroke-width="2"/><line x1="30" y1="200" x2="250" y2="200" stroke="#2b2b2b" stroke-width="2"/>';}
function bars(vals,labels,cap){
  var s='<svg viewBox="0 0 260 260" role="img" aria-label="'+cap+'">'+axes(), w=(220/vals.length)-18;
  vals.forEach(function(v,k){var x=42+k*(w+18);s+='<rect x="'+x+'" y="'+(200-v)+'" width="'+w+'" height="'+v+'" rx="4" fill="'+(k%2?'#a8353a':'#d34147')+'"/><text x="'+(x+w/2)+'" y="220" text-anchor="middle" font-size="12" fill="#2b2b2b">'+labels[k]+'</text>';});
  return s+'<text x="130" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#a8353a">'+cap+'</text></svg>';
}
function manova(){
  var s='<svg viewBox="0 0 260 260" role="img" aria-label="Two groups compared on three outcomes at once">'+axes(), g=[[90,60,110],[130,100,70]];
  ['Mood','Anxiety','Sleep'].forEach(function(n,k){var x=42+k*72;
    s+='<rect x="'+x+'" y="'+(200-g[0][k])+'" width="26" height="'+g[0][k]+'" rx="3" fill="#d34147"/><rect x="'+(x+28)+'" y="'+(200-g[1][k])+'" width="26" height="'+g[1][k]+'" rx="3" fill="#a8353a"/><text x="'+(x+27)+'" y="220" text-anchor="middle" font-size="12" fill="#2b2b2b">'+n+'</text>';});
  return s+'<text x="130" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#a8353a">2 groups, 3 outcomes</text></svg>';
}
function scatter(){
  var pts=[[50,170],[68,150],[85,158],[100,120],[118,126],[135,96],[150,100],[170,70],[190,76],[215,48]];
  var s='<svg viewBox="0 0 260 260" role="img" aria-label="Scatterplot showing a positive relationship">'+axes();
  s+='<line x1="44" y1="178" x2="228" y2="42" stroke="#a8353a" stroke-width="2.5" stroke-dasharray="6 4"/>';
  pts.forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="#d34147" stroke="#fff" stroke-width="2"/>';});
  return s+'<text x="130" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#a8353a">Strength and direction</text></svg>';
}
var G={t:bars([120,75],['Group A','Group B'],'Two group means'),a:bars([70,115,150],['A','B','C'],'Three group means'),m:manova(),c:scatter()};
var AO=["t-test","ANOVA","MANOVA","Correlational analysis"];
Quiz(document.getElementById('p1'),[
 {q:"A researcher compares the average anxiety score of a treatment group with that of a control group.",svg:G.t,opts:AO,ans:0,why:"Two groups, one outcome: a t-test compares the means of two groups."},
 {q:"A study compares the mean exam scores of students taught with three different methods.",svg:G.a,opts:AO,ans:1,why:"Three groups, one outcome: ANOVA compares the means of three or more groups."},
 {q:"Two groups are compared on depression, anxiety, and sleep quality at the same time.",svg:G.m,opts:AO,ans:2,why:"More than one outcome at once: MANOVA compares groups on several outcomes simultaneously."},
 {q:"A team asks how strongly hours of sleep are related to test performance, and in which direction.",svg:G.c,opts:AO,ans:3,why:"No group comparison here. Correlational analysis describes the strength and direction of a relationship between variables."},
 {q:"Four therapy formats are compared on one outcome: client satisfaction.",svg:bars([80,110,95,140],['A','B','C','D'],'Four group means'),opts:AO,ans:1,why:"Four groups and one outcome points to ANOVA (three or more groups)."},
 {q:"Is study time related to test anxiety? The researcher wants the direction and size of the link.",svg:G.c,opts:AO,ans:3,why:"A relationship between two variables, described by strength and direction, calls for correlational analysis."}
],{label:'Scenario',intro:'Match the analysis to the research question.',perfect:'You can match the analysis to the question, a key step when reading a study.'});
function paper(hl){
  var s='<svg viewBox="0 0 260 300" role="img" aria-label="A journal article page with a magnifying glass"><rect x="30" y="14" width="170" height="250" rx="8" fill="#fff" stroke="#a8353a" stroke-width="3"/><rect x="46" y="32" width="110" height="10" rx="3" fill="#d34147"/>';
  for(var k=0;k<9;k++){var y=60+k*20;s+='<rect x="46" y="'+y+'" width="'+(k%3===2?90:138)+'" height="7" rx="3" fill="'+(hl&&k>=3&&k<=5?'#d34147':'#edebe8')+'"/>';}
  s+='<circle cx="190" cy="196" r="38" fill="#fff" fill-opacity=".7" stroke="#d34147" stroke-width="7"/><path d="M218 224l26 30" stroke="#d34147" stroke-width="10" stroke-linecap="round"/>';
  return s+'</svg>';
}
var EV=["Test-retest reliability","Internal consistency","Content validity","Criterion-related validity"];
var EV2=["Inter-rater agreement","Construct validity","Test-retest reliability","Criterion-related validity"];
Quiz(document.getElementById('p2'),[
 {q:"“Participants retook the scale two weeks later and produced very similar scores.”",opts:EV,ans:0,why:"Similar scores across time is test-retest reliability, a form of consistency evidence."},
 {q:"“Items on the scale correlated strongly with one another.”",opts:EV,ans:1,why:"Items that hang together show internal consistency, another reliability type."},
 {q:"“A panel of experts reviewed the items to confirm they covered the construct.”",opts:EV,ans:2,why:"Expert review of coverage is content validity."},
 {q:"“Scores predicted job performance one year later.”",opts:EV,ans:3,why:"Relating scores to an outside criterion (here, future performance) is criterion-related validity."},
 {q:"“Two clinicians rated each interview independently and their ratings matched closely.”",opts:EV2,ans:0,why:"Agreement between raters is inter-rater reliability."},
 {q:"“Scores correlated with other measures in ways the theory predicts.”",opts:EV2,ans:1,why:"Fitting theory-based expectations is construct validity."}
],{label:'Excerpt',intro:'When you read an article, find how the authors showed reliability and validity.',gfx:function(i,p,a){return paper(a);},perfect:'You can name the type of reliability or validity evidence an author reports.'});
})();
initTabs();
</script>
</body>
</html>
