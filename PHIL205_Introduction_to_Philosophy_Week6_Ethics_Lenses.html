<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHIL 205 Introduction to Philosophy: Week 6 Interactive: Right, Wrong, and the Good Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Newsreader:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2430;--muted:#566070;--paper:#F5F6F8;--card:#fff;--line:#D5DAE2;--cardinal:#A5313A;--cardinal-d:#852630;
--hue:#2F4C7A;--hue-t:#E6ECF5;--ok:#2A7653;--ok-t:#E1F2E9;--bad:#A8432E;--bad-t:#FBE9E4;
--serif:'Newsreader',Georgia,'Times New Roman',serif;--sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);overscroll-behavior:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;width:900px;height:560px;overflow:hidden}
.hdr{flex:0 0 54px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
.hdr svg.mark{flex:0 0 26px}
.hdr h1{margin:0;font:600 19px/1.1 var(--serif);letter-spacing:.1px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .wk{font-size:13px;font-weight:600;color:var(--hue);background:var(--hue-t);padding:3px 10px;border-radius:99px;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:0 0 auto;padding:8px 20px 0;background:#fff;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;font:600 14px var(--sans);color:var(--muted);padding:8px 14px 9px;border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--cardinal)}
.view{flex:1;min-height:0;display:none;padding:14px 20px 16px;gap:18px}
.view.on{display:flex}
.col-g{flex:0 0 42%;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0}
.col-p{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;min-height:0}
.gfx{flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gfx svg{width:100%;height:100%;display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-height:0;overflow:hidden}
.card.grow{flex:1}
h2{font:600 24px/1.15 var(--serif);margin:0 0 8px}
h3{font:700 14px/1.2 var(--sans);margin:12px 0 3px;color:var(--hue)}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.say{font:italic 400 17px/1.4 var(--serif);color:var(--ink);border-left:3px solid var(--hue);padding:2px 0 2px 12px;margin:8px 0 10px}
.btn{appearance:none;border:1.5px solid var(--cardinal);background:var(--cardinal);color:#fff;font:600 14px var(--sans);padding:8px 16px;border-radius:10px;cursor:pointer}
.btn:hover{background:var(--cardinal-d);border-color:var(--cardinal-d)}
.btn.ghost{background:#fff;color:var(--cardinal)}
.btn.ghost:hover{background:#faf0f1}
.btn[disabled]{opacity:.4;cursor:default}
.pill{appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:600 13.5px var(--sans);padding:7px 13px;border-radius:99px;cursor:pointer;text-align:left}
.pill:hover{border-color:var(--hue)}
.pill[aria-pressed=true],.pill.sel{background:var(--hue);border-color:var(--hue);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.dots i{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line);display:inline-block}
.dots i.on{background:var(--hue);border-color:var(--hue)}
.fb{border-radius:10px;padding:9px 12px;font-size:14px;margin-top:8px}
.fb.ok{background:var(--ok-t);color:#16452F}
.fb.no{background:var(--bad-t);color:#6E2412}
.fb.info{background:var(--hue-t);color:var(--ink)}
:focus-visible{outline:3px solid #1A5FD0;outline-offset:2px;border-radius:6px}
g[role=button]:focus,g[role=button]:focus-visible{outline:none}
g[role=button]:focus-visible .ring{stroke:#1A5FD0;stroke-width:4}
g[role=button]{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* narrow (phone) layout: single column, still no scrolling */
#stage.narrow .view{flex-direction:column;gap:10px;padding:10px 14px 12px}
#stage.narrow .col-g{flex:0 0 40%}
#stage.narrow .col-p{flex:1}
#stage.narrow .hdr{padding:0 14px}
#stage.narrow .tabs{padding:6px 10px 0}
#stage.narrow .card{padding:12px 14px}
#stage.narrow h2{font-size:21px}

:root{--hue:#5B3F8C;--hue-t:#ECE6F6}
.gfx{background:#F7F4FC}
.scn{font:italic 400 16.5px/1.45 var(--serif);margin:0 0 8px}
.lenses{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.len{appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:7px 4px 6px;font:600 12px/1.15 var(--sans);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.len svg{width:30px;height:30px}
.len:hover{border-color:var(--hue)}
.len[aria-pressed=true]{border-color:var(--hue);background:var(--hue-t)}
.len.seen::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--hue);margin-top:-2px}
.vd{display:flex;gap:8px;align-items:center;margin:8px 0 6px}
.tag{font:700 13px var(--sans);padding:3px 11px;border-radius:99px;background:var(--hue-t);color:var(--hue)}
.tag.t{background:#E1F2E9;color:#16452F}.tag.l{background:#FBE9E4;color:#6E2412}.tag.d{background:#EEF0F4;color:#3A4252}
.qbox{font:600 16px/1.3 var(--serif);margin:6px 0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;gap:10px}
.ans{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.ans .pill{border-radius:10px;white-space:normal}
.tbl{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:14px;align-items:center;margin:6px 0}
.tbl span:nth-child(odd){font-weight:600}
</style></head>
<body>
<div id="stage">
 <div class="hdr">
  <svg class="mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 3h20v13a7 7 0 0 1-7 7H3z" fill="#A5313A"/><path d="M13 3v20M3 11h20" stroke="#fff" stroke-width="2"/></svg>
  <h1>Right, Wrong, and the Good Life</h1><span class="wk">Week 6</span>
 </div>
 <div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-v="v1">Try the lenses</button>
  <button class="tab" role="tab" aria-selected="false" data-v="v2">Opposed, but both right?</button>
 </div>

 <section class="view on" id="v1">
  <div class="col-g"><div class="gfx"><svg id="scene" viewBox="0 0 400 360" role="img" aria-label="A door with a visitor outside and a friend hiding inside"></svg></div></div>
  <div class="col-p">
   <div class="card grow" id="panel" aria-live="polite"></div>
  </div>
 </section>

 <section class="view" id="v2">
  <div class="col-g"><div class="gfx"><svg viewBox="0 0 400 360" role="img" aria-label="Two arrows pointing in opposite directions toward the same question"><rect width="400" height="360" fill="#F7F4FC"/>
   <circle cx="200" cy="170" r="52" fill="#fff" stroke="#5B3F8C" stroke-width="3"/><text x="200" y="164" text-anchor="middle" font-family="Newsreader,serif" font-weight="600" font-size="20" fill="#1E2430">Is lying</text><text x="200" y="188" text-anchor="middle" font-family="Newsreader,serif" font-weight="600" font-size="20" fill="#1E2430">wrong?</text>
   <path d="M64 170h78" stroke="#2A7653" stroke-width="6" stroke-linecap="round"/><path d="M128 150l22 20-22 20" fill="none" stroke="#2A7653" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M336 170h-78" stroke="#A8432E" stroke-width="6" stroke-linecap="round"/><path d="M272 150l-22 20 22 20" fill="none" stroke="#A8432E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
   <text x="90" y="226" text-anchor="middle" font-family="Figtree,sans-serif" font-size="14" font-weight="700" fill="#16452F">Always wrong</text>
   <text x="310" y="226" text-anchor="middle" font-family="Figtree,sans-serif" font-size="14" font-weight="700" fill="#6E2412">Sometimes right</text>
   <g font-family="Figtree,sans-serif" font-size="13" fill="#566070" text-anchor="middle"><text x="200" y="290">If morality is objective, both cannot be right</text><text x="200" y="310">in the same circumstances.</text></g></svg></div></div>
  <div class="col-p"><div class="card grow" id="p2" aria-live="polite"></div></div>
 </section>
</div>
<script>
(function(){var st=document.getElementById('stage');
function fit(){var w=window.innerWidth,h=window.innerHeight,n=w<620,mw=n?460:900,mh=n?800:560;
var s=Math.min(w/mw,h/mh,1.25);st.classList.toggle('narrow',n);
st.style.width=(w/s)+'px';st.style.height=(h/s)+'px';st.style.transform='scale('+s+')';}
window.addEventListener('resize',fit);fit();
window.$=function(s,r){return (r||document).querySelector(s)};
window.$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
window.tabsInit=function(){var t=$$('.tab');t.forEach(function(b){b.addEventListener('click',function(){
t.forEach(function(x){x.setAttribute('aria-selected',x===b)});
$$('.view').forEach(function(v){v.classList.toggle('on',v.id===b.dataset.v)});});});};
window.keyBtn=function(el,fn){el.addEventListener('click',fn);el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e)}});};
})();

tabsInit();
var INK='#1E2430',P='#5B3F8C';
var LENS=[
 {k:'div',n:'God’s commands',col:'#A87A1E',q:'What has God commanded, or what does the created moral order require?',v:{t:'Depends on the tradition',c:'d'},
  txt:'Morality is grounded in God’s commands or in a moral order God built into creation. Some traditions hold that lying is always wrong. Others point to biblical cases of deceiving to protect the innocent. The theory names the source of morality, but believers apply it differently.',
  ic:'<path d="M7 4h16v18a8 8 0 0 1-16 0z" fill="none" stroke="#A87A1E" stroke-width="2.4"/><path d="M11 10h8M11 14h8M11 18h5" stroke="#A87A1E" stroke-width="2" stroke-linecap="round"/>'},
 {k:'deo',n:'Duty and rules',col:'#2F4C7A',q:'Is there a rule everyone could follow? What do I owe, whatever the outcome?',v:{t:'Do not lie',c:'t'},
  txt:'Kant-style deontology says some acts are required or forbidden regardless of results. If everyone lied whenever it helped, trust would collapse, so lying cannot be a universal rule. On a strict reading, you must not lie, even here. You may still refuse to answer.',
  ic:'<rect x="6" y="5" width="18" height="20" rx="3" fill="none" stroke="#2F4C7A" stroke-width="2.4"/><path d="M10 11h10M10 15h10M10 19h6" stroke="#2F4C7A" stroke-width="2" stroke-linecap="round"/>'},
 {k:'con',n:'Consequences',col:'#A5313A',q:'Which action produces the best results for everyone affected?',v:{t:'Lie',c:'l'},
  txt:'Consequentialism, as in utilitarianism, judges an act by its outcomes. A small deception that prevents serious harm produces better results than telling the truth, so lying is the right act here. The theory also needs an answer for cases where the outcomes are hard to predict.',
  ic:'<path d="M15 5v18M6 9h18" stroke="#A5313A" stroke-width="2.4" stroke-linecap="round"/><path d="M6 9l-3 8a4 3 0 0 0 6 0zM24 9l-3 8a4 3 0 0 0 6 0z" fill="none" stroke="#A5313A" stroke-width="2"/><path d="M10 25h10" stroke="#A5313A" stroke-width="2.4" stroke-linecap="round"/>'},
 {k:'vir',n:'Character',col:'#2A7653',q:'What would a person of good character, with practical wisdom, do?',v:{t:'Wisdom decides',c:'d'},
  txt:'Virtue ethics, following Aristotle, asks what a good person would do. Honesty, courage, compassion, and prudence all pull on this case. A wise person would likely protect the friend, while taking care not to become someone who lies lightly. The answer comes from judgment, not a formula.',
  ic:'<path d="M5 24h20M8 24V12M13 24V12M18 24V12M23 24V12M4 12h22L15 5z" fill="none" stroke="#2A7653" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'},
 {k:'rel',n:'Relativism',col:'#566070',q:'What does my culture, or what do I, approve of?',v:{t:'Whatever is approved',c:'d'},
  txt:'Relativism says moral claims are true only relative to a person or culture. If your community approves of protecting the friend, lying is right for you. If it forbids lying, it is wrong for you. There is no further standard to appeal to, which is why critics find it hard to say that any culture is mistaken.',
  ic:'<circle cx="15" cy="15" r="10" fill="none" stroke="#566070" stroke-width="2.2"/><path d="M5 15h20M15 5c-5 6-5 14 0 20M15 5c5 6 5 14 0 20" fill="none" stroke="#566070" stroke-width="1.8"/>'}];
var seen={},cur=null,choice=null;
function scene(l){var tint=l?l.col:'#5B3F8C';
 var h='<rect width="400" height="360" fill="#F7F4FC"/>';
 // house
 h+='<g transform="translate(-14 0)"><rect x="120" y="60" width="180" height="250" rx="6" fill="#fff" stroke="'+INK+'" stroke-width="3"/><rect x="152" y="104" width="116" height="206" rx="4" fill="'+tint+'" fill-opacity="'+(l?.18:.07)+'" stroke="'+tint+'" stroke-width="3"/><circle cx="252" cy="212" r="6" fill="'+tint+'"/>';
 // hiding friend (peeking from window)
 h+='<rect x="168" y="124" width="84" height="72" rx="6" fill="#fff" stroke="'+INK+'" stroke-width="2.5"/><circle cx="210" cy="152" r="12" fill="#CFC3E8" stroke="'+P+'" stroke-width="2.5"/><path d="M188 196v-18a22 22 0 0 1 44 0v18z" fill="#CFC3E8" stroke="'+P+'" stroke-width="2.5"/>';
 h+='<text x="210" y="228" text-anchor="middle" font-family="Figtree,sans-serif" font-size="12" font-weight="700" fill="#3A4252">Friend, hiding</text></g>';
 // visitor
 h+='<g transform="translate(60 250)"><circle cy="-34" r="15" fill="#E9ECF1" stroke="#566070" stroke-width="3"/><path d="M-24 50v-46a24 24 0 0 1 48 0v46z" fill="#E9ECF1" stroke="#566070" stroke-width="3"/></g><text x="60" y="326" text-anchor="middle" font-family="Figtree,sans-serif" font-size="12" font-weight="700" fill="#3A4252">Visitor</text>';
 h+='<g><rect x="18" y="148" width="86" height="32" rx="14" fill="#fff" stroke="#566070" stroke-width="2"/><path d="M48 180l-2 14 14-14" fill="#fff" stroke="#566070" stroke-width="2" stroke-linejoin="round"/><text x="61" y="169" text-anchor="middle" font-family="Newsreader,serif" font-style="italic" font-size="14" fill="'+INK+'">Is she here?</text></g>';
 if(l){h+='<g transform="translate(318 80) scale(2)"><circle cx="15" cy="15" r="17" fill="#fff" stroke="'+l.col+'" stroke-width="2"/>'+l.ic+'</g><text x="348" y="160" text-anchor="middle" font-family="Newsreader,serif" font-weight="600" font-size="14" fill="'+l.col+'">'+l.n+'</text>'}
 else h+='<text x="348" y="130" text-anchor="middle" font-family="Newsreader,serif" font-style="italic" font-size="14" fill="#566070">Pick a lens</text>';
 $('#scene').innerHTML=h}
function panel(){var P_=$('#panel'),h='';
 h+='<p class="scn">A visitor who intends to harm your friend asks whether she is inside. You know she is hiding in the house. What would you do?</p>';
 if(!choice){h+='<div class="ans"><button class="pill" data-ch="truth">Tell the truth</button><button class="pill" data-ch="lie">Say she is not here</button><button class="pill" data-ch="refuse">Refuse to answer</button></div><p class="muted">Choose first. Then look through each lens and see whose reasoning matches yours.</p>';}
 else{
  var chL={truth:'Tell the truth',lie:'Say she is not here',refuse:'Refuse to answer'}[choice];
  h+='<div class="muted" style="margin-bottom:6px">You chose: <b style="color:var(--ink)">'+chL+'</b> <button class="pill" id="chg" style="padding:2px 9px;font-size:12px;margin-left:6px">Change</button></div>';
  h+='<div class="lenses" role="group" aria-label="Ethical lenses">'+LENS.map(function(l,i){return '<button class="len'+(seen[i]?' seen':'')+'" data-l="'+i+'" aria-pressed="'+(cur===i)+'"><svg viewBox="0 0 30 30" aria-hidden="true">'+l.ic+'</svg>'+l.n+'</button>'}).join('')+'</div>';
  if(cur!==null){var l=LENS[cur];h+='<div class="qbox">'+l.q+'</div><div class="vd"><span>Likely answer</span><span class="tag '+l.v.c+'">'+l.v.t+'</span></div><p>'+l.txt+'</p>';}
  else h+='<p class="muted" style="margin-top:12px">Each lens asks a different question about the same situation. Tap one.</p>';
  h+='<div class="nav"><span class="muted">Lenses viewed: '+Object.keys(seen).length+' of 5</span></div>';
 }
 P_.innerHTML=h;
 $$('[data-ch]',P_).forEach(function(b){b.addEventListener('click',function(){choice=b.dataset.ch;panel()})});
 $$('[data-l]',P_).forEach(function(b){b.addEventListener('click',function(){cur=+b.dataset.l;seen[cur]=1;panel();scene(LENS[cur])})});
 var c=$('#chg',P_);if(c)c.addEventListener('click',function(){choice=null;cur=null;panel();scene(null)});}
scene(null);panel();
// tab 2
var a2=null;
function p2(){var P_=$('#p2');
 var h='<h2>Opposed, but both right?</h2><p>Two people answer the same question in opposite ways. Can both be moral?</p><div class="ans"><button class="pill'+(a2==='yes'?' sel':'')+'" data-a="yes">Yes, both can be right</button><button class="pill'+(a2==='no'?' sel':'')+'" data-a="no">No, at most one is right</button><button class="pill'+(a2==='dep'?' sel':'')+'" data-a="dep">It depends on the circumstances</button></div>';
 if(a2){var m={yes:['Then morality is relative to a person or culture, or it is a matter of what each person endorses. Be ready to say what you would tell a society that approves of something you find cruel.','A relativist answer'],
  no:['Then morality is objective: opposed acts in the same circumstances cannot both be right. Be ready to explain what grounds that standard. Craig argues it needs God, and others ground it in reason or human nature.','An objective answer'],
  dep:['Circumstances can change what the right act is, and many objectivists say so. The question is whether the circumstances change the standard or only how it applies. A rule-based view and a consequence-based view will disagree about that.','An answer that needs more detail']}[a2];
  h+='<div class="fb info"><b>'+m[1]+'.</b> '+m[0]+'</div><p class="muted" style="margin-top:10px">Ethics asks about the source, the content, and the purpose of morality. This answer speaks mostly to the source. For your discussion post, explain the reasons behind it.</p>';}
 P_.innerHTML=h;$$('[data-a]',P_).forEach(function(b){b.addEventListener('click',function(){a2=b.dataset.a;p2()})})}
p2();
</script></body></html>
