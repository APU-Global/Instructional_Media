<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSYC 460 Motivation | Week 4 Self-Determination Lab</title>
<style>:root{--red:#b5303a;--red2:#d34147;--ink:#222;--mut:#5b5b5b;--soft:#f7f4f0;--line:#e4dfd9;--teal:#1f7a8c;--gold:#d9a21f;--green:#2c8a6e;--navy:#4a5a78;--orange:#d9703c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;font-size:14px;line-height:1.4}
.app{height:100vh;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(95deg,#8f232c,#d34147);color:#fff}
.top h1{font-size:17px;margin:0;font-weight:700}
.top .pill{background:rgba(255,255,255,.22);border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.top .sub{font-size:12px;opacity:.92;margin-left:auto;white-space:nowrap}
.tabs{flex:none;display:flex;gap:4px;padding:6px 16px 0;border-bottom:2px solid var(--line);background:var(--soft)}
.tab{border:0;background:transparent;padding:8px 14px;font-family:inherit;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;border-radius:8px 8px 0 0;margin-bottom:-2px;border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--red);background:#fff;border-bottom-color:var(--red)}
.tab:focus-visible,.btn:focus-visible,.seg button:focus-visible,[tabindex]:focus-visible{outline:3px solid #1f7a8c;outline-offset:2px}
.panel{display:none;flex:1;min-height:0;padding:10px 16px 12px;gap:16px}
.panel.active{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
.col{min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.stage{flex:1;min-height:0;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex}
.stage svg{width:100%;height:100%;display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card.fill{flex:1;min-height:0}
.card h2{font-size:19px;margin:6px 0 4px}
.card p{margin:0 0 8px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:99px;color:#fff;background:var(--red)}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.seg button:hover{border-color:var(--red)}
.seg button.on{background:var(--red);border-color:var(--red);color:#fff}
.btn{border:0;background:var(--red);color:#fff;border-radius:8px;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{background:#9c2630}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.ghost:hover{background:#fbeeee}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;margin:0 0 6px;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--red);background:#fdf6f6}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--green);background:#e9f6f0}
.opt.bad{border-color:var(--red);background:#fdeceb}
.fb{border-left:4px solid var(--teal);background:#eef6f8;padding:7px 11px;border-radius:0 8px 8px 0;margin:6px 0;font-size:13.5px}
.fb.good{border-color:var(--green);background:#e9f6f0}
.fb.bad{border-color:var(--red);background:#fdeceb}
.row{display:grid;grid-template-columns:118px 1fr 30px;align-items:center;gap:8px;margin:5px 0}
.row label{font-weight:600;font-size:13.5px}
.row output{font-weight:700;text-align:right}
input[type=range]{width:100%;accent-color:var(--red)}
.hot{cursor:pointer}
.hot:hover .hl{filter:brightness(1.1)}
.meter{height:12px;border-radius:99px;background:#ece7e1;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .5s}
.steps{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.scorebar{display:flex;gap:10px;align-items:center;justify-content:space-between}
@media (max-width:760px){
 .panel.active{display:flex;flex-direction:column;overflow-y:auto}
 .stage{flex:none;height:300px}
 .col{min-height:auto}
 .top .sub{display:none}
 .tabs{overflow-x:auto}
 .tab{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.pips{display:flex;gap:4px;margin:2px 0 8px}.pips i{flex:1;height:10px;border-radius:5px;background:#e6e0d8}
.quote{border-left:4px solid var(--red);background:var(--soft);padding:8px 12px;border-radius:0 10px 10px 0;font-style:italic;margin:6px 0 8px}
.nav2{display:flex;gap:8px;margin-top:8px}
.tg{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:5px;cursor:pointer;background:#fff;font-size:13.5px}
.tg:hover{border-color:var(--red)}.tg.on{border-color:var(--teal);background:#eef6f8}
.tg input{accent-color:var(--teal);width:16px;height:16px;margin:0}
.fx{font-size:11px;font-weight:800;white-space:nowrap}.fx b{padding:1px 5px;border-radius:5px;margin-left:2px;color:#fff}
.p{background:var(--green)}.m{background:var(--red)}
</style>
</head>
<body>
<div class="app">
 <header class="top"><span class="pill">Week 4</span><h1>Intrinsic &amp; Extrinsic Motivation: Self-Determination Lab</h1><span class="sub">PSYC 460 · Motivation</span></header>
 <nav class="tabs" role="tablist">
  <button class="tab on" role="tab" data-p="p1">The Continuum</button>
  <button class="tab" role="tab" data-p="p2">Place the Motive</button>
  <button class="tab" role="tab" data-p="p3">Design for Needs</button>
 </nav>
 <section class="panel active" id="p1">
  <div class="col"><div class="stage" id="st1"></div></div>
  <div class="col"><div class="card fill" id="info1" aria-live="polite"></div></div>
 </section>
 <section class="panel" id="p2">
  <div class="col"><div class="stage" id="st2"></div></div>
  <div class="col"><div class="card fill" id="quiz" aria-live="polite"></div></div>
 </section>
 <section class="panel" id="p3">
  <div class="col"><div class="stage" id="st3"></div></div>
  <div class="col"><div class="card fill"><div class="steps">You lead a group project. Tick your design choices:</div><div id="tgs" style="margin-top:6px"></div></div></div>
 </section>
</div>
<script>
const ICONS={
 drop:'<path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5Z"/>',
 shield:'<path d="M12 2.5 20 5.5V11c0 5-3.5 8.6-8 10.5C7.5 19.6 4 16 4 11V5.5Z"/>',
 heart:'<path d="M12 21S3 14.8 3 8.800A4.6 4.6 0 0 1 12 6.8 4.6 4.6 0 0 1 21 8.800C21 14.8 12 21 12 21Z"/>',
 star:'<path d="M12 2.5 14.9 8.8 21.8 9.5 16.6 14.1 18.2 21 12 17.4 5.8 21 7.4 14.1 2.2 9.5 9.1 8.800Z"/>',
 medal:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14 6.5 22 12 19.5 17.5 22 15.5 14"/>',
 trophy:'<path d="M7 3h10v5.500a5 5 0 0 1-10 0V3Z"/><path d="M7 5H3v2a4 4 0 0 0 4 4M17 5h4v2a4 4 0 0 1-4 4M12 13.500V17M8 21h8M9.5 17h5v4h-5z"/>',
 people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 2.8-6 6.5-6s6.5 2 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c3 0 5 1.5 5 5"/>',
 person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/>',
 crown:'<path d="M3 18 2.5 7 8 11.5 12 5l4 6.500L21.5 7 21 18Z"/>',
 gear:'<circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8" stroke-width="3.5" stroke-dasharray="2.6 2.470"/>',
 bolt:'<path d="M13 2 4 14h7l-1 8 10-13h-7Z"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
 target:'<circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.5"/>',
 chat:'<path d="M4 4h16v12H10l-5 4v-4H4Z"/>',
 help:'<circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.500a2.6 2.6 0 1 1 3.6 2.400c-.8.4-1.1 1-1.1 1.800M12 17.300v.2"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.1M3.5 12h.1M3.5 18h.1"/>',
 echo:'<path d="M4 8v8M8 5v14M12 9v6"/><path d="M16 8.500a5 5 0 0 1 0 7M19 5.500a9 9 0 0 1 0 13"/>',
 hand:'<path d="M12 21c-5-3.5-8-6.5-8-10.500A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 8 2.500c0 4-3 7-8 10.500Z"/>',
 check:'<path d="M4 12.5 9.5 18 20 6.5"/>',
 coin:'<circle cx="12" cy="12" r="9.5"/><path d="M14.5 9a2.5 2 0 0 0-2.5-1.500c-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2A2.6 2 0 0 1 9.5 15M12 6v1.500M12 16.500V18"/>',
 book:'<path d="M4 4.500A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2ZM4 20.500V4.5"/>',
 scale:'<path d="M12 3v18M6 21h12M5 7h14"/><path d="M5 7 2.5 14a3 3 0 0 0 5 0ZM19 7l-2.5 7a3 3 0 0 0 5 0Z"/>'
};
function icon(n,x,y,s,c,sw){return `<g transform="translate(${x-s/2},${y-s/2}) scale(${s/24})" fill="none" stroke="${c||'#fff'}" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</g>`}
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
function press(el,fn){el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e)}})}
function initTabs(){const tabs=$$('.tab'),panels=$$('.panel');tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.toggle('on',x===t);x.setAttribute('aria-selected',x===t)});panels.forEach(p=>p.classList.toggle('active',p.id===t.dataset.p))}))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wrap(t,n){const w=t.split(' ');const L=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>n){L.push(c);c=x}else c=(c+' '+x).trim()});if(c)L.push(c);return L}
function person(x,y,o){o=o||{};const s=o.s||1,sh=o.shirt||'#b5303a',hr=o.hair||'#3b2a20',sk=o.skin||'#f1c9a5',m=o.mood||'neutral';
 const mouth=m==='happy'?'M-8 8Q0 18 8 8':m==='sad'?'M-8 15Q0 7 8 15':'M-7 11H7';
 return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-36 104Q-36 42 0 40Q36 42 36 104Z" fill="${sh}"/><rect x="-8" y="26" width="16" height="18" rx="6" fill="${sk}"/><circle r="27" fill="${sk}"/><path d="M-28-2Q-30-32 0-32Q30-32 28-2Q19-17 0-17Q-19-17-28-2Z" fill="${hr}"/><circle cx="-9" cy="1" r="2.7" fill="#222"/><circle cx="9" cy="1" r="2.7" fill="#222"/><path d="${mouth}" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/></g>`}
function bubble(x,y,w,lines,o){o=o||{};const lh=o.lh||19,fs=o.fs||14,h=lines.length*lh+18;const tx=o.tail!=null?o.tail:x+w/2;
 const tail=`<path d="M${tx-9} ${y+h-1.5}L${tx+4} ${y+h+16}L${tx+12} ${y+h-1.5}Z" fill="#fff"/><path d="M${tx-9} ${y+h}L${tx+4} ${y+h+16}L${tx+12} ${y+h}" fill="none" stroke="#c9c2ba" stroke-width="1.5" stroke-linejoin="round"/>`;
 return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#fff" stroke="#c9c2ba" stroke-width="1.5"/>${tail}<text font-size="${fs}" fill="#222" text-anchor="middle">${lines.map((l,i)=>`<tspan x="${x+w/2}" y="${y+22+i*lh}">${l}</tspan>`).join('')}</text></g>`}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

initTabs();
const ST=[
 {id:'ext',name:'External',color:'#b5303a',icon:'lock',aut:1,short:'Reward / punishment',quote:['I study so I don’t','lose my scholarship.'],q:'“I study so I don’t lose my scholarship.”',desc:'Acting to earn a reward or avoid a punishment. Behavior feels controlled by others.',eg:'Meeting a sales quota only for the commission; cleaning your room to avoid being grounded.',tip:'Works short-term, but effort often stops when the reward does.'},
 {id:'int',name:'Introjected',color:'#d9703c',icon:'eye',aut:2,short:'Guilt & pride',quote:['I’d feel like a failure','if I skipped class.'],q:'“I’d feel like a failure if I skipped class.”',desc:'Acting to avoid guilt or anxiety, or to protect self-worth. The pressure is internal but still controlling.',eg:'Going to the gym only because skipping would make you feel guilty.',tip:'Can sustain behavior, but at an emotional cost.'},
 {id:'idf',name:'Identified',color:'#d9a21f',icon:'target',aut:3,short:'I value the goal',quote:['Stats matters. I need it','to become a researcher.'],q:'“Stats matters. I need it to become a researcher.”',desc:'Acting because you personally value the goal, even if the task itself isn’t fun.',eg:'Doing tedious clinical documentation because you value accurate patient care.',tip:'Offer rationales that help people see why a task matters.'},
 {id:'itg',name:'Integrated',color:'#2c8a6e',icon:'person',aut:4,short:'It fits who I am',quote:['Caring for people','is simply who I am.'],q:'“Caring for people is simply who I am.”',desc:'The goal is fully absorbed into your sense of identity. This is the most autonomous form of extrinsic motivation.',eg:'A nurse who sees compassionate care as part of her identity.',tip:'Supports long-term persistence and well-being.'},
 {id:'ntr',name:'Intrinsic',color:'#1f7a8c',icon:'heart',aut:5,short:'The activity itself',quote:['I lose track of time','when I’m painting!'],q:'“I lose track of time when I’m painting!”',desc:'Acting purely for the interest, enjoyment, or satisfaction of the activity itself.',eg:'Reading for fun, solving puzzles, playing music for its own sake.',tip:'Autonomy, competence, and relatedness nurture it; controlling rewards can undermine it.'}
];
const XS=[70,170,280,390,490];
function track(sel,onlyTrack){
 let o=`<svg viewBox="0 0 560 430" role="img" aria-label="Continuum of motivation from external to intrinsic"><defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#b5303a"/><stop offset=".35" stop-color="#d9a21f"/><stop offset="1" stop-color="#1f7a8c"/></linearGradient></defs>`;
 o+=`<rect x="40" y="304" width="480" height="14" rx="7" fill="url(#tg)"/><text x="40" y="288" font-size="12.5" font-weight="700" fill="#b5303a">CONTROLLED</text><text x="520" y="288" font-size="12.5" font-weight="700" fill="#1f7a8c" text-anchor="end">SELF-DETERMINED</text>`;
 ST.forEach((s,i)=>{const on=sel===i;
  o+=`<g class="hot" data-i="${i}" tabindex="0" role="button" aria-label="${s.name}"><circle class="hl" cx="${XS[i]}" cy="311" r="${on?25:19}" fill="${s.color}" stroke="#fff" stroke-width="4"/>${icon(s.icon,XS[i],311,on?26:20,'#fff')}<text x="${XS[i]}" y="358" font-size="${on?14.5:13}" font-weight="${on?800:600}" fill="${on?s.color:'#444'}" text-anchor="middle">${s.name}</text><text x="${XS[i]}" y="375" font-size="10.5" fill="#777" text-anchor="middle">${s.short}</text></g>`});
 if(sel!=null&&!onlyTrack){const s=ST[sel],x=clamp(XS[sel],125,435);
  const mood=sel<2?'sad':sel<3?'neutral':'happy';
  o+=`<g id="figure" style="transform:translateX(${x-280}px);transition:transform .6s cubic-bezier(.3,1.3,.5,1)">${bubble(180,24,200,s.quote,{tail:290,fs:13.500})}${person(280,140,{shirt:s.color,mood,s:1.12})}</g>`;
 }
 return o+'</svg>'}
let cur=0;
function r1(){
 const s=ST[cur];
 $('#st1').innerHTML=track(cur);
 $$('#st1 .hot').forEach(g=>press(g,()=>{cur=+g.dataset.i;r1()}));
 $('#info1').innerHTML=`<span class="tag" style="background:${s.color}">Stage ${cur+1} of 5</span><h2>${s.name} regulation</h2><div class="steps">Autonomy</div><div class="pips">${[1,2,3,4,5].map(n=>`<i style="${n<=s.aut?'background:'+s.color:''}"></i>`).join('')}</div><div class="quote">${s.q}</div><p>${s.desc}</p><p class="small"><b>Example:</b> ${s.eg}</p><div class="fb good" style="border-color:${s.color}"><b>Design tip:</b> ${s.tip}</div><div class="nav2"><button class="btn ghost" id="pv" ${cur===0?'disabled style="opacity:.4"':''}>← Less autonomous</button><button class="btn" id="nx" ${cur===4?'disabled style="opacity:.4"':''}>More autonomous →</button></div>`;
 $('#pv').onclick=()=>{if(cur>0){cur--;r1()}};$('#nx').onclick=()=>{if(cur<4){cur++;r1()}};
}
r1();
/* ---- Place the motive ---- */
const Q=[
 ['I clean my room so my parents won’t ground me.',0,'The motive is avoiding punishment from someone else.'],
 ['I go to the gym because I’d feel guilty if I skipped.',1,'Guilt is an internal pressure, the hallmark of introjection.'],
 ['I study stats because I want to be a researcher, and I care about that.',2,'The person values the goal, even though the task itself isn’t fun.'],
 ['Being a caring nurse is simply who I am.',3,'The value has become part of identity: fully integrated.'],
 ['I lose track of time when I’m painting.',4,'Interest and enjoyment in the activity itself define intrinsic motivation.'],
 ['I rushed the report to get my bonus.',0,'The reward is separate from the work itself: external.']
];
let qi=0,sc=0,fb='',ph='ask',tr=0,wr=[];
function r2(){
 const q=$('#quiz');
 if(qi>=Q.length){q.innerHTML=`<span class="tag" style="background:var(--green)">Complete</span><h2>${sc} of ${Q.length} on the first try</h2><p>${sc>=5?'Strong grasp of the continuum.':'Tip: ask “Who or what is pushing?” Others (external), my own guilt (introjected), my values (identified/integrated), or the activity itself (intrinsic).'}</p><button class="btn" id="re">Try again</button>`;$('#st2').innerHTML=track(null);$('#re').onclick=()=>{qi=0;sc=0;fb='';ph='ask';tr=0;wr=[];r2()};return}
 const d=Q[qi];
 q.innerHTML=`<div class="scorebar"><span class="steps">Statement ${qi+1} of ${Q.length}</span><span class="steps">Score ${sc}</span></div><h2 style="font-size:17px">Where does this motive sit on the continuum?</h2><div class="quote">“${d[0]}”</div><p class="mut small">Click a stage on the track at left.</p>${fb}${ph==='done'?`<button class="btn" id="n2">${qi===Q.length-1?'See results':'Next'}</button>`:''}`;
 let svg=track(null,true);
 const lines=wrap(d[0],30);
 svg=svg.replace('</svg>',`${bubble(130,20,300,lines,{tail:280,fs:15,lh:21})}${person(280,175,{shirt:'#8f232c',mood:'neutral',s:1.15})}</svg>`);
 $('#st2').innerHTML=svg;
 $$('#st2 .hot').forEach(g=>{const i=+g.dataset.i;if(wr.includes(i))g.style.opacity=.35;if(ph==='done'&&i===d[1]){g.querySelector('circle').setAttribute('stroke','#222')}press(g,()=>{if(ph==='done')return;pick(i)})});
 const n=$('#n2');if(n)n.onclick=()=>{qi++;fb='';ph='ask';tr=0;wr=[];r2()};
}
function pick(i){const d=Q[qi];
 if(i===d[1]){if(!tr)sc++;ph='done';fb=`<div class="fb good"><b>Correct: ${ST[i].name}.</b> ${d[2]}</div>`}
 else{tr++;wr.push(i);fb=`<div class="fb bad"><b>Not ${ST[i].name}.</b> Ask who or what is pushing the person to act. Try again.</div>`}
 r2()}
r2();
/* ---- Design for needs ---- */
const D=[
 ['Let team members choose their topic',[20,0,0]],
 ['Hand out a scripted plan, no deviations',[-25,0,0]],
 ['Explain why the project matters',[12,0,5]],
 ['Give frequent, specific, constructive feedback',[0,22,0]],
 ['Post a public ranking of everyone’s scores',[-5,-15,-15]],
 ['Hold short team check-ins',[0,0,22]],
 ['Offer $20 for finishing (“do this to get paid”)',[-15,0,0]]
];
const on=new Set();
function r3(){
 $('#tgs').innerHTML=D.map((d,i)=>{const f=d[1],lab=['A','C','R'];const chips=f.map((v,k)=>v?`<b class="${v>0?'p':'m'}">${v>0?'+':'−'}${lab[k]}</b>`:'').join('');
  return `<label class="tg ${on.has(i)?'on':''}"><input type="checkbox" data-i="${i}" ${on.has(i)?'checked':''}><span>${d[0]}</span><span class="fx">${chips}</span></label>`}).join('')+`<p class="small mut" style="margin:6px 0 0">A = autonomy · C = competence · R = relatedness</p>`;
