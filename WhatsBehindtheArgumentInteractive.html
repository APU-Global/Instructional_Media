<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crack The Case</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconSearch = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        );
        const IconCheckCircle2 = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        );
        const IconChevronRight = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>
        );
        const IconEye = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        );
        const IconBookOpen = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        );
        const IconArrowLeft = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        );
        const IconGrid = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        );
        const IconAlertCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        );
        const IconRefreshCcw = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
        );

        const GRID_SIZE = 12;

        const CASES = [
            {
                id: 1,
                argument: "“Schools should continue teaching the customs and practices that have shaped our communities.”",
                clues: ["The speaker is concerned that important cultural practices and histories are disappearing."],
                expectedAnswer: "TRADITION",
                revealExplanation: "The argument emphasizes preserving practices, beliefs, and cultural heritage across generations.",
                revealNuance: "Why the clues matter:\nThe focus on continuity, heritage, and passing practices from one generation to another points toward tradition.",
                word: "TRADITION", startX: 2, startY: 2, direction: "ACROSS", gridNumber: 1
            },
            {
                id: 2,
                argument: "“Parents should have the final say in what their children learn.”",
                clues: ["The speaker emphasizes that families should have meaningful control over decisions affecting their children."],
                expectedAnswer: "AUTONOMY",
                revealExplanation: "The argument emphasizes the right of individuals to have meaningful control over decisions affecting themselves and their children.",
                revealNuance: "Why the clues matter:\nThe emphasis on choice, control, and independence points toward autonomy.",
                word: "AUTONOMY", startX: 4, startY: 2, direction: "DOWN", gridNumber: 2
            },
            {
                id: 3,
                argument: "“Schools should restrict activities or materials that could place students at serious risk of harm.”",
                clues: ["The speaker argues that schools have a responsibility to create a secure, risk-free learning environment."],
                expectedAnswer: "SAFETY",
                revealExplanation: "The argument prioritizes protecting students from significant physical or emotional harm.",
                revealNuance: "Why the clues matter:\nThe central concern is risk reduction and protection, even when that may require placing limits on individual choices.",
                word: "SAFETY", startX: 6, startY: 4, direction: "ACROSS", gridNumber: 3
            },
            {
                id: 4,
                argument: "“Every student should have access to the same educational opportunities, regardless of where they live or how much their family earns.”",
                clues: ["The argument focuses on reducing barriers created by income, geography, or other circumstances."],
                expectedAnswer: "EQUITY",
                revealExplanation: "The argument emphasizes fairness in access to educational opportunities and concern about barriers.",
                revealNuance: "Why the clues matter:\nThe focus is about addressing differences in circumstances so students have meaningful access to opportunity.",
                word: "EQUITY", startX: 9, startY: 4, direction: "DOWN", gridNumber: 4
            },
            {
                id: 5,
                argument: "“Schools, families, and local organizations must work closely together to support students.”",
                clues: ["The speaker believes that education is a collective effort requiring strong partnerships across the local area."],
                expectedAnswer: "COMMUNITY",
                revealExplanation: "The argument emphasizes interconnectedness, partnerships, and mutual support among different groups.",
                revealNuance: "Why the clues matter:\nThe focus on working 'together' and building localized networks points toward community as the central driving value.",
                word: "COMMUNITY", startX: 2, startY: 8, direction: "ACROSS", gridNumber: 5
            }
        ];

        function App() {
            const [appState, setAppState] = useState('intro');
            const [solvedCases, setSolvedCases] = useState([]);
            const [activeCaseId, setActiveCaseId] = useState(null);
            const [caseSubState, setCaseSubState] = useState('investigating');
            const [revealedCluesCount, setRevealedCluesCount] = useState(0);
            const [userGuess, setUserGuess] = useState('');
            const [guessFeedback, setGuessFeedback] = useState(null);
            const [revealedVowels, setRevealedVowels] = useState([]);
            const [showResetConfirm, setShowResetConfirm] = useState(false);

            const generateGrid = () => {
                const grid = Array.from({ length: GRID_SIZE }, () => 
                    Array(GRID_SIZE).fill(null).map(() => ({
                        isActive: false, number: null, letter: '', isSolved: false, caseIds: []
                    }))
                );

                CASES.forEach(c => {
                    let currentX = c.startX;
                    let currentY = c.startY;
                    grid[currentY][currentX].number = c.gridNumber;

                    for (let i = 0; i < c.word.length; i++) {
                        const cell = grid[currentY][currentX];
                        cell.isActive = true;
                        cell.caseIds.push(c.id);
                        if (solvedCases.includes(c.id)) {
                            cell.letter = c.word[i];
                            cell.isSolved = true;
                        }
                        if (c.direction === 'ACROSS') currentX++;
                        if (c.direction === 'DOWN') currentY++;
                    }
                });
                return grid;
            };

            const crosswordGrid = generateGrid();

            const handleStart = () => setAppState('dashboard');

            const openCase = (id) => {
                setActiveCaseId(id);
                setCaseSubState(solvedCases.includes(id) ? 'revealed' : 'investigating');
                setRevealedCluesCount(0);
                setUserGuess('');
                setGuessFeedback(null);
                setRevealedVowels([]);
            };

            const closeCase = () => {
                setActiveCaseId(null);
                if (solvedCases.length === CASES.length) {
                    setTimeout(() => setAppState('complete'), 600);
                }
            };

            const revealNextClue = () => {
                if (revealedCluesCount < 1) setRevealedCluesCount(prev => prev + 1);
            };

            const submitGuess = () => {
                if (!userGuess.trim()) return;
                const activeCase = CASES.find(c => c.id === activeCaseId);
                const normalizedUser = userGuess.trim().toLowerCase();
                const normalizedExpected = activeCase.expectedAnswer.toLowerCase();

                if (normalizedUser.includes(normalizedExpected)) {
                    setGuessFeedback('correct');
                    setSolvedCases(prev => [...prev, activeCase.id]);
                    setCaseSubState('revealed');
                } else {
                    setGuessFeedback('incorrect');
                    setTimeout(() => setGuessFeedback(null), 2500);
                }
            };

            const renderIntro = () => (
                <div className="flex flex-col items-center min-h-screen p-4 md:p-8 bg-[#f4f1ea] text-black font-serif transition-opacity duration-500">
                    <div className="w-full max-w-4xl mt-4 md:mt-10">
                        <div className="flex justify-between items-end border-b-4 border-black pb-3 text-xs md:text-sm font-sans font-bold uppercase tracking-widest mb-6">
                            <span className="hidden md:inline-block">Vol. XCIII — No. 24</span>
                            <span>Thursday, September 3, 2026</span>
                            <span>Special Edition</span>
                        </div>
                        <div className="text-center mb-10">
                            <h1 className="text-5xl md:text-7xl lg:text-8xl font-black tracking-tighter uppercase mb-4 text-black" style={{ fontFamily: 'Georgia, Times, serif', lineHeight: '0.9' }}>
                                Crack The Case
                            </h1>
                            <h2 className="text-xl md:text-3xl font-bold italic border-y-4 border-black py-4 mt-6">
                                What's Really Behind the Argument?
                            </h2>
                        </div>
                        <div className="grid md:grid-cols-12 gap-10 mb-12">
                            <div className="md:col-span-7 space-y-4 text-lg leading-relaxed text-justify">
                                <p>
                                    <span className="text-6xl font-black float-left mr-3 mt-2 leading-none text-black">E</span>ducation debates are rarely just about what people say. When stakeholders take to the podium to debate curriculum, policies, or funding, their arguments often reflect much deeper, underlying values.
                                </p>
                                <p>
                                    If we only listen to the surface of the argument, we miss the driving force behind it. By identifying the core value, we can better understand why people may reach profoundly different conclusions about the exact same educational issue.
                                </p>
                            </div>
                            <div className="md:col-span-5 bg-black text-white p-7 rounded-sm shadow-2xl border-4 border-stone-800 transform rotate-1">
                                <div className="flex items-center justify-center mb-6 border-b border-stone-700 pb-4">
                                    <IconSearch size={28} className="mr-3" />
                                    <h3 className="font-sans text-xl font-bold uppercase tracking-widest">Your Assignment</h3>
                                </div>
                                <ul className="text-sm space-y-5 font-sans font-medium tracking-wide">
                                    <li className="flex items-start"><IconCheckCircle2 size={20} className="mr-3 mt-0.5 shrink-0 text-stone-400"/> Select a case file from the board.</li>
                                    <li className="flex items-start"><IconCheckCircle2 size={20} className="mr-3 mt-0.5 shrink-0 text-stone-400"/> Examine the argument and reveal the clue.</li>
                                    <li className="flex items-start"><IconCheckCircle2 size={20} className="mr-3 mt-0.5 shrink-0 text-stone-400"/> Deduce the underlying value using the scanner.</li>
                                    <li className="flex items-start"><IconCheckCircle2 size={20} className="mr-3 mt-0.5 shrink-0 text-stone-400"/> Fill the crossword to reveal the bigger picture.</li>
                                </ul>
                            </div>
                        </div>
                        <div className="text-center pb-16 pt-8 border-t-2 border-black border-dashed">
                            <button onClick={handleStart} className="group relative inline-flex items-center justify-center px-10 py-5 text-lg font-sans font-black text-white bg-black border-4 border-black hover:bg-[#f4f1ea] hover:text-black transition-all uppercase tracking-widest shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:shadow-none hover:translate-x-[6px] hover:translate-y-[6px]">
                                Turn to the Investigation Board <IconChevronRight className="ml-3 group-hover:translate-x-1 transition-transform" size={24} />
                            </button>
                        </div>
                    </div>
                </div>
            );

            const renderDashboard = () => (
                <div className="min-h-screen bg-stone-200 p-4 md:p-6 lg:p-8 flex flex-col font-sans text-stone-900 selection:bg-stone-400">
                    <header className="mb-6 lg:mb-8 flex flex-col md:flex-row items-start md:items-center justify-between bg-stone-900 text-white p-4 md:px-6 lg:px-8 md:py-5 rounded shadow-lg gap-4">
                        <div className="flex items-center gap-4">
                            <button onClick={() => setAppState('intro')} className="flex items-center justify-center p-2 bg-stone-800 border border-stone-700 text-stone-300 hover:text-white hover:bg-stone-700 rounded transition-all group" title="Back to Front Page">
                                <IconArrowLeft size={20} className="group-hover:-translate-x-1 transition-transform" />
                            </button>
                            <div>
                                <h1 className="text-lg md:text-2xl font-serif font-bold uppercase tracking-widest leading-none mb-1">Investigation Board</h1>
                                <p className="text-stone-400 text-[10px] md:text-xs tracking-widest uppercase">Status: {solvedCases.length} of 5 Cases Solved</p>
                            </div>
                        </div>
                        <div className="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
                            {showResetConfirm ? (
                                <div className="flex items-center gap-2 bg-stone-800 p-1.5 rounded border border-stone-700">
                                    <span className="text-[10px] text-red-400 font-bold uppercase tracking-widest px-2">Reset?</span>
                                    <button onClick={() => { setSolvedCases([]); setActiveCaseId(null); setShowResetConfirm(false); }} className="px-3 py-1.5 bg-red-900 hover:bg-red-800 text-white text-xs font-bold rounded transition-colors uppercase">Yes</button>
                                    <button onClick={() => setShowResetConfirm(false)} className="px-3 py-1.5 bg-stone-600 hover:bg-stone-500 text-white text-xs font-bold rounded transition-colors uppercase">No</button>
                                </div>
                            ) : (
                                <button onClick={() => setShowResetConfirm(true)} className="flex items-center justify-center px-3 py-2 bg-stone-800 border border-stone-700 text-stone-300 hover:text-white hover:bg-stone-700 rounded transition-all text-xs font-bold uppercase tracking-widest gap-2" title="Reset Progress">
                                    <IconRefreshCcw size={14} /> <span className="hidden md:inline">Reset</span>
                                </button>
                            )}
                            {solvedCases.length === 5 && !activeCaseId && (
                                <button onClick={() => setAppState('complete')} className="px-4 py-2 md:px-6 md:py-2.5 bg-stone-100 text-stone-900 font-bold tracking-wider uppercase rounded hover:bg-white animate-pulse text-xs md:text-sm whitespace-nowrap">
                                    Final Report
                                </button>
                            )}
                        </div>
                    </header>

                    <div className="flex-grow flex flex-col lg:flex-row gap-6 items-stretch w-full max-w-[1600px] mx-auto">
                        
                        {/* LEFT: Crossword Grid (60% width on Desktop) */}
                        <div className="lg:w-[60%] flex items-center justify-center bg-stone-300/40 p-3 md:p-6 lg:p-8 rounded shadow-inner border border-stone-300 w-full overflow-x-auto">
                            <div 
                                className="grid gap-[1.5px] bg-stone-800 p-2 md:p-3 rounded shadow-2xl min-w-[500px] w-full max-w-[850px]" 
                                style={{ gridTemplateColumns: `repeat(${GRID_SIZE}, minmax(0, 1fr))` }}
                            >
                                {crosswordGrid.map((row, y) => (
                                    row.map((cell, x) => (
                                        <div 
                                            key={`${x}-${y}`} 
                                            className={`
                                                relative aspect-square flex items-center justify-center font-serif transition-colors duration-300
                                                ${cell.isActive ? 'bg-white shadow-sm' : 'bg-transparent'}
                                                ${cell.isSolved ? 'bg-stone-50' : ''}
                                                ${activeCaseId && cell.caseIds.includes(activeCaseId) ? 'bg-amber-100 ring-2 ring-amber-400 z-10' : ''}
                                            `}
                                        >
                                            {cell.number && (
                                                <span className="absolute top-0.5 left-0.5 text-[8px] sm:text-[10px] font-sans font-bold text-stone-500 leading-none z-20 pointer-events-none">
                                                    {cell.number}
                                                </span>
                                            )}
                                            {cell.isSolved && (
                                                <span className="z-10 text-stone-900 drop-shadow-sm text-[11px] sm:text-xs md:text-sm lg:text-base font-black leading-none pointer-events-none">
                                                    {cell.letter}
                                                </span>
                                            )}
                                        </div>
                                    ))
                                ))}
                            </div>
                        </div>

                        {/* RIGHT: Active Case OR Case List (40% width on Desktop) */}
                        <div className="lg:w-[40%] flex flex-col h-[80vh] lg:h-auto min-h-[600px] bg-white rounded shadow-xl border border-stone-200 overflow-hidden relative">
                            {!activeCaseId ? (
                                <div className="p-5 md:p-8 h-full flex flex-col">
                                    <h2 className="text-lg md:text-xl font-bold uppercase tracking-widest text-stone-800 border-b-2 border-stone-200 pb-4 mb-6">Open Files</h2>
                                    <div className="space-y-4 flex-grow overflow-y-auto pr-2">
                                        {CASES.map(c => {
                                            const isSolved = solvedCases.includes(c.id);
                                            return (
                                                <button key={c.id} onClick={() => openCase(c.id)} className={`w-full text-left p-5 md:p-6 rounded border-2 transition-all group flex items-center justify-between ${isSolved ? 'bg-stone-50 border-stone-200 hover:border-stone-400' : 'bg-white border-stone-300 shadow-sm hover:border-stone-900 hover:shadow-md'}`}>
                                                    <div>
                                                        <div className="flex items-center gap-3 mb-2">
                                                            <span className="text-[10px] sm:text-xs font-bold px-2 py-1 bg-stone-200 text-stone-600 rounded tracking-widest uppercase">{c.gridNumber} {c.direction}</span>
                                                            {isSolved && <span className="flex items-center text-[10px] sm:text-xs font-bold text-stone-500 uppercase tracking-widest"><IconCheckCircle2 size={14} className="mr-1"/> Solved</span>}
                                                        </div>
                                                        <h3 className={`text-base md:text-lg font-serif italic leading-snug pr-4 ${isSolved ? 'text-stone-500 line-through decoration-stone-300' : 'text-stone-900'}`}>{c.argument}</h3>
                                                    </div>
                                                    <div className={`p-2.5 rounded-full shrink-0 ${isSolved ? 'bg-stone-100 text-stone-400' : 'bg-stone-900 text-white group-hover:scale-110 transition-transform'}`}>
                                                        <IconChevronRight size={18} />
                                                    </div>
                                                </button>
                                            )
                                        })}
                                    </div>
                                </div>
                            ) : (
                                <div className="flex flex-col h-full bg-stone-50 transition-all">
                                    <div className="bg-stone-900 p-4 flex items-center shadow-md z-10">
                                        <button onClick={closeCase} className="flex items-center text-stone-300 hover:text-white transition-colors uppercase tracking-widest text-xs sm:text-sm font-bold">
                                            <IconArrowLeft size={16} className="mr-2" /> Back
                                        </button>
                                        <div className="ml-auto flex items-center">
                                            <span className="text-[10px] sm:text-xs font-bold bg-stone-700 text-stone-200 px-3 py-1 rounded tracking-widest uppercase">CASE {activeCaseId}</span>
                                        </div>
                                    </div>

                                    <div className="p-5 md:p-8 flex-grow overflow-y-auto">
                                        {caseSubState === 'investigating' ? (
                                            <div className="space-y-6 md:space-y-8">
                                                <div className="bg-white p-6 md:p-8 border-l-4 border-stone-900 shadow-sm rounded-r">
                                                    <h4 className="text-[10px] md:text-xs font-bold text-stone-400 uppercase tracking-widest mb-3">Exhibit A: The Argument</h4>
                                                    <p className="text-xl md:text-2xl font-serif text-stone-900 leading-relaxed italic">{CASES.find(c => c.id === activeCaseId).argument}</p>
                                                </div>

                                                <div className="space-y-4">
                                                    <div className="flex items-center justify-between border-b border-stone-200 pb-2">
                                                        <h4 className="text-[10px] md:text-xs font-bold text-stone-400 uppercase tracking-widest">Investigation Clue</h4>
                                                        <span className="text-[10px] md:text-xs font-bold bg-stone-200 text-stone-600 px-2 py-1 rounded">Revealed: {revealedCluesCount}/1</span>
                                                    </div>
                                                    {[0].map(idx => (
                                                        <div key={idx} className="relative">
                                                            {idx < revealedCluesCount ? (
                                                                <div className="p-5 bg-stone-200/50 border border-stone-300 rounded text-stone-800 flex items-start shadow-inner">
                                                                    <IconSearch className="mr-3 text-stone-500 mt-0.5 shrink-0" size={18} />
                                                                    <p className="leading-relaxed text-sm md:text-base">{CASES.find(c => c.id === activeCaseId).clues[idx]}</p>
                                                                </div>
                                                            ) : (
                                                                <button onClick={revealNextClue} className="w-full p-5 border-2 border-dashed border-stone-400 rounded text-stone-600 hover:text-stone-900 hover:border-stone-900 hover:bg-stone-200/50 transition-all flex items-center justify-center font-bold tracking-widest uppercase text-xs sm:text-sm shadow-sm">
                                                                    <IconEye className="mr-3" size={18} /> Reveal Clue
                                                                </button>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                                
                                                <div className="bg-stone-900 p-5 md:p-6 lg:p-8 rounded shadow-lg mt-8">
                                                    <div className="mb-8 p-4 md:p-5 bg-stone-800/50 rounded border border-stone-700 w-full">
                                                        <label className="block text-center text-[10px] md:text-xs font-bold text-stone-400 tracking-widest uppercase mb-5 flex items-center justify-center gap-2">
                                                            <IconSearch size={14} /> Decrypt Word Pattern
                                                        </label>
                                                        
                                                        <div className="flex justify-center gap-1 sm:gap-1.5 md:gap-2 mb-8 w-full">
                                                            {CASES.find(c => c.id === activeCaseId).expectedAnswer.split('').map((letter, i) => (
                                                                <div key={i} className="flex-1 max-w-[2.5rem] min-w-[1.25rem] aspect-[3/4] flex items-center justify-center bg-stone-900 border-b-[3px] border-stone-600 text-stone-200 font-mono text-sm sm:text-base md:text-lg lg:text-xl font-bold rounded shadow-inner uppercase">
                                                                    {revealedVowels.includes(letter) ? letter : ''}
                                                                </div>
                                                            ))}
                                                        </div>

                                                        <div className="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 w-full">
                                                            <span className="text-[10px] md:text-xs font-bold text-stone-500 uppercase tracking-widest text-center whitespace-nowrap shrink-0">Scan Vowels:</span>
                                                            <div className="flex flex-wrap justify-center gap-2">
                                                                {['A', 'E', 'I', 'O', 'U'].map(vowel => {
                                                                    const isRevealed = revealedVowels.includes(vowel);
                                                                    return (
                                                                        <button key={vowel} onClick={() => setRevealedVowels(prev => [...prev, vowel])} disabled={isRevealed} className={`w-8 h-8 md:w-10 md:h-10 rounded font-bold transition-all flex items-center justify-center text-sm md:text-base ${isRevealed ? 'bg-stone-900 text-stone-700 border border-stone-800 cursor-not-allowed' : 'bg-stone-200 text-stone-900 hover:bg-white hover:scale-110 shadow-sm'}`}>
                                                                            {vowel}
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <label className="block text-center text-xs sm:text-sm font-bold text-stone-300 tracking-widest uppercase mb-4">Deduce the underlying value</label>
                                                    <div className="flex flex-col gap-3 w-full">
                                                        <input type="text" value={userGuess} onChange={(e) => {setUserGuess(e.target.value); setGuessFeedback(null);}} onKeyDown={(e) => e.key === 'Enter' && submitGuess()} placeholder="Enter deduction..." className="w-full bg-stone-800 border-2 border-stone-700 text-white p-3 md:p-4 rounded focus:outline-none focus:border-stone-400 text-sm md:text-lg uppercase tracking-wider font-bold placeholder-stone-500 transition-colors text-center" autoComplete="off" />
                                                        <button onClick={submitGuess} disabled={!userGuess.trim()} className="w-full py-3 md:py-4 bg-white text-stone-900 font-bold uppercase tracking-widest text-sm md:text-base rounded hover:bg-stone-200 disabled:opacity-50 transition-colors flex items-center justify-center shrink-0">Lock In</button>
                                                    </div>
                                                    {guessFeedback === 'incorrect' && (
                                                        <div className="mt-4 p-3 bg-red-900/50 border border-red-700 text-red-200 rounded text-xs md:text-sm font-bold tracking-wide uppercase flex items-center justify-center">
                                                            <IconAlertCircle size={16} className="mr-2" /> Deduction Incorrect.
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="flex flex-col items-center justify-center h-full text-center py-6 md:py-10">
                                                <div className="w-16 h-16 md:w-20 md:h-20 bg-stone-900 text-white rounded-full flex items-center justify-center mb-6 shadow-xl"><IconCheckCircle2 size={36} /></div>
                                                <h2 className="text-[10px] md:text-xs font-bold tracking-widest text-stone-500 uppercase mb-2">Case Solved</h2>
                                                <h3 className="text-3xl md:text-4xl font-serif font-bold text-stone-900 mb-8 uppercase tracking-wider border-b-4 border-stone-900 pb-4 inline-block">{CASES.find(c => c.id === activeCaseId).expectedAnswer}</h3>
                                                <div className="text-left bg-white p-6 md:p-8 rounded shadow-md border border-stone-200 w-full mb-8">
                                                    <p className="text-base md:text-lg text-stone-800 leading-relaxed mb-6 font-serif">{CASES.find(c => c.id === activeCaseId).revealExplanation}</p>
                                                    <div className="bg-stone-100 p-4 md:p-5 rounded border border-stone-200">
                                                        <p className="text-stone-600 leading-relaxed whitespace-pre-line text-xs md:text-sm">
                                                            <strong className="text-stone-900 block mb-2 uppercase tracking-widest text-[10px] md:text-xs">Analysis:</strong>
                                                            {CASES.find(c => c.id === activeCaseId).revealNuance}
                                                        </p>
                                                    </div>
                                                </div>
                                                <button onClick={closeCase} className="px-6 py-3 md:px-8 md:py-4 bg-stone-900 text-white font-bold tracking-widest uppercase text-xs md:text-sm rounded hover:bg-stone-800 transition-colors shadow-lg flex items-center">
                                                    Return to Board <IconArrowLeft className="ml-3 rotate-180" size={18}/>
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );

            const renderCompleted = () => (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 bg-stone-100 text-stone-900">
                    <div className="max-w-3xl text-center">
                        <div className="mb-6 p-5 bg-stone-900 rounded-full inline-block text-white shadow-xl"><IconBookOpen size={48} /></div>
                        <h2 className="text-3xl md:text-5xl font-bold tracking-tight mb-2 font-serif uppercase">Case File Complete</h2>
                        <p className="text-sm md:text-xl text-stone-500 font-semibold tracking-widest uppercase mb-12">Investigation Dossier Sealed</p>
                        
                        <div className="w-full bg-white p-6 md:p-10 rounded shadow-md border border-stone-200 mb-12">
                            <h3 className="text-xs md:text-sm font-bold tracking-widest text-stone-400 uppercase mb-8 text-center border-b pb-4">Values Uncovered</h3>
                            <div className="flex flex-wrap justify-center gap-3 md:gap-4">
                                {CASES.map(c => <span key={c.id} className="px-4 py-2 md:px-5 md:py-3 bg-stone-50 border border-stone-300 rounded font-serif font-bold tracking-wider text-stone-800 shadow-sm text-sm md:text-lg uppercase">{c.expectedAnswer}</span>)}
                            </div>
                        </div>
                        
                        <div className="w-full text-center space-y-6 mb-12">
                            <h3 className="text-2xl md:text-3xl font-bold text-stone-900 font-serif uppercase tracking-wider">The Bigger Picture</h3>
                            <p className="text-lg md:text-xl text-stone-600 leading-relaxed max-w-2xl mx-auto">Arguments often communicate more than their surface message. When we identify the values underneath an argument, we can better understand why people may reach different conclusions about the same educational issue.</p>
                            <div className="py-8 md:py-10 bg-stone-900 text-white rounded-lg px-6 md:px-8 shadow-2xl mt-8">
                                <h4 className="text-2xl md:text-4xl font-serif italic mb-4 md:mb-6">"Look beneath the argument."</h4>
                                <p className="text-stone-300 text-base md:text-xl max-w-xl mx-auto leading-relaxed font-light">Strong dialogue begins with understanding what matters to the people involved—not simply what they are arguing about.</p>
                            </div>
                        </div>
                        
                        <div className="flex flex-col sm:flex-row items-center justify-center gap-4 w-full">
                            <button onClick={() => setAppState('dashboard')} className="flex items-center justify-center w-full sm:w-auto px-6 py-3 md:px-8 md:py-4 bg-white border-2 border-stone-900 text-stone-900 font-bold tracking-widest uppercase text-xs md:text-sm rounded hover:bg-stone-900 hover:text-white transition-colors">
                                <IconGrid size={18} className="mr-3" /> Review Crossword Board
                            </button>
                            <button onClick={() => { setSolvedCases([]); setActiveCaseId(null); setAppState('intro'); }} className="flex items-center justify-center w-full sm:w-auto px-6 py-3 md:px-8 md:py-4 bg-stone-200 border-2 border-transparent text-stone-700 font-bold tracking-widest uppercase text-xs md:text-sm rounded hover:bg-stone-300 transition-colors">
                                <IconRefreshCcw size={18} className="mr-3" /> Restart Case
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen font-sans">
                    {appState === 'intro' && renderIntro()}
                    {appState === 'dashboard' && renderDashboard()}
                    {appState === 'complete' && renderCompleted()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
