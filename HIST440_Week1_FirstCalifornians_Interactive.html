<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIST440 Week 1 | The First Californians: Regions Explorer</title>
<style>
:root{--teal:#0b4f6c;--teal2:#136f8f;--gold:#e0a526;--gold-d:#8a5f00;--terra:#b5532f;--cream:#fbf7ef;--paper:#ffffff;--ink:#1f2a33;--muted:#55636f;--line:#e2d9c6;--good:#1f7a4d;--bad:#b3261e;--sea:#cfe6ef}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
header.top{flex:0 0 auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(90deg,var(--teal),var(--teal2));color:#fff;min-height:58px}
header.top .txt{position:relative;z-index:1;max-width:72%}
header.top .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--ink);padding:1px 8px;border-radius:99px;margin-bottom:2px}
header.top h1{margin:0;font-size:19px;line-height:1.15}
header.top p{margin:2px 0 0;font-size:13px;opacity:.95}
header.top svg.art{position:absolute;right:0;top:0;height:100%;width:auto;max-width:40%}
main{flex:1 1 auto;min-height:0;display:grid;gap:12px;padding:10px 16px 12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:0;min-width:0;display:flex;flex-direction:column}
h2{font-size:15px;margin:0 0 6px;color:var(--teal)}
button{font:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid #1b6ef3;outline-offset:2px}
.btn{border:1.5px solid var(--teal);background:#fff;color:var(--teal);border-radius:8px;padding:6px 12px;font-weight:600}
.btn:hover{background:#eaf4f8}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:#093f57}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#f4efe3;border-radius:8px;padding:6px 8px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold-d);}
.pill{display:inline-block;background:#eef5f8;color:var(--teal);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;margin:0 4px 4px 0}
.fb{border-radius:8px;padding:6px 10px;font-size:13.5px;margin-top:6px}
.fb.good{background:#e6f4ec;border:1px solid #9fd2b5;color:#14503a}
.fb.bad{background:#fdeceb;border:1px solid #f0b4b0;color:#7a1b15}
.fb.info{background:#fff6dc;border:1px solid #ecd48a;color:#5b4300}
.small{font-size:13px;color:var(--muted)}
.sr{position:absolute;left:-9999px}
.think{background:#fff6dc;border-left:4px solid var(--gold);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13.5px}
svg text{font-family:inherit}
@media (max-width:720px){
 html,body{overflow:auto;height:auto}
 .app{height:auto}
 main{display:flex;flex-direction:column}
 header.top .txt{max-width:100%}
 header.top svg.art{opacity:.25}
 .mapwrap{height:420px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

main{grid-template-columns:minmax(280px,40%) 1fr}
.mapwrap{padding:0;background:#cfe6ef;overflow:hidden;align-items:center;justify-content:center}
.mapwrap svg{width:100%;height:100%;min-height:0;display:block}
.region{cursor:pointer;transition:filter .15s}
.region:hover{filter:brightness(1.12)}
.region.sel path{stroke:#1f2a33;stroke-width:3}
.badge circle{fill:#fff;stroke:#1f2a33;stroke-width:1.5}
.badge text{font-weight:700;font-size:13px;text-anchor:middle;dominant-baseline:central;fill:#1f2a33;pointer-events:none}
.scene{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px;flex:0 0 auto}
.scene svg{display:block;width:100%;height:92px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:6px 0}
.facts div{background:#faf6ec;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13.5px}
.facts b{display:block;color:var(--teal);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
#view{flex:1 1 auto;min-height:0}
.score{font-weight:700;color:var(--teal)}
.sc{font-size:15px;background:#eef5f8;border-radius:10px;padding:8px 12px;margin-bottom:6px}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="txt"><span class="tag">HIST440 &bull; Week 1</span>
 <h1>The First Californians: Regions Explorer</h1>
 <p>Big Question: How did California&rsquo;s geography shape the lives of its first peoples?</p></div>
 <svg class="art" viewBox="0 0 300 60" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <circle cx="240" cy="22" r="13" fill="#e0a526"/>
  <path d="M60 60 L110 12 L140 40 L170 18 L230 60Z" fill="#0a3f57"/><path d="M100 22 L110 12 L121 24 L111 20Z" fill="#fff" opacity=".85"/>
  <path d="M150 60 L200 28 L260 60Z" fill="#0d5a7a"/><path d="M0 60 Q40 48 80 60Z" fill="#4f8a5b"/>
 </svg>
</header>
<main>
 <section class="panel mapwrap" aria-label="Map of California regions"><svg id="map" viewBox="0 0 400 470" role="group" aria-label="Interactive map: select a region"></svg></section>
 <section class="panel" aria-label="Region details">
  <div class="tabs" role="tablist">
   <button role="tab" id="tExplore" aria-selected="true">Explore regions</button>
   <button role="tab" id="tChallenge" aria-selected="false">Challenge: Where would you settle?</button>
  </div>
  <div class="chips" id="chips" aria-label="Regions"></div>
  <div id="view" aria-live="polite"></div>
 </section>
</main>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const CA_OUT=[[-124.2,42.0],[-120,42],[-120,39],[-114.6,35.0],[-114.7,32.7],[-117.1,32.5],[-117.3,33.0],[-118.4,33.8],[-118.5,34.0],[-119.2,34.1],[-120.5,34.45],[-120.65,35.15],[-121.3,35.7],[-121.9,36.6],[-122.0,36.95],[-122.5,37.5],[-122.5,37.8],[-123.0,38.0],[-123.7,38.9],[-123.8,39.6],[-124.4,40.4],[-124.1,41.0]];
function mkProj(o){const c=Math.cos(37.5*Math.PI/180);return (lon,lat)=>[(lon-o.lonMin)*c*o.k,(o.latMax-lat)*o.k];}
function pathOf(P,pts){return 'M'+pts.map(p=>P(p[0],p[1]).map(v=>v.toFixed(1)).join(' ')).join('L')+'Z';}
function lineOf(P,pts){return 'M'+pts.map(p=>P(p[0],p[1]).map(v=>v.toFixed(1)).join(' ')).join('L');}
function waves(w,h,n){let s='';for(let i=0;i<n;i++){const x=(i*97)%w,y=(i*53+20)%h;s+=`<path d="M${x} ${y}q6 -5 12 0t12 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>`;}return s;}

const P=mkProj({lonMin:-124.6,latMax:42.2,k:47.5});
const R=[
{id:'nw',n:1,name:'North Coast & Redwoods',color:'#4f8a5b',badge:[-123.3,40.9],poly:[[-126,43],[-122.6,43],[-122.6,39.2],[-123.2,38.2],[-126,38.2]],
 terrain:'Foggy coast, rivers, and giant redwood forests',peoples:['Yurok','Hupa','Karuk','Pomo'],food:'Salmon, acorns, shellfish, deer',home:'Redwood plank houses; dugout redwood canoes on rivers',craft:'Fine basketry (Pomo), woodworking',
 think:'Rivers full of salmon and forests full of redwood. How might that make settlements permanent?',
 scene:'<rect width="300" height="80" fill="#cfe6ef"/><path d="M0 62Q70 52 140 62T300 58V80H0Z" fill="#6fa8c4"/><g fill="#2f6b3f"><path d="M30 70L45 8L60 70Z"/><path d="M80 70L93 14L106 70Z"/><path d="M215 70L230 6L245 70Z"/><path d="M255 70L267 18L279 70Z"/></g><g fill="#7a4a2b"><rect x="42" y="68" width="6" height="10"/><rect x="90" y="68" width="6" height="10"/><rect x="227" y="68" width="6" height="10"/></g><ellipse cx="160" cy="68" rx="11" ry="4" fill="#f08a6a"/><path d="M171 68l7-4v8z" fill="#f08a6a"/>'},
{id:'mtn',n:2,name:'Sierra Nevada & Northern Mountains',color:'#7e94a8',badge:[-121.5,41.5],poly:[[-122.6,43],[-120,43],[-120,39.2],[-119.3,38.2],[-118.3,36.6],[-117.9,35.5],[-118.8,35.0],[-119.0,36.0],[-120.2,38.0],[-121.2,40.4],[-122.6,40.4]],
 terrain:'Snowy peaks, forested foothills, mountain meadows',peoples:['Miwok','Maidu','Washoe','Shasta'],food:'Acorns (staple), deer, pine nuts, fish',home:'Bark and cedar houses; seasonal camps in the high country',craft:'Trade routes over the mountains',
 think:'Many groups moved with the seasons. Which resources would pull you uphill in summer?',
 scene:'<rect width="300" height="80" fill="#d9ebf5"/><path d="M0 80L50 22L85 55L130 12L185 80Z" fill="#6c849a"/><path d="M110 80L170 26L215 58L255 20L300 80Z" fill="#8aa0b4"/><path d="M123 22L130 12L139 26L131 21Z" fill="#fff"/><path d="M247 29L255 20L263 31L255 27Z" fill="#fff"/><rect x="0" y="66" width="300" height="14" fill="#4f8a5b"/><g fill="#2f6b3f"><circle cx="30" cy="62" r="10"/><circle cx="270" cy="62" r="9"/></g>'},
{id:'val',n:3,name:'Central Valley',color:'#d9b957',badge:[-120.6,37.3],poly:[[-122.6,40.4],[-121.2,40.4],[-120.2,38.0],[-119.0,36.0],[-118.8,35.0],[-120.2,35.0],[-121.0,36.8],[-122.3,38.4]],
 terrain:'Flat, fertile plain with rivers, marshes, and tule reeds',peoples:['Yokuts','Patwin','Wintun','Northern Valley Yokuts'],food:'Fish, waterfowl, elk, acorns, seeds',home:'Tule-reed houses; tule reed boats',craft:'Reed baskets and mats',
 think:'Today the Valley is farmland. What made it rich in resources long before farms?',
 scene:'<rect width="300" height="80" fill="#fde8b0"/><circle cx="240" cy="24" r="14" fill="#f4b73e"/><rect y="56" width="300" height="24" fill="#d9b957"/><g stroke="#5c8a3a" stroke-width="3" stroke-linecap="round"><path d="M30 70V44M38 70V38M46 70V46M120 70V42M128 70V36M136 70V44M210 70V46M218 70V40"/></g><path d="M0 68Q75 60 150 68T300 66" fill="none" stroke="#7fb4d0" stroke-width="5"/><path d="M80 20q5-5 10 0q5-5 10 0" fill="none" stroke="#444" stroke-width="1.5"/>'},
{id:'coast',n:4,name:'Central & Southern Coast',color:'#5fb0a8',badge:[-119.3,34.4],poly:[[-126,38.2],[-123.2,38.2],[-122.6,38.3],[-122.3,38.4],[-121.0,36.8],[-120.2,35.0],[-118.8,35.0],[-117.6,34.4],[-116.8,33.6],[-116.0,32.0],[-126,32.0]],
 terrain:'Mild coast, bays, Channel Islands, oak woodlands',peoples:['Ohlone','Salinan','Chumash','Tongva','Kumeyaay'],food:'Fish, shellfish, sea mammals, acorns',home:'Domed thatch houses; plank canoes (tomol) among the Chumash',craft:'Shell-bead money and trade; rock art',
 think:'The Chumash creation story you watch this week begins on an island. How do stories carry a people&rsquo;s sense of place?',
 scene:'<rect width="300" height="80" fill="#cfe6ef"/><path d="M0 40Q75 30 150 40T300 38V80H0Z" fill="#5fb0a8"/><path d="M0 56Q75 48 150 56T300 54V80H0Z" fill="#3f8f95"/><path d="M110 50h70l-8 9h-54z" fill="#8a5a33"/><path d="M145 50V30l22 20z" fill="#f2e2c4"/><path d="M0 40q40-24 80 0z" fill="#8c9a6e"/><path d="M240 38q30-20 60 0z" fill="#8c9a6e"/>'},
{id:'des',n:5,name:'Deserts & Eastern California',color:'#d98d5f',badge:[-116.3,34.3],poly:[[-126,32],[-112,32],[-112,43],[-120,43],[-120,39.2],[-119.3,38.2],[-118.3,36.6],[-117.9,35.5],[-118.8,35.0],[-117.6,34.4],[-116.8,33.6],[-116.0,32.0]],
 terrain:'Hot, dry basins, desert oases, and the Colorado River',peoples:['Mojave','Cahuilla','Owens Valley Paiute','Quechan'],food:'Mesquite, agave, pinyon; corn, beans, squash (Colorado River)',home:'Brush shelters and thatched houses near water',craft:'Pottery (ollas), irrigation ditches (Owens Valley Paiute)',
 think:'Water decides everything here. Notice that Owens Valley shows up again in Week 8.',
 scene:'<rect width="300" height="80" fill="#fde3c2"/><circle cx="60" cy="24" r="15" fill="#f08a3c"/><path d="M0 80Q60 52 130 66T300 56V80Z" fill="#d98d5f"/><path d="M0 80Q90 66 170 74T300 70V80Z" fill="#c4764a"/><g fill="#4f8a5b"><rect x="212" y="30" width="8" height="36" rx="4"/><rect x="202" y="40" width="6" height="14" rx="3"/><rect x="224" y="36" width="6" height="16" rx="3"/></g>'}
];
const CH=[
 {a:'nw',q:'Your village depends on salmon runs and giant redwoods for building plank houses.',why:'Salmon-rich rivers and redwood forests defined life on the North Coast.'},
 {a:'mtn',q:'You gather acorns in the foothills and climb to cool high meadows each summer to hunt and trade.',why:'Seasonal movement between foothills and high country marked Sierra life.'},
 {a:'val',q:'Your people live beside marshes and build houses and boats from tule reeds.',why:'Tule marshes and abundant waterfowl and fish shaped Central Valley life.'},
 {a:'coast',q:'You paddle a plank canoe between islands and trade shell-bead money up and down the coast.',why:'The Chumash built plank canoes (tomol) and traded shell beads along the coast.'},
 {a:'des',q:'You farm corn, beans, and squash on a river floodplain, or harvest mesquite and agave in hot, dry land.',why:'Desert peoples adapted to scarce water, from Colorado River farming to mesquite gathering.'}
];
let sel='nw',mode='explore',ci=0,score=0,order=[],answered=false;
const svg=$('#map');
let h=`<rect width="400" height="470" fill="#cfe6ef"/>${waves(400,470,34)}<defs><clipPath id="ca"><path d="${pathOf(P,CA_OUT)}"/></clipPath></defs><g clip-path="url(#ca)"><rect width="400" height="470" fill="#d98d5f"/>`;
R.forEach(r=>{if(r.id!=='des')h+=`<g class="region" id="rg-${r.id}" data-id="${r.id}" tabindex="0" role="button" aria-label="${r.n}. ${r.name}"><path d="${pathOf(P,r.poly)}" fill="${r.color}" stroke="#fff" stroke-width="1.5"/></g>`;});
h=h.replace('<rect width="400" height="470" fill="#d98d5f"/>','');
const d=R.find(r=>r.id==='des');
h=h.replace('<g clip-path="url(#ca)">',`<g clip-path="url(#ca)"><g class="region" id="rg-des" data-id="des" tabindex="0" role="button" aria-label="5. ${d.name}"><path d="${pathOf(P,d.poly)}" fill="${d.color}" stroke="#fff" stroke-width="1.5"/></g>`);
h+=`</g><path d="${pathOf(P,CA_OUT)}" fill="none" stroke="#1f2a33" stroke-width="2"/>`;
R.forEach(r=>{const[x,y]=P(...r.badge);h+=`<g class="badge" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="11"/><text>${r.n}</text></g>`;});
h+=`<text x="40" y="440" font-size="13" fill="#2b5a70" font-style="italic">Pacific Ocean</text>`;
svg.innerHTML=h;
$$('.region',svg).forEach(g=>{g.addEventListener('click',()=>pick(g.dataset.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(g.dataset.id);}});});
$('#chips').innerHTML=R.map(r=>`<button class="chip" data-id="${r.id}" aria-pressed="false">${r.n}. ${r.name}</button>`).join('');
$$('#chips .chip').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.id)));
function mark(){$$('.region',svg).forEach(g=>g.classList.toggle('sel',g.dataset.id===sel&&mode==='explore'));$$('#chips .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===sel&&mode==='explore'));}
function explore(){const r=R.find(x=>x.id===sel);
 $('#view').innerHTML=`<div class="scene"><svg viewBox="0 0 300 80" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Illustration of the ${r.name} landscape">${r.scene}</svg></div>
 <h2>${r.n}. ${r.name}</h2><p style="margin:0 0 6px">${r.terrain}.</p>
 <div>${r.peoples.map(p=>`<span class="pill">${p}</span>`).join('')}</div>
 <div class="facts"><div><b>Food &amp; resources</b>${r.food}</div><div><b>Homes &amp; travel</b>${r.home}</div><div style="grid-column:1/3"><b>Crafts &amp; culture</b>${r.craft}</div></div>
 <div class="think"><b>Think about it:</b> ${r.think}</div>`;mark();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function challenge(){
 if(ci>=order.length){const msg=score>=4?'Excellent: you read the land like a first Californian.':'Good start. Revisit the Explore tab and try again.';
  $('#view').innerHTML=`<div class="sc"><h2>Challenge complete</h2><p style="font-size:18px;margin:4px 0">You scored <span class="score">${score} / ${order.length}</span></p><p style="margin:0">${msg}</p></div><button class="btn primary" id="again">Play again</button>`;
  $('#again').onclick=startC;return;}
 const c=order[ci];answered=false;
 $('#view').innerHTML=`<div class="sc"><span class="small">Scenario ${ci+1} of ${order.length} &bull; Score <span class="score">${score}</span></span><p style="margin:4px 0 0;font-size:15.5px">${c.q}</p></div><p class="small">Select the region on the map (or use the numbered buttons above) where this way of life fits best.</p><div id="fbk"></div><button class="btn primary" id="nxt" hidden>${ci===order.length-1?'See score':'Next scenario'}</button>`;
 $('#nxt').onclick=()=>{ci++;challenge();};mark();}
function startC(){order=shuffle(CH);ci=0;score=0;challenge();}
function pick(id){
 if(mode==='explore'){sel=id;explore();return;}
 if(ci>=order.length||answered)return;
 const c=order[ci],ok=id===c.a,r=R.find(x=>x.id===id),cr=R.find(x=>x.id===c.a);answered=true;if(ok)score++;
 $('#fbk').innerHTML=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Correct!':'Not quite.'}</b> ${ok?'':`You chose ${r.name}. Best fit: <b>${cr.name}</b>. `}${c.why}</div>`;
 $$('.region',svg).forEach(g=>g.classList.toggle('sel',g.dataset.id===c.a));
 $('#nxt').hidden=false;$('#nxt').focus();}
function setMode(m){mode=m;$('#tExplore').setAttribute('aria-selected',m==='explore');$('#tChallenge').setAttribute('aria-selected',m==='challenge');
 $$('.region',svg).forEach(g=>g.classList.remove('sel'));
 if(m==='explore')explore();else startC();}
$('#tExplore').onclick=()=>setMode('explore');$('#tChallenge').onclick=()=>setMode('challenge');
explore();
</script>
</body>
</html>
