<!DOCTYPE html>
<!--OUT:PSYC-450_Week-4_Communication-Stances.html-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSYC 450 | Week 4: Communication Stances</title>
<style>
:root{--red:#a8353a;--red2:#d34147;--ink:#1f1f23;--cream:#f4f0ea;--line:#e2dbcf;--muted:#5a5a62;--teal:#2f6f73;--gold:#b7791f;--plum:#6b4fa0;--rose:#c0457a;--green:#2f8a6a;--blue:#3b5b8c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--cream);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #2f6fdc;outline-offset:2px}
.app{height:100vh;display:flex;flex-direction:column;min-height:0}
.hd{flex:0 0 auto;background:linear-gradient(100deg,#8f2a30,#d34147);color:#fff;padding:8px 18px;display:flex;align-items:center;gap:12px}
.hd svg{flex:0 0 auto}
.hd .eb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.88}
.hd h1{margin:0;font:700 19px/1.15 Georgia,"Times New Roman",serif}
.tabs{flex:0 0 auto;display:flex;gap:6px;padding:9px 14px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 15px;font-weight:600;font-size:13px}
.tab:hover{border-color:#bbb}
.tab[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.stage{flex:1 1 auto;min-height:0;padding:10px 14px 12px;display:flex}
.view{display:none;flex:1;min-height:0;gap:12px;width:100%}
.view.on{display:flex}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:0;min-width:0}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
h2{margin:0 0 4px;font:700 17px/1.2 Georgia,serif}
h3{margin:0 0 2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.sec{margin-top:9px}
.sec p{font-size:13.5px}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:10px;padding:7px 13px;font-weight:600;font-size:13px}
.btn:hover{background:#f2eee7}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:#8f2a30}
.btn[disabled]{opacity:.45;cursor:default}
.note{font-size:12.5px;color:var(--muted)}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.fb{border-radius:10px;padding:8px 11px;font-size:13.5px;margin-top:8px}
.fb.ok{background:#e6f4ec;border:1px solid #9fd3b6}
.fb.no{background:#fdeceb;border:1px solid #f0aaa6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:700px){
 html,body{overflow:auto;height:auto}
 .app{height:auto;min-height:100vh}
 .stage{display:block}
 .view.on{flex-direction:column}
 .card{overflow:visible}
}

.view{flex-direction:column}
.fr{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;flex:0 0 auto}
.st{background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 4px 7px;text-align:center;font-weight:700;font-size:13px}
.st svg{width:100%;height:auto;max-height:150px;display:block}
.st[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.st:disabled{cursor:default}
.dt{flex:1;display:flex;gap:16px;align-items:flex-start;overflow:hidden}
.big{flex:0 0 210px}
.big svg{width:210px;height:auto}
.say{position:relative;background:#faf6f0;border:2px solid var(--c,#888);border-radius:14px;padding:8px 13px;font:italic 20px/1.4 Georgia,serif;margin-bottom:12px;padding:12px 16px}.dt p,.layer p{font-size:15.5px}.dt h3{font-size:12px}.scene{font-size:14px!important;margin-bottom:10px!important}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.scene{font-size:13px;color:var(--muted);margin-bottom:6px}
.q{font:italic 21px/1.4 Georgia,serif;background:#faf6f0;border-left:4px solid var(--red);border-radius:0 10px 10px 0;padding:10px 14px;margin:8px 0}
.layers{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.layer{border-radius:12px;padding:10px 14px;border:2px solid var(--line)}
.layer.c{background:#eef3fa;border-color:#b9cce6}
.layer.r{background:#fdeff0;border-color:#efb3b6}
.layer.hid{background:#f4f1ec;border-style:dashed;color:var(--muted)}
.ans{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ansb{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:5px 14px 5px 8px;font-weight:700;font-size:14px}
.ansb svg{width:40px;height:50px}
.ansb:disabled{opacity:.55;cursor:default}
.ansb.right{border-color:var(--green);background:#e6f4ec;opacity:1}
.ansb.wrong{border-color:#d34147;background:#fdeceb;opacity:1}
@media (max-width:700px){.fr{grid-template-columns:repeat(3,1fr)}.dt{flex-direction:column}.grid3{grid-template-columns:1fr}}
</style></head><body>
<div class="app">
<header class="hd">
 <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 8h22a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H14l-7 6v-6H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2Z" fill="rgba(255,255,255,.2)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><path d="M26 18h8a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3v5l-6-5h-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" opacity=".7"/></svg>
 <div><div class="eb">PSYC 450 | Week 4</div><h1>Communication Stances: You Cannot Not Communicate</h1></div>
</header>
<div class="tabs" role="tablist">
 <button class="tab" role="tab" data-view="meet" aria-selected="true">Meet the stances</button>
 <button class="tab" role="tab" data-view="name" aria-selected="false">Name that stance</button>
 <button class="tab" role="tab" data-view="two" aria-selected="false">Two levels of a message</button>
</div>
<div class="stage">
 <div class="view on" id="meet">
  <div class="fr" id="fr" role="group" aria-label="Satir stances"></div>
  <div class="card dt" id="dt" aria-live="polite"></div>
 </div>
 <div class="view" id="name"><div class="card" style="flex:1" id="nm"></div></div>
 <div class="view" id="two"><div class="card" style="flex:1" id="tw"></div></div>
</div></div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function initTabs(onChange){
  const tabs=$$('.tabs .tab'), views=$$('.view');
  tabs.forEach(t=>t.addEventListener('click',()=>{
    tabs.forEach(x=>x.setAttribute('aria-selected',x===t));
    views.forEach(v=>v.classList.toggle('on',v.id===t.dataset.view));
    onChange&&onChange(t.dataset.view); postH();
  }));
}
function postH(){try{parent.postMessage({type:'psyc450-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}
addEventListener('load',postH);addEventListener('resize',postH);

initTabs();
/* stick-figure art, viewBox 0 0 140 170 */
const fig=(c,body)=>`<g stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">${body}</g>`;
const head=(c,x,y,mood)=>`<circle cx="${x}" cy="${y}" r="15" fill="#f6dcc0" stroke="${c}" stroke-width="3"/>`+mood;
const face=(x,y,m)=>{const e=`<circle cx="${x-5}" cy="${y-2}" r="1.8" fill="#333"/><circle cx="${x+5}" cy="${y-2}" r="1.8" fill="#333"/>`;
 const mo={worry:`<path d="M${x-5} ${y+7}Q${x} ${y+3} ${x+5} ${y+7}" stroke="#333" stroke-width="1.8" fill="none"/>`,mad:`<path d="M${x-5} ${y+7}H${x+5}" stroke="#333" stroke-width="2" fill="none"/><path d="M${x-8} ${y-8}L${x-2} ${y-5}M${x+8} ${y-8}L${x+2} ${y-5}" stroke="#333" stroke-width="2"/>`,flat:`<path d="M${x-5} ${y+6}H${x+5}" stroke="#333" stroke-width="2"/>`,silly:`<path d="M${x-6} ${y+5}Q${x} ${y+12} ${x+6} ${y+5}" stroke="#333" stroke-width="1.8" fill="#fff"/>`,calm:`<path d="M${x-6} ${y+5}Q${x} ${y+10} ${x+6} ${y+5}" stroke="#333" stroke-width="1.8" fill="none"/>`}[m];return e+mo};
const ART={
 placater:c=>head(c,56,52,face(56,52,'worry'))+fig(c,'<path d="M58 68L52 112"/><path d="M52 112L34 150L72 150"/><path d="M52 112L88 128L88 150"/><path d="M56 82L96 90L112 76"/><path d="M52 84L36 104"/>')+`<path d="M112 70q-5-9 3-11q8 2 0 11" fill="${c}" opacity=".0"/><path d="M104 72l12-4" stroke="${c}" stroke-width="0"/>`,
 blamer:c=>head(c,46,50,face(46,50,'mad'))+fig(c,'<path d="M52 66L66 110"/><path d="M66 110L44 152"/><path d="M66 110L96 152"/><path d="M56 80L116 66"/><path d="M60 84L40 104L52 112"/>')+`<path d="M122 62L136 58" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`,
 reasonable:c=>head(c,70,38,face(70,38,'flat'))+fig(c,'<path d="M70 54V112"/><path d="M70 112L58 152"/><path d="M70 112L82 152"/><path d="M70 66L50 84L66 98"/><path d="M70 66L90 84L74 98"/>')+`<rect x="56" y="88" width="36" height="24" rx="3" fill="#fff" stroke="${c}" stroke-width="3"/><path d="M62 96H86M62 103H80" stroke="${c}" stroke-width="2"/>`,
 distracter:c=>head(c,86,44,face(86,44,'silly'))+fig(c,'<path d="M80 60L66 106"/><path d="M66 106L36 126L26 106"/><path d="M66 106L82 150"/><path d="M76 74L110 48L120 60"/><path d="M72 78L34 70"/>')+`<g stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"><path d="M16 40q10-14 20-2"/><path d="M118 100q10 6 8 18"/><path d="M110 24q8-8 16 0"/></g>`,
 leveler:c=>head(c,70,36,face(70,36,'calm'))+fig(c,'<path d="M70 52V110"/><path d="M70 110L52 152"/><path d="M70 110L88 152"/><path d="M70 66L40 84"/><path d="M70 66L100 84"/>')+`<g fill="${c}"><circle cx="38" cy="86" r="4.5"/><circle cx="102" cy="86" r="4.5"/></g><path transform="translate(70,134) scale(.0)" />`
};
const S={
 placater:{n:'Placater',c:'#c28a1e',say:'“Whatever you want is fine. It’s my fault, I’m sorry.”',pro:'Keeps the peace and avoids rejection.',cost:'Own needs vanish; others cannot know what you really feel.',lev:'“I’m tired and I’d like to hear what happened. Can we talk?”'},
 blamer:{n:'Blamer',c:'#d34147',say:'“You’re late again! You never think about anyone but yourself.”',pro:'Hides vulnerability behind strength and control.',cost:'Others feel attacked and defend or retreat; connection breaks.',lev:'“I’m worried when dinner goes cold. I’d like us to plan around it.”'},
 reasonable:{n:'Super-reasonable',c:'#3b5b8c',say:'“Statistically, lateness is correlated with poor planning. Let’s stay rational.”',pro:'Feels safe, correct, and in control.',cost:'Emotions get ignored, and others feel unheard or lectured.',lev:'“Honestly, I’m frustrated and a little scared. Tell me what happened.”'},
 distracter:{n:'Irrelevant',c:'#7a5aa6',say:'“Did you see the game? Anyway, what’s for dessert? Look, a squirrel!”',pro:'Reduces tension by changing the subject.',cost:'The real issue never gets addressed, and no one feels heard.',lev:'“I’m nervous about this conversation. Can we slow down and talk it through?”'},
 leveler:{n:'Congruent (Leveler)',c:'#2f8a6a',say:'“I’m worried because dinner matters to me and I want to hear what happened.”',pro:'Words, feelings, and actions line up, which builds trust.',cost:'Feels vulnerable at first, but invites real connection.',lev:'This is the goal stance: clear, honest, and caring.'}
};
const K=Object.keys(S);
const svg=(k,w,h)=>`<svg viewBox="0 0 140 170" width="${w||''}" height="${h||''}" aria-hidden="true">${ART[k](S[k].c)}</svg>`;
$('#fr').innerHTML=K.map(k=>`<button class="st" data-k="${k}" style="--c:${S[k].c}" aria-pressed="false">${svg(k)}${S[k].n}</button>`).join('');
function meet(k){$$('.st').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));const d=S[k];
 $('#dt').innerHTML=`<div class="big">${svg(k)}</div><div style="flex:1;min-width:0">
  <div class="scene"><b>Scene:</b> A parent says, “Dinner’s been cold for an hour. Where were you?”</div>
  <div class="say" style="--c:${d.c}">${d.say}</div>
  <div class="grid3"><div><h3>What it protects</h3><p>${d.pro}</p></div><div><h3>What it costs</h3><p>${d.cost}</p></div><div><h3>${k==='leveler'?'Why it works':'Congruent alternative'}</h3><p>${d.lev}</p></div></div></div>`}
$('#fr').onclick=e=>{const b=e.target.closest('.st');if(b)meet(b.dataset.k)};
$('#dt').innerHTML='<div style="margin:auto;text-align:center"><h2>Choose a stance above</h2><p class="note">Satir described four stress stances and one congruent stance. Each one handles the same scene differently.</p></div>';

/* quiz */
const Q=[['“It’s fine, whatever you want. It’s probably my fault anyway. I’m so sorry.”','placater'],['“You never listen! This is exactly why nothing around here works.”','blamer'],['“Being late shows poor planning. Let us remain calm and logical about this.”','reasonable'],['“Hey, did you see the game? Anyway, what’s for dessert? Ooh, look at that dog outside!”','distracter'],['“I’m worried because dinner matters to me, and I want to hear what happened. Can we talk?”','leveler']];
let qi=0,sc=0;
function quiz(){const nm=$('#nm');
 if(qi>=Q.length){nm.innerHTML=`<h2>Round complete</h2><p class="sec">You named <b>${sc} of ${Q.length}</b> stances correctly.</p><p class="sec note">${sc==Q.length?'You can hear the stance behind the words.':'Revisit “Meet the stances” and listen for what each one protects.'}</p><div class="sec"><button class="btn pri" id="ag">Play again</button></div>`;$('#ag').onclick=()=>{qi=0;sc=0;quiz()};return}
 nm.innerHTML=`<div class="score" style="font-weight:700">Question ${qi+1} of ${Q.length} · Score ${sc}</div><h3 class="sec">A family member says…</h3><div class="q">${Q[qi][0]}</div><h3>Which stance is this?</h3>
 <div class="ans" id="ans">${K.map(k=>`<button class="ansb" data-k="${k}"><svg viewBox="0 0 140 170">${ART[k](S[k].c)}</svg>${S[k].n}</button>`).join('')}</div><div id="fbk"></div>`;
 $('#ans').onclick=e=>{const b=e.target.closest('.ansb');if(!b||b.disabled)return;const k=b.dataset.k,right=Q[qi][1];if(k===right)sc++;
  $$('.ansb').forEach(x=>{x.disabled=true;if(x.dataset.k===right)x.classList.add('right');});if(k!==right)b.classList.add('wrong');
  const d=S[right];$('#fbk').innerHTML=`<div class="fb ${k===right?'ok':'no'}"><b>${k===right?'Correct.':'Not quite.'}</b> This is the <b>${d.n}</b> stance. It protects: ${d.pro.toLowerCase()} <br><b>Congruent rewrite:</b> ${right==='leveler'?'It is already congruent.':d.lev}</div><div class="sec"><button class="btn pri" id="nx">${qi<Q.length-1?'Next':'See results'}</button></div>`;
  $('#nx').onclick=()=>{qi++;quiz()};postH()}}
quiz();

/* two levels */
const M=[
 {say:'“Did you finish your homework?”',nv:'Said with a warm smile',c:'Asks whether the homework is done.',r:'“I care about how you’re doing.” With a sigh and crossed arms, the same words can mean “I don’t trust you.”',note:'The same words can carry opposite relationship messages. Tone and body language decide.'},
 {say:'(Silence at the dinner table, arms crossed, eyes on the plate)',nv:'No words at all',c:'Nothing is said.',r:'“I’m upset,” “I’m withdrawing,” or “Don’t ask me.” The family will still read a message.',note:'You cannot not communicate: silence and avoidance send messages too.'},
 {say:'“Fine.”',nv:'Eye roll and a flat tone',c:'Agreement, on the surface.',r:'“I disagree and I’m angry, but I won’t say so.” Words and body contradict each other.',note:'Mixed messages leave family members unsure what is expected. A congruent message aligns both channels.'}
];
let mi=0,rev=false;
function two(){const m=M[mi];$('#tw').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2>Every message has two levels</h2><div style="display:flex;gap:6px">${M.map((_,i)=>`<button class="tab" data-i="${i}" aria-selected="${i===mi}">Message ${i+1}</button>`).join('')}</div></div>
 <div class="q">${m.say}</div><p class="note"><b>Nonverbal channel:</b> ${m.nv}</p>
 <div class="layers"><div class="layer c"><h3 style="color:#3b5b8c">Content level: the information</h3><p>${m.c}</p></div>
 ${rev?`<div class="layer r"><h3 style="color:#a8353a">Relationship level: what it says about “us”</h3><p>${m.r}</p></div><div class="fb ok"><b>Takeaway:</b> ${m.note}</div>`:`<div class="layer hid"><h3>Relationship level</h3><p>What might this message say about the relationship?</p><button class="btn pri" id="rv" style="margin-top:6px">Reveal</button></div>`}</div>`;
 $$('#tw .tab').forEach(b=>b.onclick=()=>{mi=+b.dataset.i;rev=false;two()});if(!rev)$('#rv').onclick=()=>{rev=true;two()};postH()}
two();
</script></body></html>
