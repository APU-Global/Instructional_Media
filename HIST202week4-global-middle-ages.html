<script>
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function fit(){
  var app=$('.app'); if(!app) return; scaleMarks();
  var h=Math.ceil(app.getBoundingClientRect().height)+2;
  document.body.style.overflowY = (h>window.innerHeight+2)?'auto':'hidden';
  try{parent.postMessage({type:'iframe-height',height:h},'*')}catch(e){}
}
window.addEventListener('resize',fit);window.addEventListener('load',function(){fit();setTimeout(fit,300)});
function tabs(){
  var t=$$('.tab');
  function show(id){t.forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===id)});
    $$('.view').forEach(function(v){v.classList.toggle('on',v.id===id)});fit();}
  t.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.v)})});
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function scaleMarks(){
  $$('svg.map').forEach(function(svg){
    var w=svg.getBoundingClientRect().width; if(!w) return;
    var vb=svg.viewBox.baseVal; var k=vb.width/w; /* user units per CSS pixel */
    $$('.hot',svg).forEach(function(e){
      var d=e._d; var c=e.querySelectorAll('circle'); var t=e.querySelector('text');
      c[0].setAttribute('r',8*k); c[1].setAttribute('r',5.5*k); c[1].setAttribute('stroke-width',1.8*k);
      t.setAttribute('x',d.xy[0]+(d.dx||8)*k); t.setAttribute('y',d.xy[1]+(d.dy||-7)*k);
      t.style.fontSize=(11.5*k)+'px'; t.style.strokeWidth=(3*k)+'px';
    });
  });
}
function hotspots(g,data,onsel){
  var NS='http://www.w3.org/2000/svg';
  data.forEach(function(d,i){
    var e=document.createElementNS(NS,'g');e.setAttribute('class','hot');e.setAttribute('tabindex','0');e.setAttribute('role','button');e.setAttribute('aria-label',d.name);e._d=d;
    e.innerHTML='<circle class="halo" cx="'+d.xy[0]+'" cy="'+d.xy[1]+'" r="7"/><circle class="dot" cx="'+d.xy[0]+'" cy="'+d.xy[1]+'" r="5"/><text x="'+d.xy[0]+'" y="'+d.xy[1]+'" text-anchor="'+(d.anchor||'start')+'">'+esc(d.label||d.name)+'</text>';
    function go(){$$('.hot',g).forEach(function(x){x.classList.remove('sel')});e.classList.add('sel');onsel(d,i)}
    e.addEventListener('click',go);e.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go()}});
    g.appendChild(e);d._el=e;d._go=go;
  });
  scaleMarks();
}
/* generic one-at-a-time quiz */
function quiz(root,data,done){
  var i=0,score=0,locked=false;
  function draw(){
    if(i>=data.length){root.innerHTML='<div class="panel"><h2>Quiz complete: '+score+' / '+data.length+'</h2><p>'+(score===data.length?'Excellent work. You can explain the cause-and-effect chain.':'Review the explanations, then try again to lock in the connections.')+'</p><div class="row"><button class="btn primary" id="qr">Try again</button></div></div>';
      $('#qr',root).onclick=function(){i=0;score=0;draw()};fit();return}
    var d=data[i];locked=false;
    root.innerHTML='<div class="panel"><p class="hint" style="margin-top:0">Question '+(i+1)+' of '+data.length+'</p><h2>'+d.q+'</h2><div class="grid2" id="qo"></div><div class="feedback" id="qf" aria-live="polite"></div><div class="row"><button class="btn primary" id="qn" disabled>'+(i===data.length-1?'See score':'Next')+'</button><span class="score">Score: '+score+'</span></div></div>';
    var box=$('#qo',root);
    d.o.forEach(function(t,k){var b=document.createElement('button');b.className='btn opt';b.style.cssText='text-align:left;border-radius:12px;padding:8px 12px';b.textContent=t;
      b.onclick=function(){if(locked)return;locked=true;var good=k===d.a;if(good)score++;
        b.style.background=good?'#e3f4ea':'#fbe4e2';b.style.borderColor=good?'#2e7d4f':'#b3261e';
        if(!good){box.children[d.a].style.background='#e3f4ea';box.children[d.a].style.borderColor='#2e7d4f'}
        $('#qf',root).innerHTML='<span class="'+(good?'ok':'bad')+'">'+(good?'Correct. ':'Not quite. ')+'</span>'+d.why;$('#qn',root).disabled=false;fit()};
      box.appendChild(b)});
    $('#qn',root).onclick=function(){i++;draw()};fit();
  }
