<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Hero's Journey Level 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one centered 952px column on a starfield. Scene banner on top (hero walks the road toward the castle as quests finish), then one quest per screen: story, cards, short questions, yellow button. Single dark pixel-arcade look by choice, matching the Level 1 screen. */
:root{
  --bg:#0e1033; --panel:#1d2161; --panel-2:#272c7d; --line:#5562d8;
  --text:#f4f3ff; --muted:#b9bcf0; --gold:#ffd24a; --gold-dark:#c8941a;
  --pink:#ff6b9a; --teal:#3de0c0; --ink:#1a1240;
  --f-display:'Press Start 2P','Courier New',monospace;
  --f-label:'Silkscreen','Courier New',monospace;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;position:relative;overflow-x:hidden;
}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.stars i{position:absolute;border-radius:50%;background:#cfd3ff;opacity:.7;animation:tw 4s ease-in-out infinite}
.stars i.g{background:var(--gold)}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
.wrap{position:relative;z-index:1;max-width:952px;margin:0 auto}

.scene{border:4px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 0 #090a24;background:#1b1f5c}
.scene svg{display:block;width:100%;height:auto}
#hero{transition:transform .9s cubic-bezier(.45,.05,.3,1)}
.walk .bob{animation:hop .3s ease-in-out 3}
@keyframes hop{50%{transform:translateY(-7px)}}

.prog{margin:22px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.prog-l{font-family:var(--f-label);font-weight:700;font-size:13px;color:var(--teal);letter-spacing:.1em;text-transform:uppercase}
.segs{flex:1 1 220px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.segs span{height:14px;background:#12154a;border:2px solid var(--line);border-radius:3px}
.segs span.on{background:var(--gold);border-color:var(--gold-dark)}
.segs span.now{border-color:var(--gold);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{background:#3a3f95}}
.xp{font-family:var(--f-label);font-weight:700;color:var(--gold);font-size:13px;letter-spacing:.1em}

.screen{animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.eyebrow{font-family:var(--f-label);font-weight:700;color:var(--teal);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:26px 0 10px;text-align:center}
.title{font-family:var(--f-display);color:#fff;text-align:center;line-height:1.3;margin:0 0 18px;text-wrap:balance;text-shadow:3px 3px 0 var(--pink),6px 6px 0 #1a1040;font-weight:400}
.title.xl{font-size:clamp(22px,5.6vw,46px)}
.title.md{font-size:clamp(15px,3.2vw,26px);text-shadow:2px 2px 0 var(--pink),4px 4px 0 #1a1040}
.sub{font-family:var(--f-label);font-weight:700;color:var(--gold);text-align:center;font-size:clamp(14px,2.7vw,24px);letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px;text-wrap:balance}
.intro{max-width:62ch;margin:0 auto 18px;text-align:center}
.chips{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 18px;padding:0}
.chips li{font-family:var(--f-label);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:2px solid #3a43a8;border-radius:999px;padding:4px 10px;background:#161a55}
.chips li.lead{color:var(--teal);border-color:transparent;background:none;padding-inline:2px}
.note{max-width:62ch;margin:0 auto 22px;background:#151a52;border:2px dashed #4a55c8;border-radius:14px;padding:14px 18px}
.note-l{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
.note p{margin:6px 0 0}
.note .scrip{font-style:italic;font-size:18px}
.note cite{display:block;margin-top:6px;color:var(--muted);font-size:14px;font-style:normal}
.prompt{font-family:var(--f-label);font-weight:700;color:var(--gold);font-size:clamp(14px,2.4vw,18px);letter-spacing:.06em;text-transform:uppercase;text-align:center;margin:26px 0 14px;text-wrap:balance}
.tip{max-width:62ch;margin:-4px auto 16px;text-align:center;color:var(--muted);font-size:15px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;font:inherit;color:inherit;background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:16px 16px 18px;cursor:pointer;box-shadow:0 5px 0 #0c0e33;transition:transform .12s,border-color .12s,background .12s,box-shadow .12s;min-width:0}
.card:hover{transform:translateY(-3px);border-color:#8b95ff}
.card[aria-pressed="true"]{border-color:var(--gold);background:var(--panel-2);box-shadow:0 5px 0 var(--gold-dark),0 0 0 4px rgba(255,210,74,.25)}
.card .ck{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:6px;background:var(--gold);color:var(--ink);font-family:var(--f-label);font-weight:700;display:none;align-items:center;justify-content:center}
.card[aria-pressed="true"] .ck{display:flex}
.ic{width:44px;height:44px;color:var(--gold);margin-bottom:4px}
.ic .a{fill:var(--pink)}
.ic .k{fill:var(--ink)}
.ic .sk{stroke:var(--ink);stroke-width:1.5;fill:none}
.ic .sa{stroke:var(--pink);stroke-width:2;fill:none}
.ic .sg{fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round}
.c-tag{font-family:var(--f-label);font-size:11px;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
.c-name{font-family:var(--f-label);font-weight:700;font-size:18px;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;line-height:1.2}
.c-desc{font-size:15px;line-height:1.45}

.reaction{margin:20px auto 0;max-width:62ch;border-left:5px solid var(--teal);background:#12184f;border-radius:0 12px 12px 0;padding:12px 16px}
.r-l{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
.reaction p{margin:4px 0 0}
.qpanel{margin:22px 0 0;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:18px 20px 6px;box-shadow:0 6px 0 #0c0e33}
.qpanel h3{font-family:var(--f-display);font-size:13px;font-weight:400;color:var(--gold);margin:0 0 16px;line-height:1.4}
.qa{margin:0 0 20px}
.ql{display:block;font-weight:800;margin:0 0 8px}
.optl{font-weight:600;color:var(--muted);font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt-b{font:700 15px/1.2 var(--f-body);color:var(--text);background:#141852;border:2px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer;min-height:42px;text-align:left}
.opt-b:hover{border-color:#8b95ff}
.opt-b[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold-dark)}
.txt{width:100%;font:600 16px/1.45 var(--f-body);color:var(--text);background:#10134a;border:2px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;display:block}
.txt::placeholder{color:#8f94d6}
.card:focus-visible,.btn:focus-visible,.opt-b:focus-visible,.txt:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.btn{font-family:var(--f-label);font-weight:700;font-size:clamp(16px,3.4vw,20px);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--gold);border:0;border-radius:12px;padding:16px 28px;cursor:pointer;box-shadow:0 6px 0 var(--gold-dark);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-dark)}
.btn[disabled]{background:#5a5f9e;color:#d4d6f7;box-shadow:0 6px 0 #3d4175;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--text);border:3px solid var(--line);box-shadow:none;padding:13px 22px}
.nav{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;margin:30px 0 10px}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:0}
.small{color:var(--muted);font-size:14px}

.how{margin:30px 0 0;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:20px 24px}
.how h2{font-family:var(--f-display);font-size:13px;font-weight:400;color:var(--gold);margin:0 0 14px}
.how ol{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:12px}
.how li{display:flex;gap:14px;align-items:center}
.how .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:var(--f-label);font-weight:700;display:flex;align-items:center;justify-content:center}

.big{font-size:clamp(24px,6vw,48px)}
.starsrow{font-family:var(--f-display);color:var(--gold);text-align:center;font-size:clamp(22px,5vw,34px);letter-spacing:.3em;margin:0 0 14px;text-shadow:3px 3px 0 #7a5a10}
.story{max-width:780px;margin:24px auto 0;background:var(--panel);border:3px solid var(--gold);border-radius:18px;padding:20px 22px 8px;box-shadow:0 6px 0 #0c0e33}
.story h3{font-family:var(--f-display);font-size:14px;font-weight:400;color:var(--gold);margin:0 0 10px}
.sr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 18px;padding:12px 0;border-top:2px dashed #3d47ad}
.sl{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--teal);text-transform:uppercase;padding-top:2px}
.sv p{margin:0 0 4px;overflow-wrap:anywhere;user-select:text}
.sv p.first{font-weight:800;color:#fff}
.finale-actions{justify-content:center}
.next{max-width:780px;margin:28px auto 0;background:linear-gradient(135deg,#2a2478,#3b2a88);border:3px solid var(--pink);border-radius:18px;padding:18px 22px;text-align:center;box-shadow:0 6px 0 #0c0e33}
.next .eyebrow{margin:0 0 8px;color:var(--pink)}
.next p{margin:0 0 6px;font-size:19px}
.next strong{color:var(--gold)}

@media (max-width:560px){
  .sr{grid-template-columns:minmax(0,1fr)}
  .how{padding:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

    {id:'skills',title:'Your Strengths Quest',

     intro:`Think about your CliftonStrengths Top 5. Which kind of hero do you tend to be? Then turn that strength into a goal for succeeding in college.`,
     note:{label:'A thought for the road',text:`Strengths are gifts to steward, not just traits to admire.`},
     prompt:'Which hero class fits you best right now?',
     cards:[
      {id:'builder',icon:'hammer',tag:'Executing',name:'The Builder',desc:`I turn plans into progress and finish what I start.`,react:`Builders keep a quest moving. Teams and families lean on people who get things done.`},
      {id:'messenger',icon:'horn',tag:'Influencing',name:'The Messenger',desc:`I speak up, motivate people, and help others take action.`,react:`Messengers give a journey its voice. Your words can move people toward something good.`},
      {id:'guardian',icon:'shield',tag:'Relationship Building',name:'The Guardian',desc:`I build trust and help people stay together through hard things.`,react:`Guardians make a group feel safe enough to try hard things. That is rare and valuable.`},
      {id:'seer',icon:'eye',tag:'Strategic Thinking',name:'The Seer',desc:`I spot patterns, weigh options, and see what's possible.`,react:`Seers help others avoid wrong turns. The world needs people who think before the road forks.`}
     ],
     questions:[
      {id:'goal',type:'text',required:true,min:15,max:240,rows:3,label:'My strengths goal: how will you use one of your strengths, or a skill from this course, to succeed in college?',placeholder:'To succeed in my courses, I will use my strength of ___ to...'},
      {id:'reflect',type:'text',required:true,min:10,max:240,rows:3,label:'Self-reflection: where have you already seen this strength help you?',placeholder:`I've seen it show up when...`}
     ]},

    {id:'alliance',title:'Your Alliance Quest',
     skills:['Support networks (CLO 5)','Academic resilience'],
     intro:`No hero finishes the journey alone. Pick the ally you most want to add to your team, then write a goal for building your alliance.`,
     note:{label:'A thought for the road',text:`You were never meant to do this alone. Two are better than one.`,ref:'Ecclesiastes 4:9-10'},
     prompt:'Who do you most want to add to your alliance?',
     cards:[
      {id:'coach',icon:'compass',tag:'Guide',name:'My Success Coach',desc:`Someone to help me plan and stay on track.`,react:`A coach can help you spot problems early. Reaching out first makes everything easier.`},
      {id:'faculty',icon:'scroll',tag:'Mentor',name:'Instructors and Deans',desc:`People who can teach, advise, and open doors.`,react:`Instructors remember students who show up and ask good questions.`},
      {id:'peers',icon:'heart',tag:'Companion',name:'My Classmates',desc:`Peers who understand the journey because they're on it too.`,react:`Classmates are your fellow travelers. Encouragement goes both ways.`},
      {id:'home',icon:'house',tag:'Home team',name:'Family, Friends, and Community',desc:`The people who cheer me on and keep me grounded.`,react:`Your home team matters. Letting them in on your goals helps them help you.`}
     ],
     questions:[
      {id:'goal',type:'text',required:true,min:15,max:240,rows:3,label:'My alliance goal: write one goal for building your support network.',placeholder:'This term, I will connect with ___ by ___ so that...'},
      {id:'reflect',type:'text',required:true,min:10,max:240,rows:3,label:'Self-reflection: what makes it hard to ask for help, and what could make it easier?',placeholder:`It's hard for me to ask because...`}
     ]},

    {id:'faith',title:'Your Calling Quest',
     skills:['Faith and vocation (CLO 1)','Purpose and planning (CLO 3)'],
     intro:`Some people see their work and education as a calling, part of something larger than themselves. You may or may not use that word, and that's okay. Choose the connection that feels most true, then write a goal around it.`,
     note:{label:'Scripture',scrip:true,text:`"You make known to me the path of life; you will fill me with joy in your presence, with eternal pleasures at your right hand."`,ref:'Psalm 16:11 (NIV)'},
     prompt:'Where does your story connect to something bigger?',
     cards:[
      {id:'serve',icon:'heart',tag:'Service',name:'Serve Others',desc:`My work can meet real needs and make life better for people.`,react:`Serving others turns a career into a contribution.`},
      {id:'steward',icon:'key',tag:'Stewardship',name:'Steward My Gifts',desc:`I want to use my strengths and time faithfully and well.`,react:`Faithful use of what we've been given is a beautiful way to measure success.`},
      {id:'values',icon:'scroll',tag:'Integrity',name:'Live My Values',desc:`I want my work to reflect my faith and what I believe.`,react:`Working with integrity makes ordinary days matter.`},
      {id:'listen',icon:'lantern',tag:'Discerning',name:'Still Listening',desc:`I'm still discerning, and I'm willing to be patient.`,react:`Listening takes patience. The next step often becomes clear as you walk.`}
     ],
     questions:[
      {id:'goal',type:'text',required:true,min:15,max:240,rows:3,label:'My faith and purpose goal: connect your faith, values, or sense of purpose to your work or education.',placeholder:'I will live out my faith or values in my work and studies by...'},
      {id:'reflect',type:'text',required:true,min:10,max:240,rows:3,label:'Self-reflection: what do you hope your life and work make possible for others?',placeholder:'I hope my story helps others...'}
     ]},

    {id:'story',title:'Write Your Story',
     skills:['Your plan for success (CLO 3)','Stewardship (CLO 1)'],
     intro:`You've set goals for your career, strengths, alliance, and calling. Now bring them together. First, how do you feel about the road ahead?`,
     prompt:'How do you feel about the road ahead?',
     cards:[
      {id:'ready',icon:'flame',tag:'Fired up',name:'Ready to Run',desc:`I'm motivated and eager to get going.`,react:`Hold on to that energy. Write down your why so you can find it again on harder days.`},
      {id:'hopeful',icon:'sprout',tag:'Growing',name:'Hopeful',desc:`I'm optimistic, even if parts are still unclear.`,react:`Hope is a strong starting point. It grows as you take small steps.`},
      {id:'nervous',icon:'shield',tag:'Honest',name:'A Little Nervous',desc:`I have some worries, and that's okay.`,react:`Courage isn't the absence of fear. It's taking the next step anyway, with your alliance beside you.`},
      {id:'curious',icon:'magnifier',tag:'Exploring',name:'Curious',desc:`I want to see what I'll discover along the way.`,react:`Curiosity is a great compass. Keep asking questions and keep walking.`}
     ],
     questions:[
      {id:'story',type:'text',required:true,min:15,max:240,rows:3,label:'Pull it together: finish this sentence about your story.',placeholder:'I am becoming ___ so that ___.'},
      {id:'challenge',type:'text',required:true,min:10,max:240,rows:3,label:'Self-reflection: what challenge could get in the way, and who or what will help you through it?',placeholder:'My biggest challenge may be ___. I will lean on ___.'},
      {id:'step',type:'text',required:true,min:8,max:200,rows:2,label:'My first step: what is one thing you will do this week?',placeholder:'This week, I will...'}
     ]}
  ];

  var POS=[[150,286],[290,291],[430,291],[570,292],[680,286],[735,281]];

  /* ---------- state + helpers ---------- */
  var state={step:0,pick:{},ans:{}};
  var stage=document.getElementById('stage');
  var hero=document.getElementById('hero');
  function el(t,c){var e=document.createElement(t);if(c)e.className=c;return e;}
  function rng(s){return function(){s=(s*16807)%2147483647;return s/2147483647;};}
  function key(q,k){return q+'.'+k;}
  function card(qid){var q=Q.filter(function(x){return x.id===qid;})[0];return q.cards.filter(function(c){return c.id===state.pick[qid];})[0];}
  function a(qid,k){return (state.ans[key(qid,k)]||'').trim();}

  /* backdrop stars */
  (function(){
    var host=document.getElementById('stars'),r=rng(7),i,e,s;
    for(i=0;i<90;i++){
      e=document.createElement('i');s=r()<.2?3:2;
      e.style.left=(r()*100)+'%';e.style.top=(r()*100)+'%';
      e.style.width=e.style.height=s+'px';e.style.animationDelay=(r()*4)+'s';
      if(r()<.15)e.className='g';
      host.appendChild(e);
    }
    var sg=document.getElementById('sceneStars'),r2=rng(21),c;
    for(i=0;i<46;i++){
      c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',(r2()*952).toFixed(0));c.setAttribute('cy',(r2()*170).toFixed(0));
      c.setAttribute('r',r2()<.2?2:1.3);c.setAttribute('fill','#fff');c.setAttribute('opacity',(.45+r2()*.5).toFixed(2));
      sg.appendChild(c);
    }
    var segs=document.getElementById('segs');
    for(i=0;i<Q.length;i++)segs.appendChild(document.createElement('span'));
    segs.style.gridTemplateColumns='repeat('+Q.length+',1fr)';
  })();

  function placeHero(n){
    var p=POS[Math.min(n,POS.length-1)];
    hero.style.transform='translate('+p[0]+'px,'+p[1]+'px)';
    hero.classList.add('walk');
    setTimeout(function(){hero.classList.remove('walk');},1000);
  }

  function updateProgress(){
    var s=state.step,done=s===0?0:Math.min(s-1,Q.length);
    if(s===Q.length+1)done=Q.length;
    var prog=document.getElementById('prog');
    prog.hidden=(s===0);
    var spans=document.getElementById('segs').children;
    for(var i=0;i<spans.length;i++){
      spans[i].className=i<done?'on':(i===done&&s>0&&s<=Q.length?'now':'');
    }
    document.getElementById('progL').textContent=s>Q.length?'Level 7 complete':'Quest '+s+' of '+Q.length;
    document.getElementById('xp').textContent='XP '+(done*100);
    placeHero(done);
  }

  function go(step){
    state.step=step;
    if(step===0)stage.innerHTML=startHTML();
    else if(step<=Q.length)renderQuest(step-1);
    else renderFinale();
    updateProgress();
    wire();
    try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){}
  }

  /* ---------- screens ---------- */
  function startHTML(){
    return '<section class="screen">'+
      '<p class="eyebrow">ISTU 101</p>'+
      '<h1 class="title xl">HERO\'S JOURNEY</h1>'+
      '<p class="sub">Level 7: What Will Define My Story?</p>'+
      '<p class="intro">Every hero reaches a crossroads. Write the goals that will shape your story.</p>'+
      '<div class="nav"><button class="btn" id="startBtn" type="button"><span aria-hidden="true">&#9654;</span> Press Start</button></div>'+
      '<div class="how"><h2>How to play</h2><ol>'+
        '<li><span class="n">1</span><span>Tap or click a card to make your choice.</span></li>'+
        '<li><span class="n">2</span><span>Answer a few short questions about your choice.</span></li>'+
        '<li><span class="n">3</span><span>Press the yellow button to keep going.</span></li>'+
      '</ol><p class="small">Five short quests, about 10 to 15 minutes. You will write your own goals, so there are no wrong answers.</p></div>'+
    '</section>';
  }

  function renderQuest(i){
    var q=Q[i],h='';
    h+='<section class="screen" aria-labelledby="qt">';
    h+='<p class="eyebrow">Level 7 &middot; Quest '+(i+1)+' of '+Q.length+'</p>';
    h+='<h2 class="title md" id="qt">'+q.title+'</h2>';
    h+='<ul class="chips"><li class="lead">Practicing</li>'+q.skills.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>';
    h+='<p class="intro">'+q.intro+'</p>';
    if(q.note){
      h+='<aside class="note"><span class="note-l">'+q.note.label+'</span><p'+(q.note.scrip?' class="scrip"':'')+'>'+q.note.text+'</p>'+(q.note.ref?'<cite>'+q.note.ref+'</cite>':'')+'</aside>';
    }
    h+='<h3 class="prompt">'+q.prompt+'</h3>';
    if(q.tip)h+='<p class="tip">'+q.tip+'</p>';
    h+='<div class="cards" role="group" aria-label="'+q.prompt+'">';
    q.cards.forEach(function(c){
      h+='<button type="button" class="card" data-card="'+c.id+'" aria-pressed="false">'+
        '<span class="ck" aria-hidden="true">&#10003;</span>'+icon(c.icon)+
        '<span class="c-tag">'+c.tag+'</span><span class="c-name">'+c.name+'</span><span class="c-desc">'+c.desc+'</span></button>';
    });
    h+='</div>';
    h+='<div class="reaction" id="react" aria-live="polite" hidden></div>';
    h+='<div class="qpanel" id="qpanel" hidden><h3>Write it out</h3>';
    q.questions.forEach(function(x){
      h+='<div class="qa">';
      var opt=x.required?'':' <span class="optl">(optional)</span>';
      if(x.type==='choice'){
        h+='<div class="ql" id="l-'+x.id+'">'+x.label+opt+'</div><div class="opts" role="group" aria-labelledby="l-'+x.id+'">';
        x.options.forEach(function(o){h+='<button type="button" class="opt-b" data-q="'+x.id+'" data-v="'+o+'" aria-pressed="false">'+o+'</button>';});
        h+='</div>';
      }else{
        h+='<label class="ql" for="f-'+x.id+'">'+x.label+opt+'</label><textarea class="txt" id="f-'+x.id+'" data-q="'+x.id+'" rows="'+(x.rows||3)+'" maxlength="'+(x.max||160)+'" placeholder="'+x.placeholder+'"></textarea>';
      }
      h+='</div>';
    });
    h+='</div>';
    h+='<div class="nav"><button type="button" class="btn ghost" id="backBtn">&#9664; Back</button>'+
       '<button type="button" class="btn" id="nextBtn" disabled>'+(i===Q.length-1?'Finish Level 7':'Continue')+' &#9654;</button></div>';
    h+='<p class="hint" id="hint"></p>';
    h+='</section>';
    stage.innerHTML=h;
  }

  function storyRows(){
    function f(arr){return arr.filter(Boolean);}
    function area(id,label){return [label,f([card(id).name,'Goal: '+a(id,'goal'),'Reflection: '+a(id,'reflect')])];}
    return [
      area('career','My Career Goal'),
      area('skills','My Strengths Goal'),
      area('alliance','My Alliance Goal'),
      area('faith','My Faith and Purpose Goal'),
      ['My Story',f([a('story','story'),'Challenge and help: '+a('story','challenge'),'First step: '+a('story','step'),'Feeling about the road ahead: '+card('story').name])]
    ];
  }

  function renderFinale(){
    stage.innerHTML='<section class="screen" aria-labelledby="ft">'+
      '<p class="eyebrow">ISTU 101</p>'+
      '<h2 class="title xl big" id="ft">LEVEL 7 COMPLETE</h2>'+
      '<p class="sub">You\'ve chosen your next chapter</p>'+
      '<p class="starsrow" aria-hidden="true">&#9733; &#9733; &#9733;</p>'+
      '<p class="intro">Great work, hero. You wrote goals for your career, strengths, alliance, and calling, then tied them together in your own story. Here is your Story Card. Copy it and keep it handy.</p>'+
      '<article class="story"><h3>My Story Card</h3><div id="storyRows"></div></article>'+
      '<div class="nav finale-actions"><button type="button" class="btn" id="copyBtn">Copy My Story Card</button><button type="button" class="btn ghost" id="againBtn">Play Again</button></div>'+
      '<p class="hint" id="copyMsg" aria-live="polite"></p>'+
      '<aside class="next"><p class="eyebrow">Next quest</p>'+
        '<p>You will use what you learned and put it into the assignment titled <strong>“Level Up Project.”</strong></p>'+
        '<p class="small">Your goals and reflections here are your starting material.</p></aside>'+
    '</section>';
    var rows=storyRows(),box=document.getElementById('storyRows');
    rows.forEach(function(r){
      var row=el('div','sr'),l=el('div','sl'),v=el('div','sv');
      l.textContent=r[0];
      r[1].forEach(function(t,i){var p=el('p',i===0?'first':'');p.textContent=t;v.appendChild(p);});
      row.appendChild(l);row.appendChild(v);box.appendChild(row);
    });
    var text='MY STORY CARD - ISTU 101, Level 7: What Will Define My Story?\n\n'+rows.map(function(r){
      return r[0].toUpperCase()+'\n'+r[1].map(function(t){return '- '+t;}).join('\n');
    }).join('\n\n');
    var btn=document.getElementById('copyBtn'),msg=document.getElementById('copyMsg');
    btn.addEventListener('click',function(){
      function done(ok){msg.textContent=ok?'Copied. Paste it into a document to keep it.':'Copy did not work here. Select the card text above and copy it by hand.';}
      function fallback(){
        var ok=false;
        try{var t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove();}catch(e){}
        done(ok);
      }
      try{
        navigator.clipboard.writeText(text).then(function(){done(true);},fallback);
      }catch(e){fallback();}
    });
    document.getElementById('againBtn').addEventListener('click',function(){state={step:0,pick:{},ans:{}};go(0);});
  }

  /* ---------- interaction ---------- */
  function wire(){
    var s=state.step;
    if(s===0){document.getElementById('startBtn').addEventListener('click',function(){go(1);});return;}
    if(s>Q.length)return;
    var q=Q[s-1],cards=stage.querySelectorAll('.card'),react=document.getElementById('react'),panel=document.getElementById('qpanel');
    var next=document.getElementById('nextBtn'),hint=document.getElementById('hint');

    function ready(){
      if(!state.pick[q.id])return false;
      return q.questions.every(function(x){
        if(!x.required)return true;
        var v=a(q.id,x.id);
        return x.type==='choice'?v.length>0:v.length>=(x.min||1);
      });
    }
    function refresh(){
      var ok=ready();
      next.disabled=!ok;
      hint.textContent=ok?'':(state.pick[q.id]?'Write your answers above to keep going.':'Choose a card to begin.');
    }
    function showPick(reveal){
      var id=state.pick[q.id];
      Array.prototype.forEach.call(cards,function(b){b.setAttribute('aria-pressed',b.getAttribute('data-card')===id?'true':'false');});
      var c=card(q.id);
      if(!c)return;
      react.innerHTML='<span class="r-l">Traveler\'s note</span><p></p>';
      react.querySelector('p').textContent=c.react+(q.extra?' '+q.extra:'');
      react.hidden=false;
      var wasHidden=panel.hidden;
      panel.hidden=false;
      if(reveal&&wasHidden){
        var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        try{panel.scrollIntoView({behavior:rm?'auto':'smooth',block:'nearest'});}catch(e){}
      }
    }
    Array.prototype.forEach.call(cards,function(b){
      b.addEventListener('click',function(){state.pick[q.id]=b.getAttribute('data-card');showPick(true);refresh();});
    });
    Array.prototype.forEach.call(stage.querySelectorAll('.opt-b'),function(b){
      var k=key(q.id,b.getAttribute('data-q'));
      if(state.ans[k]===b.getAttribute('data-v'))b.setAttribute('aria-pressed','true');
      b.addEventListener('click',function(){
        state.ans[k]=b.getAttribute('data-v');
        Array.prototype.forEach.call(stage.querySelectorAll('.opt-b[data-q="'+b.getAttribute('data-q')+'"]'),function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});
        refresh();
      });
    });
    Array.prototype.forEach.call(stage.querySelectorAll('.txt'),function(t){
      var k=key(q.id,t.getAttribute('data-q'));
      t.value=state.ans[k]||'';
      t.addEventListener('input',function(){state.ans[k]=t.value;refresh();});
    });
    document.getElementById('backBtn').addEventListener('click',function(){go(s-1);});
    next.addEventListener('click',function(){if(!next.disabled)go(s+1);});
    if(state.pick[q.id])showPick(false);
    refresh();
  }

  go(0);
})();
</script>

</body></html>
