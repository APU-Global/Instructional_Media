<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSYC 430 Cultural Psychology - Week 3 Culture Iceberg Interview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--s:1;--ink:#1d2433;--ink2:#4d576d;--line:#d6dcea;--wash:#f1f4fa;--red:#c8333f;--redd:#a3262f;--gold:#f2b84b;--plum:#5b3f8c;--teal:#0f7a7a;--ok:#1b7248;--okbg:#e5f4ec;--warn:#8a5200;--warnbg:#fff2dc;--bad:#a3262f;--badbg:#fbe8ea}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(16px*var(--s));height:100%;overflow:hidden}
body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:.95rem;line-height:1.38}
h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;margin:0;line-height:1.12;letter-spacing:-.01em}
p{margin:0}
.app{height:100%;display:flex;flex-direction:column;gap:.6rem;padding:.7rem .9rem .8rem}
.top{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;border-bottom:3px solid var(--red);padding-bottom:.5rem}
.top h1{font-size:1.5rem;font-weight:800}
.top .wk{font-size:.82rem;color:var(--ink2);margin-top:.15rem}
.top .tag{font-size:.78rem;color:var(--ink2);text-align:right;white-space:nowrap}
.stage{flex:1;min-height:0;display:grid;gap:.9rem}
.card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:.85rem 1rem;min-height:0;display:flex;flex-direction:column;gap:.55rem}
.btn{border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:700;padding:.55rem 1rem;min-height:2.4rem;transition:background .15s}
.btn:hover{background:var(--redd)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.ghost:hover{background:var(--wash)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.note{font-size:.8rem;color:var(--ink2)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fb{border-left:5px solid var(--ink2);background:var(--wash);border-radius:0 10px 10px 0;padding:.5rem .75rem;font-size:.9rem}
.fb.good{border-color:var(--ok);background:var(--okbg)}
.fb.try{border-color:var(--warn);background:var(--warnbg)}
.fb b{display:block;margin-bottom:.1rem}
@media (max-width:640px){.top .tag{display:none}.top h1{font-size:1.25rem}.app{padding:.55rem .6rem .6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.stage{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr)}
.sea{min-height:0;min-width:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b2f4f}
.sea svg{width:100%;height:100%;display:block}
#sub{transition:transform .9s cubic-bezier(.5,0,.2,1)}
.band{fill:#0b2f4f;fill-opacity:.62;transition:fill .7s,fill-opacity .7s}
.band.on{fill-opacity:1}
.band.on.b1{fill:#e3f4fb}.band.on.b2{fill:#c3e4f2}.band.on.b3{fill:#9fd0e8}.band.on.b4{fill:#7bbad9}
.q-mark{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;fill:#9fc4dc;fill-opacity:.8;text-anchor:middle;transition:opacity .4s}
.lbl{font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-weight:700;font-size:14.5px;fill:#10304a;text-anchor:middle;opacity:0;transition:opacity .6s .25s}
.band.on ~ .lbl-for{opacity:1}
.tipl{font-size:13px;fill:#1d2433;font-weight:700}
.cap{font-size:12.5px;fill:#32506a}
.beam{transition:opacity .5s}
.iv h2{font-size:1.2rem}
.meta{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.pills{display:flex;gap:.25rem}
.pill{width:1.5rem;height:.42rem;border-radius:99px;background:var(--line)}
.pill.done{background:var(--teal)}.pill.now{background:var(--red)}
.topic{font-weight:700;color:var(--teal);font-size:.9rem}
.ctx{color:var(--ink2);font-size:.88rem}
.opts{display:flex;flex-direction:column;gap:.45rem}
.opt{text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:.55rem .75rem;line-height:1.3;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--ink);background:var(--wash)}
.opt.ok{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.no{border-color:var(--warn);background:var(--warnbg);color:var(--ink2)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.take{display:grid;gap:.4rem;margin:0;padding:0;list-style:none}
.take li{display:grid;grid-template-columns:1.1rem 1fr;gap:.45rem;font-size:.9rem}
.take li:before{content:"";width:.7rem;height:.7rem;margin-top:.3rem;border-radius:50%;background:var(--teal)}
.score{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.05rem}
@media (min-width:701px){.iv h2{font-size:1.4rem}.opt{font-size:1.02rem;padding:.7rem .9rem}.iv .fb{font-size:.97rem}.iv{gap:.7rem}}
@media (max-width:700px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,31%) minmax(0,1fr);gap:.5rem}
  .card{padding:.6rem .7rem;gap:.4rem}
  .opt{padding:.45rem .6rem;font-size:.88rem}
  .fb{font-size:.84rem}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Culture Iceberg Interview</h1>
      <div class="wk">Week 3 &middot; Cognition and Intelligence</div>
    </div>
    <div class="tag">PSYC 430<br>Cultural Psychology</div>
  </header>
  <main class="stage">
    <div class="sea">
      <svg id="ice" viewBox="0 0 400 540" preserveAspectRatio="xMidYMid meet" role="img" aria-label="An iceberg. Only a small tip shows above the waterline; most of it lies below. A small submarine dives down the left side as you ask better questions.">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9f7"/><stop offset="1" stop-color="#f4fbff"/></linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a93b4"/><stop offset=".45" stop-color="#14688d"/><stop offset="1" stop-color="#0b2f4f"/></linearGradient>
          <clipPath id="body"><path d="M96 150 L284 150 L316 214 L322 296 L296 384 L244 458 L184 496 L122 462 L70 386 L44 298 L56 214 Z" transform="translate(40 0)"/></clipPath>
        </defs>
        <rect x="-1500" y="-1500" width="3400" height="1650" fill="url(#sky)"/>
        <rect x="-1500" y="150" width="3400" height="390" fill="url(#sea)"/><rect x="-1500" y="540" width="3400" height="1500" fill="#0b2f4f"/>
        <circle cx="352" cy="38" r="15" fill="#fff6c9"/>
        <text class="cap" x="12" y="30">What you can see</text>
        <!-- underwater body -->
        <path d="M96 150 L284 150 L316 214 L322 296 L296 384 L244 458 L184 496 L122 462 L70 386 L44 298 L56 214 Z" transform="translate(40 0)" fill="#0b2f4f" fill-opacity=".5"/>
        <g clip-path="url(#body)">
          <rect class="band b1" id="band1" x="0" y="150" width="400" height="65"/>
          <rect class="band b2" id="band2" x="0" y="215" width="400" height="80"/>
          <rect class="band b3" id="band3" x="0" y="295" width="400" height="80"/>
          <rect class="band b4" id="band4" x="0" y="375" width="400" height="130"/>
        </g>
        <g id="qs">
          <text class="q-mark" id="qm1" x="230" y="192">?</text>
          <text class="q-mark" id="qm2" x="230" y="265">?</text>
          <text class="q-mark" id="qm3" x="230" y="345">?</text>
          <text class="q-mark" id="qm4" x="230" y="440">?</text>
        </g>
        <g id="lbls">
          <text class="lbl" id="l1" x="230" y="186">Everyday ideas of<tspan x="230" dy="17">smart and wise</tspan></text>
          <text class="lbl" id="l2" x="230" y="258">How children are<tspan x="230" dy="17">taught and praised</tspan></text>
          <text class="lbl" id="l3" x="230" y="338">What tests capture<tspan x="230" dy="17">and what they miss</tspan></text>
          <text class="lbl" id="l4" x="230" y="428">Beliefs behind how<tspan x="230" dy="17">people are treated</tspan><tspan x="230" dy="17" font-size="12" font-weight="400">(the deepest layer)</tspan></text>
        </g>
        <!-- tip above water -->
        <path d="M126 150 L152 112 L170 124 L205 72 L238 118 L252 104 L274 150 Z" transform="translate(40 0)" fill="#fff" stroke="#b5d3e6" stroke-width="2" stroke-linejoin="round"/>
        <path d="M205 72 L222 116 L238 118 Z" transform="translate(40 0)" fill="#e2f0f8"/>
        <text class="tipl" x="326" y="84">Food</text><text class="tipl" x="326" y="102">Dress</text><text class="tipl" x="326" y="120">Music</text><text class="tipl" x="326" y="138">Holidays</text>
        <!-- waterline -->
        <path d="M-400 150 h400 M0 150 q12 -6 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 h500" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2.5"/>
        <!-- submarine -->
        <g id="sub" style="transform:translate(40px,140px)">
          <polygon class="beam" id="beam" points="30,-2 66,-22 66,24" fill="#fff6c9" opacity="0"/>
          <path d="M-30 0 l-10 -8 v16 z" fill="#c8333f" stroke="#1d2433" stroke-width="2" stroke-linejoin="round"/>
          <ellipse cx="0" cy="0" rx="30" ry="14" fill="#f2b84b" stroke="#1d2433" stroke-width="2"/>
          <rect x="-9" y="-25" width="18" height="13" rx="4" fill="#f2b84b" stroke="#1d2433" stroke-width="2"/>
          <path d="M0 -25 v-8 h9" fill="none" stroke="#1d2433" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="0" r="5.5" fill="#fff" stroke="#1d2433" stroke-width="2"/>
          <circle cx="-6" cy="0" r="4" fill="#fff" stroke="#1d2433" stroke-width="2"/>
        </g>
      </svg>
    </div>
    <section class="card iv" id="card" aria-live="polite"></section>
  </main>
</div>

<script>
var ROUNDS=[
 {topic:'Before you begin',prompt:'Your interviewee has arrived and the room is quiet. What do you do first?',y:140,
  o:[{t:'Start recording so you capture everything she says.',h:'Recording without permission',f:'Recording before you ask breaks trust and professional ethics. Permission always comes first.'},
     {t:'Explain the purpose of the interview, ask permission to record, and record her approval.',ok:1,f:'Consent comes first. Asking, and recording that she said yes, protects her and follows the APA and AACC ethical codes.'},
     {t:'Take notes quietly and mention the recording at the end.',h:'Permission after the fact',f:'Consent has to come before you collect anything, not after.'}]},
 {topic:'The waterline',prompt:'Time to open the topic of intelligence. Which question goes beneath the surface?',y:182,
  o:[{t:'In your community, how would people describe someone who is smart or wise?',ok:1,f:'Open-ended and neutral. She defines intelligence in her own terms, which fits Sternberg\u2019s point that intelligence is defined by the culture in which it exists.'},
     {t:'What foods and holidays matter most in your community?',h:'Stays above the waterline',f:'Friendly, but food and holidays are the visible tip. They do not tell you what her community means by \u201csmart.\u201d'},
     {t:'In your culture, isn\u2019t being smart mostly about doing well in school?',h:'Leading question',f:'You have put your own assumption in her mouth. Ask without presuming the answer.'}]},
 {topic:'Learning and upbringing',prompt:'Next, find out how children learn what counts as capable.',y:255,
  o:[{t:'Do children in your community go to school?',h:'Closed question',f:'A yes or no gives you a fact but no meaning. Invite a story instead.'},
     {t:'Don\u2019t children there fall behind because of fewer opportunities?',h:'Judgmental question',f:'It assumes a deficit and invites her to defend her community. Stay curious, not corrective.'},
     {t:'Tell me about a time a young person in your family was praised for being capable. What did they do?',ok:1,f:'A story shows what behavior her community notices and rewards, which is a window into values.'}]},
 {topic:'Tests and bias',prompt:'Now explore how formal assessment fits her community\u2019s view of intelligence.',y:335,
  o:[{t:'Experts say IQ tests are objective, so do you agree they are fair?',h:'Leading question',f:'It signals the answer you expect. Leave room for her to say what a test might miss.'},
     {t:'If a standard test were used in your community, what do you think it would capture well, and what might it miss?',ok:1,f:'Open and respectful. It shows how cultural bias could creep into intake, assessment, and treatment plans without accusing anyone.'},
     {t:'Have you ever taken an intelligence test?',h:'Closed question',f:'It collects a fact but gives her no space to explain what she thinks about it.'}]},
 {topic:'The deepest layer',prompt:'Last, reach the beliefs underneath: how people are treated based on how they are seen.',y:438,
  o:[{t:'How does your community treat someone seen as especially gifted, or someone who struggles to learn? What beliefs sit behind that?',ok:1,f:'It asks about both ends and about the beliefs behind the behavior. A culture shapes how people with different levels of intelligence are treated, and this lets her explain why.'},
     {t:'Why does your community treat people that way? It seems unfair.',h:'Judgmental question',f:'Calling it unfair ends the conversation. Refrain from judgment.'},
     {t:'Are there support services for people who struggle to learn?',h:'Closed question',f:'Useful later, but it stays at the level of services rather than beliefs.'}]}
];
var card=document.getElementById('card'), r=-1, tried={}, firstTry=0, mistakes=0, answered=false;
function sub(y){var s=document.getElementById('sub');s.style.transform='translate(40px,'+y+'px)';
  document.getElementById('beam').setAttribute('opacity',y>150?'1':'0')}
function reveal(n){var b=document.getElementById('band'+n);if(b)b.classList.add('on');
  var q=document.getElementById('qm'+n);if(q)q.style.opacity=0;var l=document.getElementById('l'+n);if(l)l.style.opacity=1}
function resetSea(){for(var i=1;i<=4;i++){document.getElementById('band'+i).classList.remove('on');document.getElementById('qm'+i).style.opacity=1;document.getElementById('l'+i).style.opacity=0}sub(140)}
function pills(){var h='<div class="pills" aria-hidden="true">';for(var i=0;i<ROUNDS.length;i++)h+='<span class="pill '+(i<r?'done':(i===r?'now':''))+'"></span>';return h+'</div>'}
function intro(){
  r=-1;card.innerHTML='<h2>Interview a cultural expert</h2>'+
   '<p>A community elder has agreed to talk with you about how her community thinks about intelligence. This is practice for this week\u2019s Interview With Cultural Expert.</p>'+
   '<p>Culture works like an iceberg. Food and dress are easy to see, while values and beliefs sit below the surface. At each round, choose the question that takes your submarine deeper.</p>'+
   '<div class="row"><button class="btn" id="go">Start the dive</button></div>'+
   '<p class="note" style="margin-top:auto">The elder is a fictional example. Communities and the people in them vary, so treat every answer as one person\u2019s view.</p>';
  card.querySelector('#go').onclick=function(){round(0)};resetSea();fit()}
function round(i){
  r=i;answered=false;var R=ROUNDS[i];sub(R.y);
  var h='<div class="meta">'+pills()+'<span class="topic">Round '+(i+1)+' of '+ROUNDS.length+': '+R.topic+'</span></div>'+
   '<h2>'+R.prompt+'</h2><div class="opts" role="group" aria-label="Choose your question">'+
   R.o.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+o.t+'</button>'}).join('')+'</div><div id="fbwrap"></div><div class="row" id="act" style="margin-top:auto"></div>';
  card.innerHTML=h;
  card.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){choose(+b.dataset.k,b)}});
  fit();
}
function choose(k,btn){
  if(answered)return;var R=ROUNDS[r],o=R.o[k],w=card.querySelector('#fbwrap');
  if(o.ok){
    answered=true;if(!tried[r])firstTry++;
    card.querySelectorAll('.opt').forEach(function(b,j){b.disabled=true;if(j===k)b.classList.add('ok');else if(!b.classList.contains('no'))b.classList.add('dim')});
    w.innerHTML='<div class="fb good"><b>Good question</b>'+o.f+'</div>';
    if(r>0)reveal(r);
    var last=r===ROUNDS.length-1;
    card.querySelector('#act').innerHTML='<button class="btn" id="nx">'+(last?'Surface and review':'Dive deeper')+'</button>';
    card.querySelector('#nx').onclick=function(){last?finish():round(r+1)};
    card.querySelector('#nx').focus();
  } else {
    tried[r]=1;btn.disabled=true;btn.classList.add('no');
    w.innerHTML='<div class="fb try"><b>'+o.h+'</b>'+o.f+' Try another question.</div>';
  }
  fit();
}
function finish(){
  reveal(1);reveal(2);reveal(3);reveal(4);sub(438);document.getElementById('beam').setAttribute('opacity','0');r=ROUNDS.length;
  card.innerHTML='<h2>You reached the deepest layer</h2>'+
   '<p class="score">'+firstTry+' of '+ROUNDS.length+' best questions on your first try</p>'+
   '<ul class="take">'+
   '<li><span><b>Ask permission first.</b> Record approval before you collect anything.</span></li>'+
   '<li><span><b>Choose open over closed.</b> Stories and \u201chow\u201d questions reveal meaning that yes or no cannot.</span></li>'+
   '<li><span><b>Stay neutral.</b> Leading and judgmental questions put your culture\u2019s assumptions into the conversation.</span></li>'+
   '<li><span><b>Remember who defines intelligence.</b> Sternberg: it is a product of the culture in which it exists.</span></li></ul>'+
   '<div class="fb"><b>Reflect</b>How might Galatians 3:28 shape the way you honor each person you interview?</div>'+
   '<div class="row" style="margin-top:auto"><button class="btn ghost" id="again">Dive again</button></div>';
  card.querySelector('#again').onclick=function(){tried={};firstTry=0;intro()};fit();
}
intro();
</script>
<script>
/* Keeps everything inside the iframe so only the Canvas page scrolls (no double scroll bar). */
(function(){
  var STEPS=[1,.95,.9,.85,.8,.75,.7,.66];
  var root=document.documentElement;
  function over(){
    var app=document.querySelector('.app'); if(!app) return false;
    var H=window.innerHeight,W=window.innerWidth;
    if(app.scrollHeight>app.clientHeight+1||app.scrollWidth>app.clientWidth+1) return true;
    var all=app.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var el=all[i],tag=el.tagName.toLowerCase();
      if(el.closest('svg')&&tag!=='svg') continue;
      var cs=getComputedStyle(el);
      if(cs.display==='none'||cs.display==='inline'||cs.position==='absolute'&&el.classList.contains('sr')) continue;
      var r=el.getBoundingClientRect(); if(!r.width&&!r.height) continue;
      if(r.bottom>H+1||r.right>W+1||r.left<-1) return true;
      if(tag!=='svg'&&el.clientHeight&&el.scrollHeight>el.clientHeight+1) return true;
      if(tag!=='svg'&&el.clientWidth&&el.scrollWidth>el.clientWidth+1) return true;
    }
    return false;
  }
  window.fit=function(){
    for(var i=0;i<STEPS.length;i++){root.style.setProperty('--s',STEPS[i]); if(!over()) return;}
  };
  var t; function later(){clearTimeout(t);t=setTimeout(window.fit,60)}
  window.addEventListener('resize',later);
  window.addEventListener('load',function(){window.fit();later()});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(window.fit);
})();

</script>
</body>
</html>
