<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORGS 520 Week 1: Course introduction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1e2230; --ink2:#4a5063; --line:#d9dce3; --wash:#f3f4f7; --paper:#ffffff;
  --brand:#d34147; --brand-d:#a8353a; --brand-t:#fbe9ea;
  --teal:#1f7a80; --teal-t:#e1f1f2; --plum:#5b4b8a; --plum-t:#ece8f6;
  --gold:#d9980f; --gold-t:#fcf1d6; --sky:#2f6fb3; --sky-t:#e2eef9;
  --good:#1d7a4d; --good-t:#e1f3e9; --bad:#b3341f; --bad-t:#fdeae6;
  --accent:var(--teal); --accent-t:var(--teal-t);
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.45}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:var(--ink);color:#fff}
.top h1{margin:0;font:700 19px/1.15 var(--head);letter-spacing:.1px}
.top .course{font-size:12.5px;color:#c9cde0;margin-top:2px}
.wk{flex:none;background:var(--brand);color:#fff;font:700 14px var(--head);padding:6px 13px;border-radius:999px}
.stage{display:grid;grid-template-columns:minmax(260px,43%) minmax(0,1fr);min-height:0}
.art{background:var(--accent-t);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;border-right:1px solid var(--line)}
.art{justify-content:center}
.art svg{width:100%;height:auto;min-height:0;flex:0 1 auto;max-height:100%}
.work{padding:14px 20px 14px;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);flex:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:7px 12px;font:700 14px var(--head);color:var(--ink2);cursor:pointer;border-radius:6px 6px 0 0}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brand)}
.tab:hover{background:var(--wash)}
.pane{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.pane[hidden]{display:none}
h2{margin:0;font:700 18px/1.2 var(--head)}
p{margin:0}
.lede{color:var(--ink2);font-size:14.5px}
.btn{appearance:none;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:700 14.5px var(--head);padding:9px 14px;border-radius:8px;cursor:pointer;text-align:left;transition:transform .12s,background .12s}
.btn:hover:not(:disabled){background:var(--wash)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;text-align:center}
.btn.primary:hover:not(:disabled){background:var(--brand-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:var(--line);color:var(--ink2)}
.btn.good{background:var(--good-t);border-color:var(--good)}
.btn.bad{background:var(--bad-t);border-color:var(--bad)}
.btn small{display:block;font:400 13px var(--body);color:var(--ink2);margin-top:2px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.fb{border-left:5px solid var(--line);background:var(--wash);padding:9px 12px;border-radius:0 8px 8px 0;font-size:14px}
.fb.good{border-color:var(--good);background:var(--good-t)}
.fb.bad{border-color:var(--bad);background:var(--bad-t)}
.fb.info{border-color:var(--accent);background:var(--accent-t)}
.fb b{font-family:var(--head)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
.meter .bar{height:10px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.cur{outline:2px solid var(--ink);outline-offset:1px}
.card{border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper)}
.quote{font:600 17px/1.35 var(--head)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  html,body{overflow:auto;height:auto}
  .app{height:auto;display:block;border-radius:0;border-left:0;border-right:0}
  .stage{display:block}
  .art{border-right:0;border-bottom:1px solid var(--line)}
  .art svg{max-height:230px}
  .top h1{font-size:16px}
}

.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.role{text-align:center;padding:10px 6px}
.role svg{display:block;margin:0 auto 4px}
.role[aria-pressed=true]{background:var(--wash);box-shadow:inset 0 -4px 0 var(--rc);border-color:var(--rc)}
.det h2{display:flex;align-items:center;gap:8px}
.det .wk2{font:700 13px var(--head);color:#fff;border-radius:999px;padding:2px 10px}
.det ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.wks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.wks .btn{padding:7px 0;text-align:center;font-size:14px}
.wks .btn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 12.5px var(--head);background:var(--brand-t);color:var(--brand-d);border-radius:999px;padding:3px 10px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:14px;align-items:baseline}
.kv b{font-family:var(--head)}
.skl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.skl .nm{font-size:15px;font-weight:700;font-family:var(--head);line-height:1.25}
.seg{display:flex}
.seg .btn{border-radius:0;padding:6px 10px;font-size:13px;border-width:2px;margin-left:-2px;text-align:center}
.seg .btn:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg .btn:last-child{border-radius:0 8px 8px 0}
.seg .btn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink);position:relative}
.st{cursor:pointer}
.st:focus-visible circle.sc{stroke:#1e2230;stroke-width:4}
.st .all{transition:opacity .3s}
</style>
</head>
<body>
<div class="app" style="--accent:var(--brand);--accent-t:var(--brand-t)">
  <header class="top">
    <div><h1>Welcome to Diversity and Cultural Dynamics</h1><div class="course">ORGS 520 Diversity and Cultural Dynamics</div></div>
    <span class="wk">Week 1</span>
  </header>
  <main class="stage">
<section class="art" aria-label="Course roadmap">
      <svg id="map" viewBox="0 0 400 640" role="img" aria-labelledby="mT"><title id="mT">A vertical roadmap of the eight-week course. Week 1 is the foundation, weeks 2 and 3 describe, weeks 4 and 5 diagnose, weeks 6 and 7 prescribe, and week 8 is reflection. Stars mark weeks when a part of the Reframing Diversity assignment is due.</title></svg>
    </section>
    <section class="work">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="t1" aria-selected="true">1 Your role</button>
        <button class="tab" role="tab" id="t2" aria-selected="false">2 Course map</button>
        <button class="tab" role="tab" id="t3" aria-selected="false">3 Your skills</button>
      </div>
      <div class="pane" id="p1" role="tabpanel" aria-labelledby="t1"></div>
      <div class="pane" id="p2" role="tabpanel" aria-labelledby="t2" hidden></div>
      <div class="pane" id="p3" role="tabpanel" aria-labelledby="t3" hidden></div>
    </section>
  </main>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const F='font-family="Bricolage Grotesque,Trebuchet MS,sans-serif"', B='font-family="Atkinson Hyperlegible,Segoe UI,sans-serif"';
const BAND=[{k:'Foundation',c:'#1f7a80',w:[1,1]},{k:'Describe',c:'#2f6fb3',w:[2,3]},{k:'Diagnose',c:'#d9980f',w:[4,5]},{k:'Prescribe',c:'#d34147',w:[6,7]},{k:'Reflect',c:'#5b4b8a',w:[8,8]}];
const bandOf=w=>BAND.find(b=>w>=b.w[0]&&w<=b.w[1]);
const WK=[
 {t:'Leading in a Diverse and Inclusive Organization',s:'Foundations',d:'Clarify what diversity and inclusion mean, see how leaders shape culture, and start planning your executive interview.',due:'Discussion 1: Interview Preparation',star:false,sk:[0]},
 {t:'Preparing for the Executive Interview',s:'Interview prep',d:'Finalize your interview protocol, plan respectful access to your executive, and write five to seven research-informed questions.',due:'Part 1: Company and Executive',star:true,sk:[0]},
 {t:'Cultural Intelligence and Diversity Paradigms',s:'Cultural intelligence',d:'Build cultural intelligence, learn three paradigms for managing diversity, and connect organizational data to research.',due:'Part 2: Data and Research',star:true,sk:[1]},
 {t:'Gap Analysis',s:'Gap analysis',d:'Compare an organization’s goals with its current performance, size the gap, and diagnose why it exists.',due:'Part 3: Interview an Executive',star:true,sk:[2]},
 {t:'Implicit Bias in Organizations',s:'Implicit bias',d:'Examine implicit bias, take the Implicit Association Test, and reflect on how bias can shape decisions at work.',due:'Part 4: Gap Analysis',star:true,sk:[3,2]},
 {t:'Building the Organizational Change Plan',s:'Change plan',d:'Bring your interview, research, gap analysis, and bias findings together in an executive summary of your action plan.',due:'Part 5: Summary of the Action Plan',star:true,sk:[4]},
 {t:'Presenting the Plan',s:'Presenting',d:'Turn your plan into a narrated presentation for an executive audience, designed so everyone can use it.',due:'Part 6: Present the Plan',star:true,sk:[4]},
 {t:'Reflection and Looking Ahead',s:'Reflection',d:'Look back on what you learned, define diversity and inclusion in your own words, and consider whether there is a moral imperative.',due:'Discussion 8: Analyze Your Learning',star:false,sk:[0,1,2,3,4]},
];
const SK=[
 {n:'Design an interview about diversity procedures and protocols',s:'Design an interview',w:[1,2]},
 {n:'Apply cultural intelligence to build rapport and communicate across differences',s:'Apply cultural intelligence',w:[3]},
 {n:'Use interview and archival data to conduct a gap analysis of an organization',s:'Conduct a gap analysis',w:[4,5]},
 {n:'Recognize how implicit bias can shape perspectives on diversity and inclusion',s:'Recognize implicit bias',w:[5]},
 {n:'Develop and present a strategic plan to an executive audience',s:'Present a strategic plan',w:[6,7]},
];
const ROLES=[
 {k:'Describe',c:'#2f6fb3',w:[2,3],txt:'Learn how the organization works today. You choose an executive, gather organizational data, and ground your picture in research.',parts:['Part 1: Company and Executive','Part 2: Data and Research'],
  ic:'<circle cx="-3" cy="-3" r="9" fill="none" stroke="#fff" stroke-width="3"/><path d="M4 4 L11 11" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>'},
 {k:'Diagnose',c:'#d9980f',w:[4,5],txt:'Find out what is really going on. You interview your executive, then compare goals with current performance to locate the gap and its cause.',parts:['Part 3: Interview an Executive','Part 4: Gap Analysis'],
  ic:'<path d="M-11 6 H-5 L-2 -9 L3 11 L6 6 H11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'},
 {k:'Prescribe',c:'#d34147',w:[6,7],txt:'Recommend what to do about it. You set goals and metrics in an executive summary, then present your plan to an executive audience.',parts:['Part 5: Summary of the Action Plan','Part 6: Present the Plan'],
  ic:'<path d="M-6 -11 H6 V11 H-6Z M-2 -4 H3 M-2 1 H3 M-2 6 H1" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>'},
];
let hi=null, selWk=null, role=null; const conf=[null,null,null,null,null]; let started=false;
const Y=i=>52+i*77;
function map(){
  let o='<rect x="4" y="4" width="392" height="632" rx="16" fill="#fff" opacity=".6"/>';
  o+=`<line x1="190" y1="${Y(0)}" x2="190" y2="${Y(7)}" stroke="#c9ccd6" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 13"/>`;
  BAND.forEach(b=>{
    const y1=Y(b.w[0]-1)-30,y2=Y(b.w[1]-1)+30, dim=hi&&!(b.w[0]<=Math.max(...hi)&&b.w[1]>=Math.min(...hi)&&hi.some(w=>w>=b.w[0]&&w<=b.w[1]));
    o+=`<g opacity="${dim?.3:1}"><rect x="30" y="${y1}" width="14" height="${y2-y1}" rx="7" fill="${b.c}"/>
    <text transform="translate(26 ${(y1+y2)/2}) rotate(-90)" text-anchor="middle" ${F} font-weight="700" font-size="14" fill="${b.c==='#d9980f'?'#8a5d00':b.c}">${b.k}</text></g>`;
  });
  WK.forEach((w,i)=>{
    const n=i+1,y=Y(i),b=bandOf(n),on=!hi||hi.includes(n),sel=selWk===n;
    o+=`<g class="st" tabindex="0" role="button" aria-label="Week ${n}: ${w.s}" data-w="${n}" opacity="${on?1:.3}">
      ${sel?`<circle cx="190" cy="${y}" r="35" fill="none" stroke="#1e2230" stroke-width="2.5" stroke-dasharray="4 4"/>`:''}
      <circle class="sc" cx="190" cy="${y}" r="27" fill="${b.c}" stroke="#fff" stroke-width="4"/>
      <text x="190" y="${y+8}" text-anchor="middle" ${F} font-weight="700" font-size="22" fill="#fff">${n}</text>
      ${w.star?`<path transform="translate(${190+22} ${y-22})" d="M0 -12 L3.5 -4 L12 -3 L6 3 L7.5 12 L0 8 L-7.5 12 L-6 3 L-12 -3 L-3.5 -4Z" fill="#f2c230" stroke="#1e2230" stroke-width="1.6" stroke-linejoin="round"/>`:''}
      <text x="236" y="${y-3}" ${F} font-weight="700" font-size="17" fill="#1e2230">${w.s.split(' ')[0]}</text>
      <text x="236" y="${y+17}" ${F} font-weight="700" font-size="17" fill="#1e2230">${w.s.split(' ').slice(1).join(' ')}</text></g>`;
  });
  o+=`<g ${B} font-size="12.5" fill="#4a5063"><path transform="translate(222 616) scale(.55)" d="M0 -12 L3.5 -4 L12 -3 L6 3 L7.5 12 L0 8 L-7.5 12 L-6 3 L-12 -3 L-3.5 -4Z" fill="#f2c230" stroke="#1e2230" stroke-width="2.4" stroke-linejoin="round"/><text x="232" y="620">Assignment part due</text></g>`;
  $('#map').innerHTML=o;
  $$('.st').forEach(g=>{const go=()=>{selWk=+g.dataset.w;hi=null;tab(2)};g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
}
// ---- Tab 1 ----
function p1(){
  const r=role!=null?ROLES[role]:null;
  $('#p1').innerHTML=`<h2>Welcome to ORGS 520. You are the consultant.</h2>
   <p class="lede">You will develop skills for leading in a diverse global setting. Through the multi-part assignment <b>Reframing Diversity</b>, you take the role of a diversity consultant hired to <b>describe, diagnose, and prescribe</b> a strategic plan for a diversity-related issue in an organization.</p>
   <div class="roles" role="group" aria-label="Choose a part of your role">${ROLES.map((x,i)=>`<button class="btn role" style="--rc:${x.c}" data-i="${i}" aria-pressed="${role===i}"><svg width="44" height="44" viewBox="-22 -22 44 44" aria-hidden="true"><circle r="21" fill="${x.c}"/>${x.ic}</svg>${x.k}</button>`).join('')}</div>
   <div class="card det" id="det" aria-live="polite">${r?`<h2>${r.k}<span class="wk2" style="background:${r.c}">Weeks ${r.w[0]} and ${r.w[1]}</span></h2><p style="margin-top:4px">${r.txt}</p><ul>${r.parts.map(p=>`<li>${p}</li>`).join('')}</ul>`:`<p class="lede">Select describe, diagnose, or prescribe to see what each part of your role involves and when it happens.</p>`}</div>
   <p class="hint" style="font-size:13px;color:var(--ink2)">Week 1 builds the foundation and Week 8 is for reflection.</p>
   <div class="row"><span class="spacer"></span><button class="btn primary" id="n1">${r?'See the week-by-week map':'Skip to the course map'}</button></div>`;
  $$('.role').forEach(b=>b.onclick=()=>{role=+b.dataset.i;hi=ROLES[role].w.slice();selWk=null;map();p1();$$('.role')[role].focus()});
  $('#n1').onclick=()=>{hi=null;tab(2)};
}
// ---- Tab 2 ----
function p2(){
  const w=selWk?WK[selWk-1]:null, b=selWk?bandOf(selWk):null;
  $('#p2').innerHTML=`<p class="lede">Select a week on the map or below to see what you will do and what is due.</p>
   <div class="wks" role="group" aria-label="Weeks">${WK.map((x,i)=>`<button class="btn" data-w="${i+1}" aria-pressed="${selWk===i+1}" aria-label="Week ${i+1}">${i+1}</button>`).join('')}</div>
   <div class="card det" aria-live="polite" style="display:grid;gap:8px">${w?`
     <h2><span class="wk2" style="background:${b.c}">Week ${selWk}</span>${w.t}</h2>
     <p>${w.d}</p>
     <div class="kv"><b>Due</b><span>${w.star?'★ ':''}${w.due}</span></div>
     <div class="kv"><b>You build</b><span class="chips">${w.sk.length===5?'<span class="chip">All five course skills</span>':w.sk.map(i=>`<span class="chip">${SK[i].s}</span>`).join('')}</span></div>`:`<p class="lede">No week selected yet. Start with Week 1.</p>`}</div>
   <div class="row"><button class="btn ghost" id="pv" ${!selWk||selWk===1?'disabled':''}>Previous week</button><span class="spacer"></span>${selWk===8?'<button class="btn primary" id="go3">Rate your skills</button>':`<button class="btn primary" id="nx">${selWk?'Next week':'Start with Week 1'}</button>`}</div>`;
  $$('.wks .btn').forEach(b=>b.onclick=()=>{selWk=+b.dataset.w;map();p2();$$('.wks .btn')[selWk-1].focus()});
  const nx=$('#nx'); if(nx)nx.onclick=()=>{selWk=(selWk||0)+1;map();p2();$('#nx')&&$('#nx').focus()};
  const pv=$('#pv'); pv.onclick=()=>{selWk--;map();p2()};
  const g=$('#go3'); if(g)g.onclick=()=>{selWk=null;tab(3)};
}
// ---- Tab 3 ----
const LV=['New to me','Some','Strong'];
function p3(){
  const rated=conf.filter(c=>c!=null).length;
  const focus=SK.map((s,i)=>({s,i,c:conf[i]})).filter(x=>x.c===0||x.c===1);
  let res;
  if(rated<5) res=`<div class="fb info">Rate all five skills to see your focus plan. ${rated} of 5 rated.</div>`;
  else if(!focus.length) res=`<div class="fb good"><b>You are starting strong.</b> Use each assignment to go deeper, and look for ways to coach classmates in the discussions.</div>`;
  else res=`<div class="fb good"><b>Your focus plan.</b> Give extra time to ${focus.sort((a,b)=>a.c-b.c).map(x=>`<b>${x.s.s.toLowerCase()}</b> (week${x.s.w.length>1?'s':''} ${x.s.w.join(' and ')})`).join(', ').replace(/, ([^,]*)$/,', and $1')}. The weeks are highlighted on the map.</div>`;
  $('#p3').innerHTML=`<p class="lede">You will gain five skills in this course. How comfortable are you with each one today? There are no wrong answers.</p>
   <div>${SK.map((s,i)=>`<div class="skl"><span class="nm" title="${s.n}">${s.s}</span><span class="seg" role="group" aria-label="${s.s}">${LV.map((l,j)=>`<button class="btn" data-i="${i}" data-j="${j}" aria-pressed="${conf[i]===j}">${l}</button>`).join('')}</span></div>`).join('')}</div>
   ${res}`;
  $$('.seg .btn').forEach(b=>b.onclick=()=>{conf[+b.dataset.i]=+b.dataset.j;
    const f=conf.map((c,i)=>c===0||c===1?i:-1).filter(i=>i>=0); hi=conf.filter(c=>c!=null).length===5&&f.length?[...new Set(f.flatMap(i=>SK[i].w))]:null;
    map();p3();$$('.seg .btn')[+b.dataset.i*3+ +b.dataset.j].focus()});
}
function tab(n){
  [1,2,3].forEach(i=>{$('#t'+i).setAttribute('aria-selected',i===n);$('#p'+i).hidden=i!==n});
  if(n!==3&&n!==1)hi=null; if(n===3){selWk=null; const f=conf.map((c,i)=>c===0||c===1?i:-1).filter(i=>i>=0); hi=conf.filter(c=>c!=null).length===5&&f.length?[...new Set(f.flatMap(i=>SK[i].w))]:null}
  if(n===1)hi=role!=null?ROLES[role].w.slice():null;
  map(); [p1,p2,p3][n-1]();
}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);$('#t3').onclick=()=>tab(3);
tab(1);
</script>
</body>
</html>
